steps:
  - kind: explain
    title: Two words you will hear all the time
    body: |
      A **data structure** is a way of *storing* data so some jobs become easy. A shelf sorted by title, a stack of plates and a phone book are all data structures.

      An **algorithm** is a step-by-step *method* for solving a problem. "Look at every book and remember the heaviest" is an algorithm.

      They work as a pair: the structure you choose decides which algorithms are fast. In this course you will learn both, in JavaScript, and every lesson lets you run real code.

      **How this course works.** In each "Try it" step, write code on the right and press **Run**. When a step has hidden tests, Run also checks your answer. A wrong answer tells you the first test that failed.

      **Example.** A structure (an array of book weights) and an algorithm (look at every one, remember the heaviest):

      ```js
      const weights = [320, 540, 210, 480];   // the data structure: an array

      let heaviest = weights[0];               // the algorithm: check each one
      for (const w of weights) {
        if (w > heaviest) heaviest = w;
      }
      console.log(heaviest);
      ```

      prints:

      ```
      540
      ```

  - kind: code
    title: "Try it: your first run"
    body: |
      Press **Run** and compare with the output above. Then add a heavier book, like `900`, to the array and run again.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    code: |
      const weights = [320, 540, 210, 480];

      let heaviest = weights[0];
      for (const w of weights) {
        if (w > heaviest) heaviest = w;
      }
      console.log(heaviest);

  - kind: explain
    title: The JavaScript you need for this course
    body: |
      This course is about **thinking**, and it uses JavaScript to write the thinking down. It assumes you have written a little code before, in any language. If you did the Python course, the next three short pages are everything that changes. Don't try to memorize them: come back here whenever a piece of syntax looks new.

      **The basic pieces**

      | Idea | Python | JavaScript |
      |---|---|---|
      | A variable | `total = 0` | `let total = 0;` |
      | A variable that never changes | `TAX = 0.2` | `const TAX = 0.2;` |
      | A function | `def add(a, b):` | `function add(a, b) { … }` |
      | Give back an answer | `return a + b` | `return a + b;` |
      | Print | `print(x)` | `console.log(x);` |
      | A block | indentation | `{ curly braces }` |

      The big visual change: Python uses **indentation** to show what belongs together, JavaScript uses **curly braces** `{ }`. Lines end with a semicolon `;`.

      ```js
      function add(a, b) {
        return a + b;
      }
      console.log(add(2, 3));
      ```

      prints:

      ```
      5
      ```

      <!-- page -->

      **Decisions and loops**

      | Idea | Python | JavaScript |
      |---|---|---|
      | If | `if x > 0:` / `elif` / `else:` | `if (x > 0) { … } else if (…) { … } else { … }` |
      | Loop over items | `for n in nums:` | `for (const n of nums) { … }` |
      | Loop with a counter | `for i in range(len(nums)):` | `for (let i = 0; i < nums.length; i++) { … }` |
      | Loop while something is true | `while n > 1:` | `while (n > 1) { … }` |

      The counter loop has three parts inside the brackets, separated by `;`: **start** (`let i = 0`), **keep going while** (`i < nums.length`), and **after each round** (`i++`, which means "add 1 to `i`"). `i--` means "take 1 away".

      ```js
      for (let i = 0; i < 3; i++) {
        console.log(i);
      }
      ```

      prints:

      ```
      0
      1
      2
      ```

      And here are `for...of`, `if` and `else` working together on a short list of prices:

      ```js
      const prices = [4, 7, 10];
      for (const p of prices) {
        if (p > 5) {
          console.log(p, "is over 5");
        } else {
          console.log(p, "is 5 or less");
        }
      }
      ```

      prints (`console.log` with several values prints them on one line, with spaces between):

      ```
      4 is 5 or less
      7 is over 5
      10 is over 5
      ```

      <!-- page -->

      **Arrays, comparisons and "nothing"**

      | Idea | Python | JavaScript |
      |---|---|---|
      | List / array | `[1, 2, 3]`, `len(nums)`, `nums.append(4)` | `[1, 2, 3]`, `nums.length`, `nums.push(4)` |
      | Equal / not equal | `==` / `!=` | `===` / `!==` (always the three-character ones) |
      | And / or / not | `and` / `or` / `not` | `&&` / `\|\|` / `!` |
      | Nothing | `None` | `null` (or `undefined`) |
      | Dictionary | `{"a": 1}` | `new Map()` (Module 4 explains why, not `{}`) |

      `nums[i]` reads the item at position `i`, and positions start at **0**:

      ```js
      const nums = [3, 8, 5];
      console.log(nums[0], nums[2], nums.length);
      nums.push(4);
      console.log(nums);
      console.log(5 === 5, 5 !== 5);
      console.log(7 > 3 && 2 > 9, 7 > 3 || 2 > 9);
      ```

      prints:

      ```
      3 5 3
      [ 3, 8, 5, 4 ]
      true false
      false true
      ```

      Two more pieces you will use all the time: `total += 5` is short for `total = total + 5`, and `%` gives the **remainder** after dividing (`7 % 2` is `1`, so 7 is odd; `8 % 2` is `0`, so 8 is even).

      ```js
      let total = 10;
      total += 5;
      console.log(total);
      console.log(7 % 2, 8 % 2, 9 % 3);
      ```

      prints:

      ```
      15
      1 0 0
      ```

      Here is a short function that uses most of it, so you can see the pattern:

      ```js
      function countPositives(nums) {
        let count = 0;
        for (const n of nums) {
          if (n > 0) count++;     // count++ means count = count + 1
        }
        return count;
      }
      ```

      **Never programmed before?** Do the Python course's Beginner level first (Modules 1 to 13). You'll learn what variables, loops and functions are there, and these tables are all you need to switch.

  - kind: code
    title: "Try it: JavaScript basics"
    body: |
      Press **Run** and match each printed line to the code that made it:

      1. a `for...of` loop that adds up every price with `+=`,
      2. a counter loop that shows each position `i` and the value `prices[i]`,
      3. `%` picking out the odd prices (a remainder of `1` when divided by 2).

      Then make one change: add `12` to the end of `prices` and run again. Every part updates by itself. Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    code: |
      const prices = [4, 7, 10, 3];

      // 1. A for...of loop: add up every price
      let total = 0;
      for (const p of prices) {
        total += p;
      }
      console.log("total:", total);

      // 2. A counter loop: show each position and its value
      for (let i = 0; i < prices.length; i++) {
        console.log("position", i, "holds", prices[i]);
      }

      // 3. % gives the remainder: 0 means "divides evenly"
      for (const p of prices) {
        if (p % 2 === 1) console.log(p, "is odd");
      }

  - kind: code
    title: Warm up in JavaScript
    body: |
      Finish `sumOfEvens(nums)`: add up only the **even** numbers in the array and return the total. `sumOfEvens([1, 2, 3, 4])` is `6`. An empty array gives `0`.

      A number is even when `n % 2 === 0`. If a piece of syntax is new, look back at the tables in the previous step.
    code: |
      function sumOfEvens(nums) {
        let total = 0;
        // loop over nums and add the even ones
        return total;
      }
    tests:
      - "sumOfEvens([1, 2, 3, 4])"
      - "sumOfEvens([])"
      - "sumOfEvens([1, 3, 5])"
      - "sumOfEvens([-2, 7, 10])"
    solution: |
      function sumOfEvens(nums) {
        let total = 0;
        for (const n of nums) {
          if (n % 2 === 0) total += n;
        }
        return total;
      }
    hint: Which kind of loop visits each item of an array? Inside it, you only want to add `n` when one condition is true.

  - kind: code
    title: Run your first algorithm
    body: |
      This function looks at every number and remembers the biggest one. Press **Run** to see what it prints.

      `console.log(...)` prints a value so you can see it. Use it any time you want to look inside your code.
    code: |
      function largest(nums) {
        let best = nums[0];
        for (const n of nums) {
          if (n > best) best = n;
        }
        return best;
      }

      console.log(largest([3, 9, 2]));

  - kind: explain
    title: Read a problem as input, output and constraints
    body: |
      Before you write any code, read the problem and pull out three things.

      - **Input**: what you are given. Here, an array of numbers.
      - **Output**: what you must give back. Here, one number.
      - **Constraints**: limits on the input. How long can the array be? Can it be empty? Can numbers be negative?

      Constraints matter more than beginners expect. A solution that is fine for 10 numbers may take years for 10 million, and the constraints tell you which one you need.

      Most problems on sites like LeetCode also give a **function signature**, such as `function largest(nums)`. The name and the parameters are fixed. You write the body and **`return`** the answer. Printing it with `console.log` is not the same as returning it.

      **Example.** `largest` **returns** its answer, so the caller can use it. `printLargest` only prints, so what it gives back is `undefined`:

      ```js
      function largest(nums) {
        let best = nums[0];
        for (const n of nums) if (n > best) best = n;
        return best;
      }

      function printLargest(nums) {
        let best = nums[0];
        for (const n of nums) if (n > best) best = n;
        console.log(best);
      }

      const a = largest([3, 9, 2]);
      const b = printLargest([3, 9, 2]);
      console.log("a is", a, "and b is", b);
      ```

      prints:

      ```
      9
      a is 9 and b is undefined
      ```

      The `9` on the first line came from inside `printLargest`. Tests check what you **return**, so `printLargest` would fail them.

  - kind: code
    title: "Try it: return vs. print"
    body: |
      Run it and compare with the output above. Then add `return best;` at the end of `printLargest` and run again: now `b` is 9 too.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    code: |
      function largest(nums) {
        let best = nums[0];
        for (const n of nums) if (n > best) best = n;
        return best;
      }

      function printLargest(nums) {
        let best = nums[0];
        for (const n of nums) if (n > best) best = n;
        console.log(best);
      }

      const a = largest([3, 9, 2]);
      const b = printLargest([3, 9, 2]);
      console.log("a is", a, "and b is", b);

  - kind: explain
    title: Write your own examples and edge cases first
    body: |
      Problem statements come with one or two examples. Write more yourself, *before* coding, and hunt for **edge cases**: the unusual inputs where code breaks.

      | Edge case | Example for "largest number" |
      |---|---|
      | Empty input | `[]` |
      | One element | `[7]` |
      | All the same | `[4, 4, 4]` |
      | Negative numbers | `[-5, -2, -9]` |
      | Very large input | a million numbers |

      A good habit is to write your examples as `input → expected output` pairs on paper. They become your tests.

  - kind: code
    title: Fix the empty and negative cases
    body: |
      This `largest` starts with `best = 0`. That works for `[3, 9, 2]`, but two edge cases break it.

      Rewrite it so that:
      - it returns **`null`** for an empty array,
      - it works when every number is negative (`[-5, -2]` should give `-2`).
    code: |
      function largest(nums) {
        let best = 0;
        for (const n of nums) {
          if (n > best) best = n;
        }
        return best;
      }
    tests:
      - "largest([3, 9, 2])"
      - "largest([7])"
      - "largest([-5, -2, -9])"
      - "largest([])"
      - "largest([4, 4, 4])"
    solution: |
      function largest(nums) {
        if (nums.length === 0) return null;
        let best = nums[0];
        for (const n of nums) {
          if (n > best) best = n;
        }
        return best;
      }
    hint: |
      Starting at `0` pretends the answer is at least 0. Start from the first element instead, and check for an empty array first.
    reject:
      - |
        function largest(nums) {
          let best = 0;
          for (const n of nums) if (n > best) best = n;
          return best;
        }

  - kind: explain
    title: Brute force first, then optimize
    body: |
      When a problem looks hard, do not hunt for the clever answer. Ask: **what is the simplest thing that could possibly work?** That is the **brute force** solution: try everything.

      Example: *does this array contain a duplicate?* Brute force compares every pair. It is slow for big arrays, but it is easy to get right, and it gives you something to check the fast version against.

      Only after it works do you ask: **where is it wasting effort?** In Module 7 you will learn a faster way. The order is always: **make it correct, then make it fast.**

  - kind: code
    title: Brute force a duplicate check
    body: |
      Write `hasDuplicate(nums)`. It returns `true` if any value appears **twice or more**, and `false` otherwise.

      Use two loops: for each position `i`, look at every later position `j`.
    code: |
      function hasDuplicate(nums) {
        // compare every pair (i, j) with j after i
        return false;
      }
    tests:
      - "hasDuplicate([1, 2, 3, 1])"
      - "hasDuplicate([1, 2, 3, 4])"
      - "hasDuplicate([])"
      - "hasDuplicate([5])"
      - "hasDuplicate([2, 2])"
    solution: |
      function hasDuplicate(nums) {
        for (let i = 0; i < nums.length; i++) {
          for (let j = i + 1; j < nums.length; j++) {
            if (nums[i] === nums[j]) return true;
          }
        }
        return false;
      }
    hint: Start `j` at `i + 1`, so an element is never compared with itself.
    reject:
      - |
        function hasDuplicate(nums) {
          return nums.length > 1;
        }
      - |
        function hasDuplicate(nums) {
          for (let i = 0; i < nums.length; i++) {
            for (let j = 0; j < nums.length; j++) {
              if (nums[i] === nums[j]) return true;
            }
          }
          return false;
        }

  - kind: explain
    title: Pseudocode, then code
    body: |
      **Pseudocode** is a plan in plain words. It sits between the English problem and the code, and it lets you check the *idea* before fighting syntax.

      ```
      count = 0
      for each number in the list:
          if the number is even:
              count = count + 1
      return count
      ```

      If you cannot write the pseudocode, you are not ready to write the code. Keep the pseudocode as comments in your editor and fill in the code underneath.

  - kind: code
    title: Turn pseudocode into code
    body: |
      The pseudocode above is already in the editor as comments. Write `countEvens(nums)` to match it.

      Hint: `n % 2 === 0` is true when `n` is even.
    code: |
      function countEvens(nums) {
        // count = 0
        // for each number in the list:
        //     if the number is even:
        //         count = count + 1
        // return count
      }
    tests:
      - "countEvens([1, 2, 3, 4, 6])"
      - "countEvens([])"
      - "countEvens([1, 3, 5])"
      - "countEvens([0])"
      - "countEvens([-2, -4])"
    solution: |
      function countEvens(nums) {
        let count = 0;
        for (const n of nums) {
          if (n % 2 === 0) count++;
        }
        return count;
      }
    reject:
      - |
        function countEvens(nums) {
          return nums.length;
        }

  - kind: explain
    title: Dry-run your code by hand
    body: |
      Before you trust code, run it in your head (or on paper). Make a table with one row per step and one column per variable.

      For `sumTo(3)` that adds `1 + 2 + 3`, with `total` starting at 0:

      | i | total before | total after |
      |---|---|---|
      | 1 | 0 | 1 |
      | 2 | 1 | 3 |
      | 3 | 3 | 6 |

      Dry-running finds the bugs that "it looks right" misses, especially **off-by-one errors**: loops that run one time too many or too few.

  - kind: code
    title: "Find the bug: dry-run it"
    body: |
      `sumTo(n)` should return `1 + 2 + … + n`, so `sumTo(5)` is `15`. This version returns something else. Dry-run it for `n = 3`, find the off-by-one bug and fix it.
    code: |
      function sumTo(n) {
        let total = 0;
        for (let i = 1; i < n; i++) {
          total += i;
        }
        return total;
      }
    tests:
      - "sumTo(5)"
      - "sumTo(1)"
      - "sumTo(0)"
      - "sumTo(100)"
    solution: |
      function sumTo(n) {
        let total = 0;
        for (let i = 1; i <= n; i++) {
          total += i;
        }
        return total;
      }
    hint: For `n = 3` the loop runs for `i = 1, 2` and stops. Which value of `i` never gets added?
    broken_starter: true
    reject:
      - |
        function sumTo(n) {
          let total = 0;
          for (let i = 1; i < n; i++) total += i;
          return total;
        }

  - kind: explain
    title: Reading a LeetCode-style problem
    body: |
      A typical statement looks like this:

      > Given an array `nums`, return the **index** of the first negative number, or `-1` if there is none.
      >
      > Constraints: `0 <= nums.length <= 10^5`, `-10^9 <= nums[i] <= 10^9`.

      Read it slowly:

      1. **Signature**: `firstNegative(nums)`, one array in.
      2. **Output**: an *index*, not the number itself. `-1` is the "not found" answer.
      3. **Constraints**: the array can be empty, and `10^5` items means one loop is fine, but a loop inside a loop (10^10 steps) is not.

      Most wrong answers on these sites come from misreading the output, not from weak coding.

  - kind: code
    title: Read the signature, return the right thing
    body: |
      Write `firstNegative(nums)`: return the **index** of the first negative number, or `-1` if there is none.
    code: |
      function firstNegative(nums) {
        return -1;
      }
    tests:
      - "firstNegative([3, 5, -2, 8, -1])"
      - "firstNegative([-7])"
      - "firstNegative([1, 2, 3])"
      - "firstNegative([])"
      - "firstNegative([0, 0, -1])"
    solution: |
      function firstNegative(nums) {
        for (let i = 0; i < nums.length; i++) {
          if (nums[i] < 0) return i;
        }
        return -1;
      }
    reject:
      - |
        function firstNegative(nums) {
          for (const n of nums) if (n < 0) return n;
          return -1;
        }

  - kind: why
    body: |
      Strong problem solvers are not faster typists. They spend the first minutes *understanding*: the input, the output, the limits and a few edge cases. Then they write the simplest correct solution and only then make it faster.

      That habit is the difference between "I stared at it for an hour" and "I had a working answer in ten minutes." Everything in this course builds on it.

  - kind: recap
    body: |
      - A **data structure** stores data; an **algorithm** is a method. Good ones are chosen together.
      - Read every problem as **input → output → constraints**, and note the function signature.
      - Write your own **examples and edge cases** (empty, one item, duplicates, negatives, huge) *before* coding.
      - **Brute force first**, make it correct, then optimize.
      - Sketch **pseudocode**, then **dry-run** the code by hand to catch off-by-one errors.
      - `return` gives the answer back; `console.log` only prints.
