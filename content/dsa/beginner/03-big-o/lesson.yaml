steps:
  - kind: explain
    title: How do we compare two solutions?
    body: |
      "It ran in 40 ms on my laptop" is not a good answer. Another computer, another input or another day changes the number.

      Instead we ask: **as the input gets bigger, how does the amount of work grow?** We count *steps*, not seconds, and we express the answer with the input size `n`.

      This is **Big-O notation**. It has two flavours:

      - **Time complexity**: how many steps the code takes.
      - **Space complexity**: how much extra memory the code uses.

      **Example.** Two ways to add up 1 to n. Instead of timing them, count the steps:

      ```js
      function sumLoop(n) {
        let steps = 0, total = 0;
        for (let i = 1; i <= n; i++) { total += i; steps++; }
        return steps;
      }

      function sumFormula(n) {
        const total = (n * (n + 1)) / 2;   // one calculation, whatever n is
        return 1;
      }

      for (const n of [10, 1000, 100000]) {
        console.log("n =", n, "loop:", sumLoop(n), "steps,",
                    "formula:", sumFormula(n), "step");
      }
      ```

      prints:

      ```
      n = 10 loop: 10 steps, formula: 1 step
      n = 1000 loop: 1000 steps, formula: 1 step
      n = 100000 loop: 100000 steps, formula: 1 step
      ```

      The loop's work grows with `n`: O(n). The formula's stays the same: O(1).

  - kind: code
    title: "Try it: loop vs. formula"
    body: |
      Run it and compare with the output above. Then add `1000000` to the list of sizes.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    code: |
      function sumLoop(n) {
        let steps = 0, total = 0;
        for (let i = 1; i <= n; i++) { total += i; steps++; }
        return steps;
      }

      function sumFormula(n) {
        const total = (n * (n + 1)) / 2;
        return 1;
      }

      for (const n of [10, 1000, 100000]) {
        console.log("n =", n, "loop:", sumLoop(n), "steps,",
                    "formula:", sumFormula(n), "step");
      }

  - kind: explain
    title: The common classes
    body: |
      From best to worst:

      | Class | Name | Example | Work when n = 1 000 |
      |---|---|---|---|
      | O(1) | constant | read `arr[5]` | 1 |
      | O(log n) | logarithmic | binary search | 10 |
      | O(n) | linear | one loop over the array | 1 000 |
      | O(n log n) | linearithmic | a good sort | 10 000 |
      | O(n²) | quadratic | a loop inside a loop | 1 000 000 |
      | O(2ⁿ) | exponential | try every subset | astronomically large |
      | O(n!) | factorial | try every ordering | even larger |

      The first four are usually fine. O(n²) is fine for small inputs only. The last two only work for tiny `n`.

      **Example.** The same table, worked out by code for three sizes (rounded):

      ```js
      for (const n of [10, 100, 1000]) {
        const log = Math.round(Math.log2(n));
        console.log(`n=${n}: log n=${log}, n=${n},`,
                    `n log n=${n * log}, n²=${n * n}`);
      }
      ```

      prints:

      ```
      n=10: log n=3, n=10, n log n=30, n²=100
      n=100: log n=7, n=100, n log n=700, n²=10000
      n=1000: log n=10, n=1000, n log n=10000, n²=1000000
      ```

      Each time `n` grows ten times, `n²` grows a hundred times. That is why O(n²) stops being fine as inputs grow.

  - kind: code
    title: "Try it: watch the classes grow"
    body: |
      Run it, then add `1000000` to the sizes and look at the last column.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    code: |
      for (const n of [10, 100, 1000]) {
        const log = Math.round(Math.log2(n));
        console.log(`n=${n}: log n=${log}, n=${n},`,
                    `n log n=${n * log}, n²=${n * n}`);
      }

  - kind: explain
    title: Counting work in loops
    body: |
      **One loop over `n` items** → n steps → **O(n)**.

      **Two loops, one after the other** → n + n = 2n steps → still **O(n)**.

      **A loop inside a loop**, both over `n` → n × n steps → **O(n²)**.

      **A loop that halves** (`while (n > 1) n = n / 2`) → log₂ n steps → **O(log n)**.

      You can make the computer count for you. Add 1 to a counter on the line that does the work, then print it. A loop inside a loop with `n = 4`:

      ```js
      const n = 4;
      let steps = 0;
      for (let i = 0; i < n; i++) {
        for (let j = 0; j < n; j++) {
          steps++;
        }
      }
      console.log(steps);
      ```

      prints:

      ```
      16
      ```

      That is 4 × 4, so n².

      **Drop constants and small terms.** `3n + 10` is O(n). `n² + n` is O(n²). We only care about the part that dominates when `n` gets large.

  - kind: code
    title: "Try it: count the steps"
    body: |
      Each loop shape from "Counting work in loops" gets its own counter here, all with `n = 8`. Run it and check each count: 8, then 8 + 8, then 8 × 8, then the number of halvings from 8 down to 1.

      The last part shows a trick the next step needs: a function can hand back **two answers at once** by returning them inside an array.

      Now change `n` to `16` and run again. Which count grew the most? Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    code: |
      const n = 8;

      // One loop over n items
      let one = 0;
      for (let i = 0; i < n; i++) one++;
      console.log("one loop:", one);

      // Two loops, one after the other
      let twoInRow = 0;
      for (let i = 0; i < n; i++) twoInRow++;
      for (let i = 0; i < n; i++) twoInRow++;
      console.log("two loops in a row:", twoInRow);

      // A loop inside a loop
      let nested = 0;
      for (let i = 0; i < n; i++) {
        for (let j = 0; j < n; j++) nested++;
      }
      console.log("loop inside a loop:", nested);

      // A loop that halves
      let halving = 0;
      for (let k = n; k > 1; k = Math.floor(k / 2)) halving++;
      console.log("halving loop:", halving);

      // A function can hand back two answers at once inside an array
      function firstAndLast(nums) {
        return [nums[0], nums[nums.length - 1]];
      }
      console.log(firstAndLast([4, 9, 2]));

  - kind: code
    title: Instrument a loop
    body: |
      The best way to *believe* a count is to make the computer do it. Write `sumWithCount(nums)` that returns a two-item array `[total, steps]`, where `steps` counts how many numbers you added.

      For `[1, 2, 3]` the answer is `[6, 3]`. For an array of `n` numbers, `steps` is always `n`, so the work is O(n).
    code: |
      function sumWithCount(nums) {
        let total = 0;
        let steps = 0;
        return [total, steps];
      }
    tests:
      - "sumWithCount([1, 2, 3])"
      - "sumWithCount([])"
      - "sumWithCount([10])"
      - "sumWithCount([5, 5, 5, 5, 5])"
    solution: |
      function sumWithCount(nums) {
        let total = 0;
        let steps = 0;
        for (const n of nums) {
          total += n;
          steps++;
        }
        return [total, steps];
      }
    reject:
      - |
        function sumWithCount(nums) {
          return [nums.reduce((a, b) => a + b, 0), 1];
        }

  - kind: code
    title: Count a nested loop
    body: |
      Write `nestedSteps(n)`. It must run this loop pair and return how many times the inner line ran:

      ```js
      for (let i = 0; i < n; i++) {
        for (let j = 0; j < i; j++) {
          // count this line
        }
      }
      ```

      The inner loop runs `0, 1, 2, …, n - 1` times. That is the sum from Module 2, so the total is close to n²/2, which is still **O(n²)**.
    code: |
      function nestedSteps(n) {
        let steps = 0;
        return steps;
      }
    tests:
      - "nestedSteps(4)"
      - "nestedSteps(1)"
      - "nestedSteps(0)"
      - "nestedSteps(10)"
      - "nestedSteps(100)"
    solution: |
      function nestedSteps(n) {
        let steps = 0;
        for (let i = 0; i < n; i++) {
          for (let j = 0; j < i; j++) {
            steps++;
          }
        }
        return steps;
      }
    hint: Write the two loops exactly as shown and add `1` to `steps` inside the inner one.
    reject:
      - |
        function nestedSteps(n) {
          return n * n;
        }

  - kind: explain
    title: Best, average and worst case
    body: |
      The same code can do different amounts of work for different inputs. Take "find `x` in an unsorted array":

      - **Best case**: `x` is the first item. 1 step.
      - **Worst case**: `x` is last or missing. `n` steps.
      - **Average case**: about `n / 2` steps, which is still O(n).

      Unless told otherwise, Big-O means the **worst case**. It is the promise that it will never be worse than this.

      **Example.** A search that counts how many items it looked at:

      ```js
      function findSteps(arr, x) {
        let steps = 0;
        for (const item of arr) {
          steps++;
          if (item === x) return steps;
        }
        return steps;   // not found: looked at all of them
      }

      const arr = [7, 3, 9, 1, 5, 8, 2, 6];
      console.log("best (first item):", findSteps(arr, 7));
      console.log("middle:", findSteps(arr, 5));
      console.log("worst (missing):", findSteps(arr, 4));
      ```

      prints:

      ```
      best (first item): 1
      middle: 5
      worst (missing): 8
      ```

  - kind: code
    title: "Try it: best and worst"
    body: |
      Run it and compare with the output above. Then search for the last item, `6`: also the worst case.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    code: |
      function findSteps(arr, x) {
        let steps = 0;
        for (const item of arr) {
          steps++;
          if (item === x) return steps;
        }
        return steps;
      }

      const arr = [7, 3, 9, 1, 5, 8, 2, 6];
      console.log("best (first item):", findSteps(arr, 7));
      console.log("middle:", findSteps(arr, 5));
      console.log("worst (missing):", findSteps(arr, 4));

  - kind: explain
    title: Amortized cost, why push is O(1)
    body: |
      A JavaScript array grows as you `push`. Sometimes there is room, and the push takes one step. Sometimes the array is full, so the engine allocates a bigger block (about double) and **copies every item**, which costs `n` steps.

      Copies are rare. If the size doubles each time, the total copying over `n` pushes is about `1 + 2 + 4 + … + n ≈ 2n`. Spread over `n` pushes, that is a constant few steps each. We say `push` is **amortized O(1)**: an occasional expensive step averaged over many cheap ones.

      To simulate doubling in code, `capacity *= 2` is short for `capacity = capacity * 2`:

      ```js
      let capacity = 1;
      capacity *= 2;
      capacity *= 2;
      console.log(capacity);
      ```

      prints:

      ```
      4
      ```

  - kind: code
    title: Watch the doubling
    body: |
      Write `copiesForPushes(n)`. Simulate an array that starts with room for **1** item and **doubles** its room whenever it is full. Each time it grows, it copies all its current items. Return the total number of copies after `n` pushes.

      For example `copiesForPushes(5)` is `7`: growing from 1 to 2 copies 1, 2 to 4 copies 2, and 4 to 8 copies 4.
    code: |
      function copiesForPushes(n) {
        let capacity = 1;
        let size = 0;
        let copies = 0;
        // for each push: if size === capacity, copy `size` items and double capacity
        return copies;
      }
    tests:
      - "copiesForPushes(1)"
      - "copiesForPushes(2)"
      - "copiesForPushes(5)"
      - "copiesForPushes(9)"
      - "copiesForPushes(1000)"
    solution: |
      function copiesForPushes(n) {
        let capacity = 1;
        let size = 0;
        let copies = 0;
        for (let i = 0; i < n; i++) {
          if (size === capacity) {
            copies += size;
            capacity *= 2;
          }
          size++;
        }
        return copies;
      }
    hint: Check `size === capacity` *before* adding the new item, then add one to `size`.
    reject:
      - |
        function copiesForPushes(n) {
          return n;
        }

  - kind: explain
    title: Space complexity and the call stack
    body: |
      **Space complexity** counts the *extra* memory your code needs beyond the input.

      - A few variables → **O(1)** space.
      - Building a new array of `n` items → **O(n)** space.
      - **Recursion uses the call stack.** A function that calls itself `n` levels deep holds `n` unfinished calls in memory, so it costs **O(n)** space even if it creates no arrays. You will see this in Module 10.

      **Example.** Three functions, three space costs. The recursive one keeps track of how deep it went:

      ```js
      function total(arr) {              // O(1) extra: one variable
        let t = 0;
        for (const x of arr) t += x;
        return t;
      }

      function doubled(arr) {            // O(n) extra: a new array of n items
        return arr.map((x) => x * 2);
      }

      let deepest = 0;
      function countDown(n, depth = 1) { // O(n) extra: n calls waiting on the stack
        deepest = Math.max(deepest, depth);
        if (n === 0) return;
        countDown(n - 1, depth + 1);
      }

      console.log(total([1, 2, 3]), doubled([1, 2, 3]));
      countDown(500);
      console.log("calls on the stack at once:", deepest);
      ```

      prints:

      ```
      6 [ 2, 4, 6 ]
      calls on the stack at once: 501
      ```

  - kind: choice
    title: "Quick check: how much space?"
    body: |
      ```js
      function reversed(arr) {
        const out = [];
        for (let i = arr.length - 1; i >= 0; i--) out.push(arr[i]);
        return out;
      }
      ```

      How much **extra** space does `reversed` use for an array of `n` items?
    options:
      - "O(1)"
      - "O(n)"
      - "O(n²)"
      - "O(log n)"
    answer: 1
    explanation: "It builds `out`, a new array that ends up with all `n` items. One loop variable on top doesn't change that: O(n)."

  - kind: explain
    title: Let the constraints tell you the target
    body: |
      A computer does roughly **10⁸ simple steps per second**. The problem's input limit tells you which complexity will finish in time.

      | Input size `n` up to | Aim for |
      |---|---|
      | 10 | O(n!) is fine |
      | 20 | O(2ⁿ) |
      | 500 | O(n³) |
      | 5 000 | O(n²) |
      | 1 000 000 | O(n log n) |
      | 100 000 000 | O(n) |
      | more than that | O(log n) or O(1) |

      Read a limit like `n ≤ 10⁵` as a hint: "n² would be 10¹⁰ steps, far too slow, so I need O(n log n) or better."

  - kind: code
    title: Pick the target from the limit
    body: |
      Write `targetComplexity(n)`. Given the maximum input size, return the string from the table above, using the **first row whose limit is at least `n`**: `"O(n!)"`, `"O(2^n)"`, `"O(n^3)"`, `"O(n^2)"`, `"O(n log n)"`, `"O(n)"`, or `"O(log n)"` when `n` is over 100 000 000.
    code: |
      function targetComplexity(n) {
        return "O(n)";
      }
    tests:
      - "targetComplexity(8)"
      - "targetComplexity(10)"
      - "targetComplexity(11)"
      - "targetComplexity(20)"
      - "targetComplexity(300)"
      - "targetComplexity(5000)"
      - "targetComplexity(100000)"
      - "targetComplexity(1000000)"
      - "targetComplexity(50000000)"
      - "targetComplexity(1000000000)"
    solution: |
      function targetComplexity(n) {
        if (n <= 10) return "O(n!)";
        if (n <= 20) return "O(2^n)";
        if (n <= 500) return "O(n^3)";
        if (n <= 5000) return "O(n^2)";
        if (n <= 1000000) return "O(n log n)";
        if (n <= 100000000) return "O(n)";
        return "O(log n)";
      }
    hint: Check the limits in order from smallest to largest and return at the first one that fits.
    reject:
      - |
        function targetComplexity(n) {
          if (n <= 10) return "O(n!)";
          if (n <= 20) return "O(2^n)";
          if (n <= 500) return "O(n^3)";
          if (n <= 5000) return "O(n^2)";
          if (n < 1000000) return "O(n log n)";
          if (n <= 100000000) return "O(n)";
          return "O(log n)";
        }

  - kind: info
    title: "🔹 Big-Θ and Big-Ω (just recognize them)"
    body: |
      You may see two cousins of Big-O:

      - **Big-O** is an *upper* bound: "no worse than".
      - **Big-Ω** (omega) is a *lower* bound: "no better than".
      - **Big-Θ** (theta) says both: "exactly this growth".

      In everyday practice people say "Big-O" and mean the tight worst case. You only need to recognize the other two when you read them.

      **Example: linear search.** In the worst case it looks at every item, so its worst case is **Θ(n)**: never worse than n steps (O), and for a missing item never better either (Ω). Its best case is 1 step, so across *all* inputs you'd only say it's **Ω(1)** and **O(n)**.

  - kind: choice
    title: "Quick check: which bound?"
    body: |
      A writer says: "this sort is **Ω(n)**". What does that promise?
    options:
      - "It never takes more than n steps"
      - "It takes exactly n steps"
      - "It uses n bytes of memory"
      - "It always takes at least about n steps"
    answer: 3
    explanation: "Ω is a lower bound: no better than n. That makes sense for any sort, since it has to look at every item at least once."

  - kind: why
    body: |
      Complexity is a way of predicting the future. Before you write a line, you can say "this will handle a million items" or "this will freeze on 100 000". That prediction saves you from writing a solution that can never work, and it is the first thing interviewers ask: "what is the time and space complexity?"

      From now on, write the time and space complexity as a comment above every solution you write.

  - kind: recap
    body: |
      - Big-O describes how **work grows** with input size `n`, ignoring constants and small terms.
      - Common classes, best to worst: O(1), O(log n), O(n), O(n log n), O(n²), O(2ⁿ), O(n!).
      - One loop is O(n). A loop inside a loop is O(n²). A loop that halves is O(log n).
      - Big-O usually means the **worst case**. `push` is **amortized** O(1).
      - **Recursion costs stack space**, one frame per level.
      - Use the input limit to pick a target: n ≤ 10⁵ means aim for O(n log n) or better.
      - 🔹 Big-Θ (exact) and Big-Ω (lower bound) exist. Recognize them.
