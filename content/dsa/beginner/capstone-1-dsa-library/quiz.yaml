questions:
  - type: mcq
    prompt: Why does the LinkedList keep a `tail` pointer?
    options:
      - So it can be walked backwards
      - So `append` is O(1) instead of walking the whole list
      - So `remove` is O(1)
      - It has no purpose
    answer: 1
    explanation: Without a tail you walk from the head to find the end, which costs O(n) for every append.
  - type: mcq
    prompt: Your Queue's `dequeue` uses `items.shift()`. What is wrong with that?
    options:
      - It returns the wrong item
      - Each dequeue is O(n), because the remaining items slide forward
      - It cannot work on numbers
      - Nothing, it is optimal
    answer: 1
    explanation: A `head` index makes dequeue O(1), because nothing moves.
  - type: mcq
    prompt: Which pair correctly describes merge sort?
    options:
      - O(n²) time, in place
      - O(n log n) time, O(n) extra space, stable
      - O(n) time, stable
      - O(n log n) time, O(1) space, unstable
    answer: 1
    explanation: There are log n levels of merging, each doing n work, and the merged arrays use O(n) extra space. Taking equal items from the left keeps it stable.
  - type: predict
    prompt: What does this print?
    code: |
      const sorted = [1, 3, 5, 7, 9];
      let lo = 0;
      let hi = sorted.length - 1;
      let steps = 0;
      while (lo <= hi) {
        steps++;
        const mid = Math.floor((lo + hi) / 2);
        if (sorted[mid] === 9) break;
        if (sorted[mid] < 9) lo = mid + 1;
        else hi = mid - 1;
      }
      console.log(steps);
    options: ["3", "5", "1", "2"]
    answer: 0
    explanation: "It checks index 2 (5), then index 3 (7), then index 4 (9). Three steps instead of five."
  - type: mcq
    prompt: Quickselect finds the k-th smallest item in average O(n) because it...
    options:
      - Sorts the whole array
      - Recurses into only one side of each partition
      - Uses a hash map
      - Looks at only the first k items
    answer: 1
    explanation: After partitioning, it knows which side holds position k and throws the other side away. The work shrinks like n + n/2 + n/4 + …
