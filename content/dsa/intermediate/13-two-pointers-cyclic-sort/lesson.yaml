steps:
  - kind: explain
    title: Welcome to the patterns
    body: |
      In the Beginner level you learned the tools: arrays, maps, stacks, recursion. Now you learn **patterns**: problem shapes that keep coming back, each with a standard trick.

      Recognising the pattern is most of the work. This module has two of them, and both replace a slow nested loop (O(n²)) with a single pass (O(n)).

      **Example of the payoff.** *Is there a pair in this sorted array that adds up to 14?* The nested loop and the two-pointer pass (explained on the next page) give the same answer. Count the checks:

      ```js
      const nums = [1, 3, 4, 6, 8, 11];
      const target = 14;

      let checks = 0;
      for (let i = 0; i < nums.length; i++)
        for (let j = i + 1; j < nums.length; j++) {
          checks++;
          if (nums[i] + nums[j] === target) {
            console.log("nested:", nums[i], nums[j]);
          }
        }
      console.log("nested loop checks:", checks);

      checks = 0;
      let left = 0, right = nums.length - 1;
      while (left < right) {
        checks++;
        const sum = nums[left] + nums[right];
        if (sum === target) {
          console.log("two pointers:", nums[left], nums[right]);
          break;
        }
        if (sum < target) left++; else right--;
      }
      console.log("two pointer checks:", checks);
      ```

      prints:

      ```
      nested: 3 11
      nested: 6 8
      nested loop checks: 15
      two pointers: 3 11
      two pointer checks: 2
      ```

  - kind: code
    title: "Try it: nested loop vs. one pass"
    body: |
      Run it and compare the two counts. Then change `target` to `20` (no pair adds up to it): the nested loop checks every pair, the pointers still stop quickly.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    code: |
      const nums = [1, 3, 4, 6, 8, 11];
      const target = 14;

      let checks = 0;
      for (let i = 0; i < nums.length; i++)
        for (let j = i + 1; j < nums.length; j++) {
          checks++;
          if (nums[i] + nums[j] === target) {
            console.log("nested:", nums[i], nums[j]);
          }
        }
      console.log("nested loop checks:", checks);

      checks = 0;
      let left = 0, right = nums.length - 1;
      while (left < right) {
        checks++;
        const sum = nums[left] + nums[right];
        if (sum === target) {
          console.log("two pointers:", nums[left], nums[right]);
          break;
        }
        if (sum < target) left++; else right--;
      }
      console.log("two pointer checks:", checks);

  - kind: explain
    title: Pattern 1a, pointers at both ends
    body: |
      When the array is **sorted**, put one pointer at the start (`left`) and one at the end (`right`), and move them towards each other based on what you see.

      *Find two numbers in a sorted array that add up to `target`.*

      - If `nums[left] + nums[right]` is **too small**, the only way to grow the sum is to move `left` right.
      - If it is **too big**, move `right` left.
      - If it matches, done.

      Each step throws away one candidate for good, so it takes at most `n` steps: **O(n) time, O(1) space**.

      <!-- page -->

      A worked example: `nums = [1, 3, 4, 6, 9]` and `target = 13`.

      | Step | left | right | Sum | What to do |
      |---|---|---|---|---|
      | 1 | 0 (1) | 4 (9) | 10 | too small, move `left` |
      | 2 | 1 (3) | 4 (9) | 12 | too small, move `left` |
      | 3 | 2 (4) | 4 (9) | 13 | match: the answer is `[2, 4]` |

      The same "start at both ends, walk inwards" shape checks whether a word reads the same backwards. This prints the two letters it compares at each step:

      ```js
      const word = "racecar";
      let left = 0;
      let right = word.length - 1;
      let same = true;
      while (left < right) {
        console.log(left, right, word[left], word[right]);
        if (word[left] !== word[right]) same = false;
        left++;
        right--;
      }
      console.log(same);
      ```

      It prints:

      ```
      0 6 r r
      1 5 a a
      2 4 c c
      true
      ```

      The middle letter `e` (index 3) is never compared: when `left` and `right` meet, there is nothing left to check.

  - kind: code
    title: "Try it: pointers at both ends"
    body: |
      Press **Run** and read the trace: each line shows the two positions and the two letters being compared.

      Then change `"racecar"` to `"rocket"` and run again. Which line shows the first mismatch, and what does the last line say now?

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    code: |
      const word = "racecar";
      let left = 0;
      let right = word.length - 1;
      let same = true;
      while (left < right) {
        console.log(left, right, word[left], word[right]);
        if (word[left] !== word[right]) same = false;
        left++;
        right--;
      }
      console.log(same);

  - kind: code
    title: "Find the bug: the same number twice"
    body: |
      `twoSumSorted(nums, target)` should return the positions `[i, j]` (with `i < j`) of two numbers in a sorted array that add up to `target`, or `null` if there is no such pair. This version can pair a number with itself. Fix it.
    code: |
      function twoSumSorted(nums, target) {
        let left = 0;
        let right = nums.length - 1;
        while (left <= right) {
          const sum = nums[left] + nums[right];
          if (sum === target) return [left, right];
          if (sum < target) left++;
          else right--;
        }
        return null;
      }
    tests:
      - "twoSumSorted([2, 7, 11, 15], 9)"
      - "twoSumSorted([1, 2, 3, 4, 6], 6)"
      - "twoSumSorted([2, 4], 4)"
      - "twoSumSorted([5], 10)"
      - "twoSumSorted([], 3)"
      - "twoSumSorted([-3, 0, 3, 8], 0)"
    solution: |
      function twoSumSorted(nums, target) {
        let left = 0;
        let right = nums.length - 1;
        while (left < right) {
          const sum = nums[left] + nums[right];
          if (sum === target) return [left, right];
          if (sum < target) left++;
          else right--;
        }
        return null;
      }
    hint: When `left === right`, both pointers point at the same element. Two different elements need `left < right`.
    broken_starter: true
    reject:
      - |
        function twoSumSorted(nums, target) {
          let left = 0;
          let right = nums.length - 1;
          while (left <= right) {
            const sum = nums[left] + nums[right];
            if (sum === target) return [left, right];
            if (sum < target) left++;
            else right--;
          }
          return null;
        }

  - kind: code
    title: Container with the most water
    body: |
      `heights[i]` is the height of a vertical wall at position `i`. Pick two walls: together with the floor they hold water of amount `(distance between them) × (the shorter wall)`. Write `maxWater(heights)` returning the biggest amount.

      Start with the widest pair. Then move the pointer at the **shorter** wall inwards, because keeping the shorter wall can never do better once the width shrinks.
    code: |
      function maxWater(heights) {
        return 0;
      }
    tests:
      - "maxWater([1, 8, 6, 2, 5, 4, 8, 3, 7])"
      - "maxWater([1, 1])"
      - "maxWater([4, 3, 2, 1, 4])"
      - "maxWater([1, 2, 1])"
      - "maxWater([5])"
    solution: |
      function maxWater(heights) {
        let left = 0;
        let right = heights.length - 1;
        let best = 0;
        while (left < right) {
          const area = (right - left) * Math.min(heights[left], heights[right]);
          best = Math.max(best, area);
          if (heights[left] < heights[right]) left++;
          else right--;
        }
        return best;
      }
    hint: Compute the area, remember the best, then move whichever pointer is at the shorter wall.
    reject:
      - |
        function maxWater(heights) {
          return Math.max(...heights) * (heights.length - 1);
        }

  - kind: explain
    title: Pattern 1b, pointers moving the same way
    body: |
      Another version: both pointers start at the front and move **in the same direction**, at different roles.

      - A **read** pointer scans every element.
      - A **write** pointer marks where the next "kept" value goes.

      Classic uses: "move every 0 to the end, keeping the other values in order", and the example below. It edits an array **in place** in one pass. Removing duplicates from a *sorted* array is the classic example: copy an element forward only if it differs from the last kept one.

      <!-- page -->

      A worked example: keep only the numbers that are not negative, in place, and count them.

      ```js
      const nums = [3, -1, 4, -5, 9];
      let write = 0;
      for (let read = 0; read < nums.length; read++) {
        if (nums[read] >= 0) {
          nums[write] = nums[read];
          write++;
        }
      }
      console.log(write);
      console.log(nums.slice(0, write));
      ```

      It prints:

      ```
      3
      [ 3, 4, 9 ]
      ```

      `read` visits all five numbers. `write` only moves when a number is kept, so at the end it equals the count of kept numbers, and the first `write` positions hold them in their original order.

  - kind: code
    title: "Try it: read and write pointers"
    body: |
      Run this and check the two printed lines.

      Then change the rule `nums[read] >= 0` to `nums[read] !== 4` (keep everything except 4) and run again. What is `write` now?

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    code: |
      const nums = [3, -1, 4, -5, 9];
      let write = 0;
      for (let read = 0; read < nums.length; read++) {
        if (nums[read] >= 0) {
          nums[write] = nums[read];
          write++;
        }
      }
      console.log(write);
      console.log(nums.slice(0, write));

  - kind: code
    title: Remove duplicates in place
    body: |
      Write `removeDuplicates(nums)` for a **sorted** array. Rewrite the array so its first `k` positions hold each distinct value once (in order), and **return `k`**. What lies beyond position `k` does not matter.
    code: |
      function removeDuplicates(nums) {
        return nums.length;
      }
    tests:
      - "(() => { const a = [1, 1, 2]; const k = removeDuplicates(a); return [k, a.slice(0, k)]; })()"
      - "(() => { const a = [0, 0, 1, 1, 1, 2, 2, 3, 3, 4]; const k = removeDuplicates(a); return [k, a.slice(0, k)]; })()"
      - "(() => { const a = []; const k = removeDuplicates(a); return [k, a.slice(0, k)]; })()"
      - "(() => { const a = [7]; const k = removeDuplicates(a); return [k, a.slice(0, k)]; })()"
      - "(() => { const a = [2, 2, 2]; const k = removeDuplicates(a); return [k, a.slice(0, k)]; })()"
    solution: |
      function removeDuplicates(nums) {
        if (nums.length === 0) return 0;
        let write = 1;
        for (let read = 1; read < nums.length; read++) {
          if (nums[read] !== nums[write - 1]) {
            nums[write] = nums[read];
            write++;
          }
        }
        return write;
      }
    hint: Compare each `nums[read]` with the last kept value, `nums[write - 1]`.
    reject:
      - |
        function removeDuplicates(nums) {
          return new Set(nums).size;
        }

  - kind: explain
    title: The Dutch national flag
    body: |
      *Sort an array that contains only 0, 1 and 2 (three "colours") in one pass, in place.* Use **three regions** and three pointers:

      - everything before `low` is `0`,
      - everything after `high` is `2`,
      - `mid` scans the unknown middle.

      ```
      [ 0 0 0 | 1 1 1 | ? ? ? ? | 2 2 2 ]
               low      mid       high
      ```

      At `mid`: a `0` swaps to `low` (both move up), a `1` just moves `mid`, a `2` swaps to `high` (only `high` moves down, because the swapped-in value is still unknown).

      <!-- page -->

      A worked example by hand, on `[2, 0, 1]`. At the start `low = 0`, `mid = 0`, `high = 2`.

      | Step | Value at `mid` | Action | Array after | low, mid, high |
      |---|---|---|---|---|
      | 1 | 2 | swap with `high`, `high` moves down | `[1, 0, 2]` | 0, 0, 1 |
      | 2 | 1 | just move `mid` | `[1, 0, 2]` | 0, 1, 1 |
      | 3 | 0 | swap with `low`, both move up | `[0, 1, 2]` | 1, 2, 1 |

      Now `mid` is past `high`, so the unknown middle is empty and the array is sorted. Notice step 1: after the swap, `mid` stayed at 0, because the `1` that arrived there had not been looked at yet.

  - kind: code
    title: Sort the colours
    body: |
      Write `sortColors(nums)` that sorts an array of `0`s, `1`s and `2`s **in place** in one pass with the three-pointer method.
    code: |
      function sortColors(nums) {
        let low = 0;
        let mid = 0;
        let high = nums.length - 1;
      }
    tests:
      - "(() => { const a = [2, 0, 2, 1, 1, 0]; sortColors(a); return a; })()"
      - "(() => { const a = [2, 0, 1]; sortColors(a); return a; })()"
      - "(() => { const a = [1]; sortColors(a); return a; })()"
      - "(() => { const a = []; sortColors(a); return a; })()"
      - "(() => { const a = [2, 2, 2, 0, 0]; sortColors(a); return a; })()"
    solution: |
      function sortColors(nums) {
        let low = 0;
        let mid = 0;
        let high = nums.length - 1;
        while (mid <= high) {
          if (nums[mid] === 0) {
            [nums[low], nums[mid]] = [nums[mid], nums[low]];
            low++;
            mid++;
          } else if (nums[mid] === 1) {
            mid++;
          } else {
            [nums[mid], nums[high]] = [nums[high], nums[mid]];
            high--;
          }
        }
      }
    hint: "After swapping with `high`, do **not** move `mid`. You have not looked at the value you just swapped in."
    reject:
      - |
        function sortColors(nums) {}

  - kind: explain
    title: 3Sum, and skipping duplicates
    body: |
      *Find all unique triples that add to 0.* Sort the array, fix the first number `nums[i]`, and use two pointers on the rest to find a pair adding to `-nums[i]`. That is O(n²) instead of O(n³).

      The tricky part is **duplicates**. After sorting, equal values sit together, so skip them:

      - skip `i` if `nums[i] === nums[i - 1]`,
      - after finding a triple, move `left` and `right` past their duplicates too.

      <!-- page -->

      A worked example of "sort, then skip repeats". `[...nums]` makes a copy, so the original array is not changed, and `(a, b) => a - b` sorts numbers from small to big:

      ```js
      const nums = [2, -1, 2, 0, -1];
      const sorted = [...nums].sort((a, b) => a - b);
      console.log(sorted);
      for (let i = 0; i < sorted.length; i++) {
        if (i > 0 && sorted[i] === sorted[i - 1]) continue;
        console.log("first number:", sorted[i]);
      }
      ```

      It prints:

      ```
      [ -1, -1, 0, 2, 2 ]
      first number: -1
      first number: 0
      first number: 2
      ```

      Each value is used as the first number only once, even though `-1` and `2` appear twice. That is exactly how 3Sum avoids reporting the same triple twice.

  - kind: code
    title: 3Sum
    body: |
      Write `threeSum(nums)`: every **unique** triple `[a, b, c]` from the array with `a + b + c === 0`. The order of triples and of numbers inside them does not matter for the checker.
    code: |
      function threeSum(nums) {
        const result = [];
        return result;
      }
    unordered: true
    tests:
      - "threeSum([-1, 0, 1, 2, -1, -4])"
      - "threeSum([0, 1, 1])"
      - "threeSum([0, 0, 0])"
      - "threeSum([0, 0, 0, 0])"
      - "threeSum([])"
      - "threeSum([-2, 0, 0, 2, 2])"
    solution: |
      function threeSum(nums) {
        const sorted = [...nums].sort((a, b) => a - b);
        const result = [];
        for (let i = 0; i < sorted.length - 2; i++) {
          if (i > 0 && sorted[i] === sorted[i - 1]) continue;
          let left = i + 1;
          let right = sorted.length - 1;
          while (left < right) {
            const sum = sorted[i] + sorted[left] + sorted[right];
            if (sum === 0) {
              result.push([sorted[i], sorted[left], sorted[right]]);
              left++;
              right--;
              while (left < right && sorted[left] === sorted[left - 1]) left++;
              while (left < right && sorted[right] === sorted[right + 1]) right--;
            } else if (sum < 0) {
              left++;
            } else {
              right--;
            }
          }
        }
        return result;
      }
    hint: Sort first. After recording a triple, move both pointers and skip repeats, or `[0, 0, 0, 0]` gives the same triple twice.
    reject:
      - |
        function threeSum(nums) {
          const out = [];
          for (let i = 0; i < nums.length; i++)
            for (let j = i + 1; j < nums.length; j++)
              for (let k = j + 1; k < nums.length; k++)
                if (nums[i] + nums[j] + nums[k] === 0) out.push([nums[i], nums[j], nums[k]]);
          return out;
        }

  - kind: explain
    title: Pattern 2, cyclic sort
    body: |
      A different trick for arrays whose values fall in a **known range**, like `1 … n` in an array of `n` items. Each value has a "correct" home: **value `v` belongs at index `v - 1`**.

      **Cyclic sort:** look at position `i`. If its value is not at its home and the home does not already hold the same value, **swap it home**. Repeat at `i` until the value at `i` is right (or a duplicate), then move on.

      <!-- page -->

      Here it is in code:

      ```js
      let i = 0;
      while (i < nums.length) {
        const home = nums[i] - 1;
        if (nums[i] >= 1 && nums[i] <= nums.length && nums[i] !== nums[home]) {
          [nums[i], nums[home]] = [nums[home], nums[i]];
        } else {
          i++;
        }
      }
      ```

      Every swap puts one value home for good, so it is **O(n) time and O(1) space**. Afterwards, any position `i` where `nums[i] !== i + 1` reveals a **missing** number (`i + 1`) and a **duplicate** (`nums[i]`).

      <!-- page -->

      A worked example on `[3, 1, 4, 1]`, with a `console.log` after every swap:

      ```js
      const nums = [3, 1, 4, 1];
      let i = 0;
      while (i < nums.length) {
        const home = nums[i] - 1;
        if (nums[i] >= 1 && nums[i] <= nums.length && nums[i] !== nums[home]) {
          [nums[i], nums[home]] = [nums[home], nums[i]];
          console.log(nums);
        } else {
          i++;
        }
      }
      console.log("done:", nums);
      ```

      It prints:

      ```
      [ 4, 1, 3, 1 ]
      [ 1, 1, 3, 4 ]
      done: [ 1, 1, 3, 4 ]
      ```

      The `3` went home to index 2, then the `4` to index 3, then the `1` to index 0. The second `1` has nowhere to go (its home already holds a `1`), so it stays at index 1. Index 1 should hold `2`: so `2` is missing and `1` is the duplicate.

  - kind: code
    title: "Try it: cyclic sort"
    body: |
      Run this and follow the swaps line by line.

      Then change the array to `[2, 3, 3, 1]` and run again. Which position ends up holding the wrong value, and which number is missing?

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    code: |
      const nums = [3, 1, 4, 1];
      let i = 0;
      while (i < nums.length) {
        const home = nums[i] - 1;
        if (nums[i] >= 1 && nums[i] <= nums.length && nums[i] !== nums[home]) {
          [nums[i], nums[home]] = [nums[home], nums[i]];
          console.log(nums);
        } else {
          i++;
        }
      }
      console.log("done:", nums);

  - kind: code
    title: Find all missing numbers
    body: |
      `nums` has `n` numbers, each between `1` and `n`, and some appear twice, so some numbers are missing. Write `findDisappeared(nums)`: every number from `1` to `n` that does **not** appear, in ascending order. Use cyclic sort. You may change the array.
    code: |
      function findDisappeared(nums) {
        return [];
      }
    tests:
      - "findDisappeared([4, 3, 2, 7, 8, 2, 3, 1])"
      - "findDisappeared([1, 1])"
      - "findDisappeared([1, 2, 3])"
      - "findDisappeared([2, 2, 2])"
      - "findDisappeared([])"
    solution: |
      function findDisappeared(nums) {
        let i = 0;
        while (i < nums.length) {
          const home = nums[i] - 1;
          if (nums[i] !== nums[home]) {
            [nums[i], nums[home]] = [nums[home], nums[i]];
          } else {
            i++;
          }
        }
        const missing = [];
        for (let j = 0; j < nums.length; j++) {
          if (nums[j] !== j + 1) missing.push(j + 1);
        }
        return missing;
      }
    hint: Swap `nums[i]` home unless the home already holds the same value (a duplicate). Afterwards, every `j` with `nums[j] !== j + 1` means `j + 1` is missing.
    reject:
      - |
        function findDisappeared(nums) {
          return [];
        }

  - kind: code
    title: First missing positive
    body: |
      Given any integers (including negatives, zero and huge values), write `firstMissingPositive(nums)`: the smallest positive integer that is **not** in the array. Do it in O(n) time and O(1) extra space.

      Trick: only values from `1` to `n` can matter. Ignore everything else while you cyclic-sort. The answer is at most `n + 1`.
    code: |
      function firstMissingPositive(nums) {
        return 1;
      }
    tests:
      - "firstMissingPositive([1, 2, 0])"
      - "firstMissingPositive([3, 4, -1, 1])"
      - "firstMissingPositive([7, 8, 9, 11, 12])"
      - "firstMissingPositive([1])"
      - "firstMissingPositive([2, 1])"
      - "firstMissingPositive([])"
      - "firstMissingPositive([1, 1, 2, 2])"
    solution: |
      function firstMissingPositive(nums) {
        const n = nums.length;
        let i = 0;
        while (i < n) {
          const v = nums[i];
          if (v >= 1 && v <= n && nums[v - 1] !== v) {
            [nums[i], nums[v - 1]] = [nums[v - 1], nums[i]];
          } else {
            i++;
          }
        }
        for (let j = 0; j < n; j++) {
          if (nums[j] !== j + 1) return j + 1;
        }
        return n + 1;
      }
    hint: Only swap when the value is in `1 … n` and its home does not already hold it. Then the first position `j` with `nums[j] !== j + 1` gives the answer `j + 1`.
    reject:
      - |
        function firstMissingPositive(nums) {
          return Math.max(0, ...nums) + 1;
        }

  - kind: why
    body: |
      Two pointers and cyclic sort share one idea: **use the structure of the input** (sorted order, or values in a known range) to skip work. A nested loop compares everything with everything. These patterns compare each element with only what could matter, once.

      When you meet a new problem, ask: "Is it sorted? Are the values in a range? Can I keep two markers?"

  - kind: recap
    body: |
      - **Opposite-end pointers** on sorted data: move the pointer that can improve the answer. O(n) time, O(1) space.
      - **Read/write pointers** edit an array in place in one pass (remove duplicates, move zeroes).
      - The **Dutch national flag** uses `low`, `mid`, `high` to sort three values in one pass.
      - **3Sum**: sort, fix one number, two-pointer the rest, and skip duplicates.
      - **Cyclic sort**: value `v` belongs at index `v - 1`. Swap values home in O(n), then scan for misplaced ones to find missing and duplicate numbers.
