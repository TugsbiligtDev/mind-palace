steps:
  - kind: explain
    title: What is a tree?
    body: |
      A **tree** is a linked structure like a linked list, but each node can point to **more than one** next node. In a **binary tree**, every node has at most **two children**: a `left` and a `right`.

      ```
              1          ← root
             / \
            2   3        ← 2 and 3 are children of 1
           / \
          4   5          ← 4 and 5 are leaves
      ```

      Vocabulary:
      - **root**: the top node (no parent),
      - **leaf**: a node with no children,
      - **depth** of a node: how many steps down from the root,
      - **height** of a tree: the number of levels (or edges) on its longest downward path,
      - **balanced**: left and right sides have similar height, so the tree is not a long chain.

      A tree is **recursive**: each child is itself the root of a smaller tree. That is why recursion (Module 10) fits so well.

  - kind: explain
    title: The TreeNode class, and testing helpers
    body: |
      ```js
      class TreeNode {
        constructor(val, left = null, right = null) {
          this.val = val;
          this.left = left;
          this.right = right;
        }
      }
      ```

      Sites like LeetCode write trees as a **level-order array** where `null` means "no node": `[1, 2, 3, 4, 5]` is the tree above, and `[1, null, 2]` has a right child only.

      Two helpers are **already in the editor** for every exercise: `buildTree(array)` turns that format into real nodes, and `treeToArray(root)` turns a tree back into an array so we can compare results. An empty tree is `null`.

  - kind: code
    title: Build a tree and look at it
    body: |
      Run this. It builds the tree from an array and prints a few facts. Change the array and predict the output before you run.
    code: |
      class TreeNode {
        constructor(val, left = null, right = null) {
          this.val = val;
          this.left = left;
          this.right = right;
        }
      }

      // Builds a tree from LeetCode's level-order array, where null means "no node".
      function buildTree(values) {
        if (values.length === 0 || values[0] === null) return null;
        const root = new TreeNode(values[0]);
        const queue = [root];
        let i = 1;
        for (let h = 0; h < queue.length && i < values.length; h++) {
          const node = queue[h];
          if (i < values.length && values[i] !== null) {
            node.left = new TreeNode(values[i]);
            queue.push(node.left);
          }
          i++;
          if (i < values.length && values[i] !== null) {
            node.right = new TreeNode(values[i]);
            queue.push(node.right);
          }
          i++;
        }
        return root;
      }

      // The reverse: a tree back into a level-order array.
      function treeToArray(root) {
        const out = [];
        const queue = [root];
        for (let h = 0; h < queue.length; h++) {
          const node = queue[h];
          if (node) {
            out.push(node.val);
            queue.push(node.left, node.right);
          } else {
            out.push(null);
          }
        }
        while (out.length > 0 && out[out.length - 1] === null) out.pop();
        return out;
      }


      const root = buildTree([1, 2, 3, 4, 5]);
      console.log(root.val, root.left.val, root.right.val);
      console.log(root.left.left.val, root.left.right.val);
      console.log(root.right.left);
      console.log(treeToArray(root));

  - kind: explain
    title: Recursion on trees
    body: |
      Most tree functions follow one shape:

      ```js
      function solve(node) {
        if (node === null) return /* the answer for an empty tree */;   // base case
        const left = solve(node.left);
        const right = solve(node.right);
        return /* combine left, right and node.val */;
      }
      ```

      **Height** is a perfect example: an empty tree has height 0, otherwise it is `1 + max(height of left, height of right)`.

