            out.push(null);
          }
        }
        while (out.length > 0 && out[out.length - 1] === null) out.pop();
        return out;
      }


      function inorder(root) {
        const result = [];
        const stack = [];
        let node = root;
        while (node !== null || stack.length > 0) {
          while (node !== null) {
            stack.push(node);
            node = node.left;
          }
          node = stack.pop();
          result.push(node.val);
          node = node.right;
        }
        return result;
      }
    hint: "Outer `while (node !== null || stack.length > 0)`. Inside: push everything down the left side, pop one, record it, and go right."
