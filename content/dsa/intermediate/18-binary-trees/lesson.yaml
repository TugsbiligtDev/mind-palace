  - kind: code
    title: "Find the bug: the missing null check"
    body: |
      `isSameTree(p, q)` should return `true` when two trees have the same shape **and** the same values. It crashes on trees that are shaped differently. Fix it.
    code: |
      class TreeNode {
        constructor(val, left = null, right = null) {
          this.val = val;
          this.left = left;
          this.right = right;
        }
      }

      // Builds a tree from LeetCode's level-order array, where null means "no node".
      function buildTree(values) {
        if (values.length === 0 || values[0] === null) return null;
        const root = new TreeNode(values[0]);
        const queue = [root];
        let i = 1;
        for (let h = 0; h < queue.length && i < values.length; h++) {
          const node = queue[h];
          if (i < values.length && values[i] !== null) {
            node.left = new TreeNode(values[i]);
            queue.push(node.left);
          }
          i++;
          if (i < values.length && values[i] !== null) {
            node.right = new TreeNode(values[i]);
            queue.push(node.right);
          }
          i++;
        }
        return root;
      }

      // The reverse: a tree back into a level-order array.
      function treeToArray(root) {
        const out = [];
        const queue = [root];
        for (let h = 0; h < queue.length; h++) {
          const node = queue[h];
          if (node) {
            out.push(node.val);
            queue.push(node.left, node.right);
          } else {
            out.push(null);
          }
        }
        while (out.length > 0 && out[out.length - 1] === null) out.pop();
        return out;
      }


      function isSameTree(p, q) {
        if (p.val !== q.val) return false;
        return isSameTree(p.left, q.left) && isSameTree(p.right, q.right);
      }
    tests:
      - "isSameTree(buildTree([1, 2, 3]), buildTree([1, 2, 3]))"
      - "isSameTree(buildTree([1, 2]), buildTree([1, null, 2]))"
      - "isSameTree(buildTree([1, 2, 1]), buildTree([1, 1, 2]))"
      - "isSameTree(buildTree([]), buildTree([]))"
      - "isSameTree(buildTree([1]), buildTree([]))"
    solution: |
