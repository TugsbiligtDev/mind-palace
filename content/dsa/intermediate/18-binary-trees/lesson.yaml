  - kind: why
    body: |
      Trees are how programs model anything with a hierarchy: folders on your disk, the structure of a web page, a company's org chart, a family tree, the decisions of an AI. And the recursion habit you just practised ("solve the left, solve the right, combine") is the key to almost every tree problem.

      Traversal order is the design choice. Need children before parents? Postorder. Need levels? Breadth-first. Need sorted order out of a search tree? Inorder, which is the next module.

  - kind: recap
    body: |
      - A **binary tree** node has a `val`, a `left` and a `right`. **Root** is the top, **leaves** have no children, and **height** counts levels.
      - Tree functions follow one shape: base case for `null`, recurse on both children, combine.
      - **Preorder / inorder / postorder** differ in when the node is handled. Use your own stack for an iterative version.
      - **Level-order** uses a queue, and processes one whole level at a time.
      - **Diameter** returns a height but records the best path in an outer variable.
      - For paths, push before going down, pop on the way back, and copy the path when you save it.
