  - kind: explain
    title: Depth-first traversals
    body: |
      To visit every node in a tree, choose an order. **Depth-first** goes all the way down one branch before backing up. There are three flavours, and they differ only in **when you handle the node itself**:

      | Order | Visit | Example on the tree above |
      |---|---|---|
      | **Preorder** | node, left, right | 1 2 4 5 3 |
      | **Inorder** | left, node, right | 4 2 5 1 3 |
      | **Postorder** | left, right, node | 4 5 2 3 1 |

      ```js
      function inorder(node, out = []) {
        if (node === null) return out;
        inorder(node.left, out);
        out.push(node.val);
        inorder(node.right, out);
        return out;
      }
      ```

      Recursion can overflow on a very deep (chain-like) tree, so it helps to know the **iterative** version that uses your own stack (Module 10's idea).

  - kind: code
    title: Inorder with a stack
    body: |
      Write `inorder(root)` **without recursion**: return the values in inorder (left, node, right). One hidden test uses a chain of 20 000 nodes, which would overflow a recursive version.

      Use a stack. Keep going left, pushing nodes. When you cannot go further left, pop a node, record it, and move to its **right** child.
    code: |
