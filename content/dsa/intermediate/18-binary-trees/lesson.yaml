  - kind: explain
    title: Diameter, and carrying two answers
    body: |
      The **diameter** of a tree is the length (in edges) of the longest path between any two nodes. That path may not pass through the root.

      Trick: at every node, the longest path **through that node** is `height(left) + height(right)`. While computing heights recursively, also keep a `best` variable and update it at each node.

      This is a common recursion pattern: the function **returns** one thing (the height, for its parent) and **records** another (the best diameter seen so far).

