  - kind: explain
    title: Breadth-first, level by level
    body: |
      **Breadth-first** (level-order) visits all nodes at depth 0, then depth 1, then depth 2. It uses a **queue** instead of a stack.

      ```js
      const queue = [root];
      let head = 0;
      while (head < queue.length) {
        const node = queue[head++];
        // handle node
        if (node.left) queue.push(node.left);
        if (node.right) queue.push(node.right);
      }
      ```

      To keep the levels apart, process **exactly the nodes that were in the queue when the level started**: take the queue's current size as the level's size.

