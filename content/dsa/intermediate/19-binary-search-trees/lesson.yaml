    title: Lowest common ancestor
    body: |
      The **lowest common ancestor** of two values `p` and `q` is the deepest node that has both as descendants (a node counts as its own descendant). In a BST you never need to search both sides: walk down from the root, and the first node where `p` and `q` **split** (one goes left, the other right) is the answer.

      Write `lowestCommonAncestor(root, p, q)` returning that node's **value**. Both values are in the tree.
