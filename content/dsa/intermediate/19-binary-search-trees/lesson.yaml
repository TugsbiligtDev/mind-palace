steps:
  - kind: explain
    title: The BST rule
    body: |
      A **binary search tree** (BST) is a binary tree with one extra rule at **every** node:

      - everything in the **left** subtree is **smaller** than the node,
      - everything in the **right** subtree is **bigger**.

      ```
              8
             / \
            3   10
           / \    \
          1   6    14
      ```

      This is binary search turned into a shape. To find a value, compare with the node: smaller → go left, bigger → go right. Each step throws away a whole subtree.

      In a **balanced** tree that is **O(log n)** for search, insert and delete. In a lopsided tree (say you insert 1, 2, 3, 4, 5 in order, giving a chain), it degrades to **O(n)**.

  - kind: code
    title: Search a BST
    body: |
      Write `searchBST(root, val)`: return the **node** whose value is `val` (the whole subtree under it comes along), or `null` if it is not there. Compare and go left or right. No need to visit both sides.
    code: |
      class TreeNode {
        constructor(val, left = null, right = null) {
          this.val = val;
          this.left = left;
          this.right = right;
        }
      }

      // Builds a tree from LeetCode's level-order array, where null means "no node".
      function buildTree(values) {
        if (values.length === 0 || values[0] === null) return null;
        const root = new TreeNode(values[0]);
        const queue = [root];
        let i = 1;
        for (let h = 0; h < queue.length && i < values.length; h++) {
          const node = queue[h];
          if (i < values.length && values[i] !== null) {
            node.left = new TreeNode(values[i]);
            queue.push(node.left);
          }
          i++;
          if (i < values.length && values[i] !== null) {
            node.right = new TreeNode(values[i]);
            queue.push(node.right);
          }
          i++;
        }
        return root;
      }

      // The reverse: a tree back into a level-order array.
      function treeToArray(root) {
        const out = [];
        const queue = [root];
        for (let h = 0; h < queue.length; h++) {
          const node = queue[h];
          if (node) {
            out.push(node.val);
            queue.push(node.left, node.right);
          } else {
            out.push(null);
          }
        }
        while (out.length > 0 && out[out.length - 1] === null) out.pop();
        return out;
      }


      function searchBST(root, val) {
        return null;
      }
    tests:
      - "treeToArray(searchBST(buildTree([4, 2, 7, 1, 3]), 2))"
      - "treeToArray(searchBST(buildTree([4, 2, 7, 1, 3]), 5))"
      - "treeToArray(searchBST(buildTree([]), 1))"
      - "treeToArray(searchBST(buildTree([4, 2, 7, 1, 3]), 4))"
      - "treeToArray(searchBST(buildTree([8, 3, 10, 1, 6, null, 14]), 6))"
    solution: |
