            out.push(null);
          }
        }
        while (out.length > 0 && out[out.length - 1] === null) out.pop();
        return out;
      }


      function kthSmallest(root, k) {
        return null;
      }
    tests:
      - "kthSmallest(buildTree([3, 1, 4, null, 2]), 1)"
      - "kthSmallest(buildTree([5, 3, 6, 2, 4, null, null, 1]), 3)"
      - "kthSmallest(buildTree([5, 3, 6, 2, 4, null, null, 1]), 6)"
      - "kthSmallest(buildTree([1]), 1)"
      - "kthSmallest(buildTree([8, 3, 10, 1, 6, null, 14]), 4)"
    solution: |
      class TreeNode {
        constructor(val, left = null, right = null) {
          this.val = val;
          this.left = left;
          this.right = right;
        }
      }

      // Builds a tree from LeetCode's level-order array, where null means "no node".
      function buildTree(values) {
        if (values.length === 0 || values[0] === null) return null;
        const root = new TreeNode(values[0]);
        const queue = [root];
        let i = 1;
        for (let h = 0; h < queue.length && i < values.length; h++) {
          const node = queue[h];
          if (i < values.length && values[i] !== null) {
            node.left = new TreeNode(values[i]);
            queue.push(node.left);
          }
          i++;
          if (i < values.length && values[i] !== null) {
            node.right = new TreeNode(values[i]);
            queue.push(node.right);
          }
          i++;
        }
        return root;
      }

      // The reverse: a tree back into a level-order array.
      function treeToArray(root) {
        const out = [];
        const queue = [root];
        for (let h = 0; h < queue.length; h++) {
          const node = queue[h];
          if (node) {
            out.push(node.val);
            queue.push(node.left, node.right);
          } else {
            out.push(null);
          }
        }
        while (out.length > 0 && out[out.length - 1] === null) out.pop();
        return out;
      }


      function kthSmallest(root, k) {
        const stack = [];
        let node = root;
        while (node !== null || stack.length > 0) {
          while (node !== null) {
            stack.push(node);
            node = node.left;
          }
          node = stack.pop();
          k--;
          if (k === 0) return node.val;
          node = node.right;
        }
        return null;
      }
    hint: It is the stack-based inorder from the last module, with a countdown. Return as soon as `k` reaches 0.
