  - kind: explain
    title: Inorder gives sorted order
    body: |
      Read a BST **left, node, right** (inorder) and you get the values **in ascending order**. The rule guarantees it: everything smaller comes first, then the node, then everything bigger.

      This makes several problems easy:

      - **Sorted list** of a BST: run inorder.
      - **k-th smallest**: run inorder and stop at the k-th value.
      - **Validate a BST**: inorder must be strictly increasing (or check bounds).

  - kind: code
    title: "Find the bug: checking only the children"
    body: |
      `isValidBST(root)` should return `true` only if the tree obeys the BST rule at **every** node, across all levels. This version only compares each node with its **direct** children, so it accepts `[5, 1, 4, null, null, 3, 6]`, where `3` sits in the right side of `5` even though it is smaller. Fix it by passing down the allowed range.
    code: |
      class TreeNode {
        constructor(val, left = null, right = null) {
          this.val = val;
          this.left = left;
          this.right = right;
        }
      }

      // Builds a tree from LeetCode's level-order array, where null means "no node".
      function buildTree(values) {
        if (values.length === 0 || values[0] === null) return null;
        const root = new TreeNode(values[0]);
        const queue = [root];
        let i = 1;
        for (let h = 0; h < queue.length && i < values.length; h++) {
          const node = queue[h];
          if (i < values.length && values[i] !== null) {
            node.left = new TreeNode(values[i]);
            queue.push(node.left);
          }
          i++;
          if (i < values.length && values[i] !== null) {
            node.right = new TreeNode(values[i]);
            queue.push(node.right);
          }
          i++;
        }
        return root;
      }

      // The reverse: a tree back into a level-order array.
      function treeToArray(root) {
        const out = [];
        const queue = [root];
        for (let h = 0; h < queue.length; h++) {
          const node = queue[h];
          if (node) {
            out.push(node.val);
            queue.push(node.left, node.right);
          } else {
            out.push(null);
          }
        }
        while (out.length > 0 && out[out.length - 1] === null) out.pop();
        return out;
      }


      function isValidBST(root) {
        if (root === null) return true;
        if (root.left !== null && root.left.val >= root.val) return false;
        if (root.right !== null && root.right.val <= root.val) return false;
        return isValidBST(root.left) && isValidBST(root.right);
      }
    tests:
      - "isValidBST(buildTree([2, 1, 3]))"
      - "isValidBST(buildTree([5, 1, 4, null, null, 3, 6]))"
      - "isValidBST(buildTree([]))"
      - "isValidBST(buildTree([1, 1]))"
      - "isValidBST(buildTree([5, 4, 6, null, null, 3, 7]))"
      - "isValidBST(buildTree([8, 3, 10, 1, 6, null, 14]))"
    solution: |
      class TreeNode {
        constructor(val, left = null, right = null) {
          this.val = val;
          this.left = left;
          this.right = right;
        }
      }

      // Builds a tree from LeetCode's level-order array, where null means "no node".
      function buildTree(values) {
        if (values.length === 0 || values[0] === null) return null;
        const root = new TreeNode(values[0]);
        const queue = [root];
        let i = 1;
        for (let h = 0; h < queue.length && i < values.length; h++) {
          const node = queue[h];
          if (i < values.length && values[i] !== null) {
            node.left = new TreeNode(values[i]);
            queue.push(node.left);
          }
          i++;
          if (i < values.length && values[i] !== null) {
            node.right = new TreeNode(values[i]);
            queue.push(node.right);
          }
          i++;
        }
        return root;
      }

      // The reverse: a tree back into a level-order array.
      function treeToArray(root) {
        const out = [];
        const queue = [root];
        for (let h = 0; h < queue.length; h++) {
          const node = queue[h];
          if (node) {
            out.push(node.val);
            queue.push(node.left, node.right);
          } else {
            out.push(null);
          }
        }
        while (out.length > 0 && out[out.length - 1] === null) out.pop();
        return out;
      }


      function isValidBST(root) {
        function check(node, low, high) {
          if (node === null) return true;
          if (node.val <= low || node.val >= high) return false;
          return check(node.left, low, node.val) && check(node.right, node.val, high);
        }
        return check(root, -Infinity, Infinity);
      }
    hint: "Every node has an allowed range `(low, high)`. Going left, the new `high` is the node's value. Going right, the new `low` is the node's value."
