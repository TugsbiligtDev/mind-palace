  - kind: info
    title: "🔹 Self-balancing trees (recognition)"
    body: |
      A plain BST can become a chain if values arrive in sorted order, and then every operation is O(n). **Self-balancing** trees fix this by **rotating** nodes after inserts and deletes so the height stays about `log n`.

      - **AVL trees** keep every node's two sides within 1 level of each other.
      - **Red-black trees** use colour rules to keep the tree roughly balanced, with cheaper updates.

      You do not need to write one. Just know they exist to guarantee O(log n), and that the ordered maps of many languages are built on them. (JavaScript's `Map` is a hash map, not a tree.)

  - kind: why
    body: |
      The BST joins two ideas you already know: **binary search** (halve the search each step) and a **linked structure** (cheap inserts and deletes). It gives you both fast lookups and fast changes, which a sorted array cannot.

      The lesson to carry forward: an ordering rule stored in the *shape* of a structure is a powerful thing.

  - kind: recap
    body: |
      - **BST rule:** left subtree smaller, right subtree bigger, at every node.
      - Search, insert and delete walk down one path: **O(height)**, which is O(log n) if balanced and O(n) if it is a chain.
      - **Inorder** traversal of a BST is sorted, which gives the sorted list and the k-th smallest.
      - **Validate** with an allowed `(low, high)` range, not just direct children.
      - **Delete:** leaf, one child, or two children (replace with the inorder successor).
      - The **lowest common ancestor** is the first node where the two values split.
      - 🔹 AVL and red-black trees stay balanced by rotation.
