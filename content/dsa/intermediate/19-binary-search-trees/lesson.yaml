            } else {
              out.push(null);
            }
          }
          while (out.length > 0 && out[out.length - 1] === null) out.pop();
          return out;
        }


        function kthSmallest(root, k) {
          return root === null ? null : root.val;
        }

  - kind: explain
    title: Deleting a node
    body: |
      Deletion has three cases for the node to remove:

      1. **A leaf**: just remove it.
      2. **One child**: replace the node with that child.
      3. **Two children**: find its **inorder successor** (the smallest value in its right subtree), copy that value into the node, then delete the successor from the right subtree.

      Case 3 keeps the BST rule, because the successor is the next value in sorted order: bigger than everything on the left, and smaller than the rest of the right.

  - kind: code
    title: Delete a node
    body: |
      Write `deleteNode(root, key)`: remove the node with value `key` (if it exists) and return the root. The tests compare the **sorted values** left, so any correct approach works.
    code: |
      class TreeNode {
        constructor(val, left = null, right = null) {
          this.val = val;
          this.left = left;
          this.right = right;
