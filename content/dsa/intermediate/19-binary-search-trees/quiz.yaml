pass: 3
questions:
  - type: predict
    prompt: What does this print? (The BST inorder walk.)
    code: |
      const tree = {
        val: 4,
        left: { val: 2, left: { val: 1, left: null, right: null }, right: { val: 3, left: null, right: null } },
        right: { val: 6, left: null, right: null },
      };
      const out = [];
      (function walk(n) {
        if (n === null) return;
        walk(n.left);
        out.push(n.val);
        walk(n.right);
      })(tree);
      console.log(out);
    options: ["[ 1, 2, 3, 4, 6 ]", "[ 4, 2, 1, 3, 6 ]", "[ 1, 3, 2, 6, 4 ]", "[ 6, 4, 3, 2, 1 ]"]
    answer: 0
    explanation: Inorder (left, node, right) of a BST always lists the values in ascending order.
  - type: mcq
    prompt: You insert the values 1, 2, 3, 4, 5 in that order into an empty BST. What does it look like, and what is a search then?
    options:
      - Balanced, O(log n)
      - A chain leaning to the right, O(n)
      - A chain leaning to the left, O(1)
      - It refuses the values
    answer: 1
    explanation: Each new value is bigger than everything so far, so it always goes right. The tree has no branching, so searching walks all n nodes.
  - type: mcq
    prompt: Why is checking only a node's direct children not enough to validate a BST?
    options:
      - "It is enough: if every parent and child pair is in order, so is the tree"
      - A deeper node can break the rule with respect to a distant ancestor
      - Leaves can't be checked this way, because they have no children at all
      - Only the root needs checking, since every subtree is built from it
    answer: 1
    explanation: The rule applies to every node in a subtree. A value deep on the right side of the root must still be bigger than the root.
  - type: mcq
    prompt: When deleting a node with two children, which value replaces it?
    options: ["Its parent, which moves down to take its place", "Its inorder successor: the smallest value on its right", "Its left child, which moves up to take its place in the tree", "The root, which is then rebalanced afterwards"]
    answer: 1
    explanation: The successor is the next value in sorted order, so putting it in that spot keeps the BST rule intact.
  - type: mcq
    prompt: In a BST, the values `p` and `q` are both smaller than the current node. Where is their lowest common ancestor?
    options: ["At the current node", "In the left subtree", "In the right subtree", "Above the current node"]
    answer: 1
    explanation: Both live in the left subtree, so the deepest node that holds both must be there or below.
