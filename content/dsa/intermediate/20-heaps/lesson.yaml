steps:
  - kind: explain
    title: The priority queue problem
    body: |
      A **priority queue** is a queue where the item that leaves next is not the *oldest* but the *most important* (smallest or biggest). Think of an emergency room: the most urgent patient goes first, not the first to arrive.

      With an array, finding the smallest is O(n). With a sorted array, inserting is O(n). A **heap** does both in **O(log n)**, and reading the minimum is O(1).

      JavaScript has **no built-in heap**, so you write one. (LeetCode preloads a library for it, but interviewers expect you to be able to build your own.)

      **Example: the emergency room with a plain array.** Taking the most urgent patient means scanning every waiting patient (O(n)) each time:

      ```js
      const waiting = [
        { name: "Ana", urgency: 3 },
        { name: "Ben", urgency: 1 },   // 1 = most urgent
        { name: "Cy", urgency: 2 },
      ];

      function takeMostUrgent() {
        let best = 0;
        for (let i = 1; i < waiting.length; i++) {
          if (waiting[i].urgency < waiting[best].urgency) best = i;
        }
        return waiting.splice(best, 1)[0].name;
      }

      console.log(takeMostUrgent(), takeMostUrgent(), takeMostUrgent());
      ```

      prints:

      ```
      Ben Cy Ana
      ```

  - kind: code
    title: "Try it: a slow priority queue"
    body: |
      Run it: Ben, then Cy, then Ana, by urgency, not arrival. Then push a new patient with urgency `0` before the last line and run again. A heap gives the same order with O(log n) work per patient.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    code: |
