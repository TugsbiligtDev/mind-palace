    solution: |
      class MinHeap {
        constructor(compare = (a, b) => a - b) {
          this.data = [];
          this.compare = compare;
        }
        size() {
          return this.data.length;
        }
        peek() {
          return this.data[0];
        }
        push(x) {
          const d = this.data;
          d.push(x);
          let i = d.length - 1;
          while (i > 0) {
            const p = (i - 1) >> 1;
            if (this.compare(d[i], d[p]) >= 0) break;
            [d[i], d[p]] = [d[p], d[i]];
            i = p;
          }
        }
        pop() {
          const d = this.data;
          if (d.length === 0) return undefined;
          const top = d[0];
          const last = d.pop();
          if (d.length > 0) {
            d[0] = last;
            let i = 0;
            for (;;) {
              const l = 2 * i + 1;
              const r = l + 1;
              let m = i;
              if (l < d.length && this.compare(d[l], d[m]) < 0) m = l;
              if (r < d.length && this.compare(d[r], d[m]) < 0) m = r;
              if (m === i) break;
              [d[i], d[m]] = [d[m], d[i]];
              i = m;
            }
          }
          return top;
        }
      }


      class MedianFinder {
        constructor() {
          this.low = new MinHeap((a, b) => b - a);
          this.high = new MinHeap();
        }
        addNum(x) {
          this.low.push(x);
          this.high.push(this.low.pop());
          if (this.high.size() > this.low.size()) this.low.push(this.high.pop());
        }
        findMedian() {
          if (this.low.size() > this.high.size()) return this.low.peek();
          return (this.low.peek() + this.high.peek()) / 2;
        }
      }
    hint: "A neat way: push into `low`, move `low`'s top to `high`, and if `high` now has more items, move its top back to `low`. `low` is then never smaller than `high`."
