  - kind: code
    title: K closest points
    body: |
      Write `kClosest(points, k)`: the `k` points closest to the origin `(0, 0)`, as `[x, y]` pairs. The order of the answer does not matter. Compare **squared** distances (`x*x + y*y`), which avoids square roots.

      Keep a **max-heap of size k** (the farthest of your k candidates sits on top, so you can evict it).
    code: |
