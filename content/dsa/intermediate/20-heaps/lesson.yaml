  - kind: code
    title: Last stone weight
    body: |
      A pile of stones has weights. Each turn, smash the **two heaviest** together: if they are equal, both vanish. Otherwise the lighter vanishes and the heavier loses that much weight. Write `lastStoneWeight(stones)`: the weight of the last stone, or `0` if none remain.

      You need the **biggest** each time, so use a `MinHeap` with a flipped comparator: `new MinHeap((a, b) => b - a)`.
    code: |
      class MinHeap {
        constructor(compare = (a, b) => a - b) {
          this.data = [];
          this.compare = compare;
        }
        size() {
          return this.data.length;
        }
        peek() {
          return this.data[0];
        }
        push(x) {
          const d = this.data;
          d.push(x);
          let i = d.length - 1;
          while (i > 0) {
            const p = (i - 1) >> 1;
            if (this.compare(d[i], d[p]) >= 0) break;
            [d[i], d[p]] = [d[p], d[i]];
            i = p;
          }
        }
        pop() {
          const d = this.data;
          if (d.length === 0) return undefined;
          const top = d[0];
          const last = d.pop();
          if (d.length > 0) {
            d[0] = last;
            let i = 0;
            for (;;) {
              const l = 2 * i + 1;
              const r = l + 1;
              let m = i;
              if (l < d.length && this.compare(d[l], d[m]) < 0) m = l;
              if (r < d.length && this.compare(d[r], d[m]) < 0) m = r;
              if (m === i) break;
              [d[i], d[m]] = [d[m], d[i]];
              i = m;
            }
          }
          return top;
        }
      }


      function lastStoneWeight(stones) {
        return 0;
      }
    tests:
      - "lastStoneWeight([2, 7, 4, 1, 8, 1])"
      - "lastStoneWeight([1])"
      - "lastStoneWeight([2, 2])"
      - "lastStoneWeight([])"
      - "lastStoneWeight([10, 4, 2, 10])"
    solution: |
      class MinHeap {
        constructor(compare = (a, b) => a - b) {
          this.data = [];
          this.compare = compare;
        }
        size() {
          return this.data.length;
        }
        peek() {
          return this.data[0];
        }
        push(x) {
          const d = this.data;
          d.push(x);
          let i = d.length - 1;
          while (i > 0) {
            const p = (i - 1) >> 1;
            if (this.compare(d[i], d[p]) >= 0) break;
            [d[i], d[p]] = [d[p], d[i]];
            i = p;
          }
        }
        pop() {
          const d = this.data;
          if (d.length === 0) return undefined;
          const top = d[0];
          const last = d.pop();
          if (d.length > 0) {
            d[0] = last;
            let i = 0;
            for (;;) {
              const l = 2 * i + 1;
              const r = l + 1;
              let m = i;
              if (l < d.length && this.compare(d[l], d[m]) < 0) m = l;
              if (r < d.length && this.compare(d[r], d[m]) < 0) m = r;
              if (m === i) break;
              [d[i], d[m]] = [d[m], d[i]];
              i = m;
            }
          }
          return top;
        }
      }


      function lastStoneWeight(stones) {
        const heap = new MinHeap((a, b) => b - a);
        for (const s of stones) heap.push(s);
        while (heap.size() > 1) {
          const first = heap.pop();
          const second = heap.pop();
          if (first !== second) heap.push(first - second);
        }
        return heap.size() === 0 ? 0 : heap.peek();
      }
    hint: Pop twice, push the difference back if it is not zero, and repeat until at most one stone is left.
