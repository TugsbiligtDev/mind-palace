      function mergeKSorted(arrays) {
        const heap = new MinHeap((a, b) => a[0] - b[0]);
        arrays.forEach((arr, i) => {
          if (arr.length > 0) heap.push([arr[0], i, 0]);
        });
        const result = [];
        while (heap.size() > 0) {
          const [value, i, j] = heap.pop();
          result.push(value);
          if (j + 1 < arrays[i].length) heap.push([arrays[i][j + 1], i, j + 1]);
        }
        return result;
      }
    hint: Push `[value, arrayIndex, position]` triples. When you pop one, push the next item from the same array if it has one.
