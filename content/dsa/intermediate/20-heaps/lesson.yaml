  - kind: explain
    title: Push (sift-up) and pop (sift-down)
    body: |
      **Push:** add the new value at the **end** of the array (the next free spot), then **sift up**: while it is smaller than its parent, swap them. At most `log n` swaps.

      **Pop the minimum:** the minimum is at index 0. Remove it by moving the **last** item to the root, then **sift down**: swap it with its *smaller* child while that child is smaller than it. At most `log n` swaps.

      **Peek** is just `data[0]`: O(1).

      A comparator function `compare(a, b)` (negative if `a` should come out first) lets one class serve as a min-heap of numbers, a max-heap (flip the comparison), or a heap of pairs and objects.

      <!-- page -->

      **Example: push `0` onto `[1, 3, 2, 7, 4, 5, 9]`.**

      | step | array | 0 is at |
      |---|---|---|
      | add at the end | [1, 3, 2, 7, 4, 5, 9, 0] | 7 |
      | 0 < parent 7: swap | [1, 3, 2, 0, 4, 5, 9, 7] | 3 |
      | 0 < parent 3: swap | [1, 0, 2, 3, 4, 5, 9, 7] | 1 |
      | 0 < parent 1: swap | [0, 1, 2, 3, 4, 5, 9, 7] | 0 |

      **Then pop the minimum:**

      | step | array |
      |---|---|
      | take 0, move last (7) to the root | [7, 1, 2, 3, 4, 5, 9] |
      | 7 > smaller child 1: swap | [1, 7, 2, 3, 4, 5, 9] |
      | 7 > smaller child 3: swap | [1, 3, 2, 7, 4, 5, 9] |

      Three swaps each way for 8 items: about log₂ 8.

  - kind: code
    title: Write your own MinHeap
    body: |
      Finish the `MinHeap` class. The constructor accepts a `compare` function (default `(a, b) => a - b`).

      - `push(x)`: add and sift up,
      - `pop()`: remove and return the smallest (`undefined` if empty), then sift down,
      - `peek()`: the smallest without removing (`undefined` if empty),
      - `size()`: how many items.
    code: |
      class MinHeap {
        constructor(compare = (a, b) => a - b) {
          this.data = [];
          this.compare = compare;
        }
        size() {
          return 0;
        }
        peek() {}
        push(x) {}
        pop() {}
      }
    tests:
      - "(() => { const h = new MinHeap(); [5, 3, 8, 1, 9, 2].forEach((x) => h.push(x)); const out = []; while (h.size() > 0) out.push(h.pop()); return out; })()"
      - "(() => { const h = new MinHeap(); return [h.size(), h.peek(), h.pop()]; })()"
      - "(() => { const h = new MinHeap((a, b) => b - a); [4, 7, 1, 9].forEach((x) => h.push(x)); return [h.pop(), h.pop(), h.peek(), h.size()]; })()"
      - "(() => { const h = new MinHeap((a, b) => a[0] - b[0]); h.push([3, 'c']); h.push([1, 'a']); h.push([2, 'b']); return [h.pop()[1], h.peek()[1]]; })()"
      - "(() => { const h = new MinHeap(); for (let i = 5000; i > 0; i--) h.push(i); let ok = true; for (let i = 1; i <= 5000; i++) if (h.pop() !== i) ok = false; return ok; })()"
    solution: |
      class MinHeap {
        constructor(compare = (a, b) => a - b) {
          this.data = [];
          this.compare = compare;
        }
        size() {
          return this.data.length;
        }
        peek() {
          return this.data[0];
        }
        push(x) {
          const d = this.data;
          d.push(x);
          let i = d.length - 1;
          while (i > 0) {
            const parent = (i - 1) >> 1;
            if (this.compare(d[i], d[parent]) >= 0) break;
            [d[i], d[parent]] = [d[parent], d[i]];
            i = parent;
          }
        }
        pop() {
          const d = this.data;
          if (d.length === 0) return undefined;
          const top = d[0];
          const last = d.pop();
          if (d.length > 0) {
            d[0] = last;
            let i = 0;
            for (;;) {
              const left = 2 * i + 1;
              const right = left + 1;
              let smallest = i;
              if (left < d.length && this.compare(d[left], d[smallest]) < 0) smallest = left;
              if (right < d.length && this.compare(d[right], d[smallest]) < 0) smallest = right;
              if (smallest === i) break;
              [d[i], d[smallest]] = [d[smallest], d[i]];
              i = smallest;
            }
          }
          return top;
        }
      }
    hint: "Sift up: while `compare(child, parent) < 0`, swap. Sift down: pick the smaller of the two children, and swap while it is smaller than the item you are moving. Take care when the heap has just one item."
    reject:
      - |
        class MinHeap {
          constructor(compare = (a, b) => a - b) { this.data = []; this.compare = compare; }
          size() { return this.data.length; }
          peek() { return this.data[0]; }
          push(x) { this.data.push(x); }
          pop() { return this.data.shift(); }
        }

  - kind: explain
    title: Top-k problems, and the size-k heap
    body: |
      *"Find the k largest items."* Sorting everything costs O(n log n). A heap of size `k` does it in **O(n log k)**:

      - Keep a **min-heap of the k best so far**.
      - For each new item, push it. If the heap now holds more than `k`, **pop the smallest**.
      - At the end, the heap holds the k largest, and its root is the **k-th largest**.

      It also works on **streams**, where items arrive forever and you cannot sort them all. Compare with quickselect (Module 12): quickselect is O(n) but needs all the data at once. The heap works one item at a time.

      <!-- page -->

      **Example: the 3 largest of `5, 1, 9, 3, 7, 2, 8`.** (The heap is shown sorted so it's easy to read.)

      | item | heap after (smallest first) | dropped |
      |---|---|---|
      | 5 | [5] | — |
      | 1 | [1, 5] | — |
      | 9 | [1, 5, 9] | — |
      | 3 | [3, 5, 9] | 1 |
      | 7 | [5, 7, 9] | 3 |
      | 2 | [5, 7, 9] | 2 |
      | 8 | [7, 8, 9] | 5 |

      The heap ends with the 3 largest, `7, 8, 9`, and its root, 7, is the 3rd largest.

  - kind: code
    title: "Find the bug: the heap that keeps growing"
    body: |
      `KthLargest` tracks the `k`-th largest number in a stream. `add(val)` adds a number and returns the current k-th largest. It should keep only the `k` biggest numbers in a min-heap, but this version keeps everything, so it returns the smallest instead. Fix it. (A working `MinHeap` is provided.)
    code: |
      class MinHeap {
        constructor(compare = (a, b) => a - b) {
          this.data = [];
          this.compare = compare;
        }
        size() {
          return this.data.length;
        }
        peek() {
          return this.data[0];
        }
        push(x) {
          const d = this.data;
          d.push(x);
          let i = d.length - 1;
          while (i > 0) {
            const p = (i - 1) >> 1;
            if (this.compare(d[i], d[p]) >= 0) break;
            [d[i], d[p]] = [d[p], d[i]];
            i = p;
          }
        }
        pop() {
          const d = this.data;
          if (d.length === 0) return undefined;
          const top = d[0];
          const last = d.pop();
          if (d.length > 0) {
            d[0] = last;
            let i = 0;
            for (;;) {
              const l = 2 * i + 1;
              const r = l + 1;
              let m = i;
              if (l < d.length && this.compare(d[l], d[m]) < 0) m = l;
              if (r < d.length && this.compare(d[r], d[m]) < 0) m = r;
              if (m === i) break;
              [d[i], d[m]] = [d[m], d[i]];
              i = m;
            }
          }
          return top;
        }
      }


      class KthLargest {
        constructor(k, nums) {
          this.k = k;
          this.heap = new MinHeap();
          for (const n of nums) this.add(n);
        }
        add(val) {
          this.heap.push(val);
          return this.heap.peek();
        }
      }
    tests:
      - "(() => { const t = new KthLargest(3, [4, 5, 8, 2]); return [t.add(3), t.add(5), t.add(10), t.add(9), t.add(4)]; })()"
      - "(() => { const t = new KthLargest(1, []); return [t.add(-3), t.add(-2), t.add(-4), t.add(0), t.add(4)]; })()"
      - "(() => { const t = new KthLargest(2, [0]); return [t.add(-1), t.add(1), t.add(-2), t.add(-4), t.add(3)]; })()"
    solution: |
