            d[0] = last;
            let i = 0;
            for (;;) {
              const l = 2 * i + 1;
              const r = l + 1;
              let m = i;
              if (l < d.length && this.compare(d[l], d[m]) < 0) m = l;
              if (r < d.length && this.compare(d[r], d[m]) < 0) m = r;
              if (m === i) break;
              [d[i], d[m]] = [d[m], d[i]];
              i = m;
            }
          }
          return top;
        }
      }


      function kClosest(points, k) {
        return [];
      }
    unordered: true
    tests:
      - "kClosest([[1, 3], [-2, 2]], 1)"
      - "kClosest([[3, 3], [5, -1], [-2, 4]], 2)"
      - "kClosest([[0, 1], [1, 0]], 2)"
      - "kClosest([[5, 5]], 1)"
      - "kClosest([[1, 1], [2, 2], [3, 3], [0, 0]], 3)"
    solution: |
      class MinHeap {
        constructor(compare = (a, b) => a - b) {
          this.data = [];
          this.compare = compare;
        }
        size() {
          return this.data.length;
        }
        peek() {
          return this.data[0];
        }
        push(x) {
          const d = this.data;
          d.push(x);
          let i = d.length - 1;
          while (i > 0) {
            const p = (i - 1) >> 1;
            if (this.compare(d[i], d[p]) >= 0) break;
