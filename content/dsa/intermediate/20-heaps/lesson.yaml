  - kind: explain
    title: The median of a stream, two heaps
    body: |
      The **median** is the middle value of the sorted numbers. For a stream, sorting each time is too slow. Use **two heaps** that split the numbers into halves:

      - a **max-heap `low`** holding the smaller half (its top is the biggest of the small numbers),
      - a **min-heap `high`** holding the larger half (its top is the smallest of the big numbers).

      Keep them balanced (sizes differ by at most 1). Then the median is the top of the bigger heap, or the average of both tops when the sizes are equal. Adding a number costs O(log n) and reading the median is O(1).

      <!-- page -->

      **Example: the stream `5, 15, 1, 3, 8`.** (`low` shown biggest first, `high` smallest first.)

      | add | low (max-heap) | high (min-heap) | median |
      |---|---|---|---|
      | 5 | [5] | [] | 5 |
      | 15 | [5] | [15] | 10 |
      | 1 | [5, 1] | [15] | 5 |
      | 3 | [3, 1] | [5, 15] | 4 |
      | 8 | [5, 3, 1] | [8, 15] | 5 |

      When 3 arrived, `low` became too big, so its top (5) moved over to `high`. After all five numbers, sorted they are `1 3 5 8 15`, and the median is indeed 5.

