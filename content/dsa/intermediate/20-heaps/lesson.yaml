  - kind: why
    body: |
      A heap gives you "the best thing so far" in O(log n) without sorting everything. It is the engine behind schedulers, "top 10" lists, event simulations, and the shortest-path algorithm you will meet in Module 24.

      When you see "k largest", "k smallest", "merge k sorted", "median of a stream" or "process the most urgent first", think heap.

  - kind: recap
    body: |
      - A **heap** is a complete binary tree kept in an array. For index `i`: parent `(i - 1) >> 1`, children `2i + 1` and `2i + 2`.
      - **Push** adds at the end and sifts up. **Pop** moves the last item to the root and sifts down. Both are **O(log n)**. Peek is O(1).
      - Write it once with a **comparator** and it serves as a min-heap, a max-heap or a heap of objects.
      - **Top-k:** keep a heap of size `k` (O(n log k)). It works on streams.
      - **Merge k sorted lists:** heap of the current fronts, O(N log k).
      - **Median of a stream:** a max-heap for the lower half and a min-heap for the upper half, kept balanced.
