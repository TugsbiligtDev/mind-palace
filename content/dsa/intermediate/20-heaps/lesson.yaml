  - kind: explain
    title: Merging k sorted lists
    body: |
      You have `k` sorted lists and want one sorted list. Merging two is easy (two pointers). For `k` lists, the smallest remaining item is always at the **front of one of the k lists**. A heap of `k` fronts gives the overall smallest in `O(log k)`.

      Put `[value, listIndex, positionInList]` for each list's first item in a min-heap. Repeatedly pop the smallest, add it to the output, and push the next item from the same list.

      Total cost: `O(N log k)` for `N` items in all, far better than merging one after another.

      <!-- page -->

      **Example: merging `[1, 4, 7]`, `[2, 5]` and `[3, 6]`** (L0, L1, L2):

      | heap (value, list) | pop | push next from that list | output |
      |---|---|---|---|
      | 1(L0) 2(L1) 3(L2) | 1 | 4(L0) | [1] |
      | 2(L1) 3(L2) 4(L0) | 2 | 5(L1) | [1, 2] |
      | 3(L2) 4(L0) 5(L1) | 3 | 6(L2) | [1, 2, 3] |
      | 4(L0) 5(L1) 6(L2) | 4 | 7(L0) | [1, 2, 3, 4] |
      | 5(L1) 6(L2) 7(L0) | 5 | — | [1, 2, 3, 4, 5] |
      | 6(L2) 7(L0) | 6 | — | [1, 2, 3, 4, 5, 6] |
      | 7(L0) | 7 | — | [1, 2, 3, 4, 5, 6, 7] |

      The heap never held more than 3 items, one per list.

