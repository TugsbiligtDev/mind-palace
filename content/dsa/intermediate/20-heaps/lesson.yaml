  - kind: explain
    title: A tree stored in an array
    body: |
      A **binary heap** is a *complete* binary tree (every level full, except maybe the last, filled left to right) that obeys the **heap rule**: every parent is **smaller than or equal to** its children (a *min-heap*). So the **minimum is always at the root**.

      Because the tree is complete, it fits in a plain array with no pointers:

      ```
      index:  0   1   2   3   4   5   6
      value: [1,  3,  2,  7,  4,  5,  9]

                 1
               /   \
              3     2
             / \   / \
            7   4 5   9
      ```

      For the node at index `i`:
      - **parent** = `(i - 1) >> 1` (that is `Math.floor((i - 1) / 2)`),
      - **left child** = `2i + 1`,
      - **right child** = `2i + 2`.

      **Example.** The index rules on the array above:

      ```js
      const heap = [1, 3, 2, 7, 4, 5, 9];

      for (const i of [0, 1, 2]) {
        const left = heap[2 * i + 1], right = heap[2 * i + 2];
        console.log(`node ${heap[i]} at ${i}: children ${left} and ${right}`);
      }
      console.log("parent of 4 (index 4):", heap[(4 - 1) >> 1]);
      console.log("smallest:", heap[0]);
      ```

      prints:

      ```
      node 1 at 0: children 3 and 2
      node 3 at 1: children 7 and 4
      node 2 at 2: children 5 and 9
      parent of 4 (index 4): 3
      smallest: 1
      ```

  - kind: code
