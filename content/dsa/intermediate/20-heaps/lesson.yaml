            [d[i], d[p]] = [d[p], d[i]];
            i = p;
          }
        }
        pop() {
          const d = this.data;
          if (d.length === 0) return undefined;
          const top = d[0];
          const last = d.pop();
          if (d.length > 0) {
            d[0] = last;
