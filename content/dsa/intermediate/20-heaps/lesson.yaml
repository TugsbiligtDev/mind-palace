          const d = this.data;
          if (d.length === 0) return undefined;
          const top = d[0];
          const last = d.pop();
          if (d.length > 0) {
            d[0] = last;
            let i = 0;
            for (;;) {
              const l = 2 * i + 1;
              const r = l + 1;
              let m = i;
              if (l < d.length && this.compare(d[l], d[m]) < 0) m = l;
              if (r < d.length && this.compare(d[r], d[m]) < 0) m = r;
              if (m === i) break;
              [d[i], d[m]] = [d[m], d[i]];
              i = m;
            }
          }
          return top;
        }
