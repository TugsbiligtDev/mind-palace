questions:
  - type: predict
    prompt: What does this print? (BFS order from vertex 0.)
    code: |
      const graph = [[1, 2], [3], [3], []];
      const visited = new Set([0]);
      const queue = [0];
      const order = [];
      for (let head = 0; head < queue.length; head++) {
        const v = queue[head];
        order.push(v);
        for (const next of graph[v]) {
          if (!visited.has(next)) {
            visited.add(next);
            queue.push(next);
          }
        }
      }
      console.log(order);
    options: ["[ 0, 1, 2, 3 ]", "[ 0, 1, 3, 2 ]", "[ 0, 2, 1, 3 ]", "[ 3, 2, 1, 0 ]"]
    answer: 0
    explanation: BFS visits 0, then its neighbours 1 and 2, and finally 3 (reached from 1).
  - type: mcq
    prompt: Which structure does BFS use, and which does an iterative DFS use?
    options: ["BFS a stack, DFS a queue", "BFS a queue, DFS a stack", "Both a queue", "Both a heap"]
    answer: 1
    explanation: A queue finishes each ring before the next (BFS). A stack keeps diving into the most recent branch (DFS).
  - type: mcq
    prompt: Why must a graph traversal keep a visited set?
    options:
      - To make it faster; the result is the same without it
      - Cycles would make it loop forever, processing vertices again and again
      - Graphs can't have cycles, so it's only for neat output
      - To keep the vertices sorted in the exact order they were first found
    answer: 1
    explanation: Without it, a cycle sends you round and round the same vertices.
  - type: mcq
    prompt: In a directed graph, reaching a "grey" vertex during DFS means...
    options: ["A shortcut", "A cycle", "The end of the graph", "A new component"]
    answer: 1
    explanation: Grey means the vertex is on the current path, so you have found a route back to it.
  - type: mcq
    prompt: A grid has 3 separate groups of connected "1" cells. What does `numIslands` return?
    options: ["1", "3", "The number of 1 cells", "The number of rows"]
    answer: 1
    explanation: Each connected group is one island, so there are 3.
