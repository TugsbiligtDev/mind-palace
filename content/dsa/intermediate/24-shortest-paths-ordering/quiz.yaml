questions:
  - type: mcq
    prompt: You need the fewest steps between two cells in a maze where every move costs 1. Which algorithm?
    options: ["DFS", "BFS", "Sorting", "Binary search"]
    answer: 1
    explanation: BFS explores in rings of equal distance, so the first time it reaches the goal is via the shortest route.
  - type: predict
    prompt: What does this print? (Kahn's algorithm, order of courses.)
    code: |
      const graph = [[1, 2], [3], [3], []];
      const indegree = [0, 1, 1, 2];
      const order = [0];
      for (let head = 0; head < order.length; head++) {
        for (const next of graph[order[head]]) {
          indegree[next]--;
          if (indegree[next] === 0) order.push(next);
        }
      }
      console.log(order);
    options: ["[ 0, 1, 2, 3 ]", "[ 0, 3, 1, 2 ]", "[ 0, 1, 3 ]", "[ 3, 2, 1, 0 ]"]
    answer: 0
    explanation: 1 and 2 become free after 0 is processed, and 3 becomes free after both 1 and 2.
  - type: mcq
    prompt: After Kahn's algorithm, the order contains fewer vertices than the graph has. What does that mean?
    options: ["The graph is empty", "There is a cycle", "The graph is disconnected", "Some edges are weighted"]
    answer: 1
    explanation: Vertices on a cycle never reach in-degree 0, because each waits for another one on the cycle.
  - type: mcq
    prompt: Why can Dijkstra's algorithm not be used with negative edge weights?
    options:
      - It runs out of memory
      - Once a vertex is popped with its smallest distance, a later negative edge could still shorten it, which breaks the assumption
      - Heaps cannot store negative numbers
      - It can, with no problem
    answer: 1
    explanation: Dijkstra assumes the first time a vertex is settled is final. Negative edges can make a longer-looking route cheaper.
  - type: mcq
    prompt: In Dijkstra with a heap, why do you skip an entry when `d > dist[v]`?
    options:
      - It is an error
      - It is a stale entry from before a better route was found
      - It means a cycle
      - The vertex is unreachable
    answer: 1
    explanation: A vertex can be pushed several times as shorter routes appear. Only the newest, smallest entry matters.
