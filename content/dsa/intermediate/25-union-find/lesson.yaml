steps:
  - kind: explain
    title: Groups that merge
    body: |
      *Friends of friends are friends.* Given a stream of "A and B are friends" facts, you want to answer quickly: **are these two people in the same friend group?** and **how many groups are there now?**

      Traversal (Module 23) answers this for a fixed graph, but redoing a search after every new fact is slow. **Union-Find** (also called **Disjoint Set Union**) keeps the groups up to date and answers each question in almost **O(1)**.

  - kind: explain
    title: The parent array
    body: |
      Give every item a `parent`. At the start, each item is its own parent (its own group). A group is a little tree, and its **root** is the item whose parent is itself.

      - **`find(x)`**: follow parents up to the root. Two items are in the same group when they have the **same root**.
      - **`union(a, b)`**: find both roots. If they differ, make one root the parent of the other. The groups are merged.

      Two upgrades make it very fast:
      - **Path compression:** while finding, point every visited item **directly at the root**, so the next `find` is short.
      - **Union by size:** attach the **smaller** tree under the **bigger** one, so trees stay shallow.

      Together, each operation is effectively **O(1)** (technically O(α(n)), which is below 5 for any input you will ever see).

  - kind: code
    title: "Find the bug: linking items instead of roots"
    body: |
      This `UnionFind` merges groups, but its `union` links **the items themselves** instead of their **roots**. That cuts them loose from their old groups. Fix `union` so it merges the two groups, and returns `true` only if they were separate before.
    code: |
      class UnionFind {
        constructor(n) {
          this.parent = Array.from({ length: n }, (_, i) => i);
          this.components = n;
        }
        find(x) {
          while (this.parent[x] !== x) x = this.parent[x];
          return x;
        }
        union(a, b) {
          this.parent[a] = b;
          this.components--;
          return true;
        }
        connected(a, b) {
          return this.find(a) === this.find(b);
        }
        count() {
          return this.components;
        }
      }
    tests:
      - "(() => { const u = new UnionFind(4); u.union(0, 1); u.union(2, 3); u.union(0, 2); return [u.connected(0, 1), u.connected(1, 3), u.count()]; })()"
      - "(() => { const u = new UnionFind(3); return [u.union(0, 1), u.union(0, 1), u.union(1, 0), u.count()]; })()"
      - "(() => { const u = new UnionFind(5); u.union(0, 1); u.union(1, 2); u.union(3, 4); return [u.connected(0, 2), u.connected(2, 3), u.count()]; })()"
      - "(() => { const u = new UnionFind(3); return [u.connected(0, 0), u.connected(0, 1), u.count()]; })()"
    solution: |
      class UnionFind {
        constructor(n) {
          this.parent = Array.from({ length: n }, (_, i) => i);
          this.size = Array(n).fill(1);
          this.components = n;
        }
        find(x) {
          while (this.parent[x] !== x) {
            this.parent[x] = this.parent[this.parent[x]];
            x = this.parent[x];
          }
          return x;
        }
        union(a, b) {
          let rootA = this.find(a);
          let rootB = this.find(b);
          if (rootA === rootB) return false;
          if (this.size[rootA] < this.size[rootB]) [rootA, rootB] = [rootB, rootA];
          this.parent[rootB] = rootA;
          this.size[rootA] += this.size[rootB];
          this.components--;
          return true;
        }
        connected(a, b) {
          return this.find(a) === this.find(b);
        }
        count() {
          return this.components;
        }
      }
    hint: "Call `find` on both items first. If the roots are the same, return `false`. Otherwise link one **root** under the other and reduce the count. (Bonus: attach the smaller group under the bigger one, and compress the path inside `find`.)"
    broken_starter: true
    reject:
      - |
        class UnionFind {
          constructor(n) { this.parent = Array.from({ length: n }, (_, i) => i); this.components = n; }
          find(x) { while (this.parent[x] !== x) x = this.parent[x]; return x; }
          union(a, b) { this.parent[a] = b; this.components--; return true; }
          connected(a, b) { return this.find(a) === this.find(b); }
          count() { return this.components; }
        }

  - kind: code
    title: Number of provinces
    body: |
      `isConnected` is an `n × n` matrix where `isConnected[i][j] === 1` means city `i` and city `j` are directly connected (and the matrix is symmetric). A **province** is a group of cities connected directly or indirectly. Write `findCircleNum(isConnected)`: how many provinces there are.

      A `UnionFind` is easiest. Start with `n` groups and reduce the count for every successful merge.
    code: |
      function findCircleNum(isConnected) {
        return isConnected.length;
      }
    tests:
      - "findCircleNum([[1, 1, 0], [1, 1, 0], [0, 0, 1]])"
      - "findCircleNum([[1, 0, 0], [0, 1, 0], [0, 0, 1]])"
      - "findCircleNum([[1, 1, 1], [1, 1, 1], [1, 1, 1]])"
      - "findCircleNum([[1]])"
      - "findCircleNum([[1, 0, 0, 1], [0, 1, 1, 0], [0, 1, 1, 1], [1, 0, 1, 1]])"
    solution: |
      function findCircleNum(isConnected) {
        const n = isConnected.length;
        const parent = Array.from({ length: n }, (_, i) => i);
        const find = (x) => {
          while (parent[x] !== x) {
            parent[x] = parent[parent[x]];
            x = parent[x];
          }
          return x;
        };
        let provinces = n;
        for (let i = 0; i < n; i++) {
          for (let j = i + 1; j < n; j++) {
            if (isConnected[i][j] === 1) {
              const a = find(i);
              const b = find(j);
              if (a !== b) {
                parent[a] = b;
                provinces--;
              }
            }
          }
        }
        return provinces;
      }
    hint: Every time two cities with different roots are joined, the number of provinces drops by one.
    reject:
      - |
        function findCircleNum(isConnected) {
          return isConnected.length;
        }

  - kind: explain
    title: Redundant edges and cycles
    body: |
      When you add an edge `a — b` and **`a` and `b` are already connected**, the edge closes a **cycle**: it was redundant. With union-find you find out in an instant, because `union` returns `false`.

      That makes it perfect for:
      - **Finding the edge that breaks a tree** (the redundant connection),
      - **Checking whether a graph is a tree** (`n - 1` edges and no redundant edge),
      - **Kruskal's minimum spanning tree**, coming next.

  - kind: code
    title: Redundant connection
    body: |
      `edges` describes a tree (vertices `1 … n`) with **one extra edge** added, creating a single cycle. Write `redundantConnection(edges)`: the edge that, if removed, leaves a tree. If several work, return the one that appears **last** in the list.
    code: |
      function redundantConnection(edges) {
        return [];
      }
    tests:
      - "redundantConnection([[1, 2], [1, 3], [2, 3]])"
      - "redundantConnection([[1, 2], [2, 3], [3, 4], [1, 4], [1, 5]])"
      - "redundantConnection([[1, 2], [2, 3], [1, 3], [3, 4]])"
      - "redundantConnection([[1, 2], [1, 2]])"
    solution: |
      function redundantConnection(edges) {
        const parent = Array.from({ length: edges.length + 1 }, (_, i) => i);
        const find = (x) => {
          while (parent[x] !== x) {
            parent[x] = parent[parent[x]];
            x = parent[x];
          }
          return x;
        };
        for (const [a, b] of edges) {
          const rootA = find(a);
          const rootB = find(b);
          if (rootA === rootB) return [a, b];
          parent[rootA] = rootB;
        }
        return [];
      }
    hint: Process the edges in order. The first edge whose ends already share a root closes the cycle.
    reject:
      - |
        function redundantConnection(edges) {
          return edges[0];
        }

  - kind: explain
    title: Kruskal's minimum spanning tree
    body: |
      A **spanning tree** connects every vertex using just enough edges (`V − 1`, no cycles). A **minimum spanning tree** (MST) does so with the **smallest total weight**. Think of laying cable to connect every town for the least cost.

      **Kruskal's algorithm** is greedy:

      1. **Sort** all edges by weight, cheapest first.
      2. Go through them. If an edge joins **two different groups** (union-find `union` returns true), **take it**. If it would close a cycle, skip it.
      3. Stop when `V − 1` edges are taken.

      Time: **O(E log E)**, mostly the sort. 🔹 **Prim's algorithm** builds the tree from one vertex outwards with a heap, and gives the same weight.

  - kind: code
    title: Minimum spanning tree weight
    body: |
      Write `mstWeight(n, edges)`: vertices are `0 … n-1` and each edge is `[u, v, weight]`. Return the total weight of a minimum spanning tree, or `-1` if the graph is not connected.
    code: |
      function mstWeight(n, edges) {
        return -1;
      }
    tests:
      - "mstWeight(4, [[0, 1, 1], [1, 2, 2], [2, 3, 3], [0, 3, 10], [0, 2, 4]])"
      - "mstWeight(3, [[0, 1, 5]])"
      - "mstWeight(1, [])"
      - "mstWeight(3, [[0, 1, 2], [1, 2, 2], [0, 2, 2]])"
      - "mstWeight(5, [[0, 1, 4], [0, 2, 3], [1, 2, 1], [1, 3, 2], [2, 3, 4], [3, 4, 2]])"
    solution: |
      function mstWeight(n, edges) {
        const parent = Array.from({ length: n }, (_, i) => i);
        const find = (x) => {
          while (parent[x] !== x) {
            parent[x] = parent[parent[x]];
            x = parent[x];
          }
          return x;
        };
        const sorted = [...edges].sort((a, b) => a[2] - b[2]);
        let total = 0;
        let used = 0;
        for (const [u, v, w] of sorted) {
          const a = find(u);
          const b = find(v);
          if (a === b) continue;
          parent[a] = b;
          total += w;
          used++;
        }
        return used === n - 1 ? total : -1;
      }
    hint: Sort by weight. Take an edge only if its ends have different roots. At the end, a connected graph has used exactly `n - 1` edges.
    reject:
      - |
        function mstWeight(n, edges) {
          return edges.reduce((sum, e) => sum + e[2], 0);
        }

  - kind: why
    body: |
      Union-Find is a tiny structure (an array and two short functions) that does something traversal cannot: it handles **groups that keep merging**, and answers "same group?" in about O(1).

      It shows up in social networks, image processing (merging regions), network cabling, and any problem that says "connected", "groups" or "cycle" while edges keep arriving.

  - kind: recap
    body: |
      - **Union-Find** keeps groups of items: `find(x)` gives the group's root, `union(a, b)` merges two groups.
      - Speed-ups: **path compression** and **union by size** make each operation nearly **O(1)**.
      - `union` must link the **roots**, not the items themselves. It returns `false` when both were already in one group.
      - An edge whose ends are already connected is a **redundant edge** (it closes a cycle).
      - **Kruskal's MST:** sort edges by weight, and keep each edge that joins two different groups.
      - 🔹 **Prim's** algorithm builds an MST from one vertex outward using a heap.
