      - "planRoute(JSON.stringify({ cities: ['Ulaanbaatar', 'Darkhan', 'Erdenet', 'Sukhbaatar', 'Choibalsan', 'Khovd', 'Sainshand'], roads: [['Ulaanbaatar', 'Darkhan', 220], ['Ulaanbaatar', 'Erdenet', 400], ['Darkhan', 'Erdenet', 150], ['Darkhan', 'Sukhbaatar', 120], ['Ulaanbaatar', 'Choibalsan', 660]] }), 'Darkhan', 'S')"
      - "planRoute(JSON.stringify({ cities: ['Ulaanbaatar', 'Darkhan', 'Erdenet', 'Sukhbaatar', 'Choibalsan', 'Khovd', 'Sainshand'], roads: [['Ulaanbaatar', 'Darkhan', 220], ['Ulaanbaatar', 'Erdenet', 400], ['Darkhan', 'Erdenet', 150], ['Darkhan', 'Sukhbaatar', 120], ['Ulaanbaatar', 'Choibalsan', 660]] }), 'darkhan', 'DARKHAN')"
      - "planRoute(JSON.stringify({ cities: ['Ulaanbaatar', 'Darkhan', 'Erdenet', 'Sukhbaatar', 'Choibalsan', 'Khovd', 'Sainshand'], roads: [['Ulaanbaatar', 'Darkhan', 220], ['Ulaanbaatar', 'Erdenet', 400], ['Darkhan', 'Erdenet', 150], ['Darkhan', 'Sukhbaatar', 120], ['Ulaanbaatar', 'Choibalsan', 660]] }), '', 'Darkhan')"
    solution: |
      class MinHeap {
        constructor(compare = (a, b) => a - b) {
          this.data = [];
          this.compare = compare;
        }
        size() {
          return this.data.length;
        }
        peek() {
          return this.data[0];
        }
        push(x) {
          const d = this.data;
          d.push(x);
          let i = d.length - 1;
          while (i > 0) {
            const p = (i - 1) >> 1;
            if (this.compare(d[i], d[p]) >= 0) break;
            [d[i], d[p]] = [d[p], d[i]];
            i = p;
          }
        }
        pop() {
          const d = this.data;
          if (d.length === 0) return undefined;
          const top = d[0];
          const last = d.pop();
          if (d.length > 0) {
            d[0] = last;
            let i = 0;
            for (;;) {
              const l = 2 * i + 1;
              const r = l + 1;
              let m = i;
              if (l < d.length && this.compare(d[l], d[m]) < 0) m = l;
              if (r < d.length && this.compare(d[r], d[m]) < 0) m = r;
              if (m === i) break;
              [d[i], d[m]] = [d[m], d[i]];
              i = m;
            }
          }
          return top;
        }
      }


      function buildRoadMap(json) {
        const data = JSON.parse(json);
        const map = new Map();
        for (const city of data.cities) map.set(city, []);
        for (const [a, b, km] of data.roads) {
          map.get(a).push([b, km]);
          map.get(b).push([a, km]);
        }
        return map;
      }


      function shortestRoute(map, from, to) {
        const dist = new Map([[from, 0]]);
        const previous = new Map();
        const heap = new MinHeap((a, b) => a[0] - b[0]);
        heap.push([0, from]);
        while (heap.size() > 0) {
          const [d, city] = heap.pop();
          if (d > dist.get(city)) continue;
          if (city === to) break;
          for (const [next, km] of map.get(city)) {
            const nd = d + km;
            if (!dist.has(next) || nd < dist.get(next)) {
              dist.set(next, nd);
              previous.set(next, city);
              heap.push([nd, next]);
            }
          }
        }
        if (!dist.has(to)) return null;
        const path = [to];
        while (path[path.length - 1] !== from) path.push(previous.get(path[path.length - 1]));
        return { distance: dist.get(to), path: path.reverse() };
      }


      function planRoute(json, fromText, toText) {
        const map = buildRoadMap(json);
        const cities = [...map.keys()];
        const resolve = (text) => {
          const lower = text.toLowerCase();
          const exact = cities.find((c) => c.toLowerCase() === lower);
          if (exact) return exact;
          const matches = cities.filter((c) => c.toLowerCase().startsWith(lower));
          return lower !== "" && matches.length === 1 ? matches[0] : null;
        };
        const from = resolve(fromText);
        if (from === null) return `Unknown city: ${fromText}`;
        const to = resolve(toText);
        if (to === null) return `Unknown city: ${toText}`;
        const route = shortestRoute(map, from, to);
        if (route === null) return `No route from ${from} to ${to}`;
        return `${route.path.join(" -> ")} (${route.distance} km)`;
      }
