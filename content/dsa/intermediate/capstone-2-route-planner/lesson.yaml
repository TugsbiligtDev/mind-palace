  - kind: why
    body: |
      This small tool is the same shape as a real map service: parse data, build a graph, run a shortest-path algorithm, and wrap it in a friendly interface. Each piece is something you built and understand: a heap for the priority queue, Dijkstra for the routes, and a trie for the typing.

      Real systems add more data and more speed tricks, but the core ideas are exactly these.

  - kind: recap
    body: |
      - `JSON.parse` turns map text into data, and `buildRoadMap` makes a weighted adjacency list. Roads work both ways.
      - **Dijkstra with a MinHeap** finds the cheapest route. Keep a `previous` map to rebuild the path.
      - A **trie** with a list of names in each node gives fast, case-insensitive autocomplete.
      - `planRoute` combines resolving names, routing and formatting the result.
      - The Intermediate level is complete: you can recognise the major patterns and model real problems as graphs and trees.
