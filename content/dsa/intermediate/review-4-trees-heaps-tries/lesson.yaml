  - kind: code
    title: "4. Cheapest ropes"
    body: |
      You have ropes of given lengths and must join them into one. Joining two ropes costs the **sum of their lengths**. Write `connectRopes(ropes)`: the **minimum total cost** to join them all. `[4, 3, 2, 6]` costs `29`.

      A `MinHeap` is provided.
    code: |
      class MinHeap {
        constructor(compare = (a, b) => a - b) {
          this.data = [];
          this.compare = compare;
        }
        size() {
          return this.data.length;
        }
        peek() {
          return this.data[0];
        }
        push(x) {
          const d = this.data;
          d.push(x);
          let i = d.length - 1;
          while (i > 0) {
            const p = (i - 1) >> 1;
            if (this.compare(d[i], d[p]) >= 0) break;
            [d[i], d[p]] = [d[p], d[i]];
            i = p;
          }
        }
        pop() {
          const d = this.data;
          if (d.length === 0) return undefined;
          const top = d[0];
          const last = d.pop();
          if (d.length > 0) {
            d[0] = last;
            let i = 0;
            for (;;) {
              const l = 2 * i + 1;
              const r = l + 1;
              let m = i;
              if (l < d.length && this.compare(d[l], d[m]) < 0) m = l;
              if (r < d.length && this.compare(d[r], d[m]) < 0) m = r;
              if (m === i) break;
              [d[i], d[m]] = [d[m], d[i]];
              i = m;
            }
          }
          return top;
        }
      }


      function connectRopes(ropes) {
        // your code
        return 0;
      }
    tests:
      - "connectRopes([4, 3, 2, 6])"
      - "connectRopes([1, 2, 3, 4, 5])"
      - "connectRopes([5])"
      - "connectRopes([])"
      - "connectRopes([2, 2])"
    solution: |
      class MinHeap {
        constructor(compare = (a, b) => a - b) {
          this.data = [];
          this.compare = compare;
        }
        size() {
          return this.data.length;
        }
        peek() {
          return this.data[0];
        }
        push(x) {
          const d = this.data;
          d.push(x);
          let i = d.length - 1;
          while (i > 0) {
            const p = (i - 1) >> 1;
            if (this.compare(d[i], d[p]) >= 0) break;
            [d[i], d[p]] = [d[p], d[i]];
            i = p;
          }
        }
        pop() {
          const d = this.data;
          if (d.length === 0) return undefined;
          const top = d[0];
          const last = d.pop();
          if (d.length > 0) {
            d[0] = last;
            let i = 0;
            for (;;) {
              const l = 2 * i + 1;
              const r = l + 1;
              let m = i;
              if (l < d.length && this.compare(d[l], d[m]) < 0) m = l;
              if (r < d.length && this.compare(d[r], d[m]) < 0) m = r;
              if (m === i) break;
              [d[i], d[m]] = [d[m], d[i]];
              i = m;
            }
          }
          return top;
        }
      }


      function connectRopes(ropes) {
        const heap = new MinHeap();
        for (const r of ropes) heap.push(r);
        let cost = 0;
        while (heap.size() > 1) {
          const joined = heap.pop() + heap.pop();
          cost += joined;
          heap.push(joined);
        }
        return cost;
      }
    hint: Always join the two shortest ropes. Push the joined rope back so it can be joined again.
