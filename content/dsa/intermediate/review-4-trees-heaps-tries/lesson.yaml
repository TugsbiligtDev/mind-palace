      function lca(root, p, q) {
        function find(node) {
          if (node === null) return null;
          if (node.val === p || node.val === q) return node;
          const left = find(node.left);
          const right = find(node.right);
          if (left !== null && right !== null) return node;
          return left !== null ? left : right;
