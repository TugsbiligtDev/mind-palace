steps:
  - kind: explain
    title: Pick the structure
    body: |
      Six questions across trees, heaps and tries. Ask yourself first:

      - Is it about **levels, depth or paths**? (tree traversal)
      - Is there an **ordering rule** I can use to skip half? (BST)
      - Do I need **the best so far**, repeatedly? (heap)
      - Is it about **shared beginnings of words**? (trie)

      The tree helpers (`TreeNode`, `buildTree`, `treeToArray`) are in the editor when a question uses trees.

  - kind: code
    title: "1. Mirror image"
    body: |
      Write `isSymmetric(root)`: `true` if the tree is a mirror image of itself around its centre. `[1, 2, 2, 3, 4, 4, 3]` is symmetric. `[1, 2, 2, null, 3, null, 3]` is not.
    code: |
      class TreeNode {
        constructor(val, left = null, right = null) {
          this.val = val;
          this.left = left;
          this.right = right;
        }
      }

      // Builds a tree from LeetCode's level-order array, where null means "no node".
      function buildTree(values) {
        if (values.length === 0 || values[0] === null) return null;
        const root = new TreeNode(values[0]);
        const queue = [root];
        let i = 1;
        for (let h = 0; h < queue.length && i < values.length; h++) {
          const node = queue[h];
          if (i < values.length && values[i] !== null) {
            node.left = new TreeNode(values[i]);
            queue.push(node.left);
          }
          i++;
          if (i < values.length && values[i] !== null) {
            node.right = new TreeNode(values[i]);
            queue.push(node.right);
          }
          i++;
        }
        return root;
      }

      // The reverse: a tree back into a level-order array.
      function treeToArray(root) {
        const out = [];
        const queue = [root];
        for (let h = 0; h < queue.length; h++) {
          const node = queue[h];
          if (node) {
            out.push(node.val);
            queue.push(node.left, node.right);
          } else {
            out.push(null);
          }
        }
        while (out.length > 0 && out[out.length - 1] === null) out.pop();
        return out;
      }


      function isSymmetric(root) {
        // your code
        return false;
      }
    tests:
      - "isSymmetric(buildTree([1, 2, 2, 3, 4, 4, 3]))"
      - "isSymmetric(buildTree([1, 2, 2, null, 3, null, 3]))"
      - "isSymmetric(buildTree([]))"
      - "isSymmetric(buildTree([1]))"
      - "isSymmetric(buildTree([1, 2, 3]))"
