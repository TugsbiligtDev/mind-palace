  - kind: code
    title: "5. Most frequent words"
    body: |
      Write `topKWords(words, k)`: the `k` most frequent words, most frequent first. When two words have the same count, the **alphabetically smaller** word comes first.
    code: |
      function topKWords(words, k) {
        // your code
        return [];
      }
    tests:
      - "topKWords(['i', 'love', 'leetcode', 'i', 'love', 'coding'], 2)"
      - "topKWords(['the', 'day', 'is', 'sunny', 'the', 'the', 'the', 'sunny', 'is', 'is'], 4)"
      - "topKWords(['a'], 1)"
      - "topKWords(['b', 'a'], 2)"
      - "topKWords([], 3)"
    solution: |
      function topKWords(words, k) {
        const counts = new Map();
        for (const w of words) counts.set(w, (counts.get(w) || 0) + 1);
        return [...counts.keys()]
          .sort((a, b) => counts.get(b) - counts.get(a) || (a < b ? -1 : a > b ? 1 : 0))
          .slice(0, k);
      }
    hint: Count with a Map, then sort by count (descending) and, on ties, alphabetically. A heap also works, but sorting is fine here.
    reject:
      - |
        function topKWords(words, k) {
          return [...new Set(words)].slice(0, k);
        }

  - kind: code
    title: "6. Words with a common start"
    body: |
      Write `longestCommonPrefix(words)` using a **trie**: insert every word, then walk from the root while a node has exactly one child and is not the end of a word. Return the prefix you walked. (A working `Trie` node structure is up to you.)
    code: |
      function longestCommonPrefix(words) {
        // your code
        return "";
      }
    tests:
      - "longestCommonPrefix(['flower', 'flow', 'flight'])"
      - "longestCommonPrefix(['dog', 'racecar', 'car'])"
      - "longestCommonPrefix(['interview', 'internet', 'internal', 'interval'])"
      - "longestCommonPrefix(['a'])"
      - "longestCommonPrefix([])"
      - "longestCommonPrefix(['ab', 'ab'])"
    solution: |
      function longestCommonPrefix(words) {
        if (words.length === 0) return "";
        const root = { children: new Map(), isEnd: false };
        for (const word of words) {
          let node = root;
          for (const ch of word) {
            if (!node.children.has(ch)) node.children.set(ch, { children: new Map(), isEnd: false });
            node = node.children.get(ch);
          }
          node.isEnd = true;
        }
        let prefix = "";
        let node = root;
        while (node.children.size === 1 && !node.isEnd) {
          const [ch, next] = [...node.children][0];
          prefix += ch;
          node = next;
        }
        return prefix;
      }
    hint: Stop when a node has two or more children (the words split), or when a word ends there.
    reject:
      - |
        function longestCommonPrefix(words) {
          return words.length ? words[0] : "";
        }

  - kind: why
    body: |
      Each structure answers a different question about data. Trees answer "what is inside this?", search trees "where would this go?", heaps "what is best right now?", and tries "what starts like this?". Choosing among them is the real skill.

  - kind: recap
    body: |
      - Symmetry, ancestors and paths are **recursive tree** problems (two subtrees compared at once, or "return something when found").
      - A **BST** lets you skip half the tree per step.
      - A **min-heap** joins the smallest items greedily (ropes) and finds top-k.
      - A **trie** exposes shared prefixes: a node with one child and no word end is still a common prefix.
