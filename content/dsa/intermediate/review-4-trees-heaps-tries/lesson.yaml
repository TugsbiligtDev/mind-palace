      function closestValue(root, target) {
        let best = root.val;
        let node = root;
        while (node !== null) {
          if (Math.abs(node.val - target) < Math.abs(best - target)) best = node.val;
          node = target < node.val ? node.left : node.right;
        }
        return best;
      }
