steps:
  - kind: explain
    title: The terminal is the real workshop
    body: |
      Graphical windows are nice, but security work happens in the **terminal** — a text window where you type a command and the computer answers in text. Every tool you will use, and most servers you will ever touch, are driven this way. It is faster, it is scriptable, and often it is the *only* way in.

      The program that reads your commands is the **shell**. Linux usually uses one called **bash**; your Mac uses a close relative called **zsh**. The commands in this module work the same in both — which means you can practise right now on your own Mac.

      You will see a **prompt** waiting for you, ending in `$`. You type after it and press Return.

      **Example.** On the Kali lab machine (the one you build in the capstone) the prompt shows *who* you are, the machine's name and *where* you are. Here `whoami` ("who am I logged in as?") is typed and the answer appears underneath:

      ```
      kali@kali:~$ whoami
      kali
      ```

      Read the prompt as: user `kali`, on the machine called `kali`, in the folder `~` (your home). On your Mac the prompt looks a little different (something like `ada@MacBook ~ %`), but it works the same way.

  - kind: mac
    title: Open your terminal and look around
    body: |
      On your Mac, open **Terminal** (press ⌘-Space, type "Terminal", Return). Then run these one at a time and read each answer.

      - `pwd` = **p**rint **w**orking **d**irectory → "where am I right now?"
      - `ls` = **l**i**s**t → "what is in this folder?"
      - `ls -la` → the same, but *long* and *all* (including hidden files that start with a dot)

      Hidden dot-files like `.ssh` or `.bash_history` are exactly where investigators look first, so always use `-a` when poking around.

      **Example** from the Kali lab machine (your Mac will show your own folders):

      ```
      kali@kali:~$ pwd
      /home/kali
      kali@kali:~$ ls
      Desktop  Documents  Downloads  recon
      kali@kali:~$ ls -la
      total 40
      drwx------ 8 kali kali 4096 Oct 14 09:12 .
      drwxr-xr-x 3 root root 4096 Sep  2 18:40 ..
      -rw------- 1 kali kali  913 Oct 14 09:10 .bash_history
      drwx------ 2 kali kali 4096 Sep  2 18:41 .ssh
      -rw-r--r-- 1 kali kali 5551 Sep  2 18:40 .zshrc
      drwxr-xr-x 2 kali kali 4096 Sep  2 18:41 Desktop
      drwxr-xr-x 2 kali kali 4096 Sep  2 18:41 Documents
      drwxr-xr-x 2 kali kali 4096 Oct 10 16:03 Downloads
      drwxr-xr-x 2 kali kali 4096 Oct 14 09:05 recon
      ```

      Plain `ls` showed four folders. `ls -la` shows the hidden dot-files too (`.ssh`, `.bash_history`), plus details on each line. `.` means "this folder" and `..` means "the folder above".
    commands: |
      pwd
      ls
      ls -la
  - kind: explain
    title: Moving around the tree
    body: |
      You move through the folder tree with **cd** (**c**hange **d**irectory). A few shortcuts do most of the work:

      | Command | Meaning |
      |---|---|
      | `cd Documents` | go *into* the Documents folder (relative to where you are) |
      | `cd ..` | go *up* one level to the parent folder |
      | `cd ~` | go to your home folder (`~` means "my home") |
      | `cd /` | go to the very top, the root |
      | `cd -` | jump back to the folder you were just in |

      A **path** starting with `/` is **absolute** (the full address). A path with no leading slash is **relative** (from where you stand). Confusing the two is the single most common beginner mistake.

      <!-- page -->

      **Example: a short walk.** Watch the prompt and `pwd` change after each `cd`:

      ```
      kali@kali:~$ cd recon
      kali@kali:~/recon$ pwd
      /home/kali/recon
      kali@kali:~/recon$ cd ..
      kali@kali:~$ pwd
      /home/kali
      kali@kali:~$ cd /
      kali@kali:/$ pwd
      /
      kali@kali:/$ cd -
      /home/kali
      kali@kali:~$ cd ~
      kali@kali:~$ pwd
      /home/kali
      ```

      `cd recon` is relative (it worked because `recon` is inside the folder we were in). `cd /` is absolute. `cd -` prints the folder it jumps back to. `cd` itself prints nothing when it works: silence means success.

  - kind: mac
    title: Walk the tree
    body: |
      Practise moving around. Nothing here changes a single file — you are only looking.
    commands: |
      cd ~
      pwd
      cd ..
      pwd
      cd ~/Desktop
      ls
      cd -
  - kind: explain
    title: Looking at files
    body: |
      Once you find a file, you read it without opening any app:

      - `cat notes.txt` — dump the whole file to the screen (good for short files)
      - `less notes.txt` — page through a long file (Space for next page, `q` to quit)
      - `head notes.txt` / `tail notes.txt` — just the first / last ten lines
      - `tail -f server.log` — *follow* a file live as new lines are written (how you watch logs during a test)

      To an investigator, `cat /etc/passwd` (the account list) or `tail -f` on a log is daily bread.

      <!-- page -->

      **Examples** on two files in the Kali lab's `recon` folder: a short `notes.txt` and a longer `scan-log.txt`. Add `-n` and a number to `head` or `tail` to choose how many lines:

      ```
      kali@kali:~/recon$ cat notes.txt
      target: 192.168.56.101
      open ports: 22, 80
      todo: look at the web page
      kali@kali:~/recon$ head -n 2 scan-log.txt
      09:01 scan started
      09:01 192.168.56.101 is up
      kali@kali:~/recon$ tail -n 2 scan-log.txt
      09:04 port 80 open
      09:05 scan finished
      ```

      `tail -f scan-log.txt` prints the last lines and then *waits*, adding each new line as it is written. Press **Ctrl-C** to stop following. `less scan-log.txt` fills the screen with the file instead; there is no output to copy, you just read and press `q`.

  - kind: mac
    title: "Try it: read files on your Mac"
    body: |
      Your Mac has the same reading commands. These read small system files that every Mac has; nothing is changed.

      - `/etc/shells` lists the shells your Mac allows.
      - `/etc/passwd` is the account list (the same file investigators read on Linux).

      `less` fills the screen: press Space to move on and **`q` to quit**.
    commands: |
      cat /etc/shells
      head -n 3 /etc/passwd
      tail -n 2 /etc/passwd
      less /etc/passwd

  - kind: explain
    title: Making and changing files
    body: |
      Now the commands that *create* and *move* things:

      | Command | What it does |
      |---|---|
      | `mkdir recon` | make a new folder called `recon` |
      | `touch notes.txt` | create an empty file (or update its timestamp) |
      | `cp a.txt b.txt` | **c**o**p**y a.txt to b.txt |
      | `mv a.txt archive/` | **m**o**v**e (or rename) a.txt |
      | `rm notes.txt` | **r**e**m**ove (delete) a file |

      Build the habit of making a fresh folder for each target or task. Tidy notes are what separate a professional from a mess.

      <!-- page -->

      **Example: set up a folder for a new lab target.** These commands print nothing when they work, so `ls` is run after them to see the result:

      ```
      kali@kali:~$ mkdir target-101
      kali@kali:~$ cd target-101
      kali@kali:~/target-101$ touch findings.txt
      kali@kali:~/target-101$ cp findings.txt findings-backup.txt
      kali@kali:~/target-101$ ls
      findings-backup.txt  findings.txt
      kali@kali:~/target-101$ mv findings-backup.txt old-findings.txt
      kali@kali:~/target-101$ ls
      findings.txt  old-findings.txt
      kali@kali:~/target-101$ rm old-findings.txt
      kali@kali:~/target-101$ ls
      findings.txt
      ```

      `cp` made a second file, `mv` renamed it, and `rm` deleted it. No message, no Trash: it is simply gone.

  - kind: mac
    title: Build a practice folder
    body: |
      Make a safe sandbox on your Desktop, create a file, copy and rename it, then look.
    commands: |
      cd ~/Desktop
      mkdir hacking-practice
      cd hacking-practice
      touch notes.txt
      cp notes.txt backup.txt
      mv backup.txt renamed.txt
      ls
  - kind: explain
    title: "⚠️ rm does not ask twice"
    body: |
      The terminal assumes you mean what you say. **`rm` deletes immediately and permanently** — there is no Trash, no "are you sure?". Two commands have ended more careers and lab machines than any exploit:

      - `rm -rf something` — delete a folder and *everything inside it*, forcing past any warning.
      - `rm -rf /` — attempt to delete the entire system. **Never run this.**

      Rules that keep you safe:

      1. Read an `rm` command twice before pressing Return — especially the path.
      2. Be certain where you are first (`pwd`), because a relative path deletes from *here*.
      3. On your own machine, `rm -i` asks before each delete. Use it while learning.

      **Example of `rm -i`.** It asks first; type `y` to delete or `n` to keep the file:

      ```
      kali@kali:~/target-101$ rm -i findings.txt
      rm: remove regular empty file 'findings.txt'? n
      kali@kali:~/target-101$ ls
      findings.txt
      ```

      The answer was `n`, so the file is still there.

      This caution is itself a security lesson: the same blind obedience that lets you automate also lets a careless command — or a malicious one — wreck everything.

  - kind: mac
    title: "Try it: rm -i asks first"
    body: |
      Use the practice folder you just built. `rm -i` asks before deleting: answer **`n`** the first time and check the file is still there with `ls`. Then run it again and answer `y`.
    commands: |
      cd ~/Desktop/hacking-practice
      rm -i renamed.txt
      ls
      rm -i renamed.txt
      ls

  - kind: choice
    title: "Quick check: before you press Return"
    body: |
      You want to delete the folder `old-scans` with `rm -rf old-scans`. What should you do **first**?
    options:
      - "Add sudo so it can't fail"
      - "Run pwd to be sure which folder you are in, and reread the path"
      - "Nothing: rm asks before deleting a folder"
    answer: 1
    explanation: |
      `old-scans` is a relative path, so it deletes from wherever you are standing. `pwd` and a second read are what stop a disaster. `rm` never asks unless you add `-i`, and `sudo` only makes a mistake bigger.

  - kind: explain
    title: Finding things — find and grep
    body: |
      Two search commands are so useful they show up in nearly every engagement:

      - **`find`** searches for *files by name or property*:
        `find /var -name "*.conf"` → every `.conf` file under `/var`.
      - **`grep`** searches for *text inside files*:
        `grep "password" config.php` → every line containing the word password.

      Combine them with a **pipe** `|` (you will study pipes in Module 5) to search inside many files at once:
      `grep -r "api_key" .` searches the current folder and everything below it for `api_key`. Hunting config files for leaked secrets is often step one after you get access.

      <!-- page -->

      **Examples** inside a practice web app folder, `webapp`, copied into the Kali lab:

      ```
      kali@kali:~/webapp$ find . -name "*.conf"
      ./config/site.conf
      ./config/mail.conf
      kali@kali:~/webapp$ grep "user" config/db.php
      $db_user = "shop";
      kali@kali:~/webapp$ grep -r "admin" .
      ./config/site.conf:admin_email = admin@lab.local
      ./templates/footer.html:<a href="/admin/">Staff area</a>
      ```

      `find` answered with file *names*. `grep` answered with the matching *lines*; with `-r` it also says which file each line came from, before the `:`.

  - kind: mac
    title: "Try it: find and grep on your Mac"
    body: |
      Search your own Mac. `find` lists the `.txt` files in your practice folder; `grep` shows the lines of the account list that mention `root`; `grep -r` searches every file under `/etc/ssh` for the word `Port` (the setting that says which port SSH uses).

      If a line says *Permission denied*, that file isn't yours to read: `grep` skips it and carries on.
    commands: |
      find ~/Desktop/hacking-practice -name "*.txt"
      grep "root" /etc/passwd
      grep -r "Port" /etc/ssh

  - kind: explain
    title: When you are stuck — read the manual
    body: |
      No one memorises every option. Two habits make you self-sufficient:

      - `man ls` opens the **man**ual for a command (Space to scroll, `q` to quit).
      - `ls --help` prints a shorter summary of its options.

      When a command misbehaves, the answer is almost always in `man` or `--help`. Reading documentation is not a failure — it is the skill.

      **Example.** `--help` prints straight into the terminal. Its first lines for `ls` (the full list is much longer):

      ```
      kali@kali:~$ ls --help
      Usage: ls [OPTION]... [FILE]...
      List information about the FILEs (the current directory by default).
      Sort entries alphabetically if none of -cftuvSUX nor --sort is specified.

      Mandatory arguments to long options are mandatory for short options too.
        -a, --all                  do not ignore entries starting with .
      ```

      There is the `-a` you have been using, explained in one line. `man ls` shows the same kind of information as a full page you scroll through, then `q` to quit.

  - kind: mac
    title: "Try it: read a manual"
    body: |
      Open the manual for `ls` and find the `-a` option. Space scrolls, **`/`** then a word searches (try `/-a` then Return), and **`q`** quits.

      (On a Mac, `ls --help` gives an error: the Mac's `ls` only has a `man` page. On Linux both work.)
    commands: |
      man ls

  - kind: info
    title: "🔹 Tab-completion and history save you"
    body: |
      Two shortcuts you will use thousands of times: press **Tab** to auto-complete a half-typed file or command name (and avoid typos in long paths), and press the **Up arrow** to bring back previous commands. Your past commands also live in a file (`~/.zsh_history` on a Mac) — convenient for you, and a treasure for anyone who gets into an account.

  - kind: why
    body: |
      Every scan, exploit and report in the rest of this course is typed into a terminal. The person who is fluent here moves at twice the speed of the person hunting through menus — and, just as important, understands exactly what each command will do *before* pressing Return. That judgement is what keeps you (and your client's systems) safe.

  - kind: recap
    body: |
      - The **terminal** runs commands through a **shell** (bash on Linux, zsh on your Mac); the same basics work on both.
      - Navigate with `pwd`, `ls` (`-la` shows hidden files), and `cd` (`..` up, `~` home, `-` back).
      - Read files with `cat`, `less`, `head`, `tail` (`-f` to follow a log).
      - Create and change with `mkdir`, `touch`, `cp`, `mv`; **`rm` deletes forever — read it twice**.
      - Search with `find` (files by name) and `grep` (text inside files; `-r` for recursive).
      - Stuck? `man command` or `command --help`. Lean on **Tab** and the **Up arrow**.
