pass: 3
questions:
  - type: mcq
    prompt: "A client scopes your engagement as `192.168.1.0/24`. Roughly how many host addresses does that cover, and what is fixed?"
    options:
      - One machine; all four numbers (192.168.1.0) are fixed
      - About 254 machines; 192.168.1 is fixed and the last part varies
      - About 65,000 machines; only 192.168 is fixed and the rest varies
      - 24 machines; the /24 is the number of hosts in scope
    answer: 1
    explanation: "`/24` fixes the first 24 bits — the first three numbers — leaving the last number (1–254) free, so about 254 hosts. Staying inside this range is your legal boundary."
  - type: mcq
    prompt: Which of these is a *private* IP address that would normally sit behind NAT?
    options:
      - "8.8.8.8"
      - "10.0.0.5"
      - "172.217.0.1"
      - "93.184.216.34"
    answer: 1
    explanation: "`10.0.0.0/8` is one of the private ranges (along with 172.16–31.x.x and 192.168.x.x). Private addresses are reused everywhere and hidden behind a public IP by NAT."
  - type: mcq
    prompt: What is the key difference between a switch and a router?
    options:
      - A switch connects you to the internet; a router links devices in one room
      - A switch links machines in one local network; a router links different networks
      - A switch is the wireless part of a network; a router is the wired part
      - A switch hands out IP addresses to devices; a router only passes their data along unchanged
    answer: 1
    explanation: Switches forward frames inside a single network using MAC addresses; routers forward packets between networks using IP addresses, choosing the next hop.
  - type: mcq
    prompt: Why can your laptop, phone and TV all share one public IP address?
    options:
      - Each device takes turns using the public address, one at a time
      - The router uses NAT to map their private addresses to its one public one
      - Your provider gives the router one public address per device it sees
      - The devices use MAC addresses on the internet, so IPs don't need to differ
    answer: 1
    explanation: NAT (Network Address Translation) lets many private addresses share one public address. From outside, you often see only the router, not the machines behind it.
  - type: fill
    prompt: "An address written as six hex pairs like `00:1b:44:11:3a:b7`, burned into a network card and meaningful only on the local segment, is called a ____ address."
    code: "00:1b:44:11:3a:b7 is a ____ address"
    answer: "MAC"
    runnable: false
    accept:
      - mac
    explanation: That is a MAC address — the fixed hardware identifier. An IP address, by contrast, is assigned and routes across networks.
