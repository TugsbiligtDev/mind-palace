pass: 3
questions:
  - type: mcq
    prompt: You ping a server you know is running, but get no reply. What is the best conclusion?
    options:
      - The server must be powered off or unplugged from the network
      - It may be set to ignore ping while still running services
      - Your firewall is blocking all outgoing traffic from your machine
      - Ping only works inside a local network, not across the internet
    answer: 1
    explanation: Many hosts drop ICMP echo requests but keep serving on their ports. "No reply" is not proof a host is down — a key caution when mapping a network.
  - type: mcq
    prompt: What does `traceroute example.com` show you?
    options:
      - Which ports are open on the server, and the service behind each
      - Each router (hop) your packets pass through on the way, with timings
      - The server's IP address and the name of the company that owns and runs it
      - Whether the server is up, by sending a single ping and timing it
    answer: 1
    explanation: Traceroute reveals the path hop by hop — useful for understanding network structure and spotting where a firewall might sit.
  - type: mcq
    prompt: In Wireshark you only want to see web traffic. What is the right move?
    options:
      - Capture on every interface at once
      - Apply the display filter `http`
      - Delete all other packets manually
      - Turn off your firewall
    answer: 1
    explanation: Filters make a capture usable. Typing `http` (or `dns`, `tcp.port == 443`, `ip.addr == ...`) narrows thousands of packets down to the ones you care about.
  - type: mcq
    prompt: Why is capturing traffic with Wireshark on a public coffee-shop network an ethical and legal problem?
    options:
      - Wireshark is illegal to install on a laptop without a licence
      - You would record other people's data without their consent or authorisation
      - The capture would slow the network down for everyone in the café
      - Public Wi-Fi is encrypted, so you would be breaking that encryption to see anything at all
    answer: 1
    explanation: Capturing records everyone's traffic in range, including cleartext credentials. You capture only on networks you own or are explicitly authorised to monitor — your lab is the safe choice.
  - type: mcq
    prompt: A capture shows a login over plain FTP with the username and password fully readable. What does this demonstrate?
    options:
      - Wireshark can decrypt any protocol if it captures enough packets
      - Cleartext protocols expose logins to anyone who can see the traffic
      - The user typed the password wrong, so the server sent it back
      - FTP only shows passwords to people on the same machine as the server
    answer: 1
    explanation: Plain FTP, HTTP and Telnet send data unencrypted. Anyone in the path can read it — the single most persuasive argument for HTTPS, SSH and VPNs.
