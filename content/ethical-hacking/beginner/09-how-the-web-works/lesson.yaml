steps:
  - kind: explain
    title: The web is one conversation, repeated
    body: |
      Most of the systems you will ever test are web applications, so the web gets its own two modules. The good news: underneath, it is astonishingly simple. A **client** (your browser) sends a **request**; a **server** sends back a **response**. That is it, repeated billions of times a second.

      The language of that conversation is **HTTP**. Learn to read an HTTP request and response and you can follow — and later test — almost anything a website does.

      **Example: one round of the conversation.** You type `example.com` into the browser. The browser sends:

      ```
      GET / HTTP/1.1
      Host: example.com
      ```

      and the server answers (shortened):

      ```
      HTTP/1.1 200 OK
      Content-Type: text/html

      <html><head><title>Example Domain</title></head> ...
      ```

      The browser reads that HTML and notices the page also needs a picture and a stylesheet, so it repeats the same request and response for each one. A typical page is dozens of these little conversations.

  - kind: choice
    title: "Quick check: who starts it?"
    body: |
      In the web conversation, who sends the **request** and who sends the **response**?
    options:
      - "The server requests, the browser responds"
      - "The browser (client) requests, the server responds"
      - "Both send requests at the same time"
    answer: 1
    explanation: |
      The **client** (your browser, or a tool like `curl`) always asks; the **server** answers. Every web test is about what goes into those requests and what comes back.

  - kind: explain
    title: Anatomy of a request
    body: |
      When you visit a page, your browser sends a request that looks roughly like this:

      ```
      GET /login HTTP/1.1
      Host: example.com
      User-Agent: Mozilla/5.0 ...
      Cookie: session=abc123
      ```

      Three parts to notice:

      - The **method** (`GET`) — what you want to *do*.
      - The **path** (`/login`) — which resource.
      - The **headers** (`Host`, `User-Agent`, `Cookie`) — extra information about the request.

      Everything a web test does is, at bottom, crafting or tampering with requests like this — which is why tools that let you see and edit them (Module 20's Burp Suite) are so central.

  - kind: mac
    title: "Try it: see your own request"
    body: |
      `curl -v` ("verbose") prints the request it sends, each line starting with `>`. `-o /dev/null` throws the page away so only the conversation shows. Find the **method**, the **path** and the **headers**:

      ```
      > GET / HTTP/2
      > Host: example.com
      > User-Agent: curl/8.7.1
      > Accept: */*
      ```

      (`HTTP/2` is a newer version of HTTP; the parts are the same.) Lines starting with `<` are the response, and lines with `*` are curl's own notes.
    commands: |
      curl -v https://example.com -o /dev/null

  - kind: choice
    title: "Quick check: the parts of a request"
    body: |
      ```
      GET /account/orders HTTP/1.1
      Host: shop.example.com
      Cookie: session=7f3a
      ```

      What is the **path**?
    options:
      - "GET"
      - "shop.example.com"
      - "/account/orders"
      - "session=7f3a"
    answer: 2
    explanation: |
      `GET` is the method, `/account/orders` is the path (which resource), and `Host` and `Cookie` are headers.

  - kind: explain
    title: Methods — GET and POST
    body: |
      HTTP **methods** say what kind of action you want:

      | Method | Means | Typical use |
      |---|---|---|
      | **GET** | "Give me this" | Loading a page; data goes in the URL |
      | **POST** | "Here, take this" | Submitting a form; data goes in the body |
      | PUT / DELETE | Create/replace, remove | APIs |

      One security point already: because **GET puts data in the URL**, anything sent that way (a search term, worse, a password) ends up in browser history, server logs and bookmarks. Sensitive data belongs in a POST body, not a GET URL — a finding you will report more than once.

      <!-- page -->

      **Example: the same shop, two methods.** Searching for books sends a GET, with the search term inside the path:

      ```
      GET /search?q=mystery+novels HTTP/1.1
      Host: shop.example.com
      ```

      Signing in sends a POST. The data sits in the **body**, below an empty line, not in the path:

      ```
      POST /login HTTP/1.1
      Host: shop.example.com
      Content-Type: application/x-www-form-urlencoded
      Content-Length: 28

      username=ada&password=s3cret
      ```

      The search term `mystery novels` (a `+` stands for a space) will be saved in history and logs. The password will not, because it never appears in the URL.

  - kind: choice
    title: "Quick check: where did the password go?"
    body: |
      A site's login form sends `GET /login?user=ada&pass=s3cret`. Why is that a finding?
    options:
      - "GET is slower than POST"
      - "The password is in the URL, so it ends up in browser history, server logs and bookmarks"
      - "GET requests can't carry data"
    answer: 1
    explanation: |
      GET puts its data in the URL, and URLs get saved everywhere. A password belongs in the body of a POST, where it isn't written to history or logs.

  - kind: explain
    title: The response and its status code
    body: |
      The server answers with a **status code** — a three-digit number summarising what happened. You will read these constantly:

      | Range | Meaning | Examples |
      |---|---|---|
      | **2xx** | Success | 200 OK |
      | **3xx** | Redirect | 301 moved, 302 found |
      | **4xx** | *You* did something wrong | 401 unauthorised, 403 forbidden, 404 not found |
      | **5xx** | *Server* broke | 500 internal error |

      To a tester these are signals. A **403** says "something is here but you are not allowed" — worth probing. A **500** means your input broke the server, which often means the input was handled carelessly — the scent of a bug. A **302** to a login page tells you a resource is protected.

      <!-- page -->

      **Example.** `curl` is a command-line web client, and `curl -I` asks for just the status line and headers. Here are the first lines of three answers from the training target in your lab:

      ```
      kali@kali:~$ curl -I http://192.168.56.101/
      HTTP/1.1 200 OK
      kali@kali:~$ curl -I http://192.168.56.101/dvwa/
      HTTP/1.1 302 Found
      Location: login.php
      kali@kali:~$ curl -I http://192.168.56.101/old-backup/
      HTTP/1.1 404 Not Found
      ```

      The home page exists (200). The `/dvwa/` app sends you to its login page (302, and `Location` says where to), so it is protected. `/old-backup/` does not exist (404).

  - kind: mac
    title: "Try it: two status codes"
    body: |
      Ask for a page that exists and one that doesn't, and read the first line of each answer: `200` for the first, `404` for the second. (`HTTP/2` is a newer version of HTTP; the status codes mean the same.)
    commands: |
      curl -I https://example.com/
      curl -I https://example.com/no-such-page

  - kind: choice
    title: "Quick check: read the signal"
    body: |
      You send an unusual value in a search box and the server answers `500 Internal Server Error`. What does that suggest?
    options:
      - "You typed the address wrong"
      - "The page is protected and you need to log in"
      - "Your input broke something on the server, so it may be handled carelessly"
      - "Everything worked"
    answer: 2
    explanation: |
      **5xx** means the *server* broke. Breaking it with your input hints the input isn't handled safely, which is worth a closer look. A wrong address would be 404, a protected page 401/403 or a 302 to the login, and success is 200.

  - kind: explain
    title: Headers carry the metadata
    body: |
      **Headers** are the labelled extra lines in both requests and responses. A few matter enormously for security:

      - `Set-Cookie` (response) — the server hands the browser a cookie.
      - `Server` / `X-Powered-By` — often leak the exact software and version, telling an attacker what to look up.
      - `Content-Type` — what kind of data this is.
      - Security headers like `Content-Security-Policy` and `Strict-Transport-Security` — their *presence* hardens a site; their *absence* is a finding.

      Reading headers is free reconnaissance: the site often tells you what it is built from before you do anything clever.

      **Example:** the full headers of the lab target's home page:

      ```
      kali@kali:~$ curl -I http://192.168.56.101/
      HTTP/1.1 200 OK
      Date: Wed, 14 Oct 2026 10:15:02 GMT
      Server: Apache/2.2.8 (Ubuntu) DAV/2
      X-Powered-By: PHP/5.2.4-2ubuntu5.10
      Content-Type: text/html
      ```

      In five lines the server has announced its web server *and* version (`Apache/2.2.8`), its operating system (`Ubuntu`) and its programming language *and* version (`PHP/5.2.4`). Both versions are many years old. Notice also what is *missing*: no `Content-Security-Policy`, no `Strict-Transport-Security`.

  - kind: choice
    title: "Quick check: free reconnaissance"
    body: |
      A response contains these headers. Which one tells an attacker what to look up?

      ```
      Content-Type: text/html
      Server: nginx/1.14.0
      Date: Wed, 14 Oct 2026 10:15:02 GMT
      ```
    options:
      - "Content-Type"
      - "Server"
      - "Date"
    answer: 1
    explanation: |
      `Server: nginx/1.14.0` names the exact software and version, so anyone can look up its known weaknesses. `Content-Type` and `Date` reveal nothing useful.

  - kind: explain
    title: Cookies and sessions — how a site remembers you
    body: |
      HTTP is **stateless**: each request stands alone, and the server does not inherently remember you from one to the next. So how do you stay logged in? With a **cookie**.

      1. You log in. The server creates a **session** and sends back `Set-Cookie: session=abc123`.
      2. Your browser includes `Cookie: session=abc123` on every later request.
      3. The server looks up `abc123`, sees "this is Ada, already logged in," and treats you accordingly.

      **Example.** Here is step 1 in a real response, and step 2 in the next request:

      ```
      HTTP/1.1 302 Found
      Set-Cookie: PHPSESSID=8f2c1e9a7b3d4c5e6f708192a3b4c5d6; path=/; HttpOnly
      Location: /account
      ```

      ```
      GET /account HTTP/1.1
      Host: shop.example.com
      Cookie: PHPSESSID=8f2c1e9a7b3d4c5e6f708192a3b4c5d6
      ```

      `PHPSESSID` is the name PHP sites give their session cookie, and the long value is the session token. (`HttpOnly` asks the browser not to let page scripts read it, a protection you will meet again.)

      That little token *is* your logged-in identity. If an attacker steals it, copies it, or guesses it, they become you without ever knowing your password. That is why session handling is one of the richest areas of web security (Module 22).

  - kind: choice
    title: "Quick check: what is worth stealing?"
    body: |
      After you sign in, every request your browser sends includes `Cookie: session=9b1d77e0`. If an attacker copies that value into their own browser, what happens?
    options:
      - "Nothing: they still need your password"
      - "The site treats them as you, already logged in"
      - "The site logs you out and locks the account"
    answer: 1
    explanation: |
      The session token *is* your logged-in identity: the server looks it up and sees "this is you". That's why stealing or guessing session tokens is such a common attack.

  - kind: explain
    title: Reading a URL
    body: |
      A URL has parts, and testers pick them apart constantly:

      ```
      https://shop.example.com:443/products?id=42&sort=price#reviews
      ```

      - `https` — the **scheme** (protocol)
      - `shop.example.com` — the **host** (and `shop.` is a subdomain)
      - `:443` — the **port** (usually implied)
      - `/products` — the **path**
      - `?id=42&sort=price` — the **query parameters** (name=value pairs)
      - `#reviews` — the **fragment** (browser-only; never sent to the server)

      Those query parameters — `id=42` — are user input the server acts on, and user input is exactly where many web vulnerabilities live. Changing `id=42` to `id=43` to see someone else's data is the whole idea behind a flaw called IDOR (Module 22).

  - kind: mac
    title: Make a raw web request yourself
    body: |
      `curl` is a command-line web client. `-I` asks for just the response headers. This is an ordinary, polite request to a documentation host — exactly what your browser does, minus the pretty rendering. Read the status line and the headers.
    commands: |
      curl -I https://example.com
      curl -s https://example.com | head -20
  - kind: info
    title: "🔹 HTML, CSS and JavaScript — recognition only"
    body: |
      The response body is usually a web page made of three languages: **HTML** (the structure and content), **CSS** (the styling), and **JavaScript** (behaviour that runs *in your browser*). You do not need to write them yet. Just recognise that JavaScript runs on the *client* side — which is why a flaw called cross-site scripting (XSS, Module 21), where an attacker's JavaScript runs in a victim's browser, is possible at all.

  - kind: why
    body: |
      Web application hacking — three whole modules of the Intermediate level — is nothing more than reading and manipulating the request/response conversation you just learned. Status codes guide where you probe, headers hand you reconnaissance, cookies are stolen identities, and query parameters are the user input that so many attacks ride in on. This module is the alphabet; the web-hacking modules are the sentences.

  - kind: recap
    body: |
      - The web is a **request → response** conversation in **HTTP**: a client asks, a server answers.
      - A request has a **method** (**GET** = fetch, data in the URL; **POST** = submit, data in the body), a **path**, and **headers**.
      - The response carries a **status code**: **2xx** success, **3xx** redirect, **4xx** your error (401/403/404), **5xx** server error — each a signal to a tester.
      - **Headers** leak software versions and set security policy; **cookies** carry a **session** token that *is* your logged-in identity.
      - A **URL** breaks into scheme, host, port, path, **query parameters** and fragment; those parameters are user input where many bugs live.
