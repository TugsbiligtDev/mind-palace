pass: 3
questions:
  - type: mcq
    prompt: A web server responds with status code 500 right after you submit an unusual value in a form field. Why is that interesting to a tester?
    options:
      - A 500 means the page was not found, so the form posts to a wrong URL
      - A 500 suggests your input broke something it didn't handle — a possible bug
      - A 500 means you lack permission, so you have found a protected admin area of the site
      - A 500 means the request worked and the server saved your value
    answer: 1
    explanation: 5xx codes mean the server itself failed. Input that triggers a 500 often reveals careless handling worth investigating. (404 = not found, 401/403 = auth problems.)
  - type: mcq
    prompt: Why should a password never be sent using a GET request?
    options:
      - GET requests are not encrypted, even when the site uses HTTPS
      - GET puts data in the URL, so it lands in history, bookmarks and logs
      - GET can only carry a few characters, so long passwords get cut off
      - GET requests are cached by the browser, so anyone can replay the login
    answer: 1
    explanation: GET data travels in the URL and is logged and stored in many places. Sensitive data belongs in a POST request body.
  - type: mcq
    prompt: "After you log in, the server sends `Set-Cookie: session=abc123` and your browser includes it on later requests. What is that cookie, in security terms?"
    options:
      - A preference such as your language, safe to share with anyone
      - Your logged-in identity — whoever holds it can act as you
      - An encrypted copy of your password that the server checks
      - A tracking ID used for ads, unrelated to your account
    answer: 1
    explanation: The session token represents your authenticated identity. If an attacker obtains it, they are treated as you — which is why session security matters so much.
  - type: mcq
    prompt: "In the URL `https://shop.example.com/products?id=42`, which part is user-controlled input the server acts on?"
    options:
      - https (the protocol)
      - shop.example.com (the host)
      - id=42 (the query parameter)
      - /products (the path)
    answer: 2
    explanation: Query parameters like `id=42` are user input. Tampering with them (e.g. `id=43`) is the basis of access-control flaws such as IDOR.
  - type: fill
    prompt: "HTTP is described as 'stateless' — the server does not remember you between requests on its own. The small token stored in your browser that keeps you logged in is called a ____."
    code: "The server keeps you logged in with a ____"
    answer: "cookie"
    runnable: false
    accept:
      - cookies
      - session cookie
    explanation: A cookie (carrying a session token) is how a stateless protocol remembers who you are from one request to the next.
