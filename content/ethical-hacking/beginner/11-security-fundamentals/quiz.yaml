pass: 3
questions:
  - type: mcq
    prompt: An attacker alters the balance stored in a bank's database. Which part of the CIA triad has been violated?
    options:
      - Confidentiality
      - Integrity
      - Availability
      - None of them
    answer: 1
    explanation: Integrity is about data being correct and unaltered. Changing a stored value attacks integrity. (Reading it would be confidentiality; taking the system offline, availability.)
  - type: mcq
    prompt: You find a "secret" value in an app that turns out to be plain base64. How much protection does that provide?
    options:
      - Strong protection, because base64 is a type of encryption
      - None — base64 is encoding, which anyone can reverse instantly
      - Some, because only programmers know how to read base64
      - It depends on the length of the key that was used to encode the value
    answer: 1
    explanation: Base64 is encoding for transport, not encryption. Anyone can decode it in a second, so a base64-"protected" secret is effectively unprotected.
  - type: mcq
    prompt: A user logs in correctly but then reaches an admin page they should never be able to see. Which idea does this violate?
    options:
      - Authentication (the app failed to check who they are)
      - Authorization (identity was fine; permissions weren't enforced)
      - Availability (the admin page should have been offline)
      - Integrity (the admin page's data was changed without consent)
    answer: 1
    explanation: They authenticated fine (identity proven). The failure is authorization — permissions were not enforced. That is broken access control.
  - type: mcq
    prompt: How should a well-designed system store user passwords?
    options:
      - Encrypted with a strong key, so they can be decrypted if a user forgets one
      - Encoded in base64, so they never appear as plain text
      - Hashed and salted, since the system only needs to check a match
      - Stored in plain text, but in a separate locked-down database
    answer: 2
    explanation: Hashing is one-way; the system only needs to compare hashes, never recover the password. Salting defeats precomputed lookups. Reversible storage (encryption) is a weaker design.
  - type: mcq
    prompt: A client asks which of your 400 findings matters most. What is the professional way to answer?
    options:
      - Fix them in the order you found them, since that's what you tested
      - Rank by risk — likelihood and impact — so the worst ones come first
      - Fix the easiest ones first, to bring the total count down quickly
      - Rank them by CVSS score alone, since the number is objective
    answer: 1
    explanation: Clients pay for risk judgement. A vulnerability's risk is likelihood times impact; you surface the few high-risk issues, not an undifferentiated list.
