questions:
  - type: mcq
    prompt: What is the single thing that separates legal, ethical hacking from a criminal offence?
    options:
      - Using professional tools rather than ones built by criminals
      - Explicit, written authorization from someone entitled to give it
      - Not causing any damage or taking any data while you test, so nobody is harmed
      - Reporting everything you find to the owner afterwards
    answer: 1
    explanation: The techniques are the same; authorization is the difference. Without written permission from someone with authority, even a basic scan can be a crime — and "no harm done" is not a defence.
  - type: mcq
    prompt: Your signed scope is `203.0.113.0/24`. During testing you notice an interesting server at `203.0.114.10`. What is the correct action?
    options:
      - Test it briefly, since it is so close to the scope range that it is probably theirs
      - Leave it alone and note it; it is outside the authorised scope
      - Test it, but keep it out of the report to avoid trouble
      - Scan it passively only, which is allowed outside scope
    answer: 1
    explanation: Scope is a hard boundary. `203.0.114.10` is a different subnet and not authorised. Testing it would be unlawful regardless of how tempting it is.
  - type: mcq
    prompt: You discover a serious vulnerability in a product you use at home, which you were not hired to test. What is the responsible path?
    options:
      - Post the details publicly at once, so other users can protect themselves
      - Report it privately to the owner and give them time to fix it first
      - Test it further to prove it is real, then report it to the owner
      - Say nothing, since you weren't hired and reporting could get you sued
    answer: 1
    explanation: Responsible (coordinated) disclosure means reporting privately, not exploiting beyond a minimal proof, and allowing time to fix before any public mention.
  - type: mcq
    prompt: Why insist on a signed authorization letter before a penetration test, rather than a verbal go-ahead?
    options:
      - Your testing tools need the signed letter before they will start
      - It documents permission, scope and dates, protecting you if alarms fire
      - Verbal permission is illegal, but any signature makes the test legal
      - It lets the client sue you if you miss a vulnerability during the test
    answer: 1
    explanation: The signed "get-out-of-jail" letter proves who authorised the work, what was in scope and when. It is the line between an authorised test and an intrusion if questions arise.
  - type: mcq
    prompt: How does a bug bounty program's scope compare, legally, to a pentest contract's scope?
    options:
      - A bounty's scope is only a suggestion; finding real bugs is what counts
      - Both are binding — testing outside either one is unauthorised access
      - A bounty program makes the company's whole internet presence fair game
      - Only the pentest contract counts, because a bounty is not a signed deal
    answer: 1
    explanation: A published bounty scope is as binding as a contract. Going outside it, or testing a company that runs no program, is unauthorised no matter your intentions.
