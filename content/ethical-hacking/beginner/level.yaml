id: beginner
title: Beginner
season: 1
season_title: The Stakeout
season_pitch: |
  Before a detective ever makes an arrest, they learn the city: its streets, its locks, its
  rules. Start the same way. Learn how computers and operating systems work, drive the Linux
  terminal, understand networks and the web, then the core ideas of security — and the law and
  ethics that separate a professional from a criminal. By the end you can build a legal lab and
  safely map a target you are allowed to test.
