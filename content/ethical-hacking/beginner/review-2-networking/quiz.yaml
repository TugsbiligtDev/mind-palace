pass: 4
questions:
  - type: mcq
    prompt: "Your scope is `10.10.50.0/24`. A scan result for `10.10.51.5` looks juicy. What do you do?"
    options:
      - Test it — it is almost in range
      - Leave it alone; it is outside the scoped /24 and therefore out of authorisation
      - Test it but do not write it down
      - Ask the client to widen the scope, then test it anyway while you wait for their answer
    answer: 1
    explanation: "`/24` covers only 10.10.50.1–254. `10.10.51.5` is a different subnet and out of scope. Touching it is unauthorised, however tempting."
  - type: mcq
    prompt: "A host shows ports 80 and 3389 open. What is a reasonable first read?"
    options:
      - A Linux web server with remote SSH access enabled
      - "A website (HTTP) plus Windows Remote Desktop: likely Windows"
      - A network printer with its web configuration page open
      - A database server, since 3389 is a common port for database connections
    answer: 1
    explanation: Port 80 is HTTP (a website) and 3389 is RDP (Windows remote desktop). The combination points to a Windows host — ports tell a story.
  - type: mcq
    prompt: "Which of these is a public IP address?"
    options:
      - "192.168.1.1"
      - "10.4.4.4"
      - "8.8.8.8"
      - "172.16.0.9"
    answer: 2
    explanation: "`8.8.8.8` is public. The others are in private ranges (192.168.x, 10.x, 172.16–31.x) used internally behind NAT."
  - type: mcq
    prompt: You can read a login in plaintext from a capture of an internal app on port 80. What is the finding and the fix?
    options:
      - "Finding: the app uses an old Wireshark. Fix: update it"
      - "Finding: logins travel in cleartext over HTTP. Fix: HTTPS"
      - "Finding: port 80 is open. Fix: move the app to port 8080"
      - "Finding: the password is weak. Fix: require longer ones"
    answer: 1
    explanation: Plain HTTP exposes credentials to anyone in the path. The remediation is to serve the app over HTTPS so the traffic is encrypted.
  - type: mcq
    prompt: Why is the exact same packet capture fine in your lab but a crime on a café's Wi-Fi?
    options:
      - Café Wi-Fi is encrypted, so capturing it means breaking encryption
      - Your lab is authorised; on café Wi-Fi you'd intercept strangers' data
      - Wireshark only captures your own traffic in a lab, and everyone's outside
      - It is fine in both, as long as you don't keep the capture afterwards
    answer: 1
    explanation: Authorisation is the whole difference. Capturing your own lab traffic is legitimate; capturing strangers' traffic without consent is unlawful interception.
