questions:
  - type: mcq
    prompt: What makes passive reconnaissance "passive"?
    options:
      - It is done slowly
      - It gathers public information without ever touching the target's own systems, so it leaves no trace in their logs
      - It only uses one tool
      - It is always illegal
    answer: 1
    explanation: Passive recon reads already-published information (DNS, search results, WHOIS, Shodan), so the target never sees you. Active recon interacts with the target and is visible.
  - type: mcq
    prompt: Why are `dev.` and `staging.` subdomains especially interesting during recon?
    options:
      - They are always offline
      - They are often built quickly, secured loosely and then forgotten, making them softer targets than production
      - They cannot be found publicly
      - They never run real services
    answer: 1
    explanation: Test and staging systems are a recurring theme in real breaches precisely because they get less security attention. Mapping them is part of knowing the full attack surface.
  - type: mcq
    prompt: What does Shodan let a tester do?
    options:
      - Crack passwords automatically
      - Search a continuously-updated index of internet-facing devices, ports, banners and versions — a target's exposure, without scanning it yourself
      - Edit a target's DNS records
      - Send phishing emails
    answer: 1
    explanation: Shodan scans the whole internet and lets you search the results like a search engine for machines. It often reveals exposures an organisation did not know about.
  - type: mcq
    prompt: A company's job posting lists "AWS, Django, Jenkins, PostgreSQL." Why is that useful to an attacker?
    options:
      - It is not useful at all
      - It reveals the technology stack to prepare against, before sending a single packet at the target
      - It contains the admin password
      - It proves the company is secure
    answer: 1
    explanation: Job ads leak the tech stack, telling an attacker exactly what software and known weaknesses to research in advance. It is classic OSINT.
  - type: mcq
    prompt: What is the best defensive use of the OSINT techniques in this module?
    options:
      - Never let employees have social media
      - Run OSINT on your own organisation regularly to find and reduce what leaks before an attacker does
      - Delete the company website
      - Block Google entirely
    answer: 1
    explanation: The strongest defensive move is to see yourself as an attacker would — OSINT your own org, watch certificate-transparency logs, control indexing — and close the gaps first.
