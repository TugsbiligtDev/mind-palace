questions:
  - type: mcq
    prompt: An Nmap scan reports a port as "filtered" (no reply at all). What does that most likely mean?
    options:
      - The port is open, but the service refused your connection because it needs a login
      - A firewall is dropping the probe, so you can't tell what's behind it
      - The port is closed, and the host answered with a reset
      - The host is offline, so Nmap could not reach any port on it
    answer: 1
    explanation: "Open = SYN-ACK, closed = RST, and no reply = filtered, usually a firewall dropping packets. The silence tells you a defence is in the way."
  - type: mcq
    prompt: Why is the `-sV` (version detection) flag so valuable?
    options:
      - It slows the scan down so firewalls don't notice it
      - It names the exact software and version on each open port
      - It scans all 65,535 ports instead of only the 1,000 most common ones
      - It confirms which open ports are actually vulnerable
    answer: 1
    explanation: A bare open port is thin. Knowing it is "vsftpd 2.3.4" or "Apache 2.4.49" lets you search for known flaws in that precise version — the bridge to Module 17.
  - type: mcq
    prompt: Why might you run `nmap -p-` instead of a default scan?
    options:
      - "`-p-` scans UDP ports too, which the default scan skips"
      - The default checks ~1,000 common ports; `-p-` checks all 65,535
      - "`-p-` skips the ping step, so hosts that ignore ping still show"
      - "`-p-` is quieter than the default, so it avoids detection"
    answer: 1
    explanation: A default scan can miss a service hidden on port 8443 or 2222. `-p-` is slower but thorough — a conscious trade of speed for completeness.
  - type: mcq
    prompt: Why should you be cautious with aggressive timing (`-T5`) and intrusive NSE scripts on a real engagement?
    options:
      - They return false results, so every finding must be rescanned
      - They can crash fragile services and are loud, risking the rules
      - They need a paid licence that most clients' contracts don't cover
      - They only work against Linux targets, not the Windows hosts
    answer: 1
    explanation: Scanning is interacting with live systems. Too fast or too intrusive can disrupt fragile services and alert defenders, which is why RoE often restricts it and you record what you ran.
  - type: fill
    prompt: "The one public host the Nmap project provides expressly for legal scan practice is ____.nmap.org."
    code: "Legal practice target: ____.nmap.org"
    answer: "scanme"
    runnable: false
    explanation: "`scanme.nmap.org` is offered for scan practice. Everything else requires your own lab or explicit authorisation."
