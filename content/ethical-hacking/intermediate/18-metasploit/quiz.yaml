questions:
  - type: mcq
    prompt: In Metasploit terms, what is the difference between the exploit and the payload?
    options:
      - The payload abuses the flaw to get in; the exploit is what runs afterwards
      - The exploit abuses the flaw to get in; the payload runs once it succeeds
      - The exploit is the listener on your machine; the payload is the scanner
      - The exploit targets Linux and the payload targets Windows systems
    answer: 1
    explanation: The exploit is the way in (one per flaw); the payload is what executes on the target afterward (often a shell back to you). The listener catches that connection.
  - type: mcq
    prompt: Why are reverse shells (target connects out to you) preferred over bind shells (you connect in to the target)?
    options:
      - Reverse shells are encrypted by default, so defenders cannot read what you type
      - Firewalls allow outbound connections far more often than inbound
      - Reverse shells don't need a listener running on your machine
      - Reverse shells leave no trace in the target's logs
    answer: 1
    explanation: Firewalls usually block inbound connections to a target but allow outbound. Reverse shells exploit that — which is why egress filtering (limiting outbound traffic) is a strong defence.
  - type: mcq
    prompt: An exploit fails to return a session. What is the most likely explanation?
    options:
      - The target is not vulnerable, so move on to the next one
      - A setup mistake — wrong payload, LHOST or architecture — so troubleshoot
      - The exploit worked, but antivirus on the target deleted the session straight afterwards
      - The module is out of date, so reinstall Metasploit and retry
    answer: 1
    explanation: Failed exploits are usually configuration issues, not proof of invulnerability. Change one variable at a time and read the errors, like debugging code.
  - type: mcq
    prompt: Which set of defences most directly counters the Metasploit workflow in this module?
    options:
      - Strong passwords, account lockouts and regular password changes
      - Patching, egress filtering, EDR and least privilege
      - Antivirus on every server and a web application firewall
      - Hiding service banners and moving services to unusual ports
    answer: 1
    explanation: "Each maps to a step — patching removes the door, egress filtering stops the callback, EDR spots payloads like Meterpreter, and least privilege limits what a foothold can do."
  - type: mcq
    prompt: Why do certifications like the OSCP restrict Metasploit use?
    options:
      - Metasploit is illegal to use outside a paid engagement
      - They test that you understand exploits, not just point-and-shoot
      - Metasploit modules are too unreliable for an exam environment
      - Exam machines are patched against every Metasploit module
    answer: 1
    explanation: Metasploit is an excellent scaffold for learning the concepts, but a tool you do not understand fails when it does not fit. Exams check you grasp what is happening underneath.
