questions:
  - type: mcq
    prompt: Why is an offline password attack so much more dangerous than an online one?
    options:
      - Offline attacks use smarter wordlists than online tools can
      - "With the hashes, guessing runs on your own hardware: no lockouts or alarms"
      - Offline attacks decrypt the stolen hashes directly with a key, instead of having to guess
      - Online attacks only work against accounts that have no password
    answer: 1
    explanation: Offline, you crack stolen hashes locally with no rate limit or lockout. Online attacks hit a live service and are slowed by lockouts, limits and logging.
  - type: mcq
    prompt: Why do security professionals say "length beats complexity" for passwords?
    options:
      - Long passwords are easier to type, so people choose better ones
      - Each extra character multiplies the work; short "complex" ones are in wordlists
      - Systems hash long passwords with stronger algorithms automatically, so they take longer to crack
      - Complex symbols are often stripped out by websites before hashing
    answer: 1
    explanation: Brute force grows astronomically with length, but short complex passwords are predictable and in wordlists. A long passphrase is far stronger than a short, symbol-stuffed one.
  - type: mcq
    prompt: What is password spraying, and why does it evade account lockouts?
    options:
      - Trying many passwords fast against one account, before lockout starts
      - Trying one common password across many accounts, staying under limits
      - Trying leaked username and password pairs from another site's breach
      - Guessing usernames first, then using one password for all of them
    answer: 1
    explanation: "Spraying flips brute force — one common password across many accounts avoids per-account lockout, and in a large group someone usually picked the predictable password."
  - type: mcq
    prompt: Which single control most reduces the impact of a cracked or stolen password?
    options:
      - Forcing everyone to change their password every 30 days
      - Multi-factor authentication (MFA), so a password alone isn't enough
      - Locking an account for good after three failed logins, so attackers can't keep trying
      - Requiring symbols and numbers in every password
    answer: 1
    explanation: MFA means a cracked password is not enough to log in. It is consistently the highest-value defence against password attacks.
  - type: mcq
    prompt: A client stores passwords as plain, unsalted SHA-256. What do you recommend?
    options:
      - Switch to SHA-512, which is longer and so much harder to crack
      - Use a salted, deliberately slow hash such as bcrypt or Argon2
      - Encrypt the passwords with AES, so they can be checked later
      - Keep SHA-256 but run it twice, so attackers need twice the time
    answer: 1
    explanation: Fast, unsalted hashes let attackers try billions of guesses per second and reuse rainbow tables. Salted, slow hashes (bcrypt/scrypt/Argon2) are the correct choice.
