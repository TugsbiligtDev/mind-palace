pass: 3
questions:
  - type: mcq
    prompt: What is pivoting?
    options:
      - Switching to a new exploit when the first one fails
      - Using a compromised host as a relay to reach internal machines
      - Moving from a user account to administrator on the same host
      - Changing your IP address so the target can't block you
    answer: 1
    explanation: The compromised host can see internal systems you cannot reach directly. Pivoting borrows its position in the network to reach them.
  - type: mcq
    prompt: Why are internal machines often easier to attack once you have pivoted inside?
    options:
      - Internal machines are never patched, since they can't reach the internet for updates
      - The perimeter is hardened, but the inside is often trusted and less protected
      - Internal machines don't log anything, so attacks there go unnoticed
      - Firewalls only filter traffic leaving the network, not traffic inside
    answer: 1
    explanation: The "hard shell, soft centre" assumption is exactly what pivoting breaks — which is why modern defence treats the internal network as hostile too.
  - type: mcq
    prompt: Why is tunneling often used to carry pivoted traffic?
    options:
      - It compresses the traffic so large transfers finish faster
      - It hides traffic inside allowed channels to slip past firewall rules
      - It encrypts the traffic so it can't be logged or inspected by anyone on the network
      - It gives every internal machine a public IP address
    answer: 1
    explanation: Firewalls usually permit a few common connections; tunneling packs pivoted traffic into those, so defenders must watch for traffic shaped like something it isn't.
  - type: mcq
    prompt: What is the primary defence against pivoting across a network?
    options:
      - Strong, unique passwords on every internal machine, changed every month
      - "Network segmentation: zones that allow only needed connections"
      - Antivirus on every host, updated every day
      - A perimeter firewall that blocks all inbound traffic
    answer: 1
    explanation: Segmentation means a compromised web server simply cannot reach, say, the finance database — the network itself forbids the path, regardless of attacker skill.
  - type: mcq
    prompt: Pivoting combined with credential reuse is the engine of what larger technique?
    options:
      - "Privilege escalation: from a user account up to root"
      - "Lateral movement: compromise a host, reach more, repeat"
      - "Persistence: keeping access after the machine reboots"
      - "Exfiltration: copying data out of the network"
    answer: 1
    explanation: Lateral movement is the heart of enterprise/Active Directory attacks (a big subject beyond this course); segmentation and monitoring are what break the chain.
