steps:
  - kind: explain
    title: What a design system is
    body: |
      A **design system** is a shared set of decisions and building blocks, so every page looks and behaves consistently, whoever builds it:

      - **Tokens**: the raw decisions (colors, sizes, spacing, radii, shadows, motion) as named values.
      - **Components**: buttons, cards, forms, built only from tokens.
      - **Documentation**: a page showing every component, its variants and when to use it.

      Big ones (GOV.UK, Shopify Polaris, GitHub Primer) are public; reading them is a great way to learn. Inkwell needs a small one.

      **Example: Inkwell's button, from token to component.**

      ```css
      /* Tokens: the decisions, named once */
      :root {
        --color-brand: #7c2d12;
        --color-on-brand: #fff;
        --space-2: 0.5rem;
        --space-3: 1rem;
        --radius-2: 6px;
      }

      /* Component: built only from tokens */
      .button {
        background: var(--color-brand);
        color: var(--color-on-brand);
        padding: var(--space-2) var(--space-3);
        border-radius: var(--radius-2);
      }
      ```

      Change `--color-brand` once and every button, link and badge that uses it follows. The documentation page then shows the button and says when to use it.

  - kind: choice
    title: "Quick check: the parts"
    body: |
      Which of these is a **token** in a design system?
    options:
      - "`--space-3: 1rem`"
      - "A `.card` component"
      - "The showcase page that documents the buttons"
    answer: 0
    explanation: "Tokens are the raw named decisions, like a spacing value. Components are built from tokens, and the showcase is the documentation."

  - kind: explain
    title: Three tiers of tokens
    body: |
      Module 28 put every value in a variable. A system organises them in **tiers**, each referring to the one below:

      ```css
      :root {
        /* 1. primitive: the palette and raw scales. What exists. */
        --brown-700: #7c2d12;
        --brown-800: #5c2210;
        --stone-50: #fafaf9;

        /* 2. semantic: what a value is FOR. */
        --color-action: var(--brown-700);
        --color-action-hover: var(--brown-800);
        --color-surface: var(--stone-50);

        /* 3. component: one component's decisions. */
        --button-bg: var(--color-action);
        --button-bg-hover: var(--color-action-hover);
      }
      ```

      Components use **only** component or semantic tokens, never primitives or raw values. Then a rebrand changes primitives, a dark theme changes semantic tokens, and a one-off button tweak changes a component token. Each change happens in exactly one place.

      In the page: a button with `background: var(--button-bg)` is dark brown (`#7c2d12`), because the chain `--button-bg` → `--color-action` → `--brown-700` ends at that color. Change `--brown-700` and every button and link that uses `--color-action` changes with it.

  - kind: web
    title: "Try it: follow the token chain"
    body: |
      A "Signed copy" badge built from three tiers: `--green-700` (primitive) → `--color-success` (semantic) → `--badge-bg` (component). The badge is dark green.

      Try:

      1. Change the primitive `--green-700` to `#7c3aed`. The badge turns purple: a rebrand happens at the bottom tier.
      2. Undo that, then point the semantic token somewhere else: `--color-success: var(--blue-700);`. The badge turns blue without touching `.badge`.
      3. Change only the component token: `--badge-bg: var(--blue-700);`. Same result, but only for badges.

      Nothing is graded here: try it, then press **Continue**.
    html: |
      <p>Dune <span class="badge">Signed copy</span></p>
    css: |
      :root {
        /* primitive */
        --green-700: #15803d;
        --blue-700: #1d4ed8;
        --white: #ffffff;

        /* semantic */
        --color-success: var(--green-700);
        --color-on-success: var(--white);

        /* component */
        --badge-bg: var(--color-success);
        --badge-text: var(--color-on-success);
      }

      .badge {
        padding: 0.125rem 0.5rem;
        border-radius: 999px;
        background: var(--badge-bg);
        color: var(--badge-text);
      }

  - kind: web
    title: Tier the button tokens
    body: |
      Build the three tiers for Inkwell's button:

      1. **Primitives** on `:root`: `--brown-700: #7c2d12`, `--brown-800: #5c2210`, `--white: #ffffff`.
      2. **Semantic**: `--color-action: var(--brown-700)`, `--color-action-hover: var(--brown-800)`, `--color-on-action: var(--white)`.
      3. **Component**: `--button-bg: var(--color-action)`, `--button-bg-hover: var(--color-action-hover)`, `--button-text: var(--color-on-action)`.
      4. Make `.button` use `--button-bg` and `--button-text`, and `.button:hover` use `--button-bg-hover`. No raw colors in those rules.
    html: |
      <a class="button" href="shop.html">Shop now</a>
    css: |
      .button {
        display: inline-block;
        padding: 0.5rem 1rem;
        text-decoration: none;
        background: #7c2d12;
        color: white;
      }

      .button:hover {
        background: #5c2210;
      }
    tests:
      - "css('.button', 'background-color') + ' / ' + css('.button', 'color') + ' / hover ' + rule('.button:hover', 'background-color')"
      - "['--brown-700', '--brown-800', '--white'].map((t) => declared(':root', t))"
      - "['--color-action', '--color-action-hover', '--color-on-action'].map((t) => declared(':root', t))"
      - "['--button-bg', '--button-bg-hover', '--button-text'].map((t) => declared(':root', t))"
      - "[declared('.button', 'background') || declared('.button', 'background-color'), declared('.button', 'color'), declared('.button:hover', 'background') || declared('.button:hover', 'background-color')]"
    solution:
      css: |
        :root {
          --brown-700: #7c2d12;
          --brown-800: #5c2210;
          --white: #ffffff;

          --color-action: var(--brown-700);
          --color-action-hover: var(--brown-800);
          --color-on-action: var(--white);

          --button-bg: var(--color-action);
          --button-bg-hover: var(--color-action-hover);
          --button-text: var(--color-on-action);
        }

        .button {
          display: inline-block;
          padding: 0.5rem 1rem;
          text-decoration: none;
          background: var(--button-bg);
          color: var(--button-text);
        }

        .button:hover {
          background: var(--button-bg-hover);
        }
    hint: "Each tier points at the tier below with `var(…)`. The button rules end up reading only `--button-…` tokens."

  - kind: explain
    title: Type and spacing scales
    body: |
      Instead of picking sizes ad hoc, a system uses **scales**: each step is the previous one times a ratio. A **modular type scale** with ratio 1.25:

      ```css
      :root {
        --step-0: 1rem;                          /* body text */
        --step-1: calc(var(--step-0) * 1.25);    /* 1.25rem */
        --step-2: calc(var(--step-1) * 1.25);    /* 1.5625rem */
        --step-3: calc(var(--step-2) * 1.25);    /* ~1.95rem */
      }
      h3 { font-size: var(--step-1); }
      h2 { font-size: var(--step-2); }
      h1 { font-size: var(--step-3); }
      ```

      Spacing works the same way (`--space-xs` to `--space-xl`), often on a simple 4px or 8px grid. Combine with `clamp()` (Module 31) and every step can be fluid: tools like *Utopia* (utopia.fyi) generate fluid scales for you.

      In the page (with the usual 16px root size): body text is 16px, `h3` is 20px, `h2` is 25px and `h1` is about 31px. Each heading is a quarter bigger than the one below it.

  - kind: web
    title: "Try it: a scale with a ratio"
    body: |
      A book page whose three text sizes come from one scale. `--ratio` sits in a variable, so the whole scale can change at once. With `1.25`, the blurb is 16px, the author line 20px and the title 25px.

      Try:

      1. Change `--ratio` to `1.5`. The steps spread apart: 16px, 24px, 36px.
      2. Change it to `1.1`. The sizes nearly match: a calm, quiet page.
      3. Change `--step-0` to `1.125rem`. Every step grows, because each one is built from the step below.

      Nothing is graded here: try it, then press **Continue**.
    html: |
      <p class="title">The Hobbit</p>
      <p class="byline">J. R. R. Tolkien</p>
      <p class="blurb">A small adventure that grew into a legend.</p>
    css: |
      :root {
        --ratio: 1.25;
        --step-0: 1rem;
        --step-1: calc(var(--step-0) * var(--ratio));
        --step-2: calc(var(--step-1) * var(--ratio));
      }

      .blurb {
        font-size: var(--step-0);
      }

      .byline {
        font-size: var(--step-1);
      }

      .title {
        font-size: var(--step-2);
        font-weight: bold;
      }

  - kind: web
    title: A modular type scale
    body: |
      1. On `:root`, define `--ratio: 1.25`, `--step-0: 1rem`, and `--step-1` to `--step-3`, each the previous step times `var(--ratio)` (use `calc`).
      2. Set `p` to `--step-0`, `h3` to `--step-1`, `h2` to `--step-2` and `h1` to `--step-3`.
      3. Spacing: define `--space-s: 0.5rem` and `--space-m: 1rem`, and use `--space-m` as the `margin-block-end` of all four elements.
    html: |
      <h1>Inkwell Books</h1>
      <h2>New arrivals</h2>
      <h3>Fiction</h3>
      <p>Twelve new titles this week.</p>
    css: |
      * {
        margin: 0;
      }
    tests:
      - "cssAll('h1, h2, h3, p', 'font-size')"
      - "cssAll('h1, h2, h3, p', 'margin-bottom')"
      - "[declared(':root', '--step-2'), declared('h2', 'font-size')]"
    solution:
      css: |
        * {
          margin: 0;
        }

        :root {
          --ratio: 1.25;
          --step-0: 1rem;
          --step-1: calc(var(--step-0) * var(--ratio));
          --step-2: calc(var(--step-1) * var(--ratio));
          --step-3: calc(var(--step-2) * var(--ratio));
          --space-s: 0.5rem;
          --space-m: 1rem;
        }

        p {
          font-size: var(--step-0);
        }

        h3 {
          font-size: var(--step-1);
        }

        h2 {
          font-size: var(--step-2);
        }

        h1 {
          font-size: var(--step-3);
        }

        h1, h2, h3, p {
          margin-block-end: var(--space-m);
        }
    hint: "`--step-2: calc(var(--step-1) * var(--ratio));`. The margin rule must come after `* { margin: 0; }`."

  - kind: explain
    title: Themes swap semantic tokens
    body: |
      With tiers in place, a theme is just a different mapping of **semantic** tokens. Components never change:

      ```css
      [data-theme="dark"] {
        --color-surface: var(--stone-950);
        --color-text: var(--stone-100);
        --color-action: var(--orange-300);
        --color-on-action: var(--stone-950);
      }
      ```

      A wrinkle: component tokens defined on `:root` were already resolved there. If `--button-bg: var(--color-action)` sits on `:root`, a dark section inherits the *already computed* light value. The fix: declare component tokens on the **component** (`.button { --button-bg: var(--color-action); }`), so they're resolved where the theme applies.

      In the page: inside an element with `data-theme="dark"`, anything using `--color-surface` or `--color-text` turns dark with light text, while the rest of the page stays light.

  - kind: web
    title: "Try it: themes and the wrinkle"
    body: |
      Two notes, the second inside `data-theme="sepia"`. The theme remaps `--color-note`, and the note **text** follows it. But the badge doesn't: `--badge-bg` sits on `:root`, so it was resolved there, with the light value.

      Try:

      1. Cut the `--badge-bg: var(--color-note);` line from `:root` and paste it inside the `.badge` rule. Now the sepia badge turns brown too, because the token is resolved on the badge, inside the theme.
      2. In the `[data-theme="sepia"]` rule, change `--color-note` to `#15803d`. Only the second note changes.

      Nothing is graded here: try it, then press **Continue**.
    html: |
      <div class="note">
        <p>Staff note <span class="badge">new</span></p>
      </div>
      <div class="note" data-theme="sepia">
        <p>Staff note <span class="badge">new</span></p>
      </div>
    css: |
      :root {
        --color-note: #1d4ed8;
        --badge-bg: var(--color-note);
      }

      [data-theme="sepia"] {
        --color-note: #7c2d12;
      }

      .note {
        padding: 1rem;
        color: var(--color-note);
      }

      .badge {
        padding: 0 0.5rem;
        color: white;
        background: var(--badge-bg);
      }

  - kind: web
    title: A dark section
    body: |
      The second section has `data-theme="dark"`, but its button and text still look light.

      1. Add a `[data-theme="dark"]` rule that remaps the semantic tokens: `--color-surface: #0b0f19`, `--color-text: #e5e7eb`, `--color-action: #fdba74`, `--color-on-action: #0b0f19`.
      2. Move the **component** tokens (`--button-bg`, `--button-text`) from `:root` onto `.button`, so they resolve inside each theme.

      Don't add any raw colors to `.button` or `.section`.
    html: |
      <section class="section">
        <p>Light section</p>
        <a class="button" href="#">Shop</a>
      </section>
      <section class="section" data-theme="dark">
        <p>Dark section</p>
        <a class="button" href="#">Shop</a>
      </section>
    css: |
      :root {
        --color-surface: #fafaf9;
        --color-text: #1c1917;
        --color-action: #7c2d12;
        --color-on-action: #ffffff;

        --button-bg: var(--color-action);
        --button-text: var(--color-on-action);
      }

      .section {
        padding: 1rem;
        background: var(--color-surface);
        color: var(--color-text);
      }

      .button {
        display: inline-block;
        padding: 0.5rem 1rem;
        text-decoration: none;
        background: var(--button-bg);
        color: var(--button-text);
      }
    tests:
      - "cssAll('.section', 'background-color') + ' / ' + cssAll('.section', 'color')"
      - "cssAll('.button', 'background-color') + ' / ' + cssAll('.button', 'color')"
      - "declared(':root', '--button-bg')"
      - "declared('.button', '--button-bg')"
    solution:
      css: |
        :root {
          --color-surface: #fafaf9;
          --color-text: #1c1917;
          --color-action: #7c2d12;
          --color-on-action: #ffffff;
        }

        [data-theme="dark"] {
          --color-surface: #0b0f19;
          --color-text: #e5e7eb;
          --color-action: #fdba74;
          --color-on-action: #0b0f19;
        }

        .section {
          padding: 1rem;
          background: var(--color-surface);
          color: var(--color-text);
        }

        .button {
          --button-bg: var(--color-action);
          --button-text: var(--color-on-action);
          display: inline-block;
          padding: 0.5rem 1rem;
          text-decoration: none;
          background: var(--button-bg);
          color: var(--button-text);
        }
    hint: "The `[data-theme=\"dark\"]` block only redefines the four semantic tokens. Then cut the two `--button-…` lines from `:root` and paste them into `.button`."

  - kind: explain
    title: Documenting components
    body: |
      A design system without documentation is just a stylesheet. The usual form is a **component showcase** (or "style guide") page:

      - Every **token** shown visually: color swatches with names and contrast ratios, the type scale, the spacing scale.
      - Every **component** with all its variants and states (default, hover, focus, disabled, error), rendered live from the real CSS.
      - **Usage notes**: when to use it, when not to, and its accessibility requirements ("icon-only buttons need an aria-label").
      - The **HTML** to copy.

      Tools like **Storybook** automate this for big teams; a hand-written `showcase.html` works perfectly for a small site, and it's what the Advanced capstone builds.

      <!-- page -->

      **Example: one entry from a `showcase.html` page.**

      ```html
      <section id="button">
        <h2>Button</h2>
        <p>Use for actions (Add to basket, Send). For going to another page, use a link.</p>

        <button class="button">Default</button>
        <button class="button" disabled>Disabled</button>
        <button class="button button--secondary">Secondary</button>
        <button class="button" aria-label="Close">×</button>

        <p>Icon-only buttons need an <code>aria-label</code>.</p>
        <pre><code>&lt;button class="button"&gt;Add to basket&lt;/button&gt;</code></pre>
      </section>
      ```

      Because it uses the real stylesheet, the buttons on this page are always exactly what the site shows. Hover and focus states are seen by hovering and tabbing to them.

  - kind: choice
    title: "Quick check: what a showcase shows"
    body: |
      Your showcase page shows each button only in its default state. What is it missing?
    options:
      - "Nothing: one state is enough"
      - "Its other states and variants (hover, focus, disabled, error), plus usage notes and the HTML to copy"
      - "A screenshot of the Figma file"
    answer: 1
    explanation: "A showcase renders every component in all its variants and states from the real CSS, with notes on when (and when not) to use it."

  - kind: why
    body: |
      Consistency is what makes a site feel trustworthy, and tokens are how you get it without policing every page. Tiers let you rebrand, theme or tweak one component in one place, and a showcase page makes the system something everyone can see and reuse.

  - kind: recap
    body: |
      - Design system = tokens + components + documentation.
      - Token tiers: **primitive** (`--brown-700`) → **semantic** (`--color-action`) → **component** (`--button-bg`). Components use only the upper tiers.
      - Type and spacing **scales**: a ratio (`calc(var(--step-1) * var(--ratio))`), optionally fluid.
      - Themes remap semantic tokens; declare component tokens on the component so they resolve per theme.
      - Document everything on a showcase page.
