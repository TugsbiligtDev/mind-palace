steps:
  - kind: explain
    title: Headings make an outline
    body: |
      HTML has six heading levels, `<h1>` (most important) to `<h6>` (least). They're not "big text" and "small text": they form the page's **outline**, like a book's chapters and sections.

      ```html
      <h1>Inkwell Books</h1>          ← the page's title: one per page
        <h2>New arrivals</h2>         ← a main section
          <h3>Fiction</h3>            ← a part of that section
          <h3>Poetry</h3>
        <h2>Visit us</h2>
      ```

      In the page, *Inkwell Books* is the biggest, *New arrivals* and *Visit us* a size smaller, *Fiction* and *Poetry* smaller again: all bold, each on its own line. (The `←` notes are just labels for you here, not part of the code.)

      Rules of thumb:

      - **One `<h1>`** per page, saying what the page is about.
      - **Don't skip levels** going down: after an `h2` comes an `h3`, not an `h5`.
      - **Never pick a heading for its size.** Want small bold text? That's CSS's job. Screen reader users jump around a page by its headings, so a wrong level misleads them.

  - kind: web
    title: "Try it: heading levels"
    body: |
      The `index.html` tab has a small outline for Inkwell's *About* page: one `h1`, two `h2` sections, and an `h3` inside the first. In the preview, each level is a little smaller than the one above it.

      Try this:

      1. Change the `h3` to an `h4` (both the opening and the closing tag). It shrinks, but the outline now skips a level, which is exactly what not to do.
      2. Add a second `h3` under *Our story*, such as `<h3>The cat</h3>`.

      Nothing is graded here: try things, then press **Continue**.
    html: |
      <h1>About Inkwell</h1>
      <h2>Our story</h2>
      <h3>The first shop</h3>
      <p>We opened in 1998 with three shelves and a kettle.</p>
      <h2>Our team</h2>
      <p>Four booksellers and one cat.</p>

  - kind: web
    title: Fix the outline
    body: |
      Inkwell's events page picked its headings by size. Fix the levels so the outline makes sense:

      - The page title *Events at Inkwell* is the only `h1`.
      - *This month* and *Every week* are main sections: `h2`.
      - *Poetry night* and *Children's story hour* are parts of *This month*: `h3`.
      - *Book club* is a part of *Every week*: `h3`.

      Don't change any text.
    html: |
      <h3>Events at Inkwell</h3>
      <h1>This month</h1>
      <h5>Poetry night</h5>
      <p>Thursday 7pm. Bring a poem, or just listen.</p>
      <h5>Children's story hour</h5>
      <p>Saturday 10am, for ages 4 to 8.</p>
      <h1>Every week</h1>
      <h4>Book club</h4>
      <p>Sundays at 4pm. This month: <em>Beloved</em>.</p>
    tests:
      - "$$('h1, h2, h3, h4, h5, h6').map((h) => h.localName + ': ' + h.textContent.trim())"
    solution:
      html: |
        <h1>Events at Inkwell</h1>
        <h2>This month</h2>
        <h3>Poetry night</h3>
        <p>Thursday 7pm. Bring a poem, or just listen.</p>
        <h3>Children's story hour</h3>
        <p>Saturday 10am, for ages 4 to 8.</p>
        <h2>Every week</h2>
        <h3>Book club</h3>
        <p>Sundays at 4pm. This month: <em>Beloved</em>.</p>
    hint: "Read the headings as a table of contents: one title, two chapters, and sections inside each chapter. Change both the opening and the closing tag."
    reject:
      - html: |
          <h1>Events at Inkwell</h1>
          <h2>This month</h2>
          <h3>Poetry night</h3>
          <p>Thursday 7pm. Bring a poem, or just listen.</p>
          <h3>Children's story hour</h3>
          <p>Saturday 10am, for ages 4 to 8.</p>
          <h2>Every week</h2>
          <h4>Book club</h4>
          <p>Sundays at 4pm. This month: <em>Beloved</em>.</p>

  - kind: explain
    title: Paragraphs and line breaks
    body: |
      Wrap each paragraph of text in `<p>`. The browser **collapses whitespace**: any run of spaces, tabs and new lines in your file becomes a single space on the page. Pressing Enter in your code does nothing visible.

      `<br>` forces a line break **inside** one paragraph. Use it only where the line break is part of the content, like an address or a poem:

      ```html
      <p>Inkwell Books<br>
      12 Harbour Street<br>
      Bristol</p>
      ```

      shows one paragraph on three short lines: *Inkwell Books*, then *12 Harbour Street*, then *Bristol*.

      Without the `<br>`s, the same code shows one line: *Inkwell Books 12 Harbour Street Bristol*, because the new lines in the file collapse into spaces.

      Don't use `<br><br>` to make space between paragraphs. Use separate `<p>` elements, and CSS for the spacing.

  - kind: choice
    title: "Quick check: Enter in the code"
    body: |
      In your file you type `<p>Open daily.` then press Enter and type `Closed on holidays.</p>`. How does the page show it?
    options:
      - "On one line: *Open daily. Closed on holidays.*"
      - "On two lines, like in the file"
      - "As two separate paragraphs"
    answer: 0
    explanation: "The browser collapses the new line into a single space. To break the line inside a paragraph, write `<br>`; for a new paragraph, use a second `<p>`."

  - kind: explain
    title: strong, em, b and i
    body: |
      Four elements look alike but mean different things:

      | Element | Meaning | Default look |
      |---|---|---|
      | `<strong>` | **importance**, seriousness, urgency | bold |
      | `<em>` | **stress** emphasis, which changes the meaning of the sentence | italic |
      | `<b>` | bring attention, *without* extra importance (a keyword, a product name) | bold |
      | `<i>` | a different voice: a book title in running text, a foreign word, a thought | italic |

      "Do **not** feed the shop cat" → `<strong>`. "I *said* Tuesday" → `<em>` (the stress changes the meaning). Screen readers may change their tone for `strong` and `em`.

      When in doubt, `<strong>` and `<em>` are the usual choice.

      ```html
      <p>Do <strong>not</strong> feed the shop cat.</p>
      <p>I <em>said</em> Tuesday.</p>
      <p>Our tote bags come in <b>Ink Blue</b>.</p>
      <p>We just got a copy of <i>Persuasion</i>.</p>
      ```

      shows: Do **not** feed the shop cat. / I *said* Tuesday. / Our tote bags come in **Ink Blue**. / We just got a copy of *Persuasion*. The looks match in pairs; the meaning is what differs.

  - kind: choice
    title: "Quick check: pick the element"
    body: |
      A sign on the page says: *Do **not** leave bags by the door.* The word *not* is a serious warning. Which element should wrap it?
    options:
      - "`<b>`"
      - "`<i>`"
      - "`<em>`"
      - "`<strong>`"
    answer: 3
    explanation: "A serious warning is **importance**, which is `<strong>`. `<b>` only draws attention without importance, `<em>` is spoken stress, and `<i>` is a different voice such as a book title."

  - kind: explain
    title: Lists
    body: |
      - `<ul>` is an **unordered** list (bullets): the order doesn't matter.
      - `<ol>` is an **ordered** list (numbers): steps, rankings, anything where order matters.
      - Each item is an `<li>`, and **only** `<li>` elements may sit directly inside `<ul>` or `<ol>`.

      To **nest** a list, put the inner list *inside* an `<li>`, after its text:

      ```html
      <ul>
        <li>Fiction
          <ul>
            <li>Mystery</li>
            <li>Science fiction</li>
          </ul>
        </li>
        <li>Poetry</li>
      </ul>
      ```

      shows two bullets, *Fiction* and *Poetry*, with a second, more indented bullet list (*Mystery*, *Science fiction*) tucked under *Fiction*. The inner bullets usually have a different shape (a hollow circle).

      `<ol>` has handy attributes: `start="5"` begins at 5, `reversed` counts down.

      ```html
      <ol reversed>
        <li>Emma</li>
        <li>Dune</li>
        <li>Beloved</li>
      </ol>
      ```

      shows a countdown: 3. Emma, 2. Dune, 1. Beloved.

  - kind: web
    title: "Try it: text and lists"
    body: |
      The `index.html` tab has a little bit of everything so far: a `<br>` line break, `strong`/`em`/`b`/`i`, an ordered list counting down, and a bulleted list with a list nested inside one item.

      Look at how the nested list sits *inside* the *Gifts* `<li>`, after the word *Gifts* and before its `</li>`.

      Try this:

      1. Remove `reversed` from the `<ol>`. The numbers now count up: 1, 2, 3.
      2. Add `start="5"` to the `<ol>`. It begins at 5.
      3. Change the outer `<ul>` (and its closing tag) to `<ol>`. The bullets turn into numbers.
      4. Add a third card to the nested list: `<li>Gift cards</li>`.

      Nothing is graded here: try things, then press **Continue**.
    html: |
      <p>Inkwell Books<br>12 Harbour Street</p>
      <p>Do <strong>not</strong> feed the cat. I <em>said</em> Tuesday.</p>
      <p>Try our <b>Ink Blue</b> tote, or read <i>Persuasion</i>.</p>

      <h2>Top three this week</h2>
      <ol reversed>
        <li>Emma</li>
        <li>Dune</li>
        <li>Beloved</li>
      </ol>

      <h2>In the shop</h2>
      <ul>
        <li>Books</li>
        <li>Gifts
          <ul>
            <li>Bookmarks</li>
            <li>Tote bags</li>
          </ul>
        </li>
      </ul>

  - kind: web
    title: Build the shop's lists
    body: |
      Turn the plain text into proper lists:

      1. *How to order* is a sequence of steps, so make the three steps an **ordered** list.
      2. *We stock* is a bulleted list with two items, **Fiction** and **Non-fiction**.
      3. Inside the **Fiction** item, nest a bulleted list: **Mystery** and **Fantasy**.

      Keep the two `h2` headings as they are.
    html: |
      <h2>How to order</h2>
      Find a book.
      Add it to your basket.
      Pay at the checkout.

      <h2>We stock</h2>
      Fiction: Mystery, Fantasy
      Non-fiction
    tests:
      - "count('ol > li')"
      - "$$('ol > li').map((li) => li.textContent.trim())"
      - "count('ul')"
      - "$$('body > ul > li').map((li) => li.firstChild.textContent.trim())"
      - "$$('body > ul > li > ul > li').map((li) => li.textContent.trim())"
      - "count('ul > :not(li), ol > :not(li)')"
    solution:
      html: |
        <h2>How to order</h2>
        <ol>
          <li>Find a book.</li>
          <li>Add it to your basket.</li>
          <li>Pay at the checkout.</li>
        </ol>

        <h2>We stock</h2>
        <ul>
          <li>Fiction
            <ul>
              <li>Mystery</li>
              <li>Fantasy</li>
            </ul>
          </li>
          <li>Non-fiction</li>
        </ul>
    hint: "The nested `<ul>` goes inside the Fiction `<li>`, after the word *Fiction* and before that `</li>`."
    reject:
      - html: |
          <h2>How to order</h2>
          <ol>
            <li>Find a book.</li>
            <li>Add it to your basket.</li>
            <li>Pay at the checkout.</li>
          </ol>

          <h2>We stock</h2>
          <ul>
            <li>Fiction</li>
            <ul>
              <li>Mystery</li>
              <li>Fantasy</li>
            </ul>
            <li>Non-fiction</li>
          </ul>

  - kind: explain
    title: Quotes and code
    body: |
      - `<blockquote>` is a longer quotation, usually shown indented. The optional `cite` attribute holds the source's URL. Short quotes inside a sentence use `<q>`, which adds quotation marks.
      - `<code>` marks a piece of computer code inside a sentence: "set `<code>lang</code>` on the html element".
      - `<pre>` (preformatted) keeps every space and line break exactly as typed, in a monospace font. Wrap code blocks as `<pre><code>…</code></pre>`.

      ```html
      <blockquote>
        <p>A room without books is like a body without a soul.</p>
      </blockquote>
      <p>— Cicero</p>
      ```

      shows the quotation as its own indented block, with *— Cicero* as an ordinary paragraph below it.

      ```html
      <p>The sign says <q>Mind the cat</q>.</p>
      <p>Set <code>lang</code> on the html element.</p>
      ```

      shows: The sign says “Mind the cat”. (the browser adds the curly quotes) and Set `lang` on the html element. (with *lang* in a typewriter-style font).

  - kind: choice
    title: "Quick check: keep the spaces"
    body: |
      You want to show a short poem with its line breaks and indents exactly as typed. Which element keeps every space and new line?
    options:
      - "`<blockquote>`"
      - "`<pre>`"
      - "`<q>`"
    answer: 1
    explanation: "`<pre>` (preformatted) keeps whitespace exactly as written. `<blockquote>` and `<q>` are for quotations and collapse spaces like normal text."

  - kind: explain
    title: HTML entities
    body: |
      Some characters mean something to HTML. A `<` starts a tag, so how do you *show* one? With an **entity**: an `&`, a name, and a `;`.

      | You want | Write |
      |---|---|
      | `<` | `&lt;` (less than) |
      | `>` | `&gt;` |
      | `&` | `&amp;` |
      | `"` inside an attribute | `&quot;` |
      | a space that never breaks a line | `&nbsp;` |
      | © | `&copy;` |

      Since your file is UTF-8, you can type characters like é, — or © directly. Entities are only *needed* for `<` and `&`.

      `&nbsp;` keeps two words together, as in `10&nbsp;am` or `Mr.&nbsp;Reed`, so a line never breaks between them. Don't use runs of `&nbsp;` for spacing; that's CSS's job.

      ```html
      <p>Every paragraph starts with &lt;p&gt;.</p>
      <p>&copy; 2026 Inkwell Books</p>
      ```

      shows: Every paragraph starts with `<p>`. and *© 2026 Inkwell Books*. The entities turn into the characters, and no tag is created.

  - kind: web
    title: "Try it: quotes, code and entities"
    body: |
      The `index.html` tab has a `blockquote`, a short `q`, a `<pre><code>` block and a few entities. Compare the code with the preview:

      - The `blockquote` is indented; the `q` gets quotation marks from the browser.
      - Inside `<pre>`, the line breaks and the extra spaces stay exactly as typed.
      - `&lt;p&gt;` shows as `<p>`, and `&copy;` as ©.

      Try this:

      1. In the last paragraph, replace `&lt;p&gt;` with a plain `<p>`. The text after it jumps to a new paragraph, because the browser now reads a real tag. Change it back.
      2. Add some extra spaces between words in an ordinary `<p>`, then inside the `<pre>`. Only the `<pre>` keeps them.

      Nothing is graded here: try things, then press **Continue**.
    html: |
      <blockquote>
        <p>A room without books is like a body without a soul.</p>
      </blockquote>
      <p>The sign says <q>Mind the cat</q>.</p>
      <pre><code>Opening hours
        Tue–Sat   9am–6pm
        Sun      10am–4pm</code></pre>
      <p>Every paragraph starts with &lt;p&gt; and ends with &lt;/p&gt;.</p>
      <p>&copy; 2026 Inkwell Books</p>

  - kind: web
    title: Show the code, not run it
    body: |
      Inkwell's help page wants to *show* visitors a tag, but the browser treats it as a real tag. Look at the preview: the `<strong>` example went bold and vanished.

      Rewrite the second paragraph with entities so the page shows the text exactly as:

      `To make text important, wrap it in <strong> and </strong> tags.`

      Then, as a good habit, write the ampersand in the third paragraph as `&amp;`. (A lone `&` followed by a space happens to work, which is why the checker can't tell the difference, but `&amp;` is always safe.)
    html: |
      <h1>Help</h1>
      <p>To make text important, wrap it in <strong> and </strong> tags.</p>
      <p>Our café's favourite cartoon: Tom & Jerry</p>
    tests:
      - "text('p:nth-of-type(1)')"
      - "count('p strong')"
      - "text('p:nth-of-type(2)')"
    solution:
      html: |
        <h1>Help</h1>
        <p>To make text important, wrap it in &lt;strong&gt; and &lt;/strong&gt; tags.</p>
        <p>Our café's favourite cartoon: Tom &amp; Jerry</p>
    hint: "Replace each `<` with `&lt;` and each `>` with `&gt;`. The ampersand becomes `&amp;`."

  - kind: info
    title: "🔹 Description lists: dl, dt, dd"
    body: |
      A **description list** pairs terms with their descriptions, like a glossary or a book's details:

      ```html
      <dl>
        <dt>Author</dt>
        <dd>Frank Herbert</dd>
        <dt>Condition</dt>
        <dd>Very good, light shelf wear</dd>
      </dl>
      ```

      `<dt>` is the term, `<dd>` the description. Recognise it when you see it; you'll use it occasionally.

  - kind: web
    title: "Try it: a description list"
    body: |
      This is the example above. In the preview each `dt` term sits on its own line, and its `dd` description is indented below it.

      Try this:

      1. Add another pair: `<dt>Price</dt>` and `<dd>£8.99</dd>`.
      2. A term can have two descriptions: add a second `<dd>` under *Condition*, such as `<dd>Signed by a previous owner</dd>`.

      Nothing is graded here: try things, then press **Continue**.
    html: |
      <dl>
        <dt>Author</dt>
        <dd>Frank Herbert</dd>
        <dt>Condition</dt>
        <dd>Very good, light shelf wear</dd>
      </dl>

  - kind: why
    body: |
      The right element gives content its **meaning**, not just its look. Search engines read the heading outline to understand the page, screen readers list the headings and announce "list, 3 items", and CSS can style every `ol` the same way. A page made of `<br>`s and big bold text looks fine to you and is a maze to everyone else.

  - kind: recap
    body: |
      - Headings `h1`–`h6` form an outline: one `h1`, no skipped levels, never chosen for size.
      - `<p>` for paragraphs; whitespace collapses; `<br>` only for line breaks that belong to the content.
      - `<strong>` = importance, `<em>` = stress; `<b>` and `<i>` = different voice without extra importance.
      - `<ul>`/`<ol>` hold only `<li>`; nested lists go inside an `<li>`.
      - `<blockquote>`, `<code>`, `<pre>`; entities `&lt;` `&gt;` `&amp;` `&nbsp;`; 🔹 `<dl>` for term/description pairs.
