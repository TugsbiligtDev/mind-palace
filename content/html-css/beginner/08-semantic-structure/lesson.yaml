steps:
  - kind: explain
    title: Pages have regions
    body: |
      Almost every web page has the same regions: a top bar with the logo and menu, the main content, maybe a sidebar, and a footer. HTML has an element for each one:

      | Element | Holds |
      |---|---|
      | `<header>` | introductory content: logo, site name, often the navigation |
      | `<nav>` | a block of **main** navigation links |
      | `<main>` | the page's main content. **Exactly one** per page |
      | `<aside>` | content related to the page but not part of its main flow: a sidebar, a "you might also like" box |
      | `<footer>` | closing information: contact details, copyright, small links |

      ```html
      <header>
        <img src="images/logo.svg" alt="Inkwell Books" width="200" height="60">
        <nav>…</nav>
      </header>
      <main>…</main>
      <footer>© 2026 Inkwell Books</footer>
      ```

      In the page, this looks exactly like plain blocks stacked from top to bottom: the logo, then the menu, the main content and the copyright line. These elements have **no special look** of their own. What they add is meaning, which browsers, screen readers and search engines can read.

  - kind: choice
    title: "Quick check: how many main?"
    body: |
      How many `<main>` elements should a page have?
    options:
      - "As many as it has sections"
      - "Exactly one"
      - "None: `<main>` is optional decoration"
    answer: 1
    explanation: "Each page has exactly one `<main>`, holding its main content. Screen reader users can jump straight to it."

  - kind: explain
    title: section and article
    body: |
      Inside `<main>`, two elements group content:

      - `<article>` is a **self-contained** piece that would make sense on its own, even copied to another site: a blog post, a news story, a book review, a product card.
      - `<section>` is a **thematic group** of content, usually with its own heading: "New arrivals", "Opening hours", "Reviews".

      A quick test: *could this be shared on its own, like a link to a post?* → `article`. *Is it a chapter of this page?* → `section`. Both normally start with a heading.

      Articles can contain sections (a long review with "Plot" and "Verdict"), and sections can contain articles (a "Reviews" section holding several review articles).

      ```html
      <main>
        <section>
          <h2>Events this month</h2>
          <article>
            <h3>Poetry night</h3>
            <p>Thursday 7pm. Bring a poem, or just listen.</p>
          </article>
        </section>
      </main>
      ```

      In the page, this shows only the heading *Events this month*, the smaller heading *Poetry night* and the paragraph, one under the other. The `main`, `section` and `article` themselves are invisible: they're labels on the content, not decoration.

  - kind: choice
    title: "Quick check: article or section?"
    body: |
      On the home page, one book review that could be shared on its own with a link. Which element fits it best?
    options:
      - "`<section>`"
      - "`<article>`"
      - "`<aside>`"
    answer: 1
    explanation: "Something self-contained that makes sense on its own is an `<article>`. A `<section>` is a chapter of the page, like the whole *Reviews* area that holds the review articles."

  - kind: explain
    title: div and span, the generic boxes
    body: |
      `<div>` (a block) and `<span>` (inline, inside a line of text) mean **nothing at all**. They are plain boxes for when you need a hook for CSS and no meaningful element fits:

      ```html
      <div class="card-grid">…</div>        ← a wrapper purely for layout
      <p>Price: <span class="price">£8.99</span></p>
      ```

      In the page, the `div` adds nothing you can see, and the second line reads simply *Price: £8.99*, all on one line: a `span` never breaks the line, while a `div` always starts on a new one.

      That's fine and normal. The problem is using `div` *instead of* an element that does have a meaning.

  - kind: choice
    title: "Quick check: div or span?"
    body: |
      You want to colour just the price inside the sentence *Price: £8.99*, without breaking the line. Which element wraps `£8.99`?
    options:
      - "`<span class=\"price\">`"
      - "`<div class=\"price\">`"
      - "`<section class=\"price\">`"
    answer: 0
    explanation: "A `span` sits inside a line of text. A `div` (and a `section`) is a block that starts on a new line, and a `section` would also give the price a meaning it doesn't have."

  - kind: explain
    title: "Common mistake: div soup"
    body: |
      Here's a page built only from divs:

      ```html
      <div class="header">
        <div class="nav">…</div>
      </div>
      <div class="main">
        <div class="post">…</div>
      </div>
      <div class="footer">…</div>
      ```

      It can be styled to look identical to the semantic version, so what's lost?

      - **Screen readers** offer a list of *landmarks* (banner, navigation, main, footer) to jump straight to the content. Div soup has none.
      - **Keyboard users** can't skip the menu to reach the main content.
      - **Search engines** and reading modes (Safari's Reader, for example) can't tell the article from the clutter.
      - **Developers** reading the code have to decode class names.

  - kind: web
    title: "Try it: see the regions"
    body: |
      Semantic elements have no look of their own, so this page's `style.css` draws a **dashed outline** around each one and writes its name in the corner. (You'll learn to write CSS like this from Module 12; just read the preview for now.)

      Find each region in the preview: `header` with a `nav` inside it, `main` holding a `section` that holds two `article`s, an `aside` under it (CSS could move it to the side later), and a `footer`.

      Try this:

      1. Change the first `<article>` (and its closing tag) to `<div>`. It still shows, but its label now says *div*: same look, no meaning.
      2. Wrap the two articles in a second `<section>` with its own `<h2>`, and watch the outlines nest.

      Nothing is graded here: try things, then press **Continue**.
    html: |
      <header>
        <h1>Inkwell Events</h1>
        <nav>
          <a href="index.html">Home</a>
          <a href="events.html">Events</a>
        </nav>
      </header>
      <main>
        <section>
          <h2>This month</h2>
          <article>
            <h3>Poetry night</h3>
            <p>Thursday 7pm.</p>
          </article>
          <article>
            <h3>Story hour</h3>
            <p>Saturday 10am.</p>
          </article>
        </section>
      </main>
      <aside>
        <p>Tip: events are free.</p>
      </aside>
      <footer>
        <p>© 2026 Inkwell Books</p>
      </footer>
    css: |
      header, nav, main, section, article, aside, footer, div {
        display: block;
        outline: 1px dashed gray;
        margin: 8px;
        padding: 14px 8px 4px;
        position: relative;
      }
      header::before, nav::before, main::before, section::before,
      article::before, aside::before, footer::before, div::before {
        position: absolute;
        top: 0;
        left: 4px;
        font: 11px monospace;
        color: gray;
      }
      header::before { content: "header"; }
      nav::before { content: "nav"; }
      main::before { content: "main"; }
      section::before { content: "section"; }
      article::before { content: "article"; }
      aside::before { content: "aside"; }
      footer::before { content: "footer"; }
      div::before { content: "div"; }

  - kind: web
    title: Drain the div soup
    body: |
      Here's the book page from the agency's first draft, built entirely of divs. Replace each `div` with the right element, keeping the classes off (you won't need them):

      - `div class="top"` → the page's header
      - `div class="menu"` → the navigation inside it
      - `div class="content"` → the main content
      - `div class="review"` → a self-contained review (there are two)
      - `div class="related"` → the related-books box beside the main content
      - `div class="bottom"` → the footer

      Remember to change every closing `</div>` to match.
    html: |
      <div class="top">
        <h1>Inkwell Books</h1>
        <div class="menu">
          <a href="index.html">Home</a>
          <a href="books.html">Books</a>
        </div>
      </div>
      <div class="content">
        <h2>Dune: reader reviews</h2>
        <div class="review">
          <h3>A desert you can taste</h3>
          <p>Five stars. I read it in one weekend.</p>
        </div>
        <div class="review">
          <h3>Slow start, huge payoff</h3>
          <p>Stick with the first hundred pages.</p>
        </div>
      </div>
      <div class="related">
        <h2>You might also like</h2>
        <p>The Odyssey</p>
      </div>
      <div class="bottom">
        <p>© 2026 Inkwell Books</p>
      </div>
    tests:
      - "$$('body > *').map((e) => e.localName)"
      - "count('header > nav')"
      - "$$('nav a').length"
      - "count('main > article')"
      - "$$('article h3').map((h) => h.textContent)"
      - "count('div')"
      - "text('aside h2')"
    solution:
      html: |
        <header>
          <h1>Inkwell Books</h1>
          <nav>
            <a href="index.html">Home</a>
            <a href="books.html">Books</a>
          </nav>
        </header>
        <main>
          <h2>Dune: reader reviews</h2>
          <article>
            <h3>A desert you can taste</h3>
            <p>Five stars. I read it in one weekend.</p>
          </article>
          <article>
            <h3>Slow start, huge payoff</h3>
            <p>Stick with the first hundred pages.</p>
          </article>
        </main>
        <aside>
          <h2>You might also like</h2>
          <p>The Odyssey</p>
        </aside>
        <footer>
          <p>© 2026 Inkwell Books</p>
        </footer>
    hint: "Order from the top: `header` (with `nav` inside), `main` (with two `article`s inside), `aside`, `footer`. Every `div` disappears."
    reject:
      - html: |
          <header>
            <h1>Inkwell Books</h1>
            <nav>
              <a href="index.html">Home</a>
              <a href="books.html">Books</a>
            </nav>
          </header>
          <main>
            <h2>Dune: reader reviews</h2>
            <section>
              <h3>A desert you can taste</h3>
              <p>Five stars. I read it in one weekend.</p>
            </section>
            <section>
              <h3>Slow start, huge payoff</h3>
              <p>Stick with the first hundred pages.</p>
            </section>
          </main>
          <aside>
            <h2>You might also like</h2>
            <p>The Odyssey</p>
          </aside>
          <footer>
            <p>© 2026 Inkwell Books</p>
          </footer>

  - kind: explain
    title: A few more rules
    body: |
      - **One `<main>`** per page (unless the others are `hidden`). It should hold the content that's unique to this page, not the header and footer that repeat everywhere.
      - `<header>` and `<footer>` can also appear **inside** an `article` or `section`, for that piece's own intro and closing (a review's author and date, say). Only the top-level ones are the page's banner and footer landmarks.
      - Use `<nav>` for **major** navigation blocks (the main menu, a table of contents), not every group of links. A footer's three small links don't need one.
      - Don't skip the heading because the element "already says it's a section". Sections and articles should still have headings.

      <!-- page -->

      **Example: all four rules on one page.**

      ```html
      <header>…logo and the main <nav>…</header>   <!-- the page's banner -->
      <main>                                       <!-- only one -->
        <h1>Reviews</h1>
        <article>
          <header>                                 <!-- this review's own intro -->
            <h2>Dune, reviewed</h2>
            <p>By Sam, 3 March</p>
          </header>
          <p>A desert, a family, a war over spice…</p>
          <footer><p>Filed under: science fiction</p></footer>
        </article>
      </main>
      <footer>                                     <!-- the page's footer -->
        <a href="privacy.html">Privacy</a> · <a href="contact.html">Contact</a>
      </footer>
      ```

      The `header` and `footer` inside the `article` belong to that review only. The footer's two small links don't need a `nav`, and the `article` still has its own heading.

  - kind: web
    title: Section the home page
    body: |
      Inkwell's home page has two thematic chunks inside `<main>`. Wrap each heading and its content in a `<section>`:

      1. *New arrivals* with its list.
      2. *Opening hours* with its paragraph.

      The `<main>` itself stays as it is.
    html: |
      <main>
        <h1>Welcome to Inkwell</h1>
        <h2>New arrivals</h2>
        <ul>
          <li>Beloved</li>
          <li>The Odyssey</li>
        </ul>
        <h2>Opening hours</h2>
        <p>Tuesday to Sunday, 10am to 6pm.</p>
      </main>
    tests:
      - "count('main > section')"
      - "$$('main > section').map((s) => s.firstElementChild.localName + ': ' + s.firstElementChild.textContent)"
      - "count('main > section:first-of-type > ul > li')"
      - "count('main > section:last-of-type > p')"
      - "$$('main > *').map((e) => e.localName)"
    solution:
      html: |
        <main>
          <h1>Welcome to Inkwell</h1>
          <section>
            <h2>New arrivals</h2>
            <ul>
              <li>Beloved</li>
              <li>The Odyssey</li>
            </ul>
          </section>
          <section>
            <h2>Opening hours</h2>
            <p>Tuesday to Sunday, 10am to 6pm.</p>
          </section>
        </main>
    hint: "Each `<section>` starts right before an `<h2>` and ends after that heading's content. The `<h1>` stays outside both."

  - kind: why
    body: |
      Semantic HTML is free accessibility. A blind visitor using VoiceOver can press one key to jump to `main` or list every `article`; a search engine knows which text is the actual content. You get it all just by picking the right element names, and your code becomes easier to read too.

  - kind: recap
    body: |
      - Page regions: `header`, `nav`, `main` (one), `aside`, `footer`.
      - `article` = self-contained, could stand alone; `section` = a thematic part of the page with a heading.
      - `div` and `span` are meaningless boxes: fine for styling hooks, wrong as a replacement for meaningful elements.
      - Div soup looks the same but removes the landmarks screen readers and search engines rely on.
