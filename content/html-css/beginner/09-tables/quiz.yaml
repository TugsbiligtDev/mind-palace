questions:
  - type: mcq
    prompt: Where does `<caption>` go?
    options:
      - Immediately after the opening `<table>` tag
      - Immediately after the closing `</table>` tag
      - Inside the first `<th>` of the header row
      - Just before the opening `<table>` tag
    answer: 0
    explanation: "The caption must be the first thing inside the table. CSS can still move it visually."
  - type: mcq
    prompt: "A row's first cell is the book title, which labels the rest of the row. What should it be?"
    options: ["`<th scope=\"row\">`", "`<td scope=\"row\">`", "`<th scope=\"col\">`", "`<caption>`"]
    answer: 0
    explanation: "It's a header cell for its row, so `th` with `scope=\"row\"`."
  - type: mcq
    prompt: "A table has 4 columns. One row has a cell with `colspan=\"3\"`. How many cells should that row contain?"
    options: ["2", "4", "3", "1"]
    answer: 0
    explanation: "The spanning cell takes the place of 3 columns, so 1 more cell fills the 4th: 2 cells in all."
  - type: mcq
    prompt: Which content belongs in a `<table>`?
    options:
      - Three membership plans compared by price, discount and delivery
      - "The page layout: logo on the left and the menu on the right"
      - A photo gallery of book covers arranged in three columns
      - A form's labels and their inputs, lined up neatly in two columns
    answer: 0
    explanation: "Tables are for data with row and column relationships. Layouts, galleries and forms use CSS."
  - type: mcq
    prompt: "What does `scope=\"col\"` on a header cell do?"
    options:
      - Tells assistive technology it labels every cell in its column
      - Makes the whole column wider, to fit its longest header text
      - Lets visitors sort the table by clicking on that column header
      - Makes the header stay visible when the table scrolls down
    answer: 0
    explanation: "Screen readers use it to announce the right header with each cell."
