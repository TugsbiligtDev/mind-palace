questions:
  - type: mcq
    prompt: "Which media query is the same as `(min-width: 768px)`?"
    options: ["`(width >= 768px)`", "`(width <= 768px)`", "`(width < 768px)`", "`(width = 768px)`"]
    answer: 0
    explanation: "min-width means \"at least\", so width >= 768px."
  - type: mcq
    prompt: "In mobile-first CSS, what goes outside any media query?"
    options: ["The phone layout", "The desktop layout", "Only colors and fonts", "Nothing"]
    answer: 0
    explanation: "The base styles are for small screens; `width >=` queries add to them for bigger ones."
  - type: mcq
    prompt: "How should you choose breakpoints?"
    options:
      - Widen the window and add one where the content starts to look wrong
      - Use the exact screen widths of the newest iPhone and iPad models
      - Add one every 100px, so every possible screen width is covered
      - Always use 768px and 1024px, the standard tablet and laptop sizes
    answer: 0
    explanation: "Content-based breakpoints work on every device, including ones that don't exist yet."
  - type: mcq
    prompt: "A photo makes the page scroll sideways on phones. Which rule fixes it?"
    options:
      - "`img { max-width: 100%; height: auto; }`"
      - "`img { width: 100vw; height: 100vh; }`"
      - "`img { min-width: 100%; }`"
      - "`img { width: 800px; height: auto; }`"
    answer: 0
    explanation: "max-width lets the image shrink to its container; height: auto keeps the proportions. Hiding the overflow just hides part of the photo."
  - type: mcq
    prompt: "These two queries are written in this order. On a 1000px screen, how many columns?"
    code: |
      @media (width >= 900px) { .g { grid-template-columns: repeat(3, 1fr); } }
      @media (width >= 600px) { .g { grid-template-columns: repeat(2, 1fr); } }
    options: ["2", "3", "1", "5"]
    answer: 0
    explanation: "Both queries match at 1000px, the selectors are equally specific, so the later rule wins. Mobile-first queries go from small to large for this reason."
