title: Beginner
season: 1
season_title: The Storefront
season_pitch: |
  Inkwell Books needs a website, and the agency has offered yours. Learn how the web actually
  works, set up your tools, and write real HTML: text, links, images, tables and forms. Then
  style it with CSS, master the box model and positioning, and lay pages out with Flexbox and
  Grid so they work on a phone and a desktop.
