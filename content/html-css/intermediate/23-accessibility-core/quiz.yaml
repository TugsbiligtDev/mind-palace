  - type: mcq
    prompt: What's the minimum contrast ratio for normal-size body text under WCAG AA?
    options: ["4.5 : 1", "3 : 1", "7 : 1", "2 : 1"]
    answer: 0
    explanation: "4.5:1 for normal text; large text and UI parts need 3:1; 7:1 is the stricter AAA level."
  - type: mcq
    prompt: "A developer writes `<div class=\"btn\" onclick=\"buy()\">Buy</div>`. What's the main accessibility problem?"
    options:
      - Keyboard users can't reach or press it, and it isn't announced as a button
      - Divs can't run click handlers in Safari, so iPhone users can't buy
      - It has no aria-label, so screen readers can't read the word "Buy" out loud
      - Nothing, as long as the CSS makes it look exactly like a button
    answer: 0
    explanation: "A real `<button>` is focusable, keyboard-operable and announced correctly for free."
  - type: mcq
    prompt: "Which is the \"first rule of ARIA\"?"
    options:
      - Don't use ARIA if a native HTML element or attribute does the job
      - Add a role to every element, so screen readers know what it is
      - Always prefer aria-label over visible text, since it's more reliable
      - Only add ARIA with JavaScript, never directly in the HTML
    answer: 0
    explanation: "Native elements come with behaviour and semantics built in. ARIA only changes what's announced."
  - type: mcq
    prompt: "How should text that's only for screen readers be hidden?"
    options:
      - "A visually-hidden class: tiny, clipped and absolutely positioned"
      - "`display: none`, which removes it from the screen but not the page"
      - "`visibility: hidden`, which keeps its space but hides it from view"
      - "`font-size: 0`, so the text takes no space but is still in the HTML"
    answer: 0
    explanation: "display: none and visibility: hidden remove it from screen readers too."
  - type: mcq
    prompt: "A form marks required fields only by making their labels red. Why is that a problem?"
    options:
      - Color alone carries the meaning, so many users miss it
      - Red text fails contrast rules on every background color
      - Screen readers announce red labels as errors, not as required
      - Browsers ignore the required attribute when labels are colored
    answer: 0
    explanation: "Add text (\"required\") or a symbol explained in the form, plus the `required` attribute."
