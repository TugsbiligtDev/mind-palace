steps:
  - kind: explain
    title: Why native widgets win
    body: |
      Accordions, pop-up dialogs and menus used to need a JavaScript library, and most home-made versions were broken for keyboard and screen reader users: focus escaping behind the dialog, Escape not closing it, no announcement that something opened.

      Browsers now ship these as **HTML elements**. You get for free:

      - keyboard support (Enter, Space, **Escape** to close),
      - correct screen reader announcements,
      - focus moved in and back out properly,
      - the "top layer": dialogs and popovers appear above everything, no `z-index` battles.

      Use these before reaching for a library. (The lesson preview doesn't run JavaScript, and all three work without it.)

      **Example: the same pop-up, home-made and native.**

      ```html
      <!-- Home-made: looks right, but Escape does nothing, Tab wanders behind it,
           and a screen reader isn't told anything opened -->
      <div class="popup">
        <p>Sign up for our newsletter</p>
        <span class="close">×</span>
      </div>

      <!-- Native: Escape closes it, focus moves inside and back, it's announced as a dialog -->
      <dialog>
        <p>Sign up for our newsletter</p>
        <form method="dialog"><button>Close</button></form>
      </dialog>
      ```

      The `<form method="dialog">` makes the button close the dialog with no JavaScript at all.

  - kind: choice
    title: "Quick check: what you get for free"
    body: |
      Which of these does `<dialog>` give you **without** any extra code, unlike a home-made `div` pop-up?
    options:
      - "Closing on Escape and putting focus back on the button that opened it"
      - "Your shop's colours and fonts"
      - "Saving what the visitor typed"
    answer: 0
    explanation: "Native widgets come with keyboard support, focus handling and screen reader announcements. Styling is still your job, and saving data needs a server."

  - kind: explain
    title: details and summary
    body: |
      ```html
      <details>
        <summary>Do you buy second-hand books?</summary>
        <p>Yes! Bring them to the shop any weekday morning.</p>
      </details>
      ```

      In the page you see only the question, with a small ▶ triangle in front of it. Click it (or Tab to it and press Enter) and the triangle turns to ▼ and the answer appears underneath; click again to fold it away.

      The `<summary>` is the always-visible, clickable heading; everything else inside `<details>` shows when it's opened. Add the `open` attribute to start it open.

      **Exclusive accordions**: give several `<details>` the **same `name`**, and opening one closes the others, like radio buttons.

      Style the marker with `summary::marker` (or hide it with `summary { list-style: none; }` and draw your own), and the open state with `details[open]`.

  - kind: web
    title: "Try it: details and summary"
    body: |
      Two sections about Inkwell's opening hours, sharing the name `hours`. The first starts open.

      1. Click *Weekend hours*: it opens and *Weekday hours* closes, because they share a `name`.
      2. The open one's summary is dark red, thanks to `details[open] > summary`.
      3. In `index.html`, delete `name="hours"` from **both** and try again: now both can be open at once.
      4. Move the `open` attribute to the second `<details>`.

      Nothing is graded here: try it, then press **Continue**.
    html: |
      <details name="hours" open>
        <summary>Weekday hours</summary>
        <p>Monday to Friday, 9am to 6pm.</p>
      </details>
      <details name="hours">
        <summary>Weekend hours</summary>
        <p>Saturday 10am to 5pm. Closed on Sundays.</p>
      </details>
    css: |
      details[open] > summary {
        color: darkred;
      }

  - kind: web
    title: The FAQ accordion
    body: |
      Turn Inkwell's FAQ into an accordion:

      1. Each question/answer pair becomes a `<details>` with the question in a `<summary>` and the answer in a `<p>`.
      2. Give all three the same `name="faq"`, so only one is open at a time.
      3. The first one starts **open**.
      4. CSS: make the open item's summary `font-weight: bold` (select `details[open] > summary`).
    html: |
      <h2>Questions</h2>
      <h3>Do you buy second-hand books?</h3>
      <p>Yes! Bring them to the shop any weekday morning.</p>
      <h3>Do you post abroad?</h3>
      <p>We post to most of Europe. Delivery takes five to ten days.</p>
      <h3>Can I reserve a book?</h3>
      <p>Call us and we'll keep it for three days.</p>
    css: |
      details {
        border-bottom: 1px solid #e7e5e4;
        padding: 0.5rem 0;
      }
    tests:
      - "$$('details').map((d) => d.querySelector('summary').textContent.trim())"
      - "$$('details').map((d) => d.name + (d.open ? ' (open)' : ''))"
      - "$$('details > p').length"
      - "cssAll('details > summary', 'font-weight')"
      - "count('h3')"
      - "click('details:nth-of-type(3) > summary')"
      - "$$('details').map((d) => d.open)"
    solution:
      html: |
        <h2>Questions</h2>
        <details name="faq" open>
          <summary>Do you buy second-hand books?</summary>
          <p>Yes! Bring them to the shop any weekday morning.</p>
        </details>
        <details name="faq">
          <summary>Do you post abroad?</summary>
          <p>We post to most of Europe. Delivery takes five to ten days.</p>
        </details>
        <details name="faq">
          <summary>Can I reserve a book?</summary>
          <p>Call us and we'll keep it for three days.</p>
        </details>
      css: |
        details {
          border-bottom: 1px solid #e7e5e4;
          padding: 0.5rem 0;
        }

        details[open] > summary {
          font-weight: bold;
        }
    hint: "Each `h3` becomes a `<summary>`, and the pair is wrapped in `<details name=\"faq\">`. Only the first gets `open`."

  - kind: explain
    title: dialog
    body: |
      `<dialog>` is a box that appears above the page. Opened **as a modal** it also:

      - dims the page behind it (the `::backdrop`) and makes it inert: you can't click or Tab to anything behind;
      - moves focus into the dialog, closes on **Escape**, and returns focus to the button that opened it.

      Buttons can open and close it with **invoker commands**, no script needed:

      ```html
      <button commandfor="signup" command="show-modal">Join the book club</button>

      <dialog id="signup" aria-labelledby="signup-title">
        <h2 id="signup-title">Join the book club</h2>
        <p>…</p>
        <button commandfor="signup" command="close">Close</button>
      </dialog>
      ```

      When the page loads, only the *Join the book club* button shows: a closed dialog is hidden. Click it and a box with the heading and the Close button appears in the middle of the screen, with the page behind it greyed out. Click Close (or press Escape) and it disappears again.

      A `<form method="dialog">` inside a dialog also closes it when submitted. Style the dimmed background with `dialog::backdrop`.

  - kind: choice
    title: "Quick check: open it"
    body: |
      Which button opens `<dialog id="signup">` as a modal, without JavaScript?
    options:
      - "`<button commandfor=\"signup\" command=\"close\">`"
      - "`<button href=\"#signup\">`"
      - "`<button commandfor=\"signup\" command=\"show-modal\">`"
    answer: 2
    explanation: "`commandfor` names the dialog's id and `command=\"show-modal\"` opens it as a modal. `command=\"close\"` closes it, and buttons don't have an `href`."

  - kind: explain
    title: The JavaScript you'd see elsewhere
    body: |
      `command`/`commandfor` are new (supported in all current browsers since late 2025). Older code and tutorials open dialogs with a line of JavaScript, which you'll recognise:

      ```html
      <button id="open">Join the book club</button>
      <dialog id="signup">…</dialog>
      <script>
        document.getElementById("open").addEventListener("click", () => {
          document.getElementById("signup").showModal();
        });
      </script>
      ```

      `showModal()` opens it as a modal; `show()` opens it without the backdrop; `close()` closes it. This course doesn't teach JavaScript, so copy this as-is when you meet a browser that needs it (Module 38 covers checking support).

  - kind: web
    title: "Try it: a dialog"
    body: |
      A "Gift cards" dialog, opened as a modal by the first button.

      1. Click **About gift cards**. The page behind goes reddish-dark, and you can't click anything behind the box.
      2. Close it with its **Close** button. Open it again and close it with **Escape**.
      3. In `index.html`, change `command="show-modal"` to `command="show"` and open it again: no backdrop, and the page behind stays clickable.
      4. Change it back, and in `style.css` change `40%` to `80%`.

      Nothing is graded here: try it, then press **Continue**.
    html: |
      <button type="button" commandfor="gifts" command="show-modal">About gift cards</button>
      <p>Gift cards come in £10, £20 and £50.</p>

      <dialog id="gifts" aria-labelledby="gifts-title">
        <h2 id="gifts-title">Gift cards</h2>
        <p>They never expire and work in the shop and online.</p>
        <button type="button" commandfor="gifts" command="close">Close</button>
      </dialog>
    css: |
      dialog {
        border: 0;
        border-radius: 12px;
        padding: 1.5rem;
      }

      dialog::backdrop {
        background: rgb(124 45 18 / 40%);
      }

  - kind: web
    title: The book club dialog
    body: |
      1. Make the **Join the book club** button open the dialog `#club` **as a modal**, using `commandfor` and `command`.
      2. Inside the dialog, make the **Close** button close it the same way.
      3. Connect the dialog to its heading with `aria-labelledby` (give the heading the id `club-title`).
      4. CSS: dim the page behind the open dialog with `dialog::backdrop { background: rgb(0 0 0 / 50%); }`.

      Try your buttons in the preview.
    html: |
      <button type="button">Join the book club</button>

      <dialog id="club">
        <h2>Join the book club</h2>
        <p>We meet on the first Sunday of every month at 4pm.</p>
        <button type="button">Close</button>
      </dialog>
    css: |
      dialog {
        border: 0;
        border-radius: 12px;
        padding: 1.5rem;
      }
    tests:
      - "attr('body > button', 'commandfor') + ' ' + attr('body > button', 'command')"
      - "click('body > button')"
      - "$('#club').open + ' modal:' + $('#club').matches(':modal')"
      - "css('#club', 'background-color', '::backdrop')"
      - "click('#club button')"
      - "$('#club').open"
      - "attr('#club', 'aria-labelledby') + ' → ' + (doc.getElementById(attr('#club', 'aria-labelledby') || 'x') || {}).localName"
    solution:
      html: |
        <button type="button" commandfor="club" command="show-modal">Join the book club</button>

        <dialog id="club" aria-labelledby="club-title">
          <h2 id="club-title">Join the book club</h2>
          <p>We meet on the first Sunday of every month at 4pm.</p>
          <button type="button" commandfor="club" command="close">Close</button>
        </dialog>
      css: |
        dialog {
          border: 0;
          border-radius: 12px;
          padding: 1.5rem;
        }

        dialog::backdrop {
          background: rgb(0 0 0 / 50%);
        }
    hint: "Open: `commandfor=\"club\" command=\"show-modal\"`. Close: `commandfor=\"club\" command=\"close\"`. Then `aria-labelledby=\"club-title\"` on the dialog and `id=\"club-title\"` on the h2."
    reject:
      - html: |
          <button type="button" commandfor="club" command="show">Join the book club</button>

          <dialog id="club" aria-labelledby="club-title">
            <h2 id="club-title">Join the book club</h2>
            <p>We meet on the first Sunday of every month at 4pm.</p>
            <button type="button" commandfor="club" command="close">Close</button>
          </dialog>
        css: |
          dialog {
            border: 0;
            border-radius: 12px;
            padding: 1.5rem;
          }

          dialog::backdrop {
            background: rgb(0 0 0 / 50%);
          }

  - kind: explain
    title: The Popover API
    body: |
      A **popover** is a lighter-weight pop-up: a dropdown menu, a tooltip-like note, a little panel. Unlike a modal dialog, the rest of the page stays usable.

      ```html
      <button popovertarget="account">Account</button>
      <div id="account" popover>
        <a href="orders.html">My orders</a>
        <a href="logout.html">Log out</a>
      </div>
      ```

      - The `popover` attribute makes the element hidden until opened, then shows it in the top layer.
      - `popovertarget` on a button toggles it. Screen readers are told the button controls it.
      - "Light dismiss": clicking outside or pressing **Escape** closes it. `popover="manual"` turns that off.
      - Opening one auto popover closes other auto popovers.

      Style it with `[popover]` and its open state with `:popover-open`. Positioning it next to its button is Module 45's anchor positioning; until then it appears centred.

      When the page loads you see only the *Account* button: the two links are hidden. Click it and a box with *My orders* and *Log out* appears in the middle of the page, on top of everything. Click anywhere else and it closes.

  - kind: web
    title: "Try it: a popover"
    body: |
      A small help panel for the gift-wrap option.

      1. Click **What is gift wrap?** The panel appears, with a pale yellow background from the `:popover-open` rule.
      2. Click outside it, or press **Escape**: it closes. Click the button twice to open and close it.
      3. In `index.html`, change `popover` to `popover="manual"`. Now clicking outside doesn't close it; only the button does.

      Nothing is graded here: try it, then press **Continue**.
    html: |
      <button type="button" popovertarget="wrap-help">What is gift wrap?</button>
      <div id="wrap-help" popover>
        <p>Brown paper, string and a handwritten tag. £2.</p>
      </div>
    css: |
      #wrap-help {
        padding: 1rem;
        border: 1px solid #e7e5e4;
        border-radius: 8px;
      }

      #wrap-help:popover-open {
        background: #fef9c3;
      }

  - kind: web
    title: The account menu
    body: |
      Make the **Account** button toggle the `#account` menu as a popover:

      1. Give the menu `div` the `popover` attribute.
      2. Point the button at it with `popovertarget`.
      3. CSS: when the menu is open (`#account:popover-open`), give it `display: flex`, `flex-direction: column` and `gap: 0.5rem`.
    html: |
      <button type="button">Account</button>
      <div id="account">
        <a href="orders.html">My orders</a>
        <a href="wishlist.html">Wishlist</a>
        <a href="logout.html">Log out</a>
      </div>
    css: |
      #account {
        padding: 1rem;
        border: 1px solid #e7e5e4;
        border-radius: 8px;
      }
    tests:
      - "attr('#account', 'popover') !== null"
      - "css('#account', 'display')"
      - "click('button')"
      - "$('#account').matches(':popover-open')"
      - "css('#account', 'display') + ' ' + css('#account', 'flex-direction') + ' ' + css('#account', 'gap')"
    solution:
      html: |
        <button type="button" popovertarget="account">Account</button>
        <div id="account" popover>
          <a href="orders.html">My orders</a>
          <a href="wishlist.html">Wishlist</a>
          <a href="logout.html">Log out</a>
        </div>
      css: |
        #account {
          padding: 1rem;
          border: 1px solid #e7e5e4;
          border-radius: 8px;
        }

        #account:popover-open {
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
        }
    hint: "`<button popovertarget=\"account\">` and `<div id=\"account\" popover>`. The open-state rule is `#account:popover-open { … }`."

  - kind: why
    body: |
      Custom-built widgets are where many sites become unusable by keyboard and screen reader users. `<details>`, `<dialog>` and `popover` give you the correct behaviour (focus, Escape, announcements, top layer) for free, in a line or two of HTML. That's less code, fewer bugs and better accessibility.

  - kind: recap
    body: |
      - `<details>` + `<summary>`: open/close sections; `open` to start open; shared `name` = exclusive accordion.
      - `<dialog>`: modal with `command="show-modal"` + `commandfor`; `command="close"`; `::backdrop`; label it with `aria-labelledby`. (Older code: `showModal()` in JavaScript.)
      - `popover` + `popovertarget`: menus and small panels, light dismiss, top layer; style `:popover-open`.
      - Native beats custom: keyboard, focus and screen reader support come built in.
