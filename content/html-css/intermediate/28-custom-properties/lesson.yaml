steps:
  - kind: explain
    title: Name a value once
    body: |
      Inkwell's brown, `#7c2d12`, appears 40 times in the stylesheet. Changing it means 40 edits and hoping you found them all. **Custom properties** (CSS variables) fix that:

      ```css
      :root {
        --color-brand: #7c2d12;
      }

      h1      { color: var(--color-brand); }
      .button { background: var(--color-brand); }
      ```

      - A custom property's name **starts with two dashes**. Pick clear names; they're case-sensitive.
      - `var(--name)` reads it.
      - `:root` is the `<html>` element, so properties defined there are available everywhere.

      Change one line, and every use updates.

      In the page, the heading text and the button's background are both Inkwell brown. Change `#7c2d12` to `navy` on the `:root` line, and **both** turn navy at once.

  - kind: web
    title: "Try it: custom properties"
    body: |
      An events notice that reads two custom properties: `--color-accent` (used three times) and `--space` (used twice).

      1. Look at the preview: the heading, the left border and the date are all teal.
      2. In `style.css`, change `teal` to `purple` on the `:root` line. All three change together.
      3. Change `--space` from `1rem` to `2rem`: the padding and the gap under the heading both grow.
      4. Misspell one use, for example `var(--colour-accent)`, and watch that one part lose its color.

      Nothing is graded here: try it, then press **Continue**.
    html: |
      <section class="event">
        <h2>Story hour</h2>
        <p>Every Saturday at <span class="date">10am</span>, in the children's corner.</p>
      </section>
    css: |
      :root {
        --color-accent: teal;
        --space: 1rem;
      }

      .event {
        padding: var(--space);
        border-left: 6px solid var(--color-accent);
      }

      h2 {
        color: var(--color-accent);
        margin: 0 0 var(--space);
      }

      .date {
        color: var(--color-accent);
        font-weight: bold;
      }

  - kind: web
    title: Extract the brand colors
    body: |
      Inkwell's stylesheet repeats the same values. Replace them with custom properties:

      1. On `:root`, define `--color-brand: #7c2d12`, `--color-text: #3b2f2f` and `--radius: 8px`.
      2. Replace **every** hard-coded use of those three values below with `var(…)`.

      The page must look exactly the same.
    html: |
      <h1>Inkwell Books</h1>
      <p>Second-hand books, carefully chosen.</p>
      <a class="button" href="books.html">Browse</a>
      <div class="card">Staff pick: Dune</div>
    css: |
      body {
        color: #3b2f2f;
        font-family: Georgia, serif;
      }

      h1 {
        color: #7c2d12;
      }

      .button {
        display: inline-block;
        padding: 0.5rem 1rem;
        background: #7c2d12;
        color: white;
        border-radius: 8px;
      }

      .card {
        margin-top: 1rem;
        padding: 1rem;
        border: 2px solid #7c2d12;
        border-radius: 8px;
      }
    tests:
      - "css('h1', 'color') + ' / ' + css('.button', 'background-color') + ' / ' + css('.card', 'border-top-color') + ' / ' + css('body', 'color')"
      - "css('.button', 'border-radius') + ' / ' + css('.card', 'border-radius')"
      - "[rule(':root', '--color-brand'), rule(':root', '--color-text'), rule(':root', '--radius')]"
      - "/#7c2d12|#3b2f2f|:\\s*8px/i.test($('style[data-file]').textContent.replace(/:root\\s*\\{[^}]*\\}/, ''))"
    solution:
      css: |
        :root {
          --color-brand: #7c2d12;
          --color-text: #3b2f2f;
          --radius: 8px;
        }

        body {
          color: var(--color-text);
          font-family: Georgia, serif;
        }

        h1 {
          color: var(--color-brand);
        }

        .button {
          display: inline-block;
          padding: 0.5rem 1rem;
          background: var(--color-brand);
          color: white;
          border-radius: var(--radius);
        }

        .card {
          margin-top: 1rem;
          padding: 1rem;
          border: 2px solid var(--color-brand);
          border-radius: var(--radius);
        }
    hint: "Add the `:root { … }` block at the top, then swap `#7c2d12` for `var(--color-brand)`, `#3b2f2f` for `var(--color-text)` and `8px` for `var(--radius)`."

  - kind: explain
    title: Fallbacks, scope and inheritance
    body: |
      **Fallbacks**: `var(--name, fallback)` uses the fallback if `--name` isn't defined: `color: var(--color-accent, teal);`.

      **Scope**: a custom property is defined on an element and **inherited by its descendants**, like `color`. Define it on `:root` for the whole page, or on a component to change it just there:

      ```css
      :root       { --surface: white;   --ink: #1c1917; }
      .card       { background: var(--surface); color: var(--ink); }
      .card.dark  { --surface: #1c1917; --ink: #fafaf9; }   /* only redefine the variables */
      ```

      The `.card` rule never changes; the dark card just gives it different values. That's the core trick of **theming**: components read variables, and themes set them.

      Custom properties are live: change one in DevTools and every use updates instantly.

      With the rules above, an ordinary `.card` is white with near-black text, and a `<div class="card dark">` next to it is near-black with off-white text: the same `.card` rule, fed different values. And with `color: var(--color-accent, teal);`, if no `--color-accent` exists anywhere, the text is simply teal.

  - kind: web
    title: "Try it: themes and fallbacks"
    body: |
      Two cards share the `.card` rule. The second one only redefines `--surface` and `--ink`.

      1. Compare the cards: same padding and border, different colors.
      2. In `style.css`, change the `.card.dark` values to `--surface: #fef3c7` and `--ink: #7c2d12` for a cream card.
      3. The price uses `var(--price-color, #c2410c)`. Nothing defines `--price-color`, so it falls back to orange `#c2410c`. Add `--price-color: crimson;` inside `:root` and watch both prices change.

      Nothing is graded here: try it, then press **Continue**.
    html: |
      <div class="card">
        <h3>Persuasion</h3>
        <p class="price">£4.00</p>
      </div>
      <div class="card dark">
        <h3>The Odyssey</h3>
        <p class="price">£7.50</p>
      </div>
    css: |
      :root {
        --surface: white;
        --ink: #1c1917;
      }

      .card {
        background: var(--surface);
        color: var(--ink);
        padding: 1rem;
        margin-bottom: 1rem;
        border: 1px solid #e7e5e4;
      }

      .card.dark {
        --surface: #1c1917;
        --ink: #fafaf9;
      }

      .price {
        color: var(--price-color, #c2410c);
      }

  - kind: web
    title: A themed card
    body: |
      The `.card` rule already reads `--surface` and `--ink`. Without touching that rule:

      1. Define `--surface: white` and `--ink: #1c1917` on `:root`.
      2. Make `.card.featured` set `--surface: #7c2d12` and `--ink: white`.
      3. Make `.note` use `var(--note-color, #57534e)` for its color: a fallback, since `--note-color` is never defined.
    html: |
      <div class="card">
        <h3>Emma</h3>
        <p class="note">Jane Austen</p>
      </div>
      <div class="card featured">
        <h3>Dune</h3>
        <p>Book of the month</p>
      </div>
    css: |
      .card {
        background: var(--surface);
        color: var(--ink);
        padding: 1rem;
        margin-bottom: 1rem;
        border: 1px solid #e7e5e4;
      }

      .note {
        font-style: italic;
      }
    tests:
      - "css('.card:not(.featured)', 'background-color') + ' / ' + css('.card:not(.featured)', 'color')"
      - "css('.card.featured', 'background-color') + ' / ' + css('.card.featured', 'color')"
      - "css('.note', 'color')"
      - "declared('.card', 'background') + ' / ' + declared('.card', 'color')"
      - "declared('.note', 'color')"
    solution:
      css: |
        :root {
          --surface: white;
          --ink: #1c1917;
        }

        .card {
          background: var(--surface);
          color: var(--ink);
          padding: 1rem;
          margin-bottom: 1rem;
          border: 1px solid #e7e5e4;
        }

        .card.featured {
          --surface: #7c2d12;
          --ink: white;
        }

        .note {
          font-style: italic;
          color: var(--note-color, #57534e);
        }
    hint: "`.card.featured { --surface: #7c2d12; --ink: white; }` redefines just the variables. The note gets `color: var(--note-color, #57534e);`."

  - kind: explain
    title: Design tokens
    body: |
      Professional stylesheets put **every** design decision in variables, called **design tokens**:

      ```css
      :root {
        /* colors */
        --color-brand: #7c2d12;
        --color-text: #1c1917;
        --color-muted: #57534e;
        --color-surface: #ffffff;

        /* spacing scale */
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 1rem;
        --space-4: 1.5rem;
        --space-5: 2.5rem;

        /* type scale */
        --text-sm: 0.875rem;
        --text-base: 1rem;
        --text-lg: 1.25rem;
        --text-xl: 2rem;
      }
      ```

      Components then use only tokens:

      ```css
      .notice {
        padding: var(--space-3) var(--space-4);
        font-size: var(--text-sm);
        color: var(--color-muted);
      }
      ```

      That gives a notice with 1rem of padding above and below, 1.5rem at the sides, and small grey-brown text. Every other component using `--space-3` gets exactly the same 1rem.

      With a **scale**, you choose from a few sizes instead of inventing new ones (`13px` here, `14.5px` there). Pages look consistent, and redesigns become a matter of adjusting tokens. Module 42 builds a full token system.

  - kind: web
    title: "Try it: tokens"
    body: |
      The notice and the card use only tokens from `:root`, so they share the same spacing and colours.

      Try this:

      1. Change `--space-3` to `2rem`. Both boxes get more padding at once.
      2. Change `--color-brand` to `teal`. The card's border and the notice's heading both follow.
      3. Change the notice's `font-size` to `var(--text-lg)`, a step up the type scale.

      Nothing is graded here: try things, then press **Continue**.
    html: |
      <div class="notice">
        <h3>Closed Monday</h3>
        <p>Back on Tuesday at 10.</p>
      </div>
      <div class="card">
        <h3>Dune</h3>
        <p>£8.99, very good condition.</p>
      </div>
    css: |
      :root {
        --color-brand: #7c2d12;
        --color-muted: #57534e;
        --space-2: 0.5rem;
        --space-3: 1rem;
        --space-4: 1.5rem;
        --text-sm: 0.875rem;
        --text-lg: 1.25rem;
      }

      .notice {
        padding: var(--space-3) var(--space-4);
        font-size: var(--text-sm);
        color: var(--color-muted);
        background: #fdf8f0;
        margin-bottom: var(--space-3);
      }

      .notice h3 {
        color: var(--color-brand);
        margin: 0 0 var(--space-2);
      }

      .card {
        padding: var(--space-3);
        border: 2px solid var(--color-brand);
      }

      .card h3 {
        margin: 0;
      }

  - kind: explain
    title: Light and dark mode
    body: |
      Many people set their device to dark mode. CSS can follow it in two ways.

      **1. The `prefers-color-scheme` media query**, redefining your tokens:

      ```css
      :root { --bg: #fafaf9; --text: #1c1917; }

      @media (prefers-color-scheme: dark) {
        :root { --bg: #0b0f19; --text: #e5e7eb; }
      }
      ```

      **2. `light-dark()`**, newer and shorter: give both colors at once. It needs `color-scheme` set, which also switches the browser's own parts (scrollbars, form controls) to match:

      ```css
      :root {
        color-scheme: light dark;
        --bg: light-dark(#fafaf9, #0b0f19);
        --text: light-dark(#1c1917, #e5e7eb);
      }
      ```

      Both follow the visitor's setting automatically. Dark mode isn't just inverted colors: avoid pure black backgrounds and pure white text (too harsh), and re-check contrast in both themes.

      With either version and `body { background: var(--bg); color: var(--text); }`, a Mac in Light mode shows the page off-white with near-black text. Switch the Mac to Dark and the same page turns deep navy with light grey text, without reloading.

  - kind: web
    title: "Try it: light and dark"
    body: |
      A notice board that uses `light-dark()` for its colors: cream and brown in light mode, dark brown and cream in dark mode.

      1. Look at the preview, then open **System Settings → Appearance** on your Mac and switch between **Light** and **Dark**. The preview follows.
      2. In `style.css`, change the dark half of `--board` (the second color) to `#0b0f19` and switch again.
      3. Delete the `color-scheme: light dark;` line. Now `light-dark()` always uses the first (light) color, whatever your Mac says.

      Nothing is graded here: try it, then press **Continue**.
    html: |
      <div class="board">
        <h2>This week</h2>
        <p>New poetry shelf by the window.</p>
      </div>
    css: |
      :root {
        color-scheme: light dark;
        --board: light-dark(#fef3c7, #292524);
        --ink: light-dark(#7c2d12, #fef3c7);
      }

      .board {
        background: var(--board);
        color: var(--ink);
        padding: 1rem;
        border-radius: 8px;
      }

  - kind: web
    title: Follow the visitor's theme
    body: |
      Make Inkwell follow light and dark mode with `light-dark()`:

      1. On `:root`, set `color-scheme: light dark`.
      2. Define `--bg` as `light-dark(#fafaf9, #0b0f19)` and `--text` as `light-dark(#1c1917, #e5e7eb)`.
      3. Make `body` use them for `background` and `color`.

      The checker looks at the page in both themes. You can see it here too: switch your Mac between Light and Dark in System Settings → Appearance.
    html: |
      <h1>Inkwell Books</h1>
      <p>Open late on Thursdays.</p>
    css: |
      body {
        font-family: Georgia, serif;
      }
    tests:
      - "scheme('light', 'body', 'background-color') + ' / ' + scheme('light', 'body', 'color')"
      - "scheme('dark', 'body', 'background-color') + ' / ' + scheme('dark', 'body', 'color')"
      - "css(':root', 'color-scheme')"
    solution:
      css: |
        :root {
          color-scheme: light dark;
          --bg: light-dark(#fafaf9, #0b0f19);
          --text: light-dark(#1c1917, #e5e7eb);
        }

        body {
          font-family: Georgia, serif;
          background: var(--bg);
          color: var(--text);
        }
    hint: "Everything goes on `:root` except the last part: `body { background: var(--bg); color: var(--text); }`."

  - kind: why
    body: |
      Custom properties turn a stylesheet from a pile of repeated numbers into a small set of named decisions. They make themes, dark mode and consistent spacing almost free, and they're the foundation of every modern design system, including the one you'll build in the Advanced level.

  - kind: recap
    body: |
      - Define `--name: value` (usually on `:root`), read with `var(--name)`; `var(--name, fallback)`.
      - Custom properties inherit: redefine them on a component to theme it, without touching its rules.
      - **Design tokens**: colors, a spacing scale and a type scale as variables.
      - Dark mode: `@media (prefers-color-scheme: dark)` redefining tokens, or `color-scheme: light dark` + `light-dark(light, dark)`.
