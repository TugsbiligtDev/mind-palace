steps:
  - kind: explain
    title: Rules inside rules
    body: |
      A component's styles are often spread over several rules that all start the same way:

      ```css
      .card { padding: 1rem; }
      .card h3 { margin: 0; }
      .card p { color: #57534e; }
      .card:hover { border-color: #7c2d12; }
      ```

      With **nesting** you write them inside the parent rule:

      ```css
      .card {
        padding: 1rem;

        h3 { margin: 0; }            /* = .card h3 */
        p { color: #57534e; }        /* = .card p */

        &:hover {                    /* = .card:hover */
          border-color: #7c2d12;
        }
      }
      ```

      Everything about the card lives in one block. Nesting is native CSS, supported in every current browser; no tools needed.

  - kind: choice
    title: "Quick check: what it means"
    body: |
      Inside `.card { … }` you nest `p { color: gray; }`. Which selector does that become?
    options:
      - "`p`"
      - "`.card p`"
      - "`.card.p`"
    answer: 1
    explanation: "A nested rule without `&` is a descendant of its parent: `.card p`, the paragraphs inside a card."

  - kind: explain
    title: "The & symbol"
    body: |
      Inside a nested rule, `&` means **"the parent selector, right here"**.

      | Nested | Means |
      |---|---|
      | `h3 { }` | `.card h3` (a descendant: a space is implied) |
      | `& h3 { }` | `.card h3` (the same, written out) |
      | `&:hover { }` | `.card:hover` (no space: the card itself, hovered) |
      | `&.featured { }` | `.card.featured` (the card that also has this class) |
      | `&::before { }` | `.card::before` |
      | `.dark & { }` | `.dark .card` (the card inside something dark) |
      | `& + & { }` | `.card + .card` |

      The rule of thumb: when the nested selector is **attached** to the parent (a pseudo-class, a pseudo-element, another class), you need `&`. When it's a **descendant**, you can leave it out.

      <!-- page -->

      Forgetting the `&` changes the meaning:

      ```css
      .event {
        border: 2px solid #e7e5e4;

        &.cancelled { border-color: crimson; }   /* = .event.cancelled */
        .cancelled  { color: crimson; }          /* = .event .cancelled */
      }
      ```

      With `<div class="event cancelled">`, the first nested rule gives the event box itself a crimson border. The second rule doesn't touch that box at all: it looks for something **inside** an event with the class `cancelled`, such as `<span class="cancelled">` in its text.

  - kind: web
    title: "Try it: nesting and &"
    body: |
      Two event boxes, styled by one nested `.event` rule.

      1. Hover over each box: `&:hover` changes its background.
      2. The second box also has the class `cancelled`, so `&.cancelled` gives it a crimson border. `&::after` adds a 🎟 at the end of **every** event.
      3. In `style.css`, remove the `&` from `&.cancelled` (leaving `.cancelled`). The crimson border disappears: now it means "a `.cancelled` **inside** an event", and there isn't one.
      4. Put the `&` back, and change `h3`'s color to `teal`.

      Nothing is graded here: try it, then press **Continue**.
    html: |
      <div class="event">
        <h3>Story hour</h3>
        <p>Saturday, 10am</p>
      </div>
      <div class="event cancelled">
        <h3>Author talk</h3>
        <p>Postponed to next month</p>
      </div>
    css: |
      .event {
        padding: 1rem;
        margin-bottom: 1rem;
        border: 2px solid #e7e5e4;

        h3 {
          margin: 0;
          color: #7c2d12;
        }

        &:hover {
          background: #f5f0e8;
        }

        &.cancelled {
          border-color: crimson;
        }

        &::after {
          content: "🎟";
        }
      }

  - kind: web
    title: Nest the card
    body: |
      Rewrite the six flat `.book` rules as **one** nested `.book` rule. The page must look exactly the same, and there should be no separate rules starting with `.book` left over.
    html: |
      <article class="book">
        <h3>Dune</h3>
        <p>Frank Herbert</p>
        <a href="dune.html">Details</a>
      </article>
      <article class="book featured">
        <h3>Beloved</h3>
        <p>Toni Morrison</p>
        <a href="beloved.html">Details</a>
      </article>
    css: |
      .book {
        padding: 1rem;
        margin-bottom: 1rem;
        border: 2px solid #e7e5e4;
      }

      .book h3 {
        margin: 0 0 0.25rem;
      }

      .book p {
        color: #57534e;
      }

      .book a {
        color: #7c2d12;
      }

      .book.featured {
        border-color: #7c2d12;
      }

      .book::before {
        content: "📖 ";
      }
    tests:
      - "cssAll('.book', 'border-top-color')"
      - "cssAll('.book h3', 'margin-bottom') + ' / ' + cssAll('.book p', 'color') + ' / ' + cssAll('.book a', 'color')"
      - "cssAll('.book', 'content', '::before')"
      - "selectors().filter((s) => s.startsWith('.book')).length"
      - "selectors().some((s) => s.startsWith('&'))"
    solution:
      css: |
        .book {
          padding: 1rem;
          margin-bottom: 1rem;
          border: 2px solid #e7e5e4;

          h3 {
            margin: 0 0 0.25rem;
          }

          p {
            color: #57534e;
          }

          a {
            color: #7c2d12;
          }

          &.featured {
            border-color: #7c2d12;
          }

          &::before {
            content: "📖 ";
          }
        }
    hint: "Descendants (`h3`, `p`, `a`) can go inside as they are. The class and the pseudo-element are attached to the book itself, so they need `&`: `&.featured`, `&::before`."
    reject:
      - css: |
          .book {
            padding: 1rem;
            margin-bottom: 1rem;
            border: 2px solid #e7e5e4;

            h3 {
              margin: 0 0 0.25rem;
            }

            p {
              color: #57534e;
            }

            a {
              color: #7c2d12;
            }

            .featured {
              border-color: #7c2d12;
            }

            ::before {
              content: "📖 ";
            }
          }

  - kind: explain
    title: Nesting media queries
    body: |
      Media queries (and other `@` rules) can nest too, keeping a component's responsive changes next to its normal styles:

      ```css
      .books {
        display: grid;
        grid-template-columns: 1fr;

        @media (width >= 700px) {
          grid-template-columns: repeat(3, 1fr);   /* applies to .books */
        }
      }
      ```

      Inside the nested `@media`, the declarations apply to the parent selector. No need to repeat `.books`.

      On a phone the books sit in one column, one under the other. From 700px wide they line up three across. It behaves exactly like a separate `@media` block with `.books { … }` inside.

  - kind: web
    title: "Try it: a nested media query"
    body: |
      A row of opening-hours boxes, with its breakpoint nested inside `.hours`.

      1. Use the width buttons above the preview: on **Phone** the boxes stack; on **Tablet** (768) and wider they sit two across.
      2. In `style.css`, change `repeat(2, 1fr)` to `repeat(4, 1fr)`.
      3. Change `600px` to `900px` and check **Tablet** again: it's back to one column.

      Nothing is graded here: try it, then press **Continue**.
    html: |
      <div class="hours">
        <div>Mon–Fri: 9–6</div>
        <div>Sat: 10–5</div>
        <div>Sun: closed</div>
        <div>Holidays: 11–4</div>
      </div>
    css: |
      .hours {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.5rem;

        @media (width >= 600px) {
          grid-template-columns: repeat(2, 1fr);
        }

        div {
          padding: 0.5rem;
          background: #f5f0e8;
        }
      }

  - kind: web
    title: Nest the breakpoint
    body: |
      Move the media query **inside** the `.shelf` rule, so all of the shelf's layout lives in one block. Behaviour must stay the same: one column on phones, three from `700px`.
    html: |
      <div class="shelf">
        <div>Fiction</div><div>Poetry</div><div>History</div>
      </div>
    css: |
      .shelf {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      @media (width >= 700px) {
        .shelf {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    widths: [375, 900]
    tests:
      - "css('.shelf', 'grid-template-columns').split(' ').length"
      - "/\\.shelf\\s*\\{[^}]*@media/.test($('style[data-file]').textContent)"
    solution:
      css: |
        .shelf {
          display: grid;
          grid-template-columns: 1fr;
          gap: 1rem;

          @media (width >= 700px) {
            grid-template-columns: repeat(3, 1fr);
          }
        }
    hint: "Put `@media (width >= 700px) { grid-template-columns: repeat(3, 1fr); }` inside the `.shelf { … }` block, and delete the old query."

  - kind: explain
    title: Keep it shallow
    body: |
      Nesting makes it tempting to mirror the whole HTML tree:

      ```css
      .page { main { .content { article { .card { h3 { … } } } } } }   /* ✗ */
      ```

      That produces long, highly specific selectors (`.page main .content article .card h3`), which are hard to override and break when the HTML changes. Guidelines:

      - Nest **one or two levels**, mostly for states (`&:hover`), variants (`&.featured`), pseudo-elements and media queries.
      - If you're nesting deeper, the inner thing probably deserves its **own class** and its own rule.
      - Nested selectors still count specificity as if written out in full.

  - kind: choice
    title: "Quick check: too deep"
    body: |
      You find `.page { main { .content { .card { h3 { … } } } } }`. What's the better fix?
    options:
      - "Give the heading its own class, like `.card-title`, and style it in its own short rule"
      - "Add `!important` to the heading's rule"
      - "Nest it one level deeper"
    answer: 0
    explanation: "Deep nesting builds long, very specific selectors that break when the HTML changes. A class of its own keeps the selector short and easy to override."

  - kind: info
    title: "Nesting and Sass"
    body: |
      For about fifteen years, the main reason teams used **Sass** (a language that compiles to CSS) was nesting, plus variables. Native CSS now has both: nesting and custom properties, and custom properties are *more* powerful because they change live in the browser. Many new projects use plain CSS with no Sass at all. You'll still meet Sass in existing codebases (Module 50 shows how to recognise it).

  - kind: choice
    title: "Quick check: still need Sass?"
    body: |
      You start a new project and only want nesting and variables. Do you need Sass?
    options:
      - "Yes: plain CSS can't nest"
      - "No: plain CSS now has nesting and custom properties"
      - "Yes: custom properties only work inside Sass"
    answer: 1
    explanation: "Native CSS has both now, and custom properties can even change live in the browser, which Sass variables can't."

  - kind: why
    body: |
      Nesting keeps everything about a component in one place: its parts, its states and its responsive changes. Used shallowly, it makes stylesheets shorter and easier to scan, with no build step.

  - kind: recap
    body: |
      - Rules can live inside rules; descendants can be written plainly (`h3 { }`).
      - `&` = the parent selector: `&:hover`, `&.variant`, `&::before`, `.theme &`.
      - `@media` nests inside a rule and applies to it.
      - Keep nesting to one or two levels; deeper usually means a new class.
      - Native nesting + custom properties cover most of what Sass was used for.
