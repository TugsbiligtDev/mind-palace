steps:
  - kind: explain
    title: From a jump to a glide
    body: |
      When a button changes color on hover, the change is instant. A **transition** makes it happen gradually:

      ```css
      .button {
        background: #7c2d12;
        transition: background-color 200ms ease;
      }
      .button:hover {
        background: #9a3412;
      }
      ```

      The transition goes on the **normal** state, not the `:hover` one, so it plays both ways: in when you hover, out when you leave.

      <!-- page -->

      The shorthand is **property duration easing delay**:

      - **property**: which property to animate. List several with commas. Avoid `all`: it animates things you didn't mean to.
      - **duration**: `200ms` or `0.2s`. UI feedback feels best between 150 and 300ms.
      - **easing**: how speed changes. `ease` (the default), `ease-out` (fast start, gentle stop, good for things appearing), `ease-in`, `linear`, or a custom `cubic-bezier()`.
      - **delay**: wait before starting.

  - kind: explain
    title: Transforms
    body: |
      `transform` moves, resizes and turns an element **without affecting the layout around it**:

      ```css
      transform: translateY(-4px);          /* move up 4px */
      transform: scale(1.05);               /* 5% bigger */
      transform: rotate(-3deg);             /* tilt */
      transform: translateY(-4px) scale(1.05);  /* combine, applied right to left */
      ```

      Modern CSS also has **individual** properties that do the same and are easier to combine and animate separately:

      ```css
      translate: 0 -4px;
      scale: 1.05;
      rotate: -3deg;
      ```

      `transform-origin` sets the point it scales or rotates around (`center` by default; `top left`, etc.).

  - kind: web
    title: A responsive button
    body: |
      Make the **Book a seat** button feel alive:

      1. On `.button`, add a transition of `background-color 200ms ease` **and** `translate 200ms ease` (one `transition` property, two comma-separated parts).
      2. On `.button:hover`, change `background` to `#9a3412` and lift it with `translate: 0 -2px`.
      3. Give `.button:focus-visible` the same lift.

      Hover over it in the preview.
    html: |
      <a class="button" href="book.html">Book a seat</a>
    css: |
      .button {
        display: inline-block;
        margin: 2rem;
        padding: 0.75rem 1.25rem;
        background: #7c2d12;
        color: white;
        text-decoration: none;
        border-radius: 8px;
      }
    tests:
      - "css('.button', 'transition-property') + ' / ' + css('.button', 'transition-duration') + ' / ' + css('.button', 'transition-timing-function')"
      - "rule('.button:hover', 'background-color')"
      - "rule('.button:hover', 'translate')"
      - "rule('.button:focus-visible', 'translate')"
      - "css('.button', 'background-color')"
    solution:
      css: |
        .button {
          display: inline-block;
          margin: 2rem;
          padding: 0.75rem 1.25rem;
          background: #7c2d12;
          color: white;
          text-decoration: none;
          border-radius: 8px;
          transition: background-color 200ms ease, translate 200ms ease;
        }

        .button:hover {
          background: #9a3412;
          translate: 0 -2px;
        }

        .button:focus-visible {
          translate: 0 -2px;
        }
    hint: "`transition: background-color 200ms ease, translate 200ms ease;` goes on `.button` itself, not on the hover rule."
    reject:
      - css: |
          .button {
            display: inline-block;
            margin: 2rem;
            padding: 0.75rem 1.25rem;
            background: #7c2d12;
            color: white;
            text-decoration: none;
            border-radius: 8px;
          }

          .button:hover {
            background: #9a3412;
            translate: 0 -2px;
            transition: background-color 200ms ease, translate 200ms ease;
          }

          .button:focus-visible {
            translate: 0 -2px;
          }

  - kind: explain
    title: Cheap and expensive properties
    body: |
      Each frame of an animation, the browser may have to recalculate **layout** (where every box goes), **paint** (draw the pixels) and **composite** (stack the layers). Which steps it repeats depends on what you animate:

      | Animating | Costs | Result |
      |---|---|---|
      | `transform`, `translate`, `scale`, `rotate`, `opacity` | composite only | smooth, even on cheap phones |
      | `color`, `background-color`, `box-shadow` | paint | usually fine for small elements |
      | `width`, `height`, `margin`, `top`, `left`, `padding` | layout + paint | can stutter: everything around it re-flows |

      So to move something, animate `translate`, not `left`/`top`. To grow it, use `scale`, not `width`. To fade, use `opacity`. Module 48 goes deeper into how browsers render.

  - kind: web
    title: Move it the cheap way
    body: |
      The card's hover effect animates `margin-top` and `width`, which re-lays out the whole page every frame. Get the same feeling with cheap properties:

      1. Replace the hover's `margin-top: -6px` with `translate: 0 -6px`, and its `width: 270px` with `scale: 1.04`.
      2. Change the transition to animate `translate` and `scale` (each `250ms ease-out`), and nothing else.
    html: |
      <div class="card">Staff pick: The Odyssey</div>
      <p>Text below the card shouldn't jump around.</p>
    css: |
      .card {
        width: 260px;
        margin-top: 1rem;
        padding: 1.5rem;
        background: white;
        border: 1px solid #e7e5e4;
        border-radius: 12px;
        transition: margin-top 250ms ease-out, width 250ms ease-out;
      }

      .card:hover {
        margin-top: -6px;
        width: 270px;
      }
    tests:
      - "rule('.card:hover', 'translate') + ' / ' + rule('.card:hover', 'scale')"
      - "declared('.card:hover', 'margin-top') + ' / ' + declared('.card:hover', 'width')"
      - "css('.card', 'transition-property') + ' / ' + css('.card', 'transition-duration') + ' / ' + css('.card', 'transition-timing-function')"
    solution:
      css: |
        .card {
          width: 260px;
          margin-top: 1rem;
          padding: 1.5rem;
          background: white;
          border: 1px solid #e7e5e4;
          border-radius: 12px;
          transition: translate 250ms ease-out, scale 250ms ease-out;
        }

        .card:hover {
          translate: 0 -6px;
          scale: 1.04;
        }
    hint: "Hover: `translate: 0 -6px; scale: 1.04;`. Transition: `translate 250ms ease-out, scale 250ms ease-out`."

  - kind: explain
    title: prefers-reduced-motion
    body: |
      For some people, motion on screen causes dizziness, nausea or headaches (vestibular disorders), or is simply distracting. They can switch on **Reduce motion** in their device settings (on a Mac: System Settings → Accessibility → Display → Reduce motion).

      CSS can see that setting:

      ```css
      @media (prefers-reduced-motion: reduce) {
        .card {
          transition: none;
        }
        .card:hover {
          translate: none;
          scale: none;
        }
      }
      ```

      You don't have to remove **all** change: a quick color or opacity change is usually fine. Remove movement, zooming, parallax and spinning. Many teams put a blanket rule in their reset that shortens every transition and animation when reduced motion is on.

  - kind: web
    title: Respect Reduce motion
    body: |
      Add a `prefers-reduced-motion: reduce` media query that:

      1. sets `.card`'s `transition` to `none`, and
      2. removes the hover lift: `.card:hover` gets `translate: none`.

      (The preview follows your Mac's setting. The checker reads the media query.)
    html: |
      <div class="card">Staff pick: The Odyssey</div>
    css: |
      .card {
        width: 260px;
        padding: 1.5rem;
        border: 1px solid #e7e5e4;
        border-radius: 12px;
        transition: translate 250ms ease-out;
      }

      .card:hover {
        translate: 0 -6px;
      }
    tests:
      - "declared('.card', 'transition', 'prefers-reduced-motion:reduce')"
      - "declared('.card:hover', 'translate', 'prefers-reduced-motion:reduce')"
      - "css('.card', 'transition-duration')"
    solution:
      css: |
        .card {
          width: 260px;
          padding: 1.5rem;
          border: 1px solid #e7e5e4;
          border-radius: 12px;
          transition: translate 250ms ease-out;
        }

        .card:hover {
          translate: 0 -6px;
        }

        @media (prefers-reduced-motion: reduce) {
          .card {
            transition: none;
          }

          .card:hover {
            translate: none;
          }
        }
    hint: "`@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { translate: none; } }`, after the normal rules."
    reject:
      - css: |
          .card {
            width: 260px;
            padding: 1.5rem;
            border: 1px solid #e7e5e4;
            border-radius: 12px;
            transition: translate 250ms ease-out;
          }

          .card:hover {
            translate: 0 -6px;
          }

          @media (prefers-reduced-motion: no-preference) {
            .card {
              transition: none;
            }

            .card:hover {
              translate: none;
            }
          }

  - kind: why
    body: |
      Small, quick transitions make an interface feel responsive and help people see what changed. Done badly (slow, everywhere, animating layout) they make a site feel sluggish and can make people unwell. Short durations, cheap properties and a reduced-motion fallback get you the good without the bad.

  - kind: recap
    body: |
      - `transition: property duration easing delay` on the **normal** state; list properties, avoid `all`; 150–300ms for UI.
      - `transform: translate() scale() rotate()` or the individual `translate`, `scale`, `rotate` properties; they don't affect layout.
      - Animate `transform`/`translate`/`scale`/`opacity` (cheap), not `width`/`margin`/`top` (layout).
      - `@media (prefers-reduced-motion: reduce)`: remove movement for people who asked.
