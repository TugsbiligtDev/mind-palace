  - "Advanced Forms"
  - "Native Interactive Elements"
  - "Responsive Images & Performance-Aware HTML"
  - "Metadata, SEO & Sharing"
  - "Custom Properties (CSS Variables)"
  - "Modern Selectors"
  - "Native CSS Nesting"
  - "Fluid & Intrinsic Sizing"
  - "Transitions & Transforms"
  - "Keyframe Animations"
  - "Layout Patterns"
  - "Git & GitHub Basics"
  - "Publishing a Site"
  - "Code Quality Tooling"
  - "Browser Compatibility"
