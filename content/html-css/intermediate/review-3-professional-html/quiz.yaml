questions:
  - type: mcq
    prompt: "A screen reader announces a field as just \"edit text\". What fixes it best?"
    options:
      - A visible `<label>` connected with `for` and `id`
      - A placeholder that clearly describes what to type
      - A `title` attribute on the input element
      - An `aria-hidden` label next to the field
    answer: 0
    explanation: "A connected label gives the field its accessible name, visibly and for screen readers."
  - type: mcq
    prompt: "Why is `aria-hidden=\"true\"` on a link a bug?"
    options:
      - The link can still get focus, but screen readers say nothing
      - It hides the link from sighted users as well as screen readers
      - It removes the href, so the link no longer goes anywhere
      - "It isn't a bug: it's the standard way to hide decorative links"
    answer: 0
    explanation: "Never hide focusable elements from assistive technology; users land on something silent."
  - type: mcq
    prompt: "Which pair makes the hero image fast?"
    options:
      - '`fetchpriority="high"` and no `loading="lazy"`'
      - '`loading="lazy"` and `decoding="async"`'
      - '`fetchpriority="low"` and `loading="eager"`'
      - '`loading="lazy"` with width and height set'
    answer: 0
    explanation: "The first big image should be fetched early, never lazily."
  - type: mcq
    prompt: "An icon-only button must be announced as \"Close\". Which markup?"
    options:
      - '`<button type="button" aria-label="Close">✕</button>`'
      - '`<div role="button" title="Close">✕</div>`'
      - '`<button type="button" aria-hidden="true">✕</button>`'
      - '`<button type="button" title="✕">Close icon</button>`'
    answer: 0
    explanation: "A real button with an aria-label: focusable, operable and named."
