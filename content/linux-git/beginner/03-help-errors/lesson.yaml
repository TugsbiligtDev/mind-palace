steps:
  - kind: explain
    title: Nobody memorises this
    body: |
      There are thousands of commands and most have dozens of options. Professionals don't remember them all: they know **where to look**, and they read error messages carefully.

      Three places to look, from most complete to quickest:

      | Where | What you get |
      |---|---|
      | `man ls` | the full **manual page**, built into every Linux and Mac |
      | `ls --help` | a short list of options, printed straight away |
      | `tldr ls` | a handful of everyday examples |

      **Example: `tldr`**, the quickest of the three, on `ls`:

      ```
      learner@inkwell:~$ tldr ls

        ls

        List directory contents.

        - List files one per line:

          ls -1

        - List all files, including hidden files:

          ls -a

        - Long format list (permissions, ownership, size, and modification date) of all files:

          ls -la

        - Long format list with size in human-readable units (KiB, MiB, GiB):

          ls -lh

        - Long format list sorted by size (descending):

          ls -lS

        - Long format list of all files, sorted by modification date (oldest first):

          ls -ltr
      ```

      Six common uses, each with the exact command. When you need every option, `man ls` has them all.

  - kind: shell
    title: "Try it: tldr"
    fixture: backoffice
    setup: cd ~
    body: |
      Type `tldr ls`. Then try `tldr cp` and `tldr mkdir`. (You'll meet `man` and `--help` on the next pages.)

      Nothing is graded here: try them, then press **Continue**.

  - kind: explain
    title: Reading a manual page
    body: |
      `man ls` opens the manual for `ls`. It fills the screen, and you move around it with keys, not the mouse:

      | Key | Does |
      |---|---|
      | **Space** | next screen |
      | **b** | back a screen |
      | **↓ ↑** | one line |
      | **/word** then Return | search for *word*; **n** jumps to the next match |
      | **q** | **quit**, back to the prompt |

      <!-- page -->

      The page has fixed sections: **NAME** (one line on what it does), **SYNOPSIS** (how to type it), **DESCRIPTION** and **OPTIONS**. In the synopsis, `[square brackets]` mean "optional" and `...` means "you can give several": `ls [OPTION]... [FILE]...`.

      ⚠️ The most common beginner panic: being stuck inside a manual page. **Press q.**

  - kind: shell
    title: Find an option in the manual
    body: |
      Open the manual for `ls` and find the option that **sorts by file size**.

      1. Type `man ls` and press Return.
      2. Type `/size` and press Return to search. Press **n** for the next match.
      3. When you've found it, press **q** to leave.

      The next step asks what you found.

  - kind: choice
    title: What did the manual say?
    body: Which option makes `ls` sort by file size, largest first?
    options:
      - "`-S`"
      - "`-s`"
      - "`-h`"
      - "`-t`"
    answer: 0
    explanation: "`-S` (capital S) sorts by size. Options are case-sensitive too: `-t` sorts by time, and `-h` only changes how sizes are written (with `-l`)."

  - kind: explain
    title: --help, help and tldr
    body: |
      - **`--help`**: most Linux commands print a summary of their options when you add `--help`: `ls --help`. Faster than `man`, and it doesn't take over the screen.
      - **`help`**: a few commands, like `cd` and `alias`, are built into the shell itself and have no manual page. `help cd` explains those.
      - **`tldr`**: short for *too long; didn't read*. A community-written page of common examples: `tldr tar`. It isn't installed by default; you'll install it on your Mac in Module 12.

      🔹 On a Mac, many commands come from BSD and **don't understand `--help`**: `ls --help` on a Mac prints an error and a one-line usage. Use `man` there.

      <!-- page -->

      Here's `--help` for `mkdir`, the folder-making command from last lesson:

      ```
      learner@inkwell:~$ mkdir --help
      Usage: mkdir [OPTION]... DIRECTORY...
      Create the DIRECTORY(ies), if they do not already exist.

        -m, --mode=MODE   set file mode (as in chmod), not a=rwx - umask
        -p, --parents     no error if existing, make parent directories as needed
        -v, --verbose     print a message for each created directory
            --help        display this help and exit
      ```

      Read it line by line: the **Usage** line is the synopsis, then one line per option. `-p, --parents` means the short name `-p` and the long name `--parents` do the same thing, and the words on the right say what it does. So `mkdir -p` is the one that makes missing parent folders too.

  - kind: shell
    title: "Try it: --help and help"
    fixture: backoffice
    setup: cd ~/inkwell
    body: |
      Get some help from the terminal itself. Type these one at a time:

      1. `mkdir --help`: the short summary from the last page.
      2. `cat --help`: `cat` prints a file's contents (more in Module 6). Find the option that numbers the lines.
      3. `help cd`: `cd` is built into the shell, so it uses `help` instead of `--help`.

      Then pick any other command you know, like `wc --help` or `help pwd`, and read its options.

      Nothing is graded here: try them, then press **Continue**.

  - kind: shell
    title: One name per line
    fixture: backoffice
    setup: cd ~/inkwell
    body: |
      `ls` usually lists names side by side, in columns. Find the option that lists **one name per line**, using `ls --help` (or `man ls`).

      Then use it to list the `orders` folder, one name per line.
    output: true
    solution: ls -1 orders
    uses:
      - match: "\\s-[a-zA-Z]*1|--format"
        why: "the task asks for one name per line. Look for it in `ls --help`: it's an option made of a digit."
    reject:
      - ls orders
      - ls -l orders
    hint: "Run `ls --help` and read down the list: the option is a dash and a number. Then `ls -? orders` with that option."

  - kind: explain
    title: Errors are clues
    body: |
      Error messages look scary but they follow a pattern: **who is complaining, about what, and why**.

      ```
      cat: inkwell/Notes/todo.txt: No such file or directory
      │    │                       └── the problem
      │    └── what it was working on
      └── which program is talking
      ```

      Three errors cover most of what goes wrong:

      | Message | Usually means | First thing to check |
      |---|---|---|
      | `command not found` | the shell has no program with that name | spelling, capitals, is it installed? |
      | `No such file or directory` | nothing at that path | spelling, capitals, `pwd`: are you where you think? |
      | `Permission denied` | it exists, but you're not allowed | who owns it (Module 10) |

      <!-- page -->

      Here's one solved, start to finish. `cat` prints what's inside a file. Someone in the home folder asked for Inkwell's readme:

      ```
      learner@inkwell:~$ cat inkwell/readme.txt
      cat: inkwell/readme.txt: No such file or directory
      ```

      `cat` is talking, about `inkwell/readme.txt`, and the problem is that nothing has that name. So look at what *is* there:

      ```
      learner@inkwell:~$ ls inkwell
      logs  notes  old  orders  README.txt  site
      ```

      The file is `README.txt`, in capitals. Fix that one part and run it again:

      ```
      learner@inkwell:~$ cat inkwell/README.txt
      INKWELL BOOKS - shared files
      ============================
      orders/  one CSV file of orders per month
      notes/   meeting notes, to-do lists
      logs/    what the web shop writes while it runs
      site/    the website
      old/     things nobody dared to delete
      Ask Kenji before deleting anything!
      ```

  - kind: shell
    title: "Try it: read an error"
    fixture: backoffice
    setup: cd ~
    body: |
      Make the errors happen yourself, then fix them. Type these one at a time:

      1. `cat inkwell/readme.txt`: read the error. Who is talking, about what, and what's the problem?
      2. `ls inkwell` to see the real names.
      3. `cat inkwell/README.txt`: fixed.
      4. `sl inkwell`: a typo in the command name gives a different error.

      Then try `cat inkwell/README` (without `.txt`) and see which error you get.

      Nothing is graded here: try them, then press **Continue**.

  - kind: shell
    title: Read the error, fix the command
    fixture: backoffice
    setup: cd ~
    body: |
      Priya sent Inspector Bold this command to print Inkwell's to-do list:

      ```
      cat inkwell/Notes/todo.txt
      ```

      Run it exactly as written. Read the error, find out what's wrong (`ls` helps), and then print the to-do list.
    output: true
    solution: cat inkwell/notes/todo.txt
    hint: "The error says there's no such file. Run `ls inkwell` and compare the folder names with the command, letter by letter, capitals included."

  - kind: choice
    title: Which error?
    body: |
      Kenji types this and gets an error:

      ```
      learner@inkwell:~$ sl inkwell
      ```

      Which error does he get, and why?
    options:
      - "`command not found`: there's no program called `sl` (he meant `ls`)"
      - "`No such file or directory`, because the `inkwell` folder can't be found"
      - "`Permission denied`, because he isn't allowed to list that folder"
      - "No error: the shell quietly corrects small typos in command names"
    answer: 0
    explanation: "The first word is the program to run. There's no `sl`, so the shell says `bash: sl: command not found` before it even looks at `inkwell`."

  - kind: explain
    title: Searching for an error
    body: |
      When an error isn't obvious, search for it, but search well:

      1. **Copy the exact message**, not your summary of it.
      2. **Remove your own details**: your username, file names, folder names. `cat: inkwell/Notes/todo.txt: No such file or directory` → `cat "No such file or directory"`.
      3. **Add context**: the tool and the system, like `ubuntu`, `macos`, `zsh`, `git`.
      4. Prefer **official documentation**, and answers that are recent and well voted. Check the date: advice from 2012 may no longer apply.

      **Example: one error, turned into a good search.** Kenji gets:

      ```
      cp: cannot create regular file 'backup/kenji/prices.csv': Permission denied
      ```

      | Step | Result |
      |---|---|
      | 1. Copy the exact message | `cp: cannot create regular file 'backup/kenji/prices.csv': Permission denied` |
      | 2. Remove his own details | `cp "cannot create regular file" "Permission denied"` |
      | 3. Add context | `cp "cannot create regular file" "Permission denied" ubuntu` |

      The last version matches everyone who ever hit this problem, not just people with a folder called `kenji`.

  - kind: choice
    title: "Quick check: a good search"
    body: |
      You get:

      ```
      mv: cannot stat 'reports/Q3-Priya.txt': No such file or directory
      ```

      What's the best thing to search for?
    options:
      - '`mv "cannot stat" "No such file or directory" ubuntu`'
      - "`mv: cannot stat 'reports/Q3-Priya.txt': No such file or directory`"
      - "`mv not working`"
      - "`Priya file missing`"
    answer: 0
    explanation: "Keep the exact error words, drop your own file names, and add where you are (`ubuntu`). Pasting the whole line keeps your own file name in it, and the vaguer searches lose the message."

  - kind: explain
    title: Asking an AI to explain
    body: |
      AI assistants (like Claude) are very good at explaining a command **piece by piece**. Paste the command and ask *"Explain each part of this command"*:

      ```
      find ~/inkwell/logs -name "*.log" -mtime +30 -delete
      ```

      Use it to understand, not to obey:

      - **Check the important parts** against `man` or `--help`. AI can be confidently wrong, especially about options that differ between Mac and Linux.
      - **Never paste secrets**: passwords, keys, tokens, customer data.
      - Ask *"what could go wrong if I run this?"* before running anything that deletes or changes things.

  - kind: choice
    title: "Quick check: using AI safely"
    body: |
      An AI suggests a command that ends in `-delete`. What should you do before running it?
    options:
      - "Run it: AI is usually right"
      - "Paste your password so it can check your files"
      - "Check the parts in `man` or `--help`, and ask what could go wrong"
      - "Run it twice to be sure"
    answer: 2
    explanation: "Anything that deletes or changes things deserves a check. AI can be confidently wrong, and it should never see secrets."

  - kind: explain
    title: "⚠️ Never run what you don't understand"
    body: |
      The terminal does exactly what you say, with no undo. Some commands found online are mistakes, and some are traps:

      - `rm -rf ~/` deletes your entire home folder.
      - `curl https://example.com/install.sh | bash` downloads a script and runs it, sight unseen.
      - Anything starting with `sudo` runs with full power over the whole computer (Module 10).

      The rule: **before you press Return on a pasted command, you can say what every part does.** If you can't, look it up (`man`, `tldr`, an AI explanation), or try it first on a throwaway folder. This practice terminal is a safe place for exactly that.

      **Example: reading a pasted command before running it.** A forum says *"To tidy up, run this"*:

      ```
      find ~/Downloads -name "*.tmp" -mtime +30 -delete
      ```

      | Part | Means |
      |---|---|
      | `find ~/Downloads` | look through the Downloads folder and everything inside it |
      | `-name "*.tmp"` | only files whose names end in `.tmp` |
      | `-mtime +30` | only ones last changed more than 30 days ago |
      | `-delete` | delete each match, with no undo |

      Now you can say what it does: "delete month-old `.tmp` files in Downloads". Safer still, run it first **without** `-delete`: it just lists what it would remove.

  - kind: choice
    title: A helpful stranger
    body: |
      Inkwell's server is running out of disk space. In a forum, someone replies: *"Easy, just run `sudo rm -rf /var/log/*`, works every time."* What should Kenji do?
    options:
      - "Find out what each part does first: it deletes every log, as root, for good"
      - "Run it, since a highly-voted forum answer is very unlikely to be wrong"
      - "Run it without `sudo`, which makes any command safe enough to try out"
      - "Run it twice in a row, to make sure the space is really freed up"
    answer: 0
    explanation: "`sudo` gives full power, `rm -rf` deletes without asking, and `/var/log/*` is every log on the server: evidence included. Understand it first, and look for a safer fix (deleting only old logs). Removing `sudo` doesn't make a command safe; it only limits what it can reach."

  - kind: mac
    title: Help on your Mac
    body: |
      In your Mac's Terminal, open the manual for `ls` and leave it with **q**. The Mac's manual is the BSD one, so it's a little different from Linux's.

      Then try `ls --help`. On a Mac it fails with an "unrecognized option" error and a short usage line. That's the BSD version of `ls` talking: on a Mac, reach for `man`. For a command built into the shell, zsh has no `help`; `man zshbuiltins` covers them.
    commands: |
      man ls
      ls --help
  - kind: why
    body: |
      Being self-sufficient in the terminal isn't about memory. It's about reading the error, checking the manual, and searching well. The habit of understanding a command before running it is what separates someone who uses the terminal confidently from someone who's one bad paste away from losing their files.

  - kind: recap
    body: |
      - `man command`: the full manual. **Space**/**b** to move, **/word** to search, **q** to quit.
      - `command --help` for a quick summary (Linux), `help cd` for shell built-ins, `tldr command` for examples.
      - Errors read as **program: thing: problem**. `command not found` → name; `No such file or directory` → path; `Permission denied` → rights.
      - Search the exact message without your own details, plus the tool and system.
      - AI explains commands well; check what matters and never paste secrets.
      - **Never run a command you can't explain.**
