    options:
      - "a.txt b.txt"
      - "*.txt"
      - "a.txt b.txt c.csv notes.md"
      - "a.txt"
    answer: 0
    explanation: "The shell turns `*.txt` into every matching name before `echo` runs, so echo prints the two `.txt` files. That's why `echo` and `ls` are good ways to preview a pattern."
