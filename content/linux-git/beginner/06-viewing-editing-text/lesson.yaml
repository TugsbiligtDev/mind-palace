steps:
  - kind: explain
    title: Plain text runs the world
    body: |
      Almost everything you'll touch from the terminal is **plain text**: just characters, nothing else. Notes, logs, CSV files, web pages, settings files, program code, Git's own files.

      **Rich text** (a Word document, a Pages file, TextEdit's default) stores fonts, colors and layout too, in a format only its app understands. `cat report.docx` prints gibberish.

      Plain text can be read by any program, compared line by line, searched, and tracked by Git. That's why terminal people love it.

      ⚠️ On a Mac, **TextEdit** saves rich text by default. For code and settings files use **Format → Make Plain Text**, or better, a code editor like VS Code.

      **Example.** `file` tells you what's inside a file, and a CSV of orders is just readable text:

      ```
      learner@inkwell:~/inkwell$ file notes/todo.txt
      notes/todo.txt: ASCII text
      learner@inkwell:~/inkwell$ head -3 orders/2026-08.csv
      order_id,date,customer,book,price
      1041,2026-08-03,Amara Okafor,Dune,9.99
      1042,2026-08-04,Liam Chen,The Hobbit,8.50
      ```

      Commas between the columns, one order per line. Any program, and you, can read it.

  - kind: shell
    title: "Try it: is it plain text?"
    fixture: backoffice
    setup: cd ~/inkwell
    body: |
      Type these one at a time:

      1. `file notes/todo.txt`
      2. `file orders/2026-08.csv`
      3. `head -3 orders/2026-08.csv`

      Then try `file` on a folder: `file logs`.

      Nothing is graded here: try them, then press **Continue**.

  - kind: explain
    title: Reading files
    body: |
      | Command | Shows |
      |---|---|
      | `cat file` | the whole file at once (fine for short files) |
      | `less file` | a long file one screen at a time, same keys as `man` (Space, b, /word, **q**) |
      | `head file` | the first 10 lines |
      | `tail file` | the last 10 lines |
      | `head -n 3 file` | the first 3 lines (`tail -n 3` for the last 3) |

      `cat` can also join files: `cat a.txt b.txt` prints one after the other. That's where its name comes from: con**cat**enate.

      <!-- page -->

      Here they are on Inkwell's files. `cat` prints the whole to-do list; `head -n 3` gives the heading line and the first two August orders:

      ```
      learner@inkwell:~/inkwell$ cat notes/todo.txt
      - reorder Dune (only 2 left)
      - fix the broken link on the About page
      - ask Marcus about the September refunds
      learner@inkwell:~/inkwell$ head -n 3 orders/2026-08.csv
      order_id,date,customer,book,price
      1041,2026-08-03,Amara Okafor,Dune,9.99
      1042,2026-08-04,Liam Chen,The Hobbit,8.50
      ```

      `tail -n 3` gives the last three lines of the list of books sold, and `cat` with two files prints them one after the other:

      ```
      learner@inkwell:~/inkwell$ tail -n 3 notes/books-sold.txt
      Beloved
      The Hobbit
      Dune
      learner@inkwell:~/inkwell$ cat old/price-list-OLD.txt notes/todo.txt
      Dune 9.99
      The Hobbit 8.50
      - reorder Dune (only 2 left)
      - fix the broken link on the About page
      - ask Marcus about the September refunds
      ```

  - kind: shell
    title: "Try it: cat, head, tail and less"
    fixture: backoffice
    setup: cd ~/inkwell
    body: |
      Type these one at a time:

      1. `cat notes/todo.txt`
      2. `head -n 3 orders/2026-08.csv`
      3. `tail -n 3 notes/books-sold.txt`
      4. `head notes/books-sold.txt`: with no `-n`, you get 10 lines.
      5. `less logs/access.log`: move with Space and **b**, then press **q** to leave.

      Then change the `3` in step 3 to `5` and run it again.

      Nothing is graded here: try them, then press **Continue**.

  - kind: shell
    title: Peek at the shop's log
    fixture: backoffice
    setup: cd ~/inkwell
    body: |
      `logs/shop.log` is what the web shop writes while it runs, oldest line first.

      Print just the **last 2 lines** of the log, to see the most recent events.
    output: true
    solution: tail -n 2 logs/shop.log
    reject:
      - tail logs/shop.log
      - head -n 2 logs/shop.log
    hint: "`tail` shows the end of a file; `-n 2` limits it to two lines."

  - kind: explain
    title: Watching a log live
    body: |
      `tail -f logs/shop.log` prints the last lines and then **keeps waiting**: every new line the shop writes appears as it happens. It's how you watch a server while you test something. It never finishes on its own: press **Ctrl+C** to stop watching.

      The practice terminal can't wait for new lines, so here `tail -f` shows the last lines and stops, with a note. On your Mac or a real server it keeps going.

      **Example**, in the practice terminal:

      ```
      learner@inkwell:~/inkwell$ tail -f logs/shop.log
      2026-10-05 08:00:01 INFO  shop started
      2026-10-05 08:02:13 INFO  order 1050 paid
      2026-10-05 09:15:40 WARN  stock low: Dune (2 left)
      2026-10-05 10:21:07 ERROR payment failed for order 1051
      2026-10-05 10:21:09 INFO  order 1051 retried
      2026-10-05 11:42:55 INFO  order 1051 paid
      2026-10-05 13:03:30 ERROR could not send email to customer 18
      2026-10-05 14:30:00 INFO  backup finished
      (tail -f would now keep waiting and print new lines as they're added, until you press Ctrl+C. The practice terminal stops here.)
      ```

  - kind: shell
    title: "Try it: tail -f"
    fixture: backoffice
    setup: cd ~/inkwell
    body: |
      Type `tail -f logs/shop.log` and read the note at the end. Then compare with `tail -3 logs/shop.log`, which shows just the last 3 lines.

      On your Mac, try `tail -f` on any file that grows, and press **Ctrl+C** to stop it.

      Nothing is graded here: try them, then press **Continue**.

  - kind: explain
    title: Counting with wc
    body: |
      `wc` (**w**ord **c**ount) counts a file's lines, words and bytes:

      ```
      learner@inkwell:~/inkwell$ wc notes/todo.txt
        3  22 110 notes/todo.txt
      ```

      Usually you want just one number: `wc -l` counts **l**ines, `wc -w` words, `wc -c` bytes. Counting lines is surprisingly useful: how many orders, how many errors, how many users.

      ```
      learner@inkwell:~/inkwell$ wc -l notes/books-sold.txt
      10 notes/books-sold.txt
      learner@inkwell:~/inkwell$ wc -w notes/todo.txt
      22 notes/todo.txt
      ```

      Ten books sold this week (one per line), and 22 words in the to-do list.

  - kind: shell
    title: How many lines?
    fixture: backoffice
    setup: cd ~/inkwell
    body: |
      Count the **lines** in `orders/2026-09.csv`.
    output: true
    solution: wc -l orders/2026-09.csv
    hint: "`wc` with the option for **l**ines, then the file's path."

  - kind: choice
    title: Lines are not orders
    body: |
      You counted 6 lines in September's order file. Look at it with `cat orders/2026-09.csv`. How many **orders** does it hold?
    options:
      - "5, because the first line is the column headings"
      - "6, because each line is one order"
      - "7, because wc doesn't count the last line"
      - "4, because the first and last lines are headings"
    answer: 0
    explanation: "A CSV file's first line names the columns (`order_id,date,customer,…`). Always look at a file before trusting a count of it."

  - kind: explain
    title: Editing with nano
    body: |
      To change a file from the terminal you need a **terminal text editor**. **nano** is the friendly one, and it's installed almost everywhere:

      ```
      nano notes/todo.txt
      ```

      The file opens inside the terminal. Type to edit, move with the arrow keys. The bottom two lines list the shortcuts, where `^` means the **Control** key:

      | Keys | Does |
      |---|---|
      | **Ctrl+O**, then Return | write **O**ut (save) the file |
      | **Ctrl+X** | exit (if you haven't saved, it asks: **Y** to save, then Return) |
      | **Ctrl+K** / **Ctrl+U** | cut the current line / paste it |
      | **Ctrl+W** | search ("where is") |

      `nano newfile.txt` creates the file when you save.

  - kind: shell
    title: "Try it: nano"
    fixture: backoffice
    setup: cd ~/inkwell
    body: |
      Practise on a new file before you touch the real to-do list:

      1. `nano notes/ideas.txt` opens an empty file (it's created when you save).
      2. Type a line, like `- window display for Kindred`.
      3. Press **Ctrl+O**, then Return, to save. Then **Ctrl+X** to leave.
      4. `cat notes/ideas.txt` to see your line.

      Then open it again with `nano notes/ideas.txt`, add a second line, and leave with **Ctrl+X** *without* saving first: nano asks, and **Y** then Return saves.

      Nothing is graded here: try them, then press **Continue**.

  - kind: shell
    title: Add to the to-do list
    fixture: backoffice
    setup: cd ~/inkwell
    body: |
      Open the to-do list in nano and add this as a new **last line**:

      ```
      - back up the website every Friday
      ```

      Save with **Ctrl+O** and Return, leave with **Ctrl+X**, then check with `cat notes/todo.txt`.
    tests:
      - cat notes/todo.txt
    solution: |
      echo '- back up the website every Friday' >> notes/todo.txt
    hint: "`nano notes/todo.txt`, press **↓** until you're below the last line, type the new line exactly (dash, space, words), then **Ctrl+O**, Return, **Ctrl+X**. (The \"show the commands\" answer uses `>>`, which adds a line without an editor: Module 8.)"

  - kind: info
    title: "🔹 If you land in vim"
    body: |
      Some programs open **vim** instead of nano, especially Git on a fresh computer. vim works in *modes*, so typing doesn't do what you expect and it seems impossible to leave.

      To get out: press **Esc**, then type `:q!` and press **Return**. That quits **without saving**. (`:wq` saves and quits.)

      That's all you need for now. Module 26 teaches vim properly, and Module 14 sets Git to use nano. The practice terminal has a small vim too: try `vim practice.txt`, then get out with **Esc**, `:q!`, **Return**.

  - kind: mac
    title: Open a folder in VS Code
    body: |
      For bigger edits, a real code editor is more comfortable. **Visual Studio Code** (free, from [code.visualstudio.com](https://code.visualstudio.com)) can be opened from the terminal:

      1. Install VS Code and open it once.
      2. Press **⇧⌘P**, type *shell command*, and choose **Shell Command: Install 'code' command in PATH**.
      3. In Terminal, go to a folder and run `code .`: the whole folder opens in VS Code.

      Also try nano and `tail -f` on your Mac: nano comes with macOS. `tail -f` will keep waiting until you press Ctrl+C.
    commands: |
      cd ~/terminal-practice
      nano hello.txt
      code .
      tail -f /var/log/system.log
  - kind: why
    body: |
      On a server there's no Finder and no double-click: reading a log or fixing a settings file happens in the terminal. Knowing `head`, `tail`, `less` and nano means you can investigate and repair a machine with nothing but a text window. And recognizing vim saves you from the classic "how do I exit?" panic.

  - kind: recap
    body: |
      - Terminal tools work on **plain text**. TextEdit's rich text isn't plain text.
      - `cat` the whole file, `less` page by page (**q** quits), `head`/`tail -n N` the start or end.
      - `tail -f` follows a log live until **Ctrl+C**.
      - `wc -l` counts lines (check whether a heading line is included).
      - **nano**: Ctrl+O save, Ctrl+X exit, Ctrl+K cut, Ctrl+U paste.
      - Stuck in **vim**: Esc, `:q!`, Return.
      - Mac: `code .` opens the folder in VS Code.
