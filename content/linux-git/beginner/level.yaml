id: beginner
title: Beginner
season: 1
season_title: The Back Office
season_pitch: |
  Inkwell Books runs on a small Linux server, and its shared files are a mess. Inspector Bold
  sends you in with nothing but a terminal. Learn to find your way around, sort and search files,
  fix permissions and set up the shell. Then put the store's website under Git, follow its history
  to a payment key that should never have been committed, and finish on GitHub.
