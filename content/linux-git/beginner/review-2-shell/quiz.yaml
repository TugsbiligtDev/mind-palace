questions:
  - type: predict
    prompt: What does this print?
    code: |
      printf 'ok\nfail\nok\nok\nfail\n' > /tmp/r.txt
      grep -v ok /tmp/r.txt | wc -l
    options:
      - "2"
      - "3"
      - "5"
      - "fail\nfail"
    answer: 0
    explanation: "`grep -v ok` keeps the lines without `ok` (two `fail` lines), and `wc -l` counts them."
  - type: mcq
    prompt: "Which command saves the matches **and** shows them on screen?"
    options:
      - "`grep ERROR app.log | tee errors.txt`"
      - "`grep ERROR app.log > errors.txt`"
      - "`grep ERROR app.log >> errors.txt`"
      - "`grep ERROR app.log 2>&1 errors.txt`"
    answer: 0
    explanation: "`tee` writes to the file and passes everything on to the screen. `>` and `>>` only write to the file, and `2>&1 errors.txt` isn't a redirect into a file at all (grep would search a file called errors.txt)."
  - type: mcq
    prompt: "`./report.sh` gives `Permission denied` and `ls -l` shows `-rw-r--r--`. After `chmod u+x report.sh` it runs. What did the fix change?"
    options:
      - "The owner gained permission to execute the file"
      - "Everyone gained permission to change the file"
      - "The file now belongs to root instead of you"
      - "The file was moved into a folder on the PATH"
    answer: 0
    explanation: "`u+x` adds execute for the user who owns the file: `-rwxr--r--`."
  - type: mcq
    prompt: "A tool works when you type `~/tools/backup` but `backup` alone says `command not found`. Why?"
    options:
      - "`~/tools` isn't one of the folders listed in `$PATH`"
      - "The file isn't executable, so the shell skips it"
      - "Commands can't live anywhere inside your home folder"
      - "`backup` is a reserved word in bash and can't be used"
    answer: 0
    explanation: "With the full path it runs, so it's executable. By name alone, the shell only searches the `$PATH` folders."
  - type: mcq
    prompt: "Which is the safe way to read a root-only log as an admin user?"
    options:
      - "`sudo less /var/log/app.log`"
      - "`sudo chmod 777 /var/log/app.log`, then `less` it"
      - "`sudo chown $USER /var/log/app.log`, then `less` it"
      - "`cp /var/log/app.log ~` and read the copy"
    answer: 0
    explanation: "Use root's power for that one command. Changing the log's permissions or owner weakens the system for good, and the copy fails anyway without permission to read."
