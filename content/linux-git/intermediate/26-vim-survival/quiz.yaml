  - type: mcq
    prompt: "`git commit` opened vim, and you've decided not to commit after all. What do you do?"
    options:
      - "Quit without saving (`:q!`): with an empty message, Git aborts the commit"
      - "Type `abort` as the message and save it with `:wq`"
      - "Press Ctrl+Z, because that cancels whatever program is running"
      - "Delete the `.git` folder, the only way to stop a commit in progress"
    answer: 0
    explanation: "Git only commits if the message isn't empty. Quitting without writing leaves it empty, and Git prints *Aborting commit due to empty commit message.*"
