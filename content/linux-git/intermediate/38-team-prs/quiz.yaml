    prompt: "Your PR isn't finished, but you'd like early feedback. What's the usual way?"
    options:
      - "Open it as a draft (`gh pr create --draft`), and mark it ready later"
      - "Open it normally with 'DO NOT MERGE' in the title and hope nobody does"
      - "Push the branch without a PR and email the diff to the reviewers"
      - "Merge it, and fix the rest in a second PR afterwards"
    answer: 0
    explanation: "A draft PR is visible and can be discussed, but can't be merged and doesn't request reviews until `gh pr ready`."
  - type: mcq
    prompt: "What does **Squash and merge** put on `main`?"
    options:
      - "One new commit with all of the PR's changes"
      - "All of the PR's commits, plus a merge commit"
      - "All of the PR's commits replayed, without a merge commit"
      - "Only the PR's last commit; the others are discarded"
    answer: 0
    explanation: "Squash combines the whole PR into a single commit, usually titled with the PR's title and number."
