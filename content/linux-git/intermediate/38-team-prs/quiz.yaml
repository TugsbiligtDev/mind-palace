    prompt: "In a fork's clone, what are `origin` and `upstream`?"
    options:
      - "`origin` is your fork (you push there); `upstream` is the original project (you fetch from it)"
      - "`origin` is the original project; `upstream` is your fork on GitHub"
      - "Both point to your fork; `upstream` is just a second name for it"
      - "`upstream` is the branch you started from; `origin` the one you're on"
    answer: 0
    explanation: "You can't push to the original, so you push to your fork (origin) and open PRs from there into upstream."
