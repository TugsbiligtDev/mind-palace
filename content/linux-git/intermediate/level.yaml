season_pitch: |
  Real Linux, real servers. Run Ubuntu on your Mac, process logs with a toolkit of text commands,
  manage processes, write reliable bash scripts and work on remote machines over SSH. Then go
  further with Git (undo anything, rebase, resolve any conflict) and collaborate the way teams do
  on GitHub, with reviews, protected branches and automatic checks.
