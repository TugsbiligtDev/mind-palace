    options:
      - "main is shared; revert adds a commit everyone can pull, reset would need a force-push"
      - "reset can only undo the very last commit, and this one was older"
      - "revert also deletes the commit from everyone's computers"
      - "reset doesn't work on commits made by another person"
    answer: 0
