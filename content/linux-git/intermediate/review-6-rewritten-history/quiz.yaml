      - "`git log -S api_key`"
      - "`git log --grep=api_key`"
      - "`git blame api_key`"
      - "`git show api_key`"
    answer: 0
    explanation: "`-S` (the pickaxe) looks at the changes. `--grep` only searches commit messages."
