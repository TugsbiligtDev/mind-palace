  - type: mcq
    prompt: "`git fetch` prints `+ 4f2a1c0...9a1efb0 main -> origin/main (forced update)`. What does it mean?"
    options:
      - "GitHub's main was rewritten: the new tip doesn't contain the old one, so someone force-pushed"
      - "Your local main was updated automatically to match GitHub"
      - "The fetch failed and Git had to force the connection"
      - "A new branch called main was created on GitHub"
    answer: 0
    explanation: "A normal update is a fast-forward (`old..new`). A `+` and three dots mean the remote branch jumped to a commit that doesn't follow the old one."
  - type: mcq
    prompt: "GitHub's main lost two commits that your clone still has. Why does a plain `git push` fix it, without force?"
    options:
      - "GitHub's main is now an ancestor of your main, so the push is a simple fast-forward"
      - "Git automatically force-pushes when it detects a forced update"
      - "Plain pushes always overwrite the remote branch completely"
      - "GitHub restores lost commits whenever someone pushes to the branch"
    answer: 0
    explanation: "Your main is the old main plus nothing new: GitHub's current tip is in its history, so pushing just moves GitHub's pointer forward."
