episode: 1
title: The Locked Archive
briefing: |
  Inspector Bold slides a key card across the desk. "Wanderly's IT team found something odd.
  Someone moved a handful of tables out of the usual place and into a separate schema. We don't
  know what's in them yet."

  She taps the card. "Before we read a single row, I want to know the *shape* of what we're
  dealing with. Find the table our intruder has been writing in."
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.guest_book (
      entry_id    INTEGER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      visitor     TEXT NOT NULL,
      visited_on  DATE NOT NULL,
      room        TEXT,
      signed_by   TEXT
  );
  CREATE TABLE evidence.lost_and_found (
      item_id     INTEGER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      item        TEXT NOT NULL,
      found_on    DATE
  );
  CREATE TABLE evidence.phone_records (
      record_id   INTEGER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      caller      TEXT,
      minutes     INTEGER
  );
  INSERT INTO evidence.guest_book (visitor, visited_on, room, signed_by) VALUES
  ('Night cleaner', '2026-02-19', 'Lobby', 'S. Otgon'),
  ('Unknown', '2026-02-21', 'Server room', '~C'),
  ('Unknown', '2026-02-22', 'Server room', '~C');
  INSERT INTO evidence.lost_and_found (item, found_on) VALUES ('Umbrella', '2026-02-18');
  INSERT INTO evidence.phone_records (caller, minutes) VALUES ('Front desk', 3);
clues:
  - The tables were moved out of `public` into a schema of their own.
  - One of them still has a column the intruder forgot to remove, **`signed_by`**.
task: |
  1. Find the schema the tables were moved into.
  2. List the tables in that schema.
  3. Find the table that has a `signed_by` column, and **describe it with `\d`** as your final command.

  Use meta-commands only, each on its own line. Press **Run** to explore and **Submit answer** when your last command describes the right table.
starter: |
  -- Explore with meta-commands. Each one goes on its own line.
check:
  mode: result
  solution: |
    \d evidence.guest_book
hints:
  - "`\\dn` lists all the schemas. One of them isn't `public`."
  - "`\\dt evidence.*` lists every table in the `evidence` schema. Then describe each one with `\\d evidence.<table_name>`."
  - "The table with `signed_by` is `evidence.guest_book`. Make `\\d evidence.guest_book` your last line."
reveal: |
  `evidence.guest_book`: visitor, visited_on, room… and **signed_by**.

  Moth peers over your shoulder at the entries. Two late-night visits to the server room, on
  February 21 and 22. Both signed the same way: **~C**.

  "The Cartographer," Inspector Bold says quietly. "Whoever this is, they wanted to be noticed.
  Let's find out what they changed."
