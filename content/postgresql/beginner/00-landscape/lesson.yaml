steps:
  - kind: explain
    title: Two programs, not one
    body: |
      When people say "I'm using PostgreSQL", two separate programs are involved:

      - The **database server**: a program that runs quietly in the background, stores the data on disk, and answers requests. It never shows you a window. It just waits.
      - A **client**: any program that *sends* the server requests and *shows* you the answers. **psql** (a text tool in Terminal) and **pgAdmin** (a visual app) are both clients.

      Think of a restaurant. The server is the kitchen: it has all the ingredients and does the work, but you never walk in. The client is the waiter: you tell it what you want, it carries the order to the kitchen and brings back the plate.

      The language you order in is **SQL** (Structured Query Language). Every client speaks it to the server.

  - kind: explain
    title: What's running on your Mac, and in this page
    body: |
      On your MacBook, Homebrew installed **PostgreSQL 18** and runs it as a background *service*, so the server starts automatically when you log in and listens at `localhost`, port `5432`. `localhost` just means "this same computer".

      You talk to it with two clients:

      | Client | What it is | Best for |
      |---|---|---|
      | **psql** | Text tool in Terminal | Speed, precision, scripting, and what professionals use daily |
      | **pgAdmin** | Visual app with menus | Browsing tables, seeing structure at a glance |

      **This page is a third option.** It runs a real PostgreSQL 18 server *inside your browser tab*, with the same `learn_sql` course data, plus a small psql-style console. Nothing you do here can harm the database on your Mac, and every run starts from a fresh copy.

  - kind: explain
    title: How data is organized
    body: |
      PostgreSQL organizes data in nested boxes, from biggest to smallest:

      1. **Server**: the running program. One server can hold many databases.
      2. **Database**: a separate collection of data. Yours are `postgres`, `learn_sql` and a few from an old class. You're always *connected to* exactly one.
      3. **Schema**: a folder inside a database that groups tables. Every database starts with one called `public`, and that's where our course tables live.
      4. **Table**: a grid of data about one kind of thing, like `countries`.
      5. **Row**: one thing in that table, like Japan. Also called a *record*.
      6. **Column**: one piece of information every row has, like `continent`. Also called a *field*.

      So when we say `countries`, we really mean *server → learn_sql → public → countries*.

  - kind: try
    title: "\\l: list the databases"
    body: |
      psql has **meta-commands**, which are shortcuts that start with a backslash `\`. They aren't SQL. They're instructions to psql itself, usually "show me what's here".

      `\l` (a lowercase L) **l**ists the databases on the server. Run it with the **Run** button or **⌘ + Enter**.

      In this sandbox you'll only see the course database and PostgreSQL's built-in ones. Your Mac will also show `DB_week1`, `finance_db` and `school_db`.
    sql: |
      \l

  - kind: try
    title: "\\dt: list the tables"
    body: |
      You're connected to `learn_sql`. Which tables does it have?

      `\dt` means **d**escribe **t**ables. It lists the tables in the current database. Type it in the editor and run it.

      You should see the 7 course tables: `attractions`, `cities`, `countries`, `reviews`, `travelers`, `trip_stops` and `trips`. They all live in the `public` schema.
    sql: |
      -- Type \dt on the line below, then run it.
    expect: |
      \dt

  - kind: try
    title: "\\d: describe one table"
    body: |
      `\d` followed by a table name **d**escribes that table: its columns, each column's **data type** (the kind of value it holds, like `integer` or `text`), and rules like `not null` (the value can't be missing).

      Run this, then change `countries` to `trips` and run it again. What columns does a trip have?
    sql: |
      \d countries

  - kind: explain
    title: Reading \d output
    body: |
      From `\d countries`:

      | Column | Type | Nullable | Default |
      |---|---|---|---|
      | country_id | integer | not null | generated always as identity |
      | name | text | not null | |
      | continent | text | not null | |

      - `country_id` is a number that PostgreSQL **generates automatically** for each new row (1, 2, 3…). You never type it yourself. It's the row's unique ID.
      - `name` and `continent` hold text and are `not null`: every country *must* have both.

      You'll learn all of these types properly in Module 5. For now, `\d` is how you find out what's inside a table before you ask it anything.

  - kind: try
    title: More meta-commands
    body: |
      A few more you'll use constantly:

      - `\c learn_sql`: **c**onnect to a different database (in psql on your Mac, `\c postgres` switches databases)
      - `\dn`: list schemas (you'll see `public`)
      - `\?`: help, listing every meta-command
      - `\q`: **q**uit psql

      Try each one. Remember that each meta-command goes **on its own line**.
    sql: |
      \dn
      \?

  - kind: try
    title: A first peek at real data
    body: |
      Meta-commands show you the *structure*. To see the *data* itself, you ask in SQL. You'll learn this properly in Module 2, but here's a taste:

      `SELECT * FROM countries;` means "give me every column (`*`) of every row in the countries table". Note the **semicolon** `;` at the end: it tells PostgreSQL "my question ends here".

      Run it. Then try `trips` instead of `countries`.
    sql: |
      SELECT * FROM countries;

  - kind: mac
    title: Now do it in real psql
    body: |
      Open **Terminal** (or Ghostty) on your Mac and run the commands below one line at a time. `psql learn_sql` opens psql connected to your course database. You'll see the prompt change to `learn_sql=#`, which means psql is waiting for you.

      Then open **pgAdmin 4** → *Local PostgreSQL* → *Databases* → *learn_sql* → *Schemas* → *public* → *Tables*. It's the same 7 tables, shown as a tree. Same server, different client.
    commands: |
      psql learn_sql
      \dt
      \d trips
      \q

  - kind: info
    title: Loading the dataset
    body: |
      Your `learn_sql` on the Mac already has the course data. You loaded and verified all 7 tables on 2026-09-18. If you ever need to rebuild it, the full script is on the **Take it to your Mac** page, and running `psql learn_sql -f dataset.sql` replaces the 7 tables with a clean copy.

      This site loads the identical dataset automatically, fresh for every query you run.

  - kind: why
    body: |
      Before you can ask a database good questions, you need to know where you are and what's there. `\l`, `\dt` and `\d` are the map you'll open at the start of every investigation.

  - kind: recap
    body: |
      - The **server** stores and serves data. **Clients** (psql, pgAdmin, this page) send it SQL and show the results.
      - Nesting: **server → database → schema → table → row / column**. Course tables live in `learn_sql` → `public`.
      - Meta-commands start with `\`, aren't SQL, and end at the end of the line: `\l` lists databases, `\c` connects, `\dt` lists tables, `\d name` describes a table, `\dn` lists schemas, `\?` shows help, `\q` quits.
      - SQL statements end with a semicolon `;`.
