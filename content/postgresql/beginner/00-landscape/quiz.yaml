pass: 3
questions:
  - type: mcq
    prompt: In the restaurant analogy, which of these is the **waiter**, the client that carries your request to the server?
    options:
      - The PostgreSQL server running in the background
      - psql
      - The learn_sql database
      - The countries table
    answer: 1
    explanation: psql is a *client*. It sends your SQL to the server (the kitchen) and shows you the results. pgAdmin is a client too.

  - type: mcq
    prompt: Which order goes from the **biggest** container to the **smallest**?
    options:
      - database → server → table → schema → row
      - server → database → schema → table → row
      - server → schema → database → row → table
      - table → schema → database → server → row
    answer: 1
    explanation: One server holds many databases, a database holds schemas (like `public`), a schema holds tables, and a table holds rows.

  - type: fill
    prompt: You're connected to `learn_sql` in psql. Which meta-command lists its tables?
    code: "____"
    answer: \dt
    explanation: "`\\dt` means *describe tables*. `\\l` would list databases instead."

  - type: fill
    prompt: Which meta-command shows the columns and types of the `trips` table?
    code: "____ trips"
    answer: \d
    explanation: "`\\d trips` describes the table: every column, its data type, and whether it can be empty."

  - type: mcq
    prompt: |
      You type this in psql and press Enter:

      `\dt SELECT * FROM countries;`

      What happens?
    options:
      - psql lists the tables, then shows the countries data
      - An error, because meta-commands need a semicolon
      - psql reads `SELECT * FROM countries;` as arguments to `\dt`, and the SQL never runs
      - The SQL runs first, then the tables are listed
    answer: 2
    explanation: A meta-command ends at the **end of the line**. Everything after `\dt` on that line is read as its arguments. Put `\dt` and your SQL on separate lines.
