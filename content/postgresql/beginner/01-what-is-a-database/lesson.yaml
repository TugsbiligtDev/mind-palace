steps:
  - kind: explain
    title: Data vs. information
    body: |
      **Data** is raw facts: `The Hobbit`, `14.99`, `card`. On its own, a fact like that doesn't tell you much.

      **Information** is data that answers a question: *"How many sales were paid by card?"* or *"Which customer spends the most?"*

      A **database** is an organized place to keep data so you can turn it into information quickly and reliably, today and years from now.

  - kind: try
    title: Raw data
    body: |
      This is Inkwell Books' sales log, exactly as stored in its first, simple database, `practice`. Press **Run** (or **⌘ + Enter**).

      It's all facts, no answers yet. You don't need to understand the SQL yet; you'll learn it in the next modules.
    sql: |
      SELECT * FROM sales;

  - kind: try
    title: Turning it into information
    body: |
      Same data, but now we ask a question: *how many sales were paid each way?* Run it.

      Thirty rows of facts became four lines that actually tell you something.
    sql: |
      SELECT payment_method, count(*) AS sales
      FROM sales
      GROUP BY payment_method;

  - kind: explain
    title: Why not just use a spreadsheet?
    body: |
      Spreadsheets are great for small, personal lists. They start to hurt when data grows and people share it:

      | Problem | Spreadsheet | Database |
      |---|---|---|
      | **Duplicate data** | A customer's address is copied into every order row. Change it in one place and the copies disagree. | Each fact is stored **once** and linked to where it's needed. |
      | **Several users at once** | Two people edit the same file and one person's changes get lost. | Many people and apps read and write at the same time, safely. |
      | **Rules that keep data correct** | Anyone can type `abc` in the price column. | You set rules (a price must be a number, never negative) and the database refuses bad data. |

      Databases also handle millions of rows without slowing to a crawl.

  - kind: try
    title: No rules yet
    body: |
      The `practice` tables are deliberately simple: they have **no rules yet**, a bit like a spreadsheet. Run it: a book with a price of **−5** is saved without complaint.
    sql: |
      INSERT INTO books (book_id, title, price)
      VALUES (31, 'Oops', -5.00)
      RETURNING title, price;

  - kind: try
    title: A rule in action
    body: |
      This small table has a rule: a price can't be negative. Run it and read the error. The database refused to store bad data. You'll add rules like this yourself in Module 12.
    sql: |
      CREATE TABLE price_list (
          title  text,
          price  numeric CHECK (price >= 0)
      );
      INSERT INTO price_list VALUES ('Oops', -5.00);
    expect_error: true

  - kind: explain
    title: The DBMS
    body: |
      A **DBMS** (Database Management System) is the software that manages databases. It:

      - stores the data safely on disk
      - answers questions about it
      - enforces the rules
      - lets many people use it at once without chaos

      **PostgreSQL** is a DBMS. So are MySQL and SQLite. People often say "database" when they mean the DBMS. That's fine in conversation, but it helps to know they're different things: the DBMS is the software, and a database is the collection of data it manages.

  - kind: explain
    title: "The relational model: tables, rows, columns"
    body: |
      PostgreSQL is a **relational** database. It keeps data in **tables**, like grids:

      - A **table** holds one kind of thing: `books`, `customers`, `sales`.
      - A **row** is one thing: the book *The Hobbit*. It's also called a *record*.
      - A **column** is one piece of information every row has: `price`. It's also called a *field*.

      The "relational" part is that tables **link** to each other. In a well-designed database, a sale doesn't copy the book's title and author. It stores the book's **ID**, a number that points at the book's row.

      The `practice` tables don't link yet. Every sale **copies** the book's title, author and genre. That's on purpose: from Module 11 you'll work with Inkwell's proper `bookstore` database, and in Module 17 you'll see exactly why the copies cause trouble.

  - kind: try
    title: The same facts, copied
    body: |
      Run this. *Atomic Habits* was sold 3 times, and its title, author and genre were copied onto every sale. Now change the title to `'Sapiens'` and run it again.
    sql: |
      SELECT sale_id, book_title, author_name, genre
      FROM sales
      WHERE book_title = 'Atomic Habits';

  - kind: explain
    title: "SQL: the language"
    body: |
      **SQL** (Structured Query Language, said "S-Q-L" or "sequel") is how you talk to a relational database. Every relational DBMS understands it, with small differences in dialect.

      SQL is **declarative**: you describe *what* you want, not *how* to find it.

      ```sql
      SELECT title FROM books WHERE price > 18;
      ```

      reads almost like English: *"give me the titles of books that cost more than 18."* You never tell PostgreSQL which rows to look at first or how to search. It works that out for you.

  - kind: explain
    title: Client and server
    body: |
      Using PostgreSQL always involves **two programs**:

      - The **server** runs quietly in the background. It holds the data, does the work, and waits for requests. It never shows you a window.
      - A **client** is any app that connects to the server, sends it SQL, and shows you the answer. Examples: **psql** (a text tool in Terminal), **pgAdmin** (a visual app), a website's code, and **this page**.

      Think of a restaurant: the server is the kitchen, the client is the waiter, and SQL is the language you order in. One kitchen serves many waiters at once.

      This page runs a real PostgreSQL 18 server **inside your browser tab**, with Inkwell Books' data loaded. Every time you press Run you get a fresh copy, so you can't break anything.

  - kind: explain
    title: Where PostgreSQL fits
    body: |
      **PostgreSQL** (often just "Postgres") is:

      - **free and open source**: no license fees, and anyone can read its code
      - **over 30 years old** and known for being reliable and correct
      - **an industry standard**, used by startups, banks and governments, and offered by every big cloud provider

      The skills you learn here carry over to almost every other SQL database.

  - kind: info
    title: "🔹 Other databases you'll hear about"
    body: |
      Just recognize these names:

      - **MySQL**: another popular free relational database, common behind websites.
      - **SQLite**: a tiny relational database that lives in a single file. It runs inside phone apps and browsers, with no separate server.
      - **NoSQL databases** such as **MongoDB**: they store data as flexible documents instead of tables. They're useful for some jobs, but they don't use SQL and are built around different rules.

  - kind: why
    body: |
      Almost every app you use (banking, maps, messaging, shopping) keeps its data in a database. Knowing what a database is, and why it beats a spreadsheet, is the foundation for everything else in this course.

  - kind: recap
    body: |
      - **Data** is raw facts. **Information** is data that answers a question.
      - Databases beat spreadsheets on duplicate data, many users at once, and rules that keep data correct.
      - A **DBMS** is the software that manages databases. PostgreSQL is one.
      - **Relational** = tables of rows and columns that link to each other by IDs.
      - **SQL** is the declarative language you use to ask for data.
      - A **server** holds the data. **Clients** (psql, pgAdmin, apps, this page) connect and send SQL.
