steps:
  - kind: explain
    title: The shape of a question
    body: |
      Almost every question you ask a database starts like this:

      ```sql
      SELECT column_1, column_2
      FROM some_table;
      ```

      - **`FROM`** says *which table* to look in.
      - **`SELECT`** says *which columns* you want back, separated by commas.

      The answer is always a new table, called a **result set**. The original table is never changed by a SELECT. You're only reading.

      One honest warning: unless you ask for a specific order (Module 4), PostgreSQL may return rows in *any* order. Don't rely on it.

  - kind: try
    title: Pick your columns
    body: |
      Run this to see each city's name and population. Then add `country_id` as a third column.
    sql: |
      SELECT name, population
      FROM cities;

  - kind: try
    title: "The star: every column"
    body: |
      `*` means "all columns, in the table's order". It's great for a first look at a table you don't know.

      In real queries, prefer listing the columns you need. It's clearer, and it won't silently change if someone adds a column later.
    sql: |
      SELECT * FROM attractions;

  - kind: explain
    title: "Aliases: renaming columns with AS"
    body: |
      An **alias** is a new label for a column *in the result*. It doesn't rename anything in the table.

      ```sql
      SELECT name AS attraction, entry_fee AS fee
      FROM attractions;
      ```

      - Aliases make results readable, and they become essential when you calculate new columns.
      - `AS` is optional (`name attraction` works too). That's exactly why a missing comma silently creates an alias, the trap from Module 1. This course always writes `AS`.
      - Need a space or capitals in a label? Use double quotes, because it's a name: `AS "Entry Fee"`.

  - kind: try
    title: Your turn to alias
    body: |
      Show every attraction's `name` labeled **attraction** and its `entry_fee` labeled **fee**.
    sql: |
      SELECT name, entry_fee
      FROM attractions;
    expect: |
      SELECT name AS attraction, entry_fee AS fee
      FROM attractions;

  - kind: explain
    title: Calculated columns
    body: |
      A column in SELECT doesn't have to exist in the table. It can be an **expression**, a calculation PostgreSQL works out for each row:

      | Operator | Meaning | Example |
      |---|---|---|
      | `+` `-` | add, subtract | `nights + 1` |
      | `*` | multiply | `entry_fee * 2` |
      | `/` | divide | `cost / nights` |

      Two things to know:

      1. The calculation happens **only in the result**. The stored data stays the same.
      2. **Whole-number division drops the remainder.** `7 / 2` is `3`, because both are integers. If either side has decimals (`7.0 / 2` or a `numeric` column), you get `3.5`.

  - kind: try
    title: Cost per night
    body: |
      Each trip stop has a total `cost` and a number of `nights`. Dividing them gives the price per night.

      `cost` is a `numeric` (a decimal type), so the division keeps its decimals, a *lot* of them. You'll learn to round in Module 6.
    sql: |
      SELECT trip_stop_id, nights, cost,
             cost / nights AS cost_per_night
      FROM trip_stops;

  - kind: try
    title: Your turn to calculate
    body: |
      Show each attraction's `name` and its entry fee in **cents** (the fee times 100), labeled **fee_cents**.
    sql: |
      SELECT name, entry_fee
      FROM attractions;
    expect: |
      SELECT name, entry_fee * 100 AS fee_cents
      FROM attractions;

  - kind: explain
    title: DISTINCT removes duplicates
    body: |
      `SELECT continent FROM countries;` returns 5 rows: *Asia, Europe, Asia, South America, Europe*. Some repeat.

      `SELECT DISTINCT continent FROM countries;` returns each **different** value once.

      DISTINCT applies to the **whole row** of the result, not just the first column. `SELECT DISTINCT city_id, category …` removes rows where *both* the city *and* the category repeat.

  - kind: try
    title: See DISTINCT work
    body: |
      Run it with and without `DISTINCT` and compare the row counts.
    sql: |
      SELECT DISTINCT continent
      FROM countries;

  - kind: try
    title: Your turn
    body: |
      Which **categories** of attraction does Wanderly list? Return each category once.
    sql: |
      SELECT category
      FROM attractions;
    expect: |
      SELECT DISTINCT category
      FROM attractions;

  - kind: why
    body: |
      Choosing columns, labeling them and calculating new ones is most of what a report *is*. And the calculations you add here often reveal things the raw numbers hide.

  - kind: recap
    body: |
      - `SELECT columns FROM table;` reads data and never changes it. Row order isn't guaranteed yet.
      - `*` = all columns: good for exploring, less good in real queries.
      - `AS` gives a result column a new label (use double quotes for spaces).
      - Expressions like `cost / nights` create calculated columns. Integer ÷ integer drops the remainder.
      - `DISTINCT` removes duplicate **rows** of the result.
