steps:
  - kind: explain
    title: Terminal and zsh
    body: |
      **Terminal** is the Mac app where you type commands instead of clicking. Inside it runs a **shell**, the program that reads what you type and runs it. On macOS the shell is **zsh**.

      You'll use Terminal for one main thing in this course: starting **psql**, the command-line client for PostgreSQL. But a few basic commands make everything easier:

      | Command | Means | Example |
      |---|---|---|
      | `pwd` | **p**rint **w**orking **d**irectory: "where am I?" | `/Users/ada` |
      | `ls` | **l**i**s**t the files here | `Desktop  Documents  Downloads` |
      | `cd folder` | **c**hange **d**irectory: move into a folder | `cd Documents` |
      | `cd ..` | go up one folder | |
      | `cd ~` | go to your home folder | |

      Here's what it looks like for a Mac user called `ada`. The text before `%` is zsh's prompt: it shows the folder you're in (`~` is home).

      ```text
      ada@MacBook ~ % pwd
      /Users/ada
      ada@MacBook ~ % ls
      Desktop    Documents  Downloads  Library    Movies     Music      Pictures   Public
      ada@MacBook ~ % cd Documents
      ada@MacBook Documents % pwd
      /Users/ada/Documents
      ada@MacBook Documents % cd ..
      ada@MacBook ~ % pwd
      /Users/ada
      ```

      Your own folders will differ a little.

  - kind: choice
    title: "Quick check: where am I?"
    body: |
      Ada is in her `Documents` folder. She types:

      ```text
      ada@MacBook Documents % cd ..
      ada@MacBook ~ % pwd
      ```

      What does `pwd` print?
    options:
      - "`/Users/ada`"
      - "`/Users/ada/Documents`"
      - "`Documents`"
      - "`..`"
    answer: 0
    explanation: "`cd ..` goes up one folder, from `/Users/ada/Documents` to `/Users/ada`, her home folder. `pwd` prints the full path of where you are now."

  - kind: explain
    title: File paths
    body: |
      A **path** is the address of a file or folder.

      - **Absolute path**: starts at the very top, `/`. It works from anywhere: `/Users/ada/Documents/sql/setup.sql`
      - **Relative path**: starts from where you are now. If you're in `/Users/ada/Documents`, then `sql/setup.sql` points at the same file.
      - `~` is short for your home folder, so `~/Documents` = `/Users/ada/Documents` for a Mac user called `ada`.

      Tip: dragging a file from Finder into the Terminal window types its full path for you.

      **Example: one file, three ways to name it.** Ada's file is `/Users/ada/Documents/sql/setup.sql`:

      ```text
      ada@MacBook ~ % pwd
      /Users/ada
      ada@MacBook ~ % ls Documents/sql
      setup.sql
      ada@MacBook ~ % ls ~/Documents/sql/setup.sql
      /Users/ada/Documents/sql/setup.sql
      ada@MacBook ~ % ls /Users/ada/Documents/sql/setup.sql
      /Users/ada/Documents/sql/setup.sql
      ```

      `Documents/sql` is relative (it worked because Ada was in her home folder), `~/Documents/...` uses the home shortcut, and `/Users/ada/...` is absolute. All three point at the same file.

  - kind: mac
    title: Find your way around
    body: |
      Open **Terminal** (⌘ + Space, type *Terminal*, press Enter). Run these one at a time and watch how `pwd` changes as you move.
    commands: |
      pwd
      ls
      cd Documents
      pwd
      cd ..
      pwd

  - kind: explain
    title: Server, host, port, connection
    body: |
      To talk to a PostgreSQL server, a client needs to know:

      - **Host**: *which computer* the server is on. `localhost` means "this same computer". A server elsewhere has an address like `db.example.com`.
      - **Port**: *which door* on that computer. A computer runs many services, and each listens on a numbered port. PostgreSQL's standard port is **5432**.
      - **User**: *who you are*. On a Mac set up with Homebrew, it's the same as your Mac username (run `whoami` to see it).
      - **Database**: *which database* to open, like `practice`.

      A **connection** is an open line between one client and the server, logged in as one user, to **one database**. To use a different database you open a new connection.

      **Example.** All four pieces in one psql command (each flag is one piece):

      ```text
      psql -h localhost -p 5432 -U ada -d practice
             └─ host ─┘  └port┘  └user┘  └database┘
      ```

      Because `localhost`, `5432` and your own username are the defaults on a Mac, you can usually leave them out and just type `psql practice`. To reach a server on another computer, you'd change the host: `psql -h db.example.com -d practice`.

  - kind: choice
    title: "Quick check: read a connection"
    body: |
      ```text
      psql -h db.example.com -p 5433 -U liam -d bookstore
      ```

      Which **port** does this connect to?
    options:
      - "5432"
      - "db.example.com"
      - "5433"
      - "bookstore"
    answer: 2
    explanation: "`-p` gives the port: 5433 here, not the usual 5432. `db.example.com` is the host, `liam` the user and `bookstore` the database."

  - kind: explain
    title: Starting psql
    body: |
      **psql** is PostgreSQL's command-line client. On your Mac, the short way to connect is:

      ```bash
      psql practice
      ```

      That fills in the defaults: host `localhost`, port `5432`, and your Mac username as the user. The long way spells them out (with `ada` standing in for your username):

      ```bash
      psql -h localhost -p 5432 -U ada -d practice
      ```

      Once connected, the prompt shows the database you're in:

      ```text
      practice=#
      ```

      `=#` means you're a superuser, allowed to do anything. A regular user sees `=>`.

  - kind: mac
    title: Connect for real
    body: |
      Not set up yet? Follow *Take it to your Mac* (top of the course page) to install PostgreSQL first, or choose **Skip for now**.

      The `practice` database doesn't exist on your Mac until you create it. First download `01_practice_basics.sql` (the same file this page uses) from the course's *Take it to your Mac* page into your Downloads folder. The first two commands run it, which builds `practice` with its three tables.

      Then connect. The prompt should change to `practice=#`. Type `\q` to quit and get back to zsh.

      **Checkpoint:** paste what Terminal showed, including the `practice=#` prompt, into the box below.
    commands: |
      cd ~/Downloads
      psql -d postgres -f 01_practice_basics.sql
      psql practice
      \q
    expect_output:
      - "practice=#"

  - kind: try
    title: "Meta-commands: \\l lists databases"
    body: |
      Inside psql you can type SQL, or **meta-commands**: shortcuts that start with a backslash `\`. They aren't SQL. They're instructions to psql itself, usually "show me what's here". They end at the end of the line and don't need a semicolon.

      `\l` (lowercase L) **l**ists databases. This page has a psql-style console, so run it here.

      In this sandbox you'll only see the course database and PostgreSQL's built-in ones. On your Mac you'll see the databases you have created yourself.
    sql: |
      \l

  - kind: try
    title: "\\c connects, \\dt lists tables"
    body: |
      `\c dbname` **c**onnects to a different database. `\dt` lists the **t**ables in the one you're connected to.

      Add a line with `\dt` below `\c practice` and run both. You should see the 3 practice tables: books, customers and sales.
    sql: |
      \c practice
    expect: |
      \dt

  - kind: try
    title: "\\d describes one table"
    body: |
      `\d table_name` shows a table's columns, each column's type, and its rules.

      Run it, then change `sales` to `customers`. Which columns does a customer have?

      (The step is checked once your changed version has run.)
    sql: |
      \d sales
    expect: |
      \d customers

  - kind: try
    title: "\\dn schemas, \\du users"
    body: |
      - `\dn` lists **schemas**, the folders inside a database that hold tables (Module 3).
      - `\du` lists **users** (PostgreSQL calls them *roles*).
      - `\?` shows help for every meta-command.

      Run them.
    sql: |
      \dn
      \du
      \?

  - kind: explain
    title: Meta-commands for your Mac
    body: |
      A few more that only work in real psql:

      | Command | What it does |
      |---|---|
      | `\x` | Toggles **expanded** display: each column on its own line. Great for wide rows. |
      | `\timing` | Shows how long each query took. |
      | `\i file.sql` | Runs every statement in a **file**. Uses a file path, so `~/Documents/sql/setup.sql` works. |
      | `\q` | **Q**uits psql. |

      <!-- page -->

      Here's `\x` and `\timing` on a real Mac, with one sale from `practice`:

      ```text
      practice=# \x
      Expanded display is on.
      practice=# SELECT book_title, quantity, payment_method FROM sales WHERE sale_id = 1;
      -[ RECORD 1 ]--+--------------------
      book_title     | Pride and Prejudice
      quantity       | 1
      payment_method | card

      practice=# \timing
      Timing is on.
      practice=# SELECT count(*) FROM books;
      -[ RECORD 1 ]
      count | 30

      Time: 3.552 ms
      ```

      Each column now sits on its own line, and every query reports its time (yours will be a different number). Type `\x` again to switch expanded display off.

  - kind: mac
    title: Try them in Terminal
    body: |
      Connect, turn on expanded display and timing, run a query, then quit.

      **Checkpoint:** paste the output into the box below. It should show the expanded records and the timing.
    commands: |
      psql practice
      \x
      \timing
      SELECT * FROM sales LIMIT 2;
      \q
    expect_output:
      - "RECORD 1"
      - "Timing is on"

  - kind: explain
    title: GUI clients, and why psql too
    body: |
      **GUI clients** (apps with windows and menus) include **pgAdmin** (free), plus **DBeaver**, **TablePlus** and **Postico**. They're great for browsing tables and seeing structure at a glance.

      Learn **psql** too, because:

      - it's on every server, even when there's no screen or mouse
      - it's fast once you know a handful of commands
      - it's what docs, tutorials and coworkers will assume you know
      - it runs `.sql` files (`\i`), which is how real projects set up databases

      **Example.** The same question in both kinds of client. In pgAdmin you'd click through *Servers → Databases → practice → Schemas → Tables*, right-click `books` and choose *View/Edit Data*. In psql it's one line:

      ```text
      practice=# SELECT title, price FROM books LIMIT 2;
              title        | price
      ---------------------+-------
       Pride and Prejudice |  9.99
       Emma                |  8.99
      (2 rows)
      ```

      And `\i setup.sql` runs a whole file of SQL in one go, which is how you'll load the course data.

  - kind: choice
    title: "Quick check: why psql?"
    body: "You've set up pgAdmin and like it. Which is a **good reason** to learn psql as well?"
    options:
      - "pgAdmin can't run SQL queries"
      - "psql is on every server, even ones with no screen"
      - "psql shows data as charts"
      - "pgAdmin only works with MySQL"
    answer: 1
    explanation: "Servers often have no screen or mouse, but psql is always there. pgAdmin can run SQL fine; it's just not available everywhere."

  - kind: explain
    title: "Common mistake: the missing semicolon"
    body: |
      SQL statements end with a **semicolon** `;`. Meta-commands don't.

      If you press Enter after SQL *without* a semicolon, psql assumes you're not done. The prompt changes:

      ```text
      practice=# SELECT * FROM sales
      practice-#
      ```

      `=#` became `-#`: *"I'm waiting for the rest."* Nothing is broken. Type `;` and press Enter, and the query runs.

      If you want to throw away what you typed instead, press **Ctrl + C**.

  - kind: choice
    title: "Quick check: the waiting prompt"
    body: |
      You type a query and press Enter. psql shows:

      ```text
      practice=# SELECT title FROM books
      practice-#
      ```

      What should you do?
    options:
      - "Close Terminal: psql has crashed"
      - "Type the whole query again"
      - "Type `\\q`"
      - "Type `;` and press Enter"
    answer: 3
    explanation: "`-#` means psql is waiting for the rest of the statement. A semicolon ends it, and the query runs. (Ctrl + C would throw it away instead.)"

  - kind: explain
    title: "Common mistake: the wrong database"
    body: |
      If psql says

      ```text
      ERROR:  relation "sales" does not exist
      ```

      and you're *sure* the table exists, check the prompt. You're probably connected to the wrong database. `postgres=#` means you're in the default `postgres` database, not `practice`.

      Fix: `\c practice`, then run the query again. The prompt always tells you where you are.

  - kind: try
    title: "Your first line of SQL"
    body: |
      Type this exactly, semicolon included, and run it:

      ```sql
      SELECT count(*) FROM customers;
      ```

      It asks: *how many rows does the `customers` table have?* You'll learn what every word means in the next modules.
    sql: |
      -- Type the query here
    expect: |
      SELECT count(*) FROM customers;
    hint: |
      Copy it letter for letter. The semicolon at the end tells PostgreSQL the command is finished.

  - kind: try
    title: "Your turn to explore"
    body: |
      One of the practice tables has a column called **payment_method**. Use meta-commands to find out which table (`\dt`, then `\d` on each table), then show that column with `SELECT payment_method FROM that_table;` (put the real table name in). Only that last query is checked.
    sql: |
      -- Explore with \dt and \d, then show the column
    expect: |
      SELECT payment_method FROM sales;
    hint: |
      `\d sales`, `\d books` and `\d customers` each list their columns. When you've found it, `SELECT payment_method FROM that_table;`

  - kind: why
    body: |
      Every real database task starts with connecting and looking around. With `psql`, `\l`, `\c`, `\dt` and `\d`, you can open any PostgreSQL database and understand what's inside in under a minute.

  - kind: recap
    body: |
      - Terminal runs **zsh**: `pwd` (where am I), `ls` (list), `cd` (move), `~` (home).
      - A connection needs a **host** (`localhost`), **port** (`5432`), **user** and **database**.
      - `psql practice` connects. The prompt `practice=#` shows where you are.
      - Meta-commands: `\l` databases, `\c` connect, `\dt` tables, `\d name` describe, `\dn` schemas, `\du` users, `\x` expanded, `\timing`, `\i file.sql`, `\?` help, `\q` quit.
      - A prompt of `-#` means psql is waiting for a `;`. "relation does not exist" often means the wrong database.
