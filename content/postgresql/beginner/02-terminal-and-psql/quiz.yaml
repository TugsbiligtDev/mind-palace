pass: 3
questions:
  - type: mcq
    prompt: What is PostgreSQL's standard **port**?
    options:
      - "80"
      - "3306"
      - "5432"
      - "8080"
    answer: 2
    explanation: PostgreSQL listens on port 5432 by default. (3306 is MySQL's, and 80 and 8080 are for websites.)

  - type: fill
    prompt: You're connected to `practice` in psql. Which meta-command lists its tables?
    code: "____"
    answer: \dt
    explanation: "`\\dt` means *describe tables*. `\\l` would list databases instead."

  - type: mcq
    prompt: |
      You type a query and press Enter, and the prompt changes like this:

      ```text
      practice=# SELECT * FROM sales
      practice-#
      ```

      What happened?
    options:
      - The query failed, and psql is showing the error on the next line
      - "psql is waiting for the rest of the statement: there's no semicolon"
      - You were disconnected, so psql opened a new, empty connection
      - You switched to another database, whose name is shown with a dash
    answer: 1
    explanation: "`-#` means psql is still collecting your statement. Type `;` and press Enter to run it."

  - type: mcq
    prompt: "Your prompt says `postgres=#` and `SELECT * FROM sales;` gives *relation \"sales\" does not exist*. What's the likely fix?"
    options:
      - Reinstall PostgreSQL, since the sales table was lost
      - "Run `\\c practice`: you're connected to the wrong database"
      - Put double quotes around "sales" so that PostgreSQL can find the name
      - Run `\dt` first so psql loads the list of tables
    answer: 1
    explanation: The prompt shows you're in the `postgres` database. The sales table lives in `practice`, so connect there with `\c practice`.

  - type: mcq
    prompt: |
      You type this in psql and press Enter:

      `\dt SELECT * FROM books;`

      What happens?
    options:
      - psql lists the tables, then runs the SELECT and shows the books
      - An error, because meta-commands need a semicolon at the end
      - psql reads the SELECT as arguments to `\dt`; the SQL never runs
      - The SELECT runs first, then psql lists the tables below it
    answer: 2
    explanation: A meta-command ends at the **end of the line**. Everything after `\dt` on that line is read as its arguments. Put `\dt` and your SQL on separate lines.
