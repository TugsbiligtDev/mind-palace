steps:
  - kind: explain
    title: Every column has a type
    body: |
      When a table is created, each column gets a **data type**: the kind of value it may hold. You saw them in `\d`: `integer`, `text`, `numeric(6,2)`, `date`, `jsonb`.

      Types matter because they decide:

      - **what's allowed**: you can't store `'hello'` in an `integer` column
      - **what you can do**: you can add numbers and subtract dates, but you can't multiply text
      - **how values sort and compare**: `'10'` sorts before `'9'` as text, but after it as a number

  - kind: explain
    title: Whole numbers and exact decimals
    body: |
      | Type | Holds | Use it for |
      |---|---|---|
      | `integer` | whole numbers up to about ±2.1 billion | counts, IDs, stock |
      | `bigint` | whole numbers up to about ±9.2 quintillion | very large counts |
      | `numeric(p, s)` | **exact** decimals: *p* digits in total, *s* after the point | **money**, anything that must add up exactly |

      `numeric(6,2)` allows up to 6 digits, 2 of them after the point, so the biggest value is `9999.99`. Values are rounded to 2 places when stored, and a value that's too big raises an error instead of being silently changed.

  - kind: info
    title: "🔹 smallint"
    body: |
      `smallint` holds whole numbers from −32,768 to 32,767. It saves a little space, but the savings rarely matter and the low limit bites later. Use `integer` unless you have millions of rows and a column that can truly never grow.

  - kind: explain
    title: Floating point, and why money is never a float
    body: |
      `real` and `double precision` are **floating-point** types. They're fast and can hold huge ranges, but they store most decimals **approximately**, in binary.

      `0.1` can't be stored exactly in binary, any more than ⅓ can be written exactly as a decimal (0.3333…). The tiny errors are invisible one at a time, but they build up in sums and comparisons.

      Floats are fine for measurements like temperatures or distances. For **money**, always use `numeric`.

  - kind: try
    title: See the float error
    body: |
      The same sum, 0.1 + 0.2, computed two ways. `::` means "convert to this type" (more on that below).
    sql: |
      SELECT 0.1::double precision + 0.2::double precision AS float_sum,
             0.1::numeric + 0.2::numeric AS numeric_sum;

  - kind: try
    title: numeric(p, s) keeps its promises
    body: |
      Storing into `numeric(6,2)` rounds to 2 decimal places. Run it.

      Then try `123456.78::numeric(6,2)`. It has 6 digits before the point, but `numeric(6,2)` leaves room for only 4, so PostgreSQL refuses (*numeric field overflow*) rather than silently mangling the value.
    sql: |
      SELECT 28.305::numeric(6,2) AS rounded,
             1234.5::numeric(6,2) AS padded;

  - kind: explain
    title: text and varchar
    body: |
      - **`text`** holds text of any length. It's what the course tables use.
      - **`varchar(n)`** holds text up to *n* characters. Longer values raise an error.

      In PostgreSQL both are stored the same way, and there's **no meaningful performance difference**. Use `text`, and reach for `varchar(n)` only when a maximum length is a real business rule, like a 2-letter country code.

  - kind: explain
    title: "char(n): the one to avoid"
    body: |
      **`char(n)`** is fixed-length text: shorter values are **padded with spaces** to exactly *n* characters. `'Rome'` stored in `char(8)` becomes `'Rome    '`. It's a leftover from older databases and causes surprising comparisons.

      | Type | Length | Verdict |
      |---|---|---|
      | `text` | any | **Use this** |
      | `varchar(n)` | up to *n* | Only when the limit is a real rule |
      | `char(n)` | exactly *n*, padded | Avoid |

  - kind: try
    title: A length limit in action
    body: |
      A 2-letter country code fits `varchar(2)`. Run it.

      Then change `'JP'` to `'JPN'` and run it again. PostgreSQL refuses: *value too long for type character varying(2)*.
    sql: |
      SELECT 'JP'::varchar(2) AS code;

  - kind: explain
    title: boolean, dates, times and intervals
    body: |
      - **`boolean`**: `true`, `false` (or NULL). psql displays them as `t` and `f`.
      - **`date`**: a calendar day, like `'2026-02-01'`.
      - **`timestamp`**: a date **and** clock time, with no time zone. It's just "what the wall clock said".
      - **`timestamptz`** (*timestamp with time zone*): an **exact moment**. PostgreSQL stores it in a single universal time, and shows it in your session's time zone. **Prefer `timestamptz`** for anything that happened, because "14:00" means nothing without knowing *where*. (Time zones get a whole module later, Module 27.)
      - **`interval`**: a length of time, like `'5 days'` or `'4 days 21:00:00'`.

      Arithmetic works the way you'd hope:

      - `date - date` gives a number of **days** (an integer)
      - `date + 7` is a week later
      - `timestamptz - timestamptz` gives an **interval**

  - kind: try
    title: True, false, unknown
    body: |
      Comparisons produce booleans. Run it: `t` means true and `f` means false.

      Look at the `under_8` column: which books cost less than 8?
    sql: |
      SELECT title,
             stock = 0  AS sold_out,
             price < 8  AS under_8
      FROM books;

  - kind: try
    title: Date arithmetic
    body: |
      `birth_date` is a `date`. How many days old was each customer on New Year's Day 2025, and on which date was their 10,000th day?
    sql: |
      SELECT first_name,
             '2025-01-01'::date - birth_date AS days_old,
             birth_date + 10000 AS day_10000
      FROM customers;

  - kind: try
    title: Timestamps and intervals
    body: |
      A parcel from the moment it was ordered to the moment it arrived. The `+01` is the time zone offset: Berlin in February is one hour ahead of UTC (universal time).

      Subtracting two moments gives an **interval**. Try adding `+ interval '1 day'` to the arrival time.
    sql: |
      SELECT '2026-02-06 11:00+01'::timestamptz
           - '2026-02-01 14:00+01'::timestamptz AS delivery_time;

  - kind: explain
    title: "Casting: converting between types"
    body: |
      **Casting** converts a value to another type. PostgreSQL has two spellings:

      ```sql
      '42'::integer              -- PostgreSQL shorthand (most common)
      CAST('42' AS integer)      -- SQL standard, works everywhere
      ```

      You need it when data arrives as the wrong type, typically numbers or dates stored as text. A cast succeeds only if the value makes sense: `'42'::integer` works, and `'forty-two'::integer` is an error.

      A cast in a query doesn't change the stored data. It converts the value for that query only.

  - kind: try
    title: Your turn to cast
    body: |
      Some prices from a supplier's price list arrived as **text**, like `'19.99'`. Convert `'19.99'` to `numeric(6,2)`, multiply it by 3, and label the result **total**.
    sql: |
      SELECT '19.99' AS price_text;
    expect: |
      SELECT '19.99'::numeric(6,2) * 3 AS total;

  - kind: try
    title: When a cast fails
    body: |
      Run this and read the error. PostgreSQL won't guess that "sixty" means 60. The fix is always in the *data*: store or convert it as a real number.
    sql: |
      SELECT 'sixty'::numeric AS price;
    expect_error: true

  - kind: info
    title: "🔹 The money type"
    body: |
      PostgreSQL has a type literally called `money`. **Avoid it.** Its output depends on a server setting (the currency locale), so the same value can print as `$19.99` on one machine and `19,99 €` on another. Use `numeric(12,2)` and keep the currency in its own column if you need one.

  - kind: why
    body: |
      Types are the database's first line of defense: they stop nonsense from being stored, and they decide whether your arithmetic is exact. Choosing `numeric` for money and `timestamptz` for moments avoids two of the most expensive classic bugs.

  - kind: recap
    body: |
      - `integer` / `bigint` for whole numbers. **`numeric(p,s)`** for exact decimals and **all money**.
      - `real` / `double precision` are approximate: fine for measurements, never for money.
      - 🔹 `smallint` is rarely worth it. Use `integer`.
      - Use `text` over `varchar(n)` unless a length limit is a real rule. Avoid `char(n)`: it pads with spaces.
      - `boolean`, `date`, `timestamp`, **`timestamptz`** (an exact moment, preferred), `interval`.
      - `date - date` = days, `timestamptz - timestamptz` = interval.
      - Cast with `value::type` or `CAST(value AS type)`. Invalid values raise an error.
      - 🔹 Avoid the `money` type. Use `numeric`.
