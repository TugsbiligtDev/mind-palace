pass: 3
questions:
  - type: predict
    prompt: What does this return?
    code: |
      SELECT name
      FROM cities
      ORDER BY population DESC
      LIMIT 1;
    options:
      - "Florence"
      - "Tokyo"
      - "Rome"
      - "Ulaanbaatar"
    answer: 1
    explanation: Sorting by population, largest first, puts Tokyo (13,960,000) on top, and `LIMIT 1` keeps only that row.

  - type: mcq
    prompt: "With `ORDER BY email DESC` and no NULLS option, where do rows with a NULL email appear?"
    options:
      - First
      - Last
      - They're left out
      - In a random position
    answer: 0
    explanation: PostgreSQL sorts NULL as larger than any value, so it comes first in descending order. Add `NULLS LAST` to push it to the end.

  - type: fill
    prompt: Return the single **most expensive** attraction.
    code: |
      SELECT name, entry_fee FROM attractions ORDER BY entry_fee ____ LIMIT 1;
    answer: DESC
    accept: ["desc"]
    explanation: "`DESC` puts the largest fee first, and `LIMIT 1` keeps just that row."

  - type: predict
    prompt: The countries sorted A→Z are France, Italy, Japan, Mongolia, Peru. What does this return?
    code: |
      SELECT name
      FROM countries
      ORDER BY name
      LIMIT 2 OFFSET 1;
    options:
      - "France\nItaly"
      - "Italy\nJapan"
      - "Japan\nMongolia"
      - "Italy"
    answer: 1
    explanation: "`OFFSET 1` skips France, then `LIMIT 2` returns the next two: Italy and Japan."

  - type: mcq
    prompt: Why should LIMIT almost always come with ORDER BY?
    options:
      - LIMIT is an error without ORDER BY
      - Without an order, which rows you get isn't guaranteed
      - ORDER BY makes LIMIT faster
      - It doesn't matter
    answer: 1
    explanation: LIMIT takes the first *n* rows of the result, but without ORDER BY there's no defined "first". You'd get *some* rows, not necessarily the ones you meant.
