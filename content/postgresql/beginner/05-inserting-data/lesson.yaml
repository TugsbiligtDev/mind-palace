steps:
  - kind: explain
    title: From reading to writing
    body: |
      So far you've created empty tables. **`INSERT`** puts rows into them.

      **Here, in the browser,** every run starts from a fresh copy of the `practice` data, so experiment freely.

      **On your Mac,** a change is **permanent the moment it runs**. psql has no undo button. (Module 30 covers transactions, the safety net.)

      **Example.** Inkwell has 20 customers. One INSERT, and there are 21:

      ```sql
      SELECT count(*) FROM customers;           -- 20

      INSERT INTO customers (customer_id, first_name, last_name, city, country)
      VALUES (21, 'Nina', 'Park', 'Seoul', 'South Korea');

      SELECT count(*) FROM customers;           -- 21
      ```

      The next pages explain each part of that INSERT.

  - kind: try
    title: "Try it: 20, then 21"
    body: |
      Run it: the first count says 20, the second 21. Run it again: still 20, then 21, because each run starts from a fresh copy. On your Mac, the second run would make 22.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT count(*) FROM customers;

      INSERT INTO customers (customer_id, first_name, last_name, city, country)
      VALUES (21, 'Nina', 'Park', 'Seoul', 'South Korea');

      SELECT count(*) FROM customers;

  - kind: explain
    title: INSERT … VALUES
    body: |
      ```sql
      INSERT INTO customers (customer_id, first_name, last_name, city)
      VALUES (21, 'Nina', 'Park', 'Seoul');
      ```

      - After the table name, list the **columns** you're filling.
      - After `VALUES`, give the **values** in the **same order**.
      - Text and dates go in **single quotes**. Numbers don't.

      psql replies `INSERT 0 1`, meaning one row was added. (The `0` is a leftover from old versions and can be ignored.)

  - kind: try
    title: Insert a customer
    body: |
      Run it. The SELECT underneath shows Nina's new row. Look at the columns you didn't fill in, like `email` and `joined_at`: they're all NULL (empty/unknown).
    sql: |
      INSERT INTO customers (customer_id, first_name, last_name, city)
      VALUES (21, 'Nina', 'Park', 'Seoul');

      SELECT * FROM customers WHERE customer_id = 21;

  - kind: explain
    title: Columns that fill themselves
    body: |
      The `practice` tables are as simple as tables get. Any column you leave out of an INSERT becomes **NULL**, and nothing picks an ID for you: you typed `21` yourself. (Nothing stops two customers from both being number 21, either. Module 11 fixes that.)

      Better-designed tables can fill columns in for you:

      - **Generated IDs.** A column declared *generated always as identity* gets the next number automatically (Module 11 explains how). You're not even allowed to type one.
      - **Defaults.** A column can have a **default value** used when you leave it out, like `DEFAULT 'wanted'` or `DEFAULT current_date` (today).
      - **Anything else** you leave out becomes **NULL**, unless the column forbids it.

      You can also ask for the default explicitly with the keyword **`DEFAULT`** in the values list.

  - kind: try
    title: Let the defaults work
    body: |
      This small wishlist table has a generated ID and a default status. The INSERT gives only the title. Run it and look at the new row's `wish_id` and `status`.

      Then leave Dune's INSERT as it is, and add a second INSERT below it (before the SELECT) for **Circe** with the status **bought**. Which columns do you need to list this time? Dune should still say `wanted`, and Circe `bought`. (The step is checked once your changed version has run.)
    sql: |
      CREATE TABLE wishlist (
          wish_id  integer GENERATED ALWAYS AS IDENTITY,
          title    text,
          status   text DEFAULT 'wanted'
      );

      INSERT INTO wishlist (title)
      VALUES ('Dune');

      SELECT * FROM wishlist;
    expect: |
      CREATE TABLE wishlist (
          wish_id  integer GENERATED ALWAYS AS IDENTITY,
          title    text,
          status   text DEFAULT 'wanted'
      );

      INSERT INTO wishlist (title)
      VALUES ('Dune');

      INSERT INTO wishlist (title, status)
      VALUES ('Circe', 'bought');

      SELECT * FROM wishlist;
    hint: |
      List both `title` and `status` in the column list, and give two values. `wish_id` still fills itself.

  - kind: explain
    title: See what you wrote with RETURNING
    body: |
      Add **`RETURNING`** to the end of an INSERT to get the new rows back, including any values PostgreSQL filled in for you:

      ```sql
      INSERT INTO books (book_id, title, price)
      VALUES (31, 'Circe', 14.99)
      RETURNING book_id, title;
      ```

      Instead of `INSERT 0 1`, you get the new row back:

      | book_id | title |
      |---|---|
      | 31 | Circe |

      This is how apps find out the ID of something they just created. `RETURNING *` returns every column.

  - kind: try
    title: "Try it: RETURNING"
    body: |
      This adds *Piranesi* at 12.50 and returns three of its columns. Run it.

      Then change the last line to `RETURNING *` and run again: every column comes back, and the ones you didn't fill in show as NULL.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      INSERT INTO books (book_id, title, price)
      VALUES (34, 'Piranesi', 12.50)
      RETURNING book_id, title, price;

  - kind: try
    title: Your turn with RETURNING
    body: |
      Add book **31**, **Circe** by **Madeline Miller** (fill in `book_id`, `title` and `author_name`), and return its `book_id` and `title`.
    sql: |
      INSERT INTO books (book_id, title, author_name)
      VALUES (31, 'Circe', 'Madeline Miller');
    expect: |
      INSERT INTO books (book_id, title, author_name)
      VALUES (31, 'Circe', 'Madeline Miller')
      RETURNING book_id, title;

  - kind: explain
    title: Many rows at once
    body: |
      One INSERT can add several rows. Separate the value lists with commas:

      ```sql
      INSERT INTO books (book_id, title, author_name)
      VALUES (31, 'Circe',     'Madeline Miller'),
             (32, 'Piranesi',  'Susanna Clarke'),
             (33, 'Beloved',   'Toni Morrison');
      ```

      psql replies `INSERT 0 3`: three rows added. It's faster than one INSERT per row, and it's all-or-nothing: if one row is bad, **none** are added.

  - kind: try
    title: Your turn for a multi-row insert
    body: |
      In **one** INSERT, add two customers: number **21**, **Nina Park**, and number **22**, **Omar Reyes** (fill in `customer_id`, `first_name` and `last_name`). Return their `customer_id` and `first_name`.
    sql: |
      INSERT INTO customers (customer_id, first_name, last_name)
      VALUES (21, 'Nina', 'Park')
      RETURNING customer_id, first_name;
    expect: |
      INSERT INTO customers (customer_id, first_name, last_name)
      VALUES (21, 'Nina', 'Park'), (22, 'Omar', 'Reyes')
      RETURNING customer_id, first_name;

  - kind: try
    title: All or nothing
    body: |
      The second row's price isn't a number. Run it and read the error. The whole statement failed, so the first row, which was fine, wasn't saved either.
    sql: |
      INSERT INTO books (book_id, title, price)
      VALUES (31, 'Circe',    14.99),
             (32, 'Piranesi', 'free');
    expect_error: true

  - kind: explain
    title: Why list the columns?
    body: |
      You *can* skip the column list and give a value for every column in table order:

      ```sql
      INSERT INTO customers
      VALUES (21, 'Nina', 'Park', NULL, NULL, 'Seoul', 'South Korea', NULL, NULL, 0);
      ```

      Don't. You have to know all ten columns and their order, it breaks silently when someone adds or reorders columns, and nobody reading it can tell which value goes where. **Always name the columns.**

      **The better way.** Name only the columns you're filling. The rest get NULL (or their default):

      ```sql
      INSERT INTO customers (customer_id, first_name, last_name, city, country)
      VALUES (21, 'Nina', 'Park', 'Seoul', 'South Korea')
      RETURNING customer_id, first_name, city, country;
      ```

      | customer_id | first_name | city | country |
      |---|---|---|---|
      | 21 | Nina | Seoul | South Korea |

      And if the list and the values don't match up, PostgreSQL tells you at once:

      ```sql
      INSERT INTO customers (first_name, last_name, email, city)
      VALUES ('Nina', 'Park', 'Seoul');
      ```

      ```text
      ERROR:  INSERT has more target columns than expressions
      ```

  - kind: try
    title: "Try it: name the columns"
    body: |
      Run it: the first INSERT works, the second is refused (4 columns, 3 values). Fix the second by removing `email` from its column list.

      To continue, make it run without an error: the change above does it.
    sql: |
      INSERT INTO customers (customer_id, first_name, last_name, city, country)
      VALUES (21, 'Nina', 'Park', 'Seoul', 'South Korea')
      RETURNING customer_id, first_name, city, country;

      INSERT INTO customers (first_name, last_name, email, city)
      VALUES ('Nina', 'Park', 'Seoul');
    broken_starter: true

  - kind: explain
    title: Quotes, and a quote inside a quote
    body: |
      - **Single quotes** `'…'` are **values**: `'Circe'`, `'2026-10-02'`.
      - **Double quotes** `"…"` are **names** of tables and columns. `VALUES ("Circe")` is an error: *column "Circe" does not exist*.

      What if the text itself contains an apostrophe, like **O'Brien**? The quote would end the text early. Write the apostrophe **twice**:

      ```sql
      VALUES ('Liam O''Brien')
      ```

      Two single quotes in a row inside text mean one real apostrophe. It's *not* a double-quote character.

      ```sql
      SELECT 'Inkwell''s shelf' AS label;
      ```

      returns one apostrophe, not two:

      | label |
      |---|
      | Inkwell's shelf |

  - kind: try
    title: Fix the apostrophe
    body: |
      This INSERT breaks because the apostrophe in *O'Brien* ends the text. Run it, read the error, then fix it by doubling the apostrophe.
    sql: |
      INSERT INTO customers (customer_id, first_name, last_name, email)
      VALUES (21, 'Liam', 'O'Brien', 'liam.obrien@example.com')
      RETURNING first_name, last_name;
    broken_starter: true
    expect: |
      INSERT INTO customers (customer_id, first_name, last_name, email)
      VALUES (21, 'Liam', 'O''Brien', 'liam.obrien@example.com')
      RETURNING first_name, last_name;

  - kind: why
    body: |
      Every sign-up, order and message in every app is an INSERT. Naming your columns, trusting defaults and IDs to fill themselves, and reading back what you wrote are the habits that keep new data correct from its first second.

  - kind: recap
    body: |
      - `INSERT INTO t (cols) VALUES (…);`, with values in the same order as the columns.
      - Leave out generated IDs and default columns. Anything else left out becomes NULL. `DEFAULT` asks for the default explicitly.
      - `RETURNING cols` (or `*`) shows the rows you just wrote.
      - Many rows: `VALUES (…), (…), (…)`. One bad row cancels the whole statement.
      - Always list the columns.
      - `'single quotes'` = values, `"double quotes"` = names. An apostrophe inside text is written `''`.
