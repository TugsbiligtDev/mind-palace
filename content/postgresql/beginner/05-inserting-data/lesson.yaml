steps:
  - kind: explain
    title: From reading to writing
    body: |
      So far you've created empty tables. **`INSERT`** puts rows into them.

      **Here, in the browser,** every run starts from a fresh copy of Wanderly's data, so experiment freely.

      **On your Mac,** a change is **permanent the moment it runs**. psql has no undo button. (Module 30 covers transactions, the safety net.)

  - kind: explain
    title: INSERT … VALUES
    body: |
      ```sql
      INSERT INTO countries (name, continent)
      VALUES ('Egypt', 'Africa');
      ```

      - After the table name, list the **columns** you're filling.
      - After `VALUES`, give the **values** in the **same order**.
      - Text and dates go in **single quotes**. Numbers don't.

      psql replies `INSERT 0 1`, meaning one row was added. (The `0` is a leftover from old versions and can be ignored.)

  - kind: try
    title: Insert a country
    body: |
      Run it. The SELECT underneath shows Egypt at the end of the table, with a `country_id` you never typed.
    sql: |
      INSERT INTO countries (name, continent)
      VALUES ('Egypt', 'Africa');

      SELECT * FROM countries;

  - kind: explain
    title: Columns that fill themselves
    body: |
      You can leave a column out of the list when it fills itself:

      - **Generated IDs.** `country_id` is *generated always as identity*: PostgreSQL assigns the next number (Module 11 explains how). You're not even allowed to type one.
      - **Defaults.** A column can have a **default value** used when you leave it out. In `trips`, `status` defaults to `'planned'`. In `travelers`, `signup_date` defaults to today.
      - **Anything else** you leave out becomes **NULL** (empty/unknown), unless the column forbids it.

      You can also ask for the default explicitly with the keyword **`DEFAULT`** in the values list.

  - kind: try
    title: Let the defaults work
    body: |
      This new trip gives no `status`. Run it and look at the new row's status.

      Then change the INSERT to say `'completed'` for the status column and run it again.
    sql: |
      INSERT INTO trips (traveler_id, trip_name, start_date)
      VALUES (3, 'Kyoto Weekend', '2026-10-02');

      SELECT trip_name, start_date, status
      FROM trips
      WHERE trip_name = 'Kyoto Weekend';

  - kind: explain
    title: See what you wrote with RETURNING
    body: |
      Add **`RETURNING`** to the end of an INSERT to get the new rows back, including the values PostgreSQL filled in for you:

      ```sql
      INSERT INTO countries (name, continent)
      VALUES ('Egypt', 'Africa')
      RETURNING country_id, name;
      ```

      This is how apps find out the ID of something they just created. `RETURNING *` returns every column.

  - kind: try
    title: Your turn with RETURNING
    body: |
      Add the country **Chile** in **South America**, and return its `country_id` and `name`.
    sql: |
      INSERT INTO countries (name, continent)
      VALUES ('Chile', 'South America');
    expect: |
      INSERT INTO countries (name, continent)
      VALUES ('Chile', 'South America')
      RETURNING country_id, name;

  - kind: explain
    title: Many rows at once
    body: |
      One INSERT can add several rows. Separate the value lists with commas:

      ```sql
      INSERT INTO cities (name, country_id, population)
      VALUES ('Venice', 5, 250000),
             ('Milan',  5, 1370000),
             ('Osaka',  1, 2750000);
      ```

      It's faster than one INSERT per row, and it's all-or-nothing: if one row is bad, **none** are added.

  - kind: try
    title: Your turn for a multi-row insert
    body: |
      Italy is `country_id` **5**. In **one** INSERT, add two Italian cities, **Venice** (population 250000) and **Milan** (population 1370000), and return their `city_id` and `name`.
    sql: |
      INSERT INTO cities (name, country_id, population)
      VALUES ('Venice', 5, 250000)
      RETURNING city_id, name;
    expect: |
      INSERT INTO cities (name, country_id, population)
      VALUES ('Venice', 5, 250000), ('Milan', 5, 1370000)
      RETURNING city_id, name;

  - kind: try
    title: All or nothing
    body: |
      The second row breaks a rule (a rating must be 1 to 5). Run it and read the error. The whole statement failed, so the first row, which was fine, wasn't saved either.
    sql: |
      INSERT INTO reviews (attraction_id, traveler_id, rating)
      VALUES (9, 5, 4),
             (9, 6, 9);
    expect_error: true

  - kind: explain
    title: Why list the columns?
    body: |
      You *can* skip the column list and give a value for every column in table order:

      ```sql
      INSERT INTO countries VALUES (DEFAULT, 'Egypt', 'Africa');
      ```

      Don't. It breaks silently when someone adds or reorders columns, and nobody reading it can tell which value goes where. **Always name the columns.**

  - kind: explain
    title: Quotes, and a quote inside a quote
    body: |
      - **Single quotes** `'…'` are **values**: `'Egypt'`, `'2026-10-02'`.
      - **Double quotes** `"…"` are **names** of tables and columns. `VALUES ("Egypt")` is an error: *column "Egypt" does not exist*.

      What if the text itself contains an apostrophe, like **O'Brien**? The quote would end the text early. Write the apostrophe **twice**:

      ```sql
      VALUES ('Liam O''Brien')
      ```

      Two single quotes in a row inside text mean one real apostrophe. It's *not* a double-quote character.

  - kind: try
    title: Fix the apostrophe
    body: |
      This INSERT breaks because the apostrophe in *O'Brien* ends the text. Run it, read the error, then fix it by doubling the apostrophe.
    sql: |
      INSERT INTO travelers (full_name, email)
      VALUES ('Liam O'Brien', 'liam@example.com')
      RETURNING full_name;
    broken_starter: true
    expect: |
      INSERT INTO travelers (full_name, email)
      VALUES ('Liam O''Brien', 'liam@example.com')
      RETURNING full_name;

  - kind: why
    body: |
      Every sign-up, order and message in every app is an INSERT. Naming your columns, trusting defaults and IDs to fill themselves, and reading back what you wrote are the habits that keep new data correct from its first second.

  - kind: recap
    body: |
      - `INSERT INTO t (cols) VALUES (…);`, with values in the same order as the columns.
      - Leave out generated IDs and default columns. Anything else left out becomes NULL. `DEFAULT` asks for the default explicitly.
      - `RETURNING cols` (or `*`) shows the rows you just wrote.
      - Many rows: `VALUES (…), (…), (…)`. One bad row cancels the whole statement.
      - Always list the columns.
      - `'single quotes'` = values, `"double quotes"` = names. An apostrophe inside text is written `''`.
