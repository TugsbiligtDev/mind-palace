pass: 3
questions:
  - type: fill
    prompt: Insert a book and get back the row you just wrote.
    code: |
      INSERT INTO books (book_id, title) VALUES (31, 'Circe') ____ book_id, title;
    answer: RETURNING
    accept: ["returning"]
    explanation: "`RETURNING` shows the rows you just inserted, including any values PostgreSQL filled in, like a generated ID."

  - type: predict
    prompt: What does the INSERT return?
    code: |
      CREATE TABLE wishlist (title text, status text DEFAULT 'wanted');
      INSERT INTO wishlist (title)
      VALUES ('Dune')
      RETURNING status;
    options:
      - "NULL"
      - "wanted"
      - "Dune"
      - An error, because status is missing
    answer: 1
    explanation: A column left out of the INSERT gets its default value. For `status` that's `'wanted'`.

  - type: mcq
    prompt: "What's wrong with `INSERT INTO books (title) VALUES (\"Circe\");`?"
    options:
      - Nothing
      - Double quotes mean names, so PostgreSQL looks for a column called Circe. Values need single quotes.
      - The column list is in the wrong order
      - INSERT can't add text
    answer: 1
    explanation: "Double quotes make identifiers (names). Text values need single quotes: `'Circe'`."

  - type: fill
    prompt: Complete the text so the stored name is **D'Arcy**.
    code: |
      SELECT ____ AS name;
    answer: "'D''Arcy'"
    explanation: "Inside single-quoted text, two apostrophes in a row stand for one real apostrophe."

  - type: mcq
    prompt: One INSERT adds three rows, and the third breaks a CHECK rule. What's saved?
    options:
      - The first two rows
      - Only the third row
      - Nothing. The whole statement fails
      - All three, with the bad value set to NULL
    answer: 2
    explanation: A statement is all-or-nothing. If any row fails, none of them are saved.
