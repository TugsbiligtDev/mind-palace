steps:
  - kind: explain
    title: What a function is
    body: |
      A **function** takes some input values (its *arguments*, in parentheses) and returns a value:

      ```sql
      upper('rome')          -- 'ROME'
      round(136.6667, 2)     -- 136.67
      ```

      Used in a SELECT, a function runs **once per row**, just like the arithmetic in Module 2. Functions can be nested, with the inner one running first: `upper(trim('  rome '))` gives `'ROME'`.

  - kind: explain
    title: Text functions
    body: |
      | Function | Does | Example → result |
      |---|---|---|
      | `a \|\| b` | joins text | `'Hotel' \|\| ' ' \|\| 'Aurelia'` → `Hotel Aurelia` |
      | `concat(a, b, …)` | joins text, **skipping NULLs** | `concat('A', NULL, 'B')` → `AB` |
      | `upper(t)` / `lower(t)` | changes case | `upper('rome')` → `ROME` |
      | `trim(t)` | removes spaces at both ends | `trim('  hi ')` → `hi` |
      | `split_part(t, sep, n)` | the *n*-th piece of `t`, split on `sep` | `split_part('a-b-c', '-', 2)` → `b` |
      | `substring(t, start, len)` | part of the text | `substring('Wanderly', 1, 6)` → `Wander` |

      Watch out for one thing: **`||` with a NULL gives NULL.** Anything joined with "unknown" is unknown. `concat()` treats NULL as empty text instead.

  - kind: try
    title: Slice and dice names
    body: |
      Run it. Then add `lower(full_name)` as another column.
    sql: |
      SELECT full_name,
             upper(full_name) AS shouted,
             split_part(full_name, ' ', 1) AS first_name,
             substring(full_name, 1, 3) AS first_three
      FROM travelers;

  - kind: try
    title: "|| vs concat() with a NULL"
    body: |
      One traveler has no email. Look at their row in each column.
    sql: |
      SELECT full_name || ' <' || email || '>' AS with_pipes,
             concat(full_name, ' <', email, '>') AS with_concat
      FROM travelers;

  - kind: try
    title: Your turn to build text
    body: |
      For every country, build a single column labeled **label** that looks like `JAPAN - Asia`: the name in **uppercase**, then ` - `, then the continent as stored.
    sql: |
      SELECT name, continent
      FROM countries;
    expect: |
      SELECT upper(name) || ' - ' || continent AS label
      FROM countries;

  - kind: explain
    title: Number functions
    body: |
      | Function | Does | Example → result |
      |---|---|---|
      | `round(x, n)` | rounds to *n* decimal places | `round(136.666, 2)` → `136.67` |
      | `round(x)` | rounds to a whole number | `round(2.5)` → `3` |
      | `ceil(x)` / `floor(x)` | rounds up / down | `ceil(2.1)` → `3` |
      | `abs(x)` | removes the minus sign | `abs(-5)` → `5` |

      Rounding for **display** is fine. Keep the full precision in stored data, and round at the end.

  - kind: try
    title: Your turn to round
    body: |
      Return each stop's `trip_stop_id` and its cost per night **rounded to 2 decimal places**, labeled **per_night**. (Remember the long decimals from Module 2.)
    sql: |
      SELECT trip_stop_id, cost / nights AS per_night
      FROM trip_stops;
    expect: |
      SELECT trip_stop_id, round(cost / nights, 2) AS per_night
      FROM trip_stops;

  - kind: explain
    title: Date and time functions
    body: |
      | Function | Does |
      |---|---|
      | `now()` | the current moment (a `timestamptz`) |
      | `current_date` | today's date |
      | `age(later, earlier)` | the gap as years/months/days, like `9 days` or `1 year 2 mons` |
      | `date_trunc('month', x)` | cuts a timestamp down to the start of its month (or `'year'`, `'day'`, `'hour'`…) |
      | `EXTRACT(field FROM x)` | pulls out one part as a number: `YEAR`, `MONTH`, `DAY`, `DOW` (day of week)… |

      `date_trunc` is how you group things "per month" later (Module 7). `EXTRACT` is how you ask "which year?" or "which weekday?".

  - kind: try
    title: Take dates apart
    body: |
      `date_trunc` returns a timestamp, so `::date` casts it back to a plain date for readability.
    sql: |
      SELECT trip_name, start_date,
             EXTRACT(MONTH FROM start_date) AS month_no,
             date_trunc('month', start_date)::date AS month_start,
             age(end_date, start_date) AS trip_length
      FROM trips;

  - kind: try
    title: Your turn with EXTRACT
    body: |
      Return the `trip_name` of every trip that **started in 2025**. Use `EXTRACT`.
    sql: |
      SELECT trip_name, start_date
      FROM trips;
    expect: |
      SELECT trip_name
      FROM trips
      WHERE EXTRACT(YEAR FROM start_date) = 2025;

  - kind: explain
    title: COALESCE, NULLIF and CASE
    body: |
      **`COALESCE(a, b, …)`** returns the first argument that **isn't NULL**. It's the standard way to show a default: `COALESCE(email, 'no email')`.

      **`NULLIF(a, b)`** returns NULL if `a` equals `b`, and otherwise returns `a`. Its classic use is avoiding division by zero: `total / NULLIF(nights, 0)` gives NULL instead of an error.

      **`CASE`** is SQL's if/else:

      ```sql
      CASE
        WHEN entry_fee = 0  THEN 'free'
        WHEN entry_fee < 25 THEN 'budget'
        ELSE 'premium'
      END
      ```

      PostgreSQL checks the `WHEN`s **top to bottom** and uses the **first** one that's true. With no `ELSE`, unmatched rows get NULL.

  - kind: try
    title: A default for missing values
    body: |
      Run it, then try `NULLIF(email, 'erik@example.com')` as another column and see what happens to Erik.
    sql: |
      SELECT full_name,
             COALESCE(email, 'no email on file') AS contact
      FROM travelers;

  - kind: try
    title: Your turn with CASE
    body: |
      Return each attraction's `name` and a **price_band**:

      - `'free'` when the fee is 0
      - `'budget'` when it's under 25
      - `'premium'` otherwise
    sql: |
      SELECT name, entry_fee
      FROM attractions;
    expect: |
      SELECT name,
             CASE
               WHEN entry_fee = 0 THEN 'free'
               WHEN entry_fee < 25 THEN 'budget'
               ELSE 'premium'
             END AS price_band
      FROM attractions;

  - kind: why
    body: |
      Real data is messy: stray spaces, inconsistent capitals, missing values, dates you need to bucket. Functions are how you clean it and shape it into answers inside the query, without changing the stored data.

  - kind: recap
    body: |
      - Text: `||` (NULL poisons it), `concat()` (skips NULL), `upper`/`lower`, `trim`, `split_part`, `substring`.
      - Numbers: `round(x, n)`, `ceil`, `floor`, `abs`. Round for display, at the end.
      - Dates: `now()`, `current_date`, `age()`, `date_trunc()`, `EXTRACT(… FROM …)`.
      - `COALESCE` = first non-NULL, `NULLIF` = "treat this value as NULL".
      - `CASE WHEN … THEN … ELSE … END`: the first true branch wins.
