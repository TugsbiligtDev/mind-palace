steps:
  - kind: explain
    title: The shape of a question
    body: |
      Almost every question you ask a database starts like this:

      ```sql
      SELECT column_1, column_2
      FROM some_table;
      ```

      - **`FROM`** says *which table* to look in.
      - **`SELECT`** says *which columns* you want back, separated by commas.

      The answer is always a new table, called a **result set**. A SELECT never changes the stored data. You're only reading.

  - kind: try
    title: Pick your columns
    body: |
      Run this to see each book's title and price. Then add `genre` as a third column.
    sql: |
      SELECT title, price
      FROM books;

  - kind: try
    title: "The star: every column"
    body: |
      `*` means "all columns, in the table's order". It's great for a first look at a table you don't know.

      In real queries, prefer naming the columns you need. It's clearer, it sends less data, and it won't silently change when someone adds a column later.
    sql: |
      SELECT * FROM customers;

  - kind: explain
    title: WHERE keeps some rows
    body: |
      `SELECT` chooses **columns**. `WHERE` chooses **rows**.

      | Operator | Meaning |
      |---|---|
      | `=` | equal to |
      | `<>` or `!=` | not equal to |
      | `<` `>` | less than, greater than |
      | `<=` `>=` | less or equal, greater or equal |

      ```sql
      SELECT sale_id, payment_method
      FROM sales
      WHERE payment_method = 'card';
      ```

      PostgreSQL checks the condition against **each row**. Rows where it's true are kept. Text and dates go in single quotes, and text comparisons are **exact**: `'Card'` would not match `'card'`.

      <!-- page -->

      Two examples on the `practice` data. Books with fewer than 5 copies in stock:

      ```sql
      SELECT title, stock
      FROM books
      WHERE stock < 5;
      ```

      returns:

      | title | stock |
      |---|---|
      | Foundation | 0 |
      | It | 4 |
      | Wuthering Heights | 0 |
      | Neuromancer | 3 |
      | The Silent Garden | 0 |

      Customers who live in the UK:

      ```sql
      SELECT first_name, city
      FROM customers
      WHERE country = 'UK';
      ```

      returns:

      | first_name | city |
      |---|---|
      | Liam | London |
      | Olivia | Manchester |
      | Zoe | London |

  - kind: try
    title: "Try it: WHERE"
    body: |
      Both examples are here. Run them and compare with the tables you just saw.

      Then play: change `< 5` to `>= 30`, or `'UK'` to `'USA'`. Try `'uk'` in lowercase too: no rows, because text comparisons are exact.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT title, stock
      FROM books
      WHERE stock < 5;

      SELECT first_name, city
      FROM customers
      WHERE country = 'UK';

  - kind: try
    title: Your turn to filter
    body: |
      Show the `title` and `price` of every book that costs **more than 18**.
    sql: |
      SELECT title, price
      FROM books;
    expect: |
      SELECT title, price
      FROM books
      WHERE price > 18;

  - kind: explain
    title: AND, OR, NOT, and who goes first
    body: |
      Combine conditions:

      - `A AND B`: both must be true
      - `A OR B`: at least one must be true
      - `NOT A`: flips true and false

      ```sql
      SELECT title, genre
      FROM books
      WHERE author_name = 'Stephen King' AND NOT title = 'It';
      ```

      Inkwell has two Stephen King books. This keeps the one that isn't *It*:

      | title | genre |
      |---|---|
      | The Shining | Horror |

      <!-- page -->

      **`AND` is evaluated before `OR`**, the way × comes before + in maths. So

      ```sql
      WHERE genre = 'Mystery' OR genre = 'Horror' AND price > 12
      ```

      really means *mystery* **or** *(horror costing over 12)*. Probably not what you meant.

      **Rule: when you mix AND and OR, add parentheses.** They cost nothing and remove all doubt.

  - kind: try
    title: See precedence change the answer
    body: |
      This query has no parentheses. Run it: you get 6 rows, including four mysteries that all cost under 12.

      Now wrap the two genre checks in parentheses, `(genre = 'Mystery' OR genre = 'Horror') AND price > 12`, and run it again. Only 2 rows are left, both over 12.
    sql: |
      SELECT title, genre, price
      FROM books
      WHERE genre = 'Mystery' OR genre = 'Horror' AND price > 12;

  - kind: try
    title: Your turn to combine
    body: |
      Find the `title` and `price` of every **Fantasy** book that costs **less than 13**.
    sql: |
      SELECT title, price
      FROM books;
    expect: |
      SELECT title, price
      FROM books
      WHERE genre = 'Fantasy' AND price < 13;

  - kind: explain
    title: IN, BETWEEN, LIKE and ILIKE
    body: |
      Shortcuts for common filters:

      - **`IN (…)`**: matches any value in a list. `genre IN ('Classic', 'Horror')` is short for `genre = 'Classic' OR genre = 'Horror'`.
      - **`BETWEEN a AND b`**: a range, **including both ends**. `stock BETWEEN 10 AND 12` means 10, 11 or 12.
      - **`LIKE`**: text pattern matching. `%` means "any number of characters" and `_` means "exactly one character". `title LIKE 'P%'` = titles starting with capital P.
      - **`ILIKE`**: the same, but **ignores upper/lower case**. It's PostgreSQL's case-insensitive LIKE.

      Put `NOT` in front of any of them: `NOT IN`, `NOT BETWEEN`, `NOT LIKE`.

      <!-- page -->

      **IN**: customers in any of three countries.

      ```sql
      SELECT first_name, country
      FROM customers
      WHERE country IN ('Spain', 'Italy', 'France');
      ```

      | first_name | country |
      |---|---|
      | Noah | Spain |
      | Sophia | Italy |
      | Chloe | France |

      **LIKE with `_`**: one character, then `une`.

      ```sql
      SELECT title FROM books WHERE title LIKE '_une';
      ```

      | title |
      |---|
      | Dune |

      <!-- page -->

      **LIKE vs. ILIKE**: titles containing *habits*. With `LIKE`, the small `h` must match exactly, so nothing comes back (both titles spell it *Habits*). `ILIKE` ignores case:

      ```sql
      SELECT title FROM books WHERE title LIKE '%habits%';
      ```

      returns **no rows** (0 rows).

      ```sql
      SELECT title FROM books WHERE title ILIKE '%habits%';
      ```

      | title |
      |---|
      | Atomic Habits |
      | The 7 Habits of Highly Effective People |

      The `%` on both sides means "anything may come before *and* after".

  - kind: try
    title: A range of years
    body: |
      Books first published between 1900 and 1950, inclusive. Change the range and watch rows come and go.
    sql: |
      SELECT title, published_year
      FROM books
      WHERE published_year BETWEEN 1900 AND 1950;

  - kind: try
    title: "Try it: IN, LIKE and ILIKE"
    body: |
      The three examples from before. Run them, then tweak:

      - add `'Japan'` to the IN list
      - change `'_une'` to `'D%'` (titles starting with D)
      - change the ILIKE pattern to `'%the%'`: notice it finds *The* at the start and *the* in the middle

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT first_name, country
      FROM customers
      WHERE country IN ('Spain', 'Italy', 'France');

      SELECT title FROM books WHERE title LIKE '_une';

      SELECT title FROM books WHERE title ILIKE '%habits%';

  - kind: try
    title: Your turn with IN
    body: |
      Return the `title` of every book in **either** the Classic or the Horror genre, using `IN`.
    sql: |
      SELECT title
      FROM books;
    expect: |
      SELECT title
      FROM books
      WHERE genre IN ('Classic', 'Horror');

  - kind: try
    title: Your turn with ILIKE
    body: |
      Find the `title` and `author_name` of every book whose author's name contains **king**, whatever the capitalization.

      Try `LIKE '%king%'` first. Why does it find nothing?
    sql: |
      SELECT title, author_name
      FROM books;
    expect: |
      SELECT title, author_name
      FROM books
      WHERE author_name ILIKE '%king%';

  - kind: explain
    title: ORDER BY sorts the result
    body: |
      Without `ORDER BY`, PostgreSQL returns rows in whatever order is convenient, and that order can change between runs. When order matters, **say so**:

      ```sql
      SELECT title, price
      FROM books
      ORDER BY price DESC;
      ```

      - `ASC` = ascending (smallest first, A→Z, oldest first). It's the default.
      - `DESC` = descending (largest first, Z→A, newest first).
      - Add more columns as **tiebreakers**: `ORDER BY price, title` sorts by price, and among equal prices by title. Each column can have its own direction.

      <!-- page -->

      The Mystery shelf, most expensive first. Two books cost 10.99, so `title` breaks the tie (A before M):

      ```sql
      SELECT title, price
      FROM books
      WHERE genre = 'Mystery'
      ORDER BY price DESC, title;
      ```

      returns:

      | title | price |
      |---|---|
      | Rebecca | 11.50 |
      | And Then There Were None | 10.99 |
      | Murder on the Orient Express | 10.99 |
      | The Hound of the Baskervilles | 6.99 |

      Notice `WHERE` comes before `ORDER BY`.

  - kind: try
    title: "Try it: ORDER BY"
    body: |
      Run the Mystery example. Then try:

      - remove `DESC`: cheapest first
      - change `title` to `title DESC`: the two 10.99 books swap places
      - sort by `published_year` instead of price (add it to the SELECT list too, so you can see it)

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT title, price
      FROM books
      WHERE genre = 'Mystery'
      ORDER BY price DESC, title;

  - kind: try
    title: Your turn to sort
    body: |
      List every book's `title` and `price`, **cheapest first**. Some books cost the same, so break ties **alphabetically by title**. (One book has no price yet. Notice where it ends up; Module 7 explains why.)
    sql: |
      SELECT title, price
      FROM books;
    expect: |
      SELECT title, price
      FROM books
      ORDER BY price, title;
    ordered: true

  - kind: explain
    title: LIMIT and OFFSET
    body: |
      - **`LIMIT n`** returns at most *n* rows.
      - **`OFFSET m`** skips the first *m* rows before returning any.

      Together they **page** through results: page 1 is `LIMIT 10`, page 2 is `LIMIT 10 OFFSET 10`, and so on.

      **Always pair them with `ORDER BY`.** "The first 3 rows" means nothing until you've said what order they're in.

      <!-- page -->

      The 3 longest books (`title` breaks the tie between the two 688-page books):

      ```sql
      SELECT title, pages
      FROM books
      ORDER BY pages DESC, title
      LIMIT 3;
      ```

      | title | pages |
      |---|---|
      | It | 1138 |
      | Dune | 688 |
      | The Shining | 688 |

      Add `OFFSET 3` after `LIMIT 3` to get the next "page", books 4 to 6:

      | title | pages |
      |---|---|
      | The Name of the Wind | 662 |
      | Mistborn: The Final Empire | 541 |
      | Jane Eyre | 532 |

  - kind: try
    title: "Try it: LIMIT and OFFSET"
    body: |
      Run it to see the 3 longest books. Then:

      - add `OFFSET 3` on a new line after `LIMIT 3` to see the next three
      - change `LIMIT 3` to `LIMIT 5`
      - remove `DESC`: now you get the shortest books

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT title, pages
      FROM books
      ORDER BY pages DESC, title
      LIMIT 3;

  - kind: try
    title: Your turn for a top 3
    body: |
      Return the `title` and `stock` of the **3 books with the most copies in stock**, most copies first.
    sql: |
      SELECT title, stock
      FROM books;
    expect: |
      SELECT title, stock
      FROM books
      ORDER BY stock DESC
      LIMIT 3;
    ordered: true

  - kind: explain
    title: DISTINCT removes duplicates
    body: |
      `SELECT country FROM customers;` returns 20 rows: *USA, UK, UK, Spain, Mexico…*. Some repeat.

      `SELECT DISTINCT country FROM customers;` returns each **different** value once. Look closely and you'll see both `USA` and `usa`: DISTINCT compares values exactly, capitals included. (Module 9 shows how to clean that up.)

      DISTINCT applies to the **whole result row**, not just the first column. `SELECT DISTINCT genre, author_name …` removes rows only where *both* the genre *and* the author repeat.

      <!-- page -->

      The `sales` table has 30 sales, but only four ways to pay:

      ```sql
      SELECT DISTINCT payment_method
      FROM sales;
      ```

      | payment_method |
      |---|
      | bank_transfer |
      | upi |
      | paypal |
      | card |

      The order is whatever PostgreSQL finds convenient. Add `ORDER BY payment_method` if you want them A to Z.

  - kind: try
    title: "Try it: DISTINCT"
    body: |
      Run it to see the four payment methods. Then:

      - remove `DISTINCT`: all 30 rows come back, repeats included
      - change the query to `SELECT DISTINCT country FROM customers;` and spot both `USA` and `usa`

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT DISTINCT payment_method
      FROM sales;

  - kind: try
    title: Your turn with DISTINCT
    body: |
      Which **genres** does Inkwell stock? Return each genre once.
    sql: |
      SELECT genre
      FROM books;
    expect: |
      SELECT DISTINCT genre
      FROM books;

  - kind: explain
    title: Aliases and calculated columns
    body: |
      A column in SELECT can be a **calculation**, and **`AS`** gives any result column a new label:

      ```sql
      SELECT title AS book,
             price * 2 AS price_for_two
      FROM books;
      ```

      - `+` `-` `*` `/` work as in maths. (Between two values `*` means multiply; right after SELECT it means "all columns".)
      - The calculation exists **only in the result**. The stored data doesn't change.
      - **Whole-number division drops the remainder**: `7 / 2` is `3`. If either side has decimals (`7.0 / 2`), you get `3.5`.
      - `AS` is technically optional, which is why a **missing comma** silently turns the next column name into a label: `SELECT title price` returns *one* column labeled price. Always write `AS`.
      - Need spaces or capitals in a label? Use double quotes: `AS "Unit Price"`.

      <!-- page -->

      The example above, on the Horror shelf only:

      ```sql
      SELECT title AS book,
             price * 2 AS price_for_two
      FROM books
      WHERE genre = 'Horror';
      ```

      | book | price_for_two |
      |---|---|
      | Frankenstein | 15.00 |
      | Dracula | 16.50 |
      | The Shining | 31.98 |
      | It | 39.98 |

      And the division rule in action:

      ```sql
      SELECT 7 / 2 AS whole, 7.0 / 2 AS exact;
      ```

      | whole | exact |
      |---|---|
      | 3 | 3.5000000000000000 |

  - kind: try
    title: "Try it: calculations and labels"
    body: |
      Run both queries. Then:

      - change `price * 2` to `price + 1` or `price / 2`
      - rename the label `book` to `"Horror Title"` (double quotes, because of the space and capitals)
      - try `SELECT 10 / 3, 10.0 / 3;`

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT title AS book,
             price * 2 AS price_for_two
      FROM books
      WHERE genre = 'Horror';

      SELECT 7 / 2 AS whole, 7.0 / 2 AS exact;

  - kind: try
    title: Your turn to calculate
    body: |
      Show each book's `title` and its price in **cents** (the price times 100), labeled **price_cents**.
    sql: |
      SELECT title, price
      FROM books;
    expect: |
      SELECT title, price * 100 AS price_cents
      FROM books;

  - kind: explain
    title: The order a query really runs in
    body: |
      You *write* a query in this order:

      **SELECT → FROM → WHERE → ORDER BY → LIMIT**

      But PostgreSQL *evaluates* it in this order:

      **FROM → WHERE → SELECT → ORDER BY → LIMIT**

      1. **FROM**: pick the table.
      2. **WHERE**: keep matching rows.
      3. **SELECT**: build the output columns, including calculations and aliases.
      4. **ORDER BY**: sort.
      5. **LIMIT / OFFSET**: cut.

      This explains a classic puzzle: an alias made in SELECT **works in ORDER BY** (which runs after SELECT) but **not in WHERE** (which runs before it, when the alias doesn't exist yet).

  - kind: try
    title: Where aliases work
    body: |
      This sorts by the alias `price_cents`, and it works. Run it.

      Now add `WHERE price_cents > 2000` after FROM and run again. The error, *column "price_cents" does not exist*, is WHERE running before SELECT. Fix it by writing the calculation itself: `WHERE price * 100 > 2000`.
    sql: |
      SELECT title, price * 100 AS price_cents
      FROM books
      ORDER BY price_cents DESC;

  - kind: try
    title: "Find the bug: authors starting with J"
    body: |
      *"Which authors' names start with J?"* This query was supposed to answer that, each author once, but it returns nothing. Find the mistake and fix it.
    sql: |
      SELECT DISTINCT author_name
      FROM books
      WHERE author_name LIKE '%J';
    expect: |
      SELECT DISTINCT author_name
      FROM books
      WHERE author_name LIKE 'J%';
    hint: |
      Where does `%` go if the J must come first and anything may follow?

  - kind: why
    body: |
      Choosing columns, filtering rows, sorting and taking the top few is most of what everyday SQL *is*. "The 10 most expensive…", "every card payment since March…", "which categories exist…": you can answer all of them now.

  - kind: recap
    body: |
      - `SELECT cols FROM table` reads data. `*` = all columns. Prefer naming them.
      - `WHERE` keeps rows where the condition is true: `= <> < > <= >=`, `AND` before `OR` (use parentheses), `NOT`.
      - `IN (list)`, `BETWEEN a AND b` (inclusive), `LIKE` with `%` and `_`, `ILIKE` ignores case.
      - `ORDER BY col [DESC], tiebreaker`. `LIMIT n OFFSET m`, always with ORDER BY.
      - `DISTINCT` removes duplicate result rows.
      - `expr AS label` makes calculated columns. Integer ÷ integer drops the remainder.
      - Evaluation order: **FROM → WHERE → SELECT → ORDER BY → LIMIT**. That's why aliases work in ORDER BY but not WHERE.
