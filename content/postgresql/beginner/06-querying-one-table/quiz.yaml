pass: 3
questions:
  - type: predict
    prompt: What does this return?
    code: |
      SELECT first_name
      FROM customers
      WHERE country = 'UK' AND city <> 'London';
    options:
      - "Liam"
      - "Olivia"
      - "Liam\nOlivia\nZoe"
      - No rows
    answer: 1
    explanation: Three customers live in the UK (Liam and Zoe in London, Olivia in Manchester). `AND city <> 'London'` removes the two Londoners, leaving Olivia.

  - type: predict
    prompt: The genres sorted A→Z start Classic, Fantasy, Horror, Mystery, Non-Fiction… What does this return?
    code: |
      SELECT DISTINCT genre
      FROM books
      ORDER BY genre
      LIMIT 2 OFFSET 1;
    options:
      - "Classic\nFantasy"
      - "Fantasy\nHorror"
      - "Horror\nMystery"
      - "Fantasy"
    answer: 1
    explanation: "`OFFSET 1` skips Classic, then `LIMIT 2` returns the next two: Fantasy and Horror."

  - type: predict
    prompt: What does this return?
    code: |
      SELECT 7 / 2 AS result;
    options:
      - "3.5"
      - "3"
      - "4"
      - An error
    answer: 1
    explanation: Both 7 and 2 are integers, so PostgreSQL does whole-number division and drops the remainder. Write `7.0 / 2` to get 3.5.

  - type: mcq
    prompt: "Why does `SELECT price * 100 AS cents FROM books WHERE cents > 2000;` fail?"
    options:
      - You can't multiply a column in SELECT; it must be done in WHERE
      - WHERE runs before SELECT, so the alias `cents` doesn't exist yet
      - Aliases must be written in double quotes to be used anywhere else
      - "`price * 100` is text, so it can't be compared with a number"
    answer: 1
    explanation: "PostgreSQL evaluates FROM → WHERE → SELECT → ORDER BY. Repeat the calculation in WHERE (`price * 100 > 2000`), or use the alias only in ORDER BY."

  - type: mcq
    prompt: "Which stock values does `WHERE stock BETWEEN 3 AND 5` keep?"
    options:
      - "4 only"
      - "3 and 4"
      - "3, 4 and 5"
      - "4 and 5"
    answer: 2
    explanation: BETWEEN includes both ends of the range.
