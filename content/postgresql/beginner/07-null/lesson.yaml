steps:
  - kind: explain
    title: NULL means "unknown"
    body: |
      **NULL** is a marker for a **missing or unknown value**. It is *not*:

      - zero (`0` is a known number)
      - empty text (`''` is known text that happens to be empty)
      - the word `'NULL'`

      Ava's email is NULL: we simply don't know it. *The Silent Garden* has a NULL `price`: it hasn't been set yet.

      psql shows NULL as a blank. This page shows it as a faded **NULL** so you can spot it.

  - kind: try
    title: Spot the unknowns
    body: |
      Run it. Which customers have no email? Then change it to `SELECT title, price FROM books;` and find the book with no price.
    sql: |
      SELECT customer_id, first_name, email
      FROM customers;

  - kind: explain
    title: Three-valued logic
    body: |
      Most logic has two answers, **true** and **false**. SQL has a third: **unknown**.

      Is Ava's email equal to `'x@example.com'`? We don't know Ava's email, so the honest answer is *unknown*. Any comparison with NULL gives unknown, **even `NULL = NULL`**: two unknown things might or might not be equal.

      Unknown spreads through AND, OR and NOT in a sensible way:

      | Expression | Result | Why |
      |---|---|---|
      | `unknown AND false` | false | false wins either way |
      | `unknown AND true` | unknown | depends on the unknown |
      | `unknown OR true` | true | true wins either way |
      | `unknown OR false` | unknown | depends on the unknown |
      | `NOT unknown` | unknown | still don't know |

  - kind: try
    title: Comparisons with NULL
    body: |
      Every column here compares something with NULL. Run it: most answers are NULL (unknown), not true or false.

      Only `IS NULL` gives a real answer.
    sql: |
      SELECT NULL = NULL    AS equal,
             NULL <> 1      AS not_equal,
             NULL > 5       AS bigger,
             NULL IS NULL   AS is_null;

  - kind: explain
    title: Why "= NULL" never matches
    body: |
      **WHERE keeps a row only when the condition is true.** Unknown isn't true, so the row is dropped.

      That makes `WHERE email = NULL` match **nothing, ever**, and it doesn't raise an error. It's a silent wrong answer.

      To test for missing values, use the dedicated operators:

      - `email IS NULL`: the value is missing
      - `email IS NOT NULL`: the value is present

      <!-- page -->

      Which customer has no birth date on file?

      ```sql
      SELECT first_name, birth_date
      FROM customers
      WHERE birth_date IS NULL;
      ```

      | first_name | birth_date |
      |---|---|
      | Sophia | NULL |

      And the opposite: UK customers whose phone **is** known.

      ```sql
      SELECT first_name, phone
      FROM customers
      WHERE phone IS NOT NULL AND country = 'UK';
      ```

      | first_name | phone |
      |---|---|
      | Olivia | +44 20 7946 0958 |

      (Liam and Zoe, the other two UK customers, have no phone.)

  - kind: try
    title: "Try it: IS NULL and IS NOT NULL"
    body: |
      Run both examples. Then:

      - change `birth_date IS NULL` to `birth_date = NULL`: zero rows, and no error
      - remove `AND country = 'UK'` to see every customer with a phone
      - change `IS NOT NULL` to `IS NULL` to see who has none

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT first_name, birth_date
      FROM customers
      WHERE birth_date IS NULL;

      SELECT first_name, phone
      FROM customers
      WHERE phone IS NOT NULL AND country = 'UK';

  - kind: try
    title: Find the missing email
    body: |
      This query looks reasonable and returns **zero rows**. Run it to see. Then fix it so it finds the customers whose email is missing.
    sql: |
      SELECT first_name, email
      FROM customers
      WHERE email = NULL;
    expect: |
      SELECT first_name, email
      FROM customers
      WHERE email IS NULL;

  - kind: try
    title: The row that vanishes
    body: |
      "Everyone except Emma" should be 19 of the 20 customers. Run it and count: only 17.

      Ava and Benjamin are missing. Their emails are NULL, so `NULL <> 'emma.johnson@example.com'` is unknown, and WHERE drops those rows.
    sql: |
      SELECT first_name, email
      FROM customers
      WHERE email <> 'emma.johnson@example.com';

  - kind: explain
    title: IS DISTINCT FROM
    body: |
      **`IS DISTINCT FROM`** is a "not equal" that treats NULL as an ordinary value you can compare:

      | Expression | `<>` gives | `IS DISTINCT FROM` gives |
      |---|---|---|
      | `1` vs `2` | true | true |
      | `1` vs `1` | false | false |
      | `NULL` vs `1` | unknown | **true** |
      | `NULL` vs `NULL` | unknown | **false** |

      Its opposite, **`IS NOT DISTINCT FROM`**, is an "equals" where two NULLs count as equal.

      <!-- page -->

      See it side by side:

      ```sql
      SELECT 'Mystery' <> NULL                AS not_equal,
             'Mystery' IS DISTINCT FROM NULL  AS distinct_from,
             NULL IS DISTINCT FROM NULL       AS both_null,
             NULL IS NOT DISTINCT FROM NULL   AS same;
      ```

      returns:

      | not_equal | distinct_from | both_null | same |
      |---|---|---|---|
      | NULL | t | f | t |

      `<>` shrugs (NULL, unknown). `IS DISTINCT FROM` gives a real true or false every time.

  - kind: try
    title: "Try it: IS DISTINCT FROM"
    body: |
      Run it and match each answer to the table above. Then change `'Mystery'` to `NULL` in the first two columns, or replace a `NULL` with `'Mystery'`, and predict each answer before you run.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT 'Mystery' <> NULL                AS not_equal,
             'Mystery' IS DISTINCT FROM NULL  AS distinct_from,
             NULL IS DISTINCT FROM NULL       AS both_null,
             NULL IS NOT DISTINCT FROM NULL   AS same;

  - kind: try
    title: Your turn with IS DISTINCT FROM
    body: |
      Fix the query so it returns all **19** customers other than Emma, including the two with no email. Keep the same two columns.
    sql: |
      SELECT first_name, email
      FROM customers
      WHERE email <> 'emma.johnson@example.com';
    expect: |
      SELECT first_name, email
      FROM customers
      WHERE email IS DISTINCT FROM 'emma.johnson@example.com';

  - kind: explain
    title: NULL in maths and text
    body: |
      Almost any calculation that touches NULL **becomes NULL**:

      - `NULL + 1` is NULL: unknown plus one is still unknown.
      - `price * stock` is NULL when the price is missing.
      - `'Email: ' || NULL` is NULL. (`||` glues text together; Module 9 has more.)

      One missing value can blank out a whole calculated column, so watch for it.

  - kind: try
    title: A calculation goes blank
    body: |
      What's each book's stock worth (price × copies)? Run it: *The Silent Garden* has no price, so its stock value is NULL too.
    sql: |
      SELECT title, price, stock,
             price * stock AS stock_value
      FROM books;

  - kind: explain
    title: Where NULLs sort
    body: |
      When you sort, PostgreSQL treats NULL as **larger than everything**:

      - `ORDER BY price` (ascending): NULLs come **last**
      - `ORDER BY price DESC`: NULLs come **first**

      Override it with **`NULLS FIRST`** or **`NULLS LAST`**:

      ```sql
      ORDER BY price DESC NULLS LAST
      ```

      This matters for "top N" questions. Sort descending on a column with missing values, and the NULLs quietly take the top spots.

      <!-- page -->

      The 3 youngest customers (latest birth date first). Sophia has no birth date, so she grabs first place:

      ```sql
      SELECT first_name, birth_date
      FROM customers
      ORDER BY birth_date DESC
      LIMIT 3;
      ```

      | first_name | birth_date |
      |---|---|
      | Sophia | NULL |
      | Zoe | 2003-05-05 |
      | Ava | 2001-09-09 |

      With `ORDER BY birth_date DESC NULLS LAST`, the real answer appears:

      | first_name | birth_date |
      |---|---|
      | Zoe | 2003-05-05 |
      | Ava | 2001-09-09 |
      | Benjamin | 2000-12-12 |

  - kind: try
    title: "Try it: NULLS FIRST and NULLS LAST"
    body: |
      Run it and see Sophia on top. Then add `NULLS LAST` after `DESC` and run again. Also try removing `DESC` and adding `NULLS FIRST` instead.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT first_name, birth_date
      FROM customers
      ORDER BY birth_date DESC
      LIMIT 3;

  - kind: try
    title: Your turn with NULLS LAST
    body: |
      Show `title` and `price` for every book, **most expensive first**, with the unpriced book at the **bottom**. Some prices tie, so break ties by `title`.
    sql: |
      SELECT title, price
      FROM books
      ORDER BY price DESC, title;
    expect: |
      SELECT title, price
      FROM books
      ORDER BY price DESC NULLS LAST, title;
    ordered: true

  - kind: explain
    title: COALESCE fills in a default
    body: |
      **`COALESCE(a, b, c, …)`** returns the **first value that isn't NULL**:

      ```sql
      SELECT first_name,
             COALESCE(email, 'no email on file') AS contact
      FROM customers;
      ```

      Use it to show something friendly instead of a blank, or to treat missing numbers as 0 when that's truly what they mean: `COALESCE(discount, 0)`. Careful with that last one: sometimes "unknown" and "zero" really are different.

      <!-- page -->

      The query above, for the first 6 customers (`WHERE customer_id <= 6`):

      | first_name | contact |
      |---|---|
      | Emma | emma.johnson@example.com |
      | Liam | liam.smith@example.com |
      | Olivia | OLIVIA.BROWN@EXAMPLE.COM |
      | Noah | noah.garcia@example.com |
      | Ava | no email on file |
      | Lucas | lucas.mueller@example.com |

      Everyone with an email keeps it. Ava's NULL is replaced by the friendly text.

  - kind: try
    title: "Try it: COALESCE"
    body: |
      Run it and find Ava's row. Then:

      - change `'no email on file'` to `'ask at the till'`
      - remove the `WHERE` line to see all 20 customers (Benjamin has no email either)

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT first_name,
             COALESCE(email, 'no email on file') AS contact
      FROM customers
      WHERE customer_id <= 6;

  - kind: try
    title: Your turn with COALESCE
    body: |
      Show each customer's `first_name` and their phone labeled **phone**, with **`unknown`** where the phone is missing.
    sql: |
      SELECT first_name, phone
      FROM customers;
    expect: |
      SELECT first_name, COALESCE(phone, 'unknown') AS phone
      FROM customers;

  - kind: explain
    title: "A preview: the NOT IN trap"
    body: |
      `x NOT IN (1, 2, NULL)` means `x <> 1 AND x <> 2 AND x <> NULL`. That last part is always unknown, so the whole thing can **never be true**. A NULL anywhere in a NOT IN list makes it match **nothing**.

      With a typed list you'd notice. But in Module 18 you'll build lists from other queries, where a NULL can sneak in unseen. That's the real trap, and you'll learn the fix there.

  - kind: try
    title: See NOT IN return nothing
    body: |
      "Books other than 1 and 2" should give 28 rows. Run it: zero. Then remove the `, NULL` and run it again.
    sql: |
      SELECT title
      FROM books
      WHERE book_id NOT IN (1, 2, NULL);

  - kind: explain
    title: Should this column allow NULL?
    body: |
      When you design a table (Module 12), you decide for each column whether NULL is allowed. Ask: **can this value genuinely be unknown or not apply?**

      - A sale's `sold_at`: always known. Forbid NULL.
      - A book's `price`: may not be set yet for an upcoming book. NULL is honest.
      - A customer's `email`: some people don't give one. NULL is fine.

      Avoid **"magic values"** that pretend to be data: an empty string for "no email", `0` for "unknown price", or `1900-01-01` for "no date". They sneak into sums and averages and give wrong answers. NULL is the honest way to say *we don't know*.

  - kind: try
    title: "Find the bug: everything but Classics"
    body: |
      *"List the title of every book that isn't a Classic."* There are 30 books and 6 Classics, so the answer should have **24** rows. This query returns 23. Which book is missing, and why? Fix it.
    sql: |
      SELECT title
      FROM books
      WHERE genre <> 'Classic';
    expect: |
      SELECT title
      FROM books
      WHERE genre IS DISTINCT FROM 'Classic';
    hint: |
      One book has no genre. What is `NULL <> 'Classic'`?

  - kind: why
    body: |
      Real data is full of gaps. Most silently wrong SQL answers come from NULL: a row that vanished from a filter, a total that went blank, a NOT IN that returned nothing. Knowing three-valued logic is how you catch them before anyone else does.

  - kind: recap
    body: |
      - NULL = **unknown**. Not 0, not `''`.
      - Any comparison with NULL is **unknown**, even `NULL = NULL`. WHERE keeps only **true** rows.
      - Test with `IS NULL` / `IS NOT NULL`. Never `= NULL`.
      - `IS DISTINCT FROM` is a not-equal where NULL is comparable.
      - Maths and `||` with NULL give NULL.
      - NULLs sort last in ASC and first in DESC. Override with `NULLS FIRST/LAST`.
      - `COALESCE(a, b, …)` returns the first non-NULL value.
      - A NULL inside `NOT IN (…)` makes it match nothing.
      - Allow NULL only when a value can truly be unknown. Avoid magic values.
