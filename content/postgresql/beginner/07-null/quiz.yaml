pass: 3
questions:
  - type: mcq
    prompt: "What does `SELECT first_name FROM customers WHERE email = NULL;` return?"
    options:
      - The customers with no email
      - Every customer
      - No rows, because comparing to NULL is never true
      - An error
    answer: 2
    explanation: "`= NULL` gives *unknown* for every row, and WHERE only keeps rows where the condition is true. There's no error, just an empty result. Use `IS NULL`."

  - type: predict
    prompt: What does this return?
    code: |
      SELECT COALESCE(NULL, NULL, 'Rome', 'Paris') AS city;
    options:
      - "NULL"
      - "Rome"
      - "Paris"
      - "Rome, Paris"
    answer: 1
    explanation: COALESCE returns the first value that isn't NULL, which is 'Rome'.

  - type: predict
    prompt: What does this return?
    code: |
      SELECT count(*) AS rows
      FROM books
      WHERE book_id NOT IN (1, NULL);
    options:
      - "0"
      - "29"
      - "30"
      - An error
    answer: 0
    explanation: "`book_id NOT IN (1, NULL)` includes `book_id <> NULL`, which is always unknown. The condition is never true, so no rows are counted."

  - type: fill
    prompt: Sort books by price, most expensive first, but put books **without** a price at the bottom.
    code: |
      SELECT title FROM books ORDER BY price DESC NULLS ____;
    answer: LAST
    accept: ["last"]
    explanation: "In DESC order NULLs come first by default. `NULLS LAST` moves them to the end."

  - type: mcq
    prompt: "What's the value of `NULL IS DISTINCT FROM NULL`?"
    options:
      - "true"
      - "false"
      - NULL (unknown)
      - An error
    answer: 1
    explanation: IS DISTINCT FROM treats NULL as a comparable value. Two NULLs are *not* distinct, so the answer is false. (`NULL <> NULL` would be unknown.)
