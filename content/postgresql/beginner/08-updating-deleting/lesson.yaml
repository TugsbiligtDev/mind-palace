steps:
  - kind: explain
    title: Changing what's already there
    body: |
      - **`UPDATE`** changes values in rows that already exist.
      - **`DELETE`** removes rows.

      Both are **permanent the moment they run** on a real database. There's no undo button in psql. (Module 30 covers transactions, the safety net.) This module is as much about **habits** as syntax.

      Here in the browser, every run starts from a fresh copy, so experiment freely.

  - kind: explain
    title: UPDATE … SET … WHERE
    body: |
      ```sql
      UPDATE sales
      SET payment_method = 'card'
      WHERE sale_id = 7;
      ```

      - **`SET`** gives the new values. Change several columns at once with commas: `SET price = 9.99, stock = 10`.
      - **`WHERE`** picks **which rows** to change, exactly like in SELECT.
      - A new value can use the old one: `SET stock = stock + 1` adds one copy to every matching row.

  - kind: try
    title: Fix one sale
    body: |
      Sale 7 was recorded as a bank transfer, but Lucas actually paid by card. Run it. RETURNING shows the changed row with its **new** values. One row back means one row changed.
    sql: |
      UPDATE sales
      SET payment_method = 'card'
      WHERE sale_id = 7
      RETURNING sale_id, book_title, payment_method;

  - kind: explain
    title: The forgotten WHERE
    body: |
      **Forget the WHERE and every row changes.** This is the most famous mistake in SQL, and it has wrecked real companies' data. PostgreSQL won't ask "are you sure?"

      Habits that prevent it:

      1. **Write the WHERE first**, then go back and fill in the SET.
      2. **Run it as a SELECT first**: `SELECT * FROM sales WHERE sale_id = 7;` shows exactly which rows you're about to touch.
      3. **Check the count.** psql answers `UPDATE 1`. If you expected 1 and see `UPDATE 30`, something is wrong.

  - kind: try
    title: Watch the disaster (safely)
    body: |
      No WHERE. Run it and look at the SELECT underneath: **every** book is now free. On your Mac, that would be real.
    sql: |
      UPDATE books SET price = 0;
      SELECT title, price FROM books;

  - kind: try
    title: Your turn to update
    body: |
      The publisher raised the price of *Dune*. The starter is the "SELECT first" check. Turn it into an UPDATE that sets its `price` to **19.50**, changing **only that row**, and returns its `title` and `price`.
    sql: |
      SELECT title, price
      FROM books
      WHERE title = 'Dune';
    expect: |
      UPDATE books
      SET price = 19.50
      WHERE title = 'Dune'
      RETURNING title, price;

  - kind: try
    title: Your turn with two columns
    body: |
      *Foundation* (book 8) is sold out, and a delivery of new copies has arrived. In one UPDATE, set its `stock` to **10** and its `price` to **9.99**. Return `title`, `stock` and `price`.
    sql: |
      UPDATE books
      SET stock = 10
      WHERE book_id = 8
      RETURNING title, stock, price;
    expect: |
      UPDATE books
      SET stock = 10, price = 9.99
      WHERE book_id = 8
      RETURNING title, stock, price;

  - kind: explain
    title: DELETE … WHERE
    body: |
      ```sql
      DELETE FROM sales
      WHERE quantity > 2;
      ```

      Removes every row matching the WHERE. **Without WHERE it removes all of them**, with the same danger and the same habits: write the WHERE first, SELECT first, check the count.

      `RETURNING` works here too and shows the rows that were removed, which makes a handy receipt.

  - kind: try
    title: A delete with a receipt
    body: |
      Delete the sales paid by PayPal. RETURNING lists what's gone. Then change the SQL to `SELECT` first, the way you would on your Mac.
    sql: |
      DELETE FROM sales
      WHERE payment_method = 'paypal'
      RETURNING sale_id, book_title, payment_method;

  - kind: try
    title: Left behind
    body: |
      Emma (customer 1) has 5 sales, each one holding Emma's email. Delete Emma, and those sales now belong to a customer who doesn't exist. Run it: the delete works, and the sales are left behind, pointing at nobody.

      The `practice` tables have no rule to stop this. In Module 13 you'll meet *foreign keys*, which refuse deletes like this one.
    sql: |
      DELETE FROM customers WHERE customer_id = 1;

      SELECT sale_id, customer_email, book_title
      FROM sales
      WHERE customer_email = 'emma.johnson@example.com';

  - kind: explain
    title: TRUNCATE empties a table
    body: |
      ```sql
      TRUNCATE sales;
      ```

      **`TRUNCATE`** removes **every row** in one fast operation. It takes no WHERE: it's for "throw everything in this table away", like clearing out test data.

      | | `DELETE FROM t` | `TRUNCATE t` |
      |---|---|---|
      | WHERE allowed | yes | no, always everything |
      | RETURNING | yes | no |
      | Speed on big tables | slower (row by row) | very fast |

      Either way, the table itself still exists, just empty. `DROP TABLE` is what removes the table.

  - kind: try
    title: Empty the sales log
    body: |
      Run it. The count afterwards is 0, but the table is still there.
    sql: |
      TRUNCATE sales;
      SELECT count(*) FROM sales;

  - kind: info
    title: "🔹 DELETE … USING"
    body: |
      Sometimes the rows to delete are decided by **another table**. PostgreSQL's `USING` lets you look at it:

      ```sql
      -- Delete sales made to customers from London
      DELETE FROM sales
      USING customers
      WHERE sales.customer_email = customers.email
        AND customers.city = 'London';
      ```

      It will make more sense after joins in Module 14. For now, just recognize it.

  - kind: why
    body: |
      Reading data can't hurt anything. Changing it can. The skills here are really about **care**: see before you change, change exactly what you meant, and confirm what changed.

  - kind: recap
    body: |
      - `UPDATE t SET col = value, … WHERE …`. A value can use the old one: `stock + 1`.
      - `DELETE FROM t WHERE …`.
      - **No WHERE = every row.** Write the WHERE first, SELECT first, check the count.
      - `RETURNING` shows the changed or removed rows.
      - Without foreign keys, a delete can leave rows pointing at nothing. Module 13's foreign keys refuse such deletes.
      - `TRUNCATE t` empties the whole table fast. The table stays.
      - 🔹 `DELETE … USING other_table` deletes based on another table.
