episode: 9
title: "Finale: Restore the Record"
briefing: |
  Everything points one way. The ~C signatures in the server room on February 21 and 22. The
  Rome stop cut from five nights to one. Gerel Tsog's login, edited the day after the tour,
  department wiped. Two refunds of exactly 240.00, the stolen difference.

  Wanderly's director has given the agency **write access**, once. "Put the records right,"
  Inspector Bold says. "Exactly right. Change what's wrong, and *nothing else*. Then close the
  file with a name."

  Moth has already typed a first attempt into the console, and is looking at it nervously.
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.refunds (
      refund_id    INTEGER PRIMARY KEY,
      trip_id      INTEGER NOT NULL,
      approved_by  TEXT NOT NULL,
      amount       NUMERIC(8,2) NOT NULL,
      approved_on  DATE NOT NULL
  );
  INSERT INTO evidence.refunds VALUES
  (1, 5, 'gtsog',     240.00, '2026-02-21'),
  (2, 5, 'gtsog',     240.00, '2026-02-22'),
  (3, 3, 'sotgon',    150.00, '2026-05-25'),
  (4, 7, 'gtsog',     380.00, '2026-02-22'),
  (5, 1, 'nbatbayar',  60.00, '2026-03-15'),
  (6, 4, 'gtsog',     380.00, '2026-02-23'),
  (7, 1, 'sotgon',     45.00, '2026-03-20'),
  (8, 2, 'edash',     100.00, '2026-08-01'),
  (9, 3, 'sotgon',     75.00, '2026-06-02');
  CREATE TABLE evidence.case_log (
      entry_id   INTEGER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      culprit    TEXT NOT NULL,
      closed_on  DATE NOT NULL DEFAULT CURRENT_DATE
  );
clues:
  - "The tampered booking is `trip_stops` row **7** (trip 5, Rome). The truth: **5 nights**, costing **300.00** in total."
  - "Every refund approved by login **`gtsog`** was fraudulent. Every other refund is genuine."
  - "`evidence.case_log` has `entry_id` (generated), `culprit` and `closed_on` (defaults to today)."
task: |
  Make exactly these three changes. You can run them all at once, as separate statements:

  1. **Fix the Rome stop:** set `nights` to **5** and `cost` to **300.00** for trip stop **7 only**.
  2. **Remove the fraud:** delete **every refund approved by `gtsog`**, and no others.
  3. **Close the case:** insert **one** row into `evidence.case_log` with the culprit **`Gerel Tsog`** (exactly that spelling).

  The grader inspects the **state of the database** afterwards, so any extra change, or any missed one, counts against you. Every **Run** starts from fresh data, so put checking SELECTs *below* your changes and run them together. That's the professional habit.
starter: |
  -- Moth's first attempt. Something is badly wrong with it.
  -- Each Run starts from fresh data, so the SELECT below checks the UPDATE above it.
  UPDATE trip_stops
  SET nights = 5, cost = 300.00;

  SELECT * FROM trip_stops ORDER BY trip_stop_id;
check:
  mode: state
  solution: |
    UPDATE trip_stops
    SET nights = 5, cost = 300.00
    WHERE trip_stop_id = 7;

    DELETE FROM evidence.refunds
    WHERE approved_by = 'gtsog';

    INSERT INTO evidence.case_log (culprit)
    VALUES ('Gerel Tsog');
  state_query: |
    SELECT 'stop' AS kind, trip_stop_id::text AS id, nights::text AS a, cost::text AS b FROM trip_stops
    UNION ALL
    SELECT 'refund', refund_id::text, approved_by, amount::text FROM evidence.refunds
    UNION ALL
    SELECT 'log', culprit, NULL, NULL FROM evidence.case_log
    ORDER BY 1, 2;
hints:
  - "Run Moth's attempt as it is. The SELECT underneath shows the result. How many stops now have 5 nights and cost 300? What's missing from the UPDATE?"
  - "Each change needs its own precise `WHERE`: the UPDATE by `trip_stop_id`, and the DELETE by `approved_by`. The INSERT only needs the `culprit` column, because the others fill themselves."
  - "Three statements: `UPDATE trip_stops SET … WHERE trip_stop_id = 7;`, then `DELETE FROM evidence.refunds WHERE approved_by = 'gtsog';`, then `INSERT INTO evidence.case_log (culprit) VALUES ('Gerel Tsog');`"
reveal: |
  **Case closed.**

  Trip stop 7 reads *5 nights, 300.00* again. The four fraudulent refunds are gone. And the
  case log holds one line: **Gerel Tsog**.

  Inspector Bold signs the file. "Operations manager. Cut the booking, refunded the difference,
  twice, then covered it with a float report and a wiped department. Clever
  enough to change the data. Not clever enough to change *all* of it."

  Moth hesitates at the door. "The refunds went out to a bank account. It isn't Gerel's. It's
  linked to a **traveler** record, and I can't see which one from here. The tables don't
  connect."

  Bold smiles for the first time all season. "Then our detective will learn to connect them."

  ***Season 1 complete.*** *Season 2: JOINs, keys, and whoever else was in on it.*
