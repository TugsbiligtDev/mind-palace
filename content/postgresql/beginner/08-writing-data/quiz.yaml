questions:
  - type: mcq
    prompt: "What does `UPDATE trips SET status = 'cancelled';` do?"
    options:
      - Nothing, because UPDATE needs a WHERE
      - Cancels the most recent trip
      - Cancels **every** trip
      - An error
    answer: 2
    explanation: Without WHERE, UPDATE applies to every row in the table, and PostgreSQL won't ask whether you're sure. Write the WHERE first.

  - type: predict
    prompt: Trip 1 has two stops, with 4 and 3 nights. What does this return?
    code: |
      UPDATE trip_stops
      SET nights = nights + 1
      WHERE trip_id = 1
      RETURNING nights;
    options:
      - "4\n3"
      - "5\n4"
      - "5"
      - "UPDATE 2"
    answer: 1
    explanation: Both of trip 1's stops get one more night, and RETURNING shows the **new** values, 5 and 4.

  - type: fill
    prompt: Insert Chile and get back the ID PostgreSQL generated.
    code: |
      INSERT INTO countries (name, continent) VALUES ('Chile', 'South America') ____ country_id;
    answer: RETURNING
    accept: ["returning"]
    explanation: "`RETURNING` shows the rows you just inserted, including generated values like the identity ID."

  - type: mcq
    prompt: What's the difference between `DELETE FROM reviews;` and `TRUNCATE reviews;`?
    options:
      - DELETE removes the table, and TRUNCATE removes the rows
      - Both empty the table. DELETE works row by row (and can take a WHERE), while TRUNCATE empties the whole table in one quick operation
      - TRUNCATE can be undone and DELETE can't
      - There's no difference
    answer: 1
    explanation: Both leave the table empty but still existing. DELETE is flexible (WHERE, RETURNING). TRUNCATE is a quick "throw it all away".

  - type: mcq
    prompt: "Why does `DELETE FROM travelers WHERE traveler_id = 1;` fail?"
    options:
      - Traveler 1 doesn't exist
      - You can't delete by ID
      - Other rows (trips, reviews) still reference traveler 1 through a foreign key
      - DELETE needs RETURNING
    answer: 2
    explanation: A foreign key promises that every `trips.traveler_id` points at a real traveler. Deleting Amina would break that promise, so PostgreSQL refuses.
