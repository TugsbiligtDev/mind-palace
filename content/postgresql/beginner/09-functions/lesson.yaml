steps:
  - kind: explain
    title: What a function is
    body: |
      This lesson is a toolbox: you'll meet about twenty functions, but you don't need to memorize them. Learn what *kinds* of things functions can do, and come back to the recap when you need one.

      A **function** takes some input values (its *arguments*, in parentheses) and returns a value:

      ```sql
      upper('dune')          -- 'DUNE'
      round(136.6667, 2)     -- 136.67
      ```

      Used in a SELECT, a function runs **once per row**, just like the calculated columns in Module 6. Functions can be nested, with the inner one running first: `upper(trim('  dune '))` gives `'DUNE'`.

      **Example.** Those three, as a real query:

      ```sql
      SELECT upper('dune') AS a,
             round(136.6667, 2) AS b,
             upper(trim('  dune ')) AS c;
      ```

      | a | b | c |
      |---|---|---|
      | DUNE | 136.67 | DUNE |

      And once per row, on a table:

      ```sql
      SELECT title, upper(title) AS shouting, length(title) AS letters
      FROM books
      ORDER BY book_id
      LIMIT 3;
      ```

      | title | shouting | letters |
      |---|---|---|
      | Pride and Prejudice | PRIDE AND PREJUDICE | 19 |
      | Emma | EMMA | 4 |
      | 1984 | 1984 | 4 |

  - kind: try
    title: "Try it: call some functions"
    body: |
      Both examples. Run them, then try `lower(title)` or `round(price)` (no decimals) in the second query.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT upper('dune') AS a,
             round(136.6667, 2) AS b,
             upper(trim('  dune ')) AS c;

      SELECT title,
             upper(title) AS shouting,
             length(title) AS letters
      FROM books
      ORDER BY book_id
      LIMIT 3;

  - kind: explain
    title: Text functions
    body: |
      | Function | Does | Example → result |
      |---|---|---|
      | `a \|\| b` | joins text | `'Good' \|\| ' ' \|\| 'Omens'` → `Good Omens` |
      | `concat(a, b, …)` | joins text, **skipping NULLs** | `concat('A', NULL, 'B')` → `AB` |
      | `upper(t)` / `lower(t)` | changes case | `upper('dune')` → `DUNE` |
      | `length(t)` | number of characters | `length('Dune')` → `4` |
      | `trim(t)` | removes spaces at both ends | `trim('  hi ')` → `hi` |
      | `replace(t, from, to)` | swaps every `from` for `to` | `replace('a-b-c', '-', '/')` → `a/b/c` |
      | `split_part(t, sep, n)` | the *n*-th piece of `t`, split on `sep` | `split_part('a-b-c', '-', 2)` → `b` |
      | `substring(t, start, len)` | part of the text | `substring('Inkwell', 1, 3)` → `Ink` |

      Remember from Module 7: **`||` with a NULL gives NULL.** `concat()` treats NULL as empty text instead.

  - kind: try
    title: Slice and dice names
    body: |
      Run it. Then add `lower(author_name)` as another column.
    sql: |
      SELECT author_name,
             upper(author_name) AS shouted,
             split_part(author_name, ' ', 1) AS first_name,
             substring(author_name, 1, 3) AS first_three
      FROM books;

  - kind: try
    title: "|| vs concat() with a NULL"
    body: |
      Ava and Benjamin have no email. Look at their rows in each column.
    sql: |
      SELECT first_name || ' <' || email || '>' AS with_pipes,
             concat(first_name, ' <', email, '>') AS with_concat
      FROM customers;

  - kind: try
    title: Your turn to build text
    body: |
      For every customer, build a single column labeled **label** that looks like `NEW YORK - USA`: the city in **uppercase**, then ` - `, then the country as stored.
    sql: |
      SELECT city, country
      FROM customers;
    expect: |
      SELECT upper(city) || ' - ' || country AS label
      FROM customers;

  - kind: explain
    title: Number functions
    body: |
      | Function | Does | Example → result |
      |---|---|---|
      | `round(x, n)` | rounds to *n* decimal places | `round(136.666, 2)` → `136.67` |
      | `round(x)` | rounds to a whole number | `round(2.5)` → `3` |
      | `ceil(x)` / `floor(x)` | rounds up / down | `ceil(2.1)` → `3` |
      | `abs(x)` | removes the minus sign | `abs(-5)` → `5` |

      Rounding for **display** is fine. Keep the full precision in stored data, and round at the end.

      <!-- page -->

      The Horror shelf, each price split three ways, then rounded up and down:

      ```sql
      SELECT title, price,
             price / 3           AS raw_third,
             round(price / 3, 2) AS third,
             ceil(price)         AS up,
             floor(price)        AS down
      FROM books
      WHERE genre = 'Horror';
      ```

      returns:

      | title | price | raw_third | third | up | down |
      |---|---|---|---|---|---|
      | Frankenstein | 7.50 | 2.5000000000000000 | 2.50 | 8 | 7 |
      | Dracula | 8.25 | 2.7500000000000000 | 2.75 | 9 | 8 |
      | The Shining | 15.99 | 5.3300000000000000 | 5.33 | 16 | 15 |
      | It | 19.99 | 6.6633333333333333 | 6.66 | 20 | 19 |

      See the long tail in `raw_third`? `round(…, 2)` tidies it to 2 places.

  - kind: try
    title: "Try it: round, ceil and floor"
    body: |
      Run it and compare each column with the price. Then:

      - change `round(price / 3, 2)` to `round(price / 3, 1)`, then to `round(price / 3)`
      - add a column `abs(price - 20) AS gap_to_20`

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT title, price,
             price / 3           AS raw_third,
             round(price / 3, 2) AS third,
             ceil(price)         AS up,
             floor(price)        AS down
      FROM books
      WHERE genre = 'Horror';

  - kind: try
    title: Your turn to round
    body: |
      Return each book's `title` and its price per 100 pages (`price * 100 / pages`) **rounded to 2 decimal places**, labeled **per_100_pages**. (Without rounding, `numeric` division shows a long tail of decimals.)
    sql: |
      SELECT title, price * 100 / pages AS per_100_pages
      FROM books;
    expect: |
      SELECT title, round(price * 100 / pages, 2) AS per_100_pages
      FROM books;

  - kind: explain
    title: Date and time functions
    body: |
      | Function | Does |
      |---|---|
      | `now()` | the current moment (a `timestamptz`) |
      | `current_date` | today's date |
      | `age(later, earlier)` | the gap as years/months/days, like `9 days` or `1 year 2 mons` |
      | `date_trunc('month', x)` | cuts a timestamp down to the start of its month (or `'year'`, `'day'`, `'hour'`…) |
      | `EXTRACT(field FROM x)` | pulls out one part as a number: `YEAR`, `MONTH`, `DAY`, `DOW` (day of week)… |

      **Interval arithmetic** moves dates around: `sold_at + interval '1 month'`, `now() - interval '7 days'`.

      ```sql
      SELECT sale_id, sold_at,
             sold_at + interval '1 year'            AS one_year_later,
             (sold_at + interval '2 weeks')::date   AS two_weeks_on
      FROM sales
      WHERE sale_id <= 3;
      ```

      returns:

      | sale_id | sold_at | one_year_later | two_weeks_on |
      |---|---|---|---|
      | 1 | 2024-02-03 10:05:00+00 | 2025-02-03 10:05:00+00 | 2024-02-17 |
      | 2 | 2024-02-03 10:05:00+00 | 2025-02-03 10:05:00+00 | 2024-02-17 |
      | 3 | 2024-02-20 17:30:00+00 | 2025-02-20 17:30:00+00 | 2024-03-05 |

      Adding an interval keeps the clock time. The `::date` at the end (Module 4's cast) drops it, leaving just the day.

      `date_trunc` is how you group things "per month" (Module 10). `EXTRACT` is how you ask "which year?" or "which weekday?".

      Intervals can be compared like numbers: `age('2025-01-01'::date, birth_date) < interval '30 years'` is true for anyone who was under 30 on New Year's Day 2025.

  - kind: try
    title: Take dates apart
    body: |
      `birth_date` is a `date`. `date_trunc` returns a timestamp (with time zone), so `::date` casts it back to a plain date for readability.
    sql: |
      SELECT first_name, birth_date,
             EXTRACT(MONTH FROM birth_date) AS month_no,
             date_trunc('month', birth_date)::date AS month_start,
             age('2025-01-01'::date, birth_date) AS age_on_new_year
      FROM customers;

  - kind: try
    title: Your turn with EXTRACT
    body: |
      Inkwell sends birthday coupons at the start of each month. Return the `first_name` of every customer **born in May** (month 5). Use `EXTRACT`.
    sql: |
      SELECT first_name, birth_date
      FROM customers;
    expect: |
      SELECT first_name
      FROM customers
      WHERE EXTRACT(MONTH FROM birth_date) = 5;

  - kind: explain
    title: COALESCE, NULLIF and CASE
    body: |
      **`COALESCE(a, b, …)`** (Module 7) returns the first argument that **isn't NULL**: `COALESCE(email, 'no email')`.

      **`NULLIF(a, b)`** returns NULL if `a` equals `b`, and otherwise returns `a`. Its classic use is avoiding division by zero: `total / NULLIF(quantity, 0)` gives NULL instead of an error.

      **`CASE`** is SQL's if/else:

      ```sql
      CASE
        WHEN stock = 0  THEN 'sold out'
        WHEN stock < 10 THEN 'low'
        ELSE 'in stock'
      END
      ```

      PostgreSQL checks the `WHEN`s **top to bottom** and uses the **first** one that's true. With no `ELSE`, unmatched rows get NULL.

      <!-- page -->

      That CASE on the Science Fiction shelf:

      ```sql
      SELECT title, stock,
             CASE
               WHEN stock = 0  THEN 'sold out'
               WHEN stock < 10 THEN 'low'
               ELSE 'in stock'
             END AS shelf_status
      FROM books
      WHERE genre = 'Science Fiction';
      ```

      returns:

      | title | stock | shelf_status |
      |---|---|---|
      | 1984 | 40 | in stock |
      | Dune | 22 | in stock |
      | Foundation | 0 | sold out |
      | I, Robot | 7 | low |
      | Neuromancer | 3 | low |
      | Brave New World | 15 | in stock |

      *Foundation*'s 0 is also under 10, but the first true `WHEN` wins, so it says `sold out`.

      And `NULLIF` turning zero points into NULL (first 4 customers):

      ```sql
      SELECT first_name, loyalty_points,
             NULLIF(loyalty_points, 0) AS points_or_null
      FROM customers
      WHERE customer_id <= 4;
      ```

      | first_name | loyalty_points | points_or_null |
      |---|---|---|
      | Emma | 120 | 120 |
      | Liam | 45 | 45 |
      | Olivia | 0 | NULL |
      | Noah | 310 | 310 |

  - kind: try
    title: A default for missing values
    body: |
      Run it, then try `NULLIF(email, 'emma.johnson@example.com')` as another column and see what happens to Emma's row.
    sql: |
      SELECT first_name,
             COALESCE(email, 'no email on file') AS contact
      FROM customers;

  - kind: try
    title: "Try it: CASE"
    body: |
      The shelf-status example. Run it, then:

      - swap the two `WHEN` lines and run again: *Foundation* now says `low`, because the first true branch wins
      - delete the `ELSE` line: the well-stocked books get NULL
      - change `'Science Fiction'` to `'Fantasy'`

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT title, stock,
             CASE
               WHEN stock = 0  THEN 'sold out'
               WHEN stock < 10 THEN 'low'
               ELSE 'in stock'
             END AS shelf_status
      FROM books
      WHERE genre = 'Science Fiction';

  - kind: try
    title: Your turn with CASE
    body: |
      Return each book's `title` and a **price_band**:

      - `'bargain'` when the price is under 10
      - `'standard'` when it's under 16
      - `'premium'` otherwise
    sql: |
      SELECT title, price
      FROM books;
    expect: |
      SELECT title,
             CASE
               WHEN price < 10 THEN 'bargain'
               WHEN price < 16 THEN 'standard'
               ELSE 'premium'
             END AS price_band
      FROM books;

  - kind: try
    title: "Try it: interval arithmetic"
    body: |
      The interval example. Run it, then:

      - change `'2 weeks'` to `'3 months'`
      - change `+` to `-` to go back in time
      - remove `::date` (and the parentheses) to see the full timestamp again

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT sale_id, sold_at,
             sold_at + interval '1 year'            AS one_year_later,
             (sold_at + interval '2 weeks')::date   AS two_weeks_on
      FROM sales
      WHERE sale_id <= 3;

  - kind: try
    title: Your turn with interval arithmetic
    body: |
      Inkwell emails a "how are you enjoying it?" note **30 days after** each sale. Return each `sale_id` and the email date labeled **follow_up_on**, as a plain date.

      Hint: `sold_at + interval '...'` gives a timestamp, so finish with `::date`.
    sql: |
      SELECT sale_id, sold_at
      FROM sales;
    expect: |
      SELECT sale_id, (sold_at + interval '30 days')::date AS follow_up_on
      FROM sales;

  - kind: info
    title: "🔹 greatest and least"
    body: |
      `greatest(a, b, …)` returns the largest of its arguments, and `least(a, b, …)` the smallest, **within one row**. (Compare `max()` in Module 10, which works *across* rows.)

      ```sql
      SELECT greatest(3, 9, 4);          -- 9
      SELECT least(price, 15.00)         -- cap each price at 15
      FROM books;
      ```

      They skip NULLs, and return NULL only when every argument is NULL.

  - kind: try
    title: "Find the bug: points into money"
    body: |
      Every **100 loyalty points** are worth **1** euro. Show each customer's `first_name` and their points in euros, labeled **euros**, with cents (120 points → 1.20). This query drops the cents: 120 points shows as 1. Fix it.
    sql: |
      SELECT first_name, loyalty_points / 100 AS euros
      FROM customers;
    expect: |
      SELECT first_name, round(loyalty_points / 100.0, 2) AS euros
      FROM customers;
    hint: |
      In PostgreSQL, an integer divided by an integer gives an integer: the decimals are thrown away. Make one side a decimal number.

  - kind: why
    body: |
      Real data is messy: stray spaces, inconsistent capitals, missing values, dates you need to bucket. Functions are how you clean it and shape it into answers inside the query, without changing the stored data.

  - kind: recap
    body: |
      - Text: `||` (NULL poisons it), `concat()` (skips NULL), `length`, `upper`/`lower`, `trim`, `replace`, `split_part`, `substring`.
      - Numbers: `round(x, n)`, `ceil`, `floor`, `abs`. Round for display, at the end.
      - Dates: `now()`, `current_date`, `age()`, `date_trunc()`, `EXTRACT(… FROM …)`, and `± interval '…'`.
      - `COALESCE` = first non-NULL, `NULLIF` = "treat this value as NULL".
      - `CASE WHEN … THEN … ELSE … END`: the first true branch wins.
      - 🔹 `greatest` / `least` pick the biggest / smallest value within a row.
