pass: 3
questions:
  - type: predict
    prompt: What does this return?
    code: |
      SELECT 'Emma' || NULL AS joined;
    options:
      - "Emma"
      - "NULL"
      - "EmmaNULL"
      - An error
    answer: 1
    explanation: "Joining anything to NULL with `||` gives NULL. `concat('Emma', NULL)` would give `Emma`."

  - type: predict
    prompt: What does this return?
    code: |
      SELECT split_part('Johnson, Emma', ', ', 2) AS first_name;
    options:
      - "Johnson"
      - "Emma"
      - "Johnson, Emma"
      - "NULL"
    answer: 1
    explanation: The text is split on `', '` (comma plus space), giving the pieces Johnson and Emma. Piece 2 is Emma, with no leading space because the space was part of the separator.

  - type: predict
    prompt: What does this return?
    code: |
      SELECT round(136.666666, 2) AS per_page;
    options:
      - "136.66"
      - "136.67"
      - "137"
      - "136.666666"
    answer: 1
    explanation: "`round(x, 2)` rounds to two decimal places, and 136.666… rounds up to 136.67."

  - type: fill
    prompt: Work out price ÷ stock, but so a sold-out book (stock 0) gives NULL instead of a division-by-zero error.
    code: |
      SELECT price / ____(stock, 0) FROM books;
    answer: NULLIF
    accept: ["nullif"]
    explanation: "`NULLIF(stock, 0)` turns a 0 into NULL, and dividing by NULL gives NULL instead of an error."

  - type: mcq
    prompt: |
      A book has a stock of 0. Which label does it get?

      ```sql
      CASE
        WHEN stock < 10 THEN 'low'
        WHEN stock = 0  THEN 'sold out'
        ELSE 'in stock'
      END
      ```
    options:
      - "sold out"
      - "low"
      - "in stock"
      - Both sold out and low
    answer: 1
    explanation: CASE uses the **first** WHEN that's true. 0 < 10 is true, so it's 'low' and the 'sold out' branch is never reached. Put the most specific conditions first.
