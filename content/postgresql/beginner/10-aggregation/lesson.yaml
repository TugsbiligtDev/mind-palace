steps:
  - kind: explain
    title: Many rows in, one answer out
    body: |
      So far every query returned one result row per table row. **Aggregate functions** do the opposite: they take *many* rows and collapse them into *one* value.

      | Function | Returns |
      |---|---|
      | `count(*)` | how many rows |
      | `sum(x)` | the total of x |
      | `avg(x)` | the average of x |
      | `min(x)` / `max(x)` | the smallest / largest x |

      `sum`, `avg`, `min` and `max` **ignore NULLs**. They work with the values that exist.

  - kind: try
    title: Summarize every sale
    body: |
      One query, one row, five answers about all 30 sales.
    sql: |
      SELECT count(*)        AS sales,
             sum(quantity)   AS copies_sold,
             avg(unit_price) AS avg_price,
             min(unit_price) AS cheapest,
             max(quantity)   AS most_copies
      FROM sales;

  - kind: explain
    title: Three ways to count
    body: |
      - **`count(*)`** counts **rows**, all of them.
      - **`count(email)`** counts rows where `email` **is not NULL**.
      - **`count(DISTINCT country)`** counts **different** non-NULL values.

      The gap between the first two is a quick way to measure missing data.

  - kind: try
    title: See the difference
    body: |
      20 customers, but only 18 emails, and 16 different countries. Look at the customers' countries (Module 6): why is the USA counted twice?
    sql: |
      SELECT count(*)                AS customers,
             count(email)            AS with_email,
             count(DISTINCT country) AS countries
      FROM customers;

  - kind: explain
    title: "GROUP BY: one answer per group"
    body: |
      `GROUP BY` puts rows into **buckets** that share a value, then runs the aggregates **once per bucket**. (It doesn't sort the output. Add ORDER BY for that.)

      ```sql
      SELECT customer_email, sum(quantity) AS copies
      FROM sales
      GROUP BY customer_email;
      ```

      Picture it: all of Emma's sales go into one pile and Liam's into another, then each pile gets summed. You get **one row per group**.

      The rule: every column in `SELECT` must either be in `GROUP BY` or be inside an aggregate. Otherwise PostgreSQL wouldn't know *which* row's value to show for the whole group. (There's one exception, when you group by a table's primary key, which you'll meet in Module 11.)

  - kind: try
    title: Sales per customer
    body: |
      How many times each customer bought, and when the first and last sales were. Inkwell has 20 customers, but only 13 appear. Why? (Hint: which table is this query reading?)
    sql: |
      SELECT customer_email,
             count(*)     AS sales,
             min(sold_at) AS first_sale,
             max(sold_at) AS last_sale
      FROM sales
      GROUP BY customer_email
      ORDER BY customer_email;

  - kind: try
    title: Breaking the rule
    body: |
      `book_title` is neither grouped nor aggregated, and most customers bought several books. Run it and read the error. It's PostgreSQL asking *"which book did you mean?"*
    sql: |
      SELECT customer_email, book_title, sum(quantity)
      FROM sales
      GROUP BY customer_email;
    expect_error: true

  - kind: explain
    title: Fixing "must appear in the GROUP BY clause"
    body: |
      The full error reads:

      ```text
      ERROR:  column "sales.book_title" must appear in the GROUP BY
              clause or be used in an aggregate function
      ```

      It names the column causing trouble. Two fixes, depending on what you meant:

      1. **You wanted a row per customer *and* book**: add it to the grouping, `GROUP BY customer_email, book_title`.
      2. **You wanted one row per customer**: wrap the column in an aggregate that says which value you want, like `count(book_title)` or `max(book_title)`, or remove it.

  - kind: try
    title: Fix the grouping
    body: |
      Same broken query. Fix it the second way: keep one row per customer, and replace `book_title` with `count(book_title)` labeled **books**. Keep `sum(quantity)` labeled **copies**.
    sql: |
      SELECT customer_email, book_title, sum(quantity) AS copies
      FROM sales
      GROUP BY customer_email;
    broken_starter: true
    expect: |
      SELECT customer_email, count(book_title) AS books, sum(quantity) AS copies
      FROM sales
      GROUP BY customer_email;

  - kind: try
    title: Your turn to group
    body: |
      How many books are in each **genre**? Return `genre` and the count labeled **books**. (Notice the book with no genre: NULLs form a group of their own.)
    sql: |
      SELECT genre, title
      FROM books;
    expect: |
      SELECT genre, count(*) AS books
      FROM books
      GROUP BY genre;

  - kind: explain
    title: NULLs in aggregates
    body: |
      Aggregates **skip NULLs**, which usually makes sense, but has two surprises:

      - `avg(price)` averages only the **known** prices. A book with no price doesn't count as 0; it's left out.
      - With **no** known values at all, `sum()` and `avg()` return **NULL**, not 0. (`count()` returns 0.)

      When "nothing" should really read as zero, say so: `COALESCE(sum(price), 0)`.

  - kind: try
    title: A sum of nothing
    body: |
      Only one book has no genre yet: the upcoming *The Silent Garden*, which has no price either. Run it: 1 book, 0 priced, and the sum and average are NULL. Then change `sum(price)` to `COALESCE(sum(price), 0)`.
    sql: |
      SELECT count(*)     AS books,
             count(price) AS priced,
             sum(price)   AS total,
             avg(price)   AS average
      FROM books
      WHERE genre IS NULL;

  - kind: explain
    title: HAVING filters groups
    body: |
      `WHERE` filters **rows before** they're grouped. `HAVING` filters **groups after** they're aggregated:

      ```sql
      SELECT customer_email, sum(quantity * unit_price) AS spent
      FROM sales
      GROUP BY customer_email
      HAVING sum(quantity * unit_price) > 40;
      ```

      You can't write `WHERE sum(quantity * unit_price) > 40`, because when WHERE runs, the sums don't exist yet. That follows from the **logical order** in which PostgreSQL processes a query, which is *not* the order you type it:

      **FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT**

      This order explains a lot. For example, an alias you create in SELECT can be used in ORDER BY (which runs after SELECT) but not in WHERE or HAVING (which run before it). That's why the HAVING above repeats `sum(quantity * unit_price)` instead of using `spent`.

  - kind: try
    title: Big spenders
    body: |
      Only customers who spent more than 40 in total. Then add `WHERE quantity > 1` before `GROUP BY` and predict what changes before you run it.
    sql: |
      SELECT customer_email, sum(quantity * unit_price) AS spent
      FROM sales
      GROUP BY customer_email
      HAVING sum(quantity * unit_price) > 40;

  - kind: try
    title: Your turn with HAVING
    body: |
      Which customers have bought **more than once**? Return `customer_email` and the number of sales labeled **sales**.
    sql: |
      SELECT customer_email, sale_id
      FROM sales;
    expect: |
      SELECT customer_email, count(*) AS sales
      FROM sales
      GROUP BY customer_email
      HAVING count(*) > 1;

  - kind: info
    title: "🔹 string_agg and array_agg"
    body: |
      Some aggregates collect values instead of doing maths:

      - `string_agg(title, ', ')` glues the group's text into one string: `Emma, Pride and Prejudice`.
      - `array_agg(title)` collects them into an **array** (a list value): `{Emma,"Pride and Prejudice"}`.

      Add `ORDER BY` inside the parentheses to control the order: `string_agg(title, ', ' ORDER BY title)`.

  - kind: try
    title: Books per genre, in one line
    body: |
      One row per genre, with its books listed. Run it, then swap `string_agg(title, ', ' ORDER BY title)` for `array_agg(title)`.
    sql: |
      SELECT genre,
             string_agg(title, ', ' ORDER BY title) AS titles
      FROM books
      GROUP BY genre
      ORDER BY genre;

  - kind: try
    title: "Find the bug: busy cities"
    body: |
      *"Which customer cities have more than 2 sales?"* Run it and read the error. Then fix the query so it answers the question: `customer_city` and the number of sales labeled **sales**.
    sql: |
      SELECT customer_city, count(*) AS sales
      FROM sales
      WHERE count(*) > 2
      GROUP BY customer_city;
    broken_starter: true
    expect: |
      SELECT customer_city, count(*) AS sales
      FROM sales
      GROUP BY customer_city
      HAVING count(*) > 2;
    hint: |
      WHERE runs before the rows are grouped, so there's no count yet. Which clause filters groups?

  - kind: why
    body: |
      "How many per…?", "total by…?", "which ones have more than…?" are the questions managers, auditors and dashboards ask all day. GROUP BY and HAVING answer them in a single query.

  - kind: recap
    body: |
      - `count`, `sum`, `avg`, `min`, `max` collapse rows into one value (and ignore NULLs, except `count(*)`).
      - With no known values, `sum`/`avg` give NULL. Use `COALESCE(sum(x), 0)` when that means zero.
      - `count(*)` = rows, `count(col)` = non-NULL values, `count(DISTINCT col)` = different values.
      - `GROUP BY` gives one result row per group. SELECT columns must be grouped or aggregated. Fix the "must appear in the GROUP BY clause" error by grouping or aggregating that column.
      - `WHERE` filters rows **before** grouping, and `HAVING` filters groups **after**.
      - Logical order: **FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT**.
      - 🔹 `string_agg(col, ', ')` and `array_agg(col)` collect a group's values.
