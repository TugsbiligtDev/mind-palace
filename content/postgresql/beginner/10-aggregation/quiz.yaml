pass: 3
questions:
  - type: predict
    prompt: There are 20 customers, and 2 of them have no email. What does this return?
    code: |
      SELECT count(email) AS with_email FROM customers;
    options:
      - "20"
      - "18"
      - "2"
      - "NULL"
    answer: 1
    explanation: "`count(column)` skips NULLs, so the 2 customers with no email aren't counted. `count(*)` would give 20."

  - type: predict
    prompt: The 30 books cover 7 genres, and one book has no genre (NULL). What does this return?
    code: |
      SELECT count(DISTINCT genre) AS genres FROM books;
    options:
      - "30"
      - "8"
      - "7"
      - "NULL"
    answer: 2
    explanation: "`count(DISTINCT genre)` counts the different values that exist. The NULL isn't a value, so it isn't counted: 7."

  - type: mcq
    prompt: You want only the genres that have **more than 2** books. Which clause filters on `count(*)`?
    options:
      - "WHERE count(*) > 2"
      - "HAVING count(*) > 2"
      - "ORDER BY count(*) > 2"
      - "GROUP BY count(*) > 2"
    answer: 1
    explanation: HAVING filters groups after they've been aggregated. WHERE runs before grouping, when there are no counts yet.

  - type: fill
    prompt: Count the books in each genre.
    code: |
      SELECT genre, count(*) FROM books ____ genre;
    answer: GROUP BY
    accept: ["group by"]
    explanation: "`GROUP BY genre` puts rows with the same genre in one bucket, and `count(*)` then counts each bucket."

  - type: mcq
    prompt: In what order does PostgreSQL *logically* process these clauses?
    options:
      - SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY
      - FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY
      - FROM → SELECT → WHERE → HAVING → GROUP BY → ORDER BY
      - WHERE → FROM → GROUP BY → SELECT → HAVING → ORDER BY
    answer: 1
    explanation: Find the table, filter rows, group them, filter groups, then compute the SELECT columns, and finally sort. That's why SELECT aliases work in ORDER BY but not in WHERE.
