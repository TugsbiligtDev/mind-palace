steps:
  - kind: explain
    title: "New data: the real bookstore"
    body: |
      Until now you've used `practice`, three simple tables with no rules and no links. Nothing stopped two customers from sharing the number 21, a book from having a price of −5, or a sale from pointing at a customer who was deleted.

      From this module on, the lessons use Inkwell's proper database, **`bookstore`**: 11 connected tables (books, authors, publishers, genres, customers, orders, order lines, reviews, employees…) with keys and rules. Modules 11 to 13 explain exactly how those keys and rules work.

      On your Mac, it's built by `02_bookstore.sql` (see the *Take it to your Mac* page).

  - kind: try
    title: Meet the bookstore
    body: |
      Run it to list the 11 tables. Then try `\d books` to see a table's columns and rules.
    sql: |
      \dt

  - kind: explain
    title: Pointing at exactly one row
    body: |
      Two guests named *Anu* from *Rome* check into a hotel. Later one of them leaves. How do you remove **just that one** from the guest list?

      If every column is the same, you can't. Any WHERE that matches one matches both.

      A **primary key** (PK) is a column, or set of columns, whose value **identifies exactly one row**. Every row gets a different one, forever. It's how you say "*this* row, not any other", and it's how other tables point at a row (Module 13).

      <!-- page -->

      In `bookstore`, the key of `publishers` is `publisher_id`. Asking for one key value always gives **at most one** row:

      ```sql
      SELECT * FROM publishers WHERE publisher_id = 2;
      ```

      | publisher_id | name | country | founded_year |
      |---|---|---|---|
      | 2 | HarperCollins | USA | 1989 |

      `\d publishers` shows how the key is set up: `not null`, and filled in by the database (`generated always as identity`, explained below):

      | Column | Type | Nullable | Default |
      |---|---|---|---|
      | publisher_id | integer | not null | generated always as identity |
      | name | text | not null |  |
      | country | text |  |  |
      | founded_year | integer |  |  |

  - kind: try
    title: "Try it: one key, one row"
    body: |
      Both examples are here. Run them, then change `2` to any other number from 1 to 8: always exactly one publisher. Try `99`: no rows, because no publisher has that key.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT * FROM publishers WHERE publisher_id = 2;

      \d publishers

  - kind: try
    title: A table with no key
    body: |
      Two identical Anus, then try to delete one. Run it: RETURNING shows **both** were deleted.
    sql: |
      CREATE TABLE guests (name text, city text);
      INSERT INTO guests VALUES ('Anu', 'Rome'), ('Anu', 'Rome');

      DELETE FROM guests
      WHERE name = 'Anu' AND city = 'Rome'
      RETURNING *;

  - kind: explain
    title: PK = UNIQUE + NOT NULL
    body: |
      ```sql
      CREATE TABLE rooms (
          room_no  integer PRIMARY KEY,
          floor    integer
      );
      ```

      Declaring `PRIMARY KEY` gives you two rules at once:

      - **UNIQUE**: no two rows can have the same key.
      - **NOT NULL**: every row must have a key. An unknown ID identifies nothing.

      A table can have **only one** primary key. PostgreSQL also builds an *index* on it automatically, which makes looking rows up by key very fast (Module 32).

  - kind: try
    title: The key says no
    body: |
      Room 101 already exists. Run it and read the error: *duplicate key value violates unique constraint "rooms_pkey"*.

      Then change the second `101` to `NULL`. A different error, same idea: every row needs a key.
    sql: |
      CREATE TABLE rooms (
          room_no  integer PRIMARY KEY,
          floor    integer
      );
      INSERT INTO rooms VALUES (101, 1);
      INSERT INTO rooms VALUES (101, 2);
    expect_error: true

  - kind: explain
    title: Natural vs. surrogate keys
    body: |
      A **natural key** is a real-world value that's already unique: an email, a passport number, a book's ISBN like `978-0441172719`.

      A **surrogate key** is a meaningless number (or code) the database generates just to be the ID: `customer_id = 4`.

      Natural keys look tempting, but real-world values cause trouble:

      - **They change.** People change emails. Publishers get renamed.
      - **They're not as unique as you think.** Two people can share a phone number.
      - **They can be missing or private.** Not everyone gives a passport number.

      **Most tables use a surrogate key.** If a natural value must also be unique, add a separate UNIQUE rule for it (Module 12). That's exactly what Inkwell does: `customer_id` is the key, and `email` is UNIQUE. Likewise `book_id` is the key of `books`, and `isbn` is UNIQUE.

      ```sql
      SELECT book_id, isbn, title FROM books ORDER BY book_id LIMIT 3;
      ```

      | book_id | isbn | title |
      |---|---|---|
      | 1 | 978-0141439518 | Pride and Prejudice |
      | 2 | 978-0141439587 | Emma |
      | 3 | 978-0451524935 | 1984 |

      `book_id` (surrogate) is just a counter. `isbn` (natural) means something in the real world.

  - kind: try
    title: "Try it: two kinds of key"
    body: |
      Run it, then swap in `customers` with the columns `customer_id, email, first_name`, and order by `customer_id`. Same pattern: a counter as the key, plus a real-world value that's also unique.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT book_id, isbn, title
      FROM books
      ORDER BY book_id
      LIMIT 3;

  - kind: explain
    title: "Identity columns: the modern standard"
    body: |
      The standard way to make a surrogate key in PostgreSQL:

      ```sql
      CREATE TABLE cases (
          case_id  integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          title    text NOT NULL
      );
      ```

      - PostgreSQL hands out **1, 2, 3…** automatically. You leave the column out of INSERTs.
      - **`ALWAYS`** means you're *not allowed* to type your own ID, which prevents accidental clashes. (`GENERATED BY DEFAULT AS IDENTITY` allows it, for special cases like loading old data.)
      - Use `bigint` instead of `integer` for tables that might pass about 2 billion rows.

      Almost every table in the Inkwell Books dataset uses this.

  - kind: try
    title: IDs that fill themselves
    body: |
      Run it and look at the `case_id`s. Then try adding `case_id` to the column list with a value of `99`, and read the error.
    sql: |
      CREATE TABLE cases (
          case_id  integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          title    text NOT NULL
      );
      INSERT INTO cases (title)
      VALUES ('The Locked Archive'), ('The Garbled Telegram'), ('The Float Forgery')
      RETURNING *;

  - kind: try
    title: Gaps are normal
    body: |
      Insert, delete, insert again. The new row gets **4**, not 3. Numbers are never reused, even after a delete or a failed insert.

      That's by design: an ID must never point at two different things over time. Don't try to "fill the gaps".
    sql: |
      CREATE TABLE cases (
          case_id  integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          title    text NOT NULL
      );
      INSERT INTO cases (title) VALUES ('One'), ('Two'), ('Three');
      DELETE FROM cases WHERE case_id = 3;
      INSERT INTO cases (title) VALUES ('Four') RETURNING *;

  - kind: try
    title: Your turn to add a key
    body: |
      This `badges` table has no key, so the IDs come back empty. Change `badge_id` so PostgreSQL generates it automatically as the primary key, and run it again.
    sql: |
      CREATE TABLE badges (
          badge_id  integer,
          label     text NOT NULL
      );
      INSERT INTO badges (label)
      VALUES ('Rookie'), ('Detective')
      RETURNING *;
    expect: |
      CREATE TABLE badges (
          badge_id  integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          label     text NOT NULL
      );
      INSERT INTO badges (label)
      VALUES ('Rookie'), ('Detective')
      RETURNING *;

  - kind: info
    title: "🔹 SERIAL (the old way)"
    body: |
      In older code and tutorials you'll see:

      ```sql
      CREATE TABLE cases (case_id serial PRIMARY KEY, …);
      ```

      `serial` was the pre-2017 way to auto-number a column. It still works, but it has quirks (it lets you type your own IDs by accident, and its permissions are handled separately). Recognize it. For new tables, use `GENERATED ALWAYS AS IDENTITY`.

      **Example of the quirk.** With `serial`, someone can type an ID by hand, and the counter doesn't notice:

      ```sql
      CREATE TABLE old_cases (case_id serial PRIMARY KEY, title text);
      INSERT INTO old_cases (title)
      VALUES ('First'), ('Second');        -- get 1 and 2
      INSERT INTO old_cases (case_id, title)
      VALUES (3, 'Typed by hand'); -- allowed!
      INSERT INTO old_cases (title)
      VALUES ('Third');                     -- counter hands out 3
      ```

      ```text
      ERROR:  duplicate key value violates unique constraint "old_cases_pkey"
      ```

      With `GENERATED ALWAYS AS IDENTITY`, the hand-typed 3 would have been refused at once, so the clash could never happen.

  - kind: try
    title: "Try it: serial's trap"
    body: |
      Run it and read the error on the last line. Then change `serial` to `integer GENERATED ALWAYS AS IDENTITY` and run again: now the hand-typed ID is the line that's refused. Delete that line, and everything runs.

      To continue, make it run without an error: the change above does it.
    sql: |
      CREATE TABLE old_cases (case_id serial PRIMARY KEY, title text);
      INSERT INTO old_cases (title)
      VALUES ('First'), ('Second')
      RETURNING *;
      INSERT INTO old_cases (case_id, title)
      VALUES (3, 'Typed by hand');
      INSERT INTO old_cases (title) VALUES ('Third');
    broken_starter: true

  - kind: explain
    title: UUID keys
    body: |
      A **UUID** is a 128-bit ID written like `0199a3b2-7c1e-7d40-9f8a-3c2b1e0d4a57`. It's so random that two computers can generate them independently and never clash.

      - `gen_random_uuid()` makes a completely random one (version 4).
      - `uuidv7()` (**new in PostgreSQL 18**) starts with a timestamp, so new IDs sort roughly in creation order. That keeps indexes efficient, so prefer it for keys.

      **Choose UUIDs when** IDs are created in many places (phones, several servers), when merging data from different systems, or when you don't want IDs to be guessable in URLs (`/orders/1043` invites trying `/orders/1044`).

      **Stick with identity numbers** otherwise: they're smaller (4 or 8 bytes vs. 16), faster, and easy to read aloud.

  - kind: try
    title: Make some UUIDs
    body: |
      Run it twice: the values change every time. Notice that the `uuidv7` values from one run start with the same characters. That's the timestamp.
    sql: |
      SELECT gen_random_uuid() AS random_v4,
             uuidv7()          AS time_ordered_v7
      FROM generate_series(1, 3);   -- just makes 3 rows

  - kind: explain
    title: Composite primary keys
    body: |
      Sometimes no single column is unique, but a **combination** is. On a flight, seat `12A` exists on every flight, and flight `MN301` has many seats, but *flight + seat* is unique:

      ```sql
      CREATE TABLE seat_assignments (
          flight_no  text,
          seat       text,
          passenger  text NOT NULL,
          PRIMARY KEY (flight_no, seat)
      );
      ```

      Note the different spelling: a key made of several columns goes on **its own line** at the end. You'll use composite keys for *junction tables* in Module 13.

  - kind: try
    title: Same seat, different flights
    body: |
      Seat 12A on two different flights is fine. Run it. Then add a third row that puts someone else in `('MN301', '12A')` and see the error.
    sql: |
      CREATE TABLE seat_assignments (
          flight_no  text,
          seat       text,
          passenger  text NOT NULL,
          PRIMARY KEY (flight_no, seat)
      );
      INSERT INTO seat_assignments VALUES
        ('MN301', '12A', 'Emma Johnson'),
        ('MN302', '12A', 'Liam Smith')
      RETURNING *;

  - kind: info
    title: "Bonus: GROUP BY a primary key"
    body: |
      Module 10 said every SELECT column must be grouped or aggregated, with one exception. Here it is: if you **group by a table's primary key**, you may select that table's other columns too. PostgreSQL knows each key has exactly one name, one country and so on, so there's no "which value?" question:

      ```sql
      SELECT publisher_id, name, country
      FROM publishers
      GROUP BY publisher_id;   -- works: publisher_id is the PK
      ```

      The first three rows:

      | publisher_id | name | country |
      |---|---|---|
      | 1 | Penguin Classics | UK |
      | 2 | HarperCollins | USA |
      | 3 | Tor Books | USA |

      It becomes handy with joins in Module 14.

  - kind: try
    title: "Try it: GROUP BY the key"
    body: |
      Run it: no error, even though `name` and `country` aren't in GROUP BY. Then change `GROUP BY publisher_id` to `GROUP BY country` and read the error: `country` isn't a key, so PostgreSQL asks which `name` you meant.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT publisher_id, name, country
      FROM publishers
      GROUP BY publisher_id
      ORDER BY publisher_id;

  - kind: try
    title: "Find the bug: the ID that was refused"
    body: |
      A new case file goes into `cases`, whose `case_id` is `GENERATED ALWAYS AS IDENTITY`. Run it and read the error. Fix the INSERT so PostgreSQL chooses the ID, and keep the SELECT.
    sql: |
      CREATE TABLE cases (
          case_id  integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          title    text NOT NULL
      );
      INSERT INTO cases (case_id, title)
      VALUES (1, 'The missing invoice');
      SELECT * FROM cases;
    broken_starter: true
    expect: |
      CREATE TABLE cases (
          case_id  integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          title    text NOT NULL
      );
      INSERT INTO cases (title) VALUES ('The missing invoice');
      SELECT * FROM cases;
    hint: |
      GENERATED ALWAYS means the database always picks the value. Leave `case_id` out of the column list and the VALUES.

  - kind: try
    title: "Your turn with a composite key"
    body: |
      Inkwell's shelves have numbered positions. Create **shelf_positions** with `shelf_id` (integer), `position` (integer) and `book_id` (integer). Each **position on a shelf** holds one book, but position 1 exists on every shelf. Neither `shelf_id` nor `position` may be empty.

      Checked by trying some rows.
    sql: |
      -- Write your CREATE TABLE here
    expect: |
      CREATE TABLE shelf_positions (
          shelf_id  integer,
          position  integer,
          book_id   integer,
          PRIMARY KEY (shelf_id, position)
      );
    state_query: |
      CREATE FUNCTION pg_temp.run_tests() RETURNS TABLE (test text, result text) LANGUAGE plpgsql AS $$
      DECLARE t record;
      BEGIN
        FOR t IN SELECT * FROM (VALUES
          (1, $l$shelf 1, position 1$l$, $q$INSERT INTO shelf_positions VALUES (1, 1, 10)$q$),
          (2, $l$shelf 2, position 1$l$, $q$INSERT INTO shelf_positions VALUES (2, 1, 11)$q$),
          (3, $l$shelf 1, position 1 again$l$, $q$INSERT INTO shelf_positions VALUES (1, 1, 12)$q$),
          (4, $l$a position with no shelf$l$, $q$INSERT INTO shelf_positions VALUES (NULL, 3, 12)$q$),
          (5, $l$a shelf with no position$l$, $q$INSERT INTO shelf_positions VALUES (3, NULL, 12)$q$)
        ) AS v(n, label, sql) ORDER BY n LOOP
          test := t.label;
          BEGIN
            EXECUTE t.sql;
            result := 'accepted';
          EXCEPTION WHEN division_by_zero THEN
            result := 'wrong';
          WHEN OTHERS THEN
            result := CASE WHEN SQLSTATE IN ('42P01', '42703') THEN 'missing table or column' ELSE 'rejected' END;
          END;
          RETURN NEXT;
        END LOOP;
      END $$;
      SELECT test, result FROM pg_temp.run_tests();
    hint: |
      A primary key over **two** columns: the pair must be unique, and both parts are NOT NULL automatically.
    reject:
      - |
        CREATE TABLE shelf_positions (shelf_id integer PRIMARY KEY, position integer, book_id integer);
      - |
        CREATE TABLE shelf_positions (shelf_id integer, position integer, book_id integer);

  - kind: try
    title: "Your turn with a UUID key"
    body: |
      Gift cards get unguessable IDs. Create **gift_cards** with `card_id` as a **uuid** primary key that fills itself (`gen_random_uuid()`), and `amount` as `numeric(8,2)`. Then insert two cards, worth **20** and **50**, giving only the amount.
    sql: |
      -- Write your statements here
    expect: |
      CREATE TABLE gift_cards (
          card_id  uuid PRIMARY KEY DEFAULT gen_random_uuid(),
          amount   numeric(8,2)
      );
      INSERT INTO gift_cards (amount) VALUES (20), (50);
    state_query: |
      SELECT amount, card_id IS NOT NULL AS has_id,
             (SELECT data_type FROM information_schema.columns
              WHERE table_name = 'gift_cards' AND column_name = 'card_id') AS id_type
      FROM gift_cards ORDER BY amount;
    hint: |
      A column can have a DEFAULT that calls a function. `uuid` is the type.

  - kind: why
    body: |
      Every update, delete and link between tables depends on being able to point at exactly one row. A good primary key is the first thing you decide when you design a table, and the hardest thing to change later.

  - kind: recap
    body: |
      - A **primary key** identifies exactly one row: **UNIQUE + NOT NULL**, one per table.
      - **Natural keys** (email, code) change and clash. Prefer a **surrogate key** plus UNIQUE on natural values.
      - Standard: `integer` / `bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY`. Gaps are normal.
      - 🔹 `serial` is the legacy version. Recognize it, don't use it.
      - **UUIDs** (`uuidv7()` in PG18, or `gen_random_uuid()`) for IDs made in many places or that shouldn't be guessable.
      - **Composite key**: `PRIMARY KEY (col_a, col_b)`, where the combination is unique.
