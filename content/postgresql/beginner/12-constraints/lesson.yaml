steps:
  - kind: explain
    title: Rules that live in the database
    body: |
      A **constraint** is a rule attached to a table. PostgreSQL checks it on **every** INSERT and UPDATE, and refuses any change that breaks it.

      Why put rules in the database instead of the app? Because data arrives from many places: the website, a mobile app, an import script, someone typing in psql at midnight. The database is the one place **all** of them pass through. It's the last line of defense.

      You've met one already: the PRIMARY KEY. This module covers the rest.

  - kind: explain
    title: NOT NULL
    body: |
      ```sql
      full_name  text NOT NULL
      ```

      **`NOT NULL`** means the column must always have a value. Use it for anything that must be known for the row to make sense: a trip's name, a review's rating.

      Columns **allow NULL by default**, so you have to ask for NOT NULL. A good habit: start every column as NOT NULL, and allow NULL only when a value can truly be unknown (Module 7).

  - kind: try
    title: A traveler with no name
    body: |
      `travelers.full_name` is NOT NULL. This INSERT leaves it out. Run it and read the error.
    sql: |
      INSERT INTO travelers (email, home_city)
      VALUES ('ghost@example.com', 'Oslo');
    expect_error: true

  - kind: explain
    title: UNIQUE
    body: |
      ```sql
      email  text UNIQUE
      ```

      **`UNIQUE`** means no two rows may share the same value in that column. It's how you protect natural values like emails or usernames while a surrogate key does the identifying (Module 11).

      A UNIQUE rule can cover **several columns together**, written on its own line:

      ```sql
      UNIQUE (trip_id, visit_order)   -- each trip has one stop #1, one stop #2…
      ```

  - kind: try
    title: Two Aminas, one email
    body: |
      `amina@example.com` is already taken. Run it and read the error. The `DETAIL` line shows exactly which value clashed.
    sql: |
      INSERT INTO travelers (full_name, email)
      VALUES ('Amina Y.', 'amina@example.com');
    expect_error: true

  - kind: explain
    title: UNIQUE and NULL
    body: |
      Here's a surprise: a UNIQUE column can hold **many NULLs**.

      Remember that `NULL = NULL` is *unknown*, not true (Module 7). Two unknown emails aren't known to be the same, so they don't clash. That's usually what you want: many travelers can have *no* email, but no two can have the *same* email.

  - kind: try
    title: Many missing emails
    body: |
      Dulguun already has a NULL email. Two more travelers without email go in fine. Run it.
    sql: |
      INSERT INTO travelers (full_name, email)
      VALUES ('Nomin Bat', NULL), ('Tomas Ruiz', NULL);

      SELECT full_name, email
      FROM travelers
      WHERE email IS NULL;

  - kind: info
    title: "🔹 UNIQUE NULLS NOT DISTINCT"
    body: |
      If you want **at most one** NULL (say, only one "default" address per customer), PostgreSQL 15+ lets you say so:

      ```sql
      UNIQUE NULLS NOT DISTINCT (customer_id, label)
      ```

      Now NULLs count as equal to each other for this rule.

  - kind: explain
    title: CHECK
    body: |
      **`CHECK`** is a custom rule, any true/false condition:

      ```sql
      rating     integer NOT NULL CHECK (rating BETWEEN 1 AND 5),
      entry_fee  numeric(6,2) CHECK (entry_fee >= 0)
      ```

      A CHECK can compare **several columns** too. Written on its own line, it's a *table* constraint:

      ```sql
      CHECK (end_date >= start_date)
      ```

      One catch: a CHECK **passes when the result is unknown**. `CHECK (price > 0)` lets NULL through, because `NULL > 0` isn't false. If the value is required, add NOT NULL as well.

  - kind: try
    title: CHECK lets NULL through
    body: |
      Run it. The NULL price was accepted even though the rule says `price > 0`. Then change NULL to `-5` and run it again.
    sql: |
      CREATE TABLE tours (
          name   text NOT NULL,
          price  numeric(8,2) CHECK (price > 0)
      );
      INSERT INTO tours VALUES ('Gobi Sunset', NULL)
      RETURNING *;

  - kind: explain
    title: DEFAULT
    body: |
      **`DEFAULT`** gives a column a value to use when an INSERT leaves it out (Module 5):

      ```sql
      status      text NOT NULL DEFAULT 'planned',
      created_at  timestamptz NOT NULL DEFAULT now(),
      is_active   boolean NOT NULL DEFAULT true
      ```

      `DEFAULT` + `NOT NULL` is a great pair: the value is never missing, and nobody has to remember to supply it.

  - kind: explain
    title: Name your constraints
    body: |
      If you don't name a constraint, PostgreSQL invents a name like `reviews_rating_check` or `travelers_email_key`. That's OK, but your own names make errors clearer and are easier to refer to later (dropping a rule needs its name, Module 15):

      ```sql
      CREATE TABLE stays (
          stay_id    integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          nights     integer NOT NULL,
          check_in   date NOT NULL,
          check_out  date NOT NULL,
          CONSTRAINT stays_nights_positive CHECK (nights > 0),
          CONSTRAINT stays_dates_in_order  CHECK (check_out > check_in)
      );
      ```

      A common pattern is `table_column_rule`.

  - kind: try
    title: Your turn to add named rules
    body: |
      Add two named constraints to `stays`, each on its own line after the columns:

      - **`stays_nights_positive`**: nights must be greater than 0
      - **`stays_dates_in_order`**: check_out must be after check_in

      The last line lists the table's constraints so you can check your work: `c` = check, `p` = primary key, `n` = not null. (Since PostgreSQL 18, NOT NULL rules get names too.)
    sql: |
      CREATE TABLE stays (
          stay_id    integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          nights     integer NOT NULL,
          check_in   date NOT NULL,
          check_out  date NOT NULL
      );

      SELECT conname, contype
      FROM pg_constraint
      WHERE conrelid = 'stays'::regclass
      ORDER BY conname;
    expect: |
      CREATE TABLE stays (
          stay_id    integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          nights     integer NOT NULL,
          check_in   date NOT NULL,
          check_out  date NOT NULL,
          CONSTRAINT stays_nights_positive CHECK (nights > 0),
          CONSTRAINT stays_dates_in_order  CHECK (check_out > check_in)
      );

      SELECT conname, contype
      FROM pg_constraint
      WHERE conrelid = 'stays'::regclass
      ORDER BY conname;

  - kind: explain
    title: Reading constraint errors
    body: |
      Constraint errors tell you exactly what went wrong. The three you'll meet most:

      ```text
      ERROR:  null value in column "full_name" of relation "travelers"
              violates not-null constraint
      ```

      ```text
      ERROR:  duplicate key value violates unique constraint "travelers_email_key"
      DETAIL:  Key (email)=(amina@example.com) already exists.
      ```

      ```text
      ERROR:  new row for relation "reviews" violates check constraint
              "reviews_rating_check"
      DETAIL:  Failing row contains (8, 1, 1, 6, null, 2026-09-26).
      ```

      Read them in this order: **which table**, **which constraint** (its name hints at the rule), then the **DETAIL** line with the offending value.

  - kind: try
    title: Fix the data
    body: |
      This INSERT breaks a rule. Run it, read which constraint fails, and fix the **value** (not the rule!) so the review is saved. Chen meant "the best possible", so use the highest rating the rule allows.
    sql: |
      INSERT INTO reviews (attraction_id, traveler_id, rating, review_text)
      VALUES (9, 3, 10, 'Excellent.')
      RETURNING attraction_id, rating;
    broken_starter: true
    expect: |
      INSERT INTO reviews (attraction_id, traveler_id, rating, review_text)
      VALUES (9, 3, 5, 'Excellent.')
      RETURNING attraction_id, rating;

  - kind: why
    body: |
      Bad data is expensive: a negative price in a bill, a trip that ends before it starts, two accounts with one email. Constraints stop these at the door, for every app and every person, forever, with a few words in CREATE TABLE.

  - kind: recap
    body: |
      - Constraints are rules PostgreSQL checks on every INSERT and UPDATE.
      - `NOT NULL`: must have a value. Columns allow NULL unless you say otherwise.
      - `UNIQUE`: no repeats (one column or several). Many NULLs are allowed. 🔹 `NULLS NOT DISTINCT` changes that.
      - `CHECK (condition)`: any rule, even across columns. It passes on NULL, so add NOT NULL too when needed.
      - `DEFAULT value`: used when an INSERT leaves the column out.
      - Name them: `CONSTRAINT table_column_rule CHECK (…)`.
      - Errors name the table, the constraint and (in DETAIL) the bad value. Fix the data, not the rule.
