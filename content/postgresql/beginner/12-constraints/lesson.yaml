steps:
  - kind: explain
    title: Rules that live in the database
    body: |
      A **constraint** is a rule attached to a table. PostgreSQL checks it on **every** INSERT and UPDATE, and refuses any change that breaks it.

      Why put rules in the database instead of the app? Because data arrives from many places: the website, a mobile app, an import script, someone typing in psql at midnight. The database is the one place **all** of them pass through. It's the last line of defense.

      You've met one already: the PRIMARY KEY. This module covers the rest.

      **Example.** `books` has a rule that a price can't be negative. Try to break it:

      ```sql
      UPDATE books SET price = -5 WHERE book_id = 1;
      ```

      ```text
      ERROR:  new row for relation "books" violates check constraint "books_price_check"
      ```

      The price stays as it was. It doesn't matter who sends the UPDATE, the website or you in psql: the rule applies to everyone.

  - kind: try
    title: "Try it: a rule says no"
    body: |
      Run it and read the error. Then change `-5` to `12.50`: allowed, so the row is updated.

      To continue, make it run without an error: the change above does it.
    sql: |
      UPDATE books SET price = -5 WHERE book_id = 1;
    broken_starter: true

  - kind: explain
    title: NOT NULL
    body: |
      ```sql
      last_name  text NOT NULL
      ```

      **`NOT NULL`** means the column must always have a value. Use it for anything that must be known for the row to make sense: a book's title, a review's rating.

      Columns **allow NULL by default**, so you have to ask for NOT NULL. A good habit: start every column as NOT NULL, and allow NULL only when a value can truly be unknown (Module 7).

  - kind: try
    title: A customer with no last name
    body: |
      `customers.last_name` is NOT NULL. This INSERT leaves it out. Run it and read the error.
    sql: |
      INSERT INTO customers (first_name, email, city)
      VALUES ('Ghost', 'ghost@example.com', 'Oslo');
    expect_error: true

  - kind: explain
    title: UNIQUE
    body: |
      ```sql
      email  text UNIQUE
      ```

      **`UNIQUE`** means no two rows may share the same value in that column. It's how you protect natural values like emails or usernames while a surrogate key does the identifying (Module 11).

      A UNIQUE rule can cover **several columns together**, written on its own line:

      ```sql
      UNIQUE (book_id, customer_id)   -- one review per customer per book
      ```

  - kind: try
    title: Two Emmas, one email
    body: |
      `emma.johnson@example.com` is already taken. Run it and read the error. The `DETAIL` line shows exactly which value clashed.
    sql: |
      INSERT INTO customers (first_name, last_name, email)
      VALUES ('Emma', 'J.', 'emma.johnson@example.com');
    expect_error: true

  - kind: explain
    title: UNIQUE and NULL
    body: |
      Here's a surprise: a UNIQUE column can hold **many NULLs**.

      Remember that `NULL = NULL` is *unknown*, not true (Module 7). Two unknown ISBNs aren't known to be the same, so they don't clash. That's usually what you want: `books.isbn` is UNIQUE, and many books can have *no* ISBN (a staff-made booklet, say), but no two can have the *same* ISBN.

  - kind: try
    title: Many missing ISBNs
    body: |
      Every book has an ISBN so far. Two new booklets without one go in fine. Run it.
    sql: |
      INSERT INTO books (title, genre_id, price, isbn)
      VALUES ('Staff Picks 2025', 6, 0, NULL),
             ('Local Poets',      9, 4.50, NULL);

      SELECT title, isbn
      FROM books
      WHERE isbn IS NULL;

  - kind: info
    title: "🔹 UNIQUE NULLS NOT DISTINCT"
    body: |
      If you want **at most one** NULL (say, only one "default" address per customer), PostgreSQL 15+ lets you say so:

      ```sql
      UNIQUE NULLS NOT DISTINCT (customer_id, label)
      ```

      Now NULLs count as equal to each other for this rule.

  - kind: try
    title: "Try it: NULLS NOT DISTINCT"
    body: |
      Each customer may have one address with **no** label. Run it: the first INSERT adds three rows (Home, Work, and one with no label), and the second is refused, because customer 1 already has an unlabeled address.

      Then delete the words `NULLS NOT DISTINCT` and run it again: both NULL rows are accepted, because plain UNIQUE treats two NULLs as different.

      To continue, make it run without an error: the change above does it.
    sql: |
      CREATE TABLE addresses (
          customer_id  integer NOT NULL,
          label        text,
          UNIQUE NULLS NOT DISTINCT (customer_id, label)
      );
      INSERT INTO addresses
      VALUES (1, 'Home'), (1, 'Work'), (1, NULL);
      INSERT INTO addresses VALUES (1, NULL);
    broken_starter: true

  - kind: explain
    title: CHECK
    body: |
      **`CHECK`** is a custom rule, any true/false condition:

      ```sql
      rating  integer NOT NULL CHECK (rating BETWEEN 1 AND 5),
      price   numeric(8,2) CHECK (price >= 0)
      ```

      A CHECK can compare **several columns** too. Written on its own line, it's a *table* constraint:

      ```sql
      CHECK (ends_on >= starts_on)
      ```

      Inkwell's `reviews.rating` has a rule like the first one, so a 6-star review is refused:

      ```sql
      INSERT INTO reviews (book_id, customer_id, rating) VALUES (2, 1, 6);
      ```

      ```text
      ERROR:  new row for relation "reviews" violates check constraint "reviews_rating_check"
      ```

      Change the 6 to any number from 1 to 5 and it goes in.

      <!-- page -->

      One catch: a CHECK **passes when the result is unknown**. `CHECK (price > 0)` lets NULL through, because `NULL > 0` isn't false. If the value is required, add NOT NULL as well.

  - kind: try
    title: CHECK lets NULL through
    body: |
      Run it. The NULL price was accepted even though the rule says `price > 0`. Then change NULL to `-5` and run it again.
    sql: |
      CREATE TABLE gift_cards (
          code   text NOT NULL,
          price  numeric(8,2) CHECK (price > 0)
      );
      INSERT INTO gift_cards VALUES ('GC-001', NULL)
      RETURNING *;

  - kind: explain
    title: DEFAULT
    body: |
      **`DEFAULT`** gives a column a value to use when an INSERT leaves it out (Module 5):

      ```sql
      status      text NOT NULL DEFAULT 'pending',
      created_at  timestamptz NOT NULL DEFAULT now(),
      is_active   boolean NOT NULL DEFAULT true
      ```

      `DEFAULT` + `NOT NULL` is a great pair: the value is never missing, and nobody has to remember to supply it.

      <!-- page -->

      A support-ticket table where only the subject is required:

      ```sql
      CREATE TABLE tickets (
          ticket_id   integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          subject     text NOT NULL,
          status      text NOT NULL DEFAULT 'pending',
          is_urgent   boolean NOT NULL DEFAULT false
      );
      INSERT INTO tickets (subject) VALUES ('Lost parcel') RETURNING *;
      ```

      Only the subject was given; the defaults filled the rest (`f` is how PostgreSQL shows `false`):

      | ticket_id | subject | status | is_urgent |
      |---|---|---|---|
      | 1 | Lost parcel | pending | f |

      Give a value and it replaces the default:

      ```sql
      INSERT INTO tickets (subject, is_urgent)
      VALUES ('Wrong book sent', true)
      RETURNING *;
      ```

      | ticket_id | subject | status | is_urgent |
      |---|---|---|---|
      | 2 | Wrong book sent | pending | t |

  - kind: try
    title: "Try it: DEFAULT"
    body: |
      Both examples are here. Run them and compare with the tables you just saw.

      Then play: add a column `created_at timestamptz NOT NULL DEFAULT now()` and run it again, or give `status` a value of your own, like `'closed'`, in the second INSERT.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      CREATE TABLE tickets (
          ticket_id   integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          subject     text NOT NULL,
          status      text NOT NULL DEFAULT 'pending',
          is_urgent   boolean NOT NULL DEFAULT false
      );
      INSERT INTO tickets (subject)
      VALUES ('Lost parcel')
      RETURNING *;

      INSERT INTO tickets (subject, is_urgent)
      VALUES ('Wrong book sent', true)
      RETURNING *;

  - kind: explain
    title: Name your constraints
    body: |
      If you don't name a constraint, PostgreSQL invents a name like `reviews_rating_check` or `customers_email_key`. That's OK, but your own names make errors clearer and are easier to refer to later (dropping a rule needs its name, Module 15):

      ```sql
      CREATE TABLE promotions (
          promo_id     integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          percent_off  integer NOT NULL,
          starts_on    date NOT NULL,
          ends_on      date NOT NULL,
          CONSTRAINT promotions_percent_positive CHECK (percent_off > 0),
          CONSTRAINT promotions_dates_in_order    CHECK (ends_on > starts_on)
      );
      ```

      A common pattern is `table_column_rule`.

  - kind: try
    title: Your turn to add named rules
    body: |
      Add two named constraints to `promotions`, each on its own line after the columns:

      - **`promotions_percent_positive`**: percent_off must be greater than 0
      - **`promotions_dates_in_order`**: ends_on must be after starts_on

      The last query is a ready-made helper that lists the table's rules, so you can check your work. Each rule's kind is shown as one letter: `c` is a check, `p` the primary key, `n` a not-null rule. (Since PostgreSQL 18, NOT NULL rules get names too, so they're listed as well.)
    sql: |
      CREATE TABLE promotions (
          promo_id     integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          percent_off  integer NOT NULL,
          starts_on    date NOT NULL,
          ends_on      date NOT NULL
      );

      -- A ready-made helper that lists the table's rules. You don't need to understand how it works.
      SELECT conname, contype
      FROM pg_constraint
      WHERE conrelid = 'promotions'::regclass
      ORDER BY conname;
    expect: |
      CREATE TABLE promotions (
          promo_id     integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          percent_off  integer NOT NULL,
          starts_on    date NOT NULL,
          ends_on      date NOT NULL,
          CONSTRAINT promotions_percent_positive CHECK (percent_off > 0),
          CONSTRAINT promotions_dates_in_order    CHECK (ends_on > starts_on)
      );

      -- A ready-made helper that lists the table's rules. You don't need to understand how it works.
      SELECT conname, contype
      FROM pg_constraint
      WHERE conrelid = 'promotions'::regclass
      ORDER BY conname;

  - kind: explain
    title: Reading constraint errors
    body: |
      Constraint errors tell you exactly what went wrong. The three you'll meet most:

      ```text
      ERROR:  null value in column "last_name" of relation "customers"
              violates not-null constraint
      ```

      ```text
      ERROR:  duplicate key value violates unique constraint "customers_email_key"
      DETAIL:  Key (email)=(emma.johnson@example.com) already exists.
      ```

      ```text
      ERROR:  new row for relation "reviews" violates check constraint
              "reviews_rating_check"
      DETAIL:  Failing row contains (27, 2, 1, 6, null, 2026-09-26 10:00:00+00).
      ```

      Read them in this order: **which table**, **which constraint** (its name hints at the rule), then the **DETAIL** line with the offending value.

  - kind: try
    title: Fix the data
    body: |
      This INSERT breaks a rule. Run it, read which constraint fails, and fix the **value** (not the rule!) so the review is saved. Olivia (customer 3) meant "the best possible", so use the highest rating the rule allows.
    sql: |
      INSERT INTO reviews (book_id, customer_id, rating, comment)
      VALUES (20, 3, 10, 'Excellent.')
      RETURNING book_id, rating;
    broken_starter: true
    expect: |
      INSERT INTO reviews (book_id, customer_id, rating, comment)
      VALUES (20, 3, 5, 'Excellent.')
      RETURNING book_id, rating;

  - kind: try
    title: "Find the bug: the rule that lets everything through"
    body: |
      Discounts must be **between 1 and 90** percent. This table was given a rule, yet a 150% discount went in. Find the mistake in the CHECK and fix it. Checked by trying some discounts.
    sql: |
      CREATE TABLE coupons (
          code          text PRIMARY KEY,
          discount_pct  integer CHECK (discount_pct >= 1 OR discount_pct <= 90)
      );
      INSERT INTO coupons VALUES ('HUGE', 150);
      SELECT * FROM coupons;
    expect: |
      CREATE TABLE coupons (
          code          text PRIMARY KEY,
          discount_pct  integer CHECK (discount_pct >= 1 AND discount_pct <= 90)
      );
    state_query: |
      CREATE FUNCTION pg_temp.run_tests() RETURNS TABLE (test text, result text) LANGUAGE plpgsql AS $$
      DECLARE t record;
      BEGIN
        FOR t IN SELECT * FROM (VALUES
          (1, $l$150%$l$, $q$INSERT INTO coupons VALUES ('T150', 150)$q$),
          (2, $l$0%$l$, $q$INSERT INTO coupons VALUES ('T0', 0)$q$),
          (3, $l$1%$l$, $q$INSERT INTO coupons VALUES ('T1', 1)$q$),
          (4, $l$90%$l$, $q$INSERT INTO coupons VALUES ('T90', 90)$q$),
          (5, $l$91%$l$, $q$INSERT INTO coupons VALUES ('T91', 91)$q$)
        ) AS v(n, label, sql) ORDER BY n LOOP
          test := t.label;
          BEGIN
            EXECUTE t.sql;
            result := 'accepted';
          EXCEPTION WHEN division_by_zero THEN
            result := 'wrong';
          WHEN OTHERS THEN
            result := CASE WHEN SQLSTATE IN ('42P01', '42703') THEN 'missing table or column' ELSE 'rejected' END;
          END;
          RETURN NEXT;
        END LOOP;
      END $$;
      SELECT test, result FROM pg_temp.run_tests();
    hint: |
      Every number is either at least 1 **or** at most 90. Both conditions must hold. (Remove the INSERT of the bad row too, once the rule works.)

  - kind: try
    title: "Your turn with a two-column UNIQUE"
    body: |
      Create **shelf_books** with `shelf` (text) and `book_id` (integer). A book may sit on **several** shelves, but never **twice on the same** shelf. Checked by trying some rows.
    sql: |
      -- Write your CREATE TABLE here
    expect: |
      CREATE TABLE shelf_books (
          shelf    text,
          book_id  integer,
          UNIQUE (shelf, book_id)
      );
    state_query: |
      CREATE FUNCTION pg_temp.run_tests() RETURNS TABLE (test text, result text) LANGUAGE plpgsql AS $$
      DECLARE t record;
      BEGIN
        FOR t IN SELECT * FROM (VALUES
          (1, $l$Dune on Staff picks$l$, $q$INSERT INTO shelf_books VALUES ('Staff picks', 7)$q$),
          (2, $l$Dune on Summer reads$l$, $q$INSERT INTO shelf_books VALUES ('Summer reads', 7)$q$),
          (3, $l$Dune on Staff picks again$l$, $q$INSERT INTO shelf_books VALUES ('Staff picks', 7)$q$),
          (4, $l$Emma on Staff picks$l$, $q$INSERT INTO shelf_books VALUES ('Staff picks', 2)$q$)
        ) AS v(n, label, sql) ORDER BY n LOOP
          test := t.label;
          BEGIN
            EXECUTE t.sql;
            result := 'accepted';
          EXCEPTION WHEN division_by_zero THEN
            result := 'wrong';
          WHEN OTHERS THEN
            result := CASE WHEN SQLSTATE IN ('42P01', '42703') THEN 'missing table or column' ELSE 'rejected' END;
          END;
          RETURN NEXT;
        END LOOP;
      END $$;
      SELECT test, result FROM pg_temp.run_tests();
    hint: |
      A UNIQUE constraint can cover a **combination** of columns, written as its own line: `UNIQUE (col1, col2)`.
    reject:
      - |
        CREATE TABLE shelf_books (shelf text, book_id integer UNIQUE);

  - kind: why
    body: |
      Bad data is expensive: a negative price in a bill, a sale that ends before it starts, two accounts with one email. Constraints stop these at the door, for every app and every person, forever, with a few words in CREATE TABLE.

  - kind: recap
    body: |
      - Constraints are rules PostgreSQL checks on every INSERT and UPDATE.
      - `NOT NULL`: must have a value. Columns allow NULL unless you say otherwise.
      - `UNIQUE`: no repeats (one column or several). Many NULLs are allowed. 🔹 `NULLS NOT DISTINCT` changes that.
      - `CHECK (condition)`: any rule, even across columns. It passes on NULL, so add NOT NULL too when needed.
      - `DEFAULT value`: used when an INSERT leaves the column out.
      - Name them: `CONSTRAINT table_column_rule CHECK (…)`.
      - Errors name the table, the constraint and (in DETAIL) the bad value. Fix the data, not the rule.
