pass: 3
questions:
  - type: mcq
    prompt: "A column is declared `isbn text UNIQUE`. Can two rows both have a NULL isbn?"
    options:
      - No, UNIQUE forbids any repeated value, NULL included
      - Yes, because two NULLs aren't considered equal
      - Only if the column has no NOT NULL rule as well
      - Only one NULL is allowed; the second one is an error
    answer: 1
    explanation: "NULL = NULL is unknown, not true, so NULLs don't clash under a normal UNIQUE rule. Use `UNIQUE NULLS NOT DISTINCT` to allow only one."

  - type: predict
    prompt: What does this return?
    code: |
      CREATE TABLE tickets (price numeric CHECK (price > 0));
      INSERT INTO tickets VALUES (NULL);
      SELECT count(*) FROM tickets;
    options:
      - "0"
      - "1"
      - "NULL"
      - An error
    answer: 1
    explanation: "`NULL > 0` is unknown, and a CHECK only rejects rows where the condition is false. The NULL row goes in, so the count is 1."

  - type: fill
    prompt: Make a promotion's end date come on or after its start date.
    code: |
      CREATE TABLE sale_plans (
          starts_on date NOT NULL,
          ends_on   date,
          ____ (ends_on >= starts_on)
      );
    answer: CHECK
    accept: ["check"]
    explanation: A CHECK written on its own line can compare several columns.

  - type: mcq
    prompt: "Which constraint does this error come from? `DETAIL: Key (email)=(emma.johnson@example.com) already exists.`"
    options:
      - NOT NULL
      - CHECK
      - UNIQUE
      - DEFAULT
    answer: 2
    explanation: "\"Key … already exists\" means a duplicate value, so it's a UNIQUE (or primary key) constraint."

  - type: mcq
    prompt: Why enforce rules with constraints in the database, rather than only in the app?
    options:
      - Constraints make every query faster, because the planner can skip checks
      - Data comes from many apps, scripts and people; the database sees all of it
      - Apps can't check rules themselves, since they only send SQL to the database
      - The SQL standard requires every rule to be written as a constraint
    answer: 1
    explanation: An app only protects the data it writes. A constraint protects the table from every source, forever.
