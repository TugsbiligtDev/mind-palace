steps:
  - kind: explain
    title: A column that points at another table
    body: |
      Each order belongs to a customer. The `orders` table doesn't copy the customer's name. It stores `customer_id`, which **points at** a row in `customers`:

      ```sql
      customer_id  integer NOT NULL REFERENCES customers (customer_id)
      ```

      That's a **foreign key** (FK): a column whose values must match a **primary key** in another table.

      - The table being pointed at (`customers`) is the **parent**.
      - The table doing the pointing (`orders`) is the **child**.

  - kind: try
    title: Follow the pointer
    body: |
      Order 3 has `customer_id` 4. Run both queries and find customer 4 by eye. (Module 14 teaches the query that does this matching for you.)
    sql: |
      SELECT order_id, customer_id FROM orders;
      SELECT customer_id, first_name, last_name FROM customers;

  - kind: explain
    title: "Referential integrity: no orphans"
    body: |
      A foreign key promises that **every pointer points at something real**. PostgreSQL enforces it both ways:

      - You can't **insert or update** a child to point at a parent that doesn't exist.
      - You can't **delete** a parent that children still point at (unless you say what should happen, below).

      A child row whose parent is missing is called an **orphan**. Without FKs, orphans pile up quietly: orders for customers who no longer exist, reviews of deleted books. With FKs, they can't happen.

  - kind: try
    title: An order for nobody
    body: |
      There's no customer 99. Run it and read the error. It names the foreign key and the missing value.
    sql: |
      INSERT INTO orders (customer_id)
      VALUES (99);
    expect_error: true

  - kind: explain
    title: Writing a foreign key
    body: |
      Two spellings, same result:

      ```sql
      CREATE TABLE orders (
          order_id     integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          -- 1. on the column itself
          customer_id  integer NOT NULL REFERENCES customers (customer_id),
          -- 2. on its own line, with a name
          employee_id  integer,
          CONSTRAINT orders_employee_fk FOREIGN KEY (employee_id) REFERENCES employees (employee_id)
      );
      ```

      - The FK column's **type must match** the parent key's type (`integer` → `integer`).
      - Name the FK column after what it points at: `customer_id`, `book_id`. Anyone can then guess the link.
      - An FK column **may be NULL** unless you add NOT NULL. NULL means "not linked to anything", like an online order with no employee.

      **Example.** A `returns` table using both spellings. The named one shows up in its error:

      ```sql
      CREATE TABLE returns (
          return_id    integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          order_id     integer NOT NULL REFERENCES orders (order_id),
          employee_id  integer,
          CONSTRAINT returns_employee_fk FOREIGN KEY (employee_id) REFERENCES employees (employee_id)
      );
      INSERT INTO returns (order_id, employee_id)
      VALUES (1, NULL)
      RETURNING *;
      ```

      | return_id | order_id | employee_id |
      |---|---|---|
      | 1 | 1 | NULL |

      A NULL employee is fine (nobody handled it yet). Employee 99 doesn't exist:

      ```sql
      INSERT INTO returns (order_id, employee_id) VALUES (1, 99);
      ```

      ```text
      ERROR:  insert or update on table "returns" violates foreign key constraint "returns_employee_fk"
      ```

  - kind: try
    title: "Try it: two ways to write a foreign key"
    body: |
      Run it: the first return goes in, the second is refused, and the error uses the name you chose. Change `99` to `3` (a real employee) and run again.

      To continue, make it run without an error: the change above does it.
    sql: |
      CREATE TABLE returns (
          return_id    integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          order_id     integer NOT NULL REFERENCES orders (order_id),
          employee_id  integer,
          CONSTRAINT returns_employee_fk FOREIGN KEY (employee_id) REFERENCES employees (employee_id)
      );
      INSERT INTO returns (order_id, employee_id)
      VALUES (1, NULL)
      RETURNING *;
      INSERT INTO returns (order_id, employee_id) VALUES (1, 99);
    broken_starter: true

  - kind: explain
    title: One-to-many
    body: |
      **One** customer has **many** orders. Each order has **one** customer. That's a **one-to-many** relationship, the most common kind by far.

      The rule: **the foreign key goes on the "many" side.** `orders` holds `customer_id`. You can't do it the other way round, because a customer row can't hold a list of order IDs in one column.

      Other Inkwell examples: one publisher → many books, one genre → many books, one order → many order lines.

      **Example.** Customer 1 (Emma) and her orders. Four order rows all point at the same customer:

      ```sql
      SELECT order_id, customer_id, ordered_at
      FROM orders
      WHERE customer_id = 1
      ORDER BY order_id;
      ```

      | order_id | customer_id | ordered_at |
      |---|---|---|
      | 1 | 1 | 2024-02-03 10:05:00+00 |
      | 4 | 1 | 2024-03-15 20:45:00+00 |
      | 12 | 1 | 2024-07-01 22:10:00+00 |
      | 20 | 1 | 2024-10-12 20:30:00+00 |

      One customer row, many order rows: the `customer_id` lives on the "many" side.

  - kind: try
    title: "Try it: one customer, many orders"
    body: |
      The example, then a count of orders per customer. Run it, then change `customer_id = 1` to `2`.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT order_id, customer_id, ordered_at
      FROM orders
      WHERE customer_id = 1
      ORDER BY order_id;

      SELECT customer_id, count(*) AS orders
      FROM orders
      GROUP BY customer_id
      ORDER BY orders DESC, customer_id;

  - kind: choice
    title: "Quick check: where does the FK go?"
    body: One **publisher** publishes many **books**. Each book has one publisher. Which column do you add?
    options:
      - "`books.publisher_id`, pointing at `publishers`"
      - "`publishers.book_id`, pointing at `books`"
      - "Both of them"
      - "`publishers.book_ids`, holding a list of book IDs"
    answer: 0
    explanation: "The foreign key goes on the \"many\" side. Each book holds one publisher ID. A publisher row can't hold all its books in one column."

  - kind: explain
    title: One-to-one
    body: |
      Sometimes each parent has **at most one** child: one customer, one loyalty card.

      Make it a foreign key that's also **UNIQUE**:

      ```sql
      CREATE TABLE loyalty_cards (
          card_no      text PRIMARY KEY,
          customer_id  integer NOT NULL UNIQUE REFERENCES customers (customer_id),
          points       integer NOT NULL DEFAULT 0
      );
      ```

      The UNIQUE stops a second card for the same customer. Inkwell's `customer_profiles` table does the same thing a shorter way: its `customer_id` is both the **primary key** and the foreign key, and a primary key is always unique. One-to-one tables are handy for optional or sensitive details that you want to keep apart from the main table.

  - kind: try
    title: One card each
    body: |
      Emma's first loyalty card goes in. The second is refused, because `customer_id` must be unique. Run it and read the error.
    sql: |
      CREATE TABLE loyalty_cards (
          card_no      text PRIMARY KEY,
          customer_id  integer NOT NULL UNIQUE REFERENCES customers (customer_id),
          points       integer NOT NULL DEFAULT 0
      );
      INSERT INTO loyalty_cards (card_no, customer_id)
      VALUES ('LC-0001', 1);
      INSERT INTO loyalty_cards (card_no, customer_id)
      VALUES ('LC-0002', 1);
    expect_error: true

  - kind: explain
    title: Many-to-many and junction tables
    body: |
      A book can have **many authors** (*Good Omens* has two), and an author writes **many books**. Neither side can hold the FK, since both are "many".

      The answer is a third table in the middle, a **junction table**, with one FK to each side. Inkwell has one:

      ```sql
      CREATE TABLE book_authors (
          book_id       integer NOT NULL REFERENCES books (book_id),
          author_id     integer NOT NULL REFERENCES authors (author_id),
          author_order  smallint NOT NULL DEFAULT 1,
          PRIMARY KEY (book_id, author_id)
      );
      ```

      Each row is one link: "book 18 was written by author 12". The **composite primary key** (Module 11) stops the same link being added twice. A junction table can also hold facts about the link itself, like `author_order` (1 = main author, 2 = co-author).

      `order_items` is a junction table too: it links orders and books, with extra facts (quantity, unit price) about each link.

  - kind: try
    title: Two authors, one book
    body: |
      *Good Omens* is book 18. Run it: two rows, one per author. Then change 18 to 15 to see the other co-written book.
    sql: |
      SELECT book_id, author_id, author_order
      FROM book_authors
      WHERE book_id = 18;

  - kind: try
    title: Your turn to build a junction table
    body: |
      Inkwell wants themed **shelves** on its website (*Staff picks*, *Summer reads*…), and a book can sit on many shelves. The `shelves` table is ready. Create **shelf_books** with two columns, `shelf_id` and `book_id`, each a foreign key to its table, and a composite primary key on both. (Don't name the constraints; let PostgreSQL do it.)

      The last query counts the table's key constraints: `f` = foreign key, `p` = primary key.
    sql: |
      CREATE TABLE shelves (
          shelf_id  integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          label     text NOT NULL UNIQUE
      );

      CREATE TABLE shelf_books (
          shelf_id  integer,
          book_id   integer
      );

      SELECT contype, count(*)
      FROM pg_constraint
      WHERE conrelid = 'shelf_books'::regclass AND contype IN ('f', 'p')
      GROUP BY contype
      ORDER BY contype;
    expect: |
      CREATE TABLE shelves (
          shelf_id  integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          label     text NOT NULL UNIQUE
      );

      CREATE TABLE shelf_books (
          shelf_id  integer REFERENCES shelves (shelf_id),
          book_id   integer REFERENCES books (book_id),
          PRIMARY KEY (shelf_id, book_id)
      );

      SELECT contype, count(*)
      FROM pg_constraint
      WHERE conrelid = 'shelf_books'::regclass AND contype IN ('f', 'p')
      GROUP BY contype
      ORDER BY contype;

  - kind: explain
    title: A table that points at itself
    body: |
      Inkwell's employees have managers, and managers are employees too. A **self-referencing** foreign key points at the same table:

      ```sql
      CREATE TABLE employees (
          employee_id  integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          full_name    text NOT NULL,
          manager_id   integer REFERENCES employees (employee_id)
      );
      ```

      The boss has `manager_id` NULL: nobody above them. Everyone else points at their manager's `employee_id`. You'll walk whole chains of these ("who's above whom?") with recursive queries in Module 19.

  - kind: try
    title: Inkwell's org chart
    body: |
      Run it. Helen Carter (employee 1) has no manager. Who reports to Marcus Reed (employee 2)? And who is the only person reporting to employee 7?
    sql: |
      SELECT employee_id, full_name, job_title, manager_id
      FROM employees
      ORDER BY employee_id;

  - kind: explain
    title: What happens when a parent is deleted?
    body: |
      Add an **ON DELETE** action to the foreign key to decide:

      | Action | Effect | Use it for |
      |---|---|---|
      | `NO ACTION` / `RESTRICT` | **Refuse** the delete while children exist. This is the default. | Important history: don't delete a customer who has orders. |
      | `CASCADE` | Delete the children **too**. | Parts that can't exist alone: delete an order, delete its lines. |
      | `SET NULL` | Keep the children, set their FK to NULL. | Optional links: a manager leaves, their team stays. |
      | `SET DEFAULT` | Set the FK to its default value. | Rare. |

      ```sql
      order_id  integer NOT NULL REFERENCES orders (order_id) ON DELETE CASCADE
      ```

      <!-- page -->

      Inkwell uses all three main actions: `orders.customer_id` is RESTRICT, `order_items.order_id` is CASCADE, and `employees.manager_id` is SET NULL.

      **RESTRICT** in action: customer 4 has two orders, so deleting them is refused.

      ```sql
      DELETE FROM customers WHERE customer_id = 4;
      ```

      ```text
      ERROR:  update or delete on table "customers" violates RESTRICT setting of
              foreign key constraint "orders_customer_id_fkey" on table "orders"
      ```

      The customer and their orders are untouched.

      `ON UPDATE` works the same way for when a parent's key changes, but with identity keys that never change, you'll rarely need it.

      **Be careful with CASCADE.** One delete can quietly remove thousands of rows in other tables.

  - kind: try
    title: "Try it: RESTRICT"
    body: |
      Run it and read the error. Then try customer `17` instead: Harper has no orders, so nothing points at her row and the delete works.

      To continue, make it run without an error: the change above does it.
    sql: |
      DELETE FROM customers WHERE customer_id = 4;
    broken_starter: true

  - kind: try
    title: CASCADE in action
    body: |
      A new order (it gets `order_id` 31) with two notes for the warehouse. Deleting the order takes its notes with it. Run it: the count is 0.

      Then remove `ON DELETE CASCADE` and run again. With the default action, the delete is refused.
    sql: |
      CREATE TABLE order_notes (
          note_id   integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          order_id  integer NOT NULL REFERENCES orders (order_id) ON DELETE CASCADE,
          note      text NOT NULL
      );
      INSERT INTO orders (customer_id) VALUES (17);
      INSERT INTO order_notes (order_id, note)
      VALUES (31, 'Gift wrap'), (31, 'Leave with neighbor');

      DELETE FROM orders WHERE order_id = 31;
      SELECT count(*) AS notes_left FROM order_notes;

  - kind: try
    title: Your turn with SET NULL
    body: |
      A small copy of the org chart. Marcus (staff 2) is leaving. Deleting that row fails, because Tom reports to Marcus. Change the foreign key so Tom **stays** but Tom's `manager_id` becomes NULL, then run it.
    sql: |
      CREATE TABLE staff (
          staff_id    integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          full_name   text NOT NULL,
          manager_id  integer REFERENCES staff (staff_id)
      );
      INSERT INTO staff (full_name, manager_id) VALUES
        ('Helen Carter', NULL), ('Marcus Reed', 1), ('Tom Becker', 2);

      DELETE FROM staff WHERE staff_id = 2;
      SELECT * FROM staff ORDER BY staff_id;
    broken_starter: true
    expect: |
      CREATE TABLE staff (
          staff_id    integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          full_name   text NOT NULL,
          manager_id  integer REFERENCES staff (staff_id) ON DELETE SET NULL
      );
      INSERT INTO staff (full_name, manager_id) VALUES
        ('Helen Carter', NULL), ('Marcus Reed', 1), ('Tom Becker', 2);

      DELETE FROM staff WHERE staff_id = 2;
      SELECT * FROM staff ORDER BY staff_id;

  - kind: explain
    title: Parents first
    body: |
      Because a child must point at an existing parent, order matters:

      - **Creating tables:** parents first. `publishers` and `genres` before `books`, `books` before `order_items`.
      - **Inserting rows:** parents first. Add the customer, *then* their order.
      - **Deleting:** children first (unless you use CASCADE). Remove the orders, *then* the customer.

      The Inkwell dataset script follows exactly this order.

      **Example.** An order for a customer who isn't there yet is refused:

      ```sql
      INSERT INTO orders (customer_id) VALUES (21);
      ```

      ```text
      ERROR:  insert or update on table "orders" violates foreign key constraint "orders_customer_id_fkey"
      ```

      Parent first, then child, and both go in:

      ```sql
      INSERT INTO customers (first_name, last_name, email)
      VALUES ('Nina', 'Park', 'nina.park@example.com') RETURNING customer_id;   -- 21

      INSERT INTO orders (customer_id)
      VALUES (21)
      RETURNING customer_id, status;
      ```

      | customer_id | status |
      |---|---|
      | 21 | pending |

  - kind: try
    title: "Try it: parents first"
    body: |
      The right order: customer, then order. Run it. Then swap the two INSERTs so the order comes first, and read the error.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      INSERT INTO customers (first_name, last_name, email)
      VALUES ('Nina', 'Park', 'nina.park@example.com') RETURNING customer_id;

      INSERT INTO orders (customer_id)
      VALUES (21)
      RETURNING order_id, customer_id, status;

  - kind: explain
    title: "Common mistake: FK columns aren't indexed"
    body: |
      PostgreSQL automatically indexes every **primary key**, but **not** foreign key columns. An index is like the index at the back of a book: it lets PostgreSQL find rows without reading the whole table (Module 32).

      Without one on `orders.customer_id`:

      - "all orders for customer 4" has to scan every order
      - deleting a customer has to scan every order to check for children

      On small tables you won't notice. On millions of rows it's painfully slow. So when you add a foreign key, add its index too:

      ```sql
      CREATE INDEX orders_customer_id_idx ON orders (customer_id);
      ```

      Inkwell's foreign key columns have **no** indexes yet, on purpose. Adding them is one of your later exercises.

  - kind: try
    title: "Try it: index a foreign key"
    body: |
      Run it. The second query lists the indexes on `orders`: `orders_pkey` (made automatically for the primary key) and the new `orders_customer_id_idx`.

      Then try `employees (manager_id)`: change the index name to `employees_manager_id_idx` and the `tablename` to `'employees'`.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      CREATE INDEX orders_customer_id_idx ON orders (customer_id);

      SELECT indexname
      FROM pg_indexes
      WHERE tablename = 'orders'
      ORDER BY indexname;

  - kind: info
    title: "🔹 DEFERRABLE constraints"
    body: |
      Normally a foreign key is checked **immediately**, statement by statement. A key declared `DEFERRABLE INITIALLY DEFERRED` is checked only when the whole transaction finishes (Module 30). It's useful for rare cases like two rows that point at each other, where neither can go first. Just recognize the words.

  - kind: try
    title: "Find the bug: the order line with no order"
    body: |
      A new order (it gets `order_id` **31**) with one line. Run it and read the error, then fix the script so both rows are saved. Checked by looking at order 31 and its line.
    sql: |
      INSERT INTO order_items (order_id, book_id, quantity, unit_price)
      VALUES (31, 1, 1, 9.99);
      INSERT INTO orders (customer_id, ordered_at, status)
      VALUES (1, '2025-02-01 10:00+00', 'paid');
    broken_starter: true
    expect: |
      INSERT INTO orders (customer_id, ordered_at, status) VALUES (1, '2025-02-01 10:00+00', 'paid');
      INSERT INTO order_items (order_id, book_id, quantity, unit_price) VALUES (31, 1, 1, 9.99);
    state_query: |
      SELECT o.order_id, o.customer_id, o.status, oi.book_id, oi.quantity
      FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
      WHERE o.order_id = 31;
    hint: |
      A child row can only point at a parent that already exists. Which row must come first?

  - kind: try
    title: "Your turn with a one-to-one table"
    body: |
      Some orders are gift-wrapped, with a message. Create **gift_wraps** with `order_id` and `message` (text), where:

      - each order has **at most one** gift wrap, and it must be a real order
      - deleting an order deletes its gift wrap

      Checked by trying some rows.
    sql: |
      -- Write your CREATE TABLE here
    expect: |
      CREATE TABLE gift_wraps (
          order_id  integer PRIMARY KEY REFERENCES orders (order_id) ON DELETE CASCADE,
          message   text
      );
    state_query: |
      CREATE FUNCTION pg_temp.run_tests() RETURNS TABLE (test text, result text) LANGUAGE plpgsql AS $$
      DECLARE t record;
      BEGIN
        FOR t IN SELECT * FROM (VALUES
          (1, $l$a wrap for order 1$l$, $q$INSERT INTO gift_wraps (order_id, message) VALUES (1, 'Happy birthday!')$q$),
          (2, $l$a second wrap for order 1$l$, $q$INSERT INTO gift_wraps (order_id, message) VALUES (1, 'Again')$q$),
          (3, $l$a wrap for order 999$l$, $q$INSERT INTO gift_wraps (order_id, message) VALUES (999, 'Nobody')$q$),
          (4, $l$deleting order 1$l$, $q$DELETE FROM orders WHERE order_id = 1$q$),
          (5, $l$its wrap is gone$l$, $q$SELECT 1 / ((SELECT count(*) FROM gift_wraps) = 0)::int$q$)
        ) AS v(n, label, sql) ORDER BY n LOOP
          test := t.label;
          BEGIN
            EXECUTE t.sql;
            result := 'accepted';
          EXCEPTION WHEN division_by_zero THEN
            result := 'wrong';
          WHEN OTHERS THEN
            result := CASE WHEN SQLSTATE IN ('42P01', '42703') THEN 'missing table or column' ELSE 'rejected' END;
          END;
          RETURN NEXT;
        END LOOP;
      END $$;
      SELECT test, result FROM pg_temp.run_tests();
    hint: |
      One-to-one: the foreign key column is also the primary key (or UNIQUE). Choose the ON DELETE action that removes the child.
    reject:
      - |
        CREATE TABLE gift_wraps (order_id integer REFERENCES orders (order_id) ON DELETE CASCADE, message text);
      - |
        CREATE TABLE gift_wraps (order_id integer PRIMARY KEY REFERENCES orders (order_id), message text);

  - kind: why
    body: |
      Foreign keys are what make a relational database *relational*. They let you split data into clean tables without ever losing track of what belongs to what, and they make orphaned, contradictory data impossible.

  - kind: recap
    body: |
      - A **foreign key** column references a parent's primary key: `REFERENCES parent (id)`.
      - It guarantees **no orphans**: no pointing at missing parents, no deleting parents with children (by default).
      - **One-to-many**: FK on the "many" side. **One-to-one**: FK + UNIQUE (or FK as the primary key). **Many-to-many**: a **junction table** with two FKs and a composite PK.
      - **Self-referencing** FKs model hierarchies like employee → manager.
      - `ON DELETE`: `NO ACTION`/`RESTRICT` (refuse, default), `CASCADE` (delete children), `SET NULL`, `SET DEFAULT`.
      - Insert parents first, delete children first.
      - FK columns aren't indexed automatically. Add `CREATE INDEX` yourself.
      - 🔹 `DEFERRABLE` checks the FK at the end of the transaction.
