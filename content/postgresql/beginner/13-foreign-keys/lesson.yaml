steps:
  - kind: explain
    title: A column that points at another table
    body: |
      Each trip belongs to a traveler. The `trips` table doesn't copy the traveler's name. It stores `traveler_id`, which **points at** a row in `travelers`:

      ```sql
      traveler_id  integer NOT NULL REFERENCES travelers (traveler_id)
      ```

      That's a **foreign key** (FK): a column whose values must match a **primary key** in another table.

      - The table being pointed at (`travelers`) is the **parent**.
      - The table doing the pointing (`trips`) is the **child**.

  - kind: try
    title: Follow the pointer
    body: |
      Trip *Peru Adventure* has `traveler_id` 2. Run both queries and find traveler 2 by eye. (Module 14 teaches the query that does this matching for you.)
    sql: |
      SELECT trip_name, traveler_id FROM trips;
      SELECT traveler_id, full_name FROM travelers;

  - kind: explain
    title: "Referential integrity: no orphans"
    body: |
      A foreign key promises that **every pointer points at something real**. PostgreSQL enforces it both ways:

      - You can't **insert or update** a child to point at a parent that doesn't exist.
      - You can't **delete** a parent that children still point at (unless you say what should happen, below).

      A child row whose parent is missing is called an **orphan**. Without FKs, orphans pile up quietly: trips for travelers who no longer exist, reviews of deleted attractions. With FKs, they can't happen.

  - kind: try
    title: A trip for nobody
    body: |
      There's no traveler 99. Run it and read the error. It names the foreign key and the missing value.
    sql: |
      INSERT INTO trips (traveler_id, trip_name, start_date)
      VALUES (99, 'Mystery Tour', '2026-12-01');
    expect_error: true

  - kind: explain
    title: Writing a foreign key
    body: |
      Two spellings, same result:

      ```sql
      CREATE TABLE trips (
          trip_id      integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          -- 1. on the column itself
          traveler_id  integer NOT NULL REFERENCES travelers (traveler_id),
          -- 2. on its own line, with a name
          guide_id     integer,
          CONSTRAINT trips_guide_fk FOREIGN KEY (guide_id) REFERENCES guides (guide_id)
      );
      ```

      - The FK column's **type must match** the parent key's type (`integer` → `integer`).
      - Name the FK column after what it points at: `traveler_id`, `city_id`. Anyone can then guess the link.
      - An FK column **may be NULL** unless you add NOT NULL. NULL means "not linked to anything", like a trip with no guide yet.

  - kind: explain
    title: One-to-many
    body: |
      **One** traveler has **many** trips. Each trip has **one** traveler. That's a **one-to-many** relationship, the most common kind by far.

      The rule: **the foreign key goes on the "many" side.** `trips` holds `traveler_id`. You can't do it the other way round, because a traveler row can't hold a list of trip IDs in one column.

      Other Wanderly examples: one country → many cities, one city → many attractions.

  - kind: explain
    title: One-to-one
    body: |
      Sometimes each parent has **at most one** child: one traveler, one passport record.

      Make it a foreign key that's also **UNIQUE**:

      ```sql
      CREATE TABLE passports (
          passport_no  text PRIMARY KEY,
          traveler_id  integer NOT NULL UNIQUE REFERENCES travelers (traveler_id),
          expires_on   date NOT NULL
      );
      ```

      The UNIQUE stops a second passport row for the same traveler. One-to-one tables are handy for optional or sensitive details that you want to keep apart from the main table.

  - kind: try
    title: One passport each
    body: |
      Amina's first passport goes in. The second is refused, because `traveler_id` must be unique. Run it and read the error.
    sql: |
      CREATE TABLE passports (
          passport_no  text PRIMARY KEY,
          traveler_id  integer NOT NULL UNIQUE REFERENCES travelers (traveler_id),
          expires_on   date NOT NULL
      );
      INSERT INTO passports VALUES ('E1234567', 1, '2030-01-31');
      INSERT INTO passports VALUES ('E7654321', 1, '2031-06-30');
    expect_error: true

  - kind: explain
    title: Many-to-many and junction tables
    body: |
      An attraction can have **many tags** (*family*, *outdoor*, *free*), and a tag applies to **many attractions**. Neither side can hold the FK, since both are "many".

      The answer is a third table in the middle, a **junction table**, with one FK to each side:

      ```sql
      CREATE TABLE attraction_tags (
          attraction_id  integer REFERENCES attractions (attraction_id),
          tag_id         integer REFERENCES tags (tag_id),
          PRIMARY KEY (attraction_id, tag_id)
      );
      ```

      Each row is one link: "attraction 3 has tag 2". The **composite primary key** (Module 11) stops the same link being added twice.

      `trip_stops` is a junction table too: it links trips and cities, with extra facts (nights, cost) about each link.

  - kind: try
    title: Your turn to build a junction table
    body: |
      The `tags` table is ready. Create **attraction_tags** with two columns, `attraction_id` and `tag_id`, each a foreign key to its table, and a composite primary key on both. (Don't name the constraints; let PostgreSQL do it.)

      The last query counts the table's key constraints: `f` = foreign key, `p` = primary key.
    sql: |
      CREATE TABLE tags (
          tag_id  integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          label   text NOT NULL UNIQUE
      );

      CREATE TABLE attraction_tags (
          attraction_id  integer,
          tag_id         integer
      );

      SELECT contype, count(*)
      FROM pg_constraint
      WHERE conrelid = 'attraction_tags'::regclass AND contype IN ('f', 'p')
      GROUP BY contype
      ORDER BY contype;
    expect: |
      CREATE TABLE tags (
          tag_id  integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          label   text NOT NULL UNIQUE
      );

      CREATE TABLE attraction_tags (
          attraction_id  integer REFERENCES attractions (attraction_id),
          tag_id         integer REFERENCES tags (tag_id),
          PRIMARY KEY (attraction_id, tag_id)
      );

      SELECT contype, count(*)
      FROM pg_constraint
      WHERE conrelid = 'attraction_tags'::regclass AND contype IN ('f', 'p')
      GROUP BY contype
      ORDER BY contype;

  - kind: explain
    title: A table that points at itself
    body: |
      Wanderly's staff have managers, and managers are staff too. A **self-referencing** foreign key points at the same table:

      ```sql
      CREATE TABLE staff (
          staff_id    integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          full_name   text NOT NULL,
          manager_id  integer REFERENCES staff (staff_id)
      );
      ```

      The boss has `manager_id` NULL: nobody above them. Everyone else points at their manager's `staff_id`. You'll walk whole chains of these ("who's above whom?") with recursive queries in Module 19.

  - kind: try
    title: Build an org chart
    body: |
      The boss goes in first (manager NULL), then two people who report to staff 1, then one who reports to staff 2. Run it.
    sql: |
      CREATE TABLE staff (
          staff_id    integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          full_name   text NOT NULL,
          manager_id  integer REFERENCES staff (staff_id)
      );
      INSERT INTO staff (full_name, manager_id) VALUES
        ('Odval Bold', NULL),
        ('Gerel Tsog', 1),
        ('Saruul Dash', 1),
        ('Temuulen Gan', 2);

      SELECT * FROM staff;

  - kind: explain
    title: What happens when a parent is deleted?
    body: |
      Add an **ON DELETE** action to the foreign key to decide:

      | Action | Effect | Use it for |
      |---|---|---|
      | `NO ACTION` / `RESTRICT` | **Refuse** the delete while children exist. This is the default. | Important history: don't delete a customer who has invoices. |
      | `CASCADE` | Delete the children **too**. | Parts that can't exist alone: delete a trip, delete its stops. |
      | `SET NULL` | Keep the children, set their FK to NULL. | Optional links: a manager leaves, their staff stay. |
      | `SET DEFAULT` | Set the FK to its default value. | Rare. |

      ```sql
      trip_id  integer NOT NULL REFERENCES trips (trip_id) ON DELETE CASCADE
      ```

      `ON UPDATE` works the same way for when a parent's key changes, but with identity keys that never change, you'll rarely need it.

      **Be careful with CASCADE.** One delete can quietly remove thousands of rows in other tables.

  - kind: try
    title: CASCADE in action
    body: |
      A new trip (it gets `trip_id` 8) with two notes. Deleting the trip takes its notes with it. Run it: the count is 0.

      Then remove `ON DELETE CASCADE` and run again. With the default action, the delete is refused.
    sql: |
      CREATE TABLE trip_notes (
          note_id  integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          trip_id  integer NOT NULL REFERENCES trips (trip_id) ON DELETE CASCADE,
          note     text NOT NULL
      );
      INSERT INTO trips (traveler_id, trip_name, start_date) VALUES (5, 'Day in Kyoto', '2026-11-01');
      INSERT INTO trip_notes (trip_id, note) VALUES (8, 'Book tea ceremony'), (8, 'Pack umbrella');

      DELETE FROM trips WHERE trip_id = 8;
      SELECT count(*) AS notes_left FROM trip_notes;

  - kind: try
    title: Your turn with SET NULL
    body: |
      Gerel (staff 2) is leaving. Deleting them fails, because Temuulen reports to them. Change the foreign key so Temuulen **stays** but their `manager_id` becomes NULL, then run it.
    sql: |
      CREATE TABLE staff (
          staff_id    integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          full_name   text NOT NULL,
          manager_id  integer REFERENCES staff (staff_id)
      );
      INSERT INTO staff (full_name, manager_id) VALUES
        ('Odval Bold', NULL), ('Gerel Tsog', 1), ('Temuulen Gan', 2);

      DELETE FROM staff WHERE staff_id = 2;
      SELECT * FROM staff ORDER BY staff_id;
    broken_starter: true
    expect: |
      CREATE TABLE staff (
          staff_id    integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          full_name   text NOT NULL,
          manager_id  integer REFERENCES staff (staff_id) ON DELETE SET NULL
      );
      INSERT INTO staff (full_name, manager_id) VALUES
        ('Odval Bold', NULL), ('Gerel Tsog', 1), ('Temuulen Gan', 2);

      DELETE FROM staff WHERE staff_id = 2;
      SELECT * FROM staff ORDER BY staff_id;

  - kind: explain
    title: Parents first
    body: |
      Because a child must point at an existing parent, order matters:

      - **Creating tables:** parents first. `countries` before `cities`, `cities` before `attractions`.
      - **Inserting rows:** parents first. Add the traveler, *then* their trip.
      - **Deleting:** children first (unless you use CASCADE). Remove the trips, *then* the traveler.

      The Wanderly dataset script follows exactly this order.

  - kind: explain
    title: "Common mistake: FK columns aren't indexed"
    body: |
      PostgreSQL automatically indexes every **primary key**, but **not** foreign key columns. An index is like the index at the back of a book: it lets PostgreSQL find rows without reading the whole table (Module 32).

      Without one on `trips.traveler_id`:

      - "all trips for traveler 4" has to scan every trip
      - deleting a traveler has to scan every trip to check for children

      On small tables you won't notice. On millions of rows it's painfully slow. So when you add a foreign key, add its index too:

      ```sql
      CREATE INDEX trips_traveler_id_idx ON trips (traveler_id);
      ```

  - kind: info
    title: "🔹 DEFERRABLE constraints"
    body: |
      Normally a foreign key is checked **immediately**, statement by statement. A key declared `DEFERRABLE INITIALLY DEFERRED` is checked only when the whole transaction finishes (Module 30). It's useful for rare cases like two rows that point at each other, where neither can go first. Just recognize the words.

  - kind: why
    body: |
      Foreign keys are what make a relational database *relational*. They let you split data into clean tables without ever losing track of what belongs to what, and they make orphaned, contradictory data impossible.

  - kind: recap
    body: |
      - A **foreign key** column references a parent's primary key: `REFERENCES parent (id)`.
      - It guarantees **no orphans**: no pointing at missing parents, no deleting parents with children (by default).
      - **One-to-many**: FK on the "many" side. **One-to-one**: FK + UNIQUE. **Many-to-many**: a **junction table** with two FKs and a composite PK.
      - **Self-referencing** FKs model hierarchies like employee → manager.
      - `ON DELETE`: `NO ACTION`/`RESTRICT` (refuse, default), `CASCADE` (delete children), `SET NULL`, `SET DEFAULT`.
      - Insert parents first, delete children first.
      - FK columns aren't indexed automatically. Add `CREATE INDEX` yourself.
      - 🔹 `DEFERRABLE` checks the FK at the end of the transaction.
