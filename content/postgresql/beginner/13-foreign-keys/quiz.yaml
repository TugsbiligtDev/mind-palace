pass: 3
questions:
  - type: mcq
    prompt: One publisher has many books. Which table should hold the foreign key?
    options:
      - "`publishers`, as a `book_id` column"
      - "`books`, as a `publisher_id` column"
      - Both tables
      - A junction table
    answer: 1
    explanation: In a one-to-many relationship, the FK goes on the "many" side. Each book stores the one publisher it belongs to.

  - type: mcq
    prompt: Students take many courses, and each course has many students. How do you model it?
    options:
      - A `course_id` column in students, one per student
      - A `student_id` column in courses, one per course
      - A junction table with `student_id` and `course_id` FKs and a composite key
      - A text column in students listing every course name, separated by commas
    answer: 2
    explanation: Many-to-many needs a junction table. Each row links one student to one course, and the composite PK stops duplicate links.

  - type: predict
    prompt: What does the last statement return?
    code: |
      CREATE TABLE parents (id integer PRIMARY KEY);
      CREATE TABLE kids (
          id        integer PRIMARY KEY,
          parent_id integer REFERENCES parents (id) ON DELETE CASCADE
      );
      INSERT INTO parents VALUES (1), (2);
      INSERT INTO kids VALUES (10, 1), (11, 1), (12, 2);
      DELETE FROM parents WHERE id = 1;
      SELECT count(*) FROM kids;
    options:
      - "3"
      - "2"
      - "1"
      - An error
    answer: 2
    explanation: CASCADE deletes parent 1's two kids along with it. Only kid 12 (parent 2) remains.

  - type: fill
    prompt: Keep the staff member but clear their link when their manager is deleted.
    code: |
      CREATE TABLE crew (
          crew_id    integer PRIMARY KEY,
          manager_id integer REFERENCES crew (crew_id) ON DELETE ____
      );
    answer: SET NULL
    accept: ["set null"]
    explanation: "`ON DELETE SET NULL` keeps the child row and sets its foreign key to NULL."

  - type: mcq
    prompt: You add a foreign key `orders.customer_id`. What does PostgreSQL **not** do for you automatically?
    options:
      - Check that each customer_id exists in customers
      - Refuse to delete a customer who has orders
      - Create an index on `orders.customer_id`
      - Reject a customer_id of 99 when there's no customer 99
    answer: 2
    explanation: PostgreSQL indexes primary keys automatically, but not foreign key columns. Add the index yourself to keep lookups and parent deletes fast.
