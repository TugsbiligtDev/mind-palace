questions:
  - type: mcq
    prompt: You want **every** customer, including those with no orders, next to their orders. Which join?
    options:
      - "`customers JOIN orders`"
      - "`customers LEFT JOIN orders`"
      - "`orders LEFT JOIN customers`"
      - "`customers CROSS JOIN orders`"
    answer: 1
    explanation: LEFT JOIN keeps every row from the left table (customers), and fills order columns with NULL for customers with no orders.

  - type: predict
    prompt: Customers 17, 19 and 20 have never ordered. What does this return?
    code: |
      SELECT c.first_name
      FROM customers c
      LEFT JOIN orders o ON o.customer_id = c.customer_id
      WHERE o.order_id IS NULL
      ORDER BY c.customer_id;
    options:
      - No rows
      - "Harper\nDaniel\nZoe"
      - Every customer
      - An error
    answer: 1
    explanation: The LEFT JOIN keeps customers 17, 19 and 20 with NULLs for the order columns, and the WHERE keeps only rows with no matching order.

  - type: predict
    prompt: Emma (customer 1) has 4 orders. Two of them contain 2 books, and two contain 1 book. What does this return?
    code: |
      SELECT count(*) AS n
      FROM orders o
      JOIN order_items oi ON oi.order_id = o.order_id
      WHERE o.customer_id = 1;
    options:
      - "1"
      - "4"
      - "6"
      - "8"
    answer: 2
    explanation: Joining to order_items gives one row per order line. 2 + 2 + 1 + 1 = 6 rows. That's the fan-out effect.

  - type: fill
    prompt: Both tables have a `genre_id` column. Join them with the shortcut.
    code: |
      SELECT b.title, g.name
      FROM books b
      JOIN genres g ____ (genre_id);
    answer: USING
    accept: ["using"]
    explanation: "`USING (genre_id)` is short for `ON g.genre_id = b.genre_id` when the column names match."

  - type: mcq
    prompt: After `books LEFT JOIN reviews`, why count `r.review_id` instead of `*` per book?
    options:
      - "`count(*)` is slower"
      - An unreviewed book still has one row (with NULLs), so `count(*)` says 1 instead of 0
      - "`count(*)` doesn't work with GROUP BY"
      - There's no difference
    answer: 1
    explanation: The LEFT JOIN keeps one NULL-filled row for each unmatched book. `count(r.review_id)` skips the NULL and gives the true 0.
