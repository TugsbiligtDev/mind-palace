steps:
  - kind: explain
    title: Tables change over time
    body: |
      No design is final. Inkwell will want a phone number column next month, a rename the month after, a new rule after some bad data sneaks in.

      **`ALTER TABLE`** changes an existing table's structure **without** losing its rows:

      ```sql
      ALTER TABLE table_name  <what to change>;
      ```

      Like everything that changes structure, it's permanent on a real database. Try it here first.

      **Example.** Add a column to a table that already has 20 customers. Nobody is lost:

      ```sql
      SELECT count(*) AS customers_before FROM customers;
      ALTER TABLE customers ADD COLUMN phone text;
      SELECT count(*) AS customers_after, count(phone) AS with_phone
      FROM customers;
      ```

      | customers_before |
      |---|
      | 20 |

      | customers_after | with_phone |
      |---|---|
      | 20 | 0 |

      Still 20 rows. The new column is just empty (no phone numbers yet).

  - kind: try
    title: "Try it: change a table, keep the rows"
    body: |
      Run it and compare with the tables you just saw. Then add `\d customers` at the end to see `phone` in the list of columns.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT count(*) AS customers_before FROM customers;
      ALTER TABLE customers ADD COLUMN phone text;
      SELECT count(*) AS customers_after, count(phone) AS with_phone
      FROM customers;

  - kind: explain
    title: Adding a column
    body: |
      ```sql
      ALTER TABLE customers ADD COLUMN birth_date date;
      SELECT first_name, birth_date FROM customers;
      ```

      Existing rows get **NULL** in the new column (first three rows):

      | first_name | birth_date |
      |---|---|
      | Emma | NULL |
      | Liam | NULL |
      | Olivia | NULL |

      <!-- page -->

       Give it a **DEFAULT** and existing rows get that value instead:

      ```sql
      ALTER TABLE customers
        ADD COLUMN loyalty_points integer NOT NULL DEFAULT 0;
      ```

      Adding a `NOT NULL` column **without** a default fails if the table has rows, because what would the existing rows hold?

  - kind: try
    title: Points for everyone
    body: |
      Run it. Every existing customer starts with 0 points.
    sql: |
      ALTER TABLE customers
        ADD COLUMN loyalty_points integer NOT NULL DEFAULT 0;

      SELECT first_name, loyalty_points FROM customers;

  - kind: try
    title: Your turn to add a column
    body: |
      The SELECT asks for a `phone` column that doesn't exist yet. Add it above the SELECT as a `text` column, then run both.
    sql: |
      SELECT first_name, phone FROM customers;
    broken_starter: true
    expect: |
      ALTER TABLE customers ADD COLUMN phone text;
      SELECT first_name, phone FROM customers;

  - kind: explain
    title: Dropping and renaming
    body: |
      ```sql
      ALTER TABLE customers DROP COLUMN phone;                  -- column and its data, gone
      ALTER TABLE customers RENAME COLUMN city TO home_city;
      ALTER TABLE order_items RENAME TO order_lines;            -- renames the table
      ```

      - **DROP COLUMN** deletes every value in that column. There's no undo.
      - **RENAME** is instant and keeps the data, but every query, report and app that used the old name **breaks**. Rename early in a project, rarely after.

      After renaming the table, the same rows are there under the new name:

      ```sql
      ALTER TABLE order_items RENAME TO order_lines;
      SELECT order_id, book_id, quantity
      FROM order_lines
      ORDER BY order_id, book_id;
      ```

      | order_id | book_id | quantity |
      |---|---|---|
      | 1 | 1 | 1 |
      | 1 | 5 | 1 |
      | 2 | 3 | 2 |

      (First three rows.)

  - kind: try
    title: "Try it: DROP COLUMN and RENAME TO"
    body: |
      Run it: a `phone` column is added, then dropped again, and `order_items` gets its new name.

      Then play: add `SELECT phone FROM customers;` at the end (an error: the column is gone), or change `order_lines` in the SELECT back to `order_items` (also an error: the old name no longer exists).

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      ALTER TABLE customers ADD COLUMN phone text;
      ALTER TABLE customers DROP COLUMN phone;

      ALTER TABLE order_items RENAME TO order_lines;
      SELECT order_id, book_id, quantity
      FROM order_lines
      ORDER BY order_id, book_id;

  - kind: try
    title: Rename, then use the new name
    body: |
      Run it. Then change the SELECT to use the **old** name, `city`, and read the error.
    sql: |
      ALTER TABLE customers RENAME COLUMN city TO hometown;
      SELECT first_name, hometown FROM customers;

  - kind: explain
    title: Changing a column's type
    body: |
      ```sql
      ALTER TABLE books ALTER COLUMN pages TYPE bigint;
      ```

      PostgreSQL converts every existing value. If it can't convert one automatically (text → number, for example), add **`USING`** to say how:

      ```sql
      ALTER TABLE imports
        ALTER COLUMN price TYPE numeric(8,2) USING price::numeric(8,2);
      ```

      If **any** row can't be converted, the whole change fails and nothing is changed. On big tables, most type changes rewrite the whole table, which can take a while (on a busy production database, plan it for a quiet time and test it on a copy first).

  - kind: try
    title: Prices stored as text
    body: |
      An import stored prices as text, so they can't be summed. Run it: the type change with `USING` converts them, and `sum` works.

      Then add a row `('free')` to the INSERT and run it again. One bad value blocks the whole conversion.
    sql: |
      CREATE TABLE imports (item text, price text);
      INSERT INTO imports
      VALUES ('bookmark', '4.50'), ('tote bag', '19.99');

      ALTER TABLE imports
        ALTER COLUMN price TYPE numeric(8,2) USING price::numeric(8,2);

      SELECT sum(price) FROM imports;

  - kind: explain
    title: Adding and dropping rules
    body: |
      Constraints (Module 12) can be added and removed later:

      ```sql
      ALTER TABLE books
      ADD CONSTRAINT books_stock_limit CHECK (stock <= 1000);
      ALTER TABLE books DROP CONSTRAINT books_stock_limit;

      ALTER TABLE customers ALTER COLUMN city SET NOT NULL;
      ALTER TABLE customers ALTER COLUMN city DROP NOT NULL;

      ALTER TABLE orders ALTER COLUMN status SET DEFAULT 'paid';
      ALTER TABLE orders ALTER COLUMN status DROP DEFAULT;

      ALTER TABLE reviews ADD CONSTRAINT reviews_book_fk
        FOREIGN KEY (book_id) REFERENCES books (book_id);
      ```

      This is where naming your constraints pays off: dropping one needs its name.

      <!-- page -->

      Two of these in action. A new stock limit, then a book that breaks it:

      ```sql
      ALTER TABLE books
      ADD CONSTRAINT books_stock_limit CHECK (stock <= 1000);
      INSERT INTO books (title, genre_id, price, stock)
      VALUES ('Too Many', 1, 5, 5000);
      ```

      ```text
      ERROR:  new row for relation "books" violates check constraint "books_stock_limit"
      ```

      A new default for `orders.status` (it was `'pending'`):

      ```sql
      ALTER TABLE orders ALTER COLUMN status SET DEFAULT 'paid';
      INSERT INTO orders (customer_id)
      VALUES (17)
      RETURNING order_id, customer_id, status;
      ```

      | order_id | customer_id | status |
      |---|---|---|
      | 31 | 17 | paid |

  - kind: try
    title: "Try it: add and drop a rule"
    body: |
      Run it and read the error. Then add `ALTER TABLE books DROP CONSTRAINT books_stock_limit;` between the two lines and run again: the rule is gone, so the book goes in.

      To continue, make it run without an error: the change above does it.
    sql: |
      ALTER TABLE books
      ADD CONSTRAINT books_stock_limit CHECK (stock <= 1000);
      INSERT INTO books (title, genre_id, price, stock)
      VALUES ('Too Many', 1, 5, 5000);
    broken_starter: true

  - kind: try
    title: "Try it: set and drop a default"
    body: |
      Run it: the new order gets `paid`. Then change `SET DEFAULT 'paid'` to `DROP DEFAULT` and run again: now the INSERT fails, because `status` is NOT NULL and nothing fills it in.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      ALTER TABLE orders ALTER COLUMN status SET DEFAULT 'paid';
      INSERT INTO orders (customer_id)
      VALUES (17)
      RETURNING order_id, customer_id, status;

  - kind: explain
    title: Rules vs. data that's already there
    body: |
      When you add a rule to a table that **already has rows**, PostgreSQL checks **every existing row** first. If even one breaks the rule, the ALTER fails:

      - `SET NOT NULL` fails if any row is NULL.
      - `ADD CONSTRAINT … CHECK` fails if any row breaks the check.
      - `ADD … FOREIGN KEY` fails if any row points at a parent that doesn't exist (an orphan).

      The fix is always the same: **clean the data first, then add the rule.** Find the bad rows with a SELECT, fix them with UPDATE (or DELETE), then run the ALTER again.

      For example, a limit of 10 copies per book fails at once, because some books already have more:

      ```sql
      ALTER TABLE books ADD CONSTRAINT books_stock_small CHECK (stock <= 10);
      ```

      ```text
      ERROR:  check constraint "books_stock_small" of relation "books" is violated by some row
      ```

      The SELECT that finds the rows to fix:

      ```sql
      SELECT title, stock FROM books WHERE stock > 10;
      ```

  - kind: try
    title: Your turn to clean, then enforce
    body: |
      Inkwell wants every customer profile to have a bio. The ALTER fails because two profiles (customers 4 and 18) have none. Run it and read the error.

      Add an UPDATE **before** the ALTER that sets every missing bio to **No bio yet.**, then run it all.
    sql: |
      ALTER TABLE customer_profiles ALTER COLUMN bio SET NOT NULL;

      SELECT customer_id, bio
      FROM customer_profiles
      ORDER BY customer_id;
    broken_starter: true
    expect: |
      UPDATE customer_profiles SET bio = 'No bio yet.' WHERE bio IS NULL;
      ALTER TABLE customer_profiles ALTER COLUMN bio SET NOT NULL;

      SELECT customer_id, bio FROM customer_profiles ORDER BY customer_id;

  - kind: explain
    title: The danger of DROP … CASCADE
    body: |
      `DROP TABLE customers;` **fails**, because orders, reviews and customer_profiles have foreign keys pointing at it. PostgreSQL is protecting you.

      Adding **`CASCADE`** makes it drop **everything that depends on** the table too:

      ```sql
      DROP TABLE customers CASCADE;
      ```

      Here that removes the foreign key rules on `orders`, `reviews` and `customer_profiles` (their rows stay, but are no longer protected), plus any views built on customers (Module 34). On a real database, CASCADE can remove far more than you expected, so read the error's dependency list first, and drop dependents on purpose.

      Don't confuse it with `ON DELETE CASCADE` (Module 13), which deletes child **rows**. `DROP … CASCADE` removes dependent **objects**.

  - kind: try
    title: Protected from yourself
    body: |
      Run it and read the error: the DETAIL lists everything that depends on customers.
    sql: |
      DROP TABLE customers;
    expect_error: true

  - kind: try
    title: "Find the bug: a required column on a full table"
    body: |
      Every book needs a **language**, and all current books are in English. Run it and read the error. Fix the ALTER so the column is added, required, and **en** for every existing book.
    sql: |
      ALTER TABLE books ADD COLUMN language text NOT NULL;
    broken_starter: true
    expect: |
      ALTER TABLE books ADD COLUMN language text NOT NULL DEFAULT 'en';
    state_query: |
      SELECT (SELECT is_nullable FROM information_schema.columns
              WHERE table_name = 'books' AND column_name = 'language') AS nullable,
             language, count(*) AS books
      FROM books GROUP BY language;
    hint: |
      The existing rows would get NULL in the new column, which NOT NULL forbids. Give the column a DEFAULT in the same statement.

  - kind: try
    title: "Your turn to add a named rule"
    body: |
      Add a named constraint **customers_email_has_at** to `customers`, so every email must contain an `@`. All current emails already do. Checked by trying some emails.
    sql: |
      -- Write your ALTER TABLE here
    expect: |
      ALTER TABLE customers
          ADD CONSTRAINT customers_email_has_at CHECK (email LIKE '%@%');
    state_query: |
      CREATE FUNCTION pg_temp.run_tests() RETURNS TABLE (test text, result text) LANGUAGE plpgsql AS $$
      DECLARE t record;
      BEGIN
        FOR t IN SELECT * FROM (VALUES
          (1, $l$the rule exists$l$, $q$SELECT 1 / (count(*) = 1)::int FROM pg_constraint WHERE conname = 'customers_email_has_at'$q$),
          (2, $l$an email without @$l$, $q$INSERT INTO customers (first_name, last_name, email) VALUES ('No', 'At', 'no.at.example.com')$q$),
          (3, $l$a normal email$l$, $q$INSERT INTO customers (first_name, last_name, email) VALUES ('Has', 'At', 'has@example.com')$q$)
        ) AS v(n, label, sql) ORDER BY n LOOP
          test := t.label;
          BEGIN
            EXECUTE t.sql;
            result := 'accepted';
          EXCEPTION WHEN division_by_zero THEN
            result := 'wrong';
          WHEN OTHERS THEN
            result := CASE WHEN SQLSTATE IN ('42P01', '42703') THEN 'missing table or column' ELSE 'rejected' END;
          END;
          RETURN NEXT;
        END LOOP;
      END $$;
      SELECT test, result FROM pg_temp.run_tests();
    hint: |
      ALTER TABLE … ADD CONSTRAINT name CHECK (…). LIKE with `%` on both sides finds the `@` anywhere.

  - kind: why
    body: |
      Real databases live for years and change constantly. Knowing how to evolve a table without losing data, and how to add rules once the data is already messy, is what separates a toy database from one that keeps working.

  - kind: recap
    body: |
      - `ALTER TABLE t ADD COLUMN c type [DEFAULT …]`. Existing rows get the default, or NULL.
      - `DROP COLUMN` deletes the data. `RENAME COLUMN a TO b` / `RENAME TO` break old queries.
      - `ALTER COLUMN c TYPE new_type [USING expression]`: every row must convert, or nothing changes.
      - `ADD CONSTRAINT name …`, `DROP CONSTRAINT name`, `SET/DROP NOT NULL`, `SET/DROP DEFAULT`.
      - New rules are checked against existing rows. **Clean the data first, then add the rule.**
      - `DROP … CASCADE` also drops dependent objects. Read the dependency list before using it.
