pass: 3
questions:
  - type: predict
    prompt: What does the last statement return?
    code: |
      CREATE TABLE badges (label text);
      INSERT INTO badges VALUES ('Rookie'), ('Chief');
      ALTER TABLE badges ADD COLUMN points integer DEFAULT 10;
      SELECT sum(points) FROM badges;
    options:
      - "NULL"
      - "10"
      - "20"
      - "0"
    answer: 2
    explanation: A new column with a DEFAULT fills existing rows with that value. Two rows × 10 = 20.

  - type: mcq
    prompt: "`ALTER TABLE orders ALTER COLUMN employee_id SET NOT NULL;` fails. Why?"
    options:
      - You can't change NOT NULL after creating a table
      - At least one order already has a NULL employee_id
      - employee_id is a number, not text
      - orders has a primary key
    answer: 1
    explanation: New rules are checked against every existing row. Online orders have no employee, so the rule can't be added while those rows hold NULL.

  - type: fill
    prompt: Convert a text column of numbers into `numeric`, telling PostgreSQL how.
    code: |
      CREATE TABLE raw_prices (price text);
      ALTER TABLE raw_prices ALTER COLUMN price TYPE numeric ____ price::numeric;
    answer: USING
    accept: ["using"]
    explanation: "`USING expression` tells ALTER COLUMN … TYPE how to convert each existing value."

  - type: mcq
    prompt: What does `DROP TABLE customers CASCADE;` do to the rows in `orders`?
    options:
      - Deletes every order that belonged to a customer
      - Nothing to the rows; the foreign key linking them is dropped
      - Sets every order's customer_id to NULL
      - It's refused, because rows in orders still point at those customers
    answer: 1
    explanation: "`DROP … CASCADE` removes dependent **objects**, like the foreign key constraint. The order rows stay, now unprotected. (`ON DELETE CASCADE` is the one that deletes rows.)"

  - type: mcq
    prompt: You want to add a CHECK rule, but some existing rows break it. What's the right approach?
    options:
      - Drop the table and create it again with the rule
      - Fix or remove the bad rows first, then add the rule
      - Add the rule with CASCADE, which deletes the bad rows
      - Add the rule; it only checks rows added from now on
    answer: 1
    explanation: Clean the data first, then enforce the rule. PostgreSQL checks every existing row when you add it.
