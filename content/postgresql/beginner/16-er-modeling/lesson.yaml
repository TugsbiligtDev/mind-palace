steps:
  - kind: explain
    title: Draw before you build
    body: |
      So far you've been handed tables. In real projects someone has to **decide** them: which tables, which columns, which links. Getting it wrong is expensive, because every query, app and report is built on top of the design.

      An **entity-relationship (ER) model** is a sketch of the data **before** any CREATE TABLE. It's cheap to change on paper and very expensive to change once millions of rows exist.

      **Example.** A first sketch for a book club can be three boxes and two lines, on paper:

      ```text
      [ hosts ] ──leads──< [ clubs ] >──has members──< [ customers ]
      ```

      Spotting a mistake here (*"wait, can a club have two hosts?"*) costs an eraser. Spotting it after a year of data means changing tables, moving rows and fixing every app.

  - kind: choice
    title: "Quick check: when to change a design"
    body: When is it **cheapest** to change how the data is organized?
    options:
      - "Right after the tables are created"
      - "Once the app is live and has users"
      - "On paper, before any CREATE TABLE"
      - "It costs the same at any time"
    answer: 2
    explanation: "On paper a change is free. Once tables hold data and apps depend on them, every change means migrating rows and updating code."

  - kind: explain
    title: Entities, attributes, relationships
    body: |
      Three building blocks:

      | Block | What it is | Inkwell examples | Becomes |
      |---|---|---|---|
      | **Entity** | a kind of *thing* you keep data about | customer, order, book | a **table** |
      | **Attribute** | a *fact* about each thing | first name, order date, price | a **column** |
      | **Relationship** | how things are *connected* | a customer *places* orders | a **foreign key** (or junction table) |

      A handy trick when reading requirements: **nouns** are usually entities or attributes, and **verbs** are usually relationships.

      **Example.** Inkwell's real `books` table, read with these words:

      - **Entity:** *book* → the `books` table
      - **Attributes:** title, price, pages → the columns `title`, `price`, `pages`
      - **Relationship:** a book *is published by* a publisher → the foreign key `books.publisher_id`

  - kind: choice
    title: "Quick check: find the relationship"
    body: |
      *"A **customer** writes **reviews** of **books**, with a **rating**."*

      Which word describes a **relationship**?
    options:
      - "customer"
      - "writes"
      - "rating"
      - "books"
    answer: 1
    explanation: "Verbs are usually relationships: a customer *writes* a review. Customer, review and book are entities (things), and rating is an attribute (a fact about a review)."

  - kind: explain
    title: From requirements to a model
    body: |
      Inkwell writes:

      > *"We want to run book clubs. Each **club** has a name and a first meeting date and is **led by** exactly one **host**. A host can lead many clubs, or none yet. Each host **speaks** one or more **languages**. **Customers** **join** clubs; a membership records how many **copies** of the club's book they pre-ordered."*

      Underline and sort:

      - **Entities:** club, host, language, customer (and membership, see below)
      - **Attributes:** club name, first meeting date, number of copies
      - **Relationships:** host *leads* club, host *speaks* language, customer *joins* club

      "Copies" isn't a fact about the customer or the club alone. It's a fact about **one membership**, a customer + club pair. Facts like that live on the relationship itself.

      <!-- page -->

      **Example: the sorted requirements as a first sketch.** Each entity becomes a table, each attribute a column, and the relationships become the links between them:

      | Table | Columns so far | Comes from |
      |---|---|---|
      | `hosts` | name | the entity *host* |
      | `languages` | name | the entity *language* |
      | `clubs` | name, first_meeting | the entity *club* |
      | `customers` | name, email | the entity *customer* |
      | `memberships` | customer, club, **copies** | the relationship *customer joins club*, with its own fact |

      `host leads club` and `host speaks language` don't have their own facts, so how they're stored depends on how many are on each side: that's the next page.

  - kind: choice
    title: "Quick check: where does a fact live?"
    body: "In the book-club model, where does the number of **copies** a member pre-ordered belong?"
    options:
      - "On the customer"
      - "On the club"
      - "On the host"
      - "On the membership (the customer + club pair)"
    answer: 3
    explanation: "Emma might pre-order 2 copies for one club and 1 for another. The number depends on both the customer **and** the club, so it's a fact about the membership."

  - kind: explain
    title: Cardinality and optionality
    body: |
      For each relationship, ask two questions, **in both directions**:

      - **Cardinality**, *how many?*: one, or many?
      - **Optionality**, *can it be zero?*: is the link required or optional?

      For *host leads club*:

      - A club is led by **exactly one** host (one, required).
      - A host leads **zero or more** clubs (many, optional: a new host has none yet).

      So it's **one-to-many**. And "required" on the club side means the FK column `clubs.host_id` is **NOT NULL**.

      **Example: the rule, enforced by the database.** "A club is led by exactly one host" becomes a required foreign key:

      ```sql
      CREATE TABLE hosts (host_id int PRIMARY KEY, name text NOT NULL);
      CREATE TABLE clubs (
          club_id   int PRIMARY KEY,
          name      text NOT NULL,
          host_id   int NOT NULL REFERENCES hosts (host_id)
      );
      INSERT INTO hosts VALUES (1, 'Priya');
      INSERT INTO clubs VALUES (10, 'Crime Wednesdays', 1);
      INSERT INTO clubs VALUES (11, 'Poetry Night', NULL);
      ```

      ```text
      ERROR:  null value in column "host_id" of relation "clubs" violates not-null constraint
      ```

      The club led by Priya goes in; the club with no host is refused. "A host leads zero or more clubs" needs nothing extra: a host with no clubs simply has no rows pointing at it.

  - kind: choice
    title: "Quick check: required or optional?"
    body: |
      *"Every order line belongs to **exactly one** order. An order has **one or more** lines."*

      Which foreign key column must be **NOT NULL**?
    options:
      - "`order_items.order_id`"
      - "`orders.order_item_id`"
      - "Neither: foreign keys may always be NULL"
      - "`orders.customer_id`"
    answer: 0
    explanation: "The FK goes on the many side (order lines), and \"exactly one\" means required, so `order_items.order_id` is NOT NULL. Orders don't hold a line ID at all."

  - kind: explain
    title: "Crow's-foot diagrams"
    body: |
      ER diagrams draw each entity as a box and each relationship as a line. The line ends show cardinality and optionality. The fork that looks like a bird's foot means **many**:

      | Line end | Read it as |
      |---|---|
      | `\|\|` | exactly one |
      | `o\|` | zero or one |
      | `\|<` | one or more |
      | `o<` | zero or more |

      The symbol **next to a box** describes how many of *that* box take part. Our book-club model:

      ```text
      hosts ||--------o< clubs           a host leads zero or more clubs;
                                         a club has exactly one host

      hosts >o--------|< languages       a host speaks one or more languages;
                                         a language is spoken by zero or more hosts
                                         (many-to-many: needs a junction table)

      customers ||----o< memberships >o----|| clubs
      ```

      `memberships` is the junction between customers and clubs, and it carries the `copies` attribute.

  - kind: try
    title: Inkwell's relationships
    body: |
      Every foreign key in the database is a relationship line in its ER diagram. This lists them all, child → parent. Run it and try sketching the diagram on paper: 11 boxes and 13 lines (one line loops from `employees` back to itself).
    sql: |
      SELECT conrelid::regclass  AS child_table,
             confrelid::regclass AS parent_table,
             conname             AS foreign_key
      FROM pg_constraint
      WHERE contype = 'f'
      ORDER BY 2, 1;

  - kind: explain
    title: From diagram to tables
    body: |
      The translation is mechanical once the model is right:

      1. **Each entity → a table**, with a surrogate primary key (`host_id`).
      2. **Each attribute → a column** with a type. Required attributes get `NOT NULL`.
      3. **One-to-many → an FK on the "many" side.** Required (`||`) means `NOT NULL`, optional (`o|`) means NULL is allowed.
      4. **Many-to-many → a junction table** with two FKs and a composite PK. Attributes of the relationship (`copies`) go here.
      5. **One-to-one → an FK with UNIQUE.**

      ```sql
      CREATE TABLE memberships (
          customer_id  integer NOT NULL REFERENCES customers (customer_id),
          club_id      integer NOT NULL REFERENCES clubs (club_id),
          copies       integer NOT NULL CHECK (copies > 0),
          PRIMARY KEY (customer_id, club_id)
      );
      ```

      <!-- page -->

      With a simple `clubs` table, two clubs and three memberships, a join reads the model back in plain words:

      ```sql
      SELECT c.first_name, cl.name AS club, m.copies
      FROM memberships m
      JOIN customers c ON c.customer_id = m.customer_id
      JOIN clubs cl    ON cl.club_id = m.club_id
      ORDER BY c.first_name, cl.name;
      ```

      | first_name | club | copies |
      |---|---|---|
      | Emma | Classics Circle | 2 |
      | Emma | Sci-Fi Night | 1 |
      | Liam | Classics Circle | 1 |

      Emma is in two clubs (many-to-many), and `copies` sits on each membership, not on the customer or the club.

  - kind: try
    title: "Try it: a junction table"
    body: |
      Run it and compare with the table you just saw. The last line tries to add Emma to *Classics Circle* a second time, and the composite primary key refuses it.

      Then play: change the last line to `(3, 2, 1)` (Olivia joins *Sci-Fi Night*), or try `copies` of `0` to see the CHECK refuse it.

      To continue, make it run without an error: the change above does it.
    sql: |
      CREATE TABLE clubs (
          club_id  integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          name     text NOT NULL
      );
      CREATE TABLE memberships (
          customer_id  integer NOT NULL REFERENCES customers (customer_id),
          club_id      integer NOT NULL REFERENCES clubs (club_id),
          copies       integer NOT NULL CHECK (copies > 0),
          PRIMARY KEY (customer_id, club_id)
      );
      INSERT INTO clubs (name)
      VALUES ('Classics Circle'), ('Sci-Fi Night');
      INSERT INTO memberships
      VALUES (1, 1, 2), (1, 2, 1), (2, 1, 1);

      SELECT c.first_name, cl.name AS club, m.copies
      FROM memberships m
      JOIN customers c ON c.customer_id = m.customer_id
      JOIN clubs cl    ON cl.club_id = m.club_id
      ORDER BY c.first_name, cl.name;

      INSERT INTO memberships VALUES (1, 1, 3);
    broken_starter: true

  - kind: try
    title: Your turn to build from the model
    body: |
      `hosts` exists. Create **clubs** from the model:

      - `club_id`: identity primary key
      - `name`: text, required
      - `first_meeting`: date, required
      - `host_id`: the host who leads it. Every club has **exactly one**, so it's required, and it must reference `hosts`.

      The last query summarizes the table's rules: `f` = foreign key, `n` = not null, `p` = primary key.
    sql: |
      CREATE TABLE hosts (
          host_id    integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          full_name  text NOT NULL
      );

      -- Create clubs here.

      SELECT contype, count(*)
      FROM pg_constraint
      WHERE conrelid = 'clubs'::regclass
      GROUP BY contype
      ORDER BY contype;
    broken_starter: true
    expect: |
      CREATE TABLE hosts (
          host_id    integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          full_name  text NOT NULL
      );

      CREATE TABLE clubs (
          club_id        integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          name           text NOT NULL,
          first_meeting  date NOT NULL,
          host_id        integer NOT NULL REFERENCES hosts (host_id)
      );

      SELECT contype, count(*)
      FROM pg_constraint
      WHERE conrelid = 'clubs'::regclass
      GROUP BY contype
      ORDER BY contype;

  - kind: explain
    title: Naming foreign keys
    body: |
      The convention: **name the FK column after the table it points at, plus `_id`**: `host_id`, `customer_id`, `book_id`. Anyone reading `clubs` can guess where `host_id` leads, and `USING (host_id)` just works (Module 14).

      When one table points at the **same** parent twice, name each column by its **role**:

      ```sql
      billing_address_id   integer REFERENCES addresses (address_id),
      shipping_address_id  integer REFERENCES addresses (address_id)
      ```

      Same for self-references: `manager_id`, not `employee_id_2`.

  - kind: choice
    title: "Quick check: name the columns"
    body: "Each order is **packed by** one employee and **checked by** another employee. Both columns point at `employees`. What should they be called?"
    options:
      - "`employee_id` and `employee_id_2`"
      - "`employee_id` for both"
      - "`packed_by_id` and `checked_by_id`"
      - "`emp1` and `emp2`"
    answer: 2
    explanation: "When two columns point at the same parent, name them by their **role**. `employee_id_2` says nothing about what the second employee did, and two columns can't share a name."

  - kind: explain
    title: Diagram tools
    body: |
      You can sketch on paper, but tools keep diagrams tidy and shareable:

      - **dbdiagram.io** (free, in the browser): you *type* the tables, and it draws the diagram. Fast to change.
      - **DBeaver** (free app): connect to a database and open any schema's **ER Diagram** tab to see the existing tables drawn for you.
      - **pgAdmin 4** (free, see *Take it to your Mac*): right-click a database → **ERD For Database**.

      Typing a model in dbdiagram.io looks like this:

      ```text
      Table hosts {
        host_id integer [pk]
        full_name text [not null]
      }
      Table clubs {
        club_id integer [pk]
        host_id integer [not null, ref: > hosts.host_id]
      }
      ```

  - kind: mac
    title: See Inkwell's diagram
    body: |
      If you installed **pgAdmin 4**, open it, expand *Servers →* your local server *→ Databases*, right-click **bookstore**, and choose **ERD For Database**. Compare the lines to the list of foreign keys from earlier. Or open **dbdiagram.io** and type the book-club model above.

      In Terminal, real psql's `\d` lists a table's foreign keys at the bottom of its output:
    commands: |
      psql bookstore
      \d orders
      \q

  - kind: try
    title: "Your turn: one book, many editions"
    body: |
      Requirement: *"A book can come out in several **editions**. Each edition belongs to exactly one book, has a **format** (always given), may have its own **isbn** (never shared by two editions), and a **published_on** date."*

      Create **editions** with `edition_id`, `book_id`, `format`, `isbn` and `published_on`. Checked by trying some rows.
    sql: |
      -- Write your CREATE TABLE here
    expect: |
      CREATE TABLE editions (
          edition_id    integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          book_id       integer NOT NULL REFERENCES books (book_id),
          format        text NOT NULL,
          isbn          text UNIQUE,
          published_on  date
      );
    state_query: |
      CREATE FUNCTION pg_temp.run_tests() RETURNS TABLE (test text, result text) LANGUAGE plpgsql AS $$
      DECLARE t record;
      BEGIN
        FOR t IN SELECT * FROM (VALUES
          (1, $l$a paperback of book 7$l$, $q$INSERT INTO editions (book_id, format, isbn) VALUES (7, 'paperback', '111')$q$),
          (2, $l$an ebook of book 7, no isbn$l$, $q$INSERT INTO editions (book_id, format) VALUES (7, 'ebook')$q$),
          (3, $l$another edition with isbn 111$l$, $q$INSERT INTO editions (book_id, format, isbn) VALUES (8, 'hardcover', '111')$q$),
          (4, $l$an edition with no format$l$, $q$INSERT INTO editions (book_id) VALUES (8)$q$),
          (5, $l$an edition with no book$l$, $q$INSERT INTO editions (format) VALUES ('audio')$q$),
          (6, $l$an edition of book 999$l$, $q$INSERT INTO editions (book_id, format) VALUES (999, 'audio')$q$)
        ) AS v(n, label, sql) ORDER BY n LOOP
          test := t.label;
          BEGIN
            EXECUTE t.sql;
            result := 'accepted';
          EXCEPTION WHEN division_by_zero THEN
            result := 'wrong';
          WHEN OTHERS THEN
            result := CASE WHEN SQLSTATE IN ('42P01', '42703') THEN 'missing table or column' ELSE 'rejected' END;
          END;
          RETURN NEXT;
        END LOOP;
      END $$;
      SELECT test, result FROM pg_temp.run_tests();
    hint: |
      The "many" side (editions) holds the foreign key. "Exactly one book" means the FK is NOT NULL. "Never shared" is UNIQUE, which still allows several NULLs.

  - kind: try
    title: "Your turn: a wishlist"
    body: |
      Requirement: *"Customers keep **wishlists** of books. A book can be on many customers' wishlists, and a customer can wish for many books, but the same book appears on one customer's list at most once. We record **when** it was added, now by default."*

      Create **wishlist_items** with `customer_id`, `book_id` and `added_at`. Checked by trying some rows.
    sql: |
      -- Write your CREATE TABLE here
    expect: |
      CREATE TABLE wishlist_items (
          customer_id  integer REFERENCES customers (customer_id),
          book_id      integer REFERENCES books (book_id),
          added_at     timestamptz NOT NULL DEFAULT now(),
          PRIMARY KEY (customer_id, book_id)
      );
    state_query: |
      CREATE FUNCTION pg_temp.run_tests() RETURNS TABLE (test text, result text) LANGUAGE plpgsql AS $$
      DECLARE t record;
      BEGIN
        FOR t IN SELECT * FROM (VALUES
          (1, $l$customer 1 wishes for book 7$l$, $q$INSERT INTO wishlist_items (customer_id, book_id) VALUES (1, 7)$q$),
          (2, $l$customer 1 wishes for book 8$l$, $q$INSERT INTO wishlist_items (customer_id, book_id) VALUES (1, 8)$q$),
          (3, $l$customer 2 wishes for book 7$l$, $q$INSERT INTO wishlist_items (customer_id, book_id) VALUES (2, 7)$q$),
          (4, $l$customer 1 wishes for book 7 again$l$, $q$INSERT INTO wishlist_items (customer_id, book_id) VALUES (1, 7)$q$),
          (5, $l$a missing customer$l$, $q$INSERT INTO wishlist_items (customer_id, book_id) VALUES (999, 7)$q$),
          (6, $l$a missing book$l$, $q$INSERT INTO wishlist_items (customer_id, book_id) VALUES (1, 999)$q$),
          (7, $l$added_at fills itself$l$, $q$SELECT 1 / (count(*) = 3)::int FROM wishlist_items WHERE added_at IS NOT NULL$q$)
        ) AS v(n, label, sql) ORDER BY n LOOP
          test := t.label;
          BEGIN
            EXECUTE t.sql;
            result := 'accepted';
          EXCEPTION WHEN division_by_zero THEN
            result := 'wrong';
          WHEN OTHERS THEN
            result := CASE WHEN SQLSTATE IN ('42P01', '42703') THEN 'missing table or column' ELSE 'rejected' END;
          END;
          RETURN NEXT;
        END LOOP;
      END $$;
      SELECT test, result FROM pg_temp.run_tests();
    hint: |
      Many-to-many → a junction table with two foreign keys, and its primary key is the pair.

  - kind: try
    title: "Find the bug: two ratings from one person"
    body: |
      This design for star **ratings** lets the same customer rate the same book twice, which breaks every average. Fix the table so each customer can rate each book **once**, and ratings stay between **1 and 5**. Checked by trying some rows.
    sql: |
      CREATE TABLE ratings (
          rating_id    integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          customer_id  integer NOT NULL REFERENCES customers (customer_id),
          book_id      integer NOT NULL REFERENCES books (book_id),
          stars        integer NOT NULL CHECK (stars BETWEEN 1 AND 5)
      );
    expect: |
      CREATE TABLE ratings (
          rating_id    integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          customer_id  integer NOT NULL REFERENCES customers (customer_id),
          book_id      integer NOT NULL REFERENCES books (book_id),
          stars        integer NOT NULL CHECK (stars BETWEEN 1 AND 5),
          UNIQUE (customer_id, book_id)
      );
    state_query: |
      CREATE FUNCTION pg_temp.run_tests() RETURNS TABLE (test text, result text) LANGUAGE plpgsql AS $$
      DECLARE t record;
      BEGIN
        FOR t IN SELECT * FROM (VALUES
          (1, $l$Emma rates Dune 5$l$, $q$INSERT INTO ratings (customer_id, book_id, stars) VALUES (1, 7, 5)$q$),
          (2, $l$Emma rates Dune again$l$, $q$INSERT INTO ratings (customer_id, book_id, stars) VALUES (1, 7, 4)$q$),
          (3, $l$Liam rates Dune$l$, $q$INSERT INTO ratings (customer_id, book_id, stars) VALUES (2, 7, 4)$q$),
          (4, $l$a 6-star rating$l$, $q$INSERT INTO ratings (customer_id, book_id, stars) VALUES (3, 7, 6)$q$)
        ) AS v(n, label, sql) ORDER BY n LOOP
          test := t.label;
          BEGIN
            EXECUTE t.sql;
            result := 'accepted';
          EXCEPTION WHEN division_by_zero THEN
            result := 'wrong';
          WHEN OTHERS THEN
            result := CASE WHEN SQLSTATE IN ('42P01', '42703') THEN 'missing table or column' ELSE 'rejected' END;
          END;
          RETURN NEXT;
        END LOOP;
      END $$;
      SELECT test, result FROM pg_temp.run_tests();
    hint: |
      The surrogate key `rating_id` is unique, but nothing stops the same (customer, book) pair from repeating. Add a rule for the pair.

  - kind: why
    body: |
      A good model makes every later query simple, and a bad one makes every query a fight. Ten minutes turning requirements into entities, relationships and crow's feet saves months of workarounds.

  - kind: recap
    body: |
      - **Entities** → tables, **attributes** → columns, **relationships** → foreign keys or junction tables.
      - In requirements, nouns are entities or attributes, and verbs are relationships.
      - Ask **cardinality** (one or many?) and **optionality** (can it be zero?), in both directions.
      - Crow's foot: `||` exactly one, `o|` zero or one, `|<` one or more, `o<` zero or more.
      - Required relationship → FK `NOT NULL`. Many-to-many → junction table, which also holds the relationship's own attributes.
      - FK columns are named `<table>_id`, or by role when there are two.
      - Tools: dbdiagram.io, DBeaver's ER view, pgAdmin's ERD.
