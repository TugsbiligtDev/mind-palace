pass: 3
questions:
  - type: mcq
    prompt: A publisher's phone is stored on every sale. Deleting a publisher's only sale loses its phone number. Which anomaly is that?
    options:
      - Update anomaly
      - Insert anomaly
      - Delete anomaly
      - Join anomaly
    answer: 2
    explanation: A delete anomaly is when removing one fact (the sale) also removes an unrelated fact (the phone) that was only stored there.

  - type: mcq
    prompt: "A `students` table has a column `courses` holding `'Math, Art, Music'`. Which normal form does it break?"
    options:
      - 1NF
      - 2NF
      - 3NF
      - None
    answer: 0
    explanation: 1NF requires one value per cell. The fix is a junction table with one row per student-course pair.

  - type: mcq
    prompt: "`enrollments (student_id, course_id, grade, course_name)`, primary key `(student_id, course_id)`. What's wrong?"
    options:
      - grade depends on student_id alone, so it should move to students
      - course_name depends on only part of the key, so it breaks 2NF
      - "Nothing: every column depends on the key, so it is already in 3NF"
      - The table needs a separate enrollment_id, or it can't be normalized
    answer: 1
    explanation: course_name depends on only part of the composite key. Move it to a courses table.

  - type: mcq
    prompt: "`employees (employee_id, department_id, department_name)`. Why isn't it in 3NF?"
    options:
      - It has no primary key, so no column can be relied on
      - department_name depends on department_id, which isn't the key
      - department_id should be text, so the name can be stored in it
      - Two columns mention departments, which repeats the same idea
    answer: 1
    explanation: That's a chain, employee_id → department_id → department_name. Move department_name to a departments table.

  - type: predict
    prompt: What does the last statement return?
    code: |
      CREATE TABLE lines (copies integer, price numeric, total numeric);
      INSERT INTO lines VALUES (2, 50, 100);
      UPDATE lines SET copies = 3;
      SELECT total, copies * price AS real_total FROM lines;
    options:
      - "100 | 150"
      - "150 | 150"
      - "100 | 100"
      - "150 | 100"
    answer: 0
    explanation: The stored total wasn't updated, so it still says 100 while the real total is 3 × 50 = 150. That's why you calculate instead of storing.
