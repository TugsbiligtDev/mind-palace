pass: 3
questions:
  - type: mcq
    prompt: A guide's phone is stored on every booking. Deleting a guide's only booking loses their phone number. Which anomaly is that?
    options:
      - Update anomaly
      - Insert anomaly
      - Delete anomaly
      - Join anomaly
    answer: 2
    explanation: A delete anomaly is when removing one fact (the booking) also removes an unrelated fact (the phone) that was only stored there.

  - type: mcq
    prompt: "A `students` table has a column `courses` holding `'Math, Art, Music'`. Which normal form does it break?"
    options:
      - 1NF
      - 2NF
      - 3NF
      - None
    answer: 0
    explanation: 1NF requires one value per cell. The fix is a junction table with one row per student-course pair.

  - type: mcq
    prompt: "`order_items (order_id, product_id, quantity, product_name)`, primary key `(order_id, product_id)`. What's wrong?"
    options:
      - quantity should move to orders
      - product_name depends on product_id alone, part of the key, so it breaks 2NF
      - Nothing, it's in 3NF
      - The key should be quantity
    answer: 1
    explanation: product_name depends on only part of the composite key. Move it to a products table.

  - type: mcq
    prompt: "`employees (employee_id, department_id, department_name)`. Why isn't it in 3NF?"
    options:
      - It has no primary key
      - department_name depends on department_id, which isn't the key
      - department_id should be text
      - It has too many columns
    answer: 1
    explanation: That's a chain, employee_id → department_id → department_name. Move department_name to a departments table.

  - type: predict
    prompt: What does the last statement return?
    code: |
      CREATE TABLE stays (nights integer, price numeric, total numeric);
      INSERT INTO stays VALUES (2, 50, 100);
      UPDATE stays SET nights = 3;
      SELECT total, nights * price AS real_total FROM stays;
    options:
      - "100 | 150"
      - "150 | 150"
      - "100 | 100"
      - "150 | 100"
    answer: 0
    explanation: The stored total wasn't updated, so it still says 100 while the real total is 3 × 50 = 150. That's why you calculate instead of storing.
