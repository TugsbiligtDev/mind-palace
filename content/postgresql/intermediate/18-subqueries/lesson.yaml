steps:
  - kind: explain
    title: "New data: the bookstore grows up"
    body: |
      Inkwell has been busy. For the Intermediate level, the `bookstore` database holds two and a half years of real trading (January 2023 to June 2026):

      | Table | Rows |
      |---|---|
      | books | 300 |
      | customers | 5,020 |
      | orders | 39,419 |
      | order_items | 69,881 |
      | payments (new) | 37,611, including 997 refunds (full and partial) |
      | reviews | 7,360 |
      | raw_customer_import (new) | 310 messy rows to clean up |

      Books also gained `description`, `details` (JSON) and `tags` (a list), and customers gained a `time_zone`. On your Mac, it's built by `02_bookstore.sql` followed by `03_bookstore_growth.sql`.

      With this much data, `SELECT *` on a big table shows only the first 200 rows. Real answers come from WHERE, GROUP BY and LIMIT.

  - kind: try
    title: How big is it?
    body: |
      Run it. Then change `orders` to `order_items` or `reviews`.
    sql: |
      SELECT count(*) FROM orders;

  - kind: explain
    title: A query inside a query
    body: |
      *"Which books cost more than average?"* You'd need two steps: work out the average, then compare. A **subquery** does both in one statement: a complete SELECT in parentheses, used inside another query.

      ```sql
      SELECT title, price
      FROM books
      WHERE price > (SELECT avg(price) FROM books);
      ```

      PostgreSQL runs the inner query, gets 18.06, and uses that value in the outer WHERE. Subqueries can go in three places: **WHERE** (to filter), **SELECT** (to add a column), and **FROM** (as a temporary table).

  - kind: try
    title: More than average
    body: |
      Run it: 141 of the 300 books beat the average price. Then run just the part in parentheses on its own, to see the value it produces.
    sql: |
      SELECT title, price
      FROM books
      WHERE price > (SELECT avg(price) FROM books)
      ORDER BY price DESC;

  - kind: explain
    title: Scalar subqueries
    body: |
      A subquery that returns **exactly one value** (one row, one column) is a **scalar subquery**. You can use it anywhere a single value fits: in a comparison, in a calculation, as a column.

      ```sql
      SELECT full_name,
             salary,
             salary - (SELECT avg(salary) FROM employees) AS above_average
      FROM employees;
      ```

      If it returns **no rows**, the value is NULL. If it returns **more than one** row, PostgreSQL stops with an error, because it can't squeeze a list into one value.

  - kind: try
    title: Your turn with a scalar subquery
    body: |
      Inkwell has 8 employees. Return the `full_name` and `salary` of every employee who earns **more than the average salary**.
    sql: |
      SELECT full_name, salary
      FROM employees;
    expect: |
      SELECT full_name, salary
      FROM employees
      WHERE salary > (SELECT avg(salary) FROM employees);

  - kind: try
    title: Too many rows for one value
    body: |
      The inner query returns 9 genres, but `=` needs one value. Run it and read the error.
    sql: |
      SELECT title
      FROM books
      WHERE genre_id = (SELECT genre_id FROM genres);
    expect_error: true

  - kind: explain
    title: IN with a subquery
    body: |
      When the inner query returns a **list**, use `IN`:

      ```sql
      SELECT first_name, last_name
      FROM customers
      WHERE customer_id IN (SELECT customer_id FROM orders WHERE status = 'cancelled');
      ```

      Read it as: *customers whose ID is in the list of IDs with a cancelled order.* The subquery must return **one column**. Duplicates in the list don't matter: a customer with three cancelled orders still appears once.

      Compared with a join, IN never multiplies rows (no fan-out, Module 14). It only asks "is this in the list?"

  - kind: try
    title: Your turn with IN
    body: |
      Return the `full_name` of every employee who has rung up **at least one order** in the shop. Use `IN` with a subquery on `orders`.
    sql: |
      SELECT full_name
      FROM employees;
    expect: |
      SELECT full_name
      FROM employees
      WHERE employee_id IN (SELECT employee_id FROM orders);

  - kind: explain
    title: EXISTS and NOT EXISTS
    body: |
      **`EXISTS (subquery)`** is true if the subquery returns **at least one row**. What it returns doesn't matter, so people write `SELECT 1`:

      ```sql
      SELECT p.name
      FROM publishers p
      WHERE NOT EXISTS (
          SELECT 1 FROM books b
          WHERE b.publisher_id = p.publisher_id
      );
      ```

      Notice the inner query mentions **`p`**, the outer table. For each publisher, it asks "is there a book for *this* one?" That's a **correlated** subquery (more below).

      `NOT EXISTS` is the clearest, safest way to say **"has none"**. It gives the same answer as the LEFT JOIN … IS NULL pattern from Module 14.

  - kind: try
    title: A publisher with no books
    body: |
      Run it: Blue Owl Press, which hasn't published anything yet. Then remove `NOT` to list the five publishers that have.
    sql: |
      SELECT p.name
      FROM publishers p
      WHERE NOT EXISTS (
          SELECT 1 FROM books b
          WHERE b.publisher_id = p.publisher_id
      );

  - kind: explain
    title: The NOT IN trap, in full
    body: |
      Module 7 previewed it: `x NOT IN (list)` means `x <> each item AND …`. If **any** item in the list is NULL, one of those comparisons is unknown, so the whole condition can never be true. **You get zero rows, and no error.**

      With a subquery, you can't see the list, so a single NULL sneaking into the inner column silently breaks the query. It might work for months, until someone saves a row with a missing value.

      **The fix: use `NOT EXISTS` instead of `NOT IN` with subqueries.** NOT EXISTS isn't affected by NULLs. (`IN` is fine; only `NOT IN` has the trap.)

  - kind: try
    title: One NULL breaks NOT IN
    body: |
      *"Which publishers have no books?"* A new book with an **unknown** publisher is added, then NOT IN is asked. Run it: zero rows.

      Delete the INSERT and run again: Blue Owl Press appears. One NULL made it vanish.
    sql: |
      INSERT INTO books (title, genre_id, price) VALUES ('Untitled Manuscript', 4, 9.99);

      SELECT name
      FROM publishers
      WHERE publisher_id NOT IN (SELECT publisher_id FROM books);

  - kind: try
    title: Your turn to fix it with NOT EXISTS
    body: |
      Keep the INSERT. Rewrite the query with **NOT EXISTS**, so it returns Blue Owl Press even with the NULL present.
    sql: |
      INSERT INTO books (title, genre_id, price) VALUES ('Untitled Manuscript', 4, 9.99);

      SELECT name
      FROM publishers
      WHERE publisher_id NOT IN (SELECT publisher_id FROM books);
    expect: |
      INSERT INTO books (title, genre_id, price) VALUES ('Untitled Manuscript', 4, 9.99);

      SELECT p.name
      FROM publishers p
      WHERE NOT EXISTS (
          SELECT 1 FROM books b
          WHERE b.publisher_id = p.publisher_id
      );

  - kind: explain
    title: Correlated subqueries
    body: |
      A **correlated** subquery refers to a column of the **outer** query, so its answer is different for each outer row. Think of it as re-running once per row:

      ```sql
      SELECT e.full_name,
             (SELECT count(*)
              FROM orders o
              WHERE o.employee_id = e.employee_id) AS orders_rung_up
      FROM employees e;
      ```

      For Tom it counts Tom's orders, for Sara, Sara's, and so on. Unlike a plain subquery (which runs once), this one depends on `e`.

      They're very readable. On big tables they can be slow, and a join with GROUP BY often does the same job faster (Module 33 shows how to tell).

  - kind: try
    title: Your turn with a correlated subquery
    body: |
      Show each employee's `full_name`, `job_title`, `salary`, and the **average salary of everyone with the same job title**, rounded to 2 decimals and labeled **title_avg**.

      Hint: give the outer table an alias like `e`, and give the inner one a different alias like `x`, then match `x.job_title = e.job_title`.
    sql: |
      SELECT full_name, job_title, salary
      FROM employees;
    expect: |
      SELECT e.full_name, e.job_title, e.salary,
             (SELECT round(avg(x.salary), 2)
              FROM employees x
              WHERE x.job_title = e.job_title) AS title_avg
      FROM employees e;

  - kind: explain
    title: Subqueries in FROM (derived tables)
    body: |
      A subquery in **FROM** acts like a temporary table, called a **derived table**. It **must have an alias**:

      ```sql
      SELECT round(avg(total), 2) AS avg_order_value
      FROM (
          SELECT order_id, sum(quantity * unit_price) AS total
          FROM order_items
          GROUP BY order_id
      ) AS order_totals;
      ```

      This answers a two-level question: first total each order, then average those totals (35.68). A plain `avg(unit_price)` would average the **order lines**, which is a different number.

  - kind: try
    title: Your turn to follow the money
    body: |
      What customers paid should match what they bought. The starter totals the **payments** per order (refunds are negative). Add a second derived table that totals **quantity × unit_price** per order from `order_items`, join them on `order_id`, and return only orders where the two **don't match**.

      Return `order_id`, `paid` and `bought`. You should get 997 orders: every one of them was refunded, some fully and some partly.
    sql: |
      SELECT p.order_id, p.paid
      FROM (SELECT order_id, sum(amount) AS paid
            FROM payments
            GROUP BY order_id) AS p;
    expect: |
      SELECT p.order_id, p.paid, t.bought
      FROM (SELECT order_id, sum(amount) AS paid
            FROM payments
            GROUP BY order_id) AS p
      JOIN (SELECT order_id, sum(quantity * unit_price) AS bought
            FROM order_items
            GROUP BY order_id) AS t ON t.order_id = p.order_id
      WHERE p.paid <> t.bought;

  - kind: why
    body: |
      Subqueries let you ask a question *about* the answer to another question: above the average, in this list, with no matching rows. And knowing why NOT EXISTS beats NOT IN will save you from one of SQL's sneakiest silent bugs.

  - kind: recap
    body: |
      - A **subquery** is a SELECT in parentheses inside another query: in WHERE, SELECT or FROM.
      - **Scalar**: one row, one column. More than one row is an error. No rows gives NULL.
      - `IN (subquery)`: is the value in the list? Never multiplies rows.
      - `EXISTS` / `NOT EXISTS`: is there at least one / no matching row?
      - **`NOT IN` + a NULL in the list = zero rows.** Use `NOT EXISTS` with subqueries.
      - **Correlated** subqueries use outer columns and run per row.
      - **Derived tables** (subqueries in FROM) need an alias, and are great for "aggregate, then aggregate again".
