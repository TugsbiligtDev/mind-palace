steps:
  - kind: explain
    title: A query inside a query
    body: |
      *"Which attractions cost more than average?"* You'd need two steps: work out the average, then compare. A **subquery** does both in one statement: a complete SELECT in parentheses, used inside another query.

      ```sql
      SELECT name, entry_fee
      FROM attractions
      WHERE entry_fee > (SELECT avg(entry_fee) FROM attractions);
      ```

      PostgreSQL runs the inner query, gets 17.81, and uses that value in the outer WHERE. Subqueries can go in three places: **WHERE** (to filter), **SELECT** (to add a column), and **FROM** (as a temporary table).

  - kind: try
    title: More than average
    body: |
      Run it. Six attractions beat the average fee. Then run just the part in parentheses on its own, to see the value it produces.
    sql: |
      SELECT name, entry_fee
      FROM attractions
      WHERE entry_fee > (SELECT avg(entry_fee) FROM attractions);

  - kind: explain
    title: Scalar subqueries
    body: |
      A subquery that returns **exactly one value** (one row, one column) is a **scalar subquery**. You can use it anywhere a single value fits: in a comparison, in a calculation, as a column.

      ```sql
      SELECT full_name,
             salary,
             salary - (SELECT avg(salary) FROM employees) AS above_average
      FROM employees;
      ```

      If it returns **no rows**, the value is NULL. If it returns **more than one** row, PostgreSQL stops with an error, because it can't squeeze a list into one value.

  - kind: try
    title: Your turn with a scalar subquery
    body: |
      Wanderly now has an `employees` table. Return the `full_name` and `salary` of every employee who earns **more than the average salary**.
    sql: |
      SELECT full_name, salary
      FROM employees;
    expect: |
      SELECT full_name, salary
      FROM employees
      WHERE salary > (SELECT avg(salary) FROM employees);

  - kind: try
    title: Too many rows for one value
    body: |
      The inner query returns 5 continents, but `=` needs one value. Run it and read the error.
    sql: |
      SELECT name
      FROM cities
      WHERE country_id = (SELECT country_id FROM countries);
    expect_error: true

  - kind: explain
    title: IN with a subquery
    body: |
      When the inner query returns a **list**, use `IN`:

      ```sql
      SELECT full_name
      FROM travelers
      WHERE traveler_id IN (SELECT traveler_id FROM trips WHERE status = 'completed');
      ```

      Read it as: *travelers whose ID is in the list of IDs with a completed trip.* The subquery must return **one column**. Duplicates in the list don't matter: Amina appears once even with several completed trips.

      Compared with a join, IN never multiplies rows (no fan-out, Module 14). It only asks "is this in the list?"

  - kind: try
    title: Your turn with IN
    body: |
      Return the `full_name` of every traveler who has written **at least one review**. Use `IN` with a subquery on `reviews`.
    sql: |
      SELECT full_name
      FROM travelers;
    expect: |
      SELECT full_name
      FROM travelers
      WHERE traveler_id IN (SELECT traveler_id FROM reviews);

  - kind: explain
    title: EXISTS and NOT EXISTS
    body: |
      **`EXISTS (subquery)`** is true if the subquery returns **at least one row**. What it returns doesn't matter, so people write `SELECT 1`:

      ```sql
      SELECT a.name
      FROM attractions a
      WHERE NOT EXISTS (
          SELECT 1 FROM reviews r
          WHERE r.attraction_id = a.attraction_id
      );
      ```

      Notice the inner query mentions **`a`**, the outer table. For each attraction, it asks "is there a review for *this* one?" That's a **correlated** subquery (more below).

      `NOT EXISTS` is the clearest, safest way to say **"has none"**. It gives the same answer as the LEFT JOIN … IS NULL pattern from Module 14.

  - kind: try
    title: Attractions nobody reviewed
    body: |
      Run it: the two unreviewed attractions. Then remove `NOT` to list the reviewed ones instead.
    sql: |
      SELECT a.name
      FROM attractions a
      WHERE NOT EXISTS (
          SELECT 1 FROM reviews r
          WHERE r.attraction_id = a.attraction_id
      );

  - kind: explain
    title: The NOT IN trap, in full
    body: |
      Module 7 previewed it: `x NOT IN (list)` means `x <> each item AND …`. If **any** item in the list is NULL, one of those comparisons is unknown, so the whole condition can never be true. **You get zero rows, and no error.**

      With a subquery, you can't see the list, so a single NULL sneaking into the inner column silently breaks the query. It might work for months, until someone saves a row with a missing value.

      **The fix: use `NOT EXISTS` instead of `NOT IN` with subqueries.** NOT EXISTS isn't affected by NULLs. (`IN` is fine; only `NOT IN` has the trap.)

  - kind: try
    title: One NULL breaks NOT IN
    body: |
      *"Which destinations does no traveler call home?"* A new traveler with an **unknown** home city is added, then NOT IN is asked. Run it: zero rows.

      Delete the INSERT and run again: 6 cities appear. One NULL made them all vanish.
    sql: |
      INSERT INTO travelers (full_name) VALUES ('Nara Nomad');

      SELECT name
      FROM cities
      WHERE name NOT IN (SELECT home_city FROM travelers);

  - kind: try
    title: Your turn to fix it with NOT EXISTS
    body: |
      Keep the INSERT. Rewrite the query with **NOT EXISTS**, so it returns the 6 cities even with the NULL present.
    sql: |
      INSERT INTO travelers (full_name) VALUES ('Nara Nomad');

      SELECT name
      FROM cities
      WHERE name NOT IN (SELECT home_city FROM travelers);
    expect: |
      INSERT INTO travelers (full_name) VALUES ('Nara Nomad');

      SELECT c.name
      FROM cities c
      WHERE NOT EXISTS (
          SELECT 1 FROM travelers t
          WHERE t.home_city = c.name
      );

  - kind: explain
    title: Correlated subqueries
    body: |
      A **correlated** subquery refers to a column of the **outer** query, so its answer is different for each outer row. Think of it as re-running once per row:

      ```sql
      SELECT tr.full_name,
             (SELECT count(*)
              FROM trips t
              WHERE t.traveler_id = tr.traveler_id) AS trips
      FROM travelers tr;
      ```

      For Amina it counts Amina's trips, for Baatar, Baatar's, and so on. Unlike a plain subquery (which runs once), this one depends on `tr`.

      They're very readable. On big tables they can be slow, and a join with GROUP BY often does the same job faster (Module 33 shows how to tell).

  - kind: try
    title: Your turn with a correlated subquery
    body: |
      Show each employee's `full_name`, `department`, `salary`, and the **average salary of their own department**, rounded to 2 decimals and labeled **dept_avg**.

      Hint: give the outer table an alias like `e`, and give the inner one a different alias like `d`, then match `d.department = e.department`.
    sql: |
      SELECT full_name, department, salary
      FROM employees;
    expect: |
      SELECT e.full_name, e.department, e.salary,
             (SELECT round(avg(d.salary), 2)
              FROM employees d
              WHERE d.department = e.department) AS dept_avg
      FROM employees e;

  - kind: explain
    title: Subqueries in FROM (derived tables)
    body: |
      A subquery in **FROM** acts like a temporary table, called a **derived table**. It **must have an alias**:

      ```sql
      SELECT round(avg(total), 2) AS avg_trip_cost
      FROM (
          SELECT trip_id, sum(cost) AS total
          FROM trip_stops
          GROUP BY trip_id
      ) AS trip_totals;
      ```

      This answers a two-level question: first total each trip, then average those totals. A plain `avg(cost)` would average the **stops**, which is a different number.

  - kind: try
    title: Your turn to follow the money
    body: |
      The payments ledger should match what each trip cost. The starter totals **paid** per trip. Add a second derived table that totals **cost** per trip from `trip_stops`, join them on `trip_id`, and return only trips where the two **don't match**.

      Return `trip_id`, `paid` and `cost`. One trip should stand out.
    sql: |
      SELECT p.trip_id, p.paid
      FROM (SELECT trip_id, sum(amount) AS paid
            FROM payments
            GROUP BY trip_id) AS p;
    expect: |
      SELECT p.trip_id, p.paid, c.cost
      FROM (SELECT trip_id, sum(amount) AS paid
            FROM payments
            GROUP BY trip_id) AS p
      JOIN (SELECT trip_id, sum(cost) AS cost
            FROM trip_stops
            GROUP BY trip_id) AS c ON c.trip_id = p.trip_id
      WHERE p.paid <> c.cost;

  - kind: why
    body: |
      Subqueries let you ask a question *about* the answer to another question: above the average, in this list, with no matching rows. And knowing why NOT EXISTS beats NOT IN will save you from one of SQL's sneakiest silent bugs.

  - kind: recap
    body: |
      - A **subquery** is a SELECT in parentheses inside another query: in WHERE, SELECT or FROM.
      - **Scalar**: one row, one column. More than one row is an error. No rows gives NULL.
      - `IN (subquery)`: is the value in the list? Never multiplies rows.
      - `EXISTS` / `NOT EXISTS`: is there at least one / no matching row?
      - **`NOT IN` + a NULL in the list = zero rows.** Use `NOT EXISTS` with subqueries.
      - **Correlated** subqueries use outer columns and run per row.
      - **Derived tables** (subqueries in FROM) need an alias, and are great for "aggregate, then aggregate again".
