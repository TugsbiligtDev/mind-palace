pass: 3
questions:
  - type: predict
    prompt: The 300 books have an average price of about 18.06, and 141 of them cost more than that. What does this return?
    code: |
      SELECT count(*)
      FROM books
      WHERE price < (SELECT avg(price) FROM books);
    options:
      - "141"
      - "159"
      - "300"
      - "0"
    answer: 1
    explanation: "141 books cost more than the average, so the other 159 cost less. (No book costs exactly 18.06.)"

  - type: mcq
    prompt: "`WHERE x NOT IN (SELECT y FROM t)` returns zero rows, even though you're sure some should match. What's the most likely cause?"
    options:
      - The subquery is too slow
      - Column y contains at least one NULL
      - NOT IN only works with numbers
      - x and y have different names
    answer: 1
    explanation: A NULL in the list makes `x <> NULL` unknown, so NOT IN is never true. Rewrite it with NOT EXISTS.

  - type: fill
    prompt: Find customers with **no** orders at all.
    code: |
      SELECT first_name FROM customers c
      WHERE ____ (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id);
    answer: NOT EXISTS
    accept: ["not exists"]
    explanation: "`NOT EXISTS` is true when the correlated subquery finds no rows for that customer."

  - type: mcq
    prompt: What makes a subquery **correlated**?
    options:
      - It's in the FROM clause
      - It uses a column from the outer query, so its result depends on each outer row
      - It returns more than one row
      - It uses GROUP BY
    answer: 1
    explanation: A correlated subquery refers to the outer query's row, like `o.customer_id = c.customer_id`, so it's evaluated per row.

  - type: predict
    prompt: What does this return?
    code: |
      SELECT max(n) AS biggest
      FROM (SELECT genre_id, count(*) AS n
            FROM books
            GROUP BY genre_id) AS g;
    options:
      - "300"
      - "9"
      - "46"
      - "30"
    answer: 2
    explanation: "The derived table counts books per genre (Science Fiction has the most, 46), and the outer query picks the biggest count."
