steps:
  - kind: explain
    title: Name a step with WITH
    body: |
      Derived tables (Module 18) work, but nesting them makes queries read inside-out. A **common table expression (CTE)** moves the subquery to the top and gives it a name:

      ```sql
      WITH order_totals AS (
          SELECT order_id, sum(quantity * unit_price) AS total
          FROM order_items
          GROUP BY order_id
      )
      SELECT round(avg(total), 2) AS avg_order_value
      FROM order_totals;
      ```

      Returns:

      | avg_order_value |
      |---|
      | 35.68 |

      The same answer as the derived table in Module 18. Now it reads **top to bottom**, like a recipe: *first make order_totals, then average them*. Inside the query, `order_totals` behaves like a table. It exists only while this one statement runs.

  - kind: try
    title: Your first CTE
    body: |
      Run it. Then change the final SELECT to `SELECT * FROM order_totals ORDER BY total DESC LIMIT 10;` to look inside the step.
    sql: |
      WITH order_totals AS (
          SELECT order_id, sum(quantity * unit_price) AS total
          FROM order_items
          GROUP BY order_id
      )
      SELECT round(avg(total), 2) AS avg_order_value
      FROM order_totals;

  - kind: explain
    title: Chaining steps
    body: |
      One WITH can define **several** CTEs, separated by commas. Each can use the ones **before** it:

      ```sql
      WITH order_totals AS (
          SELECT order_id, sum(quantity * unit_price) AS total
          FROM order_items
          GROUP BY order_id
      ),
      big_orders AS (
          SELECT order_id, total
          FROM order_totals
          WHERE total > 100
      )
      SELECT (SELECT count(*) FROM order_totals) AS all_orders,
             (SELECT count(*) FROM big_orders)   AS big_orders,
             (SELECT max(total) FROM big_orders) AS biggest;
      ```

      Returns:

      | all_orders | big_orders | biggest |
      |---|---|---|
      | 39419 | 1079 | 207.92 |

      `big_orders` is built from `order_totals`, the step before it. Each step does one small job and has a name that says what it holds. That's how you break a hard question into easy pieces (Module 25 comes back to this).

      A CTE can also be used **more than once** in the final query, which a derived table can't: `big_orders` is used twice above.

  - kind: try
    title: "Try it: a chain of CTEs"
    body: |
      Run it. Then change `100` to `150` and see how many big orders are left.

      Then replace the final SELECT with `SELECT * FROM big_orders ORDER BY total DESC LIMIT 5;` to look inside the second step. Nothing is graded here.
    sql: |
      WITH order_totals AS (
          SELECT order_id, sum(quantity * unit_price) AS total
          FROM order_items
          GROUP BY order_id
      ),
      big_orders AS (
          SELECT order_id, total
          FROM order_totals
          WHERE total > 100
      )
      SELECT (SELECT count(*) FROM order_totals) AS all_orders,
             (SELECT count(*) FROM big_orders)   AS big_orders,
             (SELECT max(total) FROM big_orders) AS biggest;

  - kind: try
    title: Your turn to chain CTEs
    body: |
      Rebuild the money check from Module 18 as a chain. The `paid` CTE is done. Add a `bought` CTE (total `quantity * unit_price` per order from `order_items`), then select `order_id`, `paid` and `bought` for orders where they **differ**.
    sql: |
      WITH paid AS (
          SELECT order_id, sum(amount) AS paid
          FROM payments
          GROUP BY order_id
      )
      SELECT * FROM paid;
    expect: |
      WITH paid AS (
          SELECT order_id, sum(amount) AS paid
          FROM payments
          GROUP BY order_id
      ),
      bought AS (
          SELECT order_id, sum(quantity * unit_price) AS bought
          FROM order_items
          GROUP BY order_id
      )
      SELECT order_id, paid, bought
      FROM paid
      JOIN bought USING (order_id)
      WHERE paid <> bought;

  - kind: explain
    title: Recursive CTEs
    body: |
      A **recursive** CTE refers to **itself**. It's how SQL walks chains of unknown length, like an org chart. It has two parts joined by `UNION ALL`:

      ```sql
      WITH RECURSIVE counter AS (
          SELECT 1 AS n                -- 1. the anchor: the starting row(s)
          UNION ALL
          SELECT n + 1 FROM counter    -- 2. the recursive part: builds on the
          WHERE n < 5                  --    rows from the previous round
      )
      SELECT n FROM counter;
      ```

      Returns:

      | n |
      |---|
      | 1 |
      | 2 |
      | 3 |
      | 4 |
      | 5 |

      PostgreSQL runs the anchor once, then keeps running the recursive part on the **newest** rows, until a round produces **no** new rows. Here: 1, then 2, 3, 4, 5, then `n < 5` stops it.

      The `WHERE` is essential. Without a stopping condition, it runs forever.

  - kind: try
    title: Count to five
    body: |
      Run it. Then change `n < 5` to `n < 10`.

      (The step is checked once your changed version has run.)
    sql: |
      WITH RECURSIVE counter AS (
          SELECT 1 AS n
          UNION ALL
          SELECT n + 1 FROM counter WHERE n < 5
      )
      SELECT n FROM counter;
    expect: |
      WITH RECURSIVE counter AS (
          SELECT 1 AS n
          UNION ALL
          SELECT n + 1 FROM counter WHERE n < 10
      )
      SELECT n FROM counter;

  - kind: explain
    title: Walking down an org chart
    body: |
      `employees.manager_id` points at another employee (a self-referencing FK, Module 13). To list everyone **under** the CEO, level by level:

      ```sql
      WITH RECURSIVE chart AS (
          SELECT employee_id, full_name, 0 AS depth
          FROM employees
          WHERE manager_id IS NULL                    -- anchor: the CEO
          UNION ALL
          SELECT e.employee_id, e.full_name, c.depth + 1
          FROM employees e
          JOIN chart c ON e.manager_id = c.employee_id  -- people whose manager is
      )                                                 -- already in the chart
      SELECT * FROM chart;
      ```

      Returns:

      | employee_id | full_name | depth |
      |---|---|---|
      | 1 | Helen Carter | 0 |
      | 2 | Marcus Reed | 1 |
      | 3 | Priya Sharma | 1 |
      | 4 | Tom Becker | 2 |
      | … | … | … |
      | 8 | Omar Haddad | 3 |

      Round 1 finds the CEO's direct reports, round 2 finds *their* reports, and so on, until nobody new is found. The stopping condition is built in: the chain simply runs out.

  - kind: try
    title: The whole chart
    body: |
      Run it. `depth` says how many levels below the CEO each person sits. Then add `ORDER BY depth, full_name`.

      (The step is checked once your changed version has run.)
    sql: |
      WITH RECURSIVE chart AS (
          SELECT employee_id, full_name, 0 AS depth
          FROM employees
          WHERE manager_id IS NULL
          UNION ALL
          SELECT e.employee_id, e.full_name, c.depth + 1
          FROM employees e
          JOIN chart c ON e.manager_id = c.employee_id
      )
      SELECT * FROM chart;
    expect: |
      WITH RECURSIVE chart AS (
          SELECT employee_id, full_name, 0 AS depth
          FROM employees
          WHERE manager_id IS NULL
          UNION ALL
          SELECT e.employee_id, e.full_name, c.depth + 1
          FROM employees e
          JOIN chart c ON e.manager_id = c.employee_id
      )
      SELECT * FROM chart
      ORDER BY depth, full_name;
    ordered: true

  - kind: try
    title: Your turn to walk up the chain
    body: |
      Walk the other way: from **Omar Haddad** (employee 8) **up** to the CEO. Return the `full_name` of Omar and every manager above Omar.

      Hint: the anchor is Omar's row. In the recursive part, join each chain row to **its manager**: `e.employee_id = c.manager_id`. So carry `manager_id` along in both parts.
    sql: |
      SELECT full_name, manager_id
      FROM employees
      WHERE employee_id = 8;
    expect: |
      WITH RECURSIVE chain AS (
          SELECT employee_id, full_name, manager_id
          FROM employees
          WHERE employee_id = 8
          UNION ALL
          SELECT e.employee_id, e.full_name, e.manager_id
          FROM employees e
          JOIN chain c ON e.employee_id = c.manager_id
      )
      SELECT full_name FROM chain;

  - kind: explain
    title: Guarding against loops
    body: |
      If the data ever contains a **cycle** (A manages B, B manages A), a recursive CTE never runs out of new rows and runs until it fails.

      Two protections:

      - **A depth limit**: carry a `depth` column and add `WHERE c.depth < 20` in the recursive part.
      - 🔹 **The `CYCLE` clause** (PostgreSQL 14+): `CYCLE employee_id SET is_cycle USING path` after the CTE makes PostgreSQL detect and stop at repeats for you.

      <!-- page -->

      **Example.** A tiny team where Ana's boss is Ben and Ben's boss is Ana: a loop. With a depth limit, the walk stops after 5 steps instead of running forever:

      ```sql
      CREATE TABLE team (person text PRIMARY KEY, boss text);
      INSERT INTO team VALUES ('Ana', 'Ben'), ('Ben', 'Ana');

      WITH RECURSIVE chain AS (
          SELECT person, boss, 1 AS depth FROM team WHERE person = 'Ana'
          UNION ALL
          SELECT t.person, t.boss, c.depth + 1
          FROM team t JOIN chain c ON t.person = c.boss
          WHERE c.depth < 5
      )
      SELECT * FROM chain;
      ```

      | person | boss | depth |
      |---|---|---|
      | Ana | Ben | 1 |
      | Ben | Ana | 2 |
      | Ana | Ben | 3 |
      | Ben | Ana | 4 |
      | Ana | Ben | 5 |

      With `CYCLE` instead, PostgreSQL stops as soon as a person repeats, and marks that row:

      ```sql
      WITH RECURSIVE chain AS (
          SELECT person, boss FROM team WHERE person = 'Ana'
          UNION ALL
          SELECT t.person, t.boss
          FROM team t JOIN chain c ON t.person = c.boss
      ) CYCLE person SET is_cycle USING path
      SELECT person, boss, is_cycle FROM chain;
      ```

      | person | boss | is_cycle |
      |---|---|---|
      | Ana | Ben | f |
      | Ben | Ana | f |
      | Ana | Ben | t |

  - kind: try
    title: "Try it: stop a loop"
    body: |
      Both examples. Run them and compare with the tables you just saw.

      Then play: change `depth < 5` to `depth < 2`, or remove the `CYCLE …` line from the second query (and run it on your Mac only if you like waiting: here it would stop with an error after running out of memory).

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      CREATE TABLE team (person text PRIMARY KEY, boss text);
      INSERT INTO team VALUES ('Ana', 'Ben'), ('Ben', 'Ana');

      WITH RECURSIVE chain AS (
          SELECT person, boss, 1 AS depth
          FROM team
          WHERE person = 'Ana'
          UNION ALL
          SELECT t.person, t.boss, c.depth + 1
          FROM team t JOIN chain c ON t.person = c.boss
          WHERE c.depth < 5
      )
      SELECT * FROM chain;

      WITH RECURSIVE chain AS (
          SELECT person, boss FROM team WHERE person = 'Ana'
          UNION ALL
          SELECT t.person, t.boss
          FROM team t JOIN chain c ON t.person = c.boss
      ) CYCLE person SET is_cycle USING path
      SELECT person, boss, is_cycle FROM chain;

  - kind: info
    title: "🔹 Data-modifying CTEs"
    body: |
      A CTE can contain INSERT, UPDATE or DELETE with RETURNING, and the rest of the statement can use the returned rows. The classic use is **moving** rows in one step:

      ```sql
      WITH moved AS (
          DELETE FROM reviews
          WHERE rating < 5
          RETURNING *
      )
      INSERT INTO old_reviews
      SELECT * FROM moved;
      ```

      Both happen together, or not at all. Recognize the pattern. You'll rarely need it early on.

  - kind: try
    title: Archive in one statement
    body: |
      `old_reviews` is an empty copy of the reviews table's columns. Run it: the non-5-star reviews move across in one statement.
    sql: |
      CREATE TABLE old_reviews (LIKE reviews);

      WITH moved AS (
          DELETE FROM reviews
          WHERE rating < 5
          RETURNING *
      )
      INSERT INTO old_reviews
      SELECT * FROM moved;

      SELECT (SELECT count(*) FROM reviews)     AS still_in_reviews,
             (SELECT count(*) FROM old_reviews) AS archived;

  - kind: try
    title: "Find the bug: the join that matched the wrong thing"
    body: |
      *"Orders worth more than 150, with their customer."* The CTE is right, but the final query returns nonsense. Find the mistake and fix it. Return `order_id`, `customer_id` and `total`.
    sql: |
      WITH totals AS (
          SELECT order_id, sum(quantity * unit_price) AS total
          FROM order_items
          GROUP BY order_id
      )
      SELECT o.order_id, o.customer_id, t.total
      FROM orders o
      JOIN totals t ON t.order_id = o.customer_id
      WHERE t.total > 150;
    expect: |
      WITH totals AS (
          SELECT order_id, sum(quantity * unit_price) AS total
          FROM order_items
          GROUP BY order_id
      )
      SELECT o.order_id, o.customer_id, t.total
      FROM orders o
      JOIN totals t ON t.order_id = o.order_id
      WHERE t.total > 150;
    hint: |
      Read the ON clause aloud. Which column of `orders` should an order id be matched with?

  - kind: why
    body: |
      Real analysis questions have several steps. CTEs let you write them as a named, top-to-bottom pipeline that you (and whoever reads it next) can check one step at a time. And recursive CTEs answer questions nothing else in SQL can: every level of an org chart, a category tree or a chain of referrals.

  - kind: recap
    body: |
      - `WITH name AS (SELECT …) SELECT … FROM name`: a named step that lasts for one statement.
      - Chain several with commas. Later steps can use earlier ones, and a CTE can be used more than once.
      - `WITH RECURSIVE`: **anchor** `UNION ALL` **recursive part**. It repeats on the newest rows until none are added.
      - Walk down a hierarchy with `child.manager_id = chain.id`, up with `parent.id = chain.manager_id`.
      - Always make sure it stops: a WHERE limit, or 🔹 the `CYCLE` clause.
      - 🔹 Data-modifying CTEs: `WITH x AS (DELETE … RETURNING *) INSERT … SELECT * FROM x`.
