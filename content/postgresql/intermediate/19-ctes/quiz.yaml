pass: 3
questions:
  - type: predict
    prompt: What does this return?
    code: |
      WITH RECURSIVE n AS (
          SELECT 1 AS x
          UNION ALL
          SELECT x * 2 FROM n WHERE x < 10
      )
      SELECT max(x) FROM n;
    options:
      - "8"
      - "10"
      - "16"
      - "32"
    answer: 2
    explanation: "The rows are 1, 2, 4, 8, 16. When x is 8, `8 < 10` is true, so 16 is added. Then `16 < 10` is false, so it stops. The max is 16."

  - type: mcq
    prompt: What are the two parts of a recursive CTE, joined by UNION ALL?
    options:
      - A SELECT that finds the rows, and a GROUP BY that combines them
      - An anchor (the starting rows) and a part that builds on the last round
      - A WHERE that picks the starting rows, and a HAVING that tells the recursion to stop
      - Two separate tables, one for parents and one for their children
    answer: 1
    explanation: The anchor runs once, then the recursive part keeps running on the newest rows until it adds nothing new.

  - type: fill
    prompt: Start a CTE that refers to itself.
    code: |
      WITH ____ nums AS (SELECT 1 AS n UNION ALL SELECT n + 1 FROM nums WHERE n < 3)
      SELECT * FROM nums;
    answer: RECURSIVE
    accept: ["recursive"]
    explanation: "`WITH RECURSIVE` lets a CTE refer to itself."

  - type: mcq
    prompt: Why would you choose a CTE over a nested subquery in FROM?
    options:
      - CTEs are always faster, since PostgreSQL stores their results
      - It reads top to bottom as named steps, and can be used more than once
      - Subqueries in FROM can't use GROUP BY, but CTEs can
      - CTEs are saved in the database, so other queries can reuse them later by name
    answer: 1
    explanation: CTEs are about readability and reuse. They last only for the one statement, and they aren't automatically faster.

  - type: predict
    prompt: Using Inkwell's `employees` table, what does this return?
    code: |
      WITH RECURSIVE under_marcus AS (
          SELECT employee_id FROM employees WHERE full_name = 'Marcus Reed'
          UNION ALL
          SELECT e.employee_id FROM employees e
          JOIN under_marcus u ON e.manager_id = u.employee_id
      )
      SELECT count(*) FROM under_marcus;
    options:
      - "1"
      - "3"
      - "4"
      - "9"
    answer: 2
    explanation: Marcus (the anchor) plus Marcus's three direct reports (Tom, Sara and Kenji), who have no reports of their own. That's 4.
