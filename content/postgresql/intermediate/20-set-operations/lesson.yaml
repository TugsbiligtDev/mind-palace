steps:
  - kind: explain
    title: Stacking results instead of joining them
    body: |
      A **join** puts tables *side by side*: more columns. A **set operation** stacks two query results *on top of each other*: more rows.

      ```sql
      SELECT country FROM customers
      UNION
      SELECT country FROM authors;
      ```

      This gives one list of every country Inkwell has a connection with, whether a customer lives there or an author comes from there.

      | Operator | Keeps |
      |---|---|
      | `UNION` | rows in **either** result, duplicates removed |
      | `UNION ALL` | rows in either result, **duplicates kept** |
      | `INTERSECT` | rows in **both** results |
      | `EXCEPT` | rows in the **first** result but **not** the second |

  - kind: try
    title: Every connected country
    body: |
      Run it: 21 countries. The UK has 617 customers and several authors, but appears once.

      Then change `UNION` to `UNION ALL` and look at the row count: 5,097, one per customer plus one per author.

      (The step is checked once your changed version has run.)
    sql: |
      SELECT country FROM customers
      UNION
      SELECT country FROM authors
      ORDER BY country;
    expect: |
      SELECT country FROM customers
      UNION ALL
      SELECT country FROM authors
      ORDER BY country;

  - kind: explain
    title: The matching rules
    body: |
      The two queries must line up:

      - the **same number of columns**
      - **compatible types** in each position (text with text, numbers with numbers)

      Columns are matched **by position**, not by name. The result takes its column names from the **first** query.

      `ORDER BY` goes once, at the very **end**, and sorts the combined result.

  - kind: try
    title: Mismatched columns
    body: |
      The first query has 2 columns and the second has 1. Run it and read the error. Then add `genre_id` to the second query so both have 2... and read the *next* error: text and integer don't mix in the second column. Fix it by selecting `published_year` in the first query instead of `isbn`.
    sql: |
      SELECT title, isbn FROM books
      UNION
      SELECT name FROM genres;
    expect_error: true

  - kind: explain
    title: UNION vs. UNION ALL
    body: |
      `UNION` removes duplicates, which means PostgreSQL has to **sort or hash** the whole result to find them. `UNION ALL` just appends.

      Use **`UNION ALL` by default**, whenever duplicates are impossible (different sources) or you actually want them (you'll count them later). Use `UNION` only when you really want each row once. It's both faster and more honest about your data.

      A handy trick is a **label column** saying where each row came from:

      ```sql
      SELECT first_name || ' ' || last_name AS name, 'author' AS kind FROM authors
      UNION ALL
      SELECT full_name, 'staff' FROM employees;
      ```

  - kind: try
    title: Your turn to build a people list
    body: |
      Build one list of the people who make Inkwell's books happen: every author's first and last name joined with a space, in a column called **name**, with the label `'author'` in a column called **kind**, stacked with every employee's `full_name` labeled `'staff'`. Sort it by `name`.
    sql: |
      SELECT first_name, last_name FROM authors;
    expect: |
      SELECT first_name || ' ' || last_name AS name, 'author' AS kind FROM authors
      UNION ALL
      SELECT full_name, 'staff' FROM employees
      ORDER BY name;
    ordered: true

  - kind: explain
    title: INTERSECT and EXCEPT
    body: |
      ```sql
      -- countries with both customers and authors
      SELECT country FROM customers
      INTERSECT
      SELECT country FROM authors;

      -- countries authors come from, where no customer lives
      SELECT country FROM authors
      EXCEPT
      SELECT country FROM customers;
      ```

      Both remove duplicates, like UNION. (`INTERSECT ALL` and `EXCEPT ALL` keep them.)

      **Order matters for EXCEPT**: `A EXCEPT B` is "A without B", which is different from `B EXCEPT A`.

      A bonus: set operations treat **two NULLs as equal**. So `EXCEPT` doesn't have the NOT IN + NULL trap from Module 18.

  - kind: try
    title: Your turn with EXCEPT
    body: |
      Which employees have **never rung up an order** in the shop? Return their `employee_id`s: all IDs from `employees`, except the ones that appear in `orders`.
    sql: |
      SELECT employee_id FROM employees;
    expect: |
      SELECT employee_id FROM employees
      EXCEPT
      SELECT employee_id FROM orders;

  - kind: try
    title: EXCEPT ignores the NULL trap
    body: |
      The book with an unknown publisher from Module 18 is back. NOT IN returned nothing. Run this EXCEPT version: publisher 6 (Blue Owl Press) still appears.

      (`orders.employee_id` in the step before is full of NULLs, from online orders. EXCEPT didn't mind those either.)
    sql: |
      INSERT INTO books (title, genre_id, price) VALUES ('Untitled Manuscript', 4, 9.99);

      SELECT publisher_id FROM publishers
      EXCEPT
      SELECT publisher_id FROM books;

  - kind: try
    title: "Find the bug: loyal customers"
    body: |
      *"Customers who ordered in **both** 2024 and 2025."* This returns everyone who ordered in **either** year. Fix the set operation. Return `customer_id`.
    sql: |
      SELECT customer_id FROM orders
      WHERE ordered_at >= '2024-01-01' AND ordered_at < '2025-01-01'
      UNION
      SELECT customer_id FROM orders
      WHERE ordered_at >= '2025-01-01' AND ordered_at < '2026-01-01';
    expect: |
      SELECT customer_id FROM orders
      WHERE ordered_at >= '2024-01-01' AND ordered_at < '2025-01-01'
      INTERSECT
      SELECT customer_id FROM orders
      WHERE ordered_at >= '2025-01-01' AND ordered_at < '2026-01-01';
    hint: |
      UNION = in either list. Which operation keeps only what's in both?

  - kind: why
    body: |
      Combining lists from different places (two sign-up sources, last year vs. this year, staff vs. customers) and comparing them ("who's in both?", "who's missing?") comes up constantly in reconciliation and data-cleaning work.

  - kind: recap
    body: |
      - Set operations stack results vertically. Joins combine them sideways.
      - `UNION` (no duplicates), `UNION ALL` (keeps duplicates, faster, the usual default), `INTERSECT` (in both), `EXCEPT` (in the first, not the second).
      - Same number of columns, compatible types, matched by position. Names come from the first query.
      - One `ORDER BY` at the very end.
      - A label column (`'staff' AS kind`) records where each row came from.
      - Set operations treat NULLs as equal, so EXCEPT is safe where NOT IN isn't.
