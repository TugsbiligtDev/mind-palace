pass: 3
questions:
  - type: predict
    prompt: What does this return?
    code: |
      SELECT count(*) FROM (
          SELECT 1 UNION SELECT 1 UNION ALL SELECT 1
      ) AS t;
    options:
      - "1"
      - "2"
      - "3"
      - An error
    answer: 1
    explanation: "They're applied left to right. `SELECT 1 UNION SELECT 1` removes the duplicate, leaving one row. `UNION ALL SELECT 1` then adds another, giving 2."

  - type: mcq
    prompt: Two queries return names from separate systems, and you want every row, including repeats. Which operator?
    options:
      - UNION
      - UNION ALL
      - INTERSECT
      - EXCEPT
    answer: 1
    explanation: UNION ALL keeps every row, and it's faster because it doesn't search for duplicates.

  - type: predict
    prompt: The six publishers are in the UK, USA, USA, USA, UK and Canada. What does this return?
    code: |
      SELECT country FROM publishers
      EXCEPT
      SELECT 'USA'
      ORDER BY country;
    options:
      - "Canada\nUK"
      - "Canada\nUK\nUK"
      - "USA"
      - "Canada\nUK\nUSA"
    answer: 0
    explanation: EXCEPT removes the USA and also removes duplicates, leaving Canada and the UK once each.

  - type: mcq
    prompt: "Why does `SELECT title, price FROM books UNION SELECT name FROM genres;` fail?"
    options:
      - UNION needs ORDER BY
      - The two queries have different numbers of columns
      - Table names must match
      - genres has no name column
    answer: 1
    explanation: Both sides of a set operation must have the same number of columns, with compatible types in each position.

  - type: fill
    prompt: List the countries where Inkwell has customers **and** authors.
    code: |
      SELECT country FROM customers
      ____
      SELECT country FROM authors;
    answer: INTERSECT
    accept: ["intersect"]
    explanation: "`INTERSECT` keeps rows that appear in both results. Here, that's 10 countries, from Australia to the USA."
