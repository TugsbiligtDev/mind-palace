steps:
  - kind: explain
    title: '"The latest one for each…"'
    body: |
      Some of the most common questions have this shape:

      - *the most recent payment for each order*
      - *each customer's first order*
      - *the two best-selling books in each genre*

      "Per group, but keep the **whole row**, not just a max value." `GROUP BY` can't do it directly: `max(paid_at)` gives you the latest time, but not the amount and method that go with it.

      PostgreSQL has two tools for this. This module covers both.

  - kind: explain
    title: DISTINCT ON
    body: |
      **`DISTINCT ON (columns)`** keeps **the first row of each group**, where "first" is decided by ORDER BY:

      ```sql
      SELECT DISTINCT ON (order_id)
             order_id, amount, paid_at
      FROM payments
      ORDER BY order_id, paid_at DESC;
      ```

      Read it as: *group by order_id, sort each group newest first, keep the top row.*

      **The rule:** ORDER BY must **start with the DISTINCT ON columns**, in the same order. The columns after them decide which row wins. Forget the tiebreaker part and you get an arbitrary row from each group.

      DISTINCT ON is PostgreSQL-specific. Other databases don't have it.

  - kind: try
    title: Latest payment per order
    body: |
      Orders 170 to 180. Run it: one row per paid order, its newest payment. Order 174's latest is a **refund** of −52.97. Interesting.

      Then change `paid_at DESC` to `paid_at` to get the **first** payment per order instead.
    sql: |
      SELECT DISTINCT ON (order_id)
             order_id, kind, amount, paid_at, method
      FROM payments
      WHERE order_id BETWEEN 170 AND 180
      ORDER BY order_id, paid_at DESC;

  - kind: try
    title: Break the rule
    body: |
      ORDER BY here doesn't start with `order_id`. Run it and read the error: *SELECT DISTINCT ON expressions must match initial ORDER BY expressions*.
    sql: |
      SELECT DISTINCT ON (order_id)
             order_id, amount, paid_at
      FROM payments
      WHERE order_id BETWEEN 170 AND 180
      ORDER BY paid_at DESC;
    expect_error: true

  - kind: try
    title: Your turn with DISTINCT ON
    body: |
      For Inkwell's first 20 customers (`customer_id` 20 or less), show each one's **first** order (the earliest `ordered_at`): `customer_id`, `order_id` and `ordered_at`.
    sql: |
      SELECT customer_id, order_id, ordered_at
      FROM orders
      WHERE customer_id <= 20;
    expect: |
      SELECT DISTINCT ON (customer_id)
             customer_id, order_id, ordered_at
      FROM orders
      WHERE customer_id <= 20
      ORDER BY customer_id, ordered_at;

  - kind: explain
    title: LATERAL
    body: |
      Normally a subquery in FROM can't see the other tables in the same FROM. **`LATERAL`** lifts that rule: a LATERAL subquery can use columns from the tables **to its left**, so it runs **once per row** of them, like a correlated subquery (Module 18) that returns a whole table:

      ```sql
      SELECT g.name AS genre, top.title, top.copies
      FROM genres g
      CROSS JOIN LATERAL (
          SELECT b.title, sum(oi.quantity) AS copies
          FROM books b
          JOIN order_items oi USING (book_id)
          WHERE b.genre_id = g.genre_id        -- uses g, from the left
          GROUP BY b.book_id, b.title
          ORDER BY copies DESC, b.title
          LIMIT 2
      ) AS top;
      ```

      For each genre, the inner query finds its 2 best-selling books. This is the go-to pattern for **"top N per group"** when N is more than 1.

      - `CROSS JOIN LATERAL`: rows on the left with **no** result on the right disappear (like an inner join).
      - `LEFT JOIN LATERAL (…) ON true`: keeps them, with NULLs (like a left join).

  - kind: try
    title: Top two per genre
    body: |
      Run it. The tiebreaker `b.title` makes sure the answer is the same every time, even if two books sold the same number of copies.

      Poetry is missing: it has no books, so the lateral query returns nothing for it. Change `CROSS JOIN LATERAL` to `LEFT JOIN LATERAL` and add `ON true` after `AS top` to bring it back. Then try `LIMIT 1`.
    sql: |
      SELECT g.name AS genre, top.title, top.copies
      FROM genres g
      CROSS JOIN LATERAL (
          SELECT b.title, sum(oi.quantity) AS copies
          FROM books b
          JOIN order_items oi USING (book_id)
          WHERE b.genre_id = g.genre_id
          GROUP BY b.book_id, b.title
          ORDER BY copies DESC, b.title
          LIMIT 2
      ) AS top
      ORDER BY g.name, top.copies DESC;

  - kind: try
    title: Your turn with LATERAL
    body: |
      For **every genre**, show its `name` and the price of its **single most expensive book**, labeled **top_price**. Keep genres that have **no books**, with NULL.

      Hint: `LEFT JOIN LATERAL ( … ORDER BY price DESC LIMIT 1 ) AS b ON true`.
    sql: |
      SELECT g.name
      FROM genres g;
    expect: |
      SELECT g.name, b.price AS top_price
      FROM genres g
      LEFT JOIN LATERAL (
          SELECT price
          FROM books bk
          WHERE bk.genre_id = g.genre_id
          ORDER BY price DESC
          LIMIT 1
      ) AS b ON true;

  - kind: explain
    title: A function per row
    body: |
      Some functions return **many rows** (they're called *set-returning functions*). `generate_series(start, stop, step)` is the famous one: it makes a row for every step.

      With LATERAL, you can call it **once per row**, using that row's values:

      ```sql
      SELECT e.full_name, anniversary::date
      FROM employees e
      CROSS JOIN LATERAL generate_series(e.hired_on, date '2026-06-30', interval '1 year') AS anniversary
      WHERE e.employee_id = 6;
      ```

      One row per **work anniversary** of each employee, up to the end of June 2026, great for calendars and "who was working here on date X?". (For a function in FROM, the word `LATERAL` is actually optional, because PostgreSQL assumes it. Many people write it anyway for clarity.)

  - kind: try
    title: Every anniversary
    body: |
      Run it: Kenji Mori (employee 6) was hired in January 2024, so there are 3 rows: the hiring day and two anniversaries. Remove the WHERE to see everyone. Who has the most rows, and why?
    sql: |
      SELECT e.full_name, anniversary::date AS anniversary
      FROM employees e
      CROSS JOIN LATERAL generate_series(e.hired_on, date '2026-06-30', interval '1 year') AS anniversary
      WHERE e.employee_id = 6;

  - kind: explain
    title: Which tool when?
    body: |
      | Question | Reach for |
      |---|---|
      | Exactly **one row per group** ("latest per order") | **DISTINCT ON**: shortest and clearest |
      | **N rows per group**, or a per-row query with its own filters | **LATERAL** + ORDER BY + LIMIT |
      | Running a **set-returning function** per row | **LATERAL** |
      | Rankings with **ties**, numbering, comparing to the row before, or keeping **every** row with a rank next to it | **Window functions**, the next module |

      All three can often answer the same question. Pick the one that reads most naturally, then check speed with EXPLAIN (Module 33) if it matters.

  - kind: why
    body: |
      "Latest status per order", "most recent login per user", "top 3 products per category": these per-group questions fill dashboards and reports. DISTINCT ON and LATERAL answer them in a few clear lines, where GROUP BY alone can't.

  - kind: recap
    body: |
      - `SELECT DISTINCT ON (g) … ORDER BY g, tiebreak`: the first row per group. ORDER BY must start with the DISTINCT ON columns.
      - `LATERAL` subqueries can use columns from tables to their left, so they run once per row.
      - Top N per group: `CROSS JOIN LATERAL (… ORDER BY … LIMIT n)`. `LEFT JOIN LATERAL … ON true` keeps rows with no match.
      - Set-returning functions like `generate_series` can run per row.
      - One per group → DISTINCT ON. N per group → LATERAL. Rankings and ties → window functions.
