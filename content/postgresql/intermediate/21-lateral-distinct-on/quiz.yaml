pass: 3
questions:
  - type: mcq
    prompt: "In `SELECT DISTINCT ON (order_id) … ORDER BY order_id, paid_at DESC`, what decides which row is kept for each order?"
    options:
      - The row that was inserted first for each order
      - "The ORDER BY after order_id: here, the newest paid_at"
      - Whichever row PostgreSQL reads first from the disk
      - The row with the largest amount, since DISTINCT ON keeps the max
    answer: 1
    explanation: DISTINCT ON keeps the first row of each group in ORDER BY order. The columns after the DISTINCT ON columns decide which row that is.

  - type: predict
    prompt: What does this return?
    code: |
      SELECT DISTINCT ON (job_title) job_title, full_name
      FROM employees
      WHERE job_title = 'Sales Associate'
      ORDER BY job_title, hired_on;
    options:
      - "Sales Associate | Tom Becker"
      - "Sales Associate | Sara Lindqvist"
      - "Sales Associate | Kenji Mori"
      - "Sales Associate | Tom Becker

        Sales Associate | Sara Lindqvist

        Sales Associate | Kenji Mori"
    answer: 0
    explanation: "It keeps the earliest-hired sales associate. Tom Becker was hired in 2022, before Sara (2023) and Kenji (2024)."

  - type: mcq
    prompt: What does LATERAL allow a subquery in FROM to do?
    options:
      - Return more than one column from the subquery
      - Use columns from tables to its left, so it runs per row
      - Skip the alias that a subquery in FROM normally needs
      - Update the rows it reads, as well as returning them
    answer: 1
    explanation: A LATERAL subquery can refer to earlier FROM items, like a correlated subquery that returns a whole table.

  - type: fill
    prompt: Keep genres even when the lateral subquery finds nothing for them.
    code: |
      SELECT g.name, b.title
      FROM genres g
      LEFT JOIN LATERAL (SELECT title FROM books bk WHERE bk.genre_id = g.genre_id LIMIT 1) b ON ____;
    answer: "true"
    accept: ["TRUE"]
    explanation: "`LEFT JOIN LATERAL … ON true` keeps every left row. The matching already happens inside the subquery."

  - type: mcq
    prompt: You need the **3 most recent** reviews for each book. What's the most natural tool?
    options:
      - DISTINCT ON
      - LATERAL with ORDER BY and LIMIT 3
      - UNION ALL
      - GROUP BY with max()
    answer: 1
    explanation: DISTINCT ON gives only one row per group. LATERAL + ORDER BY + LIMIT n gives the top N.
