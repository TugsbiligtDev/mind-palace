steps:
  - kind: explain
    title: Aggregates that keep every row
    body: |
      `GROUP BY` collapses rows: 8 employees in, one average out. Often you want the average **next to each row**, to compare: *"who earns more than average, and by how much?"*

      A **window function** does exactly that. Add **`OVER (…)`** after an aggregate:

      ```sql
      SELECT full_name, salary,
             avg(salary) OVER () AS company_avg
      FROM employees;
      ```

      Every row stays, and each gets the value computed over its **window**: the set of rows it can "see". Empty parentheses `OVER ()` mean *all rows of the result*.

  - kind: try
    title: Salary next to the average
    body: |
      Run it. Then add a column `salary - avg(salary) OVER () AS vs_avg`.
    sql: |
      SELECT full_name, salary,
             round(avg(salary) OVER (), 2) AS company_avg
      FROM employees;

  - kind: explain
    title: PARTITION BY
    body: |
      **`PARTITION BY`** splits the rows into groups, and each row's window is **only its own group**:

      ```sql
      SELECT title, genre_id, price,
             round(avg(price) OVER (PARTITION BY genre_id), 2) AS genre_avg
      FROM books;
      ```

      It's like GROUP BY, except the rows **don't collapse**: all 300 books stay, each next to its own genre's average price. It's the same kind of answer as the correlated subquery in Module 18, usually faster and always shorter.

  - kind: try
    title: Your turn with PARTITION BY
    body: |
      Show each book's `title`, `genre_id`, `price`, and **how many books are in its genre**, labeled **genre_size**.
    sql: |
      SELECT title, genre_id, price
      FROM books;
    expect: |
      SELECT title, genre_id, price,
             count(*) OVER (PARTITION BY genre_id) AS genre_size
      FROM books;

  - kind: explain
    title: Ranking with ORDER BY
    body: |
      Put **ORDER BY** inside OVER and you can **number** the rows. Three ranking functions differ only in how they treat **ties** (in Self-Help, *The Bright Library, Book 2* and *The Bright Promise, Book 2* both cost 29.99):

      | Function | Ties get… | Sequence |
      |---|---|---|
      | `row_number()` | different numbers (ties broken arbitrarily) | **1, 2**, 3, 4 |
      | `rank()` | the same number, then a **gap** | **1, 1**, 3, 4 |
      | `dense_rank()` | the same number, **no gap** | **1, 1**, 2, 3 |

      Olympic medals use `rank()`: two golds, then bronze, no silver.

      This ORDER BY only orders the ranking. It doesn't sort the output. Add an ordinary ORDER BY at the end for that.

  - kind: try
    title: Three ways to rank
    body: |
      The Self-Help books (genre 7), most expensive first. Run it and compare the first three rows in each column. Further down, four books tie at 23.99: watch the gaps `rank` leaves after them.
    sql: |
      SELECT title, price,
             row_number() OVER (ORDER BY price DESC) AS row_num,
             rank()       OVER (ORDER BY price DESC) AS rnk,
             dense_rank() OVER (ORDER BY price DESC) AS dense
      FROM books
      WHERE genre_id = 7
      ORDER BY price DESC, title;

  - kind: try
    title: Your turn to rank within groups
    body: |
      Rank books **within their genre**, most expensive first, **without gaps** for ties. Return `title`, `genre_id`, `price` and the rank labeled **genre_rank**.
    sql: |
      SELECT title, genre_id, price
      FROM books;
    expect: |
      SELECT title, genre_id, price,
             dense_rank() OVER (PARTITION BY genre_id ORDER BY price DESC) AS genre_rank
      FROM books;

  - kind: explain
    title: Top N per group
    body: |
      You can't filter on a window function in WHERE: window functions run **after** WHERE (they're computed with SELECT). So rank in a CTE, then filter:

      ```sql
      WITH ranked AS (
          SELECT title, genre_id, price,
                 row_number() OVER (PARTITION BY genre_id
                                    ORDER BY price DESC, title) AS rn
          FROM books
      )
      SELECT * FROM ranked WHERE rn <= 2;
      ```

      Choose the function by what "top 2" should mean with ties: `row_number` gives exactly 2 per group, `rank`/`dense_rank` include everyone tied. With `row_number`, add a tiebreaker (here `title`) so the same books win every time.

  - kind: try
    title: Your turn for the priciest book
    body: |
      Return the **single most expensive book in each genre**: `genre_id`, `title` and `price`. Use `row_number()` in a CTE. If two books in a genre cost the same, pick the one whose title comes first alphabetically.
    sql: |
      SELECT genre_id, title, price
      FROM books;
    expect: |
      WITH ranked AS (
          SELECT genre_id, title, price,
                 row_number() OVER (PARTITION BY genre_id ORDER BY price DESC, title) AS rn
          FROM books
      )
      SELECT genre_id, title, price
      FROM ranked
      WHERE rn = 1;

  - kind: explain
    title: LAG and LEAD
    body: |
      **`lag(col)`** gives the value from the **previous** row in the window's order, and **`lead(col)`** from the **next** row:

      ```sql
      SELECT order_id, ordered_at,
             ordered_at - lag(ordered_at) OVER (ORDER BY ordered_at) AS since_previous
      FROM orders
      WHERE customer_id = 40;
      ```

      The first row has no previous row, so lag gives NULL. `lag(col, 2)` looks two rows back, and `lag(col, 1, 0)` uses 0 instead of NULL.

      Perfect for "change since last time": growth month over month, time between visits, price changes.

  - kind: try
    title: Time between orders
    body: |
      Diego Patel (customer 40) has 23 orders. Run it: the gap between the second and third order is over 9 months. Then change `lag` to `lead` and see the column shift.
    sql: |
      SELECT order_id, ordered_at,
             ordered_at - lag(ordered_at) OVER (ORDER BY ordered_at) AS since_previous
      FROM orders
      WHERE customer_id = 40
      ORDER BY ordered_at;

  - kind: explain
    title: Running totals
    body: |
      An aggregate with ORDER BY in its window becomes **cumulative**: each row sums everything from the start up to itself.

      ```sql
      SELECT p.paid_at, p.amount,
             sum(p.amount) OVER (ORDER BY p.paid_at) AS running_total
      FROM payments p
      JOIN orders o USING (order_id)
      WHERE o.customer_id = 40;
      ```

      Add PARTITION BY to restart the total for each group: `sum(amount) OVER (PARTITION BY order_id ORDER BY paid_at)`.

  - kind: try
    title: Diego's spending, over time
    body: |
      Run it and watch the running total. Where does it go **down**, and why?
    sql: |
      SELECT p.paid_at, p.amount,
             sum(p.amount) OVER (ORDER BY p.paid_at) AS running_total
      FROM payments p
      JOIN orders o USING (order_id)
      WHERE o.customer_id = 40
      ORDER BY p.paid_at;

  - kind: try
    title: Your turn for a running total per order
    body: |
      For orders 170 to 180, show `order_id`, `paid_at`, `amount`, and a running total **per order** labeled **running_paid**, restarting for each order.
    sql: |
      SELECT order_id, paid_at, amount
      FROM payments
      WHERE order_id BETWEEN 170 AND 180;
    expect: |
      SELECT order_id, paid_at, amount,
             sum(amount) OVER (PARTITION BY order_id ORDER BY paid_at) AS running_paid
      FROM payments
      WHERE order_id BETWEEN 170 AND 180;

  - kind: explain
    title: "Frames: ROWS BETWEEN"
    body: |
      The **frame** says exactly which rows around the current one count. A **moving average** of the last 3 payments:

      ```sql
      avg(amount) OVER (ORDER BY paid_at
                        ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)
      ```

      Useful pieces: `UNBOUNDED PRECEDING` (from the start), `n PRECEDING`, `CURRENT ROW`, `n FOLLOWING`, `UNBOUNDED FOLLOWING`.

      The default frame with ORDER BY is "from the start up to the current row, **including rows tied with it**" (that's `RANGE`). With exact ties in the ORDER BY column, a running total jumps by both at once. Writing `ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW` counts strictly row by row.

  - kind: try
    title: A moving average
    body: |
      Each of Diego's payments is averaged with the two before it. Run it, then change `2 PRECEDING` to `1 PRECEDING`.
    sql: |
      SELECT p.paid_at, p.amount,
             round(avg(p.amount) OVER (ORDER BY p.paid_at
                                       ROWS BETWEEN 2 PRECEDING AND CURRENT ROW), 2) AS moving_avg_3
      FROM payments p
      JOIN orders o USING (order_id)
      WHERE o.customer_id = 40
      ORDER BY p.paid_at;

  - kind: explain
    title: FILTER on aggregates
    body: |
      **`FILTER (WHERE …)`** makes an aggregate count only some rows. It's cleaner than a CASE inside the aggregate:

      ```sql
      SELECT method,
             sum(amount) FILTER (WHERE kind = 'payment') AS paid_in,
             sum(amount) FILTER (WHERE kind = 'refund')  AS paid_back
      FROM payments
      GROUP BY method;
      ```

      It works with ordinary GROUP BY aggregates **and** with window aggregates. You'll use it again for pivot-style reports in Module 23.

  - kind: try
    title: Your turn with FILTER
    body: |
      For each payment `method`, count all its rows labeled **payments**, and count only its **refunds** (negative amounts) labeled **refunds**.
    sql: |
      SELECT method, count(*) AS payments
      FROM payments
      GROUP BY method;
    expect: |
      SELECT method,
             count(*) AS payments,
             count(*) FILTER (WHERE amount < 0) AS refunds
      FROM payments
      GROUP BY method;

  - kind: info
    title: "🔹 NTILE"
    body: |
      `ntile(n) OVER (ORDER BY …)` splits the rows into **n roughly equal buckets** and numbers them 1 to n. `ntile(4)` gives quartiles: top 25%, next 25%, and so on. Handy for "which price band is each book in?"

  - kind: try
    title: "Find the bug: gaps between whose orders?"
    body: |
      *"For customers 40 and 41, the time since **that customer's** previous order."* Return `customer_id`, `ordered_at` and the gap labeled **gap**. This query mixes the two customers: one customer's first order gets a gap measured from the other customer's order. Fix it.
    sql: |
      SELECT customer_id, ordered_at,
             ordered_at - lag(ordered_at) OVER (ORDER BY ordered_at) AS gap
      FROM orders
      WHERE customer_id IN (40, 41);
    expect: |
      SELECT customer_id, ordered_at,
             ordered_at - lag(ordered_at) OVER (PARTITION BY customer_id ORDER BY ordered_at) AS gap
      FROM orders
      WHERE customer_id IN (40, 41);
    hint: |
      The window should restart for each customer. Which clause inside OVER does that?

  - kind: why
    body: |
      Rankings, running totals, month-over-month change, top N per group: window functions answer the questions analysts get asked every day, in one query, without losing the detail rows. They're the single biggest jump in SQL power after joins.

  - kind: recap
    body: |
      - `agg(...) OVER (…)` computes across a window and **keeps every row**.
      - `PARTITION BY` = groups without collapsing. `ORDER BY` inside OVER = order within the window.
      - `row_number` (unique), `rank` (ties + gaps), `dense_rank` (ties, no gaps).
      - Window functions run after WHERE: rank in a CTE, then filter for top N.
      - `lag` / `lead` read the previous / next row.
      - `sum(x) OVER (ORDER BY t)` is a running total. `ROWS BETWEEN n PRECEDING AND CURRENT ROW` gives moving windows.
      - `agg(x) FILTER (WHERE …)` aggregates only matching rows.
      - 🔹 `ntile(n)` splits rows into n buckets.
