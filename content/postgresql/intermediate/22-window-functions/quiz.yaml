pass: 3
questions:
  - type: mcq
    prompt: Salaries are 5000, 4000, 4000 and 3000. What does `dense_rank() OVER (ORDER BY salary DESC)` give them?
    options:
      - 1, 2, 3, 4
      - 1, 2, 2, 4
      - 1, 2, 2, 3
      - 1, 1, 2, 3
    answer: 2
    explanation: dense_rank gives ties the same rank and doesn't leave a gap afterwards. `rank()` would give 1, 2, 2, 4.

  - type: predict
    prompt: What does this return?
    code: |
      SELECT sum(amount) OVER (ORDER BY paid_at) AS running
      FROM payments
      WHERE order_id = 174
      ORDER BY paid_at;
    options:
      - "52.97\n-52.97"
      - "52.97\n0.00"
      - "0.00\n0.00"
      - "52.97\n105.94"
    answer: 1
    explanation: "Order 174 has a payment of 52.97 and then a refund of −52.97. The running total goes 52.97, then back down to 0.00."

  - type: mcq
    prompt: "Why does `SELECT … WHERE row_number() OVER (ORDER BY salary) <= 3` fail?"
    options:
      - row_number needs PARTITION BY when it is used in a WHERE clause
      - Window functions run after WHERE; rank in a CTE, then filter
      - WHERE can't compare a function's result with a number like 3
      - You must use rank() instead, because row_number() can't be filtered
    answer: 1
    explanation: WHERE runs before window functions exist. Compute the ranking in a CTE or subquery, then filter on it outside.

  - type: fill
    prompt: Show each payment's amount next to the **previous** payment's amount.
    code: |
      SELECT paid_at, amount, ____(amount) OVER (ORDER BY paid_at) AS previous
      FROM payments;
    answer: lag
    accept: ["LAG"]
    explanation: "`lag(col)` reads the value from the previous row in the window's order. `lead` reads the next one."

  - type: predict
    prompt: What does this return?
    code: |
      SELECT count(*) FILTER (WHERE method = 'card') AS card_rows,
             count(*) AS all_rows
      FROM payments;
    options:
      - "37611 | 37611"
      - "16106 | 37611"
      - "16106 | 16106"
      - "4 | 37611"
    answer: 1
    explanation: FILTER applies only to the aggregate it's attached to. `card_rows` counts the 16,106 card rows (payments and refunds), while the plain `count(*)` still counts all 37,611.
