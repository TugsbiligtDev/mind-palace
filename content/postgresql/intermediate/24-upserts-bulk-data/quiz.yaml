pass: 3
questions:
  - type: mcq
    prompt: "What must be true of the column in `ON CONFLICT (email)`?"
    options:
      - It must be text
      - It must have a UNIQUE constraint or be the primary key
      - It must be NOT NULL
      - It must be the first column
    answer: 1
    explanation: A conflict means "this value already exists". PostgreSQL can only detect that through a unique index, from a UNIQUE or PRIMARY KEY constraint.

  - type: predict
    prompt: What does the last statement return?
    code: |
      CREATE TABLE stock (item text PRIMARY KEY, qty integer);
      INSERT INTO stock VALUES ('map', 5);
      INSERT INTO stock VALUES ('map', 2)
      ON CONFLICT (item) DO UPDATE SET qty = stock.qty + EXCLUDED.qty;
      SELECT qty FROM stock;
    options:
      - "2"
      - "5"
      - "7"
      - "5\n2"
    answer: 2
    explanation: "`stock.qty` is the existing 5, and `EXCLUDED.qty` is the 2 you tried to insert. 5 + 2 = 7."

  - type: fill
    prompt: In an upsert, refer to the value you **tried** to insert.
    code: |
      INSERT INTO countries (name, continent) VALUES ('Peru', 'Americas')
      ON CONFLICT (name) DO UPDATE SET continent = ____.continent;
    answer: EXCLUDED
    accept: ["excluded"]
    explanation: "`EXCLUDED` holds the row that was proposed for insertion."

  - type: mcq
    prompt: Your database is in the cloud and the CSV is on your laptop. Which do you use?
    options:
      - "`COPY … FROM 'file.csv'`"
      - "`\\copy … FROM 'file.csv'` in psql"
      - "`INSERT … FROM 'file.csv'`"
      - "`MERGE … USING 'file.csv'`"
    answer: 1
    explanation: "`COPY … FROM 'file'` reads from the server's own disk. `\\copy` reads the file on your computer and streams it to the server."

  - type: mcq
    prompt: A CSV import keeps failing on a few bad rows. What's the robust approach?
    options:
      - Delete the bad rows from the file by hand every time
      - Load everything into an all-text staging table, then clean and convert with INSERT … SELECT
      - Change every column in the real table to text
      - Use UNION ALL
    answer: 1
    explanation: Text columns accept anything, so the load can't fail. Then you find and fix bad values with queries, and convert into properly typed columns.
