steps:
  - kind: explain
    title: Written once, read many times
    body: |
      A query that works isn't finished. Someone (probably you, in three months) will need to read it, trust it and change it. The hardest SQL bugs aren't errors: they're queries that **run fine and return the wrong number**.

      This module is about two habits: **writing SQL that's easy to read**, and **checking that the answer is actually right**.

      **Example of a quiet wrong answer.** *"How many orders has Diego (customer 40) placed?"*

      ```sql
      SELECT count(*) AS wrong
      FROM orders o
      JOIN order_items oi ON oi.order_id = o.order_id
      WHERE o.customer_id = 40;
      ```

      | wrong |
      |---|
      | 36 |

      No error, a plausible number, and wrong: the join made one row per order **line** (the fan-out from Module 14). Diego has 23 orders:

      ```sql
      SELECT count(*) AS orders FROM orders WHERE customer_id = 40;
      ```

      | orders |
      |---|
      | 23 |

  - kind: try
    title: "Try it: right or just running?"
    body: |
      Both queries. Run them: 36 vs. 23. Then change the first to `count(DISTINCT o.order_id)` and it agrees with the second.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT count(*) AS wrong
      FROM orders o
      JOIN order_items oi ON oi.order_id = o.order_id
      WHERE o.customer_id = 40;

      SELECT count(*) AS orders FROM orders WHERE customer_id = 40;

  - kind: explain
    title: Formatting conventions
    body: |
      Compare:

      ```sql
      select b.title,
             g.name,
             sum(oi.quantity) from books b join genres g on g.genre_id=b.genre_id join order_items oi on oi.book_id=b.book_id group by b.title,
             g.name order by 3 desc
      ```

      ```sql
      SELECT b.title,
             g.name AS genre,
             sum(oi.quantity) AS copies_sold
      FROM books b
      JOIN genres g       ON g.genre_id = b.genre_id
      JOIN order_items oi ON oi.book_id = b.book_id
      GROUP BY b.title, g.name
      ORDER BY copies_sold DESC;
      ```

      The conventions most teams use:

      - **Keywords in UPPERCASE**, names in lowercase.
      - **Each clause on its own line** (SELECT, FROM, JOIN, WHERE, GROUP BY…).
      - **One column per line** when there are more than two or three.
      - **Label every calculated column** with AS.
      - Spaces around `=` and after commas.

      Both give exactly the same result. The first three rows (with `LIMIT 3` added):

      | title | genre | copies_sold |
      |---|---|---|
      | Pride and Prejudice | Classic | 1391 |
      | Emma | Classic | 855 |
      | 1984 | Science Fiction | 764 |

      Only the second one tells you what each column is.

      <!-- page -->

      **The comma debate:** some teams put commas at the **start** of lines (`, g.name`) so you can comment out any column except the first without breaking the query. Others find trailing commas more natural. Either is fine. **Consistency within a project matters more than which you pick.**

  - kind: try
    title: "Try it: one query, two layouts"
    body: |
      Both queries are the same, written two ways. Run it and compare the two results: identical, except the first one's last column is just called `sum` instead of `copies_sold`.

      Then try commenting out the `g.name AS genre,` line in the tidy version with `--` at its start (and remove `g.name` from its GROUP BY too). Nothing is graded here.
    sql: |
      select b.title,
             g.name,
             sum(oi.quantity) from books b join genres g on g.genre_id=b.genre_id join order_items oi on oi.book_id=b.book_id group by b.title,
             g.name order by 3 desc limit 3;

      SELECT b.title,
             g.name AS genre,
             sum(oi.quantity) AS copies_sold
      FROM books b
      JOIN genres g       ON g.genre_id = b.genre_id
      JOIN order_items oi ON oi.book_id = b.book_id
      GROUP BY b.title, g.name
      ORDER BY copies_sold DESC
      LIMIT 3;

  - kind: try
    title: Your turn to tidy up
    body: |
      This query works but is hard to read. Reformat it using the conventions above, give the count a label, **books**, and sort the genres **most books first**, then by name. The result is checked, so keep the rest of the logic the same.
    sql: |
      select g.name,
             count(b.book_id) from genres g join books b on b.genre_id=g.genre_id group by g.name
    expect: |
      SELECT g.name,
             count(b.book_id) AS books
      FROM genres g
      JOIN books b ON b.genre_id = g.genre_id
      GROUP BY g.name
      ORDER BY books DESC, g.name;
    ordered: true

  - kind: explain
    title: Aliases that mean something
    body: |
      `FROM orders a JOIN customers b JOIN order_items c` forces every reader to keep a decoder ring in their head. By the fifth join, nobody knows what `c.quantity` is.

      Use **short but meaningful** aliases: the table's initials or a clear abbreviation.

      | Table | Weak | Better |
      |---|---|---|
      | orders | `a` | `o` |
      | customers | `b` | `c` |
      | order_items | `c` | `oi` |
      | employees (as manager) | `e2` | `mgr` |

      The same goes for CTE names: `per_city`, `monthly_totals`, `latest_payment` say what they hold. `x`, `temp` and `cte1` don't.

      **Example.** The same query twice. Both run and give the same answer, but only one can be read at a glance:

      ```sql
      -- Hard to read
      SELECT b.first_name, count(*) AS orders
      FROM orders a
      JOIN customers b ON b.customer_id = a.customer_id
      WHERE b.customer_id IN (40, 41, 42)
      GROUP BY b.customer_id, b.first_name;

      -- Easy to read
      SELECT c.first_name, count(*) AS orders
      FROM orders o
      JOIN customers c ON c.customer_id = o.customer_id
      WHERE c.customer_id IN (40, 41, 42)
      GROUP BY c.customer_id, c.first_name;
      ```

  - kind: try
    title: "Try it: rename the aliases"
    body: |
      The hard-to-read version. Run it, then rename `a` to `o` and `b` to `c` everywhere (5 places for `b`, 1 for `a`). Run again: same answer, easier to read.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT b.first_name, count(*) AS orders
      FROM orders a
      JOIN customers b ON b.customer_id = a.customer_id
      WHERE b.customer_id IN (40, 41, 42)
      GROUP BY b.customer_id, b.first_name
      ORDER BY b.customer_id;

  - kind: explain
    title: Break the problem into steps
    body: |
      Hard question: *"Customers in which city have paid Inkwell the most, and what share of all money received is that?"*

      Don't write it in one go. Write the **steps in plain English** first, then make each one a CTE (Module 19):

      1. **per_city**: total paid per city (payments → orders → customers).
      2. **grand_total**: the total of all payments.
      3. **Final**: each city's total, its share as a percentage, biggest first.

      Run each step on its own before adding the next. When something looks wrong, you'll know exactly which step to look at.

      <!-- page -->

      **Worked example, on a different question:** *"Which genres sell the most copies, and what share of all copies is that?"*

      1. **per_genre**: copies sold per genre (order_items → books → genres).
      2. **all_copies**: the total of all copies sold.
      3. **Final**: each genre, its copies, its share, biggest first.

      ```sql
      WITH per_genre AS (
          SELECT g.name AS genre, sum(oi.quantity) AS copies
          FROM order_items oi
          JOIN books b  ON b.book_id = oi.book_id
          JOIN genres g ON g.genre_id = b.genre_id
          GROUP BY g.name
      ),
      all_copies AS (
          SELECT sum(quantity) AS total FROM order_items
      )
      SELECT genre, copies,
             round(100.0 * copies / total, 1) AS pct
      FROM per_genre, all_copies
      ORDER BY copies DESC
      LIMIT 3;
      ```

      | genre | copies | pct |
      |---|---|---|
      | Classic | 13109 | 16.3 |
      | Science Fiction | 12790 | 15.9 |
      | Fantasy | 11708 | 14.6 |

      Each CTE is one plain-English step, and each can be run on its own (`SELECT * FROM per_genre`) while you build it. `all_copies` has a single row, so joining it with a comma just puts the total next to every genre.

  - kind: try
    title: Your turn, step by step
    body: |
      Step 1 is done. Add the remaining steps so the final result shows `city`, **paid**, and **pct**: the share of all payments, as a percentage rounded to 1 decimal. Sort biggest first. (A few customers have no city on file. They show up as one NULL row, which is honest.)

      Hint: `round(100 * paid / grand_total, 1)`. The grand total can be a scalar subquery `(SELECT sum(amount) FROM payments)` or its own CTE.
    sql: |
      WITH per_city AS (
          SELECT c.city, sum(p.amount) AS paid
          FROM payments p
          JOIN orders o    ON o.order_id = p.order_id
          JOIN customers c ON c.customer_id = o.customer_id
          GROUP BY c.city
      )
      SELECT * FROM per_city;
    expect: |
      WITH per_city AS (
          SELECT c.city, sum(p.amount) AS paid
          FROM payments p
          JOIN orders o    ON o.order_id = p.order_id
          JOIN customers c ON c.customer_id = o.customer_id
          GROUP BY c.city
      )
      SELECT city,
             paid,
             round(100 * paid / (SELECT sum(amount) FROM payments), 1) AS pct
      FROM per_city
      ORDER BY paid DESC;
    ordered: true

  - kind: explain
    title: Check your answer
    body: |
      A result that *looks* plausible isn't proof. Quick checks that catch most mistakes:

      - **Count rows before and after each join.** If `customers` has 5,020 rows and your joined result has 39,419, rows were multiplied (fan-out). If fewer customers appear than you started with, rows were dropped.
      - **Test the edge cases.** Does it handle NULLs? A group with no rows? Duplicates? A customer with no orders? A refund (negative amount)?
      - **Compare with a simpler query.** If per-city totals are right, they should add up to `SELECT sum(amount) FROM payments`. Percentages should add up to about 100.
      - **Spot-check one row by hand.** Pick one customer and add up their payments yourself.

  - kind: try
    title: Count before and after
    body: |
      Run it: 5,020 customers, but 39,419 rows after joining orders, and only 5,007 different customers. The join both **multiplied** rows (customers with several orders) and **dropped** 13 (customers who never ordered).
    sql: |
      SELECT (SELECT count(*) FROM customers) AS customers,
             (SELECT count(*)
              FROM customers c JOIN orders o ON o.customer_id = c.customer_id) AS joined_rows,
             (SELECT count(DISTINCT c.customer_id)
              FROM customers c JOIN orders o ON o.customer_id = c.customer_id) AS customers_after_join;

  - kind: explain
    title: Logic mistakes that don't raise errors
    body: |
      The usual suspects:

      - **An inner join silently drops rows.** Customers without orders, genres without books: gone. Use LEFT JOIN when "none" is a valid answer.
      - **A WHERE on the right side of a LEFT JOIN turns it back into an inner join.** `LEFT JOIN books b … WHERE b.price > 29` removes every unmatched row, because their `b.price` is NULL. Put conditions about the right-hand table in the **ON** clause instead. (Example on the next page.)
      - **Averages over the wrong grain** (the *grain* is what one row stands for). `avg(quantity * unit_price)` from order_items is the average **order line**, not the average **order**. Decide what one row represents first (Module 18).
      - **Fan-out inflates sums and counts** (Module 14).
      - **`count(*)` vs. `count(col)`** after a LEFT JOIN (Module 14).

      <!-- page -->

      *"Every publisher, with its books under 7.50, if it has any."* With the condition in **WHERE**:

      ```sql
      SELECT p.name, b.title, b.price
      FROM publishers p
      LEFT JOIN books b ON b.publisher_id = p.publisher_id
      WHERE b.price < 7.50;
      ```

      Returns 10 rows, all cheap books like `| Bloomsbury | The Golden Crown | 6.99 |`. Blue Owl Press, with no books, is missing: its `b.price` is NULL, and WHERE threw it away.

      With the condition moved into **ON**:

      ```sql
      SELECT p.name, b.title, b.price
      FROM publishers p
      LEFT JOIN books b ON b.publisher_id = p.publisher_id
                       AND b.price < 7.50;
      ```

      Returns the same 10 rows, plus:

      | name | title | price |
      |---|---|---|
      | Blue Owl Press | NULL | NULL |

  - kind: try
    title: "Try it: WHERE vs. ON"
    body: |
      Both versions are here. Run it and compare the row counts: 10, then 11. Find Blue Owl Press at the bottom of the second result.

      Then change `7.50` to `6.99` in both (no book is that cheap): the WHERE version returns nothing at all, while the ON version still lists all 6 publishers, with NULLs. Nothing is graded here.
    sql: |
      SELECT p.name, b.title, b.price
      FROM publishers p
      LEFT JOIN books b ON b.publisher_id = p.publisher_id
      WHERE b.price < 7.50;

      SELECT p.name, b.title, b.price
      FROM publishers p
      LEFT JOIN books b ON b.publisher_id = p.publisher_id
                       AND b.price < 7.50;

  - kind: try
    title: Your turn to fix a LEFT JOIN
    body: |
      *"List every genre, with its books that cost more than 29, if it has any."* This returns only 7 genres, because the WHERE throws away the unmatched ones: Poetry (no books at all) and Romance (none that expensive). Move the price condition into the ON clause so all 9 genres appear.
    sql: |
      SELECT g.name, b.title, b.price
      FROM genres g
      LEFT JOIN books b ON b.genre_id = g.genre_id
      WHERE b.price > 29;
    expect: |
      SELECT g.name, b.title, b.price
      FROM genres g
      LEFT JOIN books b ON b.genre_id = g.genre_id
                       AND b.price > 29;

  - kind: try
    title: The wrong grain
    body: |
      Two "average order values", two different questions. Run it: the average **order line** is worth 20.13, and the average **order** 35.68. Both are correct. Only one answers "how much does a typical order bring in?"
    sql: |
      SELECT round(avg(quantity * unit_price), 2) AS avg_per_line,
             (SELECT round(avg(total), 2)
              FROM (SELECT order_id, sum(quantity * unit_price) AS total
                    FROM order_items GROUP BY order_id) AS per_order) AS avg_per_order
      FROM order_items;

  - kind: explain
    title: Comment the why
    body: |
      Comments (Module 3) should explain **why**, not **what**. The SQL already says what.

      ```sql
      -- Weak: filter status
      WHERE status <> 'cancelled'

      -- Useful: cancelled orders were never paid for, so they'd inflate sales
      WHERE status <> 'cancelled'
      ```

      Good places for a comment: a business rule ("refunds are negative amounts"), a surprising choice ("LEFT JOIN: customers without orders must still appear"), or a known limitation ("assumes one currency").

  - kind: choice
    title: "Quick check: a useful comment"
    body: |
      ```sql
      SELECT sum(amount) FROM payments
      WHERE kind IN ('payment', 'refund');   -- ???
      ```

      Which comment is most useful here?
    options:
      - "`-- sum the amount`"
      - "`-- refunds are negative, so including them gives the net amount received`"
      - "`-- filter on kind`"
      - "`-- payments table`"
    answer: 1
    explanation: "The SQL already says it sums amounts, filtered on kind, from payments. Only the comment about negative refunds explains **why** refunds are included, which a reader couldn't guess."

  - kind: info
    title: "🔹 Formatters and linters"
    body: |
      Tools can format and check SQL for you:

      - **pgFormatter**: reformats PostgreSQL queries consistently. There's a web version, and it's built into some editors.
      - **SQLFluff**: a *linter* that checks style rules (and some likely bugs) and can fix many automatically. Teams often run it on every change.

      Useful once you're writing SQL in a team, where everyone's queries live together in one project.

  - kind: try
    title: "Find the bug: the average order that isn't"
    body: |
      *"What's our average **order** value?"* (quantity × unit price summed per order, then averaged over orders, rounded to 2 decimals.) This query answers a different question. Fix it so it returns one number labeled **avg_order**.
    sql: |
      SELECT round(avg(quantity * unit_price), 2) AS avg_order
      FROM order_items;
    expect: |
      SELECT round(avg(total), 2) AS avg_order
      FROM (
          SELECT order_id, sum(quantity * unit_price) AS total
          FROM order_items
          GROUP BY order_id
      ) AS per_order;
    hint: |
      Each row of `order_items` is one line, not one order. Total each order first, then average those totals.

  - kind: why
    body: |
      Wrong numbers that look right are how bad decisions get made. The habits here (named steps, row-count checks, edge-case tests, comments that explain why) are what make people trust your queries. And readable SQL is what lets someone else fix them when you're not around.

  - kind: recap
    body: |
      - Format for humans: uppercase keywords, a clause per line, a column per line, label calculations. Be consistent.
      - Use meaningful aliases and CTE names.
      - Break hard questions into plain-English steps, one CTE each, and run each step as you go.
      - Check: row counts before and after joins, edge cases (NULLs, empty groups, duplicates), totals against a simpler query, one row by hand.
      - Watch for inner joins dropping rows, WHERE undoing a LEFT JOIN, the wrong grain, fan-out, and `count(*)`.
      - Comment the **why**. 🔹 pgFormatter and SQLFluff automate style.
