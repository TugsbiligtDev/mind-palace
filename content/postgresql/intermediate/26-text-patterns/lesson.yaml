steps:
  - kind: explain
    title: "LIKE recap, and its limits"
    body: |
      From Module 6: `LIKE` matches simple patterns, where `%` = any number of characters and `_` = exactly one. `ILIKE` ignores case.

      ```sql
      WHERE email LIKE '%@example.com'   -- ends with @example.com
      WHERE title ILIKE 'the%'           -- starts with the, The or THE
      ```

      Two things to know:

      - To match a real `%` or `_`, escape it with a backslash: `LIKE '100\%'`.
      - LIKE can't say *"a digit"*, *"one or more letters"*, or *"this or that"*. For those, you need regular expressions.

      **Examples.** Titles starting with *the* in any capitals (280 books; the first three):

      ```sql
      SELECT title FROM books WHERE title ILIKE 'the%' ORDER BY title;
      ```

      | title |
      |---|
      | The Bright Bridge |
      | The Bright Bridge, Book 2 |
      | The Bright Crown |

      And escaping: `\%` means a real percent sign, while a plain `%` means "anything":

      ```sql
      SELECT '100%' LIKE '100\%' AS real_percent,
             '1000' LIKE '100\%' AS other,
             '1000' LIKE '100%'  AS unescaped;
      ```

      | real_percent | other | unescaped |
      |---|---|---|
      | t | f | t |

  - kind: try
    title: "Try it: LIKE and ILIKE again"
    body: |
      Both examples. Run them, then change `'the%'` to `'%river%'` (titles containing *river*), or try `LIKE` instead of `ILIKE` with `'the%'`: no rows, because every title starts with a capital T.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT title
      FROM books
      WHERE title ILIKE 'the%'
      ORDER BY title;

      SELECT '100%' LIKE '100\%' AS real_percent,
             '1000' LIKE '100\%' AS other,
             '1000' LIKE '100%'  AS unescaped;

  - kind: explain
    title: Regular expressions
    body: |
      A **regular expression** (regex) is a small pattern language. PostgreSQL's operators:

      | Operator | Means |
      |---|---|
      | `~` | matches (case-sensitive) |
      | `~*` | matches, ignoring case |
      | `!~` / `!~*` | does **not** match |

      <!-- page -->

      Unlike LIKE, a regex matches **anywhere** in the text unless you anchor it. The building blocks you'll use most:

      | Piece | Matches | Example |
      |---|---|---|
      | `^` / `$` | start / end of the text | `^Dune$` = exactly Dune |
      | `.` | any one character | `D.ne` |
      | `\d` / `\D` | a digit / a non-digit | `\d\d\d\d` |
      | `\s` | a space, tab or newline | |
      | `[abc]`, `[a-z]` | one of these characters | `[A-Z]` = a capital |
      | `*` `+` `?` | 0 or more, 1 or more, 0 or 1 of the thing before | `\d+` |
      | `{n}` | exactly n times | `\d{4}` |
      | `a\|b` | a or b | `murder\|mystery` |
      | `\.` | a real dot (plain `.` means any character) | |

      <!-- page -->

      Some examples on book titles:

      ```sql
      SELECT title FROM books WHERE title ~ '^\d+$';
      ```

      Returns one book: `1984`. `^` and `$` pin the pattern to both ends, and `\d+` means "one or more digits", so the title must be **only** digits.

      ```sql
      SELECT title FROM books WHERE title ~ 'Book \d$' ORDER BY title LIMIT 3;
      ```

      Returns:

      | title |
      |---|
      | The Bright Bridge, Book 2 |
      | The Bright Island, Book 2 |
      | The Bright Library, Book 2 |

      No `^` this time, so "Book" and a digit can be anywhere, as long as the digit is the **last** character.

  - kind: try
    title: Match with a regex
    body: |
      Books whose description mentions *Poirot* or *dragons*, any capitalization. Run it. Then change `~*` to `~` and see which book disappears, and why.
    sql: |
      SELECT title, description
      FROM books
      WHERE description ~* 'poirot|dragons';

  - kind: try
    title: "Try it: anchors and digits"
    body: |
      Run it: the only book whose title is all digits. Then try these patterns in its place, one at a time:

      1. `'Book \d$'`: titles that end in "Book" and a digit.
      2. `'^The'` and then `'The$'`: see how the anchor changes everything.
      3. `'\d{4}'`: titles with four digits in a row.

      Nothing is graded here.
    sql: |
      SELECT title
      FROM books
      WHERE title ~ '^\d+$';

  - kind: try
    title: Your turn to validate a format
    body: |
      The phone numbers in `raw_customer_import` come in five formats. Return the `row_no` and `phone` of the rows written **exactly** as `3 digits, dash, 3 digits, dash, 4 digits` (like `336-555-4152`), with nothing else before or after.

      Hint: anchor both ends, `^…$`, and use `\d{3}` and `\d{4}`.
    sql: |
      SELECT row_no, phone
      FROM raw_customer_import;
    expect: |
      SELECT row_no, phone
      FROM raw_customer_import
      WHERE phone ~ '^\d{3}-\d{3}-\d{4}$';

  - kind: explain
    title: The regexp functions
    body: |
      | Function | Does | Example → result |
      |---|---|---|
      | `regexp_replace(t, pattern, new, 'g')` | replaces matches (`'g'` = every match, not just the first) | `regexp_replace('(976) 9911-2233', '\D', '', 'g')` → `97699112233` |
      | `regexp_substr(t, pattern)` | the first matching piece | `regexp_substr('Room 214, floor 2', '\d+')` → `214` |
      | `regexp_matches(t, pattern, 'g')` | every match, one row each, as an array of the parts in `( )` | `regexp_matches('A1 B22', '[A-Z](\d+)', 'g')` → `{1}`, `{22}` |
      | `regexp_split_to_table(t, pattern)` | splits text into rows | `regexp_split_to_table('a  b c', '\s+')` → `a`, `b`, `c` |

      `regexp_substr` is new in PostgreSQL 15. On older versions you'll see `substring(t from pattern)` for the same job.

  - kind: try
    title: "Try it: the regexp functions"
    body: |
      These are the examples from the table. Run them and check each result against the table.

      Then change `'Room 214, floor 2'` to some text of your own with numbers in it. And try removing `'g'` from the regexp_replace: only the **first** non-digit, `(`, is removed. Nothing is graded here.
    sql: |
      SELECT regexp_replace('(976) 9911-2233', '\D', '', 'g') AS digits,
             
             regexp_substr('Room 214, floor 2', '\d+')      AS first_number;

      SELECT regexp_matches('A1 B22', '[A-Z](\d+)', 'g');

      SELECT regexp_split_to_table('a  b c', '\s+');

  - kind: try
    title: Split reviews into words
    body: |
      One row per word of every review comment. Run it. Then wrap it: `SELECT lower(word), count(*) FROM (…) AS w GROUP BY 1 ORDER BY 2 DESC` to find the most common words. Why do `it` and `it!` count separately?
    sql: |
      SELECT review_id,
             regexp_split_to_table(comment, '\s+') AS word
      FROM reviews;

  - kind: try
    title: Your turn to extract digits
    body: |
      Using the same messy import, return each `row_no` and the phone with **every non-digit removed**, labeled **digits**. Five formats become one.
    sql: |
      SELECT row_no, phone
      FROM raw_customer_import;
    expect: |
      SELECT row_no, regexp_replace(phone, '\D', '', 'g') AS digits
      FROM raw_customer_import;

  - kind: explain
    title: Cleaning messy text
    body: |
      Text typed by humans arrives with stray spaces, random capitals and odd characters. A typical cleaning pipeline, innermost first:

      ```sql
      initcap(                              -- 3. Capitalize Each Word
        regexp_replace(
          trim(raw_name),                   -- 1. drop spaces at both ends
          '\s+', ' ', 'g'                   -- 2. squash runs of spaces into one
        )
      )
      ```

      On one messy name:

      ```sql
      SELECT initcap(regexp_replace(trim('   mARY   ann  shelley '), '\s+', ' ', 'g')) AS clean;
      ```

      Returns:

      | clean |
      |---|
      | Mary Ann Shelley |

      Other common steps: `lower(email)` before comparing emails, `regexp_replace(x, '[^A-Za-z0-9 ]', '', 'g')` to keep only letters, digits and spaces.

      Clean on the way **in** (in an import's staging step, Module 24) when you can, so the stored data is already tidy.

  - kind: try
    title: "Try it: a cleaning pipeline"
    body: |
      Run it to watch the name get cleaner one step at a time: `step1` only trims the ends, `step2` also squashes the inner spaces, `step3` capitalizes.

      Then put your own messy name in all three places, with extra spaces and odd capitals. Nothing is graded here.
    sql: |
      SELECT trim('   mARY   ann  shelley ') AS step1,
             regexp_replace(trim('   mARY   ann  shelley '), '\s+', ' ', 'g') AS step2,
             initcap(regexp_replace(trim('   mARY   ann  shelley '), '\s+', ' ', 'g')) AS step3;

  - kind: try
    title: Your turn to tidy names
    body: |
      Return each imported row's `row_no` and its `full_name` cleaned: no spaces at the ends, single spaces between words, and each word capitalized. Label it **clean_name**.
    sql: |
      SELECT row_no, full_name
      FROM raw_customer_import;
    expect: |
      SELECT row_no,
             initcap(regexp_replace(trim(full_name), '\s+', ' ', 'g')) AS clean_name
      FROM raw_customer_import;

  - kind: try
    title: Clean before you compare
    body: |
      About 1 imported row in 6 is someone who's already an Inkwell customer. Matching the emails exactly finds only 19 of them, because of capitals and stray spaces. Run it.

      Then change `c.email = r.email` to `c.email = lower(trim(r.email))` and run it again: 42 matches. Cleaning turned "new customer" into "we already know you", which is exactly what an upsert (Module 24) needs.
    sql: |
      SELECT count(*) AS already_customers
      FROM raw_customer_import r
      JOIN customers c ON c.email = r.email;

  - kind: explain
    title: "Performance warning: patterns are slow"
    body: |
      A normal index (Module 32) works like a phone book: great for "names starting with Sm…", useless for "names containing …ith". So:

      - `LIKE 'The Si%'` (fixed start) **can** use an index, with the right setup.
      - `LIKE '%River'`, `ILIKE '%river%'` and most regexes **can't**. PostgreSQL has to read and test **every row**.

      On 10 rows you won't notice. On 10 million, it's seconds per search. The fix is a *trigram* index from the `pg_trgm` extension, which ships with PostgreSQL: `CREATE EXTENSION pg_trgm;` then `CREATE INDEX ON books USING gin (title gin_trgm_ops);`.

      **Example.** `EXPLAIN` (Module 33) shows how PostgreSQL will run a search. A "contains" pattern reads the whole table:

      ```sql
      EXPLAIN SELECT title FROM books WHERE title LIKE '%River%';
      ```

      ```text
      Seq Scan on books  (cost=…)
        Filter: (title ~~ '%River%'::text)
      ```

      *Seq Scan* means every row is read and tested. (`~~` is PostgreSQL's internal name for LIKE.)

  - kind: try
    title: "Try it: see the full scan"
    body: |
      Run it and find *Seq Scan* in the plan. Then try `ILIKE '%river%'` (it shows as `~~*`) or a regex, `title ~ 'River$'`: all of them scan every row.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      EXPLAIN SELECT title FROM books WHERE title LIKE '%River%';

  - kind: info
    title: "🔹 SIMILAR TO"
    body: |
      `SIMILAR TO` is the SQL standard's halfway house between LIKE and regex: it uses `%` and `_` like LIKE, plus `|` and `( )` like regex, and must match the **whole** text:

      ```sql
      WHERE city SIMILAR TO '(London|Paris)'
      ```

      It's rarely used. Recognize it, and reach for `~` instead.

  - kind: try
    title: "Find the bug: the domain that came out as a name"
    body: |
      *"How many customers use each email **domain** (the part after `@`)?"* Return the domain labeled **domain** and the count labeled **customers**. This query groups by the part **before** the `@`. Fix it.
    sql: |
      SELECT split_part(email, '@', 1) AS domain,
             count(*) AS customers
      FROM customers
      GROUP BY 1;
    expect: |
      SELECT split_part(email, '@', 2) AS domain, count(*) AS customers
      FROM customers
      GROUP BY 1;
    hint: |
      `split_part(text, delimiter, n)` returns the n-th piece, counting from 1.

  - kind: why
    body: |
      Real text is never clean: phone numbers in five formats, names in random capitals, codes buried inside sentences. Regex and the cleaning functions turn that mess into data you can match, group and join on.

  - kind: recap
    body: |
      - LIKE / ILIKE for simple patterns (`%`, `_`). Escape a real `%` with `\%`.
      - Regex: `~` (match), `~*` (ignore case), `!~` (no match). It matches anywhere unless anchored with `^ … $`.
      - Pieces: `.` `\d` `\s` `[a-z]` `*` `+` `?` `{n}` `|` `\.`.
      - `regexp_replace(t, p, new, 'g')`, `regexp_substr`, `regexp_matches(…, 'g')`, `regexp_split_to_table`.
      - Clean with `trim`, `regexp_replace('\s+', ' ')`, `initcap` / `lower`, ideally on the way in.
      - Leading-wildcard LIKE and regex can't use normal indexes. A trigram index (the `pg_trgm` extension) fixes that.
      - 🔹 SIMILAR TO exists. Use `~`.
