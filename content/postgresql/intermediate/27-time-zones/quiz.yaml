questions:
  - type: mcq
    prompt: What changes when you run `SET TimeZone = 'Asia/Tokyo';`?
    options:
      - Every stored timestamptz value is shifted forward by 9 hours on disk
      - Only how timestamptz values are shown; the stored moments don't change
      - Every timestamptz column is converted to a plain timestamp in Tokyo time
      - Only new rows are stored in Tokyo time; the existing ones stay in UTC
    answer: 1
    explanation: A timestamptz is a fixed moment. The session zone only affects display and input interpretation.

  - type: predict
    prompt: What does this return?
    code: |
      SET TimeZone = 'UTC';
      SELECT ('2026-02-20 23:40:00+00'::timestamptz AT TIME ZONE 'Asia/Tokyo')::date AS tokyo_date;
    options:
      - "2026-02-20"
      - "2026-02-21"
      - "2026-02-19"
      - An error
    answer: 1
    explanation: Tokyo is UTC+9, so 23:40 UTC on the 20th is 08:40 on the 21st there.

  - type: predict
    prompt: What does this return?
    code: |
      CREATE TABLE p (paid_at timestamptz);
      INSERT INTO p VALUES ('2026-02-05 10:00+00'), ('2026-02-20 00:00+00'), ('2026-02-20 23:40+00');
      SELECT count(*) FROM p
      WHERE paid_at BETWEEN '2026-02-01' AND '2026-02-20';
    options:
      - "1"
      - "2"
      - "3"
      - "0"
    answer: 1
    explanation: "`'2026-02-20'` means midnight at the **start** of the 20th. The payment at exactly midnight is included, but the one at 23:40 isn't. Use `< '2026-02-21'`."

  - type: mcq
    prompt: Why prefer `'Europe/Rome'` over `'+01'`?
    options:
      - Offsets are slower, because PostgreSQL has to parse the number
      - A named zone knows daylight saving; Rome is +01 in winter, +02 in summer
      - "`'+01'` is not valid syntax for a time zone in PostgreSQL"
      - Named zones are stored more compactly on disk than offsets, so tables stay smaller
    answer: 1
    explanation: A fixed offset can't follow daylight-saving changes, so it's wrong for part of the year.

  - type: predict
    prompt: What does this return?
    code: |
      SELECT (date_trunc('month', '2028-02-10'::date) + interval '1 month' - interval '1 day')::date;
    options:
      - "2028-02-28"
      - "2028-02-29"
      - "2028-03-01"
      - "2028-02-10"
    answer: 1
    explanation: 2028 is a leap year. Start of February plus one month is 1 March, minus one day is 29 February. The pattern handles leap years for you.
