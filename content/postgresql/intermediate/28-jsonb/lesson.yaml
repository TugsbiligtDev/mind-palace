steps:
  - kind: explain
    title: Documents inside a column
    body: |
      **JSON** is the text format apps use to send data around: `{"format": "ebook", "edition": 2}`. Curly braces hold **keys** and values, and square brackets hold **lists** (arrays).

      PostgreSQL can store JSON in a column. Inkwell's `books.details` does, for facts that vary from book to book: a paperback has dimensions, an ebook doesn't, and only some books have won awards.

      Two types:

      | | `json` | `jsonb` |
      |---|---|---|
      | Stored as | the exact text you gave | a parsed binary form |
      | Duplicate keys | kept | last one wins |
      | Key order, spaces | kept | normalized |
      | Speed to query | re-parsed every time | fast |
      | Can be indexed | no | **yes** (GIN, Module 32) |

      **Use `jsonb`.** Pick `json` only if you must keep the exact original text.

  - kind: try
    title: json vs. jsonb
    body: |
      The same text, stored both ways. Run it: `jsonb` dropped the duplicate key and reordered the keys. Then look at some real documents: `SELECT title, details FROM books LIMIT 5;`
    sql: |
      SELECT '{"b": 1, "a": 1, "a": 2}'::json  AS as_json,
             '{"b": 1, "a": 1, "a": 2}'::jsonb AS as_jsonb;

  - kind: explain
    title: Getting values out
    body: |
      | Operator | Returns | Example |
      |---|---|---|
      | `->  'key'` | the value **as jsonb** | `details -> 'format'` → `"hardcover"` |
      | `->> 'key'` | the value **as text** | `details ->> 'edition'` → `'3'` |
      | `#>  '{a,b}'` | a nested value by path, as jsonb | `details #> '{dimensions_cm,height}'` |
      | `#>> '{a,b}'` | a nested value by path, as text | |
      | `-> 0` | the first element of an array | `details -> 'awards' -> 0` |

      The rule of thumb: **`->` to keep digging, `->>` to finish.** `->>` gives text, so cast it for maths or comparisons: `(details ->> 'edition')::int > 2`.

      A missing key gives NULL, not an error.

  - kind: try
    title: Read the details
    body: |
      The first 25 books. Run it: ebooks have no dimensions, so their height is NULL. Then add a column `details -> 'format' AS format_json` and notice the quotes: it's JSON, not text.

      (The step is checked once your changed version has run.)
    sql: |
      SELECT title,
             details ->> 'format' AS format,
             (details ->> 'edition')::int AS edition,
             details #>> '{dimensions_cm,height}' AS height_cm
      FROM books
      WHERE book_id <= 25;
    expect: |
      SELECT title,
             details ->> 'format' AS format,
             (details ->> 'edition')::int AS edition,
             details #>> '{dimensions_cm,height}' AS height_cm,
             details -> 'format' AS format_json
      FROM books
      WHERE book_id <= 25;

  - kind: try
    title: Your turn to filter on a JSON value
    body: |
      Return the `title` and the height as a number, labeled **height_cm**, of every book that's **at least 23.5 cm tall**. The height is nested: `details → dimensions_cm → height`.
    sql: |
      SELECT title, details
      FROM books;
    expect: |
      SELECT title, (details #>> '{dimensions_cm,height}')::numeric AS height_cm
      FROM books
      WHERE (details #>> '{dimensions_cm,height}')::numeric >= 23.5;

  - kind: explain
    title: Containment and key checks
    body: |
      Two operators search documents, and both can use a GIN index:

      - **`@>`** "contains": `details @> '{"format": "ebook"}'` is true when details has `format` set to `"ebook"`. It works with nested objects and arrays too: `details @> '{"awards": ["Hugo Award"]}'`.
      - **`?`** "has this key (or array element)": `details ? 'dimensions_cm'`. Also `?|` (any of these keys) and `?&` (all of them).

      Prefer `@>` over `details ->> 'format' = 'ebook'`: it's shorter, handles types properly, and is index-friendly.

  - kind: try
    title: Award winners, and missing keys
    body: |
      The first query finds the 8 books that won a Hugo Award, wherever it sits in their awards list. The second counts ebooks two ways: by format, and by the missing `dimensions_cm` key. Run both, then try `"Booker Prize"`.
    sql: |
      SELECT title, details -> 'awards' AS awards
      FROM books
      WHERE details @> '{"awards": ["Hugo Award"]}';

      SELECT count(*) FILTER (WHERE details @> '{"format": "ebook"}') AS ebooks,
             count(*) FILTER (WHERE NOT details ? 'dimensions_cm')    AS no_dimensions
      FROM books;

  - kind: explain
    title: Building JSON from rows
    body: |
      Apps often want JSON back. PostgreSQL can build it:

      - `jsonb_build_object('title', title, 'price', price)` builds an object from key/value pairs.
      - `jsonb_agg(expr ORDER BY …)` is an aggregate that collects values into a JSON **array**.
      - `to_jsonb(t)` turns a whole row into an object.

      ```sql
      SELECT g.name AS genre,
             jsonb_agg(b.title ORDER BY b.title) AS books
      FROM genres g
      JOIN books b ON b.genre_id = g.genre_id
      GROUP BY g.name;
      ```

      Changing a document: `details || '{"signed": true}'` merges keys in, `details - 'awards'` removes one, and `jsonb_set(details, '{dimensions_cm,height}', '21.5')` replaces a nested value.

  - kind: try
    title: Your turn to build JSON
    body: |
      For each of the first 25 books (`book_id` 25 or less), return its `title` and one jsonb object labeled **card** with two keys: `"format"` (from details, as text) and `"price"`.
    sql: |
      SELECT title, details, price
      FROM books
      WHERE book_id <= 25;
    expect: |
      SELECT title,
             jsonb_build_object('format', details ->> 'format', 'price', price) AS card
      FROM books
      WHERE book_id <= 25;

  - kind: explain
    title: The SQL/JSON functions
    body: |
      PostgreSQL 17 added the **SQL-standard** JSON functions. They use **JSON paths** like `'$.edition'` (`$` means "the document"):

      | Function | Does |
      |---|---|
      | `JSON_VALUE(doc, '$.edition' RETURNING int)` | one plain value, already converted to a type |
      | `JSON_QUERY(doc, '$.awards')` | a piece of JSON (an object or array) |
      | `JSON_EXISTS(doc, '$.dimensions_cm')` | true or false: is this path there? |
      | `JSON_TABLE(doc, '$.items[*]' COLUMNS (…))` | turns a JSON array into **rows and columns** |

      `JSON_TABLE` is the star: it turns a nested document, like an order from an app, into an ordinary table you can join and aggregate.

  - kind: try
    title: JSON_TABLE
    body: |
      An order arrives from Inkwell's mobile app as one JSON document. JSON_TABLE turns its items into rows. Run it, then add `sum(qty * price)` in an outer query to total the order.
    sql: |
      SELECT items.*
      FROM JSON_TABLE(
        '{"order": 17,
          "items": [{"isbn": "978-0441172719", "qty": 2, "price": 18.00},
                    {"isbn": "978-0547928227", "qty": 1, "price": 14.99}]}'::jsonb,
        '$.items[*]'
        COLUMNS (
          isbn  text    PATH '$.isbn',
          qty   integer PATH '$.qty',
          price numeric PATH '$.price'
        )
      ) AS items;

  - kind: explain
    title: When JSONB fits, and when it hides data
    body: |
      JSONB is great for:

      - data whose shape **varies**: product attributes (a shirt has sizes, a book has pages, an ebook has no dimensions)
      - storing a payload **as received** (API responses, webhooks) to process later
      - optional, rarely queried extras

      It's the **wrong** choice when it hides data that belongs in columns:

      - Values you **filter, join or sum** all the time should be real columns, with real types. That's why `price` is a column, not a key in `details`.
      - JSON has **no constraints**: nothing stops `"edition": "first-ish"` or a missing key. Columns get NOT NULL, CHECK and foreign keys (Modules 12–13).
      - Keys are **retyped in every row**, which wastes space.

      A good rule: **columns for what every row has, JSONB for what varies.** If you find yourself writing `->>` in every query, it's time for a column.

  - kind: try
    title: "Find the bug: books without dimensions"
    body: |
      *"How many books have **no** `dimensions_cm` in their details?"* This returns 0, but every ebook lacks dimensions. Fix it. Return one number.
    sql: |
      SELECT count(*)
      FROM books
      WHERE details -> 'dimensions_cm' = 'null'::jsonb;
    expect: |
      SELECT count(*)
      FROM books
      WHERE NOT details ? 'dimensions_cm';
    hint: |
      A key that isn't there doesn't hold JSON `null`: `->` gives SQL NULL, and `= anything` with NULL isn't true. Test whether the key exists (`?`), or use IS NULL.

  - kind: why
    body: |
      Modern apps speak JSON. JSONB lets PostgreSQL store flexible data alongside strict tables, search it quickly, and hand results straight back to an app, while you keep the discipline to put core data in real columns.

  - kind: recap
    body: |
      - Use `jsonb` (parsed, indexable). `json` keeps the exact text.
      - `->` returns jsonb (keep digging), `->>` returns text (cast it). `#>` / `#>>` follow a path.
      - `@>` = contains, `?` = has key. Both are index-friendly.
      - Build JSON with `jsonb_build_object`, `jsonb_agg`, `to_jsonb`. Edit with `||`, `-`, `jsonb_set`.
      - SQL/JSON (PG17): `JSON_VALUE`, `JSON_QUERY`, `JSON_EXISTS`, and `JSON_TABLE` to turn arrays into rows.
      - Columns for what every row has. JSONB for what varies.
