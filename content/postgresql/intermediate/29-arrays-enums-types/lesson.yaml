steps:
  - kind: explain
    title: Arrays
    body: |
      Any type can be an **array**, a list in one column: `text[]`, `integer[]`, `date[]`. Inkwell's `books.tags` is one: `{staff-pick,book-club}`.

      ```sql
      CREATE TABLE books (
          …
          tags  text[] NOT NULL DEFAULT '{}'
      );
      ```

      You write an array as `'{a,b,c}'` or `ARRAY['a','b','c']`. Working with them:

      | Expression | Means |
      |---|---|
      | `tags[1]` | the first item (arrays count from **1**) |
      | `'bestseller' = ANY(tags)` | is 'bestseller' in the list? |
      | `tags @> '{staff-pick,book-club}'` | contains all of these? |
      | `tags && '{signed-copy,new-release}'` | shares any item with this list? |
      | `array_length(tags, 1)` | how many items |
      | `unnest(tags)` | one row per item |

  - kind: try
    title: Play with an array
    body: |
      Books tagged as award winners. Run it. Then change the WHERE to find the signed copies (`'signed-copy'`), or books with **both** `staff-pick` and `book-club` using `@>`.

      Change it to find the **signed copies** (`'signed-copy'`). (The step is checked once your changed version has run.)
    sql: |
      SELECT title, tags, tags[1] AS first_tag,
             array_length(tags, 1) AS how_many
      FROM books
      WHERE 'award-winner' = ANY(tags);
    expect: |
      SELECT title, tags, tags[1] AS first_tag,
             array_length(tags, 1) AS how_many
      FROM books
      WHERE 'signed-copy' = ANY(tags);

  - kind: try
    title: Your turn with arrays
    body: |
      For the first 25 books (`book_id` 25 or less), return one row per book **per tag**: columns `title` and **tag**, using `unnest`. Books with no tags simply produce no rows.
    sql: |
      SELECT title, tags
      FROM books
      WHERE book_id <= 25;
    expect: |
      SELECT title, unnest(tags) AS tag
      FROM books
      WHERE book_id <= 25;

  - kind: explain
    title: Array or junction table?
    body: |
      Module 17 said "one value per cell". An array is a deliberate, **typed** exception, and it's fine in some cases:

      **An array is fine when** the items are simple values (tags, labels, language codes), you mostly read the whole list together, and the items don't need their own facts or foreign keys. Inkwell's tags are exactly that.

      **Use a junction table (Module 13) when:**

      - the items are **real entities** that should exist in their own table. A book's authors are people with names and birth years, so Inkwell links them through the `book_authors` junction table instead of an array.
      - you need a **foreign key** so every item is valid (arrays can't have FKs)
      - each link has its **own facts** (like `author_order`: main author or co-author)
      - you often ask "who has X?" across many rows and need it fast (arrays can be indexed with GIN, but a junction table is usually simpler to query and maintain)

      When in doubt, use a junction table. It never gets in your way later.

  - kind: explain
    title: "Fixed lists of values: three options"
    body: |
      An order's `status` should only ever be `pending`, `paid`, `shipped`, `delivered` or `cancelled`. Inkwell uses a CHECK for that. There are three ways to enforce it:

      | Option | Looks like | Good | Watch out |
      |---|---|---|---|
      | **CHECK** | `CHECK (status IN ('pending','paid','shipped','delivered','cancelled'))` | simple, easy to change | the list lives in one table's rule |
      | **ENUM type** | `CREATE TYPE order_status AS ENUM ('pending','paid','shipped','delivered','cancelled')` | compact, sorts in the listed order, reusable in many tables | **adding** values is easy, **removing or renaming** them is hard |
      | **Lookup table** | `order_statuses (status PRIMARY KEY, label, sort_order)` + a foreign key | values are data: editable, can carry extra columns (a label, a color) | one more table and join |

      <!-- page -->

      Rough guide: **CHECK** for short lists local to one table; **ENUM** for stable lists that will only grow; a **lookup table** when the list changes often, has extra info, or is managed by non-developers.

  - kind: try
    title: An ENUM in action
    body: |
      Enum values sort in the order they were **declared**, not alphabetically. Run it: low, medium, high. Then change one value in the INSERT to `'urgent'` and read the error.
    sql: |
      CREATE TYPE priority AS ENUM ('low', 'medium', 'high');
      CREATE TABLE tasks (title text, level priority NOT NULL);
      INSERT INTO tasks VALUES ('Restock Dune', 'high'), ('Dust the shelves', 'low'), ('Plan book club', 'medium');

      SELECT title, level FROM tasks ORDER BY level;

  - kind: explain
    title: Generated columns
    body: |
      Module 17 warned against storing values you can calculate, because copies go stale. A **generated column** is calculated **by PostgreSQL** from other columns in the same row, so it can never disagree with them:

      ```sql
      CREATE TABLE sale_lines (
          customer    text,
          copies      integer,
          unit_price  numeric(8,2),
          line_total  numeric(10,2) GENERATED ALWAYS AS (copies * unit_price)
      );
      ```

      You can't write to it. It updates itself when `copies` or `unit_price` change.

      Two kinds:

      - **`VIRTUAL`**: calculated each time you read it, and takes no space. **The default since PostgreSQL 18.**
      - **`STORED`**: calculated when the row is written and saved on disk. Faster to read, and can be indexed.

      The expression may only use the row's own columns, and only functions that always give the same answer (no `now()`).

  - kind: try
    title: Your turn to make it self-updating
    body: |
      This is the stale-total table from Module 17. Change `line_total` into a **generated column** (`copies * unit_price`), and remove it from the INSERT (you can't write to it). Then run it: after the UPDATE, the total should be 50.00.
    sql: |
      CREATE TABLE sale_lines (
          customer    text,
          copies      integer,
          unit_price  numeric(8,2),
          line_total  numeric(10,2)
      );
      INSERT INTO sale_lines VALUES ('Emma', 3, 12.50, 37.50);
      UPDATE sale_lines SET copies = 4 WHERE customer = 'Emma';

      SELECT customer, copies, line_total FROM sale_lines;
    expect: |
      CREATE TABLE sale_lines (
          customer    text,
          copies      integer,
          unit_price  numeric(8,2),
          line_total  numeric(10,2) GENERATED ALWAYS AS (copies * unit_price)
      );
      INSERT INTO sale_lines (customer, copies, unit_price) VALUES ('Emma', 3, 12.50);
      UPDATE sale_lines SET copies = 4 WHERE customer = 'Emma';

      SELECT customer, copies, line_total FROM sale_lines;

  - kind: info
    title: "🔹 Range types"
    body: |
      A **range** is a start and an end in one value: `daterange`, `tstzrange`, `int4range`, `numrange`.

      ```sql
      SELECT daterange('2026-03-01', '2026-03-10') @> '2026-03-05'::date;   -- contains? true
      SELECT daterange('2026-03-01', '2026-03-10')
          && daterange('2026-03-09', '2026-03-12');                         -- overlap? true
      ```

      By default the start is **included** and the end **excluded**, written `[2026-03-01,2026-03-10)`, the same half-open idea as Module 27. Ranges shine for bookings and "no two promotions may overlap" rules (an *exclusion constraint* on a range column can enforce that).

  - kind: info
    title: "🔹 Domains, inet and citext"
    body: |
      - **Domain**: your own named type with a rule built in, reusable across tables:
        `CREATE DOMAIN email_address AS text CHECK (VALUE ~ '^[^@]+@[^@]+$');`
      - **`inet` / `cidr`**: IP addresses and networks, with operators like "is this address inside this network?": `'192.168.1.5'::inet << '192.168.1.0/24'`.
      - **`citext`**: case-insensitive text from an extension (`CREATE EXTENSION citext;`). `'Emma@Example.com' = 'emma@example.com'` is true. Handy for emails and usernames. (This browser sandbox doesn't include it. Try it on your Mac.)

  - kind: try
    title: "Find the bug: the first tag is missing"
    body: |
      For books 1 to 25, show `title` and each book's **first** tag, labeled **first_tag**. Every value comes back empty. Fix it.
    sql: |
      SELECT title, tags[0] AS first_tag
      FROM books
      WHERE book_id <= 25;
    expect: |
      SELECT title, tags[1] AS first_tag
      FROM books
      WHERE book_id <= 25;
    hint: |
      Where do PostgreSQL arrays start counting? Asking for a position that doesn't exist gives NULL, not an error.

  - kind: why
    body: |
      Choosing the right type is design work: it decides what's easy, what's fast, and which mistakes are impossible. Arrays and enums are convenient in the right place and painful in the wrong one, and generated columns remove a whole class of stale-data bugs.

  - kind: recap
    body: |
      - Arrays: `text[]`, `'{a,b}'` or `ARRAY[…]`, count from 1, `= ANY()`, `@>`, `&&`, `unnest()`.
      - Arrays suit simple value lists. Use a junction table for entities, foreign keys, per-link facts or heavy "who has X?" queries.
      - Fixed value lists: **CHECK** (simple), **ENUM** (stable, declared sort order, hard to remove values), **lookup table** (editable data, extra columns).
      - `GENERATED ALWAYS AS (expr)`: `VIRTUAL` (default in PG18, computed on read) or `STORED` (saved, indexable).
      - 🔹 Ranges (`daterange`, `@>`, `&&`), domains, `inet`, `citext`.
