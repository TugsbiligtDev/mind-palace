steps:
  - kind: explain
    title: Arrays
    body: |
      Any type can be an **array**, a list in one column: `text[]`, `integer[]`, `date[]`.

      ```sql
      CREATE TABLE guides (
          name       text PRIMARY KEY,
          languages  text[] NOT NULL DEFAULT '{}'
      );
      INSERT INTO guides VALUES ('Bat', '{en,fr,mn}'), ('Saruul', ARRAY['mn','ru']);
      ```

      Working with them:

      | Expression | Means |
      |---|---|
      | `languages[1]` | the first item (arrays count from **1**) |
      | `'fr' = ANY(languages)` | is 'fr' in the list? |
      | `languages @> '{fr,en}'` | contains all of these? |
      | `languages && '{fr,ru}'` | shares any item with this list? |
      | `array_length(languages, 1)` | how many items |
      | `unnest(languages)` | one row per item |

  - kind: try
    title: Play with an array
    body: |
      Run it. Then change the WHERE to find guides who speak Russian (`'ru'`).
    sql: |
      CREATE TABLE guides (
          name       text PRIMARY KEY,
          languages  text[] NOT NULL DEFAULT '{}'
      );
      INSERT INTO guides VALUES ('Bat', '{en,fr,mn}'), ('Saruul', ARRAY['mn','ru']);

      SELECT name, languages, languages[1] AS first_language,
             array_length(languages, 1) AS how_many
      FROM guides
      WHERE 'fr' = ANY(languages);

  - kind: try
    title: Your turn with arrays
    body: |
      Return one row per guide **per language**: columns `name` and **language**, using `unnest`.
    sql: |
      CREATE TABLE guides (
          name       text PRIMARY KEY,
          languages  text[] NOT NULL DEFAULT '{}'
      );
      INSERT INTO guides VALUES ('Bat', '{en,fr,mn}'), ('Saruul', ARRAY['mn','ru']);

      SELECT name, languages FROM guides;
    expect: |
      CREATE TABLE guides (
          name       text PRIMARY KEY,
          languages  text[] NOT NULL DEFAULT '{}'
      );
      INSERT INTO guides VALUES ('Bat', '{en,fr,mn}'), ('Saruul', ARRAY['mn','ru']);

      SELECT name, unnest(languages) AS language FROM guides;

  - kind: explain
    title: Array or junction table?
    body: |
      Module 17 said "one value per cell". An array is a deliberate, **typed** exception, and it's fine in some cases:

      **An array is fine when** the items are simple values (tags, labels, language codes), you mostly read the whole list together, and the items don't need their own facts or foreign keys.

      **Use a junction table (Module 13) when:**

      - the items are **real entities** that should exist in their own table (a language with a name and a flag, a product)
      - you need a **foreign key** so every item is valid (arrays can't have FKs)
      - each link has its **own facts** (level of fluency, date certified)
      - you often ask "who has X?" across many rows and need it fast (arrays can be indexed with GIN, but a junction table is usually simpler to query and maintain)

      When in doubt, use a junction table. It never gets in your way later.

  - kind: explain
    title: "Fixed lists of values: three options"
    body: |
      A trip's `status` should only ever be `planned`, `completed` or `cancelled`. Three ways to enforce that:

      | Option | Looks like | Good | Watch out |
      |---|---|---|---|
      | **CHECK** | `CHECK (status IN ('planned','completed','cancelled'))` | simple, easy to change | the list lives in one table's rule |
      | **ENUM type** | `CREATE TYPE trip_status AS ENUM ('planned','completed','cancelled')` | compact, sorts in the listed order, reusable in many tables | **adding** values is easy, **removing or renaming** them is hard |
      | **Lookup table** | `trip_statuses (status PRIMARY KEY, label, sort_order)` + a foreign key | values are data: editable, can carry extra columns (a label, a color) | one more table and join |

      Rough guide: **CHECK** for short lists local to one table; **ENUM** for stable lists that will only grow; a **lookup table** when the list changes often, has extra info, or is managed by non-developers.

  - kind: try
    title: An ENUM in action
    body: |
      Enum values sort in the order they were **declared**, not alphabetically. Run it: low, medium, high. Then change one value in the INSERT to `'urgent'` and read the error.
    sql: |
      CREATE TYPE priority AS ENUM ('low', 'medium', 'high');
      CREATE TABLE tasks (title text, level priority NOT NULL);
      INSERT INTO tasks VALUES ('Book hotel', 'high'), ('Pack', 'low'), ('Buy map', 'medium');

      SELECT title, level FROM tasks ORDER BY level;

  - kind: explain
    title: Generated columns
    body: |
      Module 17 warned against storing values you can calculate, because copies go stale. A **generated column** is calculated **by PostgreSQL** from other columns in the same row, so it can never disagree with them:

      ```sql
      CREATE TABLE hotel_stays (
          guest            text,
          nights           integer,
          price_per_night  numeric(8,2),
          total_price      numeric(10,2) GENERATED ALWAYS AS (nights * price_per_night)
      );
      ```

      You can't write to it. It updates itself when `nights` or `price_per_night` change.

      Two kinds:

      - **`VIRTUAL`**: calculated each time you read it, and takes no space. **The default since PostgreSQL 18.**
      - **`STORED`**: calculated when the row is written and saved on disk. Faster to read, and can be indexed.

      The expression may only use the row's own columns, and only functions that always give the same answer (no `now()`).

  - kind: try
    title: Your turn to make it self-updating
    body: |
      This is the stale-total table from Module 17. Change `total_price` into a **generated column** (`nights * price_per_night`), and remove it from the INSERT (you can't write to it). Then run it: after the UPDATE, the total should be 480.
    sql: |
      CREATE TABLE hotel_stays (
          guest            text,
          nights           integer,
          price_per_night  numeric(8,2),
          total_price      numeric(10,2)
      );
      INSERT INTO hotel_stays VALUES ('Amina', 3, 120.00, 360.00);
      UPDATE hotel_stays SET nights = 4 WHERE guest = 'Amina';

      SELECT guest, nights, total_price FROM hotel_stays;
    expect: |
      CREATE TABLE hotel_stays (
          guest            text,
          nights           integer,
          price_per_night  numeric(8,2),
          total_price      numeric(10,2) GENERATED ALWAYS AS (nights * price_per_night)
      );
      INSERT INTO hotel_stays (guest, nights, price_per_night) VALUES ('Amina', 3, 120.00);
      UPDATE hotel_stays SET nights = 4 WHERE guest = 'Amina';

      SELECT guest, nights, total_price FROM hotel_stays;

  - kind: info
    title: "🔹 Range types"
    body: |
      A **range** is a start and an end in one value: `daterange`, `tstzrange`, `int4range`, `numrange`.

      ```sql
      SELECT daterange('2026-03-01', '2026-03-10') @> '2026-03-05'::date;   -- contains? true
      SELECT daterange('2026-03-01', '2026-03-10')
          && daterange('2026-03-09', '2026-03-12');                         -- overlap? true
      ```

      By default the start is **included** and the end **excluded**, written `[2026-03-01,2026-03-10)`, the same half-open idea as Module 27. Ranges shine for bookings and "no two stays may overlap" rules, which you'll build in Module 40.

  - kind: info
    title: "🔹 Domains, inet and citext"
    body: |
      - **Domain**: your own named type with a rule built in, reusable across tables:
        `CREATE DOMAIN email_address AS text CHECK (VALUE ~ '^[^@]+@[^@]+$');`
      - **`inet` / `cidr`**: IP addresses and networks, with operators like "is this address inside this network?": `'192.168.1.5'::inet << '192.168.1.0/24'`.
      - **`citext`**: case-insensitive text from an extension (`CREATE EXTENSION citext;`). `'Amina@Example.com' = 'amina@example.com'` is true. Handy for emails and usernames. (This browser sandbox doesn't include it. Try it on your Mac.)

  - kind: why
    body: |
      Choosing the right type is design work: it decides what's easy, what's fast, and which mistakes are impossible. Arrays and enums are convenient in the right place and painful in the wrong one, and generated columns remove a whole class of stale-data bugs.

  - kind: recap
    body: |
      - Arrays: `text[]`, `'{a,b}'` or `ARRAY[…]`, count from 1, `= ANY()`, `@>`, `&&`, `unnest()`.
      - Arrays suit simple value lists. Use a junction table for entities, foreign keys, per-link facts or heavy "who has X?" queries.
      - Fixed value lists: **CHECK** (simple), **ENUM** (stable, declared sort order, hard to remove values), **lookup table** (editable data, extra columns).
      - `GENERATED ALWAYS AS (expr)`: `VIRTUAL` (default in PG18, computed on read) or `STORED` (saved, indexable).
      - 🔹 Ranges (`daterange`, `@>`, `&&`), domains, `inet`, `citext`.
