steps:
  - kind: explain
    title: The index at the back of the book
    body: |
      To find every page that mentions "Arrakis" in a 700-page copy of *Dune*, you could read all 700 pages. Or you could turn to the **index** at the back, which lists "Arrakis: 12, 88, 301", and go straight there.

      A database **index** is the same idea. Without one, `WHERE customer_id = 42` makes PostgreSQL read **every row** of the orders table (a *sequential scan*). With an index on `customer_id`, it looks up 42 in a sorted structure and jumps straight to the matching rows.

      ```sql
      CREATE INDEX orders_customer_id_idx ON orders (customer_id);
      ```

      Queries don't change at all. PostgreSQL decides by itself whether an index helps (Module 33 shows how to see its decision).

  - kind: choice
    title: "Quick check: what changes?"
    body: "You add `CREATE INDEX orders_customer_id_idx ON orders (customer_id);`. What do you have to change in your queries to use it?"
    options:
      - "Add `USING orders_customer_id_idx` to every query"
      - "Nothing: PostgreSQL decides by itself when to use it"
      - "Query the index instead of the table"
      - "Rename the column to customer_id_idx"
    answer: 1
    explanation: "Queries stay exactly the same. The planner sees the index and uses it when it helps. You'll watch it do that on the next pages."

  - kind: explain
    title: B-tree, the default
    body: |
      `CREATE INDEX` builds a **B-tree** unless you say otherwise: a sorted, balanced tree, like a very fast phone book. It helps with:

      - equality: `=`, `IN`
      - ranges: `<`, `>`, `BETWEEN`, `>= … AND <`
      - sorting: `ORDER BY` the indexed column (the rows come out already sorted)
      - prefix matches: `LIKE 'The Si%'` (with the right setup)

      It **doesn't** help with `LIKE '%River'`, most regexes (Module 26), or searching inside jsonb (GIN below).

      Primary keys and UNIQUE constraints get a B-tree **automatically** (Module 11).

  - kind: try
    title: Feel the difference
    body: |
      The same query on the 39,419 orders, before and after creating an index. Run it and compare the **Execution Time** of the two plans. The first reads every row (*Seq Scan*: "Rows Removed by Filter: 39400") to find customer 42's 19 orders. The second jumps straight to them through the index (*Bitmap Index Scan*), and is many times faster. You'll learn to read plans properly in Module 33.
    sql: |
      EXPLAIN ANALYZE SELECT * FROM orders WHERE customer_id = 42;

      CREATE INDEX orders_customer_id_idx ON orders (customer_id);

      EXPLAIN ANALYZE SELECT * FROM orders WHERE customer_id = 42;

  - kind: explain
    title: Indexes aren't free
    body: |
      Every index is a separate structure that must be kept up to date:

      - **Every INSERT** adds an entry to **every** index on the table.
      - **Every UPDATE** of an indexed column (and often of other columns too) updates the index.
      - **Every DELETE** leaves index entries to clean up.
      - Indexes take **disk space and memory**, sometimes more than the table itself.

      So: **index what your queries actually filter, join or sort on**, not every column "just in case". A table with 15 indexes can be painfully slow to write to. The built-in view `pg_stat_user_indexes` shows how often each index is used (`idx_scan`), so you can find the ones nobody uses.

  - kind: try
    title: "Try it: which indexes get used?"
    body: |
      Run it: one row per index on `orders` and `payments`, with how many times each was used. The primary keys have been used a lot (loading the data checked every foreign key against them).

      Then play: run `SELECT * FROM payments WHERE payment_id = 5;` above the query and see `payments_pkey`'s count go up by one.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SELECT relname AS table_name,
             indexrelname AS index_name,
             idx_scan
      FROM pg_stat_user_indexes
      WHERE relname IN ('orders', 'payments')
      ORDER BY 1, 2;

  - kind: explain
    title: Multi-column indexes, and why order matters
    body: |
      ```sql
      CREATE INDEX payments_order_paid_idx ON payments (order_id, paid_at);
      ```

      This is sorted by `order_id` first, and **within each order** by `paid_at`, exactly like a phone book sorted by last name, then first name. So it helps:

      - `WHERE order_id = 174` ✓ (like finding all the "Smith"s)
      - `WHERE order_id = 174 AND paid_at >= '2023-05-01'` ✓ (Smiths named after "M")
      - `WHERE order_id = 174 ORDER BY paid_at` ✓ (already in order)
      - `WHERE paid_at >= '2026-02-01'` alone ✗, mostly (like finding every "John" in a phone book sorted by last name)

      **Rule of thumb:** put columns you test with **`=`** first, and the one you use for **ranges or sorting** last.

      <!-- page -->

      With that index in place, `EXPLAIN` (Module 33) shows PostgreSQL's plan for each query. One order's payments in time order uses it:

      ```sql
      EXPLAIN SELECT * FROM payments WHERE order_id = 174 ORDER BY paid_at;
      ```

      ```text
      Index Scan using payments_order_paid_idx on payments  (cost=…)
        Index Cond: (order_id = 174)
      ```

      No sort step is needed: the index already holds each order's payments in `paid_at` order. Filtering on `paid_at` **alone** can't use it:

      ```sql
      EXPLAIN SELECT * FROM payments WHERE paid_at >= '2026-02-01';
      ```

      ```text
      Seq Scan on payments  (cost=…)
        Filter: (paid_at >= '2026-02-01 00:00:00+00'::timestamp with time zone)
      ```

      *Seq Scan* means "read every row".

  - kind: try
    title: "Try it: column order in a plan"
    body: |
      The index and both plans. Run it and find *Index Scan* in the first plan and *Seq Scan* in the second.

      Then play: add `AND paid_at >= '2023-05-01'` to the first query (still uses the index), or plan `WHERE order_id IN (174, 175)`.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      CREATE INDEX payments_order_paid_idx ON payments (order_id, paid_at);

      EXPLAIN SELECT *
      FROM payments
      WHERE order_id = 174
      ORDER BY paid_at;

      EXPLAIN SELECT * FROM payments WHERE paid_at >= '2026-02-01';

  - kind: try
    title: Your turn to create an index
    body: |
      Support pages often ask for one order's payments in time order. Create an index named **payments_order_paid_idx** on `payments`, on `order_id` then `paid_at`. The query below lists the table's indexes so you can check.
    sql: |
      SELECT indexname, indexdef
      FROM pg_indexes
      WHERE tablename = 'payments'
      ORDER BY indexname;
    expect: |
      CREATE INDEX payments_order_paid_idx ON payments (order_id, paid_at);

      SELECT indexname, indexdef
      FROM pg_indexes
      WHERE tablename = 'payments'
      ORDER BY indexname;

  - kind: explain
    title: Unique, partial and expression indexes
    body: |
      **Unique index**: also enforces uniqueness. (A UNIQUE constraint is really a unique index underneath.)

      ```sql
      CREATE UNIQUE INDEX books_isbn_idx ON books (isbn);
      ```

      **Partial index**: indexes only rows matching a WHERE. Smaller and faster when you only ever search a slice:

      ```sql
      CREATE INDEX orders_pending_idx ON orders (ordered_at)
      WHERE status = 'pending';
      ```

      A partial **unique** index is a neat trick: `CREATE UNIQUE INDEX ON orders (customer_id) WHERE status = 'pending'` would mean "at most one *pending* order per customer".

      **Expression index**: indexes the result of a calculation. The query must use the **same expression**:

      ```sql
      CREATE INDEX customers_lower_city_idx ON customers (lower(city));
      SELECT … WHERE lower(city) = 'tokyo';    -- can use it
      SELECT … WHERE city = 'Tokyo';           -- can't
      ```

  - kind: try
    title: "Try it: a partial index"
    body: |
      **Part 1**, the partial index. Run it: the pending query uses the small index (*Index Scan using orders_pending_idx*), with no sort step. The paid query can't: its WHERE doesn't match the index's WHERE, so it's a *Seq Scan* plus a *Sort*.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      CREATE INDEX orders_pending_idx ON orders (ordered_at)
      WHERE status = 'pending';

      EXPLAIN SELECT *
      FROM orders
      WHERE status = 'pending'
      ORDER BY ordered_at;

      EXPLAIN SELECT *
      FROM orders
      WHERE status = 'paid'
      ORDER BY ordered_at;

  - kind: try
    title: "Try it: a partial unique index"
    body: |
      **Part 2**, the unique trick, on a small `carts` table: each customer may have **one open** cart, but any number of closed ones. Run it: the first INSERT is fine (customer 1 has one open and two closed carts), and the last is refused, because customer 1 already has an open cart.

      Then change the last line's `'open'` to `'closed'`: accepted, since closed carts aren't in the index at all.

      (On the real `orders` table this exact rule can't be added: some customers already have several pending orders, and a new unique index checks the existing rows first, like a new constraint in Module 15.)

      To continue, make it run without an error: the change above does it.
    sql: |
      CREATE TABLE carts (
          cart_id      integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          customer_id  integer NOT NULL,
          status       text NOT NULL
      );
      CREATE UNIQUE INDEX carts_one_open_idx ON carts (customer_id)
      WHERE status = 'open';

      INSERT INTO carts (customer_id, status)
      VALUES (1, 'open'), (1, 'closed'), (1, 'closed'), (2, 'open');
      SELECT * FROM carts ORDER BY cart_id;

      INSERT INTO carts (customer_id, status) VALUES (1, 'open');
    broken_starter: true

  - kind: explain
    title: Index your foreign keys
    body: |
      Module 13 warned: PostgreSQL indexes primary keys automatically, but **not foreign key columns**. Joins and parent deletes then scan the whole child table.

      Inkwell's foreign keys (`orders.customer_id`, `order_items.book_id`, `payments.order_id`…) have no indexes yet, on purpose. On real data like this, you'd add one for each FK you join on or delete through.

      **Example: one foreign key, before and after.** Finding every order line for book 42 means filtering on the foreign key `order_items.book_id`:

      ```sql
      EXPLAIN SELECT * FROM order_items WHERE book_id = 42;
      ```

      ```text
      Seq Scan on order_items  (cost=0.00..1319.51 rows=273 width=18)
        Filter: (book_id = 42)
      ```

      ```sql
      CREATE INDEX order_items_book_id_idx ON order_items (book_id);
      EXPLAIN SELECT * FROM order_items WHERE book_id = 42;
      ```

      ```text
      Bitmap Heap Scan on order_items  (cost=6.41..417.52 rows=273 width=18)
        Recheck Cond: (book_id = 42)
        ->  Bitmap Index Scan on order_items_book_id_idx  (cost=0.00..6.34 rows=273 width=0)
              Index Cond: (book_id = 42)
      ```

      Before: read all ~70,000 lines. After: the index finds the 273 matching lines directly, and the estimated cost drops from 1319 to 417. The same thing speeds up a join from `books` to `order_items`, and deleting a book.

  - kind: try
    title: Your turn to index a foreign key
    body: |
      Add an index named **orders_customer_id_idx** on the foreign key `orders.customer_id`, and a **partial** index named **orders_pending_idx** on `orders (ordered_at)` covering only rows where `status = 'pending'`.
    sql: |
      SELECT indexname, indexdef
      FROM pg_indexes
      WHERE tablename = 'orders'
      ORDER BY indexname;
    expect: |
      CREATE INDEX orders_customer_id_idx ON orders (customer_id);
      CREATE INDEX orders_pending_idx ON orders (ordered_at) WHERE status = 'pending';

      SELECT indexname, indexdef
      FROM pg_indexes
      WHERE tablename = 'orders'
      ORDER BY indexname;

  - kind: explain
    title: GIN for jsonb and arrays
    body: |
      A B-tree indexes **whole values**. To search **inside** values (a key in a jsonb document, an item in an array), use a **GIN** index (Generalized Inverted Index). It's like a book index listing every word:

      ```sql
      CREATE INDEX books_details_idx ON books USING gin (details);
      CREATE INDEX books_tags_idx    ON books USING gin (tags);
      ```

      These speed up `@>`, `?`, `?|`, `?&` on jsonb (Module 28) and `@>`, `&&` on arrays (Module 29). GIN indexes are slower to update than B-trees, so again: only where you search.

      With only 300 books, PostgreSQL decides reading the whole table is cheaper anyway, so the plan says *Seq Scan*. Forbidding sequential scans for a moment (`SET enable_seqscan = off`, a testing switch, never for real use) shows the index *can* serve the query:

      ```text
      Bitmap Heap Scan on books  (cost=…)
        Recheck Cond: (tags @> '{signed-copy}'::text[])
        ->  Bitmap Index Scan on books_tags_idx  (cost=…)
              Index Cond: (tags @> '{signed-copy}'::text[])
      ```

      On a table with millions of rows, the planner would pick it without being pushed.

  - kind: try
    title: "Try it: a GIN index"
    body: |
      Run it: the first plan is a *Seq Scan* (the table is small), the second, with sequential scans switched off, uses `books_tags_idx`.

      Then play: try a jsonb query with the same trick, after `CREATE INDEX books_details_idx ON books USING gin (details);` and `WHERE details @> '{"format": "ebook"}'`.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      CREATE INDEX books_tags_idx ON books USING gin (tags);

      EXPLAIN SELECT title FROM books WHERE tags @> '{signed-copy}';

      SET enable_seqscan = off;
      EXPLAIN SELECT title FROM books WHERE tags @> '{signed-copy}';

  - kind: explain
    title: CREATE INDEX CONCURRENTLY
    body: |
      A plain `CREATE INDEX` **blocks all writes** to the table until it finishes. On a big, busy table, that can mean minutes of failed checkouts.

      ```sql
      CREATE INDEX CONCURRENTLY order_items_book_id_idx ON order_items (book_id);
      ```

      `CONCURRENTLY` builds the index while inserts, updates and deletes keep working. The trade-offs:

      - It's slower, and scans the table twice.
      - It **can't run inside a transaction block** (no BEGIN around it).
      - If it fails partway, it leaves an **INVALID** index behind. Drop it and try again.

      **On production tables, always use CONCURRENTLY.**

  - kind: try
    title: "Try it: CONCURRENTLY"
    body: |
      Run it: the index is built, and the second query shows it. (With one session here, nothing is waiting to write, so you won't notice the difference in speed.)

      Then put `BEGIN;` before the CREATE INDEX and run again: *CREATE INDEX CONCURRENTLY cannot run inside a transaction block*.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      CREATE INDEX CONCURRENTLY order_items_book_id_idx ON order_items (book_id);

      SELECT indexname, indexdef
      FROM pg_indexes
      WHERE tablename = 'order_items'
      ORDER BY indexname;

  - kind: info
    title: "🔹 GiST, BRIN and hash"
    body: |
      Other index types for special jobs:

      - **GiST**: for geometric data, ranges and "overlaps" questions. It powers exclusion constraints and PostGIS maps.
      - **BRIN**: tiny indexes for **huge** tables where values follow the physical order, like an append-only log sorted by time. It stores just "this block of pages holds dates from X to Y".
      - **Hash**: equality (`=`) only. Rarely better than a B-tree.

  - kind: try
    title: "Find the bug: the index that never gets used"
    body: |
      The warehouse screen runs `SELECT * FROM orders WHERE status = 'pending' ORDER BY ordered_at;`. Someone created the small partial index below for it, but the plan still reads the whole table. Find the mistake and fix the index. Checked by planning that query.
    sql: |
      CREATE INDEX orders_pending_idx ON orders (ordered_at)
      WHERE status = 'Pending';
    expect: |
      CREATE INDEX orders_pending_idx ON orders (ordered_at) WHERE status = 'pending';
    state_query: |
      CREATE FUNCTION pg_temp.uses_index(q text) RETURNS boolean LANGUAGE plpgsql AS $$
      DECLARE line text;
      BEGIN
        FOR line IN EXECUTE 'EXPLAIN ' || q LOOP
          IF line ~ 'Index' THEN RETURN true; END IF;
        END LOOP;
        RETURN false;
      END $$;
      SELECT pg_temp.uses_index($q$SELECT * FROM orders WHERE status = 'pending' ORDER BY ordered_at$q$) AS uses_index;
    hint: |
      A partial index is only usable when the query's WHERE matches the index's WHERE. Compare the two conditions letter by letter.

  - kind: try
    title: "Your turn: an index that enforces a rule"
    body: |
      `customers.email` is UNIQUE, but `EMMA.JOHNSON@example.com` would still get in, because the capitals differ. Create a **unique index** that makes emails unique **ignoring capitals**. Checked by trying some emails.
    sql: |
      -- Write your CREATE INDEX here
    expect: |
      CREATE UNIQUE INDEX customers_email_lower_key ON customers (lower(email));
    state_query: |
      CREATE FUNCTION pg_temp.run_tests() RETURNS TABLE (test text, result text) LANGUAGE plpgsql AS $$
      DECLARE t record;
      BEGIN
        FOR t IN SELECT * FROM (VALUES
          (1, $l$Emma's email in capitals$l$, $q$INSERT INTO customers (first_name, last_name, email) VALUES ('Emma', 'Again', 'EMMA.JOHNSON@example.com')$q$),
          (2, $l$a brand-new email$l$, $q$INSERT INTO customers (first_name, last_name, email) VALUES ('New', 'Person', 'New.Person@example.com')$q$),
          (3, $l$the new email in lower case$l$, $q$INSERT INTO customers (first_name, last_name, email) VALUES ('New', 'Person', 'new.person@example.com')$q$)
        ) AS v(n, label, sql) ORDER BY n LOOP
          test := t.label;
          BEGIN
            EXECUTE t.sql;
            result := 'accepted';
          EXCEPTION WHEN division_by_zero THEN
            result := 'wrong';
          WHEN OTHERS THEN
            result := CASE WHEN SQLSTATE IN ('42P01', '42703') THEN 'missing table or column' ELSE 'rejected' END;
          END;
          RETURN NEXT;
        END LOOP;
      END $$;
      SELECT test, result FROM pg_temp.run_tests();
    hint: |
      A UNIQUE index can be built on an expression, such as `lower(email)`.

  - kind: why
    body: |
      The difference between a 3-second page and a 3-millisecond page is very often one missing index. And the difference between fast writes and slow ones is often ten indexes nobody needed. Knowing which to build is one of the most valuable practical database skills.

  - kind: recap
    body: |
      - An index lets PostgreSQL jump to matching rows instead of scanning the whole table.
      - B-tree (default): `=`, ranges, ORDER BY, prefix LIKE. PKs and UNIQUE get one automatically.
      - Indexes cost writes, space and memory. Index what you filter, join and sort on.
      - Multi-column: `=` columns first, range or sort column last. `(a, b)` rarely helps `WHERE b = …` alone.
      - Unique, partial (`WHERE …`) and expression (`lower(email)`) indexes. Queries must match the expression.
      - Index your foreign key columns.
      - GIN for jsonb and arrays (`@>`, `?`, `&&`).
      - `CREATE INDEX CONCURRENTLY` on live tables: no BEGIN, check for INVALID leftovers.
      - 🔹 GiST (ranges, geometry), BRIN (huge ordered tables), hash (rare).
