steps:
  - kind: explain
    title: The index at the back of the book
    body: |
      To find every page that mentions "Kyoto" in a 500-page book, you could read all 500 pages. Or you could turn to the **index** at the back, which lists "Kyoto: 12, 88, 301", and go straight there.

      A database **index** is the same idea. Without one, `WHERE traveler_id = 42` makes PostgreSQL read **every row** of the table (a *sequential scan*). With an index on `traveler_id`, it looks up 42 in a sorted structure and jumps straight to the matching rows.

      ```sql
      CREATE INDEX bookings_traveler_idx ON bookings (traveler_id);
      ```

      Queries don't change at all. PostgreSQL decides by itself whether an index helps (Module 33 shows how to see its decision).

  - kind: explain
    title: B-tree, the default
    body: |
      `CREATE INDEX` builds a **B-tree** unless you say otherwise: a sorted, balanced tree, like a very fast phone book. It helps with:

      - equality: `=`, `IN`
      - ranges: `<`, `>`, `BETWEEN`, `>= … AND <`
      - sorting: `ORDER BY` the indexed column (the rows come out already sorted)
      - prefix matches: `LIKE 'Rom%'` (with the right setup)

      It **doesn't** help with `LIKE '%ome'`, most regexes (Module 26), or searching inside jsonb (GIN below).

      Primary keys and UNIQUE constraints get a B-tree **automatically** (Module 11).

  - kind: try
    title: Feel the difference
    body: |
      This builds a 200,000-row table, then runs the same query before and after creating an index. Run it and compare the **Execution Time** of the two plans: the first reads every row (*Seq Scan*), the second jumps straight to the 40 matches (*Index Scan*). You'll learn to read plans properly in Module 33.
    sql: |
      CREATE TABLE bookings_big AS
      SELECT g AS booking_id,
             (g % 5000) + 1 AS traveler_id,
             date '2020-01-01' + (g % 2000) AS booked_on,
             round((g % 997)::numeric, 2) AS amount
      FROM generate_series(1, 200000) AS g;
      ANALYZE bookings_big;

      EXPLAIN ANALYZE SELECT * FROM bookings_big WHERE traveler_id = 42;

      CREATE INDEX bookings_big_traveler_idx ON bookings_big (traveler_id);

      EXPLAIN ANALYZE SELECT * FROM bookings_big WHERE traveler_id = 42;

  - kind: explain
    title: Indexes aren't free
    body: |
      Every index is a separate structure that must be kept up to date:

      - **Every INSERT** adds an entry to **every** index on the table.
      - **Every UPDATE** of an indexed column (and often of other columns too) updates the index.
      - **Every DELETE** leaves index entries to clean up.
      - Indexes take **disk space and memory**, sometimes more than the table itself.

      So: **index what your queries actually filter, join or sort on**, not every column "just in case". A table with 15 indexes can be painfully slow to write to. Module 50 shows how to find indexes nobody uses.

  - kind: explain
    title: Multi-column indexes, and why order matters
    body: |
      ```sql
      CREATE INDEX payments_trip_paid_idx ON payments (trip_id, paid_at);
      ```

      This is sorted by `trip_id` first, and **within each trip** by `paid_at`, exactly like a phone book sorted by last name, then first name. So it helps:

      - `WHERE trip_id = 5` ✓ (like finding all the "Smith"s)
      - `WHERE trip_id = 5 AND paid_at >= '2026-02-01'` ✓ (Smiths named after "M")
      - `WHERE trip_id = 5 ORDER BY paid_at` ✓ (already in order)
      - `WHERE paid_at >= '2026-02-01'` alone ✗, mostly (like finding every "John" in a phone book sorted by last name)

      **Rule of thumb:** put columns you test with **`=`** first, and the one you use for **ranges or sorting** last.

  - kind: try
    title: Your turn to create an index
    body: |
      Reports often ask for one trip's payments in time order. Create an index named **payments_trip_paid_idx** on `payments`, on `trip_id` then `paid_at`. The query below lists the table's indexes so you can check.
    sql: |
      SELECT indexname, indexdef
      FROM pg_indexes
      WHERE tablename = 'payments'
      ORDER BY indexname;
    expect: |
      CREATE INDEX payments_trip_paid_idx ON payments (trip_id, paid_at);

      SELECT indexname, indexdef
      FROM pg_indexes
      WHERE tablename = 'payments'
      ORDER BY indexname;

  - kind: explain
    title: Unique, partial and expression indexes
    body: |
      **Unique index**: also enforces uniqueness. (A UNIQUE constraint is really a unique index underneath.)

      ```sql
      CREATE UNIQUE INDEX travelers_email_idx ON travelers (email);
      ```

      **Partial index**: indexes only rows matching a WHERE. Smaller and faster when you only ever search a slice:

      ```sql
      CREATE INDEX jobs_pending_idx ON jobs (created_at) WHERE status = 'pending';
      ```

      A partial **unique** index is a neat trick: `CREATE UNIQUE INDEX ON trips (traveler_id) WHERE status = 'planned'` means "at most one *planned* trip per traveler".

      **Expression index**: indexes the result of a calculation. The query must use the **same expression**:

      ```sql
      CREATE INDEX travelers_lower_email_idx ON travelers (lower(email));
      SELECT … WHERE lower(email) = 'amina@example.com';    -- can use it
      SELECT … WHERE email = 'amina@example.com';           -- can't
      ```

  - kind: try
    title: An expression index in use
    body: |
      With only 6 travelers, PostgreSQL would rather just read the table. `SET enable_seqscan = off` discourages that **for this demo only** (never in real work), so you can see the plan use the expression index. Run it, then change the WHERE to `email = 'amina@example.com'` and see the index go unused.
    sql: |
      SET enable_seqscan = off;
      CREATE INDEX travelers_lower_email_idx ON travelers (lower(email));

      EXPLAIN SELECT full_name FROM travelers WHERE lower(email) = 'amina@example.com';

  - kind: explain
    title: Index your foreign keys
    body: |
      Module 13 warned: PostgreSQL indexes primary keys automatically, but **not foreign key columns**. Joins and parent deletes then scan the whole child table.

      Wanderly's foreign keys (`trips.traveler_id`, `trip_stops.trip_id`, `payments.trip_id`…) have no indexes yet. On real data, you'd add one for each FK you join on or delete through.

  - kind: try
    title: Your turn to index a foreign key
    body: |
      Add an index named **trips_traveler_id_idx** on the foreign key `trips.traveler_id`, and a **partial** index named **trips_planned_start_idx** on `trips (start_date)` covering only rows where `status = 'planned'`.
    sql: |
      SELECT indexname, indexdef
      FROM pg_indexes
      WHERE tablename = 'trips'
      ORDER BY indexname;
    expect: |
      CREATE INDEX trips_traveler_id_idx ON trips (traveler_id);
      CREATE INDEX trips_planned_start_idx ON trips (start_date) WHERE status = 'planned';

      SELECT indexname, indexdef
      FROM pg_indexes
      WHERE tablename = 'trips'
      ORDER BY indexname;

  - kind: explain
    title: GIN for jsonb and arrays
    body: |
      A B-tree indexes **whole values**. To search **inside** values (a key in a jsonb document, an item in an array), use a **GIN** index (Generalized Inverted Index). It's like a book index listing every word:

      ```sql
      CREATE INDEX attractions_details_idx ON attractions USING gin (details);
      CREATE INDEX guides_languages_idx    ON guides      USING gin (languages);
      ```

      These speed up `@>`, `?`, `?|`, `?&` on jsonb (Module 28) and `@>`, `&&` on arrays (Module 29). GIN indexes are slower to update than B-trees, so again: only where you search.

  - kind: explain
    title: CREATE INDEX CONCURRENTLY
    body: |
      A plain `CREATE INDEX` **blocks all writes** to the table until it finishes. On a big, busy table, that can mean minutes of failed checkouts.

      ```sql
      CREATE INDEX CONCURRENTLY bookings_traveler_idx ON bookings (traveler_id);
      ```

      `CONCURRENTLY` builds the index while inserts, updates and deletes keep working. The trade-offs:

      - It's slower, and scans the table twice.
      - It **can't run inside a transaction block** (no BEGIN around it).
      - If it fails partway, it leaves an **INVALID** index behind. Drop it and try again.

      **On production tables, always use CONCURRENTLY** (Module 41).

  - kind: info
    title: "🔹 GiST, BRIN and hash"
    body: |
      Other index types for special jobs:

      - **GiST**: for geometric data, ranges and "overlaps" questions. It powers exclusion constraints (Module 40) and PostGIS maps.
      - **BRIN**: tiny indexes for **huge** tables where values follow the physical order, like an append-only log sorted by time. It stores just "this block of pages holds dates from X to Y".
      - **Hash**: equality (`=`) only. Rarely better than a B-tree.

  - kind: why
    body: |
      The difference between a 3-second page and a 3-millisecond page is very often one missing index. And the difference between fast writes and slow ones is often ten indexes nobody needed. Knowing which to build is one of the most valuable practical database skills.

  - kind: recap
    body: |
      - An index lets PostgreSQL jump to matching rows instead of scanning the whole table.
      - B-tree (default): `=`, ranges, ORDER BY, prefix LIKE. PKs and UNIQUE get one automatically.
      - Indexes cost writes, space and memory. Index what you filter, join and sort on.
      - Multi-column: `=` columns first, range or sort column last. `(a, b)` rarely helps `WHERE b = …` alone.
      - Unique, partial (`WHERE …`) and expression (`lower(email)`) indexes. Queries must match the expression.
      - Index your foreign key columns.
      - GIN for jsonb and arrays (`@>`, `?`, `&&`).
      - `CREATE INDEX CONCURRENTLY` on live tables: no BEGIN, check for INVALID leftovers.
      - 🔹 GiST (ranges, geometry), BRIN (huge ordered tables), hash (rare).
