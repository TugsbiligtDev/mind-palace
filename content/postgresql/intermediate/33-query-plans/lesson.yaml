steps:
  - kind: explain
    title: How will PostgreSQL run this?
    body: |
      SQL says **what** you want (Module 1). The **planner** decides **how**: which index, which join method, in which order. When a query is slow, you look at its **plan**.

      - **`EXPLAIN query`** shows the plan with **estimates**. It doesn't run the query.
      - **`EXPLAIN ANALYZE query`** **runs** the query and shows the plan with **actual** times and row counts.

      ⚠️ `EXPLAIN ANALYZE` really executes the statement. For an UPDATE or DELETE, wrap it: `BEGIN; EXPLAIN ANALYZE DELETE …; ROLLBACK;`.

  - kind: try
    title: Your first plan
    body: |
      Run it. The plan is a small tree. Here, it's a single step: read the orders table from start to end (*Seq Scan*), keeping rows that match the *Filter*.
    sql: |
      EXPLAIN SELECT * FROM orders WHERE status = 'pending';

  - kind: explain
    title: Reading a plan
    body: |
      ```text
      Hash Join  (cost=185.95..978.70 rows=39419 width=9)
        Hash Cond: (o.customer_id = c.customer_id)
        ->  Seq Scan on orders o  (cost=0.00..689.19 rows=39419 width=8)
        ->  Hash  (cost=123.20..123.20 rows=5020 width=9)
              ->  Seq Scan on customers c  (cost=0.00..123.20 rows=5020 width=9)
      ```

      That's the plan for `SELECT o.order_id, c.first_name FROM orders o JOIN customers c ON c.customer_id = o.customer_id`.

      - It's a **tree**. Each `->` is a step feeding the one above it. Read from the **most indented** lines up: scan customers, build a hash, scan orders, join.
      - **`cost=start..total`**: the planner's estimate of effort, in made-up units. Useful for comparing plans, not as seconds.
      - **`rows`**: how many rows the planner **expects** that step to produce.
      - **`width`**: the average row size in bytes.

      With `ANALYZE` you also get **`actual time=…`** (in milliseconds), **actual `rows`**, and **`loops`** (how many times the step ran).

  - kind: explain
    title: Scan types
    body: |
      | Scan | What it does | Usually means |
      |---|---|---|
      | **Seq Scan** | reads the whole table | small table, no useful index, or most rows are needed |
      | **Index Scan** | walks the index, then fetches each matching row | few matching rows |
      | **Index Only Scan** | answers from the index alone, never touching the table | every needed column is in the index |
      | **Bitmap Index Scan + Bitmap Heap Scan** | collects matching locations from the index, then reads those pages in order | a medium number of rows, or combining two indexes |

      A Seq Scan isn't automatically bad. Reading a small table start to finish is often the fastest option. It's bad when a big table is scanned to find a handful of rows.

  - kind: explain
    title: Join methods
    body: |
      | Join | How | Good when |
      |---|---|---|
      | **Nested Loop** | for each row on one side, look up matches on the other | one side is small, and the other has an index |
      | **Hash Join** | build a hash table from one side, probe it with the other | larger unsorted inputs, equality joins |
      | **Merge Join** | walk two inputs already sorted on the join key, side by side | both sides sorted (for example by indexes) |

      You don't choose. The planner does, based on its row estimates. That's why estimates matter so much.

  - kind: explain
    title: Estimated vs. actual rows
    body: |
      The join plan above guessed **39,419** orders, exactly right. That's because the planner estimates from **statistics** that `ANALYZE` collects (autovacuum usually runs it for you, Module 43), and the bookstore's tables were analyzed after they were loaded.

      A brand-new table has **no** statistics yet, so the planner has to guess.

      When estimates and actual rows are **far apart** (10× or more), the planner may choose the wrong join or scan. The first fix is always the same: **`ANALYZE table_name;`** to refresh the statistics. Module 42 covers harder cases.

  - kind: try
    title: Fix a bad estimate
    body: |
      A fresh copy of the orders table, never analyzed. How many pending orders are there? Run it: the planner guesses **161**. The real answer is 514.

      Then add `ANALYZE orders_copy;` before the EXPLAIN and run again: now it expects 536, close to reality.
    sql: |
      CREATE TABLE orders_copy AS SELECT * FROM orders;

      EXPLAIN SELECT * FROM orders_copy WHERE status = 'pending';

  - kind: explain
    title: Buffers
    body: |
      Since PostgreSQL 18, `EXPLAIN ANALYZE` also shows **buffers** by default: how many 8 kB **pages** each step touched.

      ```text
      Buffers: shared hit=40 read=2
      ```

      - **hit**: pages found in PostgreSQL's memory cache (fast)
      - **read**: pages fetched from disk or the OS cache (slower)

      Fewer pages touched = less work. Buffers are often a better signal than time, because times vary with how busy the machine is.

  - kind: explain
    title: "Slow pattern 1: a function on an indexed column"
    body: |
      An index on `ordered_at` stores moments, not years and months. So

      ```sql
      WHERE EXTRACT(YEAR FROM ordered_at) = 2025
        AND EXTRACT(MONTH FROM ordered_at) = 3            -- can't use the index
      ```

      makes PostgreSQL compute the year and month for **every row**. Rewrite the condition so the column stands alone, as a range:

      ```sql
      WHERE ordered_at >= '2025-03-01' AND ordered_at < '2025-04-01'   -- uses the index
      ```

      The same goes for `lower(email) = …` (use an expression index, Module 32), `amount + 0 > 10`, and casts like `created_at::date = …`.

  - kind: try
    title: See the rewrite win
    body: |
      Same answer (902 orders in March 2025), two plans. Run it: the first scans all 39,419 orders, the second uses the index on `ordered_at`. Compare the Execution Times and the Buffers.

      Look at the first plan's `rows=1` estimate too: the planner can't guess what a function will return, so its estimate is badly wrong (902 actual).
    sql: |
      CREATE INDEX ON orders (ordered_at);

      EXPLAIN ANALYZE SELECT count(*) FROM orders
      WHERE EXTRACT(YEAR FROM ordered_at) = 2025 AND EXTRACT(MONTH FROM ordered_at) = 3;

      EXPLAIN ANALYZE SELECT count(*) FROM orders
      WHERE ordered_at >= '2025-03-01' AND ordered_at < '2025-04-01';

  - kind: explain
    title: "Slow patterns 2 and 3: wildcards and N+1"
    body: |
      **Leading-wildcard LIKE.** `WHERE title LIKE '%river%'` can't use a B-tree (Module 26). The fix is a trigram index (Module 46).

      **N+1 queries.** An app loads 50 orders with one query, then runs **one more query per order** to get its customer: 1 + 50 = 51 round trips to the database. Each is fast, but together they're slow, and the plan of any single query looks fine. The fix: get everything in **one** query with a JOIN, or with `WHERE customer_id IN (…)`. You'll see where this comes from (ORMs) in Module 38.

  - kind: explain
    title: "Slow pattern 4: deep OFFSET"
    body: |
      Page 1,500 of the order history, 20 per page:

      ```sql
      SELECT … ORDER BY order_id LIMIT 20 OFFSET 30000;
      ```

      PostgreSQL has to produce **30,020 rows** and throw away the first 30,000. Every later page is slower than the one before.

      **Keyset pagination** remembers where the last page **ended** and asks for what comes **after** it:

      ```sql
      SELECT … WHERE order_id > 30000   -- last id seen on the previous page
      ORDER BY order_id
      LIMIT 20;
      ```

      With an index on `order_id` (the primary key has one), it jumps straight there. Page 1,500 is as fast as page 1. The trade-off: you can go "next" and "previous", but not jump to "page 1,500" directly.

  - kind: try
    title: Your turn for keyset pagination
    body: |
      The starter pages with OFFSET (and is off by one, a classic OFFSET bug). Rewrite it with **keyset pagination**: the previous page ended at `order_id` **30000**. Return the next **5** `order_id`s. Then add `EXPLAIN ANALYZE` in front of both versions and compare.
    sql: |
      SELECT order_id FROM orders
      ORDER BY order_id
      LIMIT 5 OFFSET 30001;
    expect: |
      SELECT order_id FROM orders
      WHERE order_id > 30000
      ORDER BY order_id
      LIMIT 5;
    ordered: true

  - kind: why
    body: |
      "It's slow" is the most common database complaint. EXPLAIN turns guessing into looking: you can see exactly where the time goes, whether an index is used, and whether the planner's picture of your data is wrong. Nearly every performance fix starts here.

  - kind: recap
    body: |
      - `EXPLAIN` = the plan with estimates. `EXPLAIN ANALYZE` = runs it, with actual times and rows (wrap writes in BEGIN … ROLLBACK).
      - Read the tree from the most indented lines up. `cost` is relative, `rows` is the estimate, `actual` is reality.
      - Scans: Seq, Index, Index Only, Bitmap. Joins: Nested Loop, Hash, Merge.
      - Estimates far from actual rows → run `ANALYZE`.
      - Buffers: `hit` = memory, `read` = disk. Fewer pages = less work.
      - Slow patterns: functions on indexed columns (rewrite as a range), leading-wildcard LIKE, N+1 queries (one JOIN instead), deep OFFSET (use keyset pagination).
