steps:
  - kind: explain
    title: Your own functions
    body: |
      You've used built-in functions like `round()` and `date_trunc()`. You can write your own, stored in the database and callable from any query:

      ```sql
      CREATE FUNCTION order_total(p_order_id integer)
      RETURNS numeric
      LANGUAGE sql
      STABLE
      AS $$
          SELECT sum(quantity * unit_price)
          FROM order_items
          WHERE order_id = p_order_id;
      $$;

      SELECT order_id, order_total(order_id)
      FROM orders
      WHERE customer_id = 40;
      ```

      Diego (customer 40) has 23 orders. The first three, by `order_id`:

      | order_id | order_total |
      |---|---|
      | 2111 | 26.99 |
      | 2158 | 20.99 |
      | 6516 | 29.99 |

      The function ran once per row, adding up that order's lines.

      <!-- page -->

      - The **parameters** go in parentheses with their types. A `p_` prefix keeps them from being confused with column names.
      - **`RETURNS`** says what comes back.
      - **`$$ … $$`** wraps the body. It's just a way of quoting text that contains its own quotes and semicolons.
      - **`LANGUAGE sql`** means the body is a plain SQL query, and the last statement's result is returned.

  - kind: try
    title: Create and call a function
    body: |
      Diego's orders with their totals. Run it. Then use the function in the WHERE too: add `AND order_total(order_id) > 40`.

      (The step is checked once your changed version has run.)
    sql: |
      CREATE FUNCTION order_total(p_order_id integer)
      RETURNS numeric
      LANGUAGE sql
      STABLE
      AS $$
          SELECT sum(quantity * unit_price)
          FROM order_items
          WHERE order_id = p_order_id;
      $$;

      SELECT order_id, order_total(order_id) AS total
      FROM orders
      WHERE customer_id = 40;
    expect: |
      CREATE FUNCTION order_total(p_order_id integer)
      RETURNS numeric
      LANGUAGE sql
      STABLE
      AS $$
          SELECT sum(quantity * unit_price) FROM order_items WHERE order_id = p_order_id;
      $$;

      SELECT order_id, order_total(order_id) AS total
      FROM orders
      WHERE customer_id = 40
        AND order_total(order_id) > 40;

  - kind: try
    title: Your turn to write a SQL function
    body: |
      Write a function **with_tax(p_price numeric)** that returns the price plus 10% tax, rounded to 2 decimals. Mark it `IMMUTABLE` (explained below). Then return each book's `title` and `with_tax(price)` labeled **price_with_tax**.
    sql: |
      SELECT title, price
      FROM books;
    expect: |
      CREATE FUNCTION with_tax(p_price numeric)
      RETURNS numeric
      LANGUAGE sql
      IMMUTABLE
      AS $$
          SELECT round(p_price * 1.10, 2);
      $$;

      SELECT title, with_tax(price) AS price_with_tax
      FROM books;

  - kind: explain
    title: "PL/pgSQL: logic with steps"
    body: |
      For decisions and steps, use **PL/pgSQL**, PostgreSQL's built-in programming language:

      ```sql
      CREATE FUNCTION discount(p_amount numeric)
      RETURNS numeric
      LANGUAGE plpgsql
      IMMUTABLE
      AS $$
      DECLARE
          v_rate numeric := 0;            -- a variable, with a starting value
      BEGIN
          IF p_amount IS NULL OR p_amount < 0 THEN
              RAISE EXCEPTION 'amount must be zero or more, got %', p_amount;
          ELSIF p_amount >= 1000 THEN
              v_rate := 0.10;
          ELSIF p_amount >= 500 THEN
              v_rate := 0.05;
          END IF;
          RETURN round(p_amount * (1 - v_rate), 2);
      END;
      $$;
      ```

      - **`DECLARE`** lists variables, and **`:=`** assigns them.
      - **`IF … ELSIF … ELSE … END IF;`** makes decisions. Every statement ends with `;`.
      - **`RAISE EXCEPTION`** stops with an error. `%` is replaced by the next value. (**`RAISE NOTICE`** just prints a message: psql shows it, this page doesn't.)
      - **`RETURN`** gives back the result.

  - kind: try
    title: Run the discount function
    body: |
      Run it: 1200 gets 10% off, 600 gets 5%, 100 gets nothing. Then add `discount(-5)` and read your own error message.
    sql: |
      CREATE FUNCTION discount(p_amount numeric)
      RETURNS numeric
      LANGUAGE plpgsql
      IMMUTABLE
      AS $$
      DECLARE
          v_rate numeric := 0;
      BEGIN
          IF p_amount IS NULL OR p_amount < 0 THEN
              RAISE EXCEPTION 'amount must be zero or more, got %', p_amount;
          ELSIF p_amount >= 1000 THEN
              v_rate := 0.10;
          ELSIF p_amount >= 500 THEN
              v_rate := 0.05;
          END IF;
          RETURN round(p_amount * (1 - v_rate), 2);
      END;
      $$;

      SELECT discount(1200) AS big,
             discount(600) AS medium,
             discount(100) AS small;

  - kind: try
    title: Your turn with PL/pgSQL
    body: |
      Write a PL/pgSQL function **length_label(p_pages integer)** that returns text:

      - `'short'` for 250 pages or fewer
      - `'medium'` for 251 to 500 pages
      - `'long'` for more than 500

      Then return each book's `title`, `pages` and `length_label(pages)` labeled **label**.
    sql: |
      SELECT title, pages
      FROM books;
    expect: |
      CREATE FUNCTION length_label(p_pages integer)
      RETURNS text
      LANGUAGE plpgsql
      IMMUTABLE
      AS $$
      BEGIN
          IF p_pages <= 250 THEN
              RETURN 'short';
          ELSIF p_pages <= 500 THEN
              RETURN 'medium';
          ELSE
              RETURN 'long';
          END IF;
      END;
      $$;

      SELECT title, pages, length_label(pages) AS label
      FROM books;

  - kind: explain
    title: Loops
    body: |
      PL/pgSQL can loop over numbers or over query results:

      ```sql
      FOR i IN 1..5 LOOP
          -- runs 5 times
      END LOOP;

      FOR r IN SELECT order_id, status FROM orders LOOP
          -- r.order_id, r.status available here
      END LOOP;
      ```

      But **think in sets first**. One `UPDATE … WHERE` is far faster than a loop that updates one row at a time. Loops are for step-by-step work that truly can't be one statement, like processing in batches.

      <!-- page -->

      A number loop, counting down (`REVERSE` counts backwards):

      ```sql
      CREATE FUNCTION countdown(p_from integer)
      RETURNS text
      LANGUAGE plpgsql
      IMMUTABLE
      AS $$
      DECLARE
          v_text text := '';
      BEGIN
          FOR i IN REVERSE p_from..1 LOOP
              v_text := v_text || i || '... ';
          END LOOP;
          RETURN v_text || 'liftoff!';
      END;
      $$;

      SELECT countdown(5);
      ```

      | countdown |
      |---|
      | 5... 4... 3... 2... 1... liftoff! |

      A loop over a query's rows. Each row arrives in the record variable `r`:

      ```sql
      CREATE FUNCTION status_report()
      RETURNS text
      LANGUAGE plpgsql
      STABLE
      AS $$
      DECLARE
          r       record;
          v_text  text := '';
      BEGIN
          FOR r IN SELECT status, count(*) AS n FROM orders GROUP BY status ORDER BY status LOOP
              v_text := v_text || r.status || ': ' || r.n || '; ';
          END LOOP;
          RETURN v_text;
      END;
      $$;

      SELECT status_report();
      ```

      | status_report |
      |---|
      | cancelled: 2291; delivered: 34911; paid: 557; pending: 514; shipped: 1146; |

  - kind: try
    title: "Try it: loops"
    body: |
      Both functions from before. Run them and compare with the tables you just saw.

      Then play: call `countdown(10)`, or drop the word `REVERSE` and change `p_from..1` to `1..p_from` to count up. In `status_report`, swap `orders` for `payments` and `status` for `method`.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      CREATE FUNCTION countdown(p_from integer)
      RETURNS text
      LANGUAGE plpgsql
      IMMUTABLE
      AS $$
      DECLARE
          v_text text := '';
      BEGIN
          FOR i IN REVERSE p_from..1 LOOP
              v_text := v_text || i || '... ';
          END LOOP;
          RETURN v_text || 'liftoff!';
      END;
      $$;

      SELECT countdown(5);

      CREATE FUNCTION status_report()
      RETURNS text
      LANGUAGE plpgsql
      STABLE
      AS $$
      DECLARE
          r       record;
          v_text  text := '';
      BEGIN
          FOR r IN SELECT status, count(*) AS n FROM orders GROUP BY status ORDER BY status LOOP
              v_text := v_text || r.status || ': ' || r.n || '; ';
          END LOOP;
          RETURN v_text;
      END;
      $$;

      SELECT status_report();

  - kind: explain
    title: Procedures
    body: |
      A **procedure** is like a function, with two differences:

      | | Function | Procedure |
      |---|---|---|
      | Called with | `SELECT f(…)`, inside any query | `CALL p(…)`, on its own |
      | Returns a value | yes | no (it just does work) |
      | Can `COMMIT` / `ROLLBACK` inside | **no** | **yes** |

      The last point is why procedures exist. A nightly job that archives a million rows can **commit every 10,000**, so a failure halfway doesn't undo everything, and locks are released as it goes (Module 30).

      ```sql
      CREATE PROCEDURE archive_old_payments(p_cutoff timestamptz)
      LANGUAGE plpgsql
      AS $$ … COMMIT; … $$;

      CALL archive_old_payments('2026-01-01');
      ```

  - kind: try
    title: A batch job with CALL
    body: |
      This procedure copies payments older than the cutoff into an archive, committing after every 2 rows. Run it: the 9 payments from January 2023, Inkwell's first month, are archived.
    sql: |
      CREATE TABLE payments_archive (LIKE payments);

      CREATE PROCEDURE archive_old_payments(p_cutoff timestamptz)
      LANGUAGE plpgsql
      AS $$
      DECLARE
          r       record;
          v_count integer := 0;
      BEGIN
          FOR r IN SELECT payment_id FROM payments
                   WHERE paid_at < p_cutoff ORDER BY payment_id LOOP
              INSERT INTO payments_archive
              SELECT *
              FROM payments
              WHERE payment_id = r.payment_id;
              v_count := v_count + 1;
              IF v_count % 2 = 0 THEN
                  COMMIT;             -- a procedure may commit as it goes
              END IF;
          END LOOP;
      END;
      $$;

      CALL archive_old_payments('2023-02-01');
      SELECT payment_id, paid_at FROM payments_archive;

  - kind: explain
    title: "Volatility: IMMUTABLE, STABLE, VOLATILE"
    body: |
      Every function has a **volatility label** that tells the planner how predictable it is:

      | Label | Promise | Examples |
      |---|---|---|
      | **IMMUTABLE** | same inputs → same output, **forever**. Reads no tables. | `with_tax`, `discount`, maths |
      | **STABLE** | same output **within one statement**. May read tables or the time zone. | `order_total`, anything using `now()` |
      | **VOLATILE** (the default) | may change every call, or changes data | `random()`, anything that INSERTs |

      Why it matters:

      - Only **IMMUTABLE** functions can be used in **expression indexes** and generated columns.
      - The planner can call STABLE and IMMUTABLE functions fewer times, which is faster.
      - **Lying is dangerous.** Label a function that reads a table IMMUTABLE, and an index built on it silently returns wrong answers when the table changes. When unsure, leave the default.

  - kind: try
    title: "Try it: volatility and indexes"
    body: |
      A PL/pgSQL version of `with_tax` with **no** label, so it's VOLATILE. Run it: the index is refused with *functions in index expression must be marked IMMUTABLE*.

      Then add the line `IMMUTABLE` under `LANGUAGE plpgsql` and run again: the index is built. (That label is honest here: the function only does maths.)

      To continue, make it run without an error: the change above does it.
    sql: |
      CREATE FUNCTION with_tax(p_price numeric)
      RETURNS numeric
      LANGUAGE plpgsql
      AS $$
      BEGIN
          RETURN round(p_price * 1.10, 2);
      END;
      $$;

      CREATE INDEX books_with_tax_idx ON books (with_tax(price));
    broken_starter: true

  - kind: explain
    title: Database logic or app logic?
    body: |
      There's no single right answer, but good rules of thumb:

      **Put it in the database when:**

      - it protects **data correctness** for every app (constraints first, then functions and triggers)
      - it works on **lots of rows** and would be slow to ship to the app and back
      - several apps or languages need **exactly the same** rule

      **Keep it in the app when:**

      - it's **business workflow** that changes often (emails, payments, user interfaces)
      - it calls **other services**
      - the team's tools (tests, reviews, deploys) mostly live in the app code

      Too much logic hidden in the database is hard to test and easy to forget. Too little leaves every app re-inventing (and disagreeing on) the rules.

  - kind: try
    title: "Find the bug: nothing is ever long"
    body: |
      This `length_label` function should say `short` (250 pages or fewer), `medium` (251 to 500) or `long` (more than 500). But no book is ever labeled `long`. Fix the function. Keep the final SELECT.
    sql: |
      CREATE FUNCTION length_label(p_pages integer)
      RETURNS text
      LANGUAGE plpgsql
      IMMUTABLE
      AS $$
      BEGIN
          IF p_pages > 250 THEN
              RETURN 'medium';
          ELSIF p_pages > 500 THEN
              RETURN 'long';
          END IF;
          RETURN 'short';
      END;
      $$;

      SELECT title, pages, length_label(pages) AS label FROM books;
    expect: |
      CREATE FUNCTION length_label(p_pages integer)
      RETURNS text
      LANGUAGE plpgsql
      IMMUTABLE
      AS $$
      BEGIN
          IF p_pages > 500 THEN
              RETURN 'long';
          ELSIF p_pages > 250 THEN
              RETURN 'medium';
          END IF;
          RETURN 'short';
      END;
      $$;

      SELECT title, pages, length_label(pages) AS label FROM books;
    hint: |
      IF / ELSIF stops at the first true condition. A 600-page book is also more than 250.

  - kind: why
    body: |
      Functions let you name a calculation once and reuse it everywhere, and procedures run safe batch jobs right next to the data. Used with judgment, they keep rules consistent across every app that touches the database.

  - kind: recap
    body: |
      - `CREATE FUNCTION name(p_arg type) RETURNS type LANGUAGE sql|plpgsql AS $$ … $$;`, then call it in any query.
      - PL/pgSQL: `DECLARE` variables, `:=`, `IF/ELSIF/ELSE`, `FOR … LOOP`, `RAISE EXCEPTION`/`NOTICE`, `RETURN`. Think in sets before loops.
      - `CREATE PROCEDURE` + `CALL`: returns nothing, but can `COMMIT` inside, which suits batch jobs.
      - Volatility: IMMUTABLE (pure), STABLE (same within a statement), VOLATILE (default). Never over-promise.
      - Put data-correctness and heavy set work in the database. Keep changeable workflow in the app.
