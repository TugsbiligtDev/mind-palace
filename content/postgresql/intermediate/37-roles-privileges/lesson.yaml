steps:
  - kind: explain
    title: Who is allowed to do what?
    body: |
      So far you've been a **superuser**, allowed to do anything. Real databases have many users: the web app, a reporting tool, analysts, admins. Each should be able to do **only what it needs**.

      PostgreSQL controls this with **roles**. A role can be:

      - a **user**: a role with the **`LOGIN`** attribute, so it can connect
      - a **group**: a role without LOGIN, holding privileges that other roles inherit

      ```sql
      CREATE ROLE readonly NOLOGIN;                    -- a group
      CREATE ROLE alice LOGIN PASSWORD 'change-me';    -- a user
      GRANT readonly TO alice;                         -- alice gets readonly's privileges
      ```

      `CREATE USER alice` is the same as `CREATE ROLE alice LOGIN`.

  - kind: try
    title: Make some roles
    body: |
      Run it. `\du` lists the roles: `alice` can log in, and `readonly` can't.
    sql: |
      CREATE ROLE readonly NOLOGIN;
      CREATE ROLE alice LOGIN PASSWORD 'change-me';
      GRANT readonly TO alice;
      \du

  - kind: explain
    title: GRANT and REVOKE
    body: |
      Privileges are given with **GRANT** and taken back with **REVOKE**, at several levels. A role needs **every** level to reach the data:

      | Level | Privileges | Example |
      |---|---|---|
      | Database | `CONNECT`, `CREATE` | `GRANT CONNECT ON DATABASE bookstore TO readonly;` |
      | Schema | `USAGE` (may look inside), `CREATE` (may add objects) | `GRANT USAGE ON SCHEMA public TO readonly;` |
      | Table | `SELECT`, `INSERT`, `UPDATE`, `DELETE`, `TRUNCATE`… | `GRANT SELECT ON orders TO readonly;` |
      | Column | `SELECT (col, …)`, `UPDATE (col, …)` | `GRANT SELECT (first_name, last_name) ON customers TO support;` |

      Shortcuts: `GRANT SELECT ON ALL TABLES IN SCHEMA public TO readonly;` and `REVOKE INSERT ON orders FROM app;`.

      The **owner** of a table (whoever created it) always has full rights on it.

  - kind: try
    title: Allowed here, denied there
    body: |
      `SET ROLE` lets a superuser act as another role, which is perfect for testing access. The reader may see genres but nothing else. Run it: the first query works, the second is denied.
    sql: |
      CREATE ROLE reader NOLOGIN;
      GRANT SELECT ON genres TO reader;

      SET ROLE reader;
      SELECT name FROM genres;
      SELECT order_id FROM orders;
    expect_error: true

  - kind: explain
    title: REVOKE, and checking privileges
    body: |
      `has_table_privilege(role, table, privilege)` answers *"may this role do this?"* with true or false, without switching roles. Give an `app` role four privileges, then take one back:

      ```sql
      CREATE ROLE app NOLOGIN;
      GRANT SELECT, INSERT, UPDATE, DELETE ON orders TO app;
      REVOKE DELETE ON orders FROM app;

      SELECT has_table_privilege('app', 'orders', 'INSERT') AS can_insert,
             has_table_privilege('app', 'orders', 'DELETE') AS can_delete;
      ```

      | can_insert | can_delete |
      |---|---|
      | t | f |

      The app can still add orders, but can no longer delete them.

  - kind: try
    title: "Try it: GRANT, REVOKE and group roles"
    body: |
      The first part is the REVOKE example. The second shows **inheritance**: `alice` was never granted anything directly, but she's a member of `readonly`, so she can read genres. Books were never granted to anyone, so the last query is denied.

      Then add `GRANT SELECT ON books TO readonly;` before `SET ROLE alice;` and run again: now alice can count the books too. (Deleting the `REVOKE` line turns `can_delete` true.)

      To continue, make it run without an error: the change above does it.
    sql: |
      CREATE ROLE app NOLOGIN;
      GRANT SELECT, INSERT, UPDATE, DELETE ON orders TO app;
      REVOKE DELETE ON orders FROM app;

      SELECT has_table_privilege('app', 'orders', 'INSERT') AS can_insert,
             
             has_table_privilege('app', 'orders', 'DELETE') AS can_delete;

      CREATE ROLE readonly NOLOGIN;
      GRANT SELECT ON genres TO readonly;
      CREATE ROLE alice LOGIN PASSWORD 'change-me';
      GRANT readonly TO alice;

      SET ROLE alice;
      SELECT name FROM genres ORDER BY name;
      SELECT count(*) FROM books;
    broken_starter: true

  - kind: explain
    title: Least privilege, and three roles
    body: |
      **Least privilege**: give each role the smallest set of rights that lets it do its job. If the app is hacked, the attacker gets only what the app had.

      A common setup:

      | Role | Can | Used by |
      |---|---|---|
      | **owner / admin** | own the tables, run migrations (CREATE, ALTER, DROP) | deploy scripts, a DBA |
      | **app** | SELECT, INSERT, UPDATE, DELETE on its tables. No DDL. | the web app |
      | **readonly** | SELECT only | analysts, dashboards |

      Grant privileges to **group roles**, then add people to groups. When Alice leaves, you drop one login role, not dozens of individual grants.

  - kind: try
    title: Your turn to set up an analyst role
    body: |
      Create a group role **analyst** (no login), give it **read access to every table in the public schema**, then switch to it with `SET ROLE` and count the payments.
    sql: |
      SELECT count(*) FROM payments;
    expect: |
      CREATE ROLE analyst NOLOGIN;
      GRANT SELECT ON ALL TABLES IN SCHEMA public TO analyst;

      SET ROLE analyst;
      SELECT count(*) FROM payments;
    state_query: |
      SELECT (SELECT rolcanlogin FROM pg_roles WHERE rolname = 'analyst') AS can_login,
             has_table_privilege('analyst', 'payments', 'SELECT') AS reads_payments,
             has_table_privilege('analyst', 'books', 'SELECT') AS reads_books,
             has_table_privilege('analyst', 'books', 'UPDATE') AS updates_books;

  - kind: explain
    title: Default privileges for future tables
    body: |
      `GRANT … ON ALL TABLES IN SCHEMA public` covers the tables that exist **right now**. Create a new table tomorrow, and the analyst can't read it.

      **`ALTER DEFAULT PRIVILEGES`** sets the grants for tables **created later**:

      ```sql
      ALTER DEFAULT PRIVILEGES IN SCHEMA public
          GRANT SELECT ON TABLES TO analyst;
      ```

      It applies to tables created afterwards **by the role that ran it** (add `FOR ROLE owner_name` to cover another creator). Most setups run both: a GRANT for existing tables, and default privileges for future ones.

  - kind: try
    title: Tomorrow's table
    body: |
      The analyst was granted SELECT on all tables, then a **new** table was created. Run it: denied. Then add `ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO analyst;` **before** the CREATE TABLE and run again.

      (The step is checked once your changed version runs without the error.)
    sql: |
      CREATE ROLE analyst NOLOGIN;
      GRANT SELECT ON ALL TABLES IN SCHEMA public TO analyst;

      CREATE TABLE refunds_2027 (payment_id integer, reason text);

      SET ROLE analyst;
      SELECT count(*) FROM refunds_2027;
    expect_error: true
    broken_starter: true
    expect: |
      CREATE ROLE analyst NOLOGIN;
      GRANT SELECT ON ALL TABLES IN SCHEMA public TO analyst;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO analyst;

      CREATE TABLE refunds_2027 (payment_id integer, reason text);

      SET ROLE analyst;
      SELECT count(*) FROM refunds_2027;

  - kind: explain
    title: Column-level access and views
    body: |
      The support team needs customers' names and cities, but **not** their emails. Two ways:

      - **Column privileges**: `GRANT SELECT (first_name, last_name, city) ON customers TO support;`. Selecting any other column (or `*`) is denied.
      - **A view** (Module 34) showing only the allowed columns or rows, with `GRANT SELECT` on the view instead of the table.

      For hiding **rows** per user (each customer sees only their own), PostgreSQL has **Row-Level Security** (`ALTER TABLE ... ENABLE ROW LEVEL SECURITY` plus `CREATE POLICY`). Look it up when you need it.

  - kind: try
    title: Names yes, emails no
    body: |
      Run it: the allowed columns come back, then the email query is denied.
    sql: |
      CREATE ROLE support NOLOGIN;
      GRANT SELECT (first_name, last_name, city) ON customers TO support;

      SET ROLE support;
      SELECT first_name, last_name, city FROM customers LIMIT 5;
      SELECT email FROM customers;
    expect_error: true

  - kind: try
    title: "Try it: access through a view"
    body: |
      The second way. `support` gets SELECT on a **view** with two columns, and nothing on the table. Run it: the view works, and reading the same columns straight from `customers` is denied.

      Then delete the last query and add `WHERE city = 'London'` to the view: support now sees only London customers. That's hiding rows, too.

      To continue, make it run without an error: the change above does it.
    sql: |
      CREATE VIEW customer_cities AS
      SELECT first_name, city FROM customers;

      CREATE ROLE support NOLOGIN;
      GRANT SELECT ON customer_cities TO support;

      SET ROLE support;
      SELECT * FROM customer_cities LIMIT 3;
      SELECT first_name, city FROM customers LIMIT 3;
    broken_starter: true

  - kind: explain
    title: The public schema (tightened in PostgreSQL 15)
    body: |
      Every database has a special role-like group called **`PUBLIC`**, meaning *everyone*.

      - **Before PostgreSQL 15**, `PUBLIC` could **create** tables in the `public` schema. Any user who could connect could create objects there, which was a well-known security hole.
      - **Since PostgreSQL 15**, only the database owner can create in `public`. Other roles can use it (read what they're granted), but not add to it.

      On older servers you'll see this line in setup scripts, and it's still good practice:

      ```sql
      REVOKE CREATE ON SCHEMA public FROM PUBLIC;
      ```

  - kind: mac
    title: A real login role on your Mac
    body: |
      Create a read-only login role, then connect **as** it in a new psql session and test what it can and can't do. `-U` picks the user. The last command connects back as yourself to clean up.

      **Checkpoint:** paste the output of the `reporter` session (the count, and the DELETE's error) into the box below.
    commands: |
      psql bookstore
      CREATE ROLE reporter LOGIN PASSWORD 'change-me';
      GRANT SELECT ON ALL TABLES IN SCHEMA public TO reporter;
      \q
      psql -U reporter -d bookstore
      SELECT count(*) FROM orders;
      DELETE FROM orders;
      \q
      psql bookstore -c "DROP OWNED BY reporter; DROP ROLE reporter;"
    expect_output:
      - "permission denied for table orders"

  - kind: try
    title: "Find the bug: permission denied, again"
    body: |
      The reports team keeps its tables in a separate **reports** schema. The role `report_reader` was granted SELECT on the table, but reading it is still denied. Run it, read the error, and fix the grants.
    sql: |
      CREATE SCHEMA reports;
      CREATE TABLE reports.daily (day date, revenue numeric);
      INSERT INTO reports.daily VALUES ('2026-06-30', 1234.50);

      CREATE ROLE report_reader NOLOGIN;
      GRANT SELECT ON reports.daily TO report_reader;

      SET ROLE report_reader;
      SELECT * FROM reports.daily;
    broken_starter: true
    expect: |
      CREATE SCHEMA reports;
      CREATE TABLE reports.daily (day date, revenue numeric);
      INSERT INTO reports.daily VALUES ('2026-06-30', 1234.50);

      CREATE ROLE report_reader NOLOGIN;
      GRANT USAGE ON SCHEMA reports TO report_reader;
      GRANT SELECT ON reports.daily TO report_reader;

      SET ROLE report_reader;
      SELECT * FROM reports.daily;
    hint: |
      A role needs a privilege at **every** level on the way to the data. Before a table, there's its schema.

  - kind: try
    title: "Your turn for a support role"
    body: |
      Create a role **support** (no login) that may read **only** `customer_id`, `first_name` and `city` from `customers`, and nothing else anywhere.
    sql: |
      -- Write your statements here
    expect: |
      CREATE ROLE support NOLOGIN;
      GRANT SELECT (customer_id, first_name, city) ON customers TO support;
    state_query: |
      SELECT has_column_privilege('support', 'customers', 'first_name', 'SELECT') AS first_name,
             has_column_privilege('support', 'customers', 'city', 'SELECT') AS city,
             has_column_privilege('support', 'customers', 'email', 'SELECT') AS email,
             has_table_privilege('support', 'orders', 'SELECT') AS orders,
             (SELECT rolcanlogin FROM pg_roles WHERE rolname = 'support') AS can_login;
    hint: |
      GRANT SELECT (col1, col2, …) ON table TO role grants only those columns.
    reject:
      - |
        CREATE ROLE support NOLOGIN;
        GRANT SELECT ON customers TO support;

  - kind: why
    body: |
      Most data leaks and "someone deleted production" stories come down to an account with far more access than it needed. Roles, grants and least privilege are how you make sure a bug, a stolen password or a tired human can only do limited damage.

  - kind: recap
    body: |
      - Users and groups are both **roles**. `LOGIN` makes a role a user. `GRANT group TO user` adds members.
      - `GRANT` / `REVOKE` on databases (CONNECT), schemas (USAGE, CREATE), tables (SELECT, INSERT…) and columns.
      - `SET ROLE name` lets you test access as another role.
      - **Least privilege**: separate admin, app and read-only roles. Grant to groups, not individuals.
      - `ON ALL TABLES IN SCHEMA` covers existing tables. `ALTER DEFAULT PRIVILEGES` covers future ones.
      - Hide columns with column grants or views, and rows with Row-Level Security.
      - Since PG15, only the owner can CREATE in `public`. On older versions, `REVOKE CREATE ON SCHEMA public FROM PUBLIC`.
