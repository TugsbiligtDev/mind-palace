pass: 3
questions:
  - type: mcq
    prompt: What's the difference between a "user" and a "group" in PostgreSQL?
    options:
      - They're completely different objects
      - Both are roles. A user is a role with the LOGIN attribute.
      - Groups can log in, users can't
      - Users own tables, groups don't
    answer: 1
    explanation: PostgreSQL only has roles. LOGIN lets a role connect, and any role can be granted to another, like a group.

  - type: mcq
    prompt: "You ran `GRANT SELECT ON ALL TABLES IN SCHEMA public TO analyst;` last month. Why can't the analyst read a table created yesterday?"
    options:
      - The grant expired
      - That GRANT only covered tables that existed at the time. Use ALTER DEFAULT PRIVILEGES for future tables.
      - Analysts can't read new tables
      - The table has no primary key
    answer: 1
    explanation: GRANT ON ALL TABLES is a one-time grant on existing tables. Default privileges cover tables created later.

  - type: fill
    prompt: Test your grants by acting as another role.
    code: |
      CREATE ROLE tester NOLOGIN;
      GRANT SELECT ON trips TO tester;
      SET ____ tester;
      SELECT count(*) FROM trips;
    answer: ROLE
    accept: ["role"]
    explanation: "`SET ROLE tester` makes the session act with tester's privileges, which is handy for checking what a role can do."

  - type: mcq
    prompt: Which setup follows least privilege for a web app?
    options:
      - The app connects as a superuser
      - The app owns all tables and runs migrations at startup
      - The app has SELECT, INSERT, UPDATE and DELETE on its tables, with no DDL, while migrations run as a separate owner role
      - The app uses the readonly role for everything
    answer: 2
    explanation: The app gets exactly the rights it needs day to day. Structure changes run under a separate, more powerful role.

  - type: mcq
    prompt: Support staff must see travelers' names but never their emails. Which options work?
    options:
      - Column-level GRANT SELECT (full_name, …), or a view without the email column
      - GRANT SELECT on the whole table
      - A CHECK constraint
      - An index on email
    answer: 0
    explanation: Column privileges or a view limit what's visible. A table-wide SELECT would expose emails.
