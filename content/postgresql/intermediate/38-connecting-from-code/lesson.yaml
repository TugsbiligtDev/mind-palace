steps:
  - kind: explain
    title: Apps are clients too
    body: |
      psql and pgAdmin are clients (Module 1). So is every app that uses a database: a website's backend, a Python script, a mobile app's server. They connect through a **driver**, a library that speaks PostgreSQL's network protocol, and send SQL just like you do.

      This module covers what you need to connect an app **safely**. The code itself runs on your Mac, but the SQL ideas can be tried right here.

      **Example.** The same question from three clients:

      - in psql: `SELECT count(*) FROM orders;`
      - from Python: `conn.execute("SELECT count(*) FROM orders").fetchone()`
      - from this page: the Run button

      All three send the same SQL to the server and get back the same answer, 39,419. Only the way the answer is shown differs.

  - kind: choice
    title: "Quick check: what's a driver?"
    body: "A Python app needs to talk to PostgreSQL. What does a **driver** like psycopg do?"
    options:
      - "Stores the data instead of PostgreSQL"
      - "Turns Python into SQL automatically"
      - "Makes the database run faster"
      - "Lets the code connect to the server and send SQL"
    answer: 3
    explanation: "A driver speaks PostgreSQL's network protocol for your program: it opens the connection, sends the SQL and hands back the rows. The server still stores the data and runs the query."

  - kind: explain
    title: Connection strings
    body: |
      Apps usually describe a connection in one line, a **connection string** (or *URL*):

      ```text
      postgresql://app_user:s3cret@db.example.com:5432/bookstore?sslmode=require
      └─scheme──┘ └─user─┘ └pass┘ └────host─────┘ └port┘ └─db──┘ └─options──┘
      ```

      - The same pieces as Module 2: user, password, host, port, database.
      - `?sslmode=require` asks for an **encrypted** connection. Always use it for databases over the internet.
      - Special characters in the password (`@`, `:`, `/`, `#`) must be **URL-encoded** (`@` → `%40`), or the string is misread.

  - kind: choice
    title: "Quick check: read a connection string"
    body: |
      ```text
      postgresql://report:pa%40ss@db.inkwell.example:6543/bookstore?sslmode=require
      ```

      What is the **password**?
    options:
      - "`pa@ss`"
      - "`pa%40ss`"
      - "`report`"
      - "`6543`"
    answer: 0
    explanation: "The password sits between `:` and `@`. `%40` is the URL-encoded form of `@`, so the real password is `pa@ss`. `report` is the user and `6543` the port."

  - kind: explain
    title: Drivers
    body: |
      **Python: psycopg 3**

      ```python
      import os, psycopg

      with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
          rows = conn.execute(
              "SELECT order_id, status FROM orders WHERE customer_id = %s",
              (1,),
          ).fetchall()
      ```

      **JavaScript (Node.js): node-postgres (`pg`)**

      ```javascript
      import pg from "pg";
      const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });

      const { rows } = await pool.query(
        "SELECT order_id, status FROM orders WHERE customer_id = $1",
        [1],
      );
      ```

      Notice that neither puts the value **into** the SQL text. The `%s` and `$1` are **placeholders**. That's the most important habit in this module.

  - kind: choice
    title: "Quick check: the safe line"
    body: "Which Python line sends the user's `email` **safely**?"
    options:
      - "`conn.execute(f\"SELECT * FROM customers WHERE email = '{email}'\")`"
      - "`conn.execute(\"SELECT * FROM customers WHERE email = '\" + email + \"'\")`"
      - "`conn.execute(\"SELECT * FROM customers WHERE email = %s\", (email,))`"
      - "`conn.execute(\"SELECT * FROM customers WHERE email = '%s'\" % email)`"
    answer: 2
    explanation: "Only the line ending in `, (email,))` passes the value separately, through a placeholder. The other three glue the text into the SQL, which is exactly how SQL injection happens (next page)."

  - kind: explain
    title: SQL injection
    body: |
      Suppose a login form's email box is glued straight into the SQL:

      ```python
      # NEVER do this
      sql = f"SELECT * FROM customers WHERE email = '{email_from_form}'"
      ```

      A normal visitor types `emma.johnson@example.com`. An attacker types:

      ```text
      nobody@example.com' OR '1'='1
      ```

      and the query becomes:

      ```sql
      SELECT * FROM customers WHERE email = 'nobody@example.com' OR '1'='1'
      ```

      `'1'='1'` is always true, so **every customer** comes back. With other inputs, an attacker can read any table, change data, or drop tables. This is **SQL injection**, for decades one of the most common ways websites get hacked.

  - kind: try
    title: What the attacker's query returns
    body: |
      This is exactly the SQL the careless app would build. Run it: all 5,020 customers' emails leak, for a login that should have matched nobody.
    sql: |
      SELECT first_name, last_name, email
      FROM customers
      WHERE email = 'nobody@example.com' OR '1'='1';

  - kind: explain
    title: The fix is parameterized queries
    body: |
      With a **parameterized query**, the SQL text and the values travel **separately**. PostgreSQL parses the SQL first, with a placeholder where the value goes, and then plugs the value in as **pure data**. Quotes in it are just characters. They can never change the query's structure.

      ```python
      conn.execute("SELECT * FROM customers WHERE email = %s", (email_from_form,))
      ```

      Rules:

      - **Never** build SQL with `+`, f-strings, `format()` or template strings from anything a user could influence.
      - Placeholders work for **values**, not for table or column **names**. If a name must vary, choose it from a fixed allow-list in code (or use your driver's identifier helper, like `psycopg.sql.Identifier`).
      - Escaping quotes by hand is not a fix. Let the driver do it.

      PostgreSQL's own `PREPARE` / `EXECUTE` shows the same mechanism in plain SQL. First, a normal visitor:

      ```sql
      PREPARE find_customer(text) AS
          SELECT first_name, email FROM customers WHERE email = $1;

      EXECUTE find_customer('emma.johnson@example.com');
      ```

      | first_name | email |
      |---|---|
      | Emma | emma.johnson@example.com |

      `PREPARE` saves the query under a name, with `$1` as a slot for a `text` value. Each `EXECUTE` fills the slot. `DEALLOCATE find_customer;` throws the saved query away (it also disappears when the session ends).

  - kind: try
    title: The same attack, parameterized
    body: |
      `PREPARE` stores the query with a `$1` placeholder, and `EXECUTE` passes the attacker's text as the value. Run it: **no rows**, because no email is literally `nobody@example.com' OR '1'='1`.
    sql: |
      PREPARE find_customer(text) AS
          SELECT first_name, email FROM customers WHERE email = $1;

      EXECUTE find_customer('nobody@example.com'' OR ''1''=''1');

  - kind: try
    title: "Try it: PREPARE, EXECUTE, DEALLOCATE"
    body: |
      Run it: Emma is found, `pg_prepared_statements` lists the saved query, and after DEALLOCATE the list is empty.

      Then play: add `EXECUTE find_customer('liam.smith@example.com');` before the DEALLOCATE. One prepared query, run with different values.

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      PREPARE find_customer(text) AS
          SELECT first_name, email FROM customers WHERE email = $1;

      EXECUTE find_customer('emma.johnson@example.com');

      SELECT name, parameter_types FROM pg_prepared_statements;

      DEALLOCATE find_customer;
      SELECT count(*) AS still_prepared FROM pg_prepared_statements;

  - kind: try
    title: Your turn to parameterize
    body: |
      Prepare a statement named **orders_for** that takes an **integer** customer ID and returns the `order_id` and `status` of that customer's orders. Then execute it for customer **40** (Diego).
    sql: |
      SELECT order_id, status FROM orders WHERE customer_id = 40;
    expect: |
      PREPARE orders_for(integer) AS
          SELECT order_id, status FROM orders WHERE customer_id = $1;

      EXECUTE orders_for(40);
    state_query: |
      SELECT name, parameter_types::text FROM pg_prepared_statements;

  - kind: explain
    title: Keep passwords out of your code
    body: |
      A connection string contains a password. If it's written in your code, it ends up in Git, on GitHub, in screenshots and in every copy of the project.

      - Put it in an **environment variable**, conventionally `DATABASE_URL`, and read it with `os.environ["DATABASE_URL"]` or `process.env.DATABASE_URL`.
      - For local development, a **`.env`** file holds these values. **Add `.env` to `.gitignore`** so it's never committed. (This site does exactly that with its Supabase keys.)
      - Give each app its **own role** with least privilege (Module 37), so a leaked password unlocks as little as possible.
      - If a password does leak, **change it** at once. Deleting the commit isn't enough.

      **Example.** A `.env` file in the project folder:

      ```text
      DATABASE_URL=postgresql://app_user:s3cret@db.example.com:5432/bookstore?sslmode=require
      ```

      one line in `.gitignore`, so Git never picks it up:

      ```text
      .env
      ```

      and the code reads it from the environment instead of containing it:

      ```python
      conn = psycopg.connect(os.environ["DATABASE_URL"])
      ```

  - kind: choice
    title: "Quick check: a leaked password"
    body: "You notice you pushed a commit to GitHub with the database password in it. What's the first thing to do?"
    options:
      - "Delete the commit and carry on"
      - "Change the password at once"
      - "Make the GitHub repository private"
      - "Nothing, if nobody has starred the project"
    answer: 1
    explanation: "Assume it's been seen: bots scan GitHub for secrets within minutes. Deleting the commit or hiding the repo doesn't un-leak it. Change the password, then move it into `.env`."

  - kind: explain
    title: Connection limits and pools
    body: |
      Each connection is a separate process on the server, using memory. PostgreSQL allows **`max_connections`** at once, 100 by default. A busy app that opens a new connection for every web request quickly hits *FATAL: sorry, too many clients already*.

      The fix is a **connection pool**: a small set of connections kept open and **reused** by every request.

      - In the app: `pg.Pool` (node-postgres), `psycopg_pool.ConnectionPool` (Python).
      - In front of the database: **PgBouncer**, a separate pooling server.

      Also: always **close** connections (or return them to the pool), and never hold one open while waiting for a person.

  - kind: try
    title: "Try it: how many connections?"
    body: |
      Run it: `100`, the default limit. On your Mac, `SELECT count(*) FROM pg_stat_activity;` shows how many are in use right now (this page is a single built-in session, so it has none to show).

      Nothing is graded here: run it at least once (that unlocks **Continue**), experiment, then press **Continue**.
    sql: |
      SHOW max_connections;

  - kind: explain
    title: ORMs vs. raw SQL
    body: |
      An **ORM** (object-relational mapper) lets you work with tables as objects in your programming language, and writes the SQL for you:

      | Language | Popular ORMs |
      |---|---|
      | Python | **SQLAlchemy**, the **Django ORM** |
      | JavaScript / TypeScript | **Prisma**, **Drizzle** |

      ```python
      # Django: roughly SELECT * FROM orders WHERE status = 'pending'
      Order.objects.filter(status="pending")
      ```

      **Pros:** less repetitive code, parameterization by default, migrations built in (Module 39).
      **Cons:** complex reports are awkward, and it's easy to write code that sends terrible SQL without noticing.

      Most teams use an ORM for everyday work and **drop down to raw SQL** for reporting and tricky queries. Knowing SQL well is what lets you do both.

  - kind: choice
    title: "Quick check: when to drop to SQL"
    body: "Your team uses an ORM. Which task is the best reason to write raw SQL instead?"
    options:
      - "Saving a new customer from a sign-up form"
      - "Loading one order by its ID"
      - "Updating a customer's email"
      - "A monthly revenue report with window functions and several joins"
    answer: 3
    explanation: "Everyday reads and writes are what ORMs do well. Complex reports are where ORMs get awkward and plain SQL is clearer and faster."

  - kind: explain
    title: The ORM N+1 trap
    body: |
      This innocent-looking loop:

      ```python
      orders = Order.objects.all()           # 1 query
      for order in orders:
          print(order.customer.first_name)   # +1 query per order!
      ```

      runs **1 + N** queries: one for the orders, then one more for each order's customer (Module 33). With Inkwell's 39,419 orders, that's 39,420 round trips.

      ORMs have a switch to load related rows up front, in one JOIN or one `IN (…)` query:

      - Django: `Order.objects.select_related("customer")`
      - SQLAlchemy: `select(Order).options(joinedload(Order.customer))`
      - Prisma: `prisma.order.findMany({ include: { customer: true } })`

      Turn on query logging in development, and you'll see N+1 immediately.

  - kind: mac
    title: A Python script with psycopg
    body: |
      This makes a small project folder, installs psycopg 3 in a private environment, writes a script that uses a **parameterized** query and reads the connection string from an environment variable, and runs it. It prints the orders of the customer whose email you pass in.

      **Checkpoint:** paste the output of the two `python` commands into the box below. The attack should print an empty list, `[]`.
    commands: |
      mkdir -p ~/Documents/sql/pyapp && cd ~/Documents/sql/pyapp
      python3 -m venv .venv
      source .venv/bin/activate
      pip install "psycopg[binary]"
      printf 'import os, sys, psycopg\nwith psycopg.connect(os.environ["DATABASE_URL"]) as conn:\n    rows = conn.execute("SELECT o.order_id, o.status FROM orders o JOIN customers c USING (customer_id) WHERE c.email = %%s", (sys.argv[1],)).fetchall()\n    print(rows)\n' > orders.py
      export DATABASE_URL="postgresql://localhost:5432/bookstore"
      python orders.py liam.smith@example.com
      python orders.py "nobody@example.com' OR '1'='1"
    expect_output:
      - "[]"

  - kind: try
    title: "Find the bug: the login that lets anyone in"
    body: |
      The starter is the SQL a careless app built from a login form, and it leaks every customer. Rewrite it the safe way: **prepare** a statement **find_customer(text)** that selects `first_name` and `email` by email, then **execute** it with the attacker's input, exactly as typed: `nobody@example.com' OR '1'='1`.
    sql: |
      SELECT first_name, email
      FROM customers
      WHERE email = 'nobody@example.com' OR '1'='1';
    expect: |
      PREPARE find_customer(text) AS
          SELECT first_name, email FROM customers WHERE email = $1;

      EXECUTE find_customer('nobody@example.com'' OR ''1''=''1');
    hint: |
      The attacker's text becomes one value, `$1`. Inside the EXECUTE's quotes, each `'` of the input is written `''`.

  - kind: try
    title: "Your turn to parameterize an INSERT"
    body: |
      Reviews come in from a web form. Prepare a statement **add_review(integer, integer, smallint, text)** that inserts a review (`book_id`, `customer_id`, `rating`, `comment`), then execute it for book **1**, customer **4671**, rating **5**, comment `Lovely, couldn't stop reading`.
    sql: |
      -- Write your PREPARE and EXECUTE here
    expect: |
      PREPARE add_review(integer, integer, smallint, text) AS
          INSERT INTO reviews (book_id, customer_id, rating, comment)
          VALUES ($1, $2, $3, $4);

      EXECUTE add_review(1, 4671, 5, 'Lovely, couldn''t stop reading');
    state_query: |
      SELECT book_id, rating, comment FROM reviews WHERE customer_id = 4671;
    hint: |
      Four placeholders, `$1` to `$4`, in the order of the types. The apostrophe in the comment is written twice inside quotes.

  - kind: try
    title: "Your turn to remove an ORM's N+1"
    body: |
      An ORM loaded 20 orders, then ran **one extra query per order** to fetch its customer's email. Write the **single** query it should have run: `order_id` and the customer's `email` for orders **100 to 119**.
    sql: |
      SELECT email
      FROM customers
      WHERE customer_id = (SELECT customer_id FROM orders WHERE order_id = 100);
      SELECT email
      FROM customers
      WHERE customer_id = (SELECT customer_id FROM orders WHERE order_id = 101);
      -- … and 18 more
    expect: |
      SELECT o.order_id, c.email
      FROM orders o
      JOIN customers c ON c.customer_id = o.customer_id
      WHERE o.order_id BETWEEN 100 AND 119;
    hint: |
      One JOIN brings each order's customer along. In an ORM this is usually called eager loading.

  - kind: why
    body: |
      Every real use of a database goes through app code. Parameterized queries alone prevent one of the most damaging classes of security bugs, and pools, secrets hygiene and N+1 awareness are what keep an app fast and safe once real people use it.

  - kind: recap
    body: |
      - Connection string: `postgresql://user:password@host:5432/db?sslmode=require`. URL-encode special characters.
      - Drivers: **psycopg 3** (Python, `%s`), **node-postgres** (JavaScript, `$1`).
      - **SQL injection** happens when user input is glued into SQL text. **Always use parameterized queries.** Placeholders are for values, and names come from an allow-list.
      - Passwords go in environment variables (`DATABASE_URL`, a git-ignored `.env`), never in code.
      - Connections are limited (`max_connections`). Use a pool (`pg.Pool`, psycopg_pool, PgBouncer).
      - ORMs (SQLAlchemy, Django, Prisma, Drizzle) for everyday work, raw SQL for hard queries. Watch for N+1 and fix it with eager loading.
