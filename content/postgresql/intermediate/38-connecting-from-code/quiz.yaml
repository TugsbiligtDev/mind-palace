pass: 3
questions:
  - type: mcq
    prompt: Which Python line is safe from SQL injection?
    options:
      - "`conn.execute(f\"SELECT * FROM customers WHERE email = '{email}'\")`"
      - "`conn.execute(\"SELECT * FROM customers WHERE email = '\" + email + \"'\")`"
      - "`conn.execute(\"SELECT * FROM customers WHERE email = %s\", (email,))`"
      - "`conn.execute(\"SELECT * FROM customers WHERE email = '%s'\" % email)`"
    answer: 2
    explanation: Only the third passes the value separately as a parameter. The others paste user input into the SQL text.

  - type: predict
    prompt: What does this return?
    code: |
      PREPARE by_email(text) AS SELECT count(*) FROM customers WHERE email = $1;
      EXECUTE by_email('x'' OR ''1''=''1');
    options:
      - "0"
      - "5020"
      - "1"
      - An error
    answer: 0
    explanation: The parameter is treated as one plain text value. No email equals that odd string, so the count is 0. The injection attempt does nothing.

  - type: mcq
    prompt: Where should an app's database password live?
    options:
      - In the source code, in a constant at the top of the file
      - In an environment variable, with local .env files kept out of Git
      - In a comment next to the SQL, so other developers can find it
      - In the README, in a section that only the people on your team know to read
    answer: 1
    explanation: Environment variables keep secrets out of the code and out of version control.

  - type: mcq
    prompt: A busy app gets *too many clients already*. What's the usual fix?
    options:
      - Open a new connection for every query, then close it
      - Use a connection pool so a few connections are reused
      - Restart PostgreSQL every hour to clear old connections
      - Raise max_connections to 10,000 and keep every connection
    answer: 1
    explanation: Each connection costs server memory and there's a limit. A pool shares a small number of connections across all requests.

  - type: mcq
    prompt: "An ORM loop prints `order.customer.first_name` for 500 orders and the page is slow. What's the likely cause and fix?"
    options:
      - A missing primary key; add one to orders
      - N+1 queries; load the customers up front with a join
      - Too many columns; select only first_name
      - A missing index on customers; add one on the first_name column
    answer: 1
    explanation: Each access to order.customer runs another query. Eager loading fetches them all in one go.
