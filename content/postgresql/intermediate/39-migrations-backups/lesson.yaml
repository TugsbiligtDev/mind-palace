steps:
  - kind: explain
    title: Schema changes need a history
    body: |
      Your database exists in several places: your laptop, a teammate's laptop, a test server, and *production* (the real, live copy the shop and its customers use). When you add a column on your laptop, how do the others get **exactly** the same change, in the right order, exactly once?

      Typing ALTER TABLE by hand in each place doesn't scale: someone forgets a step, or runs it twice.

      A **migration** is a small, numbered script that changes the schema one step:

      ```text
      migrations/
        001_create_customers.sql
        002_create_orders.sql
        003_add_customer_phone.sql
      ```

      Migrations live in **Git** (a tool that keeps the full history of a project's files, so a team can share changes) next to the app code. A tool applies the ones a database hasn't had yet, **in order**, and records each in a table (often `schema_migrations`). Any database can be brought up to date by running what's missing.

  - kind: choice
    title: "Quick check: which migrations run?"
    body: "Production has run migrations 001 and 002. Your new work adds 003 and 004. What does the migration tool run when you *deploy* (put the new version live)?"
    options:
      - "003, then 004"
      - "001, 002, 003 and 004"
      - "Only 004, the newest"
      - "004, then 003"
    answer: 0
    explanation: "The tool checks `schema_migrations`, sees 001 and 002 are already applied, and runs only the missing ones, in order."

  - kind: explain
    title: The rules of migrations
    body: |
      - **Never edit a migration that has already run somewhere.** Other databases won't rerun it, so your edit reaches nobody. Write a **new** migration instead.
      - **One change per migration**, with a descriptive name.
      - **Run each one in a transaction** where possible (PostgreSQL can roll back changes to structure, Module 30), so a failure leaves nothing half-done. (Exception: `CREATE INDEX CONCURRENTLY` can't run inside a transaction.)
      - Some tools support **down** migrations (undo steps). Many teams only move **forward**: to undo, write another migration.
      - On big production tables, some changes lock the table. Test those on a copy first and run them at a quiet time.

  - kind: try
    title: A migration by hand
    body: |
      This does what a migration tool does: apply a change inside a transaction and record its version. Run it and look at `schema_migrations`.
    sql: |
      CREATE TABLE schema_migrations (
          version     text PRIMARY KEY,
          applied_at  timestamptz NOT NULL DEFAULT now()
      );

      BEGIN;
      ALTER TABLE orders ADD COLUMN notes text;
      INSERT INTO schema_migrations (version)
      VALUES ('001_add_order_notes');
      COMMIT;

      SELECT version FROM schema_migrations;

  - kind: try
    title: Your turn to write migration 002
    body: |
      Migration 001 is applied. Write migration **002** the same way: inside a transaction, add a `phone` column (`text`) to `customers` and record the version **`002_add_customer_phone`**. The last query lists the applied versions.
    sql: |
      CREATE TABLE schema_migrations (
          version     text PRIMARY KEY,
          applied_at  timestamptz NOT NULL DEFAULT now()
      );
      INSERT INTO schema_migrations (version)
      VALUES ('001_add_order_notes');

      SELECT version FROM schema_migrations ORDER BY version;
    expect: |
      CREATE TABLE schema_migrations (
          version     text PRIMARY KEY,
          applied_at  timestamptz NOT NULL DEFAULT now()
      );
      INSERT INTO schema_migrations (version) VALUES ('001_add_order_notes');

      BEGIN;
      ALTER TABLE customers ADD COLUMN phone text;
      INSERT INTO schema_migrations (version) VALUES ('002_add_customer_phone');
      COMMIT;

      SELECT version FROM schema_migrations ORDER BY version;
    ordered: true

  - kind: explain
    title: Migration tools
    body: |
      You won't usually write the bookkeeping yourself. Common tools:

      | Tool | Used with | Migrations written as |
      |---|---|---|
      | **Alembic** | Python, SQLAlchemy | Python files (auto-generated from your models, then reviewed) |
      | **Django migrations** | Django | Python files generated by `makemigrations` |
      | **Flyway** | any language | plain `.sql` files named `V1__create_orders.sql` |
      | **Liquibase** | any language | SQL, XML or YAML "changesets" |
      | **Prisma Migrate / Drizzle Kit** | TypeScript | SQL generated from your schema file |

      Whatever the tool: **read the SQL it generates** before running it on production. That's where your SQL knowledge pays off.

  - kind: choice
    title: "Quick check: before production"
    body: "Your ORM generated a migration for you. What should you do before running it on production?"
    options:
      - "Nothing: generated migrations are always right"
      - "Edit an older migration to include it"
      - "Read the SQL it generated"
      - "Run it twice to be safe"
    answer: 2
    explanation: "Tools can generate a slow, locking or destructive change. Reading the SQL is where your SQL knowledge pays off. Never edit an old migration, and running one twice is what the tool prevents."

  - kind: explain
    title: "Backups: pg_dump and pg_restore"
    body: |
      **`pg_dump`** makes a **logical backup**: a file of the SQL (or data) needed to recreate one database: tables, data, indexes, functions. It runs while the database is in use, and the backup is a consistent snapshot.

      ```bash
      pg_dump -Fc -d bookstore -f bookstore.dump       # custom format
      pg_restore -d restore_test bookstore.dump        # restore into another database
      ```

      <!-- page -->

      **Use the custom format, `-Fc`:** it's compressed, `pg_restore` can restore it **in parallel** (`-j 4`), and you can restore just **one table** from it (`-t orders`). The plain format (`pg_dump bookstore > backup.sql`) is readable SQL, handy for small databases or reading.

      What `pg_dump` **doesn't** include: **roles and passwords**, which belong to the whole cluster. Back those up with `pg_dumpall --globals-only`.

      pg_dump is great for small and medium databases and for moving data. Big production systems add **physical** backups (a copy of the database's files) that can restore to any moment in time. Recognize the names `pg_basebackup` and *point-in-time recovery*; cloud providers usually set this up for you.

  - kind: choice
    title: "Quick check: what's in the dump?"
    body: "You run `pg_dump -Fc -d bookstore -f bookstore.dump`. What is **not** in the file?"
    options:
      - "The tables' data"
      - "The roles and their passwords"
      - "The indexes"
      - "The functions"
    answer: 1
    explanation: "pg_dump backs up one database: tables, data, indexes, functions. Roles belong to the whole cluster, so they need `pg_dumpall --globals-only`."

  - kind: explain
    title: A backup you haven't restored is a hope
    body: |
      Backups fail silently: the job ran but the file is empty, the disk filled up, the password changed, a table was excluded, the restore needs a role that doesn't exist. Many teams discover this **on the day they need the backup**.

      - **Test restores regularly**: restore into a scratch database and run a few sanity queries (row counts, the latest rows).
      - **Keep copies somewhere else**: a backup on the same disk dies with the disk.
      - **Know how long a restore takes.** "Four hours" is useful to know *before* an outage.

      **Example: a restore test that caught a problem.** The nightly backup "worked" for months. The first test restore said:

      ```text
      $ createdb restore_test
      $ pg_restore -d restore_test bookstore.dump
      pg_restore: error: could not execute query: ERROR:  role "reporting" does not exist
      Command was: GRANT SELECT ON TABLE public.orders TO reporting;
      pg_restore: warning: errors ignored on restore: 1
      $ psql -d restore_test -c "SELECT count(*) FROM orders;"
       count
      -------
       39419
      (1 row)
      ```

      The data is all there (the count matches), but the permissions for the reporting team would have been missing on the day of a real disaster. The fix: also back up the roles (`pg_dumpall --globals-only`) and restore those first. Found on a quiet Tuesday, not during an outage.

  - kind: mac
    title: Back up, restore, verify
    body: |
      Dump your course database, restore it into a brand-new database, check a row count matches, then clean up. (`createdb` and `dropdb` are small Terminal tools that come with PostgreSQL.)

      **Checkpoint:** paste the two `count` results into the box below. Both should say 39419 (with the Intermediate files loaded).
    commands: |
      cd ~/Documents/sql
      pg_dump -Fc -d bookstore -f bookstore.dump
      createdb restore_test
      pg_restore -d restore_test bookstore.dump
      psql -d restore_test -c "SELECT count(*) FROM orders;"
      psql -d bookstore -c "SELECT count(*) FROM orders;"
      dropdb restore_test
      pg_dumpall --globals-only -f roles.sql
    expect_output:
      - "39419"

  - kind: explain
    title: PostgreSQL in Docker
    body: |
      **Docker** runs programs in **containers**: isolated, throwaway environments. It's the easiest way to run a *second* PostgreSQL, of any version, without touching the one Homebrew installed.

      ```bash
      docker run --name pg18 \
        -e POSTGRES_PASSWORD=devpass \
        -p 5433:5432 \
        -v pg18data:/var/lib/postgresql \
        -d postgres:18
      ```

      - `-e POSTGRES_PASSWORD=…` sets the superuser's password.
      - `-p 5433:5432` makes it reachable on your Mac's port **5433** (5432 is taken by Homebrew's server).
      - `-v pg18data:…` keeps the data in a named **volume**, so it survives the container being removed. Without it, the data disappears with the container.

      Teams use Docker so every developer runs **the same version** as production, and to test upgrades, backups and restores safely.

  - kind: mac
    title: Try a container (needs Docker Desktop)
    body: |
      If you've installed **Docker Desktop**, start a PostgreSQL 18 container, connect with psql on port 5433, and restore your backup into it. When done, stop and remove it.
    commands: |
      docker run --name pg18 -e POSTGRES_PASSWORD=devpass -p 5433:5432 -v pg18data:/var/lib/postgresql -d postgres:18
      PGPASSWORD=devpass psql -h localhost -p 5433 -U postgres -c "CREATE DATABASE bookstore;"
      PGPASSWORD=devpass pg_restore -h localhost -p 5433 -U postgres -d bookstore --no-owner ~/Documents/sql/bookstore.dump
      PGPASSWORD=devpass psql -h localhost -p 5433 -U postgres -d bookstore -c "SELECT count(*) FROM orders;"
      docker stop pg18 && docker rm pg18

  - kind: try
    title: "Find the bug: the migration that will run twice"
    body: |
      Migration **003_add_order_gift_flag** adds a `is_gift` boolean (default false) to `orders`. It runs fine, but tomorrow the migration tool will run it **again** and fail. Find what's missing and fix it. Keep the first two lines.
    sql: |
      CREATE TABLE schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now());
      INSERT INTO schema_migrations (version)
      VALUES ('001_add_order_notes'), ('002_add_customer_phone');

      BEGIN;
      ALTER TABLE orders ADD COLUMN is_gift boolean NOT NULL DEFAULT false;
      COMMIT;
    expect: |
      CREATE TABLE schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now());
      INSERT INTO schema_migrations (version) VALUES ('001_add_order_notes'), ('002_add_customer_phone');

      BEGIN;
      ALTER TABLE orders ADD COLUMN is_gift boolean NOT NULL DEFAULT false;
      INSERT INTO schema_migrations (version) VALUES ('003_add_order_gift_flag');
      COMMIT;
    state_query: |
      SELECT (SELECT string_agg(version, ', ' ORDER BY version) FROM schema_migrations) AS versions,
             (SELECT count(*) FROM information_schema.columns WHERE table_name = 'orders' AND column_name = 'is_gift') AS has_column;
    hint: |
      How does the tool know a migration has already been applied?

  - kind: try
    title: "Your turn: a migration with a backfill"
    body: |
      Write migration **003_customer_vip** in one transaction: add `is_vip` (boolean, NOT NULL, default false) to `customers`, set it to **true** for customers with **20 or more orders**, and record the version. Keep the first two lines.
    sql: |
      CREATE TABLE schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now());
      INSERT INTO schema_migrations (version)
      VALUES ('001_add_order_notes'), ('002_add_customer_phone');
    expect: |
      CREATE TABLE schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now());
      INSERT INTO schema_migrations (version) VALUES ('001_add_order_notes'), ('002_add_customer_phone');

      BEGIN;
      ALTER TABLE customers ADD COLUMN is_vip boolean NOT NULL DEFAULT false;
      UPDATE customers SET is_vip = true
      WHERE customer_id IN (SELECT customer_id FROM orders GROUP BY customer_id HAVING count(*) >= 20);
      INSERT INTO schema_migrations (version) VALUES ('003_customer_vip');
      COMMIT;
    state_query: |
      SELECT (SELECT string_agg(version, ', ' ORDER BY version) FROM schema_migrations) AS versions,
             count(*) FILTER (WHERE is_vip) AS vips,
             count(*) AS customers
      FROM customers;
    hint: |
      ADD COLUMN with its default, then one UPDATE using a subquery that finds customers with at least 20 orders (GROUP BY + HAVING), then the version row.

  - kind: try
    title: "Your turn to roll forward"
    body: |
      Migration 003 (the starter applies it) turned out to be a mistake. Teams that only move forward undo it with a **new** migration. Write **004_drop_customer_vip**: in one transaction, drop the `is_vip` column and record the version.
    sql: |
      CREATE TABLE schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now());
      INSERT INTO schema_migrations (version)
      VALUES ('001_add_order_notes'), ('002_add_customer_phone');
      BEGIN;
      ALTER TABLE customers ADD COLUMN is_vip boolean NOT NULL DEFAULT false;
      INSERT INTO schema_migrations (version)
      VALUES ('003_customer_vip');
      COMMIT;
    expect: |
      CREATE TABLE schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now());
      INSERT INTO schema_migrations (version) VALUES ('001_add_order_notes'), ('002_add_customer_phone');
      BEGIN;
      ALTER TABLE customers ADD COLUMN is_vip boolean NOT NULL DEFAULT false;
      INSERT INTO schema_migrations (version) VALUES ('003_customer_vip');
      COMMIT;

      BEGIN;
      ALTER TABLE customers DROP COLUMN is_vip;
      INSERT INTO schema_migrations (version) VALUES ('004_drop_customer_vip');
      COMMIT;
    state_query: |
      SELECT (SELECT string_agg(version, ', ' ORDER BY version) FROM schema_migrations) AS versions,
             (SELECT count(*) FROM information_schema.columns WHERE table_name = 'customers' AND column_name = 'is_vip') AS has_column;
    hint: |
      Don't delete migration 003's record: history stays. Add 004, which drops the column.

  - kind: why
    body: |
      Databases outlive every laptop and every server they run on. Migrations make every copy of the schema identical and every change reviewable, and tested backups are the difference between "we lost an hour" and "we lost the company's data".

  - kind: recap
    body: |
      - **Migrations**: numbered SQL (or tool) files in Git, applied in order, recorded in a table.
      - Never edit an applied migration. Write a new one. Run each in a transaction when possible.
      - Tools: Alembic, Django migrations, Flyway, Liquibase, Prisma/Drizzle. Always read the generated SQL.
      - `pg_dump -Fc` + `pg_restore` for logical backups (parallel, selective). `pg_dumpall --globals-only` for roles.
      - **Test restores** regularly, keep copies elsewhere, and know how long a restore takes.
      - Docker runs isolated PostgreSQL versions. Use a volume so the data persists.
