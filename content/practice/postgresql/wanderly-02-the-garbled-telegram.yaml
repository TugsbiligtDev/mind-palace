difficulty: easy
topic: postgresql/beginner/01-syntax
concepts: [syntax, quoting, error messages]
series: { name: The Wanderly Files, episode: 2 }
title: The Garbled Telegram
briefing: |
  A telegram arrived at the agency this morning, addressed to "The Detective". No sender.
  Wanderly's night clerk typed it into the database, but in a hurry, and the query to read it
  back is a mess.

  "Someone wants to help us," Inspector Bold says, "or wants us to *think* they do. Either way,
  read it."
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.telegram (
      word_no  INTEGER PRIMARY KEY,
      word     TEXT NOT NULL
  );
  INSERT INTO evidence.telegram (word_no, word) VALUES
  (1, 'FOLLOW'), (2, 'STOP'), (3, 'THE'), (4, 'COST'), (5, 'STOP'),
  (6, 'PER'), (7, 'NIGHT'), (8, 'STOP');
clues:
  - "The telegram is stored in `evidence.telegram`, with one row per word: `word_no` and `word`."
  - "Telegrams use the word STOP as punctuation. The query is meant to skip those."
task: |
  The clerk's query (already in the editor) should return **two columns, `word_no` and `word`**, for every word that isn't `STOP`.

  It has **several** mistakes, and one of them doesn't cause an error at all. Fix them all, then **Submit**.

  *You haven't learned `WHERE` yet (Module 3). You don't need to. Just fix the grammar. `<>` means "is not equal to".*
starter: |
  SELEC word_no word
  FROM evidence."Telegram"
  WHERE word <> "STOP";
check:
  mode: result
  solution: |
    SELECT word_no, word
    FROM evidence.telegram
    WHERE word <> 'STOP';
hints:
  - Run it and read the first error. What's misspelled at the very start of line 1?
  - "Double quotes mean *a name, exactly as written*, which matters for the table name and for STOP. And look closely between `word_no` and `word`: what separates two columns?"
  - "Lines 1 and 2 should be `SELECT word_no, word` and `FROM evidence.telegram`. Line 3 compares `word` to the *text* STOP, so which kind of quotes does text need?"
reveal: |
  Five words remain: **FOLLOW THE COST PER NIGHT.**

  Inspector Bold writes it on the whiteboard and underlines *cost per night*. "Every trip
  stop in Wanderly's database has a cost and a number of nights. Somebody wants us to divide
  one by the other."

  Moth, quietly: "Or somebody *doesn't*, and this is a trap."
