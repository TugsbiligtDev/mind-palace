difficulty: easy
topic: postgresql/beginner/06-querying-one-table
concepts: [SELECT, aliases, calculated columns]
series: { name: The Wanderly Files, episode: 3 }
title: The Passenger Manifest
briefing: |
  "FOLLOW THE COST PER NIGHT." Inspector Bold has decided to take the telegram at its word.

  Wanderly's accountant has asked for a manifest of every trip stop, the same one they send
  to hotels, with one extra column the telegram hinted at. "Build it exactly as they asked,"
  Bold says. "Then we'll see what stands out."
clues:
  - "Every stop is a row in `trip_stops`: which trip, which city, the visit order, `nights`, and total `cost`."
  - The accountant wants the columns in a precise order. Hotels' systems reject anything else.
task: |
  Return **every trip stop** with exactly these five columns, in this order:

  1. `trip_stop_id`
  2. `trip_id`
  3. `nights`
  4. `cost`
  5. the cost of **one night** at that stop, labeled **`cost_per_night`**

  No rounding: leave the division as PostgreSQL returns it.
starter: |
  SELECT *
  FROM trip_stops;
check:
  mode: result
  solution: |
    SELECT trip_stop_id, trip_id, nights, cost,
           cost / nights AS cost_per_night
    FROM trip_stops;
hints:
  - "`*` gives you every column, including two the accountant didn't ask for. List the ones you need, separated by commas, in the order given."
  - The fifth column doesn't exist in the table. Calculate it from two columns that do, and give it a label with `AS`.
  - "You want `SELECT trip_stop_id, trip_id, nights, cost, … AS cost_per_night FROM trip_stops;`. What divided by what gives the price of one night?"
reveal: |
  The per-night prices look ordinary, from 60 to about 233. A budget hotel here, a nice one there.

  Then Bold puts her finger on **stop 7**: trip 5, Rome, **one night**, 60.00 in total. "A
  twenty-day Grand Tour, and they spend a *single night* in Rome? Nobody crosses Europe for
  that. It isn't the price per night that's wrong. It's the number of nights."

  "Whose trip is number 5?" Moth is already checking. "The Europe Grand Tour. Traveler 4,
  Dulguun Erdene. And we have no way to contact them."
