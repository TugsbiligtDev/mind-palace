difficulty: medium
topic: postgresql/beginner/03-where
concepts: [WHERE, IS NULL, ILIKE, IN, BETWEEN]
series: { name: The Wanderly Files, episode: 4 }
title: The Traveler Without a Trace
briefing: |
  Trip 5, the Europe Grand Tour, belongs to a traveler Wanderly can't reach. No email on file.

  Moth has pulled a stack of informal **sightings** from Wanderly's partner hotels and tour desks,
  typed in by a dozen different people with a dozen different spellings. "If this traveler really
  was in Rome for one night only," Bold says, "the sightings will agree. Let's see if they do."
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.sightings (
      sighting_id    INTEGER PRIMARY KEY,
      traveler_name  TEXT NOT NULL,
      city           TEXT NOT NULL,
      seen_on        DATE NOT NULL,
      note           TEXT
  );
  INSERT INTO evidence.sightings VALUES
  (1, 'DULGUUN E.',      'Rome',     '2026-02-02', 'Leaving a hotel near Termini'),
  (2, 'dulguun erdene',  'Rome',     '2026-02-05', 'Buying a train ticket to Paris'),
  (3, 'Dulguun',         'Tokyo',    '2026-02-04', 'Different person, same first name'),
  (4, 'Dulguun Erdene',  'Paris',    '2026-02-10', 'In the Louvre ticket queue'),
  (5, 'Dulguun Erdene',  'Rome',     '2026-03-15', 'Photo from a later trip'),
  (6, 'Baatar Otgon',    'Paris',    '2026-02-11', 'Different traveler'),
  (7, 'Erdene, Dulguun', 'Florence', '2026-02-04', 'Day trip from Rome?');
clues:
  - "`travelers` holds everyone's details. Exactly one traveler has no email."
  - "`evidence.sightings` columns: `sighting_id`, `traveler_name` (spelled inconsistently), `city`, `seen_on`, `note`."
  - The Europe Grand Tour ran from **2026-02-01 to 2026-02-20**, inclusive.
task: |
  1. First, find the traveler who has **no email**. (Explore. This step isn't graded.)
  2. Then return **all columns** from `evidence.sightings` for that traveler's sightings that are:
     - under **any spelling or capitalization** of their first name,
     - in **Rome or Paris**,
     - **during the Grand Tour** (2026-02-01 to 2026-02-20, inclusive).

  Your **last** query is the one that gets graded.
starter: |
  SELECT full_name, email
  FROM travelers
  WHERE email = NULL;
check:
  mode: result
  solution: |
    SELECT *
    FROM evidence.sightings
    WHERE traveler_name ILIKE '%dulguun%'
      AND city IN ('Rome', 'Paris')
      AND seen_on BETWEEN '2026-02-01' AND '2026-02-20';
hints:
  - "The starter returns nothing. That's the NULL trap from the lesson. Which operator really tests for a missing value? Then look at the sightings table with `SELECT * FROM evidence.sightings;`."
  - "You need three conditions joined with `AND`: a case-insensitive pattern on the name (`ILIKE` with `%`), a list of cities (`IN`), and a date range (`BETWEEN`)."
  - "Try `WHERE traveler_name ILIKE '%dulguun%' AND city IN (…) AND seen_on BETWEEN … AND …`. You still need to fill in the cities and the two dates."
reveal: |
  Three sightings. **Rome on February 2** (leaving a hotel). **Rome again on February 5**
  (buying a ticket to Paris). **Paris on February 10**.

  "Rome from the 2nd to at least the 5th," Bold says. "That's three nights, at the very least.
  Wanderly's records say *one*." She pins the three sightings to the board next to the 60-a-night
  booking.

  Somebody edited that booking after the fact.
