difficulty: medium
topic: postgresql/beginner/04-order-by
concepts: [ORDER BY, NULLS LAST, LIMIT, OFFSET]
series: { name: The Wanderly Files, episode: 5 }
title: The Priciest Night
briefing: |
  Wanderly's auditors have a shoebox of hotel and taxi **receipts**, now typed into the database.
  Some amounts were smudged beyond reading and were entered as NULL.

  "The auditors have already checked the three biggest receipts," Bold says. "They want the
  *next* three. And Moth, tell our detective about the auditors' last intern."

  Moth winces. "Sorted biggest-first, and the unreadable ones floated to the top. They 'verified'
  three smudges and never noticed."
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.receipts (
      receipt_id  INTEGER PRIMARY KEY,
      trip_id     INTEGER NOT NULL,
      vendor      TEXT NOT NULL,
      city        TEXT NOT NULL,
      amount      NUMERIC(8,2),
      issued_on   DATE NOT NULL
  );
  INSERT INTO evidence.receipts VALUES
  (1, 5, 'Hotel Aurelia',      'Rome',        300.00, '2026-02-06'),
  (2, 5, 'Hotel Lumiere',      'Paris',       850.00, '2026-02-11'),
  (3, 1, 'Ryokan Sakura',      'Kyoto',       410.00, '2026-03-10'),
  (4, 3, 'Casa Inca',          'Cusco',       900.00, '2026-05-19'),
  (5, 7, 'Blue Sky Hotel',     'Ulaanbaatar', NULL,   '2025-11-12'),
  (6, 4, 'Hotel du Marais',    'Paris',       700.00, '2026-06-07'),
  (7, 5, 'Taxi Roma',          'Rome',         45.50, '2026-02-01'),
  (8, 2, 'Villa Borghese Inn', 'Rome',        NULL,   '2026-08-10'),
  (9, 1, 'Tokyo Stay',         'Tokyo',       620.00, '2026-03-05');
clues:
  - "`evidence.receipts`: `receipt_id`, `trip_id`, `vendor`, `city`, `amount` (NULL when unreadable), `issued_on`."
  - The three largest *readable* receipts have already been verified.
task: |
  Return the columns `receipt_id`, `vendor`, `city`, `amount` for the **next three** receipts after the three biggest:

  - sorted by `amount` from **largest to smallest**,
  - with **unreadable (NULL) amounts at the very end**,
  - **skipping the first 3** rows, then **showing 3**.

  Order matters here: the grader checks the rows *in order*.
starter: |
  SELECT receipt_id, vendor, city, amount
  FROM evidence.receipts;
check:
  mode: result
  ordered: true
  solution: |
    SELECT receipt_id, vendor, city, amount
    FROM evidence.receipts
    ORDER BY amount DESC NULLS LAST
    LIMIT 3 OFFSET 3;
hints:
  - "Start by sorting: `ORDER BY amount DESC`. Run it and look at where the NULL amounts end up."
  - "In descending order NULLs come first, which is exactly the intern's mistake. There's a two-word option that sends them to the end."
  - "`ORDER BY amount DESC NULLS LAST`, then add `LIMIT` and `OFFSET`. Skip how many, show how many?"
reveal: |
  Tokyo Stay, 620. Ryokan Sakura, 410. And **Hotel Aurelia, Rome: 300.00**, trip 5, issued
  February 6.

  Bold does the arithmetic out loud. "Three hundred. The booking says one night at sixty.
  Three hundred at sixty a night is **five nights**." She circles February 1 and February 6 on
  the calendar. "A taxi from the station on the first, the hotel bill paid on the sixth. The
  receipt was never the lie. The booking was."
