difficulty: hard
topic: postgresql/beginner/07-aggregation
concepts: [GROUP BY, HAVING, COUNT DISTINCT, SUM]
series: { name: The Wanderly Files, episode: 8 }
title: Follow the Money
briefing: |
  A changed booking is a motive only if someone profits. Wanderly's finance team exports every
  **refund** approved in the last year: which trip, which staff login approved it, how much.

  "Individually, each refund looks ordinary," Bold says. "Nobody notices one refund. They
  notice a *pattern*. Summarize by approver."
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.refunds (
      refund_id    INTEGER PRIMARY KEY,
      trip_id      INTEGER NOT NULL,
      approved_by  TEXT NOT NULL,
      amount       NUMERIC(8,2) NOT NULL,
      approved_on  DATE NOT NULL
  );
  INSERT INTO evidence.refunds VALUES
  (1, 5, 'gtsog',     240.00, '2026-02-21'),
  (2, 5, 'gtsog',     240.00, '2026-02-22'),
  (3, 3, 'sotgon',    150.00, '2026-05-25'),
  (4, 7, 'gtsog',     380.00, '2026-02-22'),
  (5, 1, 'nbatbayar',  60.00, '2026-03-15'),
  (6, 4, 'gtsog',     380.00, '2026-02-23'),
  (7, 1, 'sotgon',     45.00, '2026-03-20'),
  (8, 2, 'edash',     100.00, '2026-08-01'),
  (9, 3, 'sotgon',     75.00, '2026-06-02');
clues:
  - "`evidence.refunds`: `refund_id`, `trip_id`, `approved_by` (a staff login), `amount`, `approved_on`."
  - Finance only reviews approvers who've signed off **3 or more** refunds.
task: |
  For each approver with **at least 3** refunds, return exactly these four columns:

  1. `approved_by`
  2. **`refunds`**: how many refunds they approved
  3. **`trips`**: how many **different** trips those refunds were for
  4. **`total`**: the total amount they approved
starter: |
  SELECT approved_by, amount
  FROM evidence.refunds;
check:
  mode: result
  solution: |
    SELECT approved_by,
           count(*) AS refunds,
           count(DISTINCT trip_id) AS trips,
           sum(amount) AS total
    FROM evidence.refunds
    GROUP BY approved_by
    HAVING count(*) >= 3;
hints:
  - "You want one row **per approver**, so which column goes in `GROUP BY`?"
  - "Three aggregates: `count(*)`, `count(DISTINCT …)` and `sum(…)`. Then keep only the big groups. That's a filter on a count, so it goes in `HAVING`, not `WHERE`."
  - "`GROUP BY approved_by HAVING count(*) >= 3`. The SELECT list is `approved_by`, then the three aggregates, each with its label."
reveal: |
  | approved_by | refunds | trips | total |
  |---|---|---|---|
  | **gtsog** | **4** | **3** | **1240.00** |
  | sotgon | 3 | 2 | 270.00 |

  Saraa Otgon's refunds are spread over months. Gerel Tsog's four all landed in **three days**,
  February 21 to 23, right after the tour.

  Two of them are against trip 5, for **240.00** each. Bold writes it on the board:
  **300.00 − 60.00 = 240.00**. "The exact amount shaved off the Rome booking. Refunded to
  somebody, twice."

  "We have the name, the motive and the money," she says. "Now we put the records right."
