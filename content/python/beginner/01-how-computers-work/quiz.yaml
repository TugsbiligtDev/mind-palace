  - type: mcq
    prompt: Which part of a computer forgets everything when the power goes off?
    options:
      - The CPU
      - RAM
      - Storage (the SSD)
      - The folder tree
    answer: 1
    explanation: RAM is the fast "counter" where the computer works right now. It is wiped when the power goes off. Storage keeps your files.
