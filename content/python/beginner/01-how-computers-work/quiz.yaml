  - type: mcq
    prompt: Python is called an *interpreted* language. What does that mean?
    options:
      - It only works in a web browser
      - An interpreter reads and carries out your code line by line
      - It has to be translated into a separate program before it can run at all
      - It can only print text
    answer: 1
    explanation: An interpreter runs your instructions as it reads them, which is why one line can be tried on its own.
