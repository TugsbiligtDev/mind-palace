steps:
  - kind: explain
    title: Talking to your computer with words
    body: |
      You normally click icons. The **terminal** lets you *type* instead: you write a short command, press Enter, and the computer does it. Programmers love it because typed commands can be repeated, saved and combined, and because it works the same on every machine.

      Two words you will hear:

      - The **terminal** is the window where you type.
      - The **shell** is the program inside it that reads your commands. On a Mac the shell is **zsh** ("z-shell").

      Open it now: press **⌘ + Space**, type *Terminal*, press Enter. You will see a line ending in `%`. That is the **prompt**. It means "I'm waiting for a command".

      Lines in this lesson labelled *Terminal* are for your Mac's terminal, not for this page. The exercises on the right run Python and check your understanding.

  - kind: explain
    title: Where am I? Paths
    body: |
      The terminal is always "standing" in one folder, called the **current folder** or **working directory**. Every command happens *there* unless you say otherwise. Mixing this up is the most common beginner mistake.

      A **path** is a folder's address. There are two kinds:

      - **Absolute path**: starts at the very top of the disk, with `/`. Example: `/Users/ada/Desktop`. It means the same thing wherever you are.
      - **Relative path**: starts from where you are now. `notes` means "the folder called notes *inside the current folder*".

      Four shortcuts you will type constantly:

      | Shortcut | Means |
      |---|---|
      | `~` | Your home folder, for example `/Users/ada` |
      | `.` | The current folder |
      | `..` | The folder one level **up** |
      | `/` | The top of the disk (the *root*) |

  - kind: mac
    title: Look around
    body: |
      Run these one at a time. After each, read what came back.

      - `pwd` = **p**rint **w**orking **d**irectory: "where am I?"
      - `ls` = **l**i**s**t: "what is in this folder?"
      - `cd` = **c**hange **d**irectory: "go there"

      **Checkpoint:** paste what Terminal printed below. It should end with a path that contains `/Desktop`.
    commands: |
      pwd
      ls
      cd ~/Desktop
      pwd
      cd ..
      pwd
    expect_output:
      - "/Desktop"

  - kind: choice
    title: Absolute or relative?
    body: |
      You are standing in `/Users/ada`. Which of these paths means the **same place wherever you are standing**?
    options:
      - "`notes/todo.txt`"
      - "`../photos`"
      - "`/Users/ada/Desktop`"
      - "`.`"
    answer: 2
    explanation: "`/Users/ada/Desktop` starts with `/`, the top of the disk, so it is **absolute**: it means the same folder from anywhere. The others are **relative**: `notes/todo.txt` and `.` depend on the current folder, and `../photos` starts by going one level up from it. (`~/Desktop` also works from anywhere, because `~` is always your home folder.)"

  - kind: explain
    title: Making, copying, moving and deleting
    body: |
      These are the commands you will use every day:

      | Command | What it does | Example |
      |---|---|---|
      | `mkdir` | make a folder | `mkdir python-practice` |
      | `touch` | make an empty file | `touch notes.txt` |
      | `cp` | copy | `cp notes.txt backup.txt` |
      | `mv` | move **or rename** | `mv backup.txt old-notes.txt` |
      | `rm` | remove (delete) | `rm old-notes.txt` |

      Two comforts: press **Tab** and the terminal completes a name for you (`cd Desk` + Tab becomes `cd Desktop`). Press the **↑ (up arrow)** to bring back your previous commands, which is called your *history*.

  - kind: mac
    title: Build a practice folder
    body: |
      Make a folder, go into it, create a file, and look at it.

      **Checkpoint:** paste the output. It should show `notes.txt` and a path ending in `python-practice`.
    commands: |
      cd ~/Desktop
      mkdir python-practice
      cd python-practice
      touch notes.txt
      ls
      pwd
    expect_output:
      - "notes.txt"
      - "python-practice"

  - kind: code
    title: Paths in Python
    body: |
      Python can work with paths too, using `Path` from `pathlib`. Run this and compare each line with the terminal commands you just used:

      - `/` **joins** pieces, like going *into* a folder with `cd` (here it is not division).
      - `.parent` is the folder one level **up**, like `cd ..`. The parent of the top `/` is `/` itself.

      Change `"python-practice"` to another folder name and run it again. You'll write code like this yourself from Module 17.
    code: |
      from pathlib import Path

      print(Path("/Users/ada/Desktop") / "python-practice")
      print(Path("/Users/ada/Desktop").parent)
      print(Path("/").parent)

  - kind: mac
    title: Copy, rename, delete
    body: |
      Now practise the three that change things. Do this inside your `python-practice` folder.

      **Checkpoint:** paste the output. The first `ls` should show both `notes.txt` and `renamed.txt`, and the second only `notes.txt`.
    commands: |
      cd ~/Desktop/python-practice
      cp notes.txt copy.txt
      mv copy.txt renamed.txt
      ls
      rm renamed.txt
      ls
    expect_output:
      - "renamed.txt"
      - "notes.txt"

  - kind: explain
    title: Why rm is dangerous
    body: |
      `rm` does **not** send things to the Trash. The file is gone for good. And there is no "are you sure?".

      Two things make it worse:

      - **`rm -r`** removes a folder *and everything inside it*.
      - **`rm -f`** ("force") silences every warning.

      So `rm -rf something` deletes a whole folder, silently, forever. Most horror stories are `rm -rf` typed in the wrong folder, or with a typo. Habits that protect you:

      1. Run `pwd` and `ls` first, so you know where you are and what is there.
      2. Read the command twice before pressing Enter.
      3. Delete single files, not folders, until you are confident.
      4. Never paste a command from the internet that you do not understand.

  - kind: choice
    title: A safety check
    body: |
      You are about to clean up. Which command could delete a whole folder and everything in it, without asking?
    options:
      - "`rm notes.txt`"
      - "`rm -rf photos`"
      - "`mkdir rmdir-test`"
      - "`ls -la`"
    answer: 1
    explanation: "`-r` removes a folder *and everything inside it*, and `-f` silences every warning. `rm notes.txt` deletes one file (still permanent, so check first), `mkdir` only creates a folder (the `rmdir` is just part of its name), and `ls -la` only lists files."

  - kind: info
    title: "🔹 The mistake behind most errors: the wrong folder"
    body: |
      When a command says `No such file or directory`, the file usually exists, just **not in the folder you are standing in**. Before anything else, run `pwd` and `ls`. You will do this for the rest of your career.

      This matters for Python too: a script that opens `data.txt` looks for it in the folder where you *ran* it, not the folder where the script is saved. Module 17 comes back to this.

  - kind: why
    body: |
      Every later tool, Python's `uv`, Git, servers, is used from the terminal. It looks strange for a day and then becomes the fastest way to work. Knowing *where you are*, and being careful with `rm`, saves you from the two most common beginner disasters.

  - kind: recap
    body: |
      - The **terminal** is the window; the **shell** (zsh on a Mac) reads your commands.
      - A path is **absolute** (starts with `/` or `~`) or **relative** to the current folder. `.` is here, `..` is up, `~` is home.
      - `pwd`, `ls`, `cd`, `mkdir`, `touch`, `cp`, `mv`, `rm`. **Tab** completes names and **↑** repeats history.
      - `rm` deletes permanently, and `rm -rf` deletes folders silently. Check `pwd` first.
      - The classic mistake is running a command in the wrong folder.
