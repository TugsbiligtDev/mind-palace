questions:
  - type: predict
    prompt: What does this print?
    code: |
      a = 5
      b = a
      a = 10
      print(a, b)
    options: ["10 5", "10 10", "5 5", "5 10"]
    answer: 0
    explanation: "`b = a` makes `b` point at 5. Later `a` is re-pointed at 10, but `b` still points at 5."
  - type: predict
    prompt: What does this print?
    code: |
      print(0.1 + 0.2 == 0.3)
    options: ["False", "True", "0.3", "Error"]
    answer: 0
    explanation: Floats are stored in binary and are slightly inexact, so the sum is 0.30000000000000004, not exactly 0.3.
  - type: predict
    prompt: What does this print?
    code: |
      print(type("5"), type(5))
    options: ["<class 'str'> <class 'int'>", "<class 'int'> <class 'int'>", "<class 'str'> <class 'str'>", "<class 'int'> <class 'str'>"]
    answer: 0
    explanation: Quotes make it text (`str`), even when it looks like a number.
  - type: mcq
    prompt: Which is the correct PEP 8 name for a variable holding a customer's first name?
    options: ["FirstName", "first_name", "first-name", "1st_name"]
    answer: 1
    explanation: "Variables use snake_case. `first-name` would be read as a subtraction, and a name cannot start with a digit."
