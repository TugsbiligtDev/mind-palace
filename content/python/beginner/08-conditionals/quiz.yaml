    prompt: Which check is best practice for a value that might be `None`?
    options: ["if value == None:", "if value is None:", "if value = None:", "if value.None:"]
    answer: 1
    explanation: "Use `is` for `None`. A single `=` would be an assignment, which is a SyntaxError inside an `if`."
