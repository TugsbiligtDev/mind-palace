steps:
  - kind: explain
    title: "Tuples: a fixed group"
    body: |
      A **tuple** is like a list that **cannot be changed** after you make it. It uses round brackets:

      ```python
      point = (3, 4)
      person = ("Ada", 34, "London")
      one = (5,)         # a one-item tuple needs the trailing comma
      ```

      Indexing and slicing work just like lists (`point[0]` is `3`). But `point[0] = 9` is a `TypeError`.

      Why use one? A tuple says "these values belong together and will not change": a coordinate, an RGB colour, a name and age. Functions that return **two or more values** return a tuple, and you can unpack it straight into names:

      ```python
      x, y = point
      ```

      Because tuples never change, they can be used as **dictionary keys** (next lesson) and stored in sets. Lists cannot.

  - kind: code
    title: Try tuples
    body: |
      Run this. Then try to assign `point[0] = 9` and read the error.
    code: |
      point = (3, 4)
      x, y = point
      print(x, y)
      print(point[0], len(point))

      def min_max(numbers):
          return (min(numbers), max(numbers))

      low, high = min_max([5, 2, 9, 1])
      print(low, high)

  - kind: code
    title: Swap a pair
    body: |
      Finish `swap_pair(pair)`: given a tuple of two values, return a new tuple with them **swapped**. `swap_pair((1, 2))` is `(2, 1)`.

      Unpack first: `a, b = pair`.
    code: |
      def swap_pair(pair):
          return pair
    tests:
      - "swap_pair((1, 2))"
      - "swap_pair(('a', 'b'))"
      - "swap_pair((5, 5))"
    solution: |
      def swap_pair(pair):
          a, b = pair
          return (b, a)
    hint: "`a, b = pair` then `return (b, a)`."
    reject:
      - |
        def swap_pair(pair):
            return (pair[0], pair[0])

  - kind: code
    title: Range of a list
    body: |
      Finish `spread(numbers)`: return a tuple `(smallest, largest)` for a non-empty list. `spread([5, 2, 9, 1])` is `(1, 9)`. The built-ins `min()` and `max()` help.
    code: |
      def spread(numbers):
          return (0, 0)
    tests:
      - "spread([5, 2, 9, 1])"
      - "spread([7])"
      - "spread([-3, -8, 0])"
    solution: |
      def spread(numbers):
          return (min(numbers), max(numbers))
    hint: "`return (min(numbers), max(numbers))`."
    reject:
      - |
        def spread(numbers):
            return (numbers[0], numbers[-1])

  - kind: explain
    title: "Sets: no duplicates, fast lookups"
    body: |
      A **set** is a collection of **unique** values, with no order and no positions. It uses curly brackets:

      ```python
      tags = {"crime", "london", "crime"}     # duplicates vanish
      print(tags)                              # {'crime', 'london'}  (any order)
      ```

      Turn any list into a set to remove repeats: `set([1, 2, 2, 3])` is `{1, 2, 3}`.

      Sets have two big strengths:

      1. **Uniqueness**: perfect for "how many different X?".
      2. **Speed**: `x in some_set` is answered almost instantly, even with millions of items. On a list, Python has to look at items one by one. (Module 21 explains why.)

      Add and remove with `s.add(x)` and `s.discard(x)`.

  - kind: code
    title: Unique and sorted
    body: |
      Finish `unique_sorted(items)`: return a list of the distinct values, sorted from smallest to largest. `unique_sorted([3, 1, 3, 2, 1])` is `[1, 2, 3]`.

      Sets have no order, so convert to a set (removes repeats), then use `sorted(...)`, which gives back a list.
    code: |
      def unique_sorted(items):
          return items
    tests:
      - "unique_sorted([3, 1, 3, 2, 1])"
      - "unique_sorted([])"
      - "unique_sorted(['b', 'a', 'b'])"
      - "unique_sorted([5])"
    solution: |
      def unique_sorted(items):
          return sorted(set(items))
    hint: "`sorted(set(items))`."
    reject:
      - |
        def unique_sorted(items):
            return sorted(items)

  - kind: explain
    title: Set maths
    body: |
      Sets combine like circles in a Venn diagram:

      ```python
      a = {"ada", "moth", "bold"}
      b = {"moth", "reed"}

      a | b        # union: in either        {'ada','moth','bold','reed'}
      a & b        # intersection: in both   {'moth'}
      a - b        # difference: in a, not b {'ada','bold'}
      a ^ b        # symmetric difference: in exactly one
      ```

      Words work too: `a.union(b)`, `a.intersection(b)`, `a.difference(b)`.

      **The classic mistake:** `{}` is an **empty dictionary**, not an empty set! An empty set must be written `set()`.

  - kind: code
    title: Who is in both lists?
    body: |
      Finish `shared(a, b)`: two lists of names go in; return a **sorted list** of the names that appear in **both**. `shared(["ada", "moth"], ["moth", "reed"])` is `["moth"]`.
    code: |
      def shared(a, b):
          return []
    tests:
      - "shared(['ada', 'moth'], ['moth', 'reed'])"
      - "shared(['a', 'b'], ['c'])"
      - "shared([], ['a'])"
      - "shared(['x', 'y', 'x'], ['y', 'x'])"
    solution: |
      def shared(a, b):
          return sorted(set(a) & set(b))
    hint: "`&` keeps what both sets have. Wrap in `sorted` to get a list."
    reject:
      - |
        def shared(a, b):
            return sorted(set(a) | set(b))

  - kind: code
    title: Who is new?
    body: |
      Finish `new_visitors(today, before)`: the names in `today` that were **not** in `before`, as a sorted list. `new_visitors(["ada", "reed"], ["ada"])` is `["reed"]`.
    code: |
      def new_visitors(today, before):
          return []
    tests:
      - "new_visitors(['ada', 'reed'], ['ada'])"
      - "new_visitors(['ada'], ['ada'])"
      - "new_visitors([], ['ada'])"
      - "new_visitors(['b', 'a', 'a'], [])"
    solution: |
      def new_visitors(today, before):
          return sorted(set(today) - set(before))
    hint: "Set difference: `-`."
    reject:
      - |
        def new_visitors(today, before):
            return sorted(set(before) - set(today))

  - kind: code
    title: The empty set trap
    body: |
      `empty_tags()` should return an **empty set**. The starter returns `{}`, which is an empty *dictionary*. Fix it.
    code: |
      def empty_tags():
          return {}
    tests:
      - "empty_tags()"
      - "type(empty_tags()).__name__"
    solution: |
      def empty_tags():
          return set()
    hint: "An empty set is written `set()`."
    broken_starter: true

  - kind: why
    body: |
      Sets turn slow "search the whole list" work into instant lookups, and set maths answers questions like "who is in both groups?" in one line. Tuples make it explicit which data is fixed. Choosing the right container is half of writing good Python.

  - kind: recap
    body: |
      - A **tuple** `(a, b)` is an immutable sequence, ideal for fixed groups, multiple return values and dictionary keys.
      - A **set** `{a, b}` keeps unique values, unordered, with very fast `in` checks.
      - Set maths: `|` union, `&` intersection, `-` difference, `^` either-but-not-both.
      - `{}` is an empty **dict**. An empty set is `set()`.
