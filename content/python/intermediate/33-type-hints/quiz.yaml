    prompt: What does this print?
    code: |
      def double(x: int) -> int:
          return x * 2

      print(double("ab"))
    options: ["abab", "Error: expected int", "ab", "4"]
    answer: 0
    explanation: "Type hints are not enforced at runtime, so Python multiplies the text by 2. Only a type checker would flag it."
