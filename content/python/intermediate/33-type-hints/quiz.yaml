  - type: predict
    prompt: What does this print?
    code: |
      from typing import TypedDict

      class Book(TypedDict):
          title: str
          year: int

      b: Book = {"title": "Dune", "year": 1965}
      print(type(b).__name__, b["year"])
    options: ["dict 1965", "Book 1965", "TypedDict 1965", "Error"]
    answer: 0
    explanation: "A TypedDict is a plain `dict` at runtime. The class only describes its shape for checkers."
  - type: fill
