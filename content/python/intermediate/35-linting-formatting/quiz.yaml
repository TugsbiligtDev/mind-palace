questions:
  - type: mcq
    prompt: What is the difference between a linter and a formatter?
    options:
      - A linter reports likely mistakes; a formatter rewrites layout to a standard style
      - A formatter finds likely bugs; a linter fixes spacing and line breaks for you
      - They are the same thing; Ruff and Black are just two different brand names
      - A linter only checks test files; a formatter checks all the other Python files
    answer: 0
    explanation: Ruff does both jobs, with `ruff check` (lint) and `ruff format` (format).
  - type: mcq
    prompt: What does the Ruff rule code F401 mean?
    options: [An imported name is never used, A line is longer than the limit, A name is used but never defined, The imports are not in sorted order]
    answer: 0
    explanation: "`F401` flags an unused import. `F821` would be an undefined name, and `I001` unsorted imports."
  - type: mcq
    prompt: Which is the best name for a boolean variable?
    options: ["is_valid", "flag", "x", "validity_status_boolean_value"]
    answer: 0
    explanation: Boolean names read as questions, so `if is_valid:` reads like English.
