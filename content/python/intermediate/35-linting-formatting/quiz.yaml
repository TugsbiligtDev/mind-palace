    prompt: What is a pre-commit hook for?
    options:
      - It runs checks on every git commit and can refuse a commit that fails
      - It backs up your files to GitHub before every commit you make
      - It pushes your code to GitHub automatically after each commit
      - It installs the packages listed in pyproject.toml before committing
    answer: 0
