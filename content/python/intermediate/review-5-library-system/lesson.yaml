    tests:
      - "str(Book('1', 'Dune', 'Herbert'))"
      - "m = Member('Ada')\nm.borrowed = ['1', '2']\nresult = str(m)"
      - "str(Library())"
      - "lib = Library()\nlib.add_book(Book('2', 'Emma', 'Austen', 1))\nlib.add_book(Book('1', 'Dune', 'Herbert', 2))\nresult = (len(lib), str(lib))"
      - "lib = Library()\nlib.add_book(Book('1', 'Dune', 'Herbert', 2))\nlib.checkout(Member('A'), '1')\nresult = str(lib)"
    solution: |
      from dataclasses import dataclass


      class LibraryError(Exception):
          """Raised when a library rule is broken."""


      @dataclass
      class Book:
          isbn: str
          title: str
          author: str
          copies: int = 1

          def __str__(self):
              return f"{self.title} by {self.author}"


      class Member:
          LIMIT = 3

          def __init__(self, name):
              self.name = name
              self.borrowed = []

          def can_borrow(self):
              return len(self.borrowed) < self.LIMIT

          def __str__(self):
              return f"{self.name} ({len(self.borrowed)} borrowed)"


      class Library:
          def __init__(self):
              self._books = {}
              self._loans = {}

          def add_book(self, book):
              if book.isbn in self._books:
                  self._books[book.isbn].copies += book.copies
              else:
                  self._books[book.isbn] = book

          def find(self, isbn):
              if isbn not in self._books:
                  raise LibraryError("no such book")
              return self._books[isbn]

          def available(self, isbn):
              return self.find(isbn).copies - self._loans.get(isbn, 0)

          def checkout(self, member, isbn):
              self.find(isbn)
              if isbn in member.borrowed:
                  raise LibraryError("already borrowed")
              if not member.can_borrow():
                  raise LibraryError("limit reached")
              if self.available(isbn) <= 0:
                  raise LibraryError("no copies left")
              member.borrowed.append(isbn)
              self._loans[isbn] = self._loans.get(isbn, 0) + 1

          def __len__(self):
              return len(self._books)

          def __str__(self):
              if not self._books:
                  return "(empty)"
              books = sorted(self._books.values(), key=lambda b: b.title)
              return "\n".join(
                  f"{b.title} ({self.available(b.isbn)}/{b.copies} available)" for b in books
              )
    hint: "Add `__str__` to `Book` and `Member`, and `__len__` and `__str__` to `Library`. Sort with `sorted(self._books.values(), key=lambda b: b.title)`: `key=` says what to sort by, and `lambda b: b.title` is a one-line function giving each book's title (Module 26 explains it)."
    reject:
      - |
        from dataclasses import dataclass


        class LibraryError(Exception):
            pass


        @dataclass
        class Book:
            isbn: str
            title: str
            author: str
            copies: int = 1


        class Member:
            def __init__(self, name):
                self.name = name
                self.borrowed = []


        class Library:
            def __init__(self):
                self._books = {}

            def add_book(self, book):
                self._books[book.isbn] = book

  - kind: mac
    title: Run it on your Mac
    body: |
      Save the finished classes in a file and try them from a small script. (Use your own working code from the cases above.) This checkpoint is for you: when you have run a borrow, a return and printed the library, press *I ran it*.
    commands: |
      mkdir -p ~/Desktop/library && cd ~/Desktop/library
      # save your Book, Member and Library classes as library.py, then:
      cat > demo.py <<'PY'
      from library import Book, Library, Member

      lib = Library()
      lib.add_book(Book("1", "Dune", "Herbert", 2))
      ada = Member("Ada")
      lib.checkout(ada, "1")
      print(ada)
      print(lib)
      print("fine:", lib.return_book(ada, "1", days_late=3))
      PY
      uv run demo.py

  - kind: why
    body: |
      You just built a small but real domain model: a data class for records, classes with state and rules, a custom error, composition (the library holds books and tracks loans), and readable output. Every business program, from a shop to a game, is built the same way.

  - kind: recap
    body: |
      - The **Part 6 checkpoint**: Book (dataclass), Member and Library with borrowing/return rules and custom `__str__`.
      - Keep **rules in one place** (the Library), raise a **specific exception class** for rule violations, and keep per-object lists in `__init__`.
      - `@staticmethod` for helpers that need no object (`fine`), dunder methods for natural output.
