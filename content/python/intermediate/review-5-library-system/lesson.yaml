            isbn: str
            title: str
            author: str
            copies: int = 1


        class Member:
            LIMIT = 3

            def __init__(self, name):
                self.name = name
                self.borrowed = []

            def can_borrow(self):
                return len(self.borrowed) < self.LIMIT


        class Library:
            def __init__(self):
                self._books = {}
                self._loans = {}

            def add_book(self, book):
                self._books[book.isbn] = book

            def find(self, isbn):
                if isbn not in self._books:
                    raise LibraryError("no such book")
                return self._books[isbn]

            def available(self, isbn):
                return self.find(isbn).copies - self._loans.get(isbn, 0)

            def checkout(self, member, isbn):
                self.find(isbn)
                member.borrowed.append(isbn)
                self._loans[isbn] = self._loans.get(isbn, 0) + 1

  - kind: code
    title: "4. Returns and late fines"
    body: |
      Add `return_book(member, isbn, days_late=0)` to `Library`. If the member does not hold that book, raise `LibraryError("not borrowed")`. Otherwise remove it from `member.borrowed`, free the copy, and **return the fine in cents**: 25 cents per day late, **capped at 1000**. On time (0 days) the fine is `0`.

      Add a `@staticmethod` `fine(days_late)` that computes the fine, and use it.
    code: |
      from dataclasses import dataclass


      class LibraryError(Exception):
          """Raised when a library rule is broken."""


      @dataclass
      class Book:
          isbn: str
          title: str
          author: str
          copies: int = 1


      class Member:
          LIMIT = 3

          def __init__(self, name):
              self.name = name
              self.borrowed = []

          def can_borrow(self):
              return len(self.borrowed) < self.LIMIT


      class Library:
          def __init__(self):
              self._books = {}
              self._loans = {}

          def add_book(self, book):
              if book.isbn in self._books:
                  self._books[book.isbn].copies += book.copies
              else:
                  self._books[book.isbn] = book

          def find(self, isbn):
              if isbn not in self._books:
                  raise LibraryError("no such book")
              return self._books[isbn]

          def available(self, isbn):
              return self.find(isbn).copies - self._loans.get(isbn, 0)

          def checkout(self, member, isbn):
              self.find(isbn)
              if isbn in member.borrowed:
                  raise LibraryError("already borrowed")
              if not member.can_borrow():
                  raise LibraryError("limit reached")
              if self.available(isbn) <= 0:
                  raise LibraryError("no copies left")
              member.borrowed.append(isbn)
              self._loans[isbn] = self._loans.get(isbn, 0) + 1
    tests:
      - "Library.fine(0)"
      - "Library.fine(3)"
      - "Library.fine(100)"
      - "lib = Library()\nlib.add_book(Book('1', 'D', 'H', 1))\nm = Member('A')\nlib.checkout(m, '1')\nfine = lib.return_book(m, '1', 4)\nresult = (fine, m.borrowed, lib.available('1'))"
      - "lib = Library()\nlib.add_book(Book('1', 'D', 'H', 1))\nm = Member('A')\ntry:\n    lib.return_book(m, '1')\nexcept LibraryError as e:\n    result = str(e)"
      - "lib = Library()\nlib.add_book(Book('1', 'D', 'H', 1))\na = Member('A')\nb = Member('B')\nlib.checkout(a, '1')\nlib.return_book(a, '1')\nlib.checkout(b, '1')\nresult = b.borrowed"
    solution: |
      from dataclasses import dataclass


      class LibraryError(Exception):
          """Raised when a library rule is broken."""


      @dataclass
      class Book:
          isbn: str
          title: str
          author: str
          copies: int = 1


      class Member:
          LIMIT = 3

          def __init__(self, name):
              self.name = name
              self.borrowed = []

          def can_borrow(self):
              return len(self.borrowed) < self.LIMIT


      class Library:
          def __init__(self):
              self._books = {}
              self._loans = {}

          def add_book(self, book):
              if book.isbn in self._books:
                  self._books[book.isbn].copies += book.copies
              else:
                  self._books[book.isbn] = book

          def find(self, isbn):
              if isbn not in self._books:
                  raise LibraryError("no such book")
              return self._books[isbn]

          def available(self, isbn):
              return self.find(isbn).copies - self._loans.get(isbn, 0)

          def checkout(self, member, isbn):
              self.find(isbn)
              if isbn in member.borrowed:
                  raise LibraryError("already borrowed")
              if not member.can_borrow():
                  raise LibraryError("limit reached")
              if self.available(isbn) <= 0:
                  raise LibraryError("no copies left")
              member.borrowed.append(isbn)
              self._loans[isbn] = self._loans.get(isbn, 0) + 1

          @staticmethod
          def fine(days_late):
              return min(max(days_late, 0) * 25, 1000)

          def return_book(self, member, isbn, days_late=0):
              if isbn not in member.borrowed:
                  raise LibraryError("not borrowed")
              member.borrowed.remove(isbn)
              self._loans[isbn] -= 1
              return self.fine(days_late)
    hint: "`fine` is `min(days_late * 25, 1000)`. In `return_book`, check membership first, then `member.borrowed.remove(isbn)` and reduce the loan count."
    reject:
      - |
        from dataclasses import dataclass


        class LibraryError(Exception):
            pass


        @dataclass
        class Book:
            isbn: str
            title: str
            author: str
            copies: int = 1


        class Member:
            LIMIT = 3

            def __init__(self, name):
                self.name = name
                self.borrowed = []

            def can_borrow(self):
                return len(self.borrowed) < self.LIMIT


        class Library:
            def __init__(self):
                self._books = {}
                self._loans = {}

            def add_book(self, book):
                self._books[book.isbn] = book

            def find(self, isbn):
                return self._books[isbn]

            def available(self, isbn):
                return self._books[isbn].copies - self._loans.get(isbn, 0)

            def checkout(self, member, isbn):
                member.borrowed.append(isbn)
                self._loans[isbn] = self._loans.get(isbn, 0) + 1

            @staticmethod
            def fine(days_late):
                return days_late * 25

            def return_book(self, member, isbn, days_late=0):
                member.borrowed.remove(isbn)
                self._loans[isbn] -= 1
                return self.fine(days_late)

  - kind: code
    title: "5. Custom string output"
    body: |
      Finish the system with readable output. Add:

      - `Book.__str__` giving `"Dune by Herbert"` (a dataclass keeps its own `__repr__`).
      - `Member.__str__` giving `"Ada (2 borrowed)"`.
      - `Library.__len__`: the number of **distinct titles** it owns.
      - `Library.__str__`: one line per book, **sorted by title**, like `"Dune (1/2 available)"` (available / owned), joined with newlines. An empty library gives `"(empty)"`.
    code: |
      from dataclasses import dataclass


      class LibraryError(Exception):
          """Raised when a library rule is broken."""


      @dataclass
      class Book:
          isbn: str
          title: str
