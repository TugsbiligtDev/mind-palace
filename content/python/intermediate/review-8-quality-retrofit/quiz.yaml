questions:
  - type: mcq
    prompt: A test suite passes on your code and also passes when you deliberately break the code. What does that tell you?
    options:
      - The suite isn't testing that behaviour, so it gives false confidence
      - The code must be perfect, since even broken versions pass the tests
      - The tests are too strict and should be loosened before going on
      - "Nothing: tests are only meant to catch syntax errors, not logic"
    answer: 0
    explanation: Tests are only valuable if they can fail. Mutation checks find the gaps.
  - type: predict
    prompt: What does this print?
    code: |
