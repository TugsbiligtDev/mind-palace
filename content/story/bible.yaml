# The story bible: the fixed world every case is written in. Claude reads this before
# writing any case so characters, tone and the season threads stay consistent.
agency: The Mind Palace Detective Agency
client: Wanderly Travel Co.
premise: |
  Wanderly is a small trip-planning company. Lately its records have stopped adding up:
  a booking that looks too cheap, a traveler nobody can reach, refunds nobody remembers
  approving. Someone with access to the company database has been quietly rewriting
  history, and signs their notes **~C**.

  Wanderly keeps everything in a PostgreSQL database called `learn_sql`. The agency
  can't interview a database, but you can *query* it. Learn its language, follow the
  evidence, and find out who the Cartographer is.
cast:
  - name: You
    role: The detective (the learner)
    voice: Curious, careful, learns by trying things.
  - name: Inspector Odval Bold
    role: Mentor and head of the agency
    voice: Calm and precise. Short sentences. Favorite line, "Data doesn't lie, but it can be made to mislead."
  - name: Moth
    role: Informant (gives the three hints in every case)
    voice: A former Wanderly night-shift archivist. Nervous, kind, speaks in quick practical tips.
  - name: The Cartographer (~C)
    role: Season 1 antagonist
    voice: Never seen directly. Leaves smug signed notes in the data. Revealed in the Season 1 finale.
season_threads:
  - season: 1
    summary: |
      Dulguun Erdene's "Europe Grand Tour" (trip 5) was altered after the fact: the Rome stop
      (trip_stop_id 7) was cut to 1 night at 60.00, and fake refunds were approved against it.
      Clues across the season: the ~C signatures in the guest book, a garbled telegram
      ("FOLLOW THE COST PER NIGHT"), the suspiciously cheap Rome night, sightings proving Dulguun
      stayed in Rome for days, a 300.00 Rome hotel receipt, a hotel folio showing a 5-night stay,
      staff logins pointing at Gerel Tsog (Operations), and refunds approved by login gtsog.
      Finale: restore the record and name the culprit, Gerel Tsog.
