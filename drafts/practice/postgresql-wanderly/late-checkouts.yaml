difficulty: medium
topic: postgresql/beginner/06-querying-one-table
concepts: [BETWEEN, ORDER BY, multi-column sort]
title: The Late Checkouts
briefing: |
  During the first week of April, someone at the Blue Sky Hotel left a window open and the
  pipes froze. The manager wants to talk to everyone who **checked out that week**, in the
  order they left.
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.checkouts (
      stay_id      INTEGER PRIMARY KEY,
      guest        TEXT NOT NULL,
      room         INTEGER NOT NULL,
      checked_out  DATE NOT NULL
  );
  INSERT INTO evidence.checkouts VALUES
  (1, 'Rafael Costa',   301, '2026-03-31'),
  (2, 'Enkhjin Bat',    214, '2026-04-01'),
  (3, 'Greta Holm',     118, '2026-04-03'),
  (4, 'Aiko Mori',      305, '2026-04-03'),
  (5, 'Yusuf Demir',    220, '2026-04-07'),
  (6, 'Beatrice Lowe',  101, '2026-04-08'),
  (7, 'Ankhbayar D.',   302, '2026-04-05'),
  (8, 'Colm Ryan',      110, '2026-04-03');
clues:
  - "`evidence.checkouts`: `stay_id`, `guest`, `room`, `checked_out` (a date)."
  - "\"The first week of April\" means **2026-04-01 to 2026-04-07, both days included**."
task: |
  Return **`guest`, `room`, `checked_out`** for everyone who checked out in the first week of April,

  - sorted by **`checked_out`, earliest first**,
  - and, for people who left on the **same day**, by **`guest` A to Z**.

  Order matters: the grader checks the rows *in order*.
starter: |
  SELECT guest, room, checked_out
  FROM evidence.checkouts
  WHERE checked_out > '2026-04-01' AND checked_out < '2026-04-07'
  ORDER BY checked_out;
check:
  mode: result
  ordered: true
  solution: |
    SELECT guest, room, checked_out
    FROM evidence.checkouts
    WHERE checked_out BETWEEN '2026-04-01' AND '2026-04-07'
    ORDER BY checked_out, guest;
hints:
  - "Run the starter. Are April 1 and April 7 in the result? They should be."
  - "`>` and `<` leave out the end days. `BETWEEN … AND …` includes both ends. Then look at April 3: three guests, in what order?"
  - "`WHERE checked_out BETWEEN '2026-04-01' AND '2026-04-07' ORDER BY checked_out, guest`"
reveal: |
  Six guests, from Enkhjin Bat on April 1 to Yusuf Demir on April 7. Three left on April 3:
  **Aiko Mori, Colm Ryan, Greta Holm**.

  Greta Holm was in room 118, right above the frozen pipe. She remembers "airing out the
  room" before she left. Mystery solved, window closed.
