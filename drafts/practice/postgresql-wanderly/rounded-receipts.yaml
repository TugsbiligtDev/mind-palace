difficulty: medium
topic: postgresql/beginner/09-functions
concepts: [casting, numeric, round]
title: The Rounded Receipts
briefing: |
  A currency exchange booth exported its payments as **text**, with three decimal places.
  The accountant needs them as real numbers, **rounded to cents**, before she can reconcile anything.
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.fx_payments (
      payment_id   INTEGER PRIMARY KEY,
      customer     TEXT NOT NULL,
      amount_text  TEXT NOT NULL
  );
  INSERT INTO evidence.fx_payments VALUES
  (1, 'Ivy Chen',     '12.499'),
  (2, 'Oskar Lund',   '87.125'),
  (3, 'Nandin Ts.',   '5.004'),
  (4, 'Ruth Adeyemi', '100.995'),
  (5, 'Pavel Novak',  '42.500');
clues:
  - "`evidence.fx_payments`: `payment_id`, `customer`, `amount_text` (text, not a number)."
  - "`round()` works on numbers, not text. Money should be `numeric`, never a float."
task: |
  Return **`payment_id`** and **`amount`**: the text amount converted to **`numeric`** and
  **rounded to 2 decimal places**.
starter: |
  SELECT payment_id, amount_text AS amount
  FROM evidence.fx_payments;
check:
  mode: result
  solution: |
    SELECT payment_id, round(amount_text::numeric, 2) AS amount
    FROM evidence.fx_payments;
hints:
  - "Right now `amount` is still text: `12.499`. First turn it into a number."
  - "Cast with `::numeric`, then wrap the whole thing in `round(…, 2)`."
  - "`round(amount_text::numeric, 2) AS amount`"
reveal: |
  12.50, 87.13, 5.00, **101.00** and 42.50. (`numeric` rounds halves *away from zero*, so
  87.125 becomes 87.13 and 100.995 becomes 101.00.)

  Ruth Adeyemi's receipt said 100.99, though. The booth's old till had been cutting off the
  extra digit instead of rounding, a cent here, a cent there, for years. The accountant
  starts adding up the cents.
