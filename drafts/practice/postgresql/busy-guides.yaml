difficulty: medium
topic: postgresql/beginner/07-aggregation
concepts: [GROUP BY, COUNT, SUM]
title: The Busiest Guides
briefing: |
  A city tour company pays a bonus to its busiest guides, and three of them are claiming it.
  The tour log has every tour; the manager wants a summary **per guide**.
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.tour_log (
      tour_id    INTEGER PRIMARY KEY,
      guide      TEXT NOT NULL,
      tour_date  DATE NOT NULL,
      guests     INTEGER NOT NULL
  );
  INSERT INTO evidence.tour_log VALUES
  (1, 'Oyunaa', '2026-06-01', 12),
  (2, 'Felix',  '2026-06-01',  8),
  (3, 'Oyunaa', '2026-06-02', 15),
  (4, 'Marisol','2026-06-02', 20),
  (5, 'Felix',  '2026-06-03',  9),
  (6, 'Oyunaa', '2026-06-04',  6),
  (7, 'Felix',  '2026-06-05', 11),
  (8, 'Marisol','2026-06-06', 18);
clues:
  - "`evidence.tour_log`: `tour_id`, `guide`, `tour_date`, `guests`."
task: |
  Return **one row per guide** with three columns: **`guide`**, **`tours`** (how many tours
  they led) and **`guests`** (the total number of guests across their tours).
starter: |
  SELECT guide, count(*) AS tours
  FROM evidence.tour_log;
check:
  mode: result
  solution: |
    SELECT guide, count(*) AS tours, sum(guests) AS guests
    FROM evidence.tour_log
    GROUP BY guide;
hints:
  - "Run the starter and read the error: `guide` must appear in the GROUP BY clause…"
  - "You want one answer **per guide**. Add a `GROUP BY`, and add the total guests as a third column."
  - "`SELECT guide, count(*) AS tours, sum(guests) AS guests … GROUP BY guide`"
reveal: |
  | guide | tours | guests |
  |---|---|---|
  | Felix | 3 | 28 |
  | Marisol | 2 | 38 |
  | Oyunaa | 3 | 33 |

  Felix and Oyunaa led the most tours, but **Marisol** guided the most people, in just two.
  The manager splits the bonus three ways, which is what everyone wanted all along.
