difficulty: easy
topic: postgresql/beginner/10-aggregation
concepts: [COUNT, WHERE]
title: Count the Keys
briefing: |
  The Grand Steppe hotel is changing its locks, and the locksmith charges per missing key
  card. The front desk wants one number: **how many cards were never returned**.
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.key_cards (
      card_id    INTEGER PRIMARY KEY,
      room       INTEGER NOT NULL,
      issued_to  TEXT NOT NULL,
      returned   BOOLEAN NOT NULL
  );
  INSERT INTO evidence.key_cards VALUES
  (1, 101, 'Ines Moreau',  true),
  (2, 101, 'Ines Moreau',  false),
  (3, 207, 'Ganzorig T.',  true),
  (4, 210, 'Liam Byrne',   false),
  (5, 305, 'Ada Nwosu',    true),
  (6, 305, 'Ada Nwosu',    true),
  (7, 402, 'Chen Hao',     false),
  (8, 404, 'Mira Sen',     true);
clues:
  - "`evidence.key_cards`: `card_id`, `room`, `issued_to`, `returned` (true or false)."
task: |
  Return **one row, one column**: the **number** of key cards that were **not returned**.
starter: |
  SELECT count(*)
  FROM evidence.key_cards;
check:
  mode: result
  solution: |
    SELECT count(*)
    FROM evidence.key_cards
    WHERE returned = false;
hints:
  - "The starter counts every card. You only want some of them counted."
  - "Filter the rows first with `WHERE`, then `count(*)` counts what's left."
  - "`WHERE returned = false` (or `WHERE NOT returned`)."
reveal: |
  **3** cards are missing: rooms 101, 210 and 402. The locksmith's bill is a lot smaller than
  the manager feared, and Ines Moreau finds her spare card in her coat pocket a week later.
