difficulty: medium
topic: postgresql/beginner/07-null
concepts: [date arithmetic, IS NOT NULL]
title: How Long Was the Trip?
briefing: |
  Wanderly's marketing team wants to advertise "our trips last **X** days on average", and
  asks the agency for each trip's length. One trip has no end date yet, and they don't want a
  blank in their spreadsheet.
evidence_setup: ""
clues:
  - "`trips`: `trip_id`, `traveler_id`, `trip_name`, `start_date`, `end_date` (NULL if not set yet), `status`."
  - Subtracting one `date` from another gives a whole number of days.
task: |
  For every trip that **has an end date**, return **`trip_id`, `trip_name`**, and **`days`**:
  the end date minus the start date.
starter: |
  SELECT trip_id, trip_name, end_date - start_date AS days
  FROM trips;
check:
  mode: result
  solution: |
    SELECT trip_id, trip_name, end_date - start_date AS days
    FROM trips
    WHERE end_date IS NOT NULL;
hints:
  - "Run the starter. The arithmetic already works. Which row has an empty `days`?"
  - "Anything minus NULL is NULL. Leave that trip out with a `WHERE`."
  - "`WHERE end_date IS NOT NULL`"
reveal: |
  Six trips, from **6 days** (Paris Solo Trip) to **19 days** (Europe Grand Tour). The
  Weekend in Paris has no end date, so it's left out rather than counted as zero.

  "An unknown is not a zero," Bold reminds the marketing team. They put that on a poster too.
