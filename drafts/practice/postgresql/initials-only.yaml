difficulty: medium
topic: postgresql/beginner/06-functions
concepts: [substring, split_part, upper, "||"]
title: Initials Only
briefing: |
  Witnesses in a court case must be listed by **initials only**, like `A.L.`. The court clerk
  typed the full names in a hurry, all lowercase.
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.witnesses (
      witness_id  INTEGER PRIMARY KEY,
      full_name   TEXT NOT NULL
  );
  INSERT INTO evidence.witnesses VALUES
  (1, 'amara lee'),
  (2, 'bat-erdene ganbaatar'),
  (3, 'olga smirnova'),
  (4, 'kenji watanabe'),
  (5, 'zoe martin');
clues:
  - "`evidence.witnesses`: `witness_id`, `full_name` (first name, one space, surname)."
  - "`split_part(t, ' ', 1)` is the first word, `split_part(t, ' ', 2)` the second. `substring(t, 1, 1)` is the first letter."
task: |
  Return **`witness_id`** and **`initials`**: the first letter of the first name and the first
  letter of the surname, **uppercase**, each followed by a full stop. For example, `amara lee`
  becomes **`A.L.`**
starter: |
  SELECT witness_id, upper(full_name) AS initials
  FROM evidence.witnesses;
check:
  mode: result
  solution: |
    SELECT witness_id,
           upper(substring(split_part(full_name, ' ', 1), 1, 1)) || '.' ||
           upper(substring(split_part(full_name, ' ', 2), 1, 1)) || '.' AS initials
    FROM evidence.witnesses;
hints:
  - "Break it into pieces: first word, first letter of it, uppercase. Then the same for the second word."
  - "`substring(split_part(full_name, ' ', 1), 1, 1)` is the first initial. Wrap it in `upper()`."
  - "Glue four pieces with `||`: initial one, `'.'`, initial two, `'.'`."
reveal: |
  A.L., B.G., O.S., K.W., Z.M.

  Witness 2's first name, *bat-erdene*, has a hyphen but no space, so `split_part` treats it
  as one word and the initial is just **B**. That's how the court wants it. One more
  reason to always look at the real data before trusting a pattern.
