difficulty: medium
topic: postgresql/beginner/08-writing-data
concepts: [INSERT, multi-row insert]
title: Lost and Found
briefing: |
  Two items were handed in at the Zaya Guesthouse this morning, and the owner wants them in
  the lost-and-found table before the guests come asking.
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.lost_and_found (
      item_id   INTEGER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      item      TEXT NOT NULL,
      found_in  TEXT NOT NULL,
      found_on  DATE NOT NULL
  );
  INSERT INTO evidence.lost_and_found (item, found_in, found_on) VALUES
  ('Umbrella',     'Lobby',     '2026-09-20'),
  ('Phone charger', 'Room 4',   '2026-09-22');
clues:
  - "`evidence.lost_and_found`: `item_id` (numbered automatically, so don't supply it), `item`, `found_in`, `found_on`."
task: |
  Add exactly these **two** rows:

  | item | found_in | found_on |
  |---|---|---|
  | `Blue scarf` | `Breakfast room` | `2026-09-25` |
  | `Reading glasses` | `Room 7` | `2026-09-25` |

  The grader checks the **state of the table** afterwards. Every **Run** starts from fresh
  data, so put a checking `SELECT` *below* your `INSERT` and run them together.
starter: |
  SELECT * FROM evidence.lost_and_found;
check:
  mode: state
  solution: |
    INSERT INTO evidence.lost_and_found (item, found_in, found_on) VALUES
    ('Blue scarf', 'Breakfast room', '2026-09-25'),
    ('Reading glasses', 'Room 7', '2026-09-25');
  state_query: |
    SELECT item, found_in, found_on::text
    FROM evidence.lost_and_found
    ORDER BY item;
hints:
  - "You're adding rows, so you need `INSERT INTO evidence.lost_and_found`."
  - "Name the three columns you're filling in, in brackets, and leave `item_id` out. It numbers itself."
  - "`INSERT INTO evidence.lost_and_found (item, found_in, found_on) VALUES ('Blue scarf', 'Breakfast room', '2026-09-25'), ('Reading glasses', 'Room 7', '2026-09-25');`"
reveal: |
  Four items on the shelf now. Within the hour a guest from room 7 comes down squinting, and
  the reading glasses go home. The fastest case the agency has ever closed.
