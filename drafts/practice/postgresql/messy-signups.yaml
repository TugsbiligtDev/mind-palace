difficulty: hard
topic: postgresql/beginner/09-functions
concepts: [trim, lower, COUNT DISTINCT]
title: How Many People, Really?
briefing: |
  A trekking club boasts about its sign-up numbers. A rival club says half of them are the
  same people signing up twice, with the email typed differently each time.

  The agency needs two numbers: how many **rows** there are, and how many **different people**,
  treating emails as the same when they only differ in **capitals or extra spaces**.
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.signups (
      signup_id  INTEGER PRIMARY KEY,
      email      TEXT NOT NULL
  );
  INSERT INTO evidence.signups VALUES
  (1, 'dorj@example.com'),
  (2, 'Dorj@Example.com'),
  (3, '  dorj@example.com '),
  (4, 'lisa@example.com'),
  (5, 'Tomas@example.com'),
  (6, 'tomas@example.com  '),
  (7, 'oyuna@example.com'),
  (8, 'LISA@EXAMPLE.COM');
clues:
  - "`evidence.signups`: `signup_id`, `email` (typed by hand)."
  - "`trim()` removes spaces at both ends, and `lower()` makes everything lowercase."
task: |
  Return **one row** with two columns:

  1. **`signups`**: the number of rows
  2. **`people`**: the number of **different** emails once each is **trimmed** and **lowercased**
starter: |
  SELECT count(*) AS signups, count(DISTINCT email) AS people
  FROM evidence.signups;
check:
  mode: result
  solution: |
    SELECT count(*) AS signups,
           count(DISTINCT lower(trim(email))) AS people
    FROM evidence.signups;
hints:
  - "The starter says 8 people. To PostgreSQL, `dorj@example.com` and `Dorj@Example.com` are different text."
  - "Clean each email *inside* the count: remove the spaces and fix the capitals first."
  - "`count(DISTINCT lower(trim(email)))`"
reveal: |
  **8 sign-ups, 4 people**: Dorj three times, Lisa twice, Tomas twice, Oyuna once.

  The club's poster said "8 new members this week". The rival club's poster now says "4",
  in much bigger letters.
