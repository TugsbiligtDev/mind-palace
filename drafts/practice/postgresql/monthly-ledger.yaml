difficulty: hard
topic: postgresql/beginner/07-aggregation
concepts: [date_trunc, GROUP BY, ORDER BY]
title: The Monthly Ledger
briefing: |
  A small ger-camp's owner is selling the business, and the buyer wants **bookings and revenue
  per month** for 2026. The owner has one long list of bookings and no idea how to summarize it.
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.bookings (
      booking_id  INTEGER PRIMARY KEY,
      guest       TEXT NOT NULL,
      booked_on   DATE NOT NULL,
      amount      NUMERIC(8,2) NOT NULL
  );
  INSERT INTO evidence.bookings VALUES
  ( 1, 'Otgon',   '2025-12-28', 120.00),
  ( 2, 'Weiss',   '2026-01-04', 240.00),
  ( 3, 'Kato',    '2026-01-19', 180.00),
  ( 4, 'Duarte',  '2026-02-02',  90.00),
  ( 5, 'Moreno',  '2026-03-11', 300.00),
  ( 6, 'Lkhagva', '2026-03-11', 150.00),
  ( 7, 'Novak',   '2026-03-30', 210.00),
  ( 8, 'Haddad',  '2026-01-31',  60.00);
clues:
  - "`evidence.bookings`: `booking_id`, `guest`, `booked_on`, `amount`."
  - "`date_trunc('month', booked_on)::date` turns any date into the first day of its month."
  - Only bookings **in 2026** count.
task: |
  Return **one row per month of 2026** that has bookings, with columns:

  1. **`month`**: the first day of the month, as a `date` (e.g. `2026-01-01`)
  2. **`bookings`**: how many bookings
  3. **`revenue`**: the total amount

  Sort by **`month`, earliest first**. Order matters: the grader checks the rows *in order*.
starter: |
  SELECT booked_on AS month, count(*) AS bookings, sum(amount) AS revenue
  FROM evidence.bookings
  GROUP BY booked_on
  ORDER BY month;
check:
  mode: result
  ordered: true
  solution: |
    SELECT date_trunc('month', booked_on)::date AS month,
           count(*) AS bookings,
           sum(amount) AS revenue
    FROM evidence.bookings
    WHERE EXTRACT(YEAR FROM booked_on) = 2026
    GROUP BY month
    ORDER BY month;
hints:
  - "The starter groups by the exact **day**, so March 11 and March 30 are separate groups. You want the month."
  - "Group by `date_trunc('month', booked_on)::date` instead, and don't forget to leave out December 2025."
  - "`SELECT date_trunc('month', booked_on)::date AS month, … WHERE EXTRACT(YEAR FROM booked_on) = 2026 GROUP BY month ORDER BY month`"
reveal: |
  | month | bookings | revenue |
  |---|---|---|
  | 2026-01-01 | 3 | 480.00 |
  | 2026-02-01 | 1 | 90.00 |
  | 2026-03-01 | 3 | 660.00 |

  February is suspiciously quiet. The owner admits the camp was closed for two weeks after a
  storm. The buyer knocks a little off the price, and everyone shakes hands.
