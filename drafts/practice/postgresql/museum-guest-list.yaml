difficulty: easy
topic: postgresql/beginner/03-where
concepts: [WHERE, IN]
title: The Museum Guest List
briefing: |
  A painting went missing during a traveling exhibition that visited three museums. The
  insurers want to interview everyone who visited **the Louvre or the Uffizi** that season.

  "A long chain of `OR`s is where mistakes hide," Bold says. "There's a tidier way to ask
  for *any of these*."
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.museum_visits (
      visit_id    INTEGER PRIMARY KEY,
      visitor     TEXT NOT NULL,
      museum      TEXT NOT NULL,
      visited_on  DATE NOT NULL
  );
  INSERT INTO evidence.museum_visits VALUES
  (1, 'Clara Voss',     'Louvre',        '2026-04-02'),
  (2, 'Ivan Petrov',    'Prado',         '2026-04-02'),
  (3, 'Nomin Bat',      'Uffizi',        '2026-04-05'),
  (4, 'Clara Voss',     'Uffizi',        '2026-04-09'),
  (5, 'Jae Park',       'Rijksmuseum',   '2026-04-11'),
  (6, 'Ivan Petrov',    'Louvre',        '2026-04-12'),
  (7, 'Amelie Durand',  'Musee d''Orsay', '2026-04-12');
clues:
  - "`evidence.museum_visits`: `visit_id`, `visitor`, `museum`, `visited_on`."
  - The museum names are stored exactly as `Louvre` and `Uffizi`.
task: |
  Return **all columns** for every visit to the **Louvre** or the **Uffizi**.
starter: |
  SELECT *
  FROM evidence.museum_visits
  WHERE museum = 'Louvre';
check:
  mode: result
  solution: |
    SELECT *
    FROM evidence.museum_visits
    WHERE museum IN ('Louvre', 'Uffizi');
hints:
  - "The starter only finds the Louvre. You need a second museum as well."
  - "You could write `museum = 'Louvre' OR museum = 'Uffizi'`, but there's a keyword that takes a list."
  - "`WHERE museum IN ('Louvre', 'Uffizi')`"
reveal: |
  Four visits, three people: **Clara Voss** (both museums), **Nomin Bat** and **Ivan Petrov**.

  Clara Voss visited *both*, a week apart, following the exhibition from city to city.
  The insurers call her first. She turns out to be the exhibition's own courier, which is
  either very innocent or very clever. That's a case for another day.
