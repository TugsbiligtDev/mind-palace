difficulty: easy
topic: postgresql/beginner/06-querying-one-table
concepts: [WHERE, ILIKE, wildcards]
title: A Name in the Register
briefing: |
  The Tuul River Lodge's guest register was typed up from handwriting. A guest called
  **Moss** is wanted as a witness, but every clerk spelled and capitalized the name differently.
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.register (
      line_no    INTEGER PRIMARY KEY,
      signature  TEXT NOT NULL,
      room       INTEGER NOT NULL
  );
  INSERT INTO evidence.register VALUES
  (1, 'J. Moss',        12),
  (2, 'Aria Chen',      14),
  (3, 'jonah moss',     12),
  (4, 'MOSSBERG, K.',   20),
  (5, 'Pedro Alves',    15),
  (6, 'Mrs. Moss-Hart', 18),
  (7, 'D. Amoss',       11);
clues:
  - "`evidence.register`: `line_no`, `signature`, `room`."
  - Bold wants **every** signature containing the letters *moss*, whatever the capitalization. She'll sort out who's who later.
task: |
  Return **all columns** for every line whose `signature` **contains `moss`** in **any capitalization**.
starter: |
  SELECT *
  FROM evidence.register
  WHERE signature LIKE '%Moss%';
check:
  mode: result
  solution: |
    SELECT *
    FROM evidence.register
    WHERE signature ILIKE '%moss%';
hints:
  - "Run the starter. It finds some Mosses but misses `jonah moss` and `MOSSBERG`. Why?"
  - "`LIKE` is case-sensitive. Its cousin with one extra letter isn't."
  - "`WHERE signature ILIKE '%moss%'`"
reveal: |
  Five lines. Lines **1 and 3** are the same man, Jonah Moss in room 12. **Mossberg**,
  **Moss-Hart** and **Amoss** are other guests who just happen to share the letters.

  "Cast a wide net, then sort the catch," Bold says, and sends Moth to room 12.
