difficulty: hard
topic: postgresql/beginner/09-functions
concepts: [EXTRACT, CASE, GROUP BY]
title: Night Shift, Day Shift
briefing: |
  A museum's badge readers log every door swipe. The director suspects the **night shift**
  is far busier than the rota says. Night means **before 06:00 or from 22:00 onwards**.
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.door_swipes (
      swipe_id   INTEGER PRIMARY KEY,
      badge      TEXT NOT NULL,
      swiped_at  TIMESTAMP NOT NULL
  );
  INSERT INTO evidence.door_swipes VALUES
  (1, 'B-17', '2026-05-10 05:59:00'),
  (2, 'B-04', '2026-05-10 06:00:00'),
  (3, 'B-17', '2026-05-10 13:45:00'),
  (4, 'B-22', '2026-05-10 21:59:00'),
  (5, 'B-22', '2026-05-10 22:00:00'),
  (6, 'B-09', '2026-05-11 02:30:00'),
  (7, 'B-17', '2026-05-11 03:10:00'),
  (8, 'B-04', '2026-05-11 09:15:00'),
  (9, 'B-09', '2026-05-11 23:40:00');
clues:
  - "`evidence.door_swipes`: `swipe_id`, `badge`, `swiped_at` (a timestamp)."
  - "`EXTRACT(HOUR FROM swiped_at)` gives the hour as a number from 0 to 23."
  - "06:00 exactly is **day**. 22:00 exactly is **night**."
task: |
  Return **two rows**, one per shift, with columns:

  1. **`shift`**: `night` or `day`
  2. **`swipes`**: how many swipes happened in that shift
starter: |
  SELECT CASE WHEN EXTRACT(HOUR FROM swiped_at) < 6 THEN 'night' ELSE 'day' END AS shift,
         count(*) AS swipes
  FROM evidence.door_swipes
  GROUP BY shift;
check:
  mode: result
  solution: |
    SELECT CASE
             WHEN EXTRACT(HOUR FROM swiped_at) < 6 OR EXTRACT(HOUR FROM swiped_at) >= 22 THEN 'night'
             ELSE 'day'
           END AS shift,
           count(*) AS swipes
    FROM evidence.door_swipes
    GROUP BY shift;
hints:
  - "The starter already groups by shift, but it thinks 22:00 and 23:40 are daytime."
  - "Night has **two** parts: early morning *or* late evening. Your `WHEN` needs both conditions, joined with `OR`."
  - "`WHEN EXTRACT(HOUR FROM swiped_at) < 6 OR EXTRACT(HOUR FROM swiped_at) >= 22 THEN 'night'`"
reveal: |
  **Night: 5 swipes. Day: 4.** The night shift, officially one guard, is busier than the whole day.

  Badge B-17 appears at 05:59, then 13:45, then again at 03:10 the next night. Nobody works
  both shifts. Someone has been borrowing that badge.
