difficulty: easy
topic: postgresql/beginner/02-select
concepts: [SELECT, DISTINCT]
title: The Porter's Ledger
briefing: |
  The Hotel Aurelia's night porter writes down every trip he makes with the luggage trolley.
  The manager thinks he's inventing trips to pad his hours.

  "Don't count his trips," Bold says. "Count the **rooms**. If he visited only a handful of
  different rooms, the ledger tells a very different story."
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.porter_log (
      entry_id  INTEGER PRIMARY KEY,
      room      INTEGER NOT NULL,
      guest     TEXT NOT NULL,
      bags      INTEGER NOT NULL
  );
  INSERT INTO evidence.porter_log VALUES
  (1, 204, 'Mrs. Lindqvist', 2),
  (2, 311, 'Mr. Okafor',     1),
  (3, 204, 'Mrs. Lindqvist', 1),
  (4, 108, 'Dr. Haddad',     3),
  (5, 311, 'Mr. Okafor',     2),
  (6, 204, 'Mrs. Lindqvist', 1),
  (7, 415, 'Ms. Batbayar',   2),
  (8, 108, 'Dr. Haddad',     1);
clues:
  - "`evidence.porter_log`: `entry_id`, `room`, `guest`, `bags`. One row per trolley trip."
task: |
  Return **one column, `room`**, listing each room the porter visited **once**, with no repeats.
starter: |
  SELECT room
  FROM evidence.porter_log;
check:
  mode: result
  solution: |
    SELECT DISTINCT room
    FROM evidence.porter_log;
hints:
  - "Run the starter. Eight rows, but look at the numbers: some rooms appear again and again."
  - "One keyword, placed straight after `SELECT`, removes duplicate rows from the result."
  - "`SELECT DISTINCT room FROM evidence.porter_log;`"
reveal: |
  Four rooms: **108, 204, 311 and 415**. Eight trips, but half of them went to room 204 or 311,
  and the guest book shows Mrs. Lindqvist really did check in with three suitcases.

  "He's not inventing trips," Bold says. "He's just a very nervous porter." Case closed, with an
  apology to the night shift.
