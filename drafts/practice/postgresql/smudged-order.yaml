difficulty: easy
topic: postgresql/beginner/01-syntax
concepts: [syntax, quoting, commas]
title: The Smudged Order
briefing: |
  A café's new till system was set up by the owner's nephew, who also wrote the one query
  they use to look up a customer's orders. It hasn't worked since the day he left.

  *You don't need `WHERE` from Module 3 to fix this. It filters rows; just fix the grammar.*
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.orders (
      order_id  INTEGER PRIMARY KEY,
      customer  TEXT NOT NULL,
      item      TEXT NOT NULL,
      qty       INTEGER NOT NULL
  );
  INSERT INTO evidence.orders VALUES
  (1, 'Nara',  'Milk tea',     2),
  (2, 'Bilguun', 'Espresso',   1),
  (3, 'Nara',  'Khuushuur',    4),
  (4, 'Oscar', 'Milk tea',     1),
  (5, 'Nara',  'Carrot cake',  1);
clues:
  - "`evidence.orders`: `order_id`, `customer`, `item`, `qty`."
  - Text values go in **single** quotes. Double quotes mean something else in SQL.
task: |
  Fix the query so it returns **three columns, `order_id`, `item`, `qty`**, for every order by
  the customer **Nara**. There is more than one mistake, and one of them doesn't cause an error.
starter: |
  SELEC order_id item, qty
  FROM evidence.orders
  WHERE customer = "Nara";
check:
  mode: result
  solution: |
    SELECT order_id, item, qty
    FROM evidence.orders
    WHERE customer = 'Nara';
hints:
  - "Run it and read the error. PostgreSQL points at the first word it doesn't understand."
  - "After fixing the keyword, look at the quotes around `Nara`. Double quotes mean *a column name*, so PostgreSQL looks for a column called Nara."
  - "Also check the column list: `order_id item` without a comma means *order_id, renamed to item*. You want `SELECT order_id, item, qty … WHERE customer = 'Nara';`"
reveal: |
  Three orders: two milk teas, four khuushuur and a slice of carrot cake. The quiet mistake was
  the missing comma: `order_id item` ran without an error, and simply **renamed** `order_id`
  to `item`. Those are the bugs to fear, the ones that don't complain.
