difficulty: easy
topic: postgresql/beginner/00-landscape
concepts: [psql meta-commands, schemas]
title: Table Talk
briefing: |
  A regional bus company gave the agency a copy of its database and a sticky note:
  *"Everything important is in the evidence schema."* Nobody knows what's in there.

  Before asking the data anything, a good detective finds out **what tables exist**.
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.routes  (route_id INTEGER PRIMARY KEY, name TEXT NOT NULL);
  CREATE TABLE evidence.tickets (ticket_no TEXT PRIMARY KEY, route_id INTEGER, sold_at TIMESTAMP);
  CREATE TABLE evidence.drivers (driver_id INTEGER PRIMARY KEY, full_name TEXT NOT NULL);
  CREATE TABLE evidence.depots  (depot_id INTEGER PRIMARY KEY, city TEXT NOT NULL);
clues:
  - "`\\dt` alone lists tables in the default `public` schema only."
  - "Meta-commands take a pattern, and `*` means *anything*."
task: |
  Your **last** command must **list every table in the `evidence` schema**, using a psql
  meta-command. Put each meta-command on its own line.
starter: |
  \dt
check:
  mode: result
  solution: |
    \dt evidence.*
hints:
  - "Run the starter. Those are Wanderly's tables in `public`, not the bus company's."
  - "`\\dt` accepts a pattern like `schema.table`, and `*` matches anything."
  - "`\\dt evidence.*`"
reveal: |
  Four tables: **depots, drivers, routes, tickets**. Now the agency knows where to look,
  and which questions it can ask. Every investigation starts with a map.
