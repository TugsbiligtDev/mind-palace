difficulty: easy
topic: postgresql/beginner/06-querying-one-table
concepts: [ORDER BY, LIMIT]
title: The Three Cheapest Rooms
briefing: |
  A budget traveler claims a booking site showed him "the three cheapest rooms in town",
  and none of them were the cheapest. The agency has the site's room list.
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.hotel_rooms (
      room_id       INTEGER PRIMARY KEY,
      hotel         TEXT NOT NULL,
      city          TEXT NOT NULL,
      nightly_rate  NUMERIC(6,2) NOT NULL
  );
  INSERT INTO evidence.hotel_rooms VALUES
  (1, 'Grand Steppe',     'Ulaanbaatar', 145.00),
  (2, 'Nomad Hostel',     'Ulaanbaatar',  18.50),
  (3, 'Blue Sky Hotel',   'Ulaanbaatar', 120.00),
  (4, 'Zaya Guesthouse',  'Ulaanbaatar',  32.00),
  (5, 'Tuul River Lodge', 'Ulaanbaatar',  64.00),
  (6, 'Khan Palace',      'Ulaanbaatar', 210.00),
  (7, 'Ger Camp Inn',     'Ulaanbaatar',  27.00);
clues:
  - "`evidence.hotel_rooms`: `room_id`, `hotel`, `city`, `nightly_rate`."
task: |
  Return **`hotel`, `nightly_rate`** for the **three cheapest** rooms, **cheapest first**.

  Order matters: the grader checks the rows *in order*.
starter: |
  SELECT hotel, nightly_rate
  FROM evidence.hotel_rooms
  ORDER BY nightly_rate DESC
  LIMIT 3;
check:
  mode: result
  ordered: true
  solution: |
    SELECT hotel, nightly_rate
    FROM evidence.hotel_rooms
    ORDER BY nightly_rate
    LIMIT 3;
hints:
  - "Run the starter and read the prices. Are those cheap?"
  - "`DESC` sorts largest first. Which direction do you want?"
  - "Remove `DESC` (or write `ASC`): `ORDER BY nightly_rate LIMIT 3`."
reveal: |
  **Nomad Hostel** (18.50), **Ger Camp Inn** (27.00), **Zaya Guesthouse** (32.00).

  The site had shown the Khan Palace, the Grand Steppe and the Blue Sky Hotel: the three
  *most expensive*. One missing word in a sort order, and a lot of disappointed backpackers.
