difficulty: easy
topic: postgresql/beginner/06-querying-one-table
concepts: [calculated columns, aliases]
title: Tip Jar Arithmetic
briefing: |
  Three walking-tour guides share an office and argue about who brings in the most money.
  The office only records how many guests went on each tour and the price per guest.
  Nobody has ever multiplied them.
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.tours (
      tour_id          INTEGER PRIMARY KEY,
      guide            TEXT NOT NULL,
      guests           INTEGER NOT NULL,
      price_per_guest  NUMERIC(6,2) NOT NULL
  );
  INSERT INTO evidence.tours VALUES
  (1, 'Saruul', 12, 15.00),
  (2, 'Dmitri',  4, 40.00),
  (3, 'Saruul',  9, 15.00),
  (4, 'Keiko',  20,  8.50),
  (5, 'Dmitri',  6, 40.00);
clues:
  - "`evidence.tours`: `tour_id`, `guide`, `guests`, `price_per_guest`."
task: |
  Return **every tour** with three columns: `tour_id`, `guide`, and **`revenue`**: the number of
  guests times the price per guest.
starter: |
  SELECT tour_id, guide, guests
  FROM evidence.tours;
check:
  mode: result
  solution: |
    SELECT tour_id, guide, guests * price_per_guest AS revenue
    FROM evidence.tours;
hints:
  - "The third column shouldn't be a stored column at all. It's a calculation."
  - "You can do arithmetic right in the SELECT list, with `*` for multiply, and name the result with `AS`."
  - "`guests * price_per_guest AS revenue`"
reveal: |
  | tour | guide | revenue |
  |---|---|---|
  | 1 | Saruul | 180.00 |
  | 2 | Dmitri | 160.00 |
  | 3 | Saruul | 135.00 |
  | 4 | Keiko | 170.00 |
  | 5 | Dmitri | 240.00 |

  Dmitri's single best tour earns the most, and Keiko's one big, cheap tour beats Dmitri's
  other one. Add each guide's tours together and it's Dmitri 400, Saruul 315, Keiko 170. (Adding
  up *per guide* is what `GROUP BY` does in Module 10.) The argument continues, but now with numbers.
