difficulty: hard
topic: postgresql/beginner/08-writing-data
concepts: [INSERT, ON CONFLICT, EXCLUDED]
title: The Delivery Van
briefing: |
  A gift shop's stock table is out of date, and a delivery van just unloaded three boxes. Two
  of the products are already in stock (**add** the new quantity to what's there); one is brand
  new (**insert** it).

  "One statement," Bold says. "If it half-works, we'll have counted some boxes twice."
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.stock (
      sku   TEXT PRIMARY KEY,
      item  TEXT NOT NULL,
      qty   INTEGER NOT NULL
  );
  INSERT INTO evidence.stock VALUES
  ('MUG-01', 'Horse mug',          14),
  ('HAT-02', 'Felt hat',            3),
  ('MAP-07', 'Steppe map',         25);
clues:
  - "`evidence.stock`: `sku` (unique), `item`, `qty`."
  - "In `ON CONFLICT … DO UPDATE`, `EXCLUDED.qty` is the quantity you *tried* to insert, and `stock.qty` is what's already there."
task: |
  With **one** `INSERT … ON CONFLICT` statement, record this delivery:

  | sku | item | qty |
  |---|---|---|
  | `HAT-02` | `Felt hat` | `10` |
  | `MUG-01` | `Horse mug` | `6` |
  | `BAG-03` | `Camel wool bag` | `8` |

  For products that already exist, **add** the delivered quantity to the current one.

  The grader checks the **state of the table** afterwards.
starter: |
  INSERT INTO evidence.stock (sku, item, qty) VALUES
  ('HAT-02', 'Felt hat', 10),
  ('MUG-01', 'Horse mug', 6),
  ('BAG-03', 'Camel wool bag', 8)
  ON CONFLICT (sku) DO UPDATE SET qty = EXCLUDED.qty;
check:
  mode: state
  solution: |
    INSERT INTO evidence.stock (sku, item, qty) VALUES
    ('HAT-02', 'Felt hat', 10),
    ('MUG-01', 'Horse mug', 6),
    ('BAG-03', 'Camel wool bag', 8)
    ON CONFLICT (sku) DO UPDATE SET qty = stock.qty + EXCLUDED.qty;
  state_query: |
    SELECT sku, item, qty
    FROM evidence.stock
    ORDER BY sku;
hints:
  - "Run the starter with a `SELECT` underneath. The felt hats went from 3 to 10. Where did the original 3 go?"
  - "`SET qty = EXCLUDED.qty` *replaces* the quantity. You want old plus new."
  - "`DO UPDATE SET qty = stock.qty + EXCLUDED.qty`"
reveal: |
  Felt hats **13**, horse mugs **20**, a brand-new row for **8** camel wool bags, and the maps
  untouched at 25.

  With `EXCLUDED.qty` alone, the shop would have "lost" 17 items on paper, and some poor
  shop assistant would have been blamed for it.
