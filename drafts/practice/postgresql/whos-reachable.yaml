difficulty: medium
topic: postgresql/beginner/09-functions
concepts: [COALESCE, "NULL"]
title: Who's Reachable?
briefing: |
  A tour company needs to warn every traveler about a road closure tomorrow. For each person
  they want **one** way to reach them: a phone number if there is one, otherwise an email.
evidence_setup: |
  CREATE SCHEMA evidence;
  CREATE TABLE evidence.contacts (
      contact_id  INTEGER PRIMARY KEY,
      name        TEXT NOT NULL,
      phone       TEXT,
      email       TEXT
  );
  INSERT INTO evidence.contacts VALUES
  (1, 'Delgermaa S.', '+976 9911 2233', 'delger@example.com'),
  (2, 'Hugo Blanc',   NULL,             'hugo@example.com'),
  (3, 'Ines Silva',   '+351 912 345 678', NULL),
  (4, 'Arjun Mehta',  NULL,             NULL),
  (5, 'Lena Vogel',   NULL,             'lena@example.com');
clues:
  - "`evidence.contacts`: `contact_id`, `name`, `phone` (may be NULL), `email` (may be NULL)."
task: |
  Return **`name`** and **`reach`**: the **phone** if there is one, otherwise the **email**,
  otherwise the text **`no contact`**.
starter: |
  SELECT name, phone AS reach
  FROM evidence.contacts;
check:
  mode: result
  solution: |
    SELECT name, COALESCE(phone, email, 'no contact') AS reach
    FROM evidence.contacts;
hints:
  - "The starter leaves three people with an empty `reach`. You need a fallback, and then a fallback for the fallback."
  - "One function returns the **first non-NULL** value from a list of any length."
  - "`COALESCE(phone, email, 'no contact') AS reach`"
reveal: |
  Four people can be reached. **Arjun Mehta** has no phone and no email on file.

  Moth drives out to his guesthouse with a hand-written note. Sometimes the best query result
  is the list of people the database *can't* help with.
