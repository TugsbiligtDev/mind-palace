<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>The book-club model as a crow's-foot diagram</title>
  <rect x="1" y="1" width="758" height="338" rx="12" fill="#ffffff" stroke="#e5e7eb"/>

  <g stroke="#1f2937" stroke-width="2" fill="none">
    <!-- hosts (40..180, 40..90) to clubs (580..720, 40..90): hosts || ... o< clubs -->
    <line x1="180" y1="65" x2="580" y2="65"/>
    <line x1="192" y1="55" x2="192" y2="75"/><line x1="200" y1="55" x2="200" y2="75"/>
    <circle cx="552" cy="65" r="6" fill="#ffffff"/>
    <line x1="564" y1="65" x2="580" y2="53"/><line x1="564" y1="65" x2="580" y2="77"/>

    <!-- hosts (bottom y=90) to languages (top y=250): hosts >o ... |< languages -->
    <line x1="110" y1="90" x2="110" y2="250"/>
    <line x1="110" y1="106" x2="98" y2="90"/><line x1="110" y1="106" x2="122" y2="90"/>
    <circle cx="110" cy="118" r="6" fill="#ffffff"/>
    <line x1="100" y1="226" x2="120" y2="226"/>
    <line x1="110" y1="234" x2="98" y2="250"/><line x1="110" y1="234" x2="122" y2="250"/>

    <!-- customers (300..440, 250..300) to memberships (580..720, 250..310): customers || ... o< memberships -->
    <line x1="440" y1="275" x2="580" y2="275"/>
    <line x1="452" y1="265" x2="452" y2="285"/><line x1="460" y1="265" x2="460" y2="285"/>
    <circle cx="552" cy="275" r="6" fill="#ffffff"/>
    <line x1="564" y1="275" x2="580" y2="263"/><line x1="564" y1="275" x2="580" y2="287"/>

    <!-- memberships (top y=250) to clubs (bottom y=90): memberships >o ... || clubs -->
    <line x1="650" y1="90" x2="650" y2="250"/>
    <line x1="640" y1="102" x2="660" y2="102"/><line x1="640" y1="110" x2="660" y2="110"/>
    <circle cx="650" cy="222" r="6" fill="#ffffff"/>
    <line x1="650" y1="234" x2="638" y2="250"/><line x1="650" y1="234" x2="662" y2="250"/>
  </g>

  <g fill="#eef2ff" stroke="#4f46e5" stroke-width="2">
    <rect x="40" y="40" width="140" height="50" rx="8"/>
    <rect x="580" y="40" width="140" height="50" rx="8"/>
    <rect x="40" y="250" width="140" height="50" rx="8"/>
    <rect x="300" y="250" width="140" height="50" rx="8"/>
    <rect x="580" y="250" width="140" height="60" rx="8"/>
  </g>
  <g fill="#111827" font-size="16" font-weight="600" text-anchor="middle">
    <text x="110" y="71">hosts</text>
    <text x="650" y="71">clubs</text>
    <text x="110" y="281">languages</text>
    <text x="370" y="281">customers</text>
    <text x="650" y="276">memberships</text>
  </g>
  <text x="650" y="298" fill="#4b5563" font-size="13" text-anchor="middle">copies</text>

  <g fill="#4b5563" font-size="13" font-style="italic">
    <text x="380" y="55" text-anchor="middle">leads</text>
    <text x="122" y="175">speaks</text>
    <text x="510" y="265" text-anchor="middle">joins</text>
    <text x="662" y="175">for</text>
  </g>
</svg>
