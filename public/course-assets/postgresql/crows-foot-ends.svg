<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>The four crow's-foot line ends</title>
  <rect x="1" y="1" width="598" height="248" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <!-- row 1: exactly one -->
    <line x1="40" y1="50" x2="300" y2="50"/>
    <line x1="280" y1="40" x2="280" y2="60"/><line x1="290" y1="40" x2="290" y2="60"/>
    <!-- row 2: zero or one -->
    <line x1="40" y1="105" x2="300" y2="105"/>
    <circle cx="272" cy="105" r="6" fill="#ffffff"/><line x1="290" y1="95" x2="290" y2="115"/>
    <!-- row 3: one or more -->
    <line x1="40" y1="160" x2="300" y2="160"/>
    <line x1="276" y1="150" x2="276" y2="170"/>
    <line x1="284" y1="160" x2="300" y2="148"/><line x1="284" y1="160" x2="300" y2="172"/>
    <!-- row 4: zero or more -->
    <line x1="40" y1="215" x2="300" y2="215"/>
    <circle cx="270" cy="215" r="6" fill="#ffffff"/>
    <line x1="284" y1="215" x2="300" y2="203"/><line x1="284" y1="215" x2="300" y2="227"/>
  </g>
  <g fill="#eef2ff" stroke="#4f46e5" stroke-width="2">
    <rect x="300" y="35" width="70" height="30" rx="6"/>
    <rect x="300" y="90" width="70" height="30" rx="6"/>
    <rect x="300" y="145" width="70" height="30" rx="6"/>
    <rect x="300" y="200" width="70" height="30" rx="6"/>
  </g>
  <g fill="#111827" font-size="14" text-anchor="middle">
    <text x="335" y="55">box</text><text x="335" y="110">box</text><text x="335" y="165">box</text><text x="335" y="220">box</text>
  </g>
  <g fill="#111827" font-size="15">
    <text x="390" y="55"><tspan font-weight="600">exactly one</tspan>  (two bars)</text>
    <text x="390" y="110"><tspan font-weight="600">zero or one</tspan>  (circle, bar)</text>
    <text x="390" y="165"><tspan font-weight="600">one or more</tspan>  (bar, foot)</text>
    <text x="390" y="220"><tspan font-weight="600">zero or more</tspan>  (circle, foot)</text>
  </g>
</svg>
